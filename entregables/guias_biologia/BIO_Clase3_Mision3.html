<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Biología · Clase 3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>[hidden]{display:none!important}
:root{
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --text:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --area:#30843C; --azul:#1F4E8C; --oro:#B0711A; --morado:#5B3E96; --verde:#2E7A39;
  --m1:#30843C; --m2:#1F4E8C; --m3:#3B3BA6; --m4:#5B3E96; --m5:#A82424; --m6:#4A5A70; --rojo:#A82424;
  --ink:#1B1F27; --muted:#5C6472; --faint:#A9B0BB; --line:#E3E7ED; --paper:#FFFFFF; --bg:#F6F4F1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:clamp(16px,1.25vw,21px);line-height:1.5}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
#top{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding:10px clamp(14px,2vw,28px);background:var(--paper);flex-wrap:wrap}
.logo img{height:clamp(28px,2.6vw,40px);display:block}
#mom{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
#momdot{width:clamp(30px,2.4vw,40px);height:clamp(30px,2.4vw,40px);border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;background:var(--faint)}
#momnom{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.2vw,20px)}
#momsub{color:var(--muted);font-size:.85em}
#clock{display:flex;align-items:center;gap:8px}
#tnum{font-family:var(--display);font-weight:800;font-size:clamp(20px,1.8vw,30px);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
#tnum.over{color:var(--area)}
.btn{appearance:none;font:inherit;font-size:.86em;font-weight:600;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.solid{background:var(--area);border-color:var(--area);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#stage{overflow:auto;padding:clamp(18px,3vw,48px) clamp(16px,4vw,72px)}
#wrap{max-width:1500px;margin:0 auto}
#wrap.enter{animation:ent .28s ease-out}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bot{display:flex;align-items:center;gap:12px;padding:10px clamp(14px,2vw,28px);background:var(--paper)}
#prog{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
#prog i{display:block;height:100%;background:var(--area);transition:width .25s}
#count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
#hint{color:var(--faint);font-size:.8em}
@media (max-width:760px){#hint{display:none}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.2vw,68px);line-height:1.05;margin:.2em 0 .25em;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,2.8vw,46px);line-height:1.1;margin:.25em 0 .3em;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:clamp(18px,1.5vw,26px);margin:.1em 0 .4em;line-height:1.2}
p{margin:.35em 0 .6em}
.lead{font-size:1.2em;line-height:1.45;max-width:70ch}
.sub{color:var(--muted)}
.mt{margin-top:clamp(14px,1.8vw,26px)}
.logo-xl img{height:clamp(54px,6vw,96px);margin-bottom:12px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tag,.min,.membrete{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.78em;font-weight:700;letter-spacing:.02em}
.tag{background:var(--ink);color:#fff}
.min{background:var(--accent,var(--area));color:#fff}
.membrete{border:1.5px solid var(--line);color:var(--muted)}
.kicker{color:var(--muted);font-size:.85em;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.grid{display:grid;gap:clamp(12px,1.4vw,22px)}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid>*{min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,1.6vw,24px)}
.card.edge{border-left:6px solid var(--accent,var(--area))}
.card.big .lead{font-size:1.3em}
.step{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px}
.step .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;flex:none}
.note{border-left:5px solid var(--accent,var(--area));background:var(--paper);border-radius:10px;padding:10px 16px;margin-top:12px}
.cita{font-family:var(--display);font-weight:600;line-height:1.35;background:var(--paper);border-left:6px solid var(--area);border-radius:12px;padding:clamp(16px,2vw,30px);margin:18px 0}
.cita.xl{font-size:clamp(24px,2.6vw,44px)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally .n{display:inline-block;min-width:1.6em;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.pasos{margin:.2em 0 0;padding-left:1.3em}.pasos li{margin:.3em 0}
.sello{margin-top:12px;border:2px dashed var(--oro);border-radius:12px;padding:10px 14px;background:#FDF6EA}
.sello b{display:block;color:var(--oro);font-size:.8em;letter-spacing:.06em;text-transform:uppercase}
.clave{margin-top:12px;display:flex;align-items:center;gap:10px;font-weight:600}
.keychip{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:10px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.2em}
.aviso{margin-top:10px;border-radius:10px;padding:10px 14px;background:#FBEFEF;border-left:5px solid var(--area);font-size:.92em}
.aviso.sev-aten{background:#EDF5EE;border-left-color:var(--verde)}
.aviso.sev-medi{background:#FDF5E7;border-left-color:var(--oro)}
.icfes .texto{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.6vw,24px);max-height:62vh;overflow:auto;font-size:.95em}
.enun{font-weight:600;font-size:1.08em}
.ops{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.op .L{flex:none;width:1.8em;height:1.8em;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-family:var(--display);font-weight:800}
.op.ok{border-color:var(--verde);background:#EDF5EE}.op.ok .L{background:var(--verde);color:#fff}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick[aria-pressed="true"]{background:var(--area);border-color:var(--area);color:#fff}
#scrim{position:fixed;inset:0;background:rgba(15,18,24,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#guia{position:fixed;top:0;right:0;height:100%;width:min(520px,92vw);background:var(--paper);box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column;z-index:10}
#guia.open{transform:none}
#guiahead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg)}
#guiabody{overflow:auto;padding:16px 20px 30px;font-size:.92em}
.gbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.gbox h4{margin:0 0 6px;font-family:var(--display);font-size:.8em;letter-spacing:.07em;text-transform:uppercase;color:var(--area)}
.gbox ul{margin:0;padding-left:1.1em}.gbox li{margin:.35em 0}
.gbox.como{background:#F6F7F9}.gbox.como h4{color:var(--muted)}
.gbox.apoyo{background:#FDF6EA;border-color:#EAD9B4}.gbox.apoyo h4{color:var(--oro)}
[hidden]{display:none!important}
.fig{margin:12px 0}.fig svg{display:block;width:100%;max-width:760px;height:auto}
.tabla{border-collapse:collapse;width:100%;table-layout:fixed;font-size:.9em}
.tabla th,.tabla td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;overflow-wrap:anywhere}
.tabla th{background:#F2F5F3;text-align:left}.figcap{font-size:.85em;font-style:italic}
.ops.cuatro{grid-template-columns:repeat(4,1fr)}.opsfig svg{max-width:580px}
.aviso{border-left-color:var(--rojo)}.aviso.sev-baja{background:#EEF3FA;border-left-color:var(--azul)}
</style>
</head>

untas de la prueba de campo, páginas 94 a 97<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m4)\"><h3>Tu cuaderno<\/h3><p class=\"sub\">Páginas 154 a 160<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m6)\"><h3>Hoy<\/h3><p class=\"sub\">120 minutos · 6 momentos · UC y EF · datos, redes y límites<\/p><\/div><\/div>", "guia": {"obj": "Que el grupo sepa desde el primer minuto qué va a pasar en estos 120 minutos y qué tiene que tener sobre la mesa.", "decir": ["«Libro abierto, cuaderno cerrado, lápiz. Hoy no les voy a preguntar qué saben de memoria: les voy a preguntar qué dato lo dice.»"], "apoyo": ["⚑ Antes del sábado: En las preguntas 2, 3, 4 y 5 la clave es la única opción razonable y las otras son disparates visibles: se aciertan por descarte. Exige el instrumento lleno antes de mirar las opciones; ahí está la ecología que esas preguntas no miden.", "Los cuatro conceptos que tienes que poder explicar hoy en dos minutos, sin jerga. Si un estudiante sabe más que tú de un tema, déjalo explicar y pide que señale en el texto o en la gráfica de dónde lo saca:", "Factor limitante: El recurso más escaso respecto a lo que el ser vivo necesita: manda sobre todos los demás. Si falta oxígeno en el agua, no importa cuánta comida haya: los peces sensibles no viven ahí.", "Red trófica y descomponedores: Quién se come a quién y quién depende de quién. Si sale un depredador, crecen sus presas y bajan las plantas que ellas comen. Los hongos y las bacterias devuelven al suelo la materia de todo lo que muere.", "Eutrofización: Cuando a un lago llegan demasiados nutrientes (abonos, aguas negras) crecen de más las algas; al morir, las bacterias que las descomponen gastan el oxígeno del agua y los peces mueren.", "Fijación de nitrógeno y suelo vivo: El aire tiene mucho nitrógeno, pero las plantas no lo pueden usar así: algunas bacterias del suelo lo convierten en compuestos que sí. Un suelo sano tiene muchos microorganismos distintos; esa diversidad es la que miden las preguntas 8 a 10.", "Abre esta guía con la tecla G en cada diapositiva: trae lo que dices y, debajo, lo que necesitas saber si Biología no es tu área.", "El cronómetro arranca con T y se reinicia solo cuando cambia el momento de la clase."]}}, {"m": null, "html": "<div class=\"eyebrow\"><span class=\"kicker\">Así vamos a trabajar<\/span><\/div><h2>Seis momentos, una sola regla<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:var(--m1)\"><div class=\"k\">1<\/div><div><b>Activación<\/b><span class=\"sub\"> · 15 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m2)\"><div class=\"k\">2<\/div><div><b>Pregunta problematizadora<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m3)\"><div class=\"k\">3<\/div><div><b>Desarrollo guiado<\/b><span class=\"sub\"> · 35 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m4)\"><div class=\"k\">4<\/div><div><b>Reto en equipo<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m5)\"><div class=\"k\">5<\/div><div><b>Evaluación individual<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m6)\"><div class=\"k\">6<\/div><div><b>Cierre<\/b><span class=\"sub\"> · 10 min<\/span><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--area)\"><h3>La regla del cuaderno<\/h3><p class=\"lead\">Si el instrumento está vacío, no lo resolviste: lo adivinaste.<\/p><p>Primero se escribe el instrumento —qué cambió, qué se midió, contra qué se compara—, después se marca la opción. Una respuesta correcta con el instrumento en blanco no cuenta como resuelta.<\/p><\/div><\/div>", "guia": {"obj": "Que la regla quede dicha en voz alta antes de cualquier texto.", "decir": ["«La respuesta correcta con el instrumento vacío no cuenta. ¿Por qué? Porque en Biología casi todas las opciones suenan científicas: el que no escribió el dato escoge la que suena mejor, no la que dice el texto o la gráfica.»"], "apoyo": ["Si alguien pregunta para qué escribir, la respuesta corta es: lo que separa la opción correcta de las que suenan bien está en un número, una flecha o una palabra del texto, y eso se pierde si no se escribe.", "Si alguien dice «eso es por las hormonas» o «eso es genético», devuélvele la pregunta: «¿qué dato te lo dice?»."]}}, {"m": 0, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Activación<\/span><span class=\"kicker\">Cuaderno cerrado<\/span><\/div><h2>¿Qué cambió, qué se midió y contra qué se compara?<\/h2><blockquote class=\"cita xl\">Se sembró fríjol en dos materas iguales: una quedó en el patio y la otra en un clóset. A la semana, la del clóset estaba más alta, pero amarilla.<\/blockquote><p class=\"lead\">Tres respuestas antes de cualquier explicación. Todavía no se abre el cuaderno.<\/p><div class=\"ctl\"><button class=\"btn\" data-show=\"pista3\">Mostrar la pista<\/button><\/div><div class=\"note\" id=\"pista3\" hidden style=\"--accent:var(--m1)\"><b>Pista:<\/b> cambió la luz; se midió la altura y el color; se compara la matera del patio con la del clóset<\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno corto con tres preguntas —qué cambió, qué se midió y contra qué se compara— antes de explicarlo y antes de ver cualquier opción.", "decir": ["Proyecta o lee una observación de dos o tres renglones sin decir de dónde salió.", "Pide tres respuestas, en voz alta o en el tablero: qué cambió, qué se midió y contra qué se compara.", "Ejecuta la dinámica de apertura según la estrategia del encuentro."], "como": "No explica el fenómeno ni acepta todavía explicaciones. Si alguien dice «es por las hormonas», le devuelve la pregunta: «¿qué dato te lo dice?». El cuaderno sigue cerrado.", "apoyo": ["No expliques el fenómeno ni aceptes todavía explicaciones: primero las tres respuestas. La observación es inventada para la clase: no sale del libro.", "La pista existe para el cierre de los 15 minutos, no para el principio: cambió la luz; se midió la altura y el color; se compara la matera del patio con la del clóset."]}}, {"m": 0, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#242478\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 1 · Los datos hablan primero<\/span><\/div><h2>Arriba o abajo del control<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Una línea de cinta en el piso es el control: el cero de la comparación.<\/li><li>Tres estudiantes son tres cosas medidas en un cultivo: ORGANISMOS DEL SUELO, LOMBRICES y HONGOS.<\/li><li>El docente lee dos datos inventados por variable —el tratamiento y el control—; cada uno da un paso adelante si el tratamiento quedó arriba, atrás si quedó abajo, y se queda si es igual.<\/li><li>Solo después el grupo dice la conclusión, y tiene que nombrar a los tres, no solo al que más avanzó.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cinta · los datos en el tablero<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno corto con tres preguntas —qué cambió, qué se midió y contra qué se compara— antes de explicarlo y antes de ver cualquier opción.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto o la gráfica en cinco minutos —seguir, comparar o ubicar—, pero con el cuerpo.»"], "como": "No explica el fenómeno ni acepta todavía explicaciones. Si alguien dice «es por las hormonas», le devuelve la pregunta: «¿qué dato te lo dice?». El cuaderno sigue cerrado.", "apoyo": ["Qué movimiento mental entrena: Leer cada dato contra el control, fila por fila, antes de escoger una conclusión. Es el movimiento de las preguntas 8 y 9, y de la tercera del entrenamiento (la raya de los 2.100 kcal/kg).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 1, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m2)\">Pregunta problematizadora<\/span><span class=\"kicker\">Libro abierto en la pregunta modelo<\/span><\/div><h2>Abran el libro en la pregunta 1, página 94<\/h2><p class=\"lead\">Antes de releer el texto o la gráfica: ¿cuál creen que es? Levanten la mano.<\/p><div class=\"ctl\"><button class=\"btn tally\" data-tally=\"h3A\">A <span class=\"n\" id=\"h3A\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h3B\">B <span class=\"n\" id=\"h3B\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h3C\">C <span class=\"n\" id=\"h3C\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h3D\">D <span class=\"n\" id=\"h3D\">0<\/span><\/button><button class=\"btn\" data-reset=\"h3\">↺<\/button><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta que gobierna el área<\/h3><p class=\"lead\">¿Qué dato —del texto, la tabla o la gráfica— respalda eso?<\/p><p class=\"sub\">Nadie justifica con «yo sé que» ni con lo que vio en internet: toda respuesta señala un renglón del texto, un número de la tabla o un punto de la gráfica.<\/p><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta de este momento<\/h3><p class=\"lead\">Si cambia esta pieza, ¿quién más en el ecosistema lo siente?<\/p><\/div>", "guia": {"obj": "Que el estudiante compruebe que en Biología la respuesta sale del dato —del texto, la tabla o la gráfica— y no de lo que suena científico, usando la pregunta modelo del libro.", "decir": ["Presenta la pregunta modelo del libro y la deja a la vista todo el momento.", "Pide respuestas a mano alzada ANTES de releer el texto o la gráfica, y las anota en el tablero.", "Hace la pregunta que gobierna el área: ¿qué dato, del texto, la tabla o la gráfica, respalda eso?", "Revela la clave solo al final y trabaja por qué cae cada una de las otras tres."], "como": "Regla del momento: nadie justifica con «yo sé que» ni con lo que vio en internet. Toda intervención señala un renglón del texto, un número de la tabla o un punto de la gráfica.", "apoyo": ["La pregunta modelo es la 1 del libro (página 94). El cuaderno se abre en la página 154 solo en «mi primera idea».", "Cuenta las manos tocando cada letra: el número queda en pantalla y sirve para el final del momento, cuando el grupo vea cuántos cambiaron de opinión al volver al texto o a la gráfica.", "No digas la clave en este momento: sale en el bloque de las preguntas 1 y 2, después de llenar el instrumento en pantalla, casilla por casilla. Ahí se trabaja por qué cae cada una de las otras tres."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 1 y 2<\/span><span class=\"kicker\">En pantalla, casilla por casilla<\/span><\/div><h2>Preguntas 1 y 2: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 1<\/span><span class=\"min\" style=\"--accent:#A82424\">E3 · Busca el factor que limita<\/span><\/div><p class=\"sub\">Calefacción del suelo · por qué baja la biomasa de la zona B<\/p><h3 style=\"color:#A82424\">Dos zonas en la misma gráfica<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k31\"><span class=\"keychip\" style=\"background:#A82424\">C<\/span> es la clave del libro<\/div><div class=\"aviso sev-aten\" hidden data-grupo=\"k31\"><b>Ojo con esta clave:<\/b> La opción B dice que descomponer más «disminuye la producción primaria». Es falso: descomponer libera nutrientes para las plantas.<\/div><\/div><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 2<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E2 · Sigue la red: quién depende de quién<\/span><\/div><p class=\"sub\">Restauración del humedal · por qué volvieron las aves<\/p><h3 style=\"color:#5B3E96\">Lo que un ave necesita para volver<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k31\"><span class=\"keychip\" style=\"background:#5B3E96\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k31\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué dato escribieron en el instrumento? Léanmelo.»", "Si alguien se traba, pregúntale qué cambió y contra qué lo compara. Si el instrumento está vacío, vuelve al texto o a la gráfica antes que a las opciones."], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Las claves del libro son 1·C y 2·A. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 1 · aviso del libro (baja), solo para ti, no se proyecta: La tabla de biomasa no dice en qué unidades está ni qué se midió exactamente. Qué haces: Se resuelve por la tendencia. Un dato sin unidades no se compara con otro estudio: dilo.", "Pregunta 1 · aviso del libro (atención): La opción B dice que descomponer más «disminuye la producción primaria». Es falso: descomponer libera nutrientes para las plantas. Qué haces: Dilo para que el distractor no se quede como dato.", "Pregunta 2 · aviso del libro (atención), solo para ti, no se proyecta: La clave es la única opción razonable; las otras son disparates visibles (sensores que «atraen» aves, el jaguar compitiendo por el pasto). Qué haces: Exige el instrumento lleno antes de las opciones: ahí está la ecología."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 3 y 4<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 3 y 4: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 3<\/span><span class=\"min\" style=\"--accent:#C9821B\">E4 · Del saber ecológico a la decisión<\/span><\/div><p class=\"sub\">Restauración del humedal · aplicar el conocimiento ecológico<\/p><h3 style=\"color:#C9821B\">Ida y vuelta entre la planta y el animal<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k33\"><span class=\"keychip\" style=\"background:#C9821B\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 4<\/span><span class=\"min\" style=\"--accent:#A82424\">E3 · Busca el factor que limita<\/span><\/div><p class=\"sub\">Restauración del humedal · la zona con poco oxígeno<\/p><h3 style=\"color:#A82424\">El barril del humedal: la duela más corta manda<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k33\"><span class=\"keychip\" style=\"background:#A82424\">C<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k33\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué dato escribieron en el instrumento? Léanmelo.»", "Si alguien se traba, pregúntale qué cambió y contra qué lo compara. Si el instrumento está vacío, vuelve al texto o a la gráfica antes que a las opciones."], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Las claves del libro son 3·B y 4·C. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 3 · aviso del libro (atención), solo para ti, no se proyecta: La clave es la única opción razonable; las otras son disparates visibles (sensores que «atraen» aves, el jaguar compitiendo por el pasto). Qué haces: Exige el instrumento lleno antes de las opciones: ahí está la ecología."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#5B3E96\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 2 · Sigue la red: quién depende de quién<\/span><\/div><h2>La red de lana<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Siete estudiantes son seres de un estanque: ALGA, PLANTA ACUÁTICA, RENACUAJO, LIBÉLULA, PEZ, GARZA y BACTERIA.<\/li><li>Con un ovillo de lana, el docente une a cada uno con el que se lo come o del que depende.<\/li><li>El docente saca al PEZ: suelta la lana y se sienta.<\/li><li>Cada uno que siente que su hilo se aflojó dice qué le pasa y a quién le pasa algo después; la BACTERIA cierra diciendo qué recibe de todos los que mueren.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Un ovillo de lana · siete tarjetas<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto o la gráfica en cinco minutos —seguir, comparar o ubicar—, pero con el cuerpo.»"], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Seguir una perturbación hilo por hilo hasta quien no estaba conectado directamente, y cerrar el ciclo con los descomponedores. Es el movimiento de las preguntas 2, 5 y 6, y de la segunda del entrenamiento (las moléculas de un ser vivo que muere).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 5 y 6<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 5 y 6: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 5<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E2 · Sigue la red: quién depende de quién<\/span><\/div><p class=\"sub\">Sabana del Casanare · se van los jaguares<\/p><h3 style=\"color:#5B3E96\">Saca al jaguar y mira qué se mueve<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k35\"><span class=\"keychip\" style=\"background:#5B3E96\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 6<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E2 · Sigue la red: quién depende de quién<\/span><\/div><p class=\"sub\">Sabana del Casanare · vuelven los jaguares, el pasto no<\/p><h3 style=\"color:#5B3E96\">Tres fotos de la sabana: antes, sin jaguar y al volver<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k35\"><span class=\"keychip\" style=\"background:#5B3E96\">D<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k35\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué dato escribieron en el instrumento? Léanmelo.»", "Si alguien se traba, pregúntale qué cambió y contra qué lo compara. Si el instrumento está vacío, vuelve al texto o a la gráfica antes que a las opciones."], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Las claves del libro son 5·B y 6·D. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 5 · aviso del libro (atención), solo para ti, no se proyecta: La clave es la única opción razonable; las otras son disparates visibles (sensores que «atraen» aves, el jaguar compitiendo por el pasto). Qué haces: Exige el instrumento lleno antes de las opciones: ahí está la ecología."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#A82424\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 3 · Busca el factor que limita<\/span><\/div><h2>La duela más corta<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Cinco estudiantes son lo que una planta necesita: LUZ, AGUA, NUTRIENTES, OXÍGENO y TEMPERATURA.<\/li><li>El docente dice cuánto hay de cada uno, y cada factor levanta los brazos a esa altura.<\/li><li>Un sexto estudiante, el CRECIMIENTO, solo puede subir los brazos hasta la altura del factor más bajo.<\/li><li>El docente sube a tope todos menos uno: el grupo comprueba que el crecimiento no cambia y nombra el factor que limita.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Ninguno<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto o la gráfica en cinco minutos —seguir, comparar o ubicar—, pero con el cuerpo.»"], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Buscar el único factor que falta y que manda sobre todo lo demás, aunque lo otro sobre. Es el movimiento de las preguntas 1 y 4, y de la primera del entrenamiento (el oxígeno de un lago).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 7 y 8<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 7 y 8: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 7<\/span><span class=\"min\" style=\"--accent:#C9821B\">E4 · Del saber ecológico a la decisión<\/span><\/div><p class=\"sub\">Jornada de reciclaje · qué hacer con las pilas usadas<\/p><h3 style=\"color:#C9821B\">El viaje de una pila después de la caneca<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Lo que lleva una pila por dentro<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k37\"><span class=\"keychip\" style=\"background:#C9821B\">C<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 8<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Los datos hablan primero<\/span><\/div><p class=\"sub\">Fertilizantes en el tomate · lo que pasó en la parcela B<\/p><h3 style=\"color:#242478\">El control es el cero: barras hacia arriba o hacia abajo<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k37\"><span class=\"keychip\" style=\"background:#242478\">D<\/span> es la clave del libro<\/div><div class=\"aviso sev-baja\" hidden data-grupo=\"k37\"><b>Ojo con esta clave:<\/b> En Colombia el decimal se escribe con coma: 2,8 millones, no «2.8 millones».<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k37\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué dato escribieron en el instrumento? Léanmelo.»", "Si alguien se traba, pregúntale qué cambió y contra qué lo compara. Si el instrumento está vacío, vuelve al texto o a la gráfica antes que a las opciones."], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Las claves del libro son 7·C y 8·D. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 7 · Lo que lleva una pila por dentro: Una pila produce electricidad con una reacción química entre metales y otras sustancias (zinc, manganeso y, en algunas, mercurio, cadmio o litio). «Descargada» quiere decir que la reacción se agotó, no que quedó vacía: los metales siguen adentro y salen si se rompe. Para destrabar: «¿Se le acabó la energía o se le acabó lo que tiene adentro?»", "Pregunta 8 · aviso del libro (baja): En Colombia el decimal se escribe con coma: 2,8 millones, no «2.8 millones». Qué haces: Escríbelo bien en el tablero: 2,8 millones."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#C9821B\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 4 · Del saber ecológico a la decisión<\/span><\/div><h2>Cuatro rincones, un dato<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Cuatro rincones son cuatro decisiones para el aceite usado de la cocina del colegio: SIFÓN CON JABÓN, CANECA DE BASURA, ENTERRARLO y BOTELLA AL PUNTO DE RECOLECCIÓN.<\/li><li>El docente lee un dato: «una capa delgada de aceite sobre el agua no deja pasar el oxígeno del aire».<\/li><li>Cada estudiante camina al rincón de la decisión que usa ese dato.<\/li><li>Para quedarse, dice el «porque» de su rincón con el dato, y algo que se podría comprobar.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cuatro letreros<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto o la gráfica en cinco minutos —seguir, comparar o ubicar—, pero con el cuerpo.»"], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Escoger la decisión que se apoya en un dato ecológico comprobable, no la que suena responsable. Es el movimiento de las preguntas 3, 7 y 10, y de la cuarta del entrenamiento (el tanque poco profundo).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 9 y 10<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 9 y 10: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 9<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Los datos hablan primero<\/span><\/div><p class=\"sub\">Fertilizantes en el tomate · cuál es sostenible<\/p><h3 style=\"color:#242478\">El podio de las parcelas<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k39\"><span class=\"keychip\" style=\"background:#242478\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 10<\/span><span class=\"min\" style=\"--accent:#C9821B\">E4 · Del saber ecológico a la decisión<\/span><\/div><p class=\"sub\">Fertilizantes en el tomate · cómo seguir el estudio<\/p><h3 style=\"color:#C9821B\">La pregunta del estudio, palabra por palabra<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k39\"><span class=\"keychip\" style=\"background:#C9821B\">D<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k39\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué dato escribieron en el instrumento? Léanmelo.»", "Si alguien se traba, pregúntale qué cambió y contra qué lo compara. Si el instrumento está vacío, vuelve al texto o a la gráfica antes que a las opciones."], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Las claves del libro son 9·B y 10·D. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque."]}}, {"m": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m4)\">Reto en equipo · 20 min<\/span><span class=\"kicker\">Equipos de tres · cada uno responde en su cuaderno<\/span><\/div><h2>Reto del corte: La quebrada del colegio<\/h2><div class=\"card big edge mt\" style=\"--accent:var(--m4)\"><p class=\"lead\">Cada equipo recibe la tabla de una quebrada en tres tramos: antes del pueblo (oxígeno disuelto 8 mg/L, 14 especies de insectos acuáticos, pocas algas), junto al desagüe (3 mg/L, 4 especies, muchas algas) y dos kilómetros abajo (6 mg/L, 9 especies, algas moderadas). En doce minutos comparan cada tramo contra el de antes del pueblo, nombran el factor que limita la vida junto al desagüe, dibujan dos eslabones de quién depende de quién y proponen una decisión con el dato que la respalda. Cada integrante defiende una de las cuatro partes.<\/p><\/div><div class=\"note mt\" style=\"--accent:var(--m4)\"><b>La defensa:<\/b> tres minutos por equipo, señalando el dato, el grupo de comparación o el eslabón que los respalda. «Es que así funciona» no cuenta.<\/div>", "guia": {"obj": "Que el estudiante defienda su explicación con el dato en la mano y acepte que otro equipo puede ver una variable o un eslabón que él no vio.", "decir": ["Arma equipos de tres y entrega el reto del corte de este momento.", "Exige que cada integrante llegue con su instrumento YA diligenciado individualmente.", "Da tres minutos de defensa por equipo: señalan el dato, la comparación o el eslabón que los respalda.", "Cierra mostrando qué variable o qué eslabón quedó por fuera en cada propuesta."], "como": "El equipo discute, pero cada uno escribe en SU tarjeta del reto. No se acepta una defensa que diga «es que así funciona»: se nombra el dato, el grupo de comparación o el paso del proceso.", "apoyo": ["El reto no tiene una sola respuesta correcta: gana el equipo que mejor sostiene la suya con datos. Si dos explicaciones están sostenidas, dilo: eso también es hacer ciencia.", "Si un equipo entrega una sola hoja para los tres, el reto no cuenta. La discusión es compartida; el registro es individual.", "Cierra mostrando qué variable o qué eslabón quedó por fuera en cada propuesta."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 1<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Un lago con demasiados nutrientes<\/h3><p>Un ecosistema eutrofizado se caracteriza por una abundancia anormalmente alta de nutrientes. El esquema muestra la eutrofización de un cuerpo de agua.<\/p><figure class=\"fig\"><svg viewBox=\"0 0 720 284\" role=\"img\" aria-label=\"Esquema de la eutrofización y sus consecuencias\" style=\"font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif\"><rect x=\"15\" y=\"6\" width=\"210\" height=\"52\" rx=\"10\" fill=\"white\" stroke=\"#5C6472\" stroke-width=\"1.6\"/><text x=\"120\" y=\"28\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\">Crecimiento de bacterias<\/text><text x=\"120\" y=\"46\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\">fotosintéticas<\/text><line x1=\"120\" y1=\"58\" x2=\"120\" y2=\"76\" stroke=\"#5C6472\" stroke-width=\"1.6\"/><rect x=\"255\" y=\"6\" width=\"210\" height=\"52\" rx=\"10\" fill=\"white\" stroke=\"#5C6472\" stroke-width=\"1.6\"/><text x=\"360\" y=\"37\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\">Toxicidad algal<\/text><line x1=\"360\" y1=\"58\" x2=\"360\" y2=\"76\" stroke=\"#5C6472\" stroke-width=\"1.6\"/><rect x=\"495\" y=\"6\" width=\"210\" height=\"52\" rx=\"10\" fill=\"white\" stroke=\"#5C6472\" stroke-width=\"1.6\"/><text x=\"600\" y=\"37\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\">Riesgos sanitarios<\/text><line x1=\"600\" y1=\"58\" x2=\"600\" y2=\"76\" stroke=\"#5C6472\" stroke-width=\"1.6\"/><line x1=\"120\" y1=\"76\" x2=\"600\" y2=\"76\" stroke=\"#5C6472\" stroke-width=\"1.6\"/><line x1=\"360\" y1=\"76\" x2=\"360\" y2=\"92\" stroke=\"#5C6472\" stroke-width=\"1.6\"/><rect x=\"250\" y=\"92\" width=\"220\" height=\"40\" rx=\"10\" fill=\"white\" stroke=\"#5C6472\" stroke-width=\"1.6\"/><text x=\"360\" y=\"117\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">Eutrofización<\/text><line x1=\"360\" y1=\"132\" x2=\"360\" y2=\"148\" stroke=\"#5C6472\" stroke-width=\"1.6\"/><line x1=\"180\" y1=\"148\" x2=\"540\" y2=\"148\" stroke=\"#5C6472\" stroke-width=\"1.6\"/><line x1=\"180\" y1=\"148\" x2=\"180\" y2=\"162\" stroke=\"#5C6472\" stroke-width=\"1.6\"/><rect x=\"40\" y=\"162\" width=\"280\" height=\"56\" rx=\"10\" fill=\"white\" stroke=\"#5C6472\" stroke-width=\"1.6\"/><text x=\"180\" y=\"186\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\">Sustracción del oxígeno disuelto<\/text><text x=\"180\" y=\"204\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\">para tomar fosfatos y nitratos<\/text><line x1=\"180\" y1=\"218\" x2=\"180\" y2=\"234\" stroke=\"#5C6472\" stroke-width=\"1.6\"/><rect x=\"65\" y=\"234\" width=\"230\" height=\"40\" rx=\"10\" fill=\"white\" stroke=\"#5C6472\" stroke-width=\"1.6\"/><text x=\"180\" y=\"259\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\">Mortalidad de peces<\/text><line x1=\"540\" y1=\"148\" x2=\"540\" y2=\"162\" stroke=\"#5C6472\" stroke-width=\"1.6\"/><rect x=\"400\" y=\"162\" width=\"280\" height=\"56\" rx=\"10\" fill=\"white\" stroke=\"#5C6472\" stroke-width=\"1.6\"/><text x=\"540\" y=\"186\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\">Pérdida de la calidad<\/text><text x=\"540\" y=\"204\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\">del agua<\/text><line x1=\"540\" y1=\"218\" x2=\"540\" y2=\"234\" stroke=\"#5C6472\" stroke-width=\"1.6\"/><rect x=\"425\" y=\"234\" width=\"230\" height=\"40\" rx=\"10\" fill=\"white\" stroke=\"#5C6472\" stroke-width=\"1.6\"/><text x=\"540\" y=\"259\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\">Olor y sabor desagradable<\/text><\/svg><\/figure><\/div><div><p class=\"enun\">Con base en este esquema, se puede afirmar que una de las consecuencias de la eutrofización en un lago es<\/p><div class=\"ops\" id=\"icf31\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>el aumento de la competencia por el alimento entre las especies del lago, porque desaparecen los productores.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>la reducción del espacio en el lago para el desplazamiento, porque los nutrientes ocupan todo el lago.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>la reducción del oxígeno disuelto para el metabolismo de los peces, porque este es consumido por microorganismos del lago.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>la reducción de la tasa fotosintética de las algas, porque hay menos peces herbívoros en el lago.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf31\" data-k=\"C\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué dato lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la C.", "Por qué es la C: el esquema une la eutrofización con la pérdida del oxígeno disuelto y la mortalidad de peces. Ese oxígeno lo gastan los microorganismos que descomponen la materia orgánica (C). A dice que desaparecen los productores, cuando crecen de más; B dice que los nutrientes ocupan el espacio; D culpa a los peces herbívoros.", "El esquema de la pregunta dice «sustracción del oxígeno disuelto para tomar fosfatos y nitratos»: la explicación química es imprecisa, porque el oxígeno lo gasta la descomposición. La clave C sí lo dice bien: corrígelo en voz alta.", "El oxígeno es el factor que limita: con todo lo demás de sobra, falta ese y los peces mueren.", "La C es la opción más larga, como en el cuadernillo. No enseñes ese truco.", "Aviso (atención), solo para ti: El esquema de la pregunta dice «sustracción del oxígeno disuelto para tomar fosfatos y nitratos»: el oxígeno lo gasta la descomposición. La clave C sí lo dice bien. Qué haces: Corrige el esquema en voz alta al socializar."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 2<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Un ser vivo que muere sin ser comido<\/h3><p>En la nutrición, los elementos biogeoquímicos se integran a los organismos y forman moléculas orgánicas necesarias para la supervivencia.<\/p><\/div><div><p class=\"enun\">¿Qué sucede con las moléculas orgánicas de un ser vivo que muere por causas distintas de la depredación?<\/p><div class=\"ops\" id=\"icf32\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>Siguen como moléculas porque no pueden descomponerse.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>Salen del ecosistema porque deben ingresar nuevos elementos al medio.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>Se acumulan porque ya no pueden usarlas otros organismos.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Se descomponen porque sirven de alimento a microorganismos.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf32\" data-k=\"D\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué dato lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la D.", "Por qué es la D: si nadie se lo come, se lo comen los descomponedores: hongos y bacterias usan esas moléculas como alimento y devuelven los elementos al suelo y al aire (D). A dice que no se descomponen; B, que salen del ecosistema; C, que nadie las puede usar.", "La red no termina en el depredador: termina en los descomponedores, que cierran el ciclo de la materia."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 3<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Una planta de energía junto al mar<\/h3><p>Actualmente está investigándose la manera de aprovechar materias primas renovables para producir energía, con el objetivo de sustituir las materias primas convencionales. En la siguiente tabla se comparan varias fuentes de energía.<\/p><figure class=\"fig\"><table class=\"tabla\"><thead><tr><th>Fuente<\/th><th>Tipo de energía<\/th><th>Composición<\/th><th>Poder calorífico (kcal/kg)<\/th><\/tr><\/thead><tbody><tr><td>Agua de mar (agua salada)<\/td><td>Osmótica<\/td><td>Sales inorgánicas (NaCl, KCl…) y H₂O<\/td><td>2.000<\/td><\/tr><tr><td>Aire<\/td><td>Eólica<\/td><td>N₂, O₂, Ar, CO₂, Ne, He, H₂O<\/td><td>1.000<\/td><\/tr><tr><td>Materia orgánica en descomposición<\/td><td>Química<\/td><td>Materia orgánica y microorganismos<\/td><td>2.500<\/td><\/tr><tr><td>Petróleo<\/td><td>Química<\/td><td>Combinación de hidrocarburos (alcanos, alquenos, alquinos…)<\/td><td>10.000<\/td><\/tr><tr><td>Gas natural<\/td><td>Química<\/td><td>Propano (C₃H₈)<\/td><td>9.300<\/td><\/tr><\/tbody><\/table><\/figure><\/div><div><p class=\"enun\">Si los habitantes de una zona agrícola cercana al mar desean instalar una planta de energía que produzca más de 2.100 kcal/kg y que aproveche los recursos de la zona, la mejor estrategia es<\/p><div class=\"ops\" id=\"icf33\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>aprovechar la materia orgánica en descomposición que se produce de los residuos agrícolas.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>extraer petróleo de pozos petroleros alejados y transportarlo hasta la zona agrícola para producir grandes cantidades de energía.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>usar los distintos componentes del aire y transformarlos en energía mediante una reacción química.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>emplear un recurso renovable como el agua de mar para transformarlo en energía osmótica.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf33\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué dato lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la A.", "Por qué es la A: dos condiciones. Más de 2.100 kcal/kg: pasan la materia orgánica (2.500), el petróleo (10.000) y el gas (9.300); no pasan el agua de mar (2.000) ni el aire (1.000). Recursos de la zona: una zona agrícola tiene residuos orgánicos, no pozos de petróleo. Solo la materia orgánica cumple las dos (A).", "Que tracen la raya de los 2.100 en la tabla antes de leer las opciones.", "La tabla dice «Gas natural · Propano (C3H8)»: el gas natural es sobre todo metano; el propano es el gas de cilindro. No afecta la clave.", "Aviso (atención), solo para ti: La tabla pone «Gas natural · Propano»: el gas natural es sobre todo metano. Qué haces: No afecta la clave A."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 4<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Un tanque poco profundo<\/h3><p>Una planta de purificación de agua para cultivos de hortalizas va a instalarse en una vereda. En la planta ocurren tres procesos:<\/p><p>I. Un sistema de bombeo transporta el agua desde una quebrada cercana hasta un tanque de recolección, donde se regula su caudal.<\/p><p>II. El agua se dirige hacia una torre de aireación donde se oxigena.<\/p><p>III. El agua se pasa a un tanque poco profundo donde la luz solar, particularmente la luz ultravioleta, elimina una parte de las bacterias presentes.<\/p><\/div><div><p class=\"enun\">¿Por qué el proceso III debe realizarse en un tanque poco profundo?<\/p><div class=\"ops\" id=\"icf34\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>Porque permite que haya menor caudal de agua.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>Porque se forman menos grumos de material sólido.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>Porque el agua adquiere menor densidad.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Porque hay mayor exposición del agua a la luz.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf34\" data-k=\"D\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué dato lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la D.", "Por qué es la D: el proceso III usa la luz ultravioleta para eliminar bacterias. La luz se debilita a medida que entra en el agua: en un tanque poco profundo llega a toda el agua (D). A habla del caudal, que ya se reguló en el proceso I; B (grumos) y C (densidad) no tienen que ver con la luz.", "Del saber a la decisión: la profundidad del tanque se decide por un dato —hasta dónde llega la luz—, y ese dato se puede comprobar. ---"]}}, {"m": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m6)\">Cierre<\/span><span class=\"kicker\">La pregunta de siempre<\/span><\/div><h2>¿En qué se parecía la pregunta Saber 11 a la de tu libro?<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:#242478\"><div class=\"k\">1<\/div><div><b>Los datos hablan primero<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#5B3E96\"><div class=\"k\">2<\/div><div><b>Sigue la red: quién depende de quién<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#A82424\"><div class=\"k\">3<\/div><div><b>Busca el factor que limita<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#C9821B\"><div class=\"k\">4<\/div><div><b>Del saber ecológico a la decisión<\/b><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--m6)\"><h3>Antes de salir<\/h3><ol class=\"pasos\"><li>El concepto del día —un proceso, una estructura o una relación—, en «Palabras que me frenaron», con tus palabras.<\/li><li>«Lo que me llevo de esta pregunta».<\/li><li>Tu carita de salida.<\/li><li>La casilla 3 de la portada del área.<\/li><\/ol><\/div><\/div>", "guia": {"obj": "Que el estudiante nombre la estrategia que usó y se lleve un concepto del día —un proceso, una estructura o una relación— escrito en sus propias palabras.", "decir": ["Socializa solo las preguntas que el grupo falló, pidiendo el dato o el eslabón que las resuelve.", "Pide que lean en voz alta su salvavidas: lo mínimo que sí tenían claro.", "Cada uno escribe el concepto del día en la franja «Palabras que me frenaron» de su hoja."], "como": "No dicta la definición. El concepto se escribe como el estudiante lo entendió; si quedó mal entendido, eso se ve en la hoja y se corrige la próxima clase.", "apoyo": ["La palabra nueva no se dicta. Si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase: es mejor que dictarla bien.", "Para el cierre del momento: La tabla de la pregunta 1 no trae unidades y la de las preguntas 8 y 9 escribe los decimales con punto. Aprovéchalo: un dato sin unidades no se puede comparar con otro estudio."]}}];
var MOM = [{"n": 1, "nom": "Activación", "min": 15, "c": "--m1"}, {"n": 2, "nom": "Pregunta problematizadora", "min": 20, "c": "--m2"}, {"n": 3, "nom": "Desarrollo guiado", "min": 35, "c": "--m3"}, {"n": 4, "nom": "Reto en equipo", "min": 20, "c": "--m4"}, {"n": 5, "nom": "Evaluación individual", "min": 20, "c": "--m5"}, {"n": 6, "nom": "Cierre", "min": 10, "c": "--m6"}];
var NOMBRE = document.getElementById("momnom").textContent, SUB = document.getElementById("momsub").textContent;
var $ = function(s){ return document.querySelector(s); };
var wrap = $("#wrap"), stage = $("#stage"), i = 0;
var tBase = 0, tLeft = 0, tOn = false, tick = null;
var elegidas = [];
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function paintClock(){
  var n = $("#tnum");
  if(!tBase){ n.textContent = "—"; n.classList.remove("over"); return; }
  var s = Math.abs(tLeft), mm = Math.floor(s/60), ss = s%60;
  n.textContent = (tLeft<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", tLeft<0);
}
function setTimer(min){
  tBase = min||0; tLeft = tBase*60; tOn = false;
  if(tick){ clearInterval(tick); tick = null; }
  $("#play").textContent = "Iniciar"; paintClock();
}
function toggleTimer(){
  if(!tBase) return;
  tOn = !tOn; $("#play").textContent = tOn ? "Pausar" : "Seguir";
  if(tick){ clearInterval(tick); tick = null; }
  if(tOn) tick = setInterval(function(){ tLeft--; paintClock(); }, 1000);
  paintClock();
}
function guiaHTML(g){
  if(!g) return '<p class="sub">Sin notas para esta diapositiva.</p>';
  var h = '<div class="gbox"><h4>Objetivo</h4><p>'+esc(g.obj)+'</p></div>';
  if(g.decir && g.decir.length) h += '<div class="gbox"><h4>Qué haces y qué dices</h4><ul>'+
     g.decir.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  if(g.como) h += '<div class="gbox como"><h4>Lo que no haces</h4><p>'+esc(g.como)+'</p></div>';
  if(g.apoyo && g.apoyo.length) h += '<div class="gbox apoyo"><h4>Si Biología no es tu fuerte</h4><ul>'+
     g.apoyo.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  return h;
}
function pintaElegidas(){
  var box = document.getElementById("elegidas"); if(!box) return;
  if(!elegidas.length){ box.innerHTML = '<p class="sub">Vuelve a la diapositiva anterior y escoge las cinco.</p>'; return; }
  box.innerHTML = elegidas.map(function(t,k){
    return '<div class="card edge" style="--accent:var(--m'+((k%6)+1)+')"><h3>'+(k+1)+'. '+esc(t)+'</h3>'+
      '<p class="sub">Busca esta pregunta en tu simulacro y en la hoja de taller de la misma estrategia.</p></div>';
  }).join("");
}
function go(n){
  var prev = SC[i];
  i = Math.max(0, Math.min(SC.length-1, n));
  var s = SC[i];
  wrap.innerHTML = s.html;
  wrap.classList.remove("enter"); void wrap.offsetWidth; wrap.classList.add("enter");
  stage.scrollTop = 0;
  var m = s.m!=null ? MOM[s.m] : null;
  $("#momdot").style.background = m ? "var("+m.c+")" : "var(--faint)";
  $("#momdot").textContent = m ? m.n : "·";
  $("#momnom").textContent = m ? m.nom : NOMBRE;
  $("#momsub").textContent = m ? (m.min+" minutos") : SUB;
  var want = s.min!=null ? s.min : (m ? m.min : 0);
  var cambio = !prev || prev===s || prev.m!==s.m || (prev.min||null)!==(s.min||null);
  if(cambio) setTimer(want);
  $("#count").textContent = (i+1)+" / "+SC.length;
  $("#prog i").style.width = (SC.length>1 ? i/(SC.length-1)*100 : 100)+"%";
  $("#guiabody").innerHTML = guiaHTML(s.guia);
  [].forEach.call(wrap.querySelectorAll("[data-pick]"), function(b){
    b.setAttribute("aria-pressed", elegidas.indexOf(b.textContent)>=0 ? "true" : "false"); });
  pintaElegidas();
}
wrap.addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.dataset.show){ var t = document.getElementById(b.dataset.show); if(t) t.hidden = !t.hidden; }
  if(b.dataset.showgrupo){
    var g = wrap.querySelectorAll('[data-grupo="'+b.dataset.showgrupo+'"]'), abrir = g.length && g[0].hidden;
    [].forEach.call(g, function(x){ x.hidden = !abrir; });
    b.textContent = abrir ? "Ocultar las claves" : "Revelar las claves";
  }
  if(b.dataset.clave){
    var box = document.getElementById(b.dataset.clave), ok = box.querySelector('[data-op="'+b.dataset.k+'"]');
    var on = ok && !ok.classList.contains("ok");
    [].forEach.call(box.querySelectorAll(".op"), function(o){ o.classList.remove("ok"); });
    if(on) ok.classList.add("ok");
    b.textContent = on ? "Ocultar la clave" : "Revelar la clave";
  }
  if(b.dataset.tally){ var n = document.getElementById(b.dataset.tally); n.textContent = (+n.textContent||0)+1; }
  if(b.dataset.reset){ [].forEach.call(wrap.querySelectorAll('[id^="'+b.dataset.reset+'"]'), function(x){
    if(x.classList.contains("n")) x.textContent = "0"; }); }
  if(b.dataset.pick!=null){
    var t = b.textContent, k = elegidas.indexOf(t);
    if(k>=0) elegidas.splice(k,1); else if(elegidas.length<5) elegidas.push(t);
    b.setAttribute("aria-pressed", elegidas.indexOf(t)>=0 ? "true" : "false");
  }
});
function setGuia(on){ $("#guia").classList.toggle("open", on); $("#scrim").classList.toggle("on", on);
  $("#gbtn").setAttribute("aria-pressed", on ? "true" : "false"); }
$("#next").addEventListener("click", function(){ go(i+1); });
$("#prev").addEventListener("click", function(){ go(i-1); });
$("#play").addEventListener("click", toggleTimer);
$("#reset").addEventListener("click", function(){ setTimer(tBase); });
$("#gbtn").addEventListener("click", function(){ setGuia(!$("#guia").classList.contains("open")); });
$("#gclose").addEventListener("click", function(){ setGuia(false); });
$("#scrim").addEventListener("click", function(){ setGuia(false); });
document.addEventListener("keydown", function(e){
  var t = e.target.tagName; if(t==="INPUT"||t==="TEXTAREA") return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ go(i+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ go(i-1); e.preventDefault(); }
  else if(e.key==="Home"){ go(0); e.preventDefault(); }
  else if(e.key==="End"){ go(SC.length-1); e.preventDefault(); }
  else if(e.key==="g"||e.key==="G"){ setGuia(!$("#guia").classList.contains("open")); }
  else if(e.key==="t"||e.key==="T"){ toggleTimer(); }
  else if(e.key==="Escape"){ setGuia(false); }
});
go(0);
})();
</script>
</body>
</html>
