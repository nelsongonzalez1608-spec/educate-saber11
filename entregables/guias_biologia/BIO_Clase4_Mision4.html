<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Biología · Clase 4</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>[hidden]{display:none!important}
:root{
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --text:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --area:#30843C; --azul:#1F4E8C; --oro:#B0711A; --morado:#5B3E96; --verde:#2E7A39;
  --m1:#30843C; --m2:#1F4E8C; --m3:#3B3BA6; --m4:#5B3E96; --m5:#A82424; --m6:#4A5A70; --rojo:#A82424;
  --ink:#1B1F27; --muted:#5C6472; --faint:#A9B0BB; --line:#E3E7ED; --paper:#FFFFFF; --bg:#F6F4F1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:clamp(16px,1.25vw,21px);line-height:1.5}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
#top{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding:10px clamp(14px,2vw,28px);background:var(--paper);flex-wrap:wrap}
.logo img{height:clamp(28px,2.6vw,40px);display:block}
#mom{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
#momdot{width:clamp(30px,2.4vw,40px);height:clamp(30px,2.4vw,40px);border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;background:var(--faint)}
#momnom{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.2vw,20px)}
#momsub{color:var(--muted);font-size:.85em}
#clock{display:flex;align-items:center;gap:8px}
#tnum{font-family:var(--display);font-weight:800;font-size:clamp(20px,1.8vw,30px);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
#tnum.over{color:var(--area)}
.btn{appearance:none;font:inherit;font-size:.86em;font-weight:600;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.solid{background:var(--area);border-color:var(--area);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#stage{overflow:auto;padding:clamp(18px,3vw,48px) clamp(16px,4vw,72px)}
#wrap{max-width:1500px;margin:0 auto}
#wrap.enter{animation:ent .28s ease-out}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bot{display:flex;align-items:center;gap:12px;padding:10px clamp(14px,2vw,28px);background:var(--paper)}
#prog{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
#prog i{display:block;height:100%;background:var(--area);transition:width .25s}
#count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
#hint{color:var(--faint);font-size:.8em}
@media (max-width:760px){#hint{display:none}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.2vw,68px);line-height:1.05;margin:.2em 0 .25em;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,2.8vw,46px);line-height:1.1;margin:.25em 0 .3em;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:clamp(18px,1.5vw,26px);margin:.1em 0 .4em;line-height:1.2}
p{margin:.35em 0 .6em}
.lead{font-size:1.2em;line-height:1.45;max-width:70ch}
.sub{color:var(--muted)}
.mt{margin-top:clamp(14px,1.8vw,26px)}
.logo-xl img{height:clamp(54px,6vw,96px);margin-bottom:12px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tag,.min,.membrete{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.78em;font-weight:700;letter-spacing:.02em}
.tag{background:var(--ink);color:#fff}
.min{background:var(--accent,var(--area));color:#fff}
.membrete{border:1.5px solid var(--line);color:var(--muted)}
.kicker{color:var(--muted);font-size:.85em;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.grid{display:grid;gap:clamp(12px,1.4vw,22px)}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid>*{min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,1.6vw,24px)}
.card.edge{border-left:6px solid var(--accent,var(--area))}
.card.big .lead{font-size:1.3em}
.step{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px}
.step .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;flex:none}
.note{border-left:5px solid var(--accent,var(--area));background:var(--paper);border-radius:10px;padding:10px 16px;margin-top:12px}
.cita{font-family:var(--display);font-weight:600;line-height:1.35;background:var(--paper);border-left:6px solid var(--area);border-radius:12px;padding:clamp(16px,2vw,30px);margin:18px 0}
.cita.xl{font-size:clamp(24px,2.6vw,44px)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally .n{display:inline-block;min-width:1.6em;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.pasos{margin:.2em 0 0;padding-left:1.3em}.pasos li{margin:.3em 0}
.sello{margin-top:12px;border:2px dashed var(--oro);border-radius:12px;padding:10px 14px;background:#FDF6EA}
.sello b{display:block;color:var(--oro);font-size:.8em;letter-spacing:.06em;text-transform:uppercase}
.clave{margin-top:12px;display:flex;align-items:center;gap:10px;font-weight:600}
.keychip{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:10px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.2em}
.aviso{margin-top:10px;border-radius:10px;padding:10px 14px;background:#FBEFEF;border-left:5px solid var(--area);font-size:.92em}
.aviso.sev-aten{background:#EDF5EE;border-left-color:var(--verde)}
.aviso.sev-medi{background:#FDF5E7;border-left-color:var(--oro)}
.icfes .texto{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.6vw,24px);max-height:62vh;overflow:auto;font-size:.95em}
.enun{font-weight:600;font-size:1.08em}
.ops{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.op .L{flex:none;width:1.8em;height:1.8em;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-family:var(--display);font-weight:800}
.op.ok{border-color:var(--verde);background:#EDF5EE}.op.ok .L{background:var(--verde);color:#fff}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick[aria-pressed="true"]{background:var(--area);border-color:var(--area);color:#fff}
#scrim{position:fixed;inset:0;background:rgba(15,18,24,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#guia{position:fixed;top:0;right:0;height:100%;width:min(520px,92vw);background:var(--paper);box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column;z-index:10}
#guia.open{transform:none}
#guiahead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg)}
#guiabody{overflow:auto;padding:16px 20px 30px;font-size:.92em}
.gbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.gbox h4{margin:0 0 6px;font-family:var(--display);font-size:.8em;letter-spacing:.07em;text-transform:uppercase;color:var(--area)}
.gbox ul{margin:0;padding-left:1.1em}.gbox li{margin:.35em 0}
.gbox.como{background:#F6F7F9}.gbox.como h4{color:var(--muted)}
.gbox.apoyo{background:#FDF6EA;border-color:#EAD9B4}.gbox.apoyo h4{color:var(--oro)}
[hidden]{display:none!important}
.fig{margin:12px 0}.fig svg{display:block;width:100%;max-width:760px;height:auto}
.tabla{border-collapse:collapse;width:100%;table-layout:fixed;font-size:.86em;line-height:1.35}
.tabla th,.tabla td{border:1px solid var(--line);padding:5px 8px;vertical-align:top;overflow-wrap:anywhere}
.tabla th{background:#F2F5F3;text-align:left}.figcap{font-size:.85em;font-style:italic}
.ops.cuatro{grid-template-columns:repeat(4,1fr)}.opsfig svg{max-width:580px}
.aviso{border-left-color:var(--rojo)}.aviso.sev-baja{background:#EEF3FA;border-left-color:var(--azul)}
</style>
</head>

/h3><p class=\"sub\">Las diez preguntas de la prueba de campo, páginas 104 a 107<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m4)\"><h3>Tu cuaderno<\/h3><p class=\"sub\">Páginas 161 a 167<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m6)\"><h3>Hoy<\/h3><p class=\"sub\">120 minutos · 6 momentos · IN · indagación<\/p><\/div><\/div>", "guia": {"obj": "Que el grupo sepa desde el primer minuto qué va a pasar en estos 120 minutos y qué tiene que tener sobre la mesa.", "decir": ["«Libro abierto, cuaderno cerrado, lápiz. Hoy no les voy a preguntar qué saben de memoria: les voy a preguntar qué dato lo dice.»"], "apoyo": ["⚑ Antes del sábado: Las claves de las preguntas 7 y 9 son imprecisas: en la 7 el cambio de color es de los sensores y no de las nanopartículas; en la 9 el objetivo es personalizar contra el tumor, no disminuir efectos secundarios. Son las mejores de las cuatro. Si un estudiante lo nota, tiene razón.", "Del libro, para ti: En las preguntas 4, 6, 8 y 10 la correcta es la más técnica y las otras son absurdas a la vista: se aciertan por descarte. Exige el eslabón escrito antes de mirar las opciones.", "Del libro, para ti: A es clave 5 veces (4, 6, 7, 9 y 10) y D una sola vez. Reportado a la editorial. No lo digas en clase.", "Los cuatro conceptos que tienes que poder explicar hoy en dos minutos, sin jerga. Si un estudiante sabe más que tú de un tema, déjalo explicar y pide que señale en el texto o en la gráfica de dónde lo saca:", "Hipótesis que se puede poner a prueba: Dice qué se compara, qué se mide y qué resultado se espera: «los que usan X recuerdan más palabras que los que no». «X mejorará la vida en el futuro» no se puede poner a prueba así.", "Fijación de nitrógeno: Las bacterias fijadoras pasan el nitrógeno del aire a compuestos que la planta absorbe por la raíz. Por eso van en las «bombas de semillas»: abonan sin fertilizante químico.", "Vacunas y linfocitos T: Una vacuna le muestra al sistema inmune una señal del enemigo (un antígeno) para que aprenda a reconocerlo. Los linfocitos T atacan a las células que llevan esa señal. Contra el cáncer, la señal es un neoantígeno: una proteína que solo tiene el tumor.", "Lo que respalda un estudio: Un estudio respalda lo que midió, en quienes lo midió y en las condiciones en que lo hizo. Usar el resultado en otra población o para otro fin es ir más allá de la evidencia.", "Abre esta guía con la tecla G en cada diapositiva: trae lo que dices y, debajo, lo que necesitas saber si Biología no es tu área.", "El cronómetro arranca con T y se reinicia solo cuando cambia el momento de la clase."]}}, {"m": null, "html": "<div class=\"eyebrow\"><span class=\"kicker\">Así vamos a trabajar<\/span><\/div><h2>Seis momentos, una sola regla<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:var(--m1)\"><div class=\"k\">1<\/div><div><b>Activación<\/b><span class=\"sub\"> · 15 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m2)\"><div class=\"k\">2<\/div><div><b>Pregunta problematizadora<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m3)\"><div class=\"k\">3<\/div><div><b>Desarrollo guiado<\/b><span class=\"sub\"> · 35 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m4)\"><div class=\"k\">4<\/div><div><b>Reto en equipo<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m5)\"><div class=\"k\">5<\/div><div><b>Evaluación individual<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m6)\"><div class=\"k\">6<\/div><div><b>Cierre<\/b><span class=\"sub\"> · 10 min<\/span><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--area)\"><h3>La regla del cuaderno<\/h3><p class=\"lead\">Si el instrumento está vacío, no lo resolviste: lo adivinaste.<\/p><p>Primero se escribe el instrumento —qué cambió, qué se midió, contra qué se compara—, después se marca la opción. Una respuesta correcta con el instrumento en blanco no cuenta como resuelta.<\/p><\/div><\/div>", "guia": {"obj": "Que la regla quede dicha en voz alta antes de cualquier texto.", "decir": ["«La respuesta correcta con el instrumento vacío no cuenta. ¿Por qué? Porque en Biología casi todas las opciones suenan científicas: el que no escribió el dato escoge la que suena mejor, no la que dice el texto o la gráfica.»"], "apoyo": ["Si alguien pregunta para qué escribir, la respuesta corta es: lo que separa la opción correcta de las que suenan bien está en un número, una flecha o una palabra del texto, y eso se pierde si no se escribe.", "Si alguien dice «eso es por las hormonas» o «eso es genético», devuélvele la pregunta: «¿qué dato te lo dice?»."]}}, {"m": 0, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Activación<\/span><span class=\"kicker\">Cuaderno cerrado<\/span><\/div><h2>¿Qué cambió, qué se midió y contra qué se compara?<\/h2><blockquote class=\"cita xl\">Una aplicación promete que si duermes oyendo música suave, al otro día recuerdas el doble.<\/blockquote><p class=\"lead\">Tres respuestas antes de cualquier explicación. Todavía no se abre el cuaderno.<\/p><div class=\"ctl\"><button class=\"btn\" data-show=\"pista4\">Mostrar la pista<\/button><\/div><div class=\"note\" id=\"pista4\" hidden style=\"--accent:var(--m1)\"><b>Pista:<\/b> ¿qué se compara, qué se mide y contra quién? La frase no lo dice: así no se puede poner a prueba<\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno corto con tres preguntas —qué cambió, qué se midió y contra qué se compara— antes de explicarlo y antes de ver cualquier opción.", "decir": ["Proyecta o lee una observación de dos o tres renglones sin decir de dónde salió.", "Pide tres respuestas, en voz alta o en el tablero: qué cambió, qué se midió y contra qué se compara.", "Ejecuta la dinámica de apertura según la estrategia del encuentro."], "como": "No explica el fenómeno ni acepta todavía explicaciones. Si alguien dice «es por las hormonas», le devuelve la pregunta: «¿qué dato te lo dice?». El cuaderno sigue cerrado.", "apoyo": ["No expliques el fenómeno ni aceptes todavía explicaciones: primero las tres respuestas. La observación es inventada para la clase: no sale del libro.", "La pista existe para el cierre de los 15 minutos, no para el principio: ¿qué se compara, qué se mide y contra quién? La frase no lo dice: así no se puede poner a prueba."]}}, {"m": 0, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#242478\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 1 · ¿Se puede poner a prueba?<\/span><\/div><h2>¿Cabe en el laboratorio?<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Dos zonas en el salón: SE PUEDE PONER A PRUEBA y ASÍ COMO ESTÁ, NO.<\/li><li>El docente lee afirmaciones sobre un invento: «este casco te hará más inteligente», «quienes usan el casco recuerdan más palabras que quienes no lo usan».<\/li><li>Cada estudiante camina a la zona que cree.<\/li><li>Para quedarse en SE PUEDE, dice qué dos grupos compararía y qué mediría con un número; si no puede, se cambia de zona.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Dos letreros<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno corto con tres preguntas —qué cambió, qué se midió y contra qué se compara— antes de explicarlo y antes de ver cualquier opción.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto o la gráfica en cinco minutos —seguir, comparar o ubicar—, pero con el cuerpo.»"], "como": "No explica el fenómeno ni acepta todavía explicaciones. Si alguien dice «es por las hormonas», le devuelve la pregunta: «¿qué dato te lo dice?». El cuaderno sigue cerrado.", "apoyo": ["Qué movimiento mental entrena: Reconocer una hipótesis que se puede poner a prueba: dos grupos, una variable medible, un resultado esperado. Es el movimiento de las preguntas 2, 5 y 8, y de la primera del entrenamiento (la gráfica que espera el investigador).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 1, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m2)\">Pregunta problematizadora<\/span><span class=\"kicker\">Libro abierto en la pregunta modelo<\/span><\/div><h2>Abran el libro en la pregunta 1, página 104<\/h2><p class=\"lead\">Antes de releer el texto o la gráfica: ¿cuál creen que es? Levanten la mano.<\/p><div class=\"ctl\"><button class=\"btn tally\" data-tally=\"h4A\">A <span class=\"n\" id=\"h4A\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h4B\">B <span class=\"n\" id=\"h4B\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h4C\">C <span class=\"n\" id=\"h4C\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h4D\">D <span class=\"n\" id=\"h4D\">0<\/span><\/button><button class=\"btn\" data-reset=\"h4\">↺<\/button><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta que gobierna el área<\/h3><p class=\"lead\">¿Qué dato —del texto, la tabla o la gráfica— respalda eso?<\/p><p class=\"sub\">Nadie justifica con «yo sé que» ni con lo que vio en internet: toda respuesta señala un renglón del texto, un número de la tabla o un punto de la gráfica.<\/p><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta de este momento<\/h3><p class=\"lead\">¿Se puede poner a prueba lo que promete este invento?<\/p><\/div>", "guia": {"obj": "Que el estudiante compruebe que en Biología la respuesta sale del dato —del texto, la tabla o la gráfica— y no de lo que suena científico, usando la pregunta modelo del libro.", "decir": ["Presenta la pregunta modelo del libro y la deja a la vista todo el momento.", "Pide respuestas a mano alzada ANTES de releer el texto o la gráfica, y las anota en el tablero.", "Hace la pregunta que gobierna el área: ¿qué dato, del texto, la tabla o la gráfica, respalda eso?", "Revela la clave solo al final y trabaja por qué cae cada una de las otras tres."], "como": "Regla del momento: nadie justifica con «yo sé que» ni con lo que vio en internet. Toda intervención señala un renglón del texto, un número de la tabla o un punto de la gráfica.", "apoyo": ["La pregunta modelo es la 1 del libro (página 104). El cuaderno se abre en la página 161 solo en «mi primera idea».", "Cuenta las manos tocando cada letra: el número queda en pantalla y sirve para el final del momento, cuando el grupo vea cuántos cambiaron de opinión al volver al texto o a la gráfica.", "No digas la clave en este momento: sale en el bloque de las preguntas 1 y 2, después de llenar el instrumento en pantalla, casilla por casilla. Ahí se trabaja por qué cae cada una de las otras tres."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 1 y 2<\/span><span class=\"kicker\">En pantalla, casilla por casilla<\/span><\/div><h2>Preguntas 1 y 2: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 1<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E2 · El mecanismo, eslabón por eslabón<\/span><\/div><p class=\"sub\">Cirugía fetal · por qué sirve la toxina botulínica<\/p><h3 style=\"color:#5B3E96\">La cadena de la toxina, eslabón por eslabón<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Gastrosquisis<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k41\"><span class=\"keychip\" style=\"background:#5B3E96\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 2<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · ¿Se puede poner a prueba?<\/span><\/div><p class=\"sub\">Prótesis de hipocampo · una hipótesis que se pueda evaluar<\/p><h3 style=\"color:#242478\">El banco de pruebas: ¿cabe en un experimento?<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k41\"><span class=\"keychip\" style=\"background:#242478\">C<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k41\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué dato escribieron en el instrumento? Léanmelo.»", "Si alguien se traba, pregúntale qué cambió y contra qué lo compara. Si el instrumento está vacío, vuelve al texto o a la gráfica antes que a las opciones."], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Las claves del libro son 1·B y 2·C. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 1 · Gastrosquisis: Un defecto de la pared abdominal del bebé: el intestino crece por fuera, por un orificio. Si la pared está tensa, el orificio aprieta al intestino y a los vasos que le llevan sangre; con menos sangre, el tejido puede morir. La toxina relaja el músculo y el orificio aprieta menos. Para destrabar: «¿Qué le pasa a un órgano que un orificio aprieta durante semanas?»", "Pregunta 1 · aviso del libro (atención), solo para ti, no se proyecta: La «primera cirugía fetal exitosa» (2025) no se verificó, y la opción B habla de vasos que el texto no menciona. Qué haces: Usa el sello: qué le pasa a un órgano apretado por un orificio.", "Pregunta 2 · aviso del libro (atención), solo para ti, no se proyecta: Las fuentes (2023 y 2025) y la cifra de «hasta un 37 %» de mejora de la memoria no se verificaron. Qué haces: Trátalas como caso, no como dato."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 3 y 4<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 3 y 4: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 3<\/span><span class=\"min\" style=\"--accent:#A82424\">E4 · Lo que la evidencia respalda (y lo que no)<\/span><\/div><p class=\"sub\">Prótesis de hipocampo · el uso responsable de la ciencia<\/p><h3 style=\"color:#A82424\">¿Para quién se probó y para quién se usa?<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k43\"><span class=\"keychip\" style=\"background:#A82424\">C<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 4<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E2 · El mecanismo, eslabón por eslabón<\/span><\/div><p class=\"sub\">Prótesis de hipocampo · cómo mejora la memoria<\/p><h3 style=\"color:#5B3E96\">El recorrido de la señal hasta el recuerdo<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k43\"><span class=\"keychip\" style=\"background:#5B3E96\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k43\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué dato escribieron en el instrumento? Léanmelo.»", "Si alguien se traba, pregúntale qué cambió y contra qué lo compara. Si el instrumento está vacío, vuelve al texto o a la gráfica antes que a las opciones."], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Las claves del libro son 3·C y 4·A. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 3 · aviso del libro (atención), solo para ti, no se proyecta: Las fuentes (2023 y 2025) y la cifra de «hasta un 37 %» de mejora de la memoria no se verificaron. Qué haces: Trátalas como caso, no como dato."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#5B3E96\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 2 · El mecanismo, eslabón por eslabón<\/span><\/div><h2>Eslabones del yogur<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Cada equipo recibe seis tarjetas desordenadas: calentar la leche, dejarla entibiar, agregar las bacterias, mantenerla tibia, las bacterias convierten el azúcar en ácido, la leche se espesa.<\/li><li>Seis integrantes se ponen en fila con una tarjeta cada uno, en el orden que creen.<\/li><li>El primero dice su paso y toca el hombro del siguiente solo si su paso es la causa del que sigue.<\/li><li>Donde no se puede decir «y por eso…», la cadena se cae: el equipo reordena.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Seis tarjetas por equipo<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto o la gráfica en cinco minutos —seguir, comparar o ubicar—, pero con el cuerpo.»"], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Armar el mecanismo de modo que cada eslabón cause el siguiente y ninguno falte. Es el movimiento de las preguntas 1, 4 y 10, y de la tercera del entrenamiento (el orden para hacer vino de manzana).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 5 y 6<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 5 y 6: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 5<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · ¿Se puede poner a prueba?<\/span><\/div><p class=\"sub\">Bombas de semillas desde un globo · para qué sirven los datos<\/p><h3 style=\"color:#242478\">Sensores conectados con la pregunta del proyecto<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k45\"><span class=\"keychip\" style=\"background:#242478\">D<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 6<\/span><span class=\"min\" style=\"--accent:#C9821B\ E ALIMENTO y EMBRIÓN, con su función escrita al respaldo de la tarjeta.<\/li><li>El docente cuenta una situación: «pasa tres meses en suelo seco», «germina bajo la tierra, sin luz».<\/li><li>El grupo dice qué pieza trabaja en esa situación; esa pieza voltea su tarjeta y lee su función.<\/li><li>El docente saca una pieza y el grupo dice qué deja de poder hacer la semilla sin ella.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Tres tarjetas · una semilla remojada, si hay<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto o la gráfica en cinco minutos —seguir, comparar o ubicar—, pero con el cuerpo.»"], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Atribuir cada función a la pieza que la cumple, no a la que suena más importante. Es el movimiento de las preguntas 6 y 7, y de la cuarta del entrenamiento (para qué le sirve la fotosíntesis a la planta).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 7 y 8<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 7 y 8: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 7<\/span><span class=\"min\" style=\"--accent:#C9821B\">E3 · Para qué sirve cada pieza<\/span>< e traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Las claves del libro son 7·A y 8·C. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 7 · Indicador de pH: Una sustancia que cambia de color según qué tan ácido o básico está el medio, como el agua de repollo morado. Cuando una fruta se daña cambian la acidez y los gases a su alrededor, y el indicador lo muestra. Para destrabar: «¿El color cambió porque cambió la química o porque cambió la luz?»", "Pregunta 7 · aviso del libro (media): El texto separa dos piezas: las nanopartículas frenan bacterias y los sensores de pH detectan el deterioro. El cambio de color es de los sensores; la clave A se lo atribuye a las nanopartículas. Es la mejor de las cuatro, no una perfecta. Qué haces: Es la mejor de las cuatro. Si un estudiante lo nota, tiene razón: díselo."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#A82424\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 4 · Lo que la evidencia respalda (y lo que no)<\/span><\/div><h2>El juez de la evidencia<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Tres marcas en el piso: LO RESPALDA, NO LO DICE y LO CONTRADICE.<\/li><li>El docente lee un resultado: «en 40 tomates rociados con un aerosol nuevo salieron menos hongos que en 40 sin rociar, durante dos semanas».<\/li><li>Lee afirmaciones una por una: «evita los hongos en todas las frutas», «redujo los hongos en esos tomates», «hace daño a quien se come el tomate».<\/li><li>Cada estudiante camina a la marca que cree y, para quedarse, señala la palabra del resultado que lo decide.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Tres letreros en el piso<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto o la gráfica en cinco minutos —seguir, comparar o ubicar—, pero con el cuerpo.»"], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Separar lo que la evidencia respalda de lo que se le agrega: para quién se probó, cuánto y en qué condiciones. Es el movimiento de las preguntas 3 y 9, y de la segunda del entrenamiento (la hipótesis frente a los estudios).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 9 y 10<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 9 y 10: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 9<\/span><span class=\"min\" style=\"--accent:#A82424\">E4 · Lo que la evidencia respalda (y lo que no)<\/span><\/div><p class=\"sub\">Vacunas personalizadas con IA · el objetivo, según el texto<\/p><h3 style=\"color:#A82424\">Personalizada, ¿para quién y contra qué?<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k49\"><span class=\"keychip\" style=\"background:#A82424\">A<\/span> es la clave del libro<\/div><div class=\"aviso sev-medi\" hidden data-grupo=\"k49\"><b>Ojo con esta clave:<\/b> El texto adapta la vacuna al tumor de cada paciente; la menor toxicidad es un resultado, no el objetivo. La A es la única que no contradice el texto: es la menos mala.<\/div><\/div><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 10<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E2 · El mecanismo, eslabón por eslabón<\/span><\/div><p class=\"sub\">Vacunas personalizadas con IA · cómo se activa la defensa<\/p><h3 style=\"color:#5B3E96\">La carrera de relevos de la vacuna<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k49\"><span class=\"keychip\" style=\"background:#5B3E96\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k49\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué dato escribieron en el instrumento? Léanmelo.»", "Si alguien se traba, pregúntale qué cambió y contra qué lo compara. Si el instrumento está vacío, vuelve al texto o a la gráfica antes que a las opciones."], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Las claves del libro son 9·A y 10·A. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 9 · aviso del libro (media): El texto adapta la vacuna al tumor de cada paciente; la menor toxicidad es un resultado, no el objetivo. La A es la única que no contradice el texto: es la menos mala. Qué haces: Se elige por descarte. Enseña a escoger la menos mala cuando ninguna es perfecta."]}}, {"m": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m4)\">Reto en equipo · 20 min<\/span><span class=\"kicker\">Equipos de tres · cada uno responde en su cuaderno<\/span><\/div><h2>Reto del corte: La pulsera que te hace mover<\/h2><div class=\"card big edge mt\" style=\"--accent:var(--m4)\"><p class=\"lead\">Cada equipo recibe un invento: una pulsera que vibra cuando el estudiante lleva cuarenta minutos sentado, para que se pare y camine. En doce minutos escriben una hipótesis que se pueda poner a prueba (qué dos grupos, qué se mide), arman el mecanismo eslabón por eslabón desde la vibración hasta el efecto que promete, dicen para qué sirve cada pieza y escriben una afirmación que su experimento respaldaría y otra que no. Cada integrante defiende una de las cuatro partes.<\/p><\/div><div class=\"note mt\" style=\"--accent:var(--m4)\"><b>La defensa:<\/b> tres minutos por equipo, señalando el dato, el grupo de comparación o el eslabón que los respalda. «Es que así funciona» no cuenta.<\/div>", "guia": {"obj": "Que el estudiante defienda su explicación con el dato en la mano y acepte que otro equipo puede ver una variable o un eslabón que él no vio.", "decir": ["Arma equipos de tres y entrega el reto del corte de este momento.", "Exige que cada integrante llegue con su instrumento YA diligenciado individualmente.", "Da tres minutos de defensa por equipo: señalan el dato, la comparación o el eslabón que los respalda.", "Cierra mostrando qué variable o qué eslabón quedó por fuera en cada propuesta."], "como": "El equipo discute, pero cada uno escribe en SU tarjeta del reto. No se acepta una defensa que diga «es que así funciona»: se nombra el dato, el grupo de comparación o el paso del proceso.", "apoyo": ["El reto no tiene una sola respuesta correcta: gana el equipo que mejor sostiene la suya con datos. Si dos explicaciones están sostenidas, dilo: eso también es hacer ciencia.", "Si un equipo entrega una sola hoja para los tres, el reto no cuenta. La discusión es compartida; el registro es individual.", "Cierra mostrando qué variable o qué eslabón quedó por fuera en cada propuesta."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 1<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Pectinasas y color del vino<\/h3><p>El color de los vinos es una de las características de calidad más importantes en los procesos de producción. Su color depende del tipo de fruta que se fermentó para la obtención del vino y de los pigmentos que contienen estas frutas.<\/p><p>A su vez, el contenido de pigmentos en el vino puede variar según el proceso de producción y la manera como se llevó a cabo cada una de sus etapas. En general, para comercializar cualquier vino actualmente, el proceso debe cumplir las siguientes etapas: selección de la fruta, prensado, fermentación-añejamiento, filtración y envasado. La última etapa debe realizarse en recipientes lavados y desinfectados previamente.<\/p><p>La adición de enzimas, como pectinasas y glucanasas durante la producción de vino, es una práctica común en algunas empresas productoras de vino, la cual ha demostrado mejorar la extracción de pigmentos de las frutas y cambiar la intensidad del color, que se mide con equipos especializados.<\/p><\/div><div><p class=\"enun\">Al leer la información del contexto, un investigador piensa que si se emplean pectinasas durante la producción de vino de uva, la intensidad del color de un vino es mayor que la de un vino producido sin pectinasas. Si la hipótesis del investigador es cierta, ¿cuál de las siguientes gráficas muestra los resultados esperados por el investigador?<\/p><div class=\"opsfig\"><figure class=\"fig\"><svg viewBox=\"0 0 720 345\" role=\"img\" aria-label=\"Cuatro gráficas de intensidad del color del vino con y sin pectinasa, A a D\" style=\"font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif\"><text x=\"4\" y=\"14\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"start\" font-weight=\"700\">Gráfica A<\/text><line x1=\"34\" y1=\"142\" x2=\"254\" y2=\"142\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><line x1=\"34\" y1=\"22\" x2=\"34\" y2=\"142\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><text transform=\"translate(24,82.0) rotate(-90)\" font-size=\"11\" fill=\"#5C6472\" text-anchor=\"middle\">Intensidad del color<\/text><rect x=\"74\" y=\"92\" width=\"44\" height=\"50\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.6\" stroke-dasharray=\"5,4\"/><rect x=\"174\" y=\"68\" width=\"44\" height=\"74\" fill=\"#B8BEC8\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><text x=\"144\" y=\"158\" font-size=\"11\" fill=\"#1B1F27\" text-anchor=\"middle\">Tipo de vino producido<\/text><rect x=\"268\" y=\"26\" width=\"14\" height=\"12\" fill=\"white\" stroke=\"#1B1F27\" stroke-dasharray=\"4,3\"/><text x=\"288\" y=\"37\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"start\">con pectinasa<\/text><rect x=\"268\" y=\"48\" width=\"14\" height=\"12\" fill=\"#B8BEC8\" stroke=\"#1B1F27\"/><text x=\"288\" y=\"59\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"start\">sin pectinasa<\/text><text x=\"364\" y=\"14\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"start\" font-weight=\"700\">Gráfica B<\/text><line x1=\"394\" y1=\"142\" x2=\"614\" y2=\"142\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><line x1=\"394\" y1=\"22\" x2=\"394\" y2=\"142\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><text transform=\"translate(384,82.0) rotate(-90)\" font-size=\"11\" fill=\"#5C6472\" text-anchor=\"middle\">Intensidad del color<\/text><rect x=\"434\" y=\"36\" width=\"44\" height=\"106\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.6\" stroke-dasharray=\"5,4\"/><rect x=\"534\" y=\"80\" width=\"44\" height=\"62\" fill=\"#B8BEC8\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><text x=\"504\" y=\"158\" font-size=\"11\" fill=\"#1B1F27\" text-anchor=\"middle\">Tipo de vino producido<\/text><rect x=\"628\" y=\"26\" width=\"14\" height=\"12\" fill=\"white\" stroke=\"#1B1F27\" stroke-dasharray=\"4,3\"/><text x=\"648\" y=\"37\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"start\">con pectinasa<\/text><rect x=\"628\" y=\"48\" width=\"14\" height=\"12\" fill=\"#B8BEC8\" stroke=\"#1B1F27\"/><text x=\"648\" y=\"59\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"start\">sin pectinasa<\/text><text x=\"4\" y=\"189\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"start\" font-weight=\"700\">Gráfica C<\/text><line x1=\"34\" y1=\"317\" x2=\"254\" y2=\"317\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><line x1=\"34\" y1=\"197\" x2=\"34\" y2=\"317\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><text transform=\"translate(24,257.0) rotate(-90)\" font-size=\"11\" fill=\"#5C6472\" text-anchor=\"middle\">Intensidad del color<\/text><polyline points=\"34,245 144,245 144,317\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"2\"/><polyline points=\"34,240 144,240 221,281\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"2\" stroke-dasharray=\"6,4\"/><text x=\"144\" y=\"333\" font-size=\"11\" fill=\"#1B1F27\" text-anchor=\"middle\">Tiempo (días)<\/text><line x1=\"268\" y1=\"207\" x2=\"284\" y2=\"207\" stroke=\"#1B1F27\" stroke-width=\"2\"/><text x=\"288\" y=\"212\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"start\">con pectinasa<\/text><line x1=\"268\" y1=\"229\" x2=\"284\" y2=\"229\" stroke=\"#1B1F27\" stroke-width=\"2\" stroke-dasharray=\"5,3\"/><text x=\"288\" y=\"234\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"start\">sin pectinasa<\/text><text x=\"364\" y=\"189\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"start\" font-weight=\"700\">Gráfica D<\/text><line x1=\"394\" y1=\"317\" x2=\"614\" y2=\"317\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><line x1=\"394\" y1=\"197\" x2=\"394\" y2=\"317\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><text transform=\"translate(384,257.0) rotate(-90)\" font-size=\"11\" fill=\"#5C6472\" text-anchor=\"middle\">Intensidad del color<\/text><polyline points=\"394,299 581,257\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"2\"/><polyline points=\"394,267 581,223\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"2\" stroke-dasharray=\"6,4\"/><text x=\"504\" y=\"333\" font-size=\"11\" fill=\"#1B1F27\" text-anchor=\"middle\">Tiempo (días)<\/text><line x1=\"628\" y1=\"207\" x2=\"644\" y2=\"207\" stroke=\"#1B1F27\" stroke-width=\"2\"/><text x=\"648\" y=\"212\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"start\">con pectinasa<\/text><line x1=\"628\" y1=\"229\" x2=\"644\" y2=\"229\" stroke=\"#1B1F27\" stroke-width=\"2\" stroke-dasharray=\"5,3\"/><text x=\"648\" y=\"234\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"start\">sin pectinasa<\/text><\/svg><\/figure><\/div><div class=\"ops cuatro\" id=\"icf41\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>Gráfica A<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>Gráfica B<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>Gráfica C<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Gráfica D<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf41\" data-k=\"B\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué dato lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la B.", "Por qué es la B: la hipótesis compara dos vinos —con y sin pectinasas— en intensidad del color y no habla del tiempo: se representa con dos barras, y la de «con pectinasa» va más alta (B). En A va más baja; C y D ponen el tiempo en el eje horizontal, y en D la línea «sin pectinasa» queda por encima.", "Que traduzcan la hipótesis pedazo por pedazo antes de mirar las gráficas: qué se compara, qué se mide, qué tiene que quedar más alto, y si dice algo del tiempo.", "Las gráficas se redibujaron desde una fotocopia en la que la barra «con pectinasa» de la A casi no se ve. La clave B no depende de la A.", "Aviso (baja), solo para ti: La barra «con pectinasa» de la gráfica A casi no se ve en la fotocopia: se redibujó. Qué haces: La clave B no depende de la A."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 2<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Dos viñedos lejanos<\/h3><p>Un comerciante compra dos viñedos en dos municipios lejanos entre sí, y tiene la hipótesis de que los vinos fabricados en estos dos municipios distantes van a tener la misma cantidad de pigmentos, porque se elaborarán con un mismo tipo de uva. Al buscar información, el comerciante encuentra que existen estudios en los que el número de pigmentos que producen los frutos de una misma planta varían, de acuerdo con la cantidad de agua con la que se riegan las plantas mientras se desarrollan.<\/p><\/div><div><p class=\"enun\">De acuerdo con lo anterior, ¿qué debería hacer el comerciante con su hipótesis?<\/p><div class=\"ops\" id=\"icf42\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>Cambiarla, porque condiciones ambientales como la cantidad de agua en el suelo, de luz o temperatura deben variar entre los municipios, lo cual produce que la cantidad de pigmentos generados en las uvas sea distinto.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>Mantenerla, porque la cantidad de pigmentos responsables del color depende únicamente de que el número de etapas y el tipo de fruta para la elaboración del vino sea el mismo, lo cual produce que la cantidad de pigmentos sea igual.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>Cambiarla, porque las uvas posiblemente no desarrollarán pigmentos si no se cultivan en un mismo viñedo.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Mantenerla, porque todos los vinos deben tener una cantidad similar de pigmentos, siempre y cuando pasen por la etapa de fermentación.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf42\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué dato lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la A.", "Por qué es la A: los estudios dicen que los pigmentos cambian con el agua de riego, y dos municipios lejanos casi seguro tienen distinta lluvia, suelo, luz y temperatura. La hipótesis no resiste la evidencia: hay que cambiarla (A). B y D la mantienen contra los estudios; C la cambia por una razón que los estudios no dan.", "La evidencia manda sobre la hipótesis, no al revés: lo que dicen los estudios se pone al frente de lo que supone el comerciante.", "La A es la más larga, como en el cuadernillo. No enseñes ese truco."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 3<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>El vino de manzana, en orden<\/h3><p>Del contexto que comparte con las otras preguntas del vino: «En general, para comercializar cualquier vino actualmente, el proceso debe cumplir las siguientes etapas: selección de la fruta, prensado, fermentación-añejamiento, filtración y envasado. La última etapa debe realizarse en recipientes lavados y desinfectados previamente».<\/p><p>Los elementos con los que cuenta el investigador: manzana · prensa · colador · levadura · botella sin desinfectar.<\/p><\/div><div><p class=\"enun\">Si un investigador cuenta con los siguientes elementos para preparar una bebida alcohólica a base de manzana, ¿cuál es el modelo que indicaría correctamente un proceso de producción que le permitiría comercializar el vino de manzana empleando todos estos elementos?<\/p><div class=\"ops\" id=\"icf43\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>Prensado de manzanas → fermentación y añejamiento (azúcar → etanol + dióxido de carbono) → filtración y envasado → lavado y desinfección de botellas → adición de levadura.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>Prensado de manzanas → filtración y envasado → adición de levadura → lavado y desinfección de botellas.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>Prensado de manzanas → adición de levadura → fermentación y añejamiento (azúcar → etanol + dióxido de carbono) → lavado y desinfección de botellas → filtración y envasado.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Prensado de manzanas → fermentación y añejamiento (azúcar → etanol + dióxido de carbono) → adición de levadura → filtración y envasado.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf43\" data-k=\"C\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué dato lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la C.", "Por qué es la C: la levadura es la que fermenta: tiene que entrar antes de la fermentación. Las botellas están sin desinfectar: hay que lavarlas antes de envasar. Prensado, levadura, fermentación, lavado, filtración y envasado (C). A agrega la levadura al final; B no fermenta; D fermenta antes de la levadura y no lava las botellas.", "Cada eslabón tiene que causar el siguiente: sin levadura no hay fermentación.", "En el cuadernillo las opciones son secuencias de dibujos; aquí van en texto con flechas."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 4<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Para qué le sirve la fotosíntesis a la planta<\/h3><p>La fotosíntesis se lleva a cabo en los cloroplastos de las células vegetales y consiste en la transformación de la energía proveniente de la luz en azúcares.<\/p><\/div><div><p class=\"enun\">La fotosíntesis es importante para las plantas porque<\/p><div class=\"ops\" id=\"icf44\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>aporta sales al ecosistema.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>aporta cloroplastos nuevos a las células vegetales.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>elimina el exceso de agua almacenada en los ecosistemas.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>produce los nutrientes necesarios para su desarrollo y crecimiento.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf44\" data-k=\"D\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué dato lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la D.", "Por qué es la D: los azúcares que fabrica la fotosíntesis son el alimento de la planta: con ellos crece y se desarrolla (D). A, B y C le atribuyen oficios que el texto no da: aportar sales, fabricar cloroplastos, eliminar agua.", "Para qué sirve cada pieza: el cloroplasto fabrica azúcar, y el azúcar es lo que la planta usa para crecer.", "La D es la más larga, como en el cuadernillo. ---"]}}, {"m": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m6)\">Cierre<\/span><span class=\"kicker\">La pregunta de siempre<\/span><\/div><h2>¿En qué se parecía la pregunta Saber 11 a la de tu libro?<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:#242478\"><div class=\"k\">1<\/div><div><b>¿Se puede poner a prueba?<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#5B3E96\"><div class=\"k\">2<\/div><div><b>El mecanismo, eslabón por eslabón<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#C9821B\"><div class=\"k\">3<\/div><div><b>Para qué sirve cada pieza<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#A82424\"><div class=\"k\">4<\/div><div><b>Lo que la evidencia respalda (y lo que no)<\/b><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--m6)\"><h3>Antes de salir<\/h3><ol class=\"pasos\"><li>El concepto del día —un proceso, una estructura o una relación—, en «Palabras que me frenaron», con tus palabras.<\/li><li>«Lo que me llevo de esta pregunta».<\/li><li>Tu carita de salida.<\/li><li>La casilla 4 de la portada del área.<\/li><\/ol><\/div><\/div>", "guia": {"obj": "Que el estudiante nombre la estrategia que usó y se lleve un concepto del día —un proceso, una estructura o una relación— escrito en sus propias palabras.", "decir": ["Socializa solo las preguntas que el grupo falló, pidiendo el dato o el eslabón que las resuelve.", "Pide que lean en voz alta su salvavidas: lo mínimo que sí tenían claro.", "Cada uno escribe el concepto del día en la franja «Palabras que me frenaron» de su hoja."], "como": "No dicta la definición. El concepto se escribe como el estudiante lo entendió; si quedó mal entendido, eso se ve en la hoja y se corrige la próxima clase.", "apoyo": ["La palabra nueva no se dicta. Si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase: es mejor que dictarla bien.", "Para el cierre del momento: Varias fuentes del libro (la cirugía fetal de 2025, la cifra de «hasta un 37 %» de memoria, el globo de Manizales) no se pudieron verificar. Trátalas como casos para razonar, no como datos para memorizar."]}}];

function paintClock(){
  var n = $("#tnum");
  if(!tBase){ n.textContent = "—"; n.classList.remove("over"); return; }
  var s = Math.abs(tLeft), mm = Math.floor(s/60), ss = s%60;
  n.textContent = (tLeft<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", tLeft<0);
}
function setTimer(min){
  tBase = min||0; tLeft = tBase*60; tOn = false;
  if(tick){ clearInterval(tick); tick = null; }
  $("#play").textContent = "Iniciar"; paintClock();
}
function toggleTimer(){
  if(!tBase) return;
  tOn = !tOn; $("#play").textContent = tOn ? "Pausar" : "Seguir";
  if(tick){ clearInterval(tick); tick = null; }
  if(tOn) tick = setInterval(function(){ tLeft--; paintClock(); }, 1000);
  paintClock();
}
function guiaHTML(g){
  if(!g) return '<p class="sub">Sin notas para esta diapositiva.</p>';
  var h = '<div class="gbox"><h4>Objetivo</h4><p>'+esc(g.obj)+'</p></div>';
  if(g.decir && g.decir.length) h += '<div class="gbox"><h4>Qué haces y qué dices</h4><ul>'+
     g.decir.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  if(g.como) h += '<div class="gbox como"><h4>Lo que no haces</h4><p>'+esc(g.como)+'</p></div>';
  if(g.apoyo && g.apoyo.length) h += '<div class="gbox apoyo"><h4>Si Biología no es tu fuerte</h4><ul>'+
     g.apoyo.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  return h;
}
function pintaElegidas(){
  var box = document.getElementById("elegidas"); if(!box) return;
  if(!elegidas.length){ box.innerHTML = '<p class="sub">Vuelve a la diapositiva anterior y escoge las cinco.</p>'; return; }
  box.innerHTML = elegidas.map(function(t,k){
    return '<div class="card edge" style="--accent:var(--m'+((k%6)+1)+')"><h3>'+(k+1)+'. '+esc(t)+'</h3>'+
      '<p class="sub">Busca esta pregunta en tu simulacro y en la hoja de taller de la misma estrategia.</p></div>';
  }).join("");
}
function go(n){
  var prev = SC[i];
  i = Math.max(0, Math.min(SC.length-1, n));
  var s = SC[i];
  wrap.innerHTML = s.html;
  wrap.classList.remove("enter"); void wrap.offsetWidth; wrap.classList.add("enter");
  stage.scrollTop = 0;
  var m = s.m!=null ? MOM[s.m] : null;
  $("#momdot").style.background = m ? "var("+m.c+")" : "var(--faint)";
  $("#momdot").textContent = m ? m.n : "·";
  $("#momnom").textContent = m ? m.nom : NOMBRE;
  $("#momsub").textContent = m ? (m.min+" minutos") : SUB;
  var want = s.min!=null ? s.min : (m ? m.min : 0);
  var cambio = !prev || prev===s || prev.m!==s.m || (prev.min||null)!==(s.min||null);
  if(cambio) setTimer(want);
  $("#count").textContent = (i+1)+" / "+SC.length;
  $("#prog i").style.width = (SC.length>1 ? i/(SC.length-1)*100 : 100)+"%";
  $("#guiabody").innerHTML = guiaHTML(s.guia);
  [].forEach.call(wrap.querySelectorAll("[data-pick]"), function(b){
    b.setAttribute("aria-pressed", elegidas.indexOf(b.textContent)>=0 ? "true" : "false"); });
  pintaElegidas();
}
wrap.addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.dataset.show){ var t = document.getElementById(b.dataset.show); if(t) t.hidden = !t.hidden; }
  if(b.dataset.showgrupo){
    var g = wrap.querySelectorAll('[data-grupo="'+b.dataset.showgrupo+'"]'), abrir = g.length && g[0].hidden;
    [].forEach.call(g, function(x){ x.hidden = !abrir; });
    b.textContent = abrir ? "Ocultar las claves" : "Revelar las claves";
  }
  if(b.dataset.clave){
    var box = document.getElementById(b.dataset.clave), ok = box.querySelector('[data-op="'+b.dataset.k+'"]');
    var on = ok && !ok.classList.contains("ok");
    [].forEach.call(box.querySelectorAll(".op"), function(o){ o.classList.remove("ok"); });
    if(on) ok.classList.add("ok");
    b.textContent = on ? "Ocultar la clave" : "Revelar la clave";
  }
  if(b.dataset.tally){ var n = document.getElementById(b.dataset.tally); n.textContent = (+n.textContent||0)+1; }
  if(b.dataset.reset){ [].forEach.call(wrap.querySelectorAll('[id^="'+b.dataset.reset+'"]'), function(x){
    if(x.classList.contains("n")) x.textContent = "0"; }); }
  if(b.dataset.pick!=null){
    var t = b.textContent, k = elegidas.indexOf(t);
    if(k>=0) elegidas.splice(k,1); else if(elegidas.length<5) elegidas.push(t);
    b.setAttribute("aria-pressed", elegidas.indexOf(t)>=0 ? "true" : "false");
  }
});
function setGuia(on){ $("#guia").classList.toggle("open", on); $("#scrim").classList.toggle("on", on);
  $("#gbtn").setAttribute("aria-pressed", on ? "true" : "false"); }
$("#next").addEventListener("click", function(){ go(i+1); });
$("#prev").addEventListener("click", function(){ go(i-1); });
$("#play").addEventListener("click", toggleTimer);
$("#reset").addEventListener("click", function(){ setTimer(tBase); });
$("#gbtn").addEventListener("click", function(){ setGuia(!$("#guia").classList.contains("open")); });
$("#gclose").addEventListener("click", function(){ setGuia(false); });
$("#scrim").addEventListener("click", function(){ setGuia(false); });
document.addEventListener("keydown", function(e){
  var t = e.target.tagName; if(t==="INPUT"||t==="TEXTAREA") return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ go(i+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ go(i-1); e.preventDefault(); }
  else if(e.key==="Home"){ go(0); e.preventDefault(); }
  else if(e.key==="End"){ go(SC.length-1); e.preventDefault(); }
  else if(e.key==="g"||e.key==="G"){ setGuia(!$("#guia").classList.contains("open")); }
  else if(e.key==="t"||e.key==="T"){ toggleTimer(); }
  else if(e.key==="Escape"){ setGuia(false); }
});
go(0);
})();
</script>
</body>
</html>
