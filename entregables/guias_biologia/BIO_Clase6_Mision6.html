\"170.2\" x2=\"343.0\" y2=\"177.2\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><line x1=\"310.0\" y1=\"178.0\" x2=\"310.0\" y2=\"186.0\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><line x1=\"281.0\" y1=\"170.2\" x2=\"277.0\" y2=\"177.2\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><line x1=\"259.8\" y1=\"149.0\" x2=\"252.8\" y2=\"153.0\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><line x1=\"252.0\" y1=\"120.0\" x2=\"244.0\" y2=\"120.0\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><line x1=\"259.8\" y1=\"91.0\" x2=\"252.8\" y2=\"87.0\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><line x1=\"281.0\" y1=\"69.8\" x2=\"277.0\" y2=\"62.8\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><line x1=\"310.0\" y1=\"62.0\" x2=\"310.0\" y2=\"54.0\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><line x1=\"339.0\" y1=\"69.8\" x2=\"343.0\" y2=\"62.8\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><line x1=\"360.2\" y1=\"91.0\" x2=\"367.2\" y2=\"87.0\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><line x1=\"310\" y1=\"120\" x2=\"310\" y2=\"72\" stroke=\"#1E2230\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"310\" y1=\"120\" x2=\"276\" y2=\"142\" stroke=\"#242478\" stroke-width=\"5\" stroke-linecap=\"round\"/><text x=\"310\" y=\"226\" text-anchor=\"middle\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"20\" fill=\"#1E2230\" font-weight=\"700\">generaciones<\/text><text x=\"310\" y=\"252\" text-anchor=\"middle\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"20\" fill=\"#242478\" font-weight=\"700\">herencia<\/text><\/svg><\/div><div><h3>El ambiente o la herencia<\/h3><p>Lo que un ser vivo vive o aprende cambia su cuerpo o su conducta, pero no su ADN, y no lo hereda. Lo que se hereda cambia en la población, generación tras generación, por selección.<\/p><span class=\"cv-f\">en una vida: ambiente   ·   en generaciones: herencia y selección<\/span><p class=\"cv-ej\"><b>Ejemplo:<\/b> un futbolista que entrena mucho gana músculo, pero sus hijos no nacen musculosos: ese cambio no pasó al ADN.<\/p><p class=\"cv-ojo\"><b>Ojo:<\/b> «se acostumbró y lo heredó» es el error clásico: lo adquirido en vida no pasa a los hijos.<\/p><div class=\"ctl\"><button class=\"btn\" data-cvback=\"cv60\" data-cvg=\"cv6\">← Volver al mapa<\/button><\/div><\/div><\/div><div class=\"cv-det\" id=\"cv61\" hidden style=\"--acc:#5B3E96\"><div><svg viewBox=\"0 0 420 300\" role=\"img\" aria-label=\"Helados y quemaduras suben juntos porque los dos dependen del sol\"><ellipse cx=\"210.0\" cy=\"286\" rx=\"176.4\" ry=\"10\" fill=\"#1E2230\" opacity=\".07\"/><circle cx=\"210\" cy=\"50\" r=\"24\" fill=\"#C9821B\" opacity=\".85\"/><text x=\"250\" y=\"58\" text-anchor=\"start\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"20\" fill=\"#C9821B\" font-weight=\"700\">sol<\/text><polyline points=\"40,200 100,180 160,150 220,130\" fill=\"none\" stroke=\"#5B3E96\" stroke-width=\"6\" stroke-linecap=\"round\"/><polyline points=\"230,215 290,199 350,171 400,151\" fill=\"none\" stroke=\"#1E2230\" stroke-width=\"6\" stroke-linecap=\"round\"/><text x=\"40\" y=\"230\" text-anchor=\"start\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"20\" fill=\"#5B3E96\" font-weight=\"700\">helados<\/text><text x=\"236\" y=\"244\" text-anchor=\"start\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"20\" fill=\"#1E2230\" font-weight=\"700\">quemaduras<\/text><path d=\"M196 72 L156 136 M157.5 122.1 L156 136 L167.8 128.5\" fill=\"none\" stroke=\"#C9821B\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M224 72 L306 168 M293.2 162.4 L306 168 L302.4 154.5\" fill=\"none\" stroke=\"#C9821B\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"210\" y=\"280\" text-anchor=\"middle\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"18\" fill=\"#1E2230\" font-weight=\"600\">suben juntas, pero una no causa la otra<\/text><\/svg><\/div><div><h3>Lo que los datos sí dejan concluir<\/h3><p>Una conclusión vale si los datos la sostienen: que dos cosas suban juntas no prueba que una cause la otra, y lo que pasó en un lugar no vale para todos. La mejor usa todos los datos que pide la pregunta.<\/p><span class=\"cv-f\">suben juntas ≠ una causa la otra<\/span><p class=\"cv-ej\"><b>Ejemplo:<\/b> en vacaciones de mitad de año se venden más helados y hay más quemaduras de sol: suben juntos, pero los helados no queman; los dos dependen del sol.<\/p><p class=\"cv-ojo\"><b>Ojo:<\/b> «demuestra», «siempre» o «todas» suelen pasarse de lo que los datos permiten.<\/p><div class=\"ctl\"><button class=\"btn\" data-cvback=\"cv61\" data-cvg=\"cv6\">← Volver al mapa<\/button><\/div><\/div><\/div><div class=\"cv-det\" id=\"cv62\" hidden style=\"--acc:#A82424\"><div><svg viewBox=\"0 0 420 300\" role=\"img\" aria-label=\"Torre de bloques: sale uno de abajo y los de arriba se inclinan\"><ellipse cx=\"210.0\" cy=\"286\" rx=\"176.4\" ry=\"10\" fill=\"#1E2230\" opacity=\".07\"/><polygon points=\"40,196 126,196 126,248 40,248\" fill=\"#EEF2F8\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><polygon points=\"126,196 144,185.2 144,237.2 126,248\" fill=\"#D3DCEA\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><polygon points=\"40,196 58,185.2 144,185.2 126,196\" fill=\"#EEF2F8\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><polygon points=\"130,196 216,196 216,248 130,248\" fill=\"#EEF2F8\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><polygon points=\"216,196 234,185.2 234,237.2 216,248\" fill=\"#D3DCEA\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><polygon points=\"130,196 148,185.2 234,185.2 216,196\" fill=\"#EEF2F8\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><rect x=\"238\" y=\"196\" width=\"80\" height=\"52\" fill=\"none\" stroke=\"#A82424\" stroke-width=\"3\" stroke-dasharray=\"7 6\"/><polygon points=\"336,214 396,214 396,256 336,256\" fill=\"#E9C8C8\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><polygon points=\"396,214 408,206.8 408,248.8 396,256\" fill=\"#D3DCEA\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><polygon points=\"336,214 348,206.8 408,206.8 396,214\" fill=\"#EEF2F8\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><path d=\"M270 236 L330 236 M317.4 242.1 L330 236 L317.4 229.9\" fill=\"none\" stroke=\"#A82424\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><g transform=\"rotate(7 175 175)\"><polygon points=\"85,140 171,140 171,192 85,192\" fill=\"#EEF2F8\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><polygon points=\"171,140 189,129.2 189,181.2 171,192\" fill=\"#D3DCEA\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><polygon points=\"85,140 103,129.2 189,129.2 171,140\" fill=\"#EEF2F8\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><polygon points=\"175,140 261,140 261,192 175,192\" fill=\"#EEF2F8\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><polygon points=\"261,140 279,129.2 279,181.2 261,192\" fill=\"#D3DCEA\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><polygon points=\"175,140 193,129.2 279,129.2 261,140\" fill=\"#EEF2F8\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><polygon points=\"130,84 216,84 216,136 130,136\" fill=\"#EEF2F8\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><polygon points=\"216,84 234,73.2 234,125.2 216,136\" fill=\"#D3DCEA\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><polygon points=\"130,84 148,73.2 234,73.2 216,84\" fill=\"#EEF2F8\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><\/g><text x=\"362\" y=\"282\" text-anchor=\"middle\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"18\" fill=\"#A82424\" font-weight=\"700\">una especie<\/text><text x=\"130\" y=\"40\" text-anchor=\"middle\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"18\" fill=\"#1E2230\" font-weight=\"600\">las de arriba se mueven<\/text><\/svg><\/div><div><h3>Si se cae una pieza del ecosistema<\/h3><p>Cuando un ecosistema pierde o gana una pieza (una especie, el hábitat, el clima), el efecto viaja por la red. Una especie invasora no tiene depredadores y crece sin control; una con un solo hábitat desaparece si lo pierde.<\/p><span class=\"cv-f\">cambio → quién lo sufre primero → quién después<\/span><p class=\"cv-ej\"><b>Ejemplo:<\/b> el caracol gigante africano llegó a Colombia sin depredadores: se riega rápido y se come cultivos y plantas nativas.<\/p><p class=\"cv-ojo\"><b>Ojo:<\/b> no mires solo la especie que se va o que llega: busca también a las que dependían de ella.<\/p><div class=\"ctl\"><button class=\"btn\" data-cvback=\"cv62\" data-cvg=\"cv6\">← Volver al mapa<\/button><\/div><\/div><\/div><div class=\"cv-det\" id=\"cv63\" hidden style=\"--acc:#C9821B\"><div><svg viewBox=\"0 0 420 300\" role=\"img\" aria-label=\"Un cactus con sus rasgos nombrados: espinas, tallo que guarda agua y raíces anchas\"><ellipse cx=\"210.0\" cy=\"286\" rx=\"176.4\" ry=\"10\" fill=\"#1E2230\" opacity=\".07\"/><line x1=\"30\" y1=\"214\" x2=\"300\" y2=\"214\" stroke=\"#C9D1DC\" stroke-width=\"3\"/><rect x=\"70\" y=\"92\" width=\"26\" height=\"74\" rx=\"13\" fill=\"#EFDABB\" stroke=\"#1E2230\" stroke-width=\"3\"/><rect x=\"80\" y=\"140\" width=\"50\" height=\"26\" rx=\"13\" fill=\"#EFDABB\" stroke=\"#1E2230\" stroke-width=\"3\"/><rect x=\"84\" y=\"143\" width=\"20\" height=\"20\" fill=\"#EFDABB\"/><path d=\"M80 216 Q60 236 34 238 M110 216 Q100 246 70 254 M190 216 Q214 240 250 244 M165 216 Q180 250 214 258\" fill=\"none\" stroke=\"#8A6A3A\" stroke-width=\"3.5\" stroke-linecap=\"round\"/><rect x=\"120\" y=\"50\" width=\"56\" height=\"166\" rx=\"28\" fill=\"#EFDABB\" stroke=\"#1E2230\" stroke-width=\"3\"/><line x1=\"126\" y1=\"70\" x2=\"116\" y2=\"64\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><line x1=\"170\" y1=\"90\" x2=\"180\" y2=\"84\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><line x1=\"126\" y1=\"120\" x2=\"116\" y2=\"114\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><line x1=\"170\" y1=\"150\" x2=\"180\" y2=\"144\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><line x1=\"126\" y1=\"180\" x2=\"116\" y2=\"174\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><line x1=\"182\" y1=\"86\" x2=\"232\" y2=\"70\" stroke=\"#1E2230\" stroke-width=\"1.8\"/><text x=\"236\" y=\"76\" text-anchor=\"start\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"18\" fill=\"#1E2230\" font-weight=\"700\">espinas<\/text><line x1=\"180\" y1=\"140\" x2=\"232\" y2=\"136\" stroke=\"#1E2230\" stroke-width=\"1.8\"/><text x=\"236\" y=\"142\" text-anchor=\"start\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"18\" fill=\"#1E2230\" font-weight=\"700\">tallo que guarda agua<\/text><line x1=\"250\" y1=\"242\" x2=\"268\" y2=\"242\" stroke=\"#1E2230\" stroke-width=\"1.8\"/><text x=\"272\" y=\"248\" text-anchor=\"start\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"18\" fill=\"#1E2230\" font-weight=\"700\">raíces anchas<\/text><text x=\"236\" y=\"104\" text-anchor=\"start\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"18\" fill=\"#6E7480\" font-weight=\"600\">pierde menos agua<\/text><text x=\"236\" y=\"166\" text-anchor=\"start\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"18\" fill=\"#6E7480\" font-weight=\"600\">para la sequía<\/text><\/svg><\/div><div><h3>Para qué le sirve ese rasgo<\/h3><p>Una adaptación es un rasgo que resuelve un problema del ambiente: frío, sequía, depredadores, falta de comida. Para explicarla se pone cada rasgo frente al problema que resuelve.<\/p><span class=\"cv-f\">rasgo → problema del ambiente que resuelve<\/span><p class=\"cv-ej\"><b>Ejemplo:<\/b> el cactus: espinas en vez de hojas (pierde menos agua), tallo grueso (guarda agua) y raíces anchas y poco hondas (atrapan rápido la lluvia).<\/p><p class=\"cv-ojo\"><b>Ojo:<\/b> el rasgo no aparece porque el animal lo necesite: ya existía, y los que lo tenían sobrevivieron más.<\/p><div class=\"ctl\"><button class=\"btn\" data-cvback=\"cv63\" data-cvg=\"cv6\">← Volver al mapa<\/button><\/div><\/div><\/div>", "guia": {"obj": "Ponerle nombre a lo que el grupo acaba de descubrir en la activación: una idea central y una por estrategia.", "decir": ["«Lo que acaban de descubrir tiene nombre». Toca la tarjeta del centro y dila en una frase.", "Abre solo la tarjeta de la estrategia 1: es la que se entrena ya en la dinámica. Las demás se abren cuando aparezcan en el taller: vuelve a esta diapositiva con ← cuando haga falta.", "Una frase por tarjeta, nada más. Si alguien pregunta algo largo: «lo vemos en la pregunta que toca»."], "como": "", "apoyo": ["Lo de las tarjetas está para reconocerlo en el taller, no para memorizarlo hoy.", "Los ejemplos son propios de la guía: no son los del libro, para que no resuelvan el taller por adelantado.", "La conceptualización se toma 3 de los 15 minutos de la Activación. Si la activación se alargó, pasa directo a la dinámica: el mapa sigue disponible para el cierre.", "Para comprobar la idea central: ¿Quién evoluciona: un individuo o una población? (la población)", "Estrategia 1 · El ambiente o la herencia: Una planta crece alta y delgada a la sombra. ¿Sus semillas, sembradas al sol, darán plantas así? (no: fue el ambiente)", "Estrategia 2 · Lo que los datos sí dejan concluir: El río con más árboles en la orilla tiene más peces. ¿Ya está probado que los árboles causan los peces? (no: falta un experimento)", "Estrategia 3 · Si se cae una pieza del ecosistema: Si llega una especie sin depredadores a un lugar con comida de sobra, ¿qué pasa con su población? (crece rápido, sin control)", "Estrategia 4 · Para qué le sirve ese rasgo: El oso polar tiene una capa gruesa de grasa bajo la piel. ¿Contra qué problema le sirve? (el frío)"]}}, {"m": 0, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#242478\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 1 · El ambiente o la herencia<\/span><\/div><h2>Dos relojes<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Dos zonas en el salón: EN LA VIDA DE UNO (el ambiente) y EN MUCHAS GENERACIONES (la herencia).<\/li><li>El docente lee cambios: «una persona se broncea en vacaciones», «los perros pequeños salieron de cruzar a los más pequeños por siglos», «un perro de finca corre más que uno de apartamento».<\/li><li>Cada estudiante camina a la zona que cree.<\/li><li>Para quedarse, responde: ¿eso pasa a los hijos? Si no puede decirlo, se cambia de zona.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Dos letreros<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno corto con tres preguntas —qué cambió, qué se midió y contra qué se compara— antes de explicarlo y antes de ver cualquier opción.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto o la gráfica en cinco minutos —seguir, comparar o ubicar—, pero con el cuerpo.»"], "como": "No explica el fenómeno ni acepta todavía explicaciones. Si alguien dice «es por las hormonas», le devuelve la pregunta: «¿qué dato te lo dice?». El cuaderno sigue cerrado.", "apoyo": ["Qué movimiento mental entrena: Separar lo que cambia en la vida de un individuo por el ambiente de lo que cambia en una población por herencia y selección. Es el movimiento de las preguntas 1, 2 y 3, y de la primera del entrenamiento (los ciclos de cuatro especies).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 1, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m2)\">Pregunta problematizadora<\/span><span class=\"kicker\">Libro abierto en la pregunta modelo<\/span><\/div><h2>Abran el libro en la pregunta 1, página 127<\/h2><p class=\"lead\">Antes de releer el texto o la gráfica: ¿cuál creen que es? Levanten la mano.<\/p><div class=\"ctl\"><button class=\"btn tally\" data-tally=\"h6A\">A <span class=\"n\" id=\"h6A\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h6B\">B <span class=\"n\" id=\"h6B\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h6C\">C <span class=\"n\" id=\"h6C\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h6D\">D <span class=\"n\" id=\"h6D\">0<\/span><\/button><button class=\"btn\" data-reset=\"h6\">↺<\/button><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta que gobierna el área<\/h3><p class=\"lead\">¿Qué dato —del texto, la tabla o la gráfica— respalda eso?<\/p><p class=\"sub\">Nadie justifica con «yo sé que» ni con lo que vio en internet: toda respuesta señala un renglón del texto, un número de la tabla o un punto de la gráfica.<\/p><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta de este momento<\/h3><p class=\"lead\">¿Esto cambió en la vida de un individuo o en la historia de la población?<\/p><\/div>", "guia": {"obj": "Que el estudiante compruebe que en Biología la respuesta sale del dato —del texto, la tabla o la gráfica— y no de lo que suena científico, usando la pregunta modelo del libro.", "decir": ["Presenta la pregunta modelo del libro y la deja a la vista todo el momento.", "Pide respuestas a mano alzada ANTES de releer el texto o la gráfica, y las anota en el tablero.", "Hace la pregunta que gobierna el área: ¿qué dato, del texto, la tabla o la gráfica, respalda eso?", "Revela la clave solo al final y trabaja por qué cae cada una de las otras tres."], "como": "Regla del momento: nadie justifica con «yo sé que» ni con lo que vio en internet. Toda intervención señala un renglón del texto, un número de la tabla o un punto de la gráfica.", "apoyo": ["La pregunta modelo es la 1 del libro (página 127). El cuaderno se abre en la página 202 solo en «mi primera idea».", "Cuenta las manos tocando cada letra: el número queda en pantalla y sirve para el final del momento, cuando el grupo vea cuántos cambiaron de opinión al volver al texto o a la gráfica.", "No digas la clave en este momento: sale en el bloque de las preguntas 1 y 2, después de llenar el instrumento en pantalla, casilla por casilla. Ahí se trabaja por qué cae cada una de las otras tres."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 1 y 2<\/span><span class=\"kicker\">En pantalla, casilla por casilla<\/span><\/div><h2>Preguntas 1 y 2: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 1<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · El ambiente o la herencia<\/span><\/div><p class=\"sub\">Perros de apartamento · una hipótesis evolutiva<\/p><h3 style=\"color:#242478\">Dos relojes: la vida de un perro y la historia de la raza<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k61\"><span class=\"keychip\" style=\"background:#242478\">D<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 2<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · El ambiente o la herencia<\/span><\/div><p class=\"sub\">Perros de apartamento · lo que muestra la tabla<\/p><h3 style=\"color:#242478\">Rasgo por rasgo: qué cambió y qué no<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k61\"><span class=\"keychip\" style=\"background:#242478\">A<\/span> es la clave del libro<\/div><div class=\"aviso sev-medi\" hidden data-grupo=\"k61\"><b>Ojo con esta clave:<\/b> En la tabla el autocontrol fue alto en los dos grupos: no cambió. La clave A dice que sí; es la menos mala de las cuatro.<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k61\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué dato escribieron en el instrumento? Léanmelo.»", "Si alguien se traba, pregúntale qué cambió y contra qué lo compara. Si el instrumento está vacío, vuelve al texto o a la gráfica antes que a las opciones."], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Las claves del libro son 1·D y 2·A. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 1 · aviso del libro (media), solo para ti, no se proyecta: Pide una «hipótesis evolutiva» sobre un experimento de seis meses: eso es ambiente, no evolución. La clave D sale de la frase introductoria. Qué haces: Separa los dos relojes, como el instrumento.", "Pregunta 2 · aviso del libro (atención), solo para ti, no se proyecta: Preguntan casi lo mismo y repiten los distractores. Qué haces: Úsalo para ver si el instrumento se llena igual las dos veces.", "Pregunta 2 · aviso del libro (media): En la tabla el autocontrol fue alto en los dos grupos: no cambió. La clave A dice que sí; es la menos mala de las cuatro. Qué haces: Es la menos mala. Que comparen rasgo por rasgo."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 3 y 4<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 3 y 4: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 3<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · El ambiente o la herencia<\/span><\/div><p class=\"sub\">Perros de apartamento · la conclusión del experimento<\/p><h3 style=\"color:#242478\">El tablero del experimento: qué se movió y qué se dejó quieto<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k63\"><span class=\"keychip\" style=\"background:#242478\">A<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 4<\/span><span class=\"min\" style=\"--accent:#C9821B\">E4 · Para qué le sirve ese rasgo<\/span><\/div><p class=\"sub\">Fósiles marinos de Sáchica · el ecosistema del Cretácico<\/p><h3 style=\"color:#C9821B\">Tres fósiles, tres oficios en el mismo mar<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k63\"><span class=\"keychip\" style=\"background:#C9821B\">B<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k63\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué dato escribieron en el instrumento? Léanmelo.»", "Si alguien se traba, pregúntale qué cambió y contra qué lo compara. Si el instrumento está vacío, vuelve al texto o a la gráfica antes que a las opciones."], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Las claves del libro son 3·A y 4·B. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 3 · aviso del libro (atención), solo para ti, no se proyecta: Preguntan casi lo mismo y repiten los distractores. Qué haces: Úsalo para ver si el instrumento se llena igual las dos veces."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#5B3E96\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 2 · Lo que los datos sí dejan concluir<\/span><\/div><h2>Hasta donde llega la tabla<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>El docente escribe una tabla: tres canchas del colegio con 2, 5 y 8 horas de sol, y pasto de 5, 9 y 12 centímetros.<\/li><li>Lee conclusiones: «la cancha con más sol tiene el pasto más alto», «el sol hace crecer el pasto en todas las ciudades», «el pasto de la cancha 2 es de otra especie».<\/li><li>Cada estudiante se para a un lado de una línea: LO DEJA CONCLUIR o NO LO DICE.<\/li><li>Para quedarse en el primer lado, dice qué filas y columnas usa; si usa otra, se cambia.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Tablero · cinta<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto o la gráfica en cinco minutos —seguir, comparar o ubicar—, pero con el cuerpo.»"], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Aceptar solo la conclusión que usa las filas y columnas que de verdad están en los datos, y todas las que pide el enunciado. Es el movimiento de las preguntas 7 y 10, y de la segunda del entrenamiento (el orden para vender las frutas).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 5 y 6<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 5 y 6: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 5<\/span><span class=\"min\" style=\"--accent:#A82424\">E3 · Si se cae una pieza del ecosistema<\/span><\/div><p class=\"sub\">Bramble Cay melomys · por qué se extinguió<\/p><h3 style=\"color:#A82424\">Una isla, un solo hogar y el mar que sube<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k65\"><span class=\"keychip\" style=\"background:#A82424\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 6<\/span><span class=\"min\" style=\"--accent:#A82424\">E3 · Si se cae una pieza del ecosistema<\/span><\/div><p class=\"sub\">Pez león en el Caribe · una especie invasora<\/p><h3 style=\"color:#A82424\">La red del arrecife con un invitado sin enemigos<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k65\"><span class=\"keychip\" style=\"background:#A82424\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k65\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué dato escribieron en el instrumento? Léanmelo.»", "Si alguien se traba, pregúntale qué cambió y contra qué lo compara. Si el instrumento está vacío, vuelve al texto o a la gráfica antes que a las opciones."], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Las claves del libro son 5·B y 6·A. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 5 · aviso del libro (baja), solo para ti, no se proyecta: El texto dice que la extinción se declaró en 2015; según información pública, el registro en la Lista Roja fue en 2016 y la declaración del gobierno australiano en 2019. Qué haces: No afecta la clave B. No des la fecha como dato."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#A82424\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 3 · Si se cae una pieza del ecosistema<\/span><\/div><h2>El dominó del cultivo<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Seis estudiantes en fila con un cartel: PLAGUICIDA, ABEJAS, FLORES POLINIZADAS, FRUTOS, AVES QUE LOS COMEN y SEMILLAS LLEVADAS LEJOS.<\/li><li>El primero le toca el hombro al segundo, que dice qué le pasa con una frase: «las abejas mueren».<\/li><li>Cada uno se agacha solo si puede decir por qué lo de atrás lo afecta; si no puede, se queda de pie y la cadena se corta ahí.<\/li><li>El grupo nombra el último que se agachó: es el efecto más lejano que se puede afirmar.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Seis carteles<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto o la gráfica en cinco minutos —seguir, comparar o ubicar—, pero con el cuerpo.»"], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Seguir el efecto de quitar una pieza, eslabón por eslabón, hasta el último que de verdad se puede afirmar. Es el movimiento de las preguntas 5, 6 y 9, y de la tercera del entrenamiento (por qué el agua estancada importa).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 7 y 8<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 7 y 8: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 7<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E2 · Lo que los datos sí dejan concluir<\/span><\/div><p class=\"sub\">Frailejones · tres páramos comparados<\/p><h3 style=\"color:#5B3E96\">Tres páramos en barras: ¿suben juntas las columnas?<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k67\"><span class=\"keychip\" style=\"background:#5B3E96\">C<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 8<\/span><span class=\"min\" style=\"--accent:#C9821B\">E4 · Para qué le sirve ese rasgo<\/span><\/div><p class=\"sub\">Frailejones · cómo sobreviven en el páramo<\/p><h3 style=\"color:#C9821B\">El frailejón por partes: cada rasgo contra un problema<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k67\"><span class=\"keychip\" style=\"background:#C9821B\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k67\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué dato escribieron en el instrumento? Léanmelo.»", "Si alguien se traba, pregúntale qué cambió y contra qué lo compara. Si el instrumento está vacío, vuelve al texto o a la gráfica antes que a las opciones."], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Las claves del libro son 7·C y 8·A. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 8 · aviso del libro (baja), solo para ti, no se proyecta: Pregunta por un «proceso» y las opciones describen rasgos. Qué haces: No cambia la clave A."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#C9821B\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 4 · Para qué le sirve ese rasgo<\/span><\/div><h2>El rasgo y su problema<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Cuatro carteles en la pared son problemas de un ambiente: FRÍO DE NOCHE, SOL FUERTE, POCA AGUA y DEPREDADORES.<\/li><li>Cada estudiante recibe un rasgo: «pelo grueso», «hojas pequeñas y cerosas», «espinas», «color del suelo», «raíces profundas».<\/li><li>Camina al cartel del problema que ese rasgo resuelve.<\/li><li>Para quedarse, dice cómo lo resuelve —qué evita o qué consigue— en una frase.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cuatro carteles · tarjetas de rasgos<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto o la gráfica en cinco minutos —seguir, comparar o ubicar—, pero con el cuerpo.»"], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Unir cada rasgo con el problema del ambiente que resuelve, y decir cómo. Es el movimiento de las preguntas 4 y 8, y de la cuarta del entrenamiento (para qué llevar azúcar a la raíz).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 9 y 10<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 9 y 10: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 9<\/span><span class=\"min\" style=\"--accent:#A82424\">E3 · Si se cae una pieza del ecosistema<\/span><\/div><p class=\"sub\">Frailejones · el efecto de los incendios<\/p><h3 style=\"color:#A82424\">El dominó del páramo después del fuego<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k69\"><span class=\"keychip\" style=\"background:#A82424\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 10<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E2 · Lo que los datos sí dejan concluir<\/span><\/div><p class=\"sub\">Frailejones · la conclusión más consistente<\/p><h3 style=\"color:#5B3E96\">Cada conclusión, con los páramos que de verdad usa<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k69\"><span class=\"keychip\" style=\"background:#5B3E96\">D<\/span> es la clave del libro<\/div><div class=\"aviso sev-alta\" hidden data-grupo=\"k69\"><b>Ojo con esta clave:<\/b> Dos opciones se pueden defender: la B también es consistente con la tabla. La clave D es la que usa la comparación de los tres páramos que pide el enunciado. Si marcaste B con argumentos, leíste bien.<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k69\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —el dato, la comparación, el eslabón o el oficio— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué dato escribieron en el instrumento? Léanmelo.»", "Si alguien se traba, pregúntale qué cambió y contra qué lo compara. Si el instrumento está vacío, vuelve al texto o a la gráfica antes que a las opciones."], "como": "No explica el fenómeno antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y contra qué lo compara; si el instrumento está vacío, lo devuelve al texto o a la gráfica antes que a las opciones.", "apoyo": ["Las claves del libro son 9·B y 10·D. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 10 · aviso del libro (alta): Dos opciones se pueden defender: la B también es consistente con la tabla. La clave D es la que usa la comparación de los tres páramos que pide el enunciado. Si marcaste B con argumentos, leíste bien. Qué haces: Clave tomada: D. Si alguien marca B con argumentos, reconócelo."]}}, {"m": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m4)\">Reto en equipo · 20 min<\/span><span class=\"kicker\">Equipos de tres · cada uno responde en su cuaderno<\/span><\/div><h2>Reto del corte: Las mariposas del parque<\/h2><div class=\"card big edge mt\" style=\"--accent:var(--m4)\"><p class=\"lead\">Cada equipo trabaja la actividad de aula del libro: en un parque conviven mariposas de alas claras y de alas oscuras, y los muros se oscurecen por la contaminación. El docente da dos datos: de cada 100 mariposas, 80 eran claras al principio y 30 veinte años después. En doce minutos separan qué cambió en la vida de cada mariposa y qué en la población, escriben solo la conclusión que esos datos permiten, encadenan qué le pasa a un pájaro que las come y dicen para qué le sirve el color. Cada uno cierra: «Las oscuras aumentaron porque ___, y eso no quiere decir que ___».<\/p><\/div><div class=\"note mt\" style=\"--accent:var(--m4)\"><b>La defensa:<\/b> tres minutos por equipo, señalando el dato, el grupo de comparación o el eslabón que los respalda. «Es que así funciona» no cuenta.<\/div>", "guia": {"obj": "Que el estudiante defienda su explicación con el dato en la mano y acepte que otro equipo puede ver una variable o un eslabón que él no vio.", "decir": ["Arma equipos de tres y entrega el reto del corte de este momento.", "Exige que cada integrante llegue con su instrumento YA diligenciado individualmente.", "Da tres minutos de defensa por equipo: señalan el dato, la comparación o el eslabón que los respalda.", "Cierra mostrando qué variable o qué eslabón quedó por fuera en cada propuesta."], "como": "El equipo discute, pero cada uno escribe en SU tarjeta del reto. No se acepta una defensa que diga «es que así funciona»: se nombra el dato, el grupo de comparación o el paso del proceso.", "apoyo": ["El reto no tiene una sola respuesta correcta: gana el equipo que mejor sostiene la suya con datos. Si dos explicaciones están sostenidas, dilo: eso también es hacer ciencia.", "Si un equipo entrega una sola hoja para los tres, el reto no cuenta. La discusión es compartida; el registro es individual.", "Cierra mostrando qué variable o qué eslabón quedó por fuera en cada propuesta."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 1<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Ciclos de cuatro especies<\/h3><p>En el grupo de los mamíferos se presentan dos tipos de ciclos reproductivos: el menstrual (de 24 a 35 días), exclusivo de primates y humanos; y el ciclo estral (entre estaciones), en el resto de mamíferos. La diferencia entre estos dos tipos de ciclos radica en el periodo de receptividad sexual. En el ciclo estral, la hembra solo es sexualmente receptiva durante el estro u ovulación; en el ciclo menstrual, la hembra muestra receptividad sexual durante casi todo el ciclo.<\/p><p>En la tabla se muestran la duración en días de algunos ciclos reproductivos de especies de mamíferos.<\/p><figure class=\"fig\"><table class=\"tabla\"><thead><tr><th>Especie<\/th><th>Nombre científico<\/th><th>Ciclo (días)<\/th><th>Ciclos al año<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Ateles belzebuth<\/td><td>24 - 27<\/td><td>12<\/td><\/tr><tr><td>2<\/td><td>Bos primigenius taurus<\/td><td>21 - 23<\/td><td>6<\/td><\/tr><tr><td>3<\/td><td>Equus ferus caballus<\/td><td>23 - 26<\/td><td>4<\/td><\/tr><tr><td>4<\/td><td>Papio hamadryas<\/td><td>31 - 35<\/td><td>11<\/td><\/tr><\/tbody><\/table><\/figure><\/div><div><p class=\"enun\">Con base en la información anterior, ¿cuáles corresponden a ciclos menstruales?<\/p><div class=\"ops\" id=\"icf61\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>Los de las especies 1 y 4.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>Los de las especies 1 y 3.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>Los de las especies 2 y 3.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Los de las especies 3 y 4.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf61\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué dato lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la A.", "Por qué es la A: el ciclo menstrual dura de 24 a 35 días, es de primates y se repite casi cada mes. Especie 1 (Ateles belzebuth, un mono araña): 24 a 27 días, 12 ciclos al año. Especie 4 (Papio hamadryas, un babuino): 31 a 35 días, 11 al año. Las especies 2 (la vaca) y 3 (el caballo) tienen pocos ciclos al año, por temporadas: son estrales (A).", "La especie 3 dura de 23 a 26 días, que se cruza con el rango menstrual: decide el número de ciclos al año y el grupo de animal.", "El cuadernillo trae dos gráficas de hormonas que no se necesitan para responder; no van en pantalla.", "Es biología: vocabulario correcto, sin bromas y sin casos personales."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 2<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Etileno y orden de venta<\/h3><p>Algunos mercaderes de frutas utilizan el etileno, una hormona vegetal que promueve la maduración del fruto, para lograr frutos más jugosos en corto tiempo. Sin embargo, un tiempo prolongado de exposición a esta hormona disminuye la vida útil del fruto porque se pudre más rápido. Debido a esto, los mercaderes calcularon el tiempo de exposición necesario para la maduración del fruto sin que este se pudra. Sus resultados se muestran en la tabla.<\/p><figure class=\"fig\"><table class=\"tabla\"><thead><tr><th>Fruto<\/th><th>Tiempo de exposición al etileno<\/th><\/tr><\/thead><tbody><tr><td>Piña<\/td><td>5 días y 2 horas<\/td><\/tr><tr><td>Mango<\/td><td>4 días y 24 minutos<\/td><\/tr><tr><td>Banano<\/td><td>2 días y 10 horas<\/td><\/tr><tr><td>Aguacate<\/td><td>3 días y 21 horas<\/td><\/tr><tr><td>Guayaba<\/td><td>2 días y 3 horas<\/td><\/tr><\/tbody><\/table><\/figure><\/div><div><p class=\"enun\">Si un mercader expone todos los frutos en bodega al etileno, ¿cuál debe ser el orden, del tiempo más cercano al más lejano, en que deben venderse las frutas para que no se pudran y no se pierdan en el negocio?<\/p><div class=\"ops\" id=\"icf62\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>Piña, mango, aguacate, banano, guayaba.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>Aguacate, mango, piña, guayaba, banano.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>Banano, aguacate, guayaba, piña, mango.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Guayaba, banano, aguacate, mango, piña.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf62\" data-k=\"D\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué dato lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la D.", "Por qué es la D: todo en horas: guayaba 51, banano 58, aguacate 93, mango 96 (4 días y 24 minutos), piña 122. Se vende primero la que madura antes (D).", "El mango y el aguacate son la trampa: «4 días y 24 minutos» contra «3 días y 21 horas». Pasados a horas: 96,4 contra 93. Todo en la misma unidad antes de ordenar.", "La A es el orden al revés: del más lejano al más cercano."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 3<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Menos agua estancada<\/h3><p>El dengue es una enfermedad tropical producida por la infección con el virus Flavivirus, que se transmite a través de las picaduras de algunos mosquitos hembra del género Aedes. Este tipo de mosquito se reproduce principalmente en aguas estancadas. Algunas de las medidas que recomiendan las entidades estatales para disminuir el caso de personas infectadas son:<\/p><p>• Tapar los recipientes con agua al aire libre; eliminar llantas, botellas, barriles u otros recipientes que puedan retener agua.<\/p><p>• Usar insecticidas para mosquitos.<\/p><p>Investigaciones recientes han demostrado que algunas especies de adultos de mosquito del género Aedes son más resistentes que otras a algunos insecticidas, sin importar su concentración, de manera que el uso de estos no garantiza un 100% de protección frente al dengue.<\/p><\/div><div><p class=\"enun\">Teniendo en cuenta lo anterior, ¿por qué reducir el número de lugares donde el agua se estanca es un buen método de prevención contra el dengue?<\/p><div class=\"ops\" id=\"icf63\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>Porque al reducir el número de lugares donde el agua se estanca, disminuirán los casos de personas infectadas por beber este tipo de agua.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>Porque al reducir el número de lugares donde el agua se estanca, disminuirán los hábitats del mosquito y, por tanto, no habrá tantas picaduras de mosquito que transmitan el virus a las personas.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>Porque al reducir el número de lugares donde el agua se estanca, el agua no producirá mal olor y se favorecerá el crecimiento y reproducción de los mosquitos.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Porque al reducir el número de lugares donde el agua se estanca, disminuirán los hábitats del virus y, por tanto, estos empezarán a infectar a las personas directamente sin necesitar de los mosquitos.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf63\" data-k=\"B\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué dato lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la B.", "Por qué es la B: el mosquito se reproduce en agua estancada. Menos agua estancada, menos lugares para poner huevos, menos mosquitos, menos picaduras que transmitan el virus (B). A dice que el dengue se contagia bebiendo agua; C dice que se favorece a los mosquitos; D dice que el virus infectaría sin mosquito.", "Quitar una pieza del ecosistema: el lugar donde crecen las larvas. Que encadenen hasta las picaduras.", "La B es la más larga, como en el cuadernillo."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 4<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Azúcar para la raíz<\/h3><p>Las plantas vasculares poseen un sistema de transporte de los productos fotosintéticos (azúcares) llamado floema. El floema transporta estos productos desde las hojas hasta los órganos subterráneos y de reserva, como las raíces, los tubérculos y los frutos.<\/p><\/div><div><p class=\"enun\">Con base en la información anterior, ¿por qué es importante que se lleve a cabo el transporte de azúcares a estos órganos de la planta?<\/p><div class=\"ops\" id=\"icf64\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>Porque permite que los azúcares se movilicen a los órganos no fotosintéticos y les provea energía.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>Porque aporta azúcares a las raíces y expulsa dióxido de carbono por los frutos en el momento de la fotosíntesis.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>Porque permite que las raíces, los tubérculos y los frutos conduzcan el azúcar hacia las hojas para que realicen la fotosíntesis.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Porque aporta las sustancias necesarias para que las raíces, los tubérculos y los frutos realicen la fotosíntesis.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf64\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué dato lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la A.", "Por qué es la A: las raíces, los tubérculos y los frutos no hacen fotosíntesis: el azúcar les llega por el floema y es su fuente de energía (A). B dice que los frutos expulsan CO₂ en la fotosíntesis; C invierte la dirección del transporte; D dice que esos órganos hacen fotosíntesis.", "Quién fabrica el azúcar (la hoja) y quién lo gasta (raíz, tubérculo, fruto): el floema los une."]}}, {"m": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m6)\">Cierre<\/span><span class=\"kicker\">La pregunta de siempre<\/span><\/div><h2>¿En qué se parecía la pregunta Saber 11 a la de tu libro?<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:#242478\"><div class=\"k\">1<\/div><div><b>El ambiente o la herencia<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#5B3E96\"><div class=\"k\">2<\/div><div><b>Lo que los datos sí dejan concluir<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#A82424\"><div class=\"k\">3<\/div><div><b>Si se cae una pieza del ecosistema<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#C9821B\"><div class=\"k\">4<\/div><div><b>Para qué le sirve ese rasgo<\/b><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--m6)\"><h3>Antes de salir<\/h3><ol class=\"pasos\"><li>El concepto del día —un proceso, una estructura o una relación—, en «Palabras que me frenaron», con tus palabras.<\/li><li>«Lo que me llevo de esta pregunta».<\/li><li>Tu carita de salida.<\/li><li>La casilla 6 de la portada del área.<\/li><\/ol><\/div><\/div>", "guia": {"obj": "Que el estudiante nombre la estrategia que usó y se lleve un concepto del día —un proceso, una estructura o una relación— escrito en sus propias palabras.", "decir": ["Socializa solo las preguntas que el grupo falló, pidiendo el dato o el eslabón que las resuelve.", "Pide que lean en voz alta su salvavidas: lo mínimo que sí tenían claro.", "Cada uno escribe el concepto del día en la franja «Palabras que me frenaron» de su hoja."], "como": "No dicta la definición. El concepto se escribe como el estudiante lo entendió; si quedó mal entendido, eso se ve en la hoja y se corrige la próxima clase.", "apoyo": ["La palabra nueva no se dicta. Si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase: es mejor que dictarla bien.", "Para el cierre del momento: En la pregunta 2 la clave dice que hubo respuesta en «autocontrol», pero en la tabla el autocontrol fue alto en los dos grupos: es la menos mala. La lección de cierre del área: una conclusión vale lo que valen los datos que de verdad usa."]}}];
var MOM = [{"n": 1, "nom": "Activación", "min": 15, "c": "--m1"}, {"n": 2, "nom": "Pregunta problematizadora", "min": 20, "c": "--m2"}, {"n": 3, "nom": "Desarrollo guiado", "min": 35, "c": "--m3"}, {"n": 4, "nom": "Reto en equipo", "min": 20, "c": "--m4"}, {"n": 5, "nom": "Evaluación individual", "min": 20, "c": "--m5"}, {"n": 6, "nom": "Cierre", "min": 10, "c": "--m6"}];
var NOMBRE = document.getElementById("momnom").textContent, SUB = document.getElementById("momsub").textContent;
var $ = function(s){ return document.querySelector(s); };
var wrap = $("#wrap"), stage = $("#stage"), i = 0;
var tBase = 0, tLeft = 0, tOn = false, tick = null;
var elegidas = [];
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function paintClock(){
  var n = $("#tnum");
  if(!tBase){ n.textContent = "—"; n.classList.remove("over"); return; }
  var s = Math.abs(tLeft), mm = Math.floor(s/60), ss = s%60;
  n.textContent = (tLeft<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", tLeft<0);
}
function setTimer(min){
  tBase = min||0; tLeft = tBase*60; tOn = false;
  if(tick){ clearInterval(tick); tick = null; }
  $("#play").textContent = "Iniciar"; paintClock();
}
function toggleTimer(){
  if(!tBase) return;
  tOn = !tOn; $("#play").textContent = tOn ? "Pausar" : "Seguir";
  if(tick){ clearInterval(tick); tick = null; }
  if(tOn) tick = setInterval(function(){ tLeft--; paintClock(); }, 1000);
  paintClock();
}
// cronómetro de la prueba (clase 7): aparte del de la barra, no se reinicia al cambiar de diapositiva
var EX = {base:0, left:0, on:false, t:null, ini:null};
function hhmm(d){ return d.getHours() + ":" + (d.getMinutes()<10?"0":"") + d.getMinutes(); }
function exPaint(){
  var box = wrap.querySelector("[data-examen]"); if(!box) return;
  if(!EX.base){ EX.base = +box.dataset.examen; EX.left = EX.base*60; }
  var s = Math.abs(EX.left), mm = Math.floor(s/60), ss = s%60;
  var n = box.querySelector("[data-exnum]");
  n.textContent = (EX.left<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", EX.left<0);
  box.querySelector("[data-exini]").textContent = EX.ini ? hhmm(EX.ini) : "—";
  box.querySelector("[data-exfin]").textContent = EX.on ? hhmm(new Date(Date.now() + EX.left*1000)) : (EX.ini ? "en pausa" : "—");
  var p = box.querySelector('[data-ex="play"]');
  p.textContent = EX.on ? "Pausar" : (EX.ini ? "Seguir" : "Iniciar la prueba");
}
function exToggle(){
  if(!EX.base) exPaint();
  EX.on = !EX.on;
  if(EX.t){ clearInterval(EX.t); EX.t = null; }
  if(EX.on){ if(!EX.ini) EX.ini = new Date(); EX.t = setInterval(function(){ EX.left--; exPaint(); }, 1000); }
  exPaint();
}
function exReset(){
  if(EX.ini && !window.confirm("¿Volver a poner el cronómetro de la prueba en cero?")) return;
  if(EX.t){ clearInterval(EX.t); EX.t = null; }
  EX.on = false; EX.ini = null; EX.left = EX.base*60; exPaint();
}
// casillas que llena el profe (clase 8): se guardan mientras la página esté abierta
var CAMPOS = {};
function pintaCampos(){
  [].forEach.call(wrap.querySelectorAll("[data-campo]"), function(x){ x.value = CAMPOS[x.dataset.campo] || ""; });
  [].forEach.call(wrap.querySelectorAll("[data-eco]"), function(x){ x.textContent = CAMPOS[x.dataset.eco] || "—"; });
}
function guiaHTML(g){
  if(!g) return '<p class="sub">Sin notas para esta diapositiva.</p>';
  var h = '<div class="gbox"><h4>Objetivo</h4><p>'+esc(g.obj)+'</p></div>';
  if(g.decir && g.decir.length) h += '<div class="gbox"><h4>Qué haces y qué dices</h4><ul>'+
     g.decir.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  if(g.como) h += '<div class="gbox como"><h4>Lo que no haces</h4><p>'+esc(g.como)+'</p></div>';
  if(g.apoyo && g.apoyo.length) h += '<div class="gbox apoyo"><h4>Si Biología no es tu fuerte</h4><ul>'+
     g.apoyo.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  return h;
}
function pintaElegidas(){
  var box = document.getElementById("elegidas"); if(!box) return;
  if(!elegidas.length){ box.innerHTML = '<p class="sub">Vuelve a la diapositiva anterior y escoge las cinco.</p>'; return; }
  box.innerHTML = elegidas.map(function(t,k){
    return '<div class="card edge" style="--accent:var(--m'+((k%6)+1)+')"><h3>'+(k+1)+'. '+esc(t)+'</h3>'+
      '<p class="sub">Busca esta pregunta en tu simulacro y en la hoja de taller de la misma estrategia.</p></div>';
  }).join("");
}
function go(n){
  var prev = SC[i];
  i = Math.max(0, Math.min(SC.length-1, n));
  var s = SC[i];
  wrap.innerHTML = s.html;
  wrap.classList.remove("enter"); void wrap.offsetWidth; wrap.classList.add("enter");
  stage.scrollTop = 0;
  var m = s.m!=null ? MOM[s.m] : null;
  $("#momdot").style.background = m ? "var("+m.c+")" : "var(--faint)";
  $("#momdot").textContent = m ? m.n : "·";
  $("#momnom").textContent = m ? m.nom : NOMBRE;
  $("#momsub").textContent = m ? (m.min+" minutos") : SUB;
  var want = s.min!=null ? s.min : (m ? m.min : 0);
  var cambio = !prev || prev===s || prev.m!==s.m || (prev.min||null)!==(s.min||null);
  if(cambio) setTimer(want);
  $("#count").textContent = (i+1)+" / "+SC.length;
  $("#prog i").style.width = (SC.length>1 ? i/(SC.length-1)*100 : 100)+"%";
  $("#guiabody").innerHTML = guiaHTML(s.guia);
  [].forEach.call(wrap.querySelectorAll("[data-pick]"), function(b){
    b.setAttribute("aria-pressed", elegidas.indexOf(b.textContent)>=0 ? "true" : "false"); });
  pintaElegidas();
  pintaCampos();
  exPaint();
  $("#clock").style.visibility = wrap.querySelector("[data-examen]") ? "hidden" : "";   // la prueba tiene su reloj
}
wrap.addEventListener("input", function(e){
  var x = e.target; if(!x.dataset || !x.dataset.campo) return;
  CAMPOS[x.dataset.campo] = x.value;
});
wrap.addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.dataset.ex==="play") exToggle();
  if(b.dataset.ex==="reset") exReset();
  if(b.dataset.show){ var t = document.getElementById(b.dataset.show); if(t) t.hidden = !t.hidden; }
  if(b.dataset.showgrupo){
    var g = wrap.querySelectorAll('[data-grupo="'+b.dataset.showgrupo+'"]'), abrir = g.length && g[0].hidden;
    [].forEach.call(g, function(x){ x.hidden = !abrir; });
    b.textContent = abrir ? "Ocultar las claves" : "Revelar las claves";
  }
  if(b.dataset.clave){
    var box = document.getElementById(b.dataset.clave), ok = box.querySelector('[data-op="'+b.dataset.k+'"]');
    var on = ok && !ok.classList.contains("ok");
    [].forEach.call(box.querySelectorAll(".op"), function(o){ o.classList.remove("ok"); });
    if(on) ok.classList.add("ok");
    b.textContent = on ? "Ocultar la clave" : "Revelar la clave";
  }
  if(b.dataset.tally){ var n = document.getElementById(b.dataset.tally); n.textContent = (+n.textContent||0)+1; }
  if(b.dataset.reset){ [].forEach.call(wrap.querySelectorAll('[id^="'+b.dataset.reset+'"]'), function(x){
    if(x.classList.contains("n")) x.textContent = "0"; }); }
  if(b.dataset.pick!=null){
    var t = b.textContent, k = elegidas.indexOf(t);
    if(k>=0) elegidas.splice(k,1); else if(elegidas.length<5) elegidas.push(t);
    b.setAttribute("aria-pressed", elegidas.indexOf(t)>=0 ? "true" : "false");
  }
});

wrap.addEventListener("click", function(e){
  var b = e.target.closest("[data-cv]"), v = e.target.closest("[data-cvback]");
  if(b){ var d = document.getElementById(b.dataset.cv), m = document.getElementById(b.dataset.cvg);
    if(d && m){ m.hidden = true; d.hidden = false; } }
  if(v){ var d2 = document.getElementById(v.dataset.cvback), m2 = document.getElementById(v.dataset.cvg);
    if(d2 && m2){ d2.hidden = true; m2.hidden = false; } }
  var t = e.target.closest("[data-tapar]");
  if(t){ var x = document.getElementById(t.dataset.tapar); x.classList.toggle("tapar");
    t.textContent = x.classList.contains("tapar") ? "Destapar las definiciones" : "Tapar las definiciones"; }
});
function setGuia(on){ $("#guia").classList.toggle("open", on); $("#scrim").classList.toggle("on", on);
  $("#gbtn").setAttribute("aria-pressed", on ? "true" : "false"); }
$("#next").addEventListener("click", function(){ go(i+1); });
$("#prev").addEventListener("click", function(){ go(i-1); });
$("#play").addEventListener("click", toggleTimer);
$("#reset").addEventListener("click", function(){ setTimer(tBase); });
$("#gbtn").addEventListener("click", function(){ setGuia(!$("#guia").classList.contains("open")); });
$("#gclose").addEventListener("click", function(){ setGuia(false); });
$("#scrim").addEventListener("click", function(){ setGuia(false); });
document.addEventListener("keydown", function(e){
  var t = e.target.tagName; if(t==="INPUT"||t==="TEXTAREA"||e.target.isContentEditable) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ go(i+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ go(i-1); e.preventDefault(); }
  else if(e.key==="Home"){ go(0); e.preventDefault(); }
  else if(e.key==="End"){ go(SC.length-1); e.preventDefault(); }
  else if(e.key==="g"||e.key==="G"){ setGuia(!$("#guia").classList.contains("open")); }
  else if(e.key==="t"||e.key==="T"){ if(wrap.querySelector("[data-examen]")) exToggle(); else toggleTimer(); }
  else if(e.key==="Escape"){ setGuia(false); }
});
go(0);
})();
</script>
</body>
</html>
