<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Física · Clase 1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>[hidden]{display:none!important}
:root{
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --text:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --area:#5C7A1E; --azul:#1F4E8C; --oro:#B0711A; --morado:#5B3E96; --verde:#2E7A39;
  --m1:#5C7A1E; --m2:#1F4E8C; --m3:#3B3BA6; --m4:#5B3E96; --m5:#A82424; --m6:#4A5A70; --rojo:#A82424;
  --ink:#1B1F27; --muted:#5C6472; --faint:#A9B0BB; --line:#E3E7ED; --paper:#FFFFFF; --bg:#F6F4F1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:clamp(16px,1.25vw,21px);line-height:1.5}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
#top{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding:10px clamp(14px,2vw,28px);background:var(--paper);flex-wrap:wrap}
.logo img{height:clamp(28px,2.6vw,40px);display:block}
#mom{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
#momdot{width:clamp(30px,2.4vw,40px);height:clamp(30px,2.4vw,40px);border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;background:var(--faint)}
#momnom{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.2vw,20px)}
#momsub{color:var(--muted);font-size:.85em}
#clock{display:flex;align-items:center;gap:8px}
#tnum{font-family:var(--display);font-weight:800;font-size:clamp(20px,1.8vw,30px);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
#tnum.over{color:var(--area)}
.btn{appearance:none;font:inherit;font-size:.86em;font-weight:600;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.solid{background:var(--area);border-color:var(--area);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#stage{overflow:auto;padding:clamp(18px,3vw,48px) clamp(16px,4vw,72px)}
#wrap{max-width:1500px;margin:0 auto}
#wrap.enter{animation:ent .28s ease-out}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bot{display:flex;align-items:center;gap:12px;padding:10px clamp(14px,2vw,28px);background:var(--paper)}
#prog{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
#prog i{display:block;height:100%;background:var(--area);transition:width .25s}
#count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
#hint{color:var(--faint);font-size:.8em}
@media (max-width:760px){#hint{display:none}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.2vw,68px);line-height:1.05;margin:.2em 0 .25em;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,2.8vw,46px);line-height:1.1;margin:.25em 0 .3em;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:clamp(18px,1.5vw,26px);margin:.1em 0 .4em;line-height:1.2}
p{margin:.35em 0 .6em}
.lead{font-size:1.2em;line-height:1.45;max-width:70ch}
.sub{color:var(--muted)}
.mt{margin-top:clamp(14px,1.8vw,26px)}
.logo-xl img{height:clamp(54px,6vw,96px);margin-bottom:12px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tag,.min,.membrete{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.78em;font-weight:700;letter-spacing:.02em}
.tag{background:var(--ink);color:#fff}
.min{background:var(--accent,var(--area));color:#fff}
.membrete{border:1.5px solid var(--line);color:var(--muted)}
.kicker{color:var(--muted);font-size:.85em;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.grid{display:grid;gap:clamp(12px,1.4vw,22px)}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid>*{min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,1.6vw,24px)}
.card.edge{border-left:6px solid var(--accent,var(--area))}
.card.big .lead{font-size:1.3em}
.step{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px}
.step .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;flex:none}
.note{border-left:5px solid var(--accent,var(--area));background:var(--paper);border-radius:10px;padding:10px 16px;margin-top:12px}
.cita{font-family:var(--display);font-weight:600;line-height:1.35;background:var(--paper);border-left:6px solid var(--area);border-radius:12px;padding:clamp(16px,2vw,30px);margin:18px 0}
.cita.xl{font-size:clamp(24px,2.6vw,44px)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally .n{display:inline-block;min-width:1.6em;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.pasos{margin:.2em 0 0;padding-left:1.3em}.pasos li{margin:.3em 0}
.sello{margin-top:12px;border:2px dashed var(--oro);border-radius:12px;padding:10px 14px;background:#FDF6EA}
.sello b{display:block;color:var(--oro);font-size:.8em;letter-spacing:.06em;text-transform:uppercase}
.clave{margin-top:12px;display:flex;align-items:center;gap:10px;font-weight:600}
.keychip{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:10px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.2em}
.aviso{margin-top:10px;border-radius:10px;padding:10px 14px;background:#FBEFEF;border-left:5px solid var(--area);font-size:.92em}
.aviso.sev-aten{background:#EDF5EE;border-left-color:var(--verde)}
.aviso.sev-medi{background:#FDF5E7;border-left-color:var(--oro)}
.icfes .texto{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.6vw,24px);max-height:62vh;overflow:auto;font-size:.95em}
.enun{font-weight:600;font-size:1.08em}
.ops{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.op .L{flex:none;width:1.8em;height:1.8em;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-family:var(--display);font-weight:800}
.op.ok{border-color:var(--verde);background:#EDF5EE}.op.ok .L{background:var(--verde);color:#fff}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick[aria-pressed="true"]{background:var(--area);border-color:var(--area);color:#fff}
#scrim{position:fixed;inset:0;background:rgba(15,18,24,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#guia{position:fixed;top:0;right:0;height:100%;width:min(520px,92vw);background:var(--paper);box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column;z-index:10}
#guia.open{transform:none}
#guiahead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg)}
#guiabody{overflow:auto;padding:16px 20px 30px;font-size:.92em}
.gbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.gbox h4{margin:0 0 6px;font-family:var(--display);font-size:.8em;letter-spacing:.07em;text-transform:uppercase;color:var(--area)}
.gbox ul{margin:0;padding-left:1.1em}.gbox li{margin:.35em 0}
.gbox.como{background:#F6F7F9}.gbox.como h4{color:var(--muted)}
.gbox.apoyo{background:#FDF6EA;border-color:#EAD9B4}.gbox.apoyo h4{color:var(--oro)}
.examen{background:var(--paper);border:1px solid var(--line);border-left:8px solid var(--area);border-radius:22px;padding:clamp(16px,2.4vw,40px);margin-top:clamp(12px,1.6vw,24px);text-align:center}
.relojxl{font-family:var(--display);font-weight:800;font-size:clamp(96px,17vw,280px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.relojxl.over{color:var(--area)}
.exhoras{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 36px;color:var(--muted);font-size:1.15em;margin-top:10px}
.exhoras b{color:var(--ink);font-variant-numeric:tabular-nums}
.nbig{font-family:var(--display);font-weight:800;font-size:clamp(40px,4vw,64px);line-height:1;color:var(--accent,var(--area))}
.asig{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:8px 0}
.asig .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;flex:none}
.asig label{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted)}
.asig label.w{flex:1;min-width:min(100%,260px)}
.campo{font:inherit;font-size:1.1em;font-weight:700;color:var(--ink);border:none;border-bottom:2px dashed var(--faint);background:transparent;padding:4px 6px;min-width:0;flex:1;outline:none}
.campo.n{width:4.5em;flex:none;text-align:center}
.campo:focus{border-bottom-color:var(--area)}
.nums1{border:1.5px solid var(--line);border-radius:999px;padding:3px 14px;background:var(--paper);font-weight:600;color:var(--muted)}
.nums1 b{color:var(--ink)}
.pides{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:1.08em}
.pide{display:inline-flex;align-items:center;gap:8px}
.chk{display:inline-block;width:20px;height:20px;border:2px solid var(--area);border-radius:4px;background:#fff;flex:none}
.herrs{display:grid;gap:clamp(12px,1.4vw,22px);grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.herr{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--area);border-radius:16px;padding:14px 18px;font-size:1.12em}
.herr svg{flex:none}
[hidden]{display:none!important}
.fig{margin:12px 0}.fig svg{display:block;width:100%;max-width:760px;height:auto}
.tabla{border-collapse:collapse;width:100%;table-layout:fixed;font-size:.86em;line-height:1.35;margin:0 auto}
.tabla th,.tabla td{border:1px solid var(--line);padding:5px 8px;vertical-align:top;overflow-wrap:anywhere}
.tabla th{background:#F2F4EE;text-align:left}.fig figcaption{font-size:.85em;font-style:italic;color:var(--muted)}
.ops.cuatro{grid-template-columns:repeat(4,1fr)}.ops.cuatro .op{padding:8px 10px;gap:8px;font-size:.92em;align-items:center}
.derfig .fig{margin:0 0 10px}.opsfig{background:var(--paper);border:1px solid var(--line);
border-radius:14px;padding:8px 10px;margin-top:10px}.opsfig .fig{margin:0}
.aviso{border-left-color:var(--rojo)}.aviso.sev-baja{background:#EEF3FA;border-left-color:var(--azul)}
</style>
</head>

\"sub\">Las diez preguntas de la prueba de campo, páginas 205 a 208<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m4)\"><h3>Tu cuaderno<\/h3><p class=\"sub\">Páginas 265 a 271<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m6)\"><h3>Hoy<\/h3><p class=\"sub\">120 minutos · 6 momentos · UC e IN · fuerzas, gráficas y energía<\/p><\/div><\/div>", "guia": {"obj": "Que el grupo sepa desde el primer minuto qué va a pasar en estos 120 minutos y qué tiene que tener sobre la mesa.", "decir": ["«Libro abierto, cuaderno cerrado, lápiz. Hoy nadie me va a decir la fórmula de memoria: me van a mostrar la flecha o el julio que explica lo que pasa.»"], "apoyo": ["⚑ Antes del sábado: La figura de la pregunta 3 dibuja mal el diagrama de fuerzas (la normal vertical y las dos componentes del peso hacia abajo) y la de la 8 pone la flecha centrípeta hacia afuera. Que dibujen el suyo antes de mirar el del libro. La pregunta 6 tiene dos opciones defendibles.", "Seguridad de las dinámicas: En «Las flechas de la mochila» la mochila es liviana y los cordones se halan suave. En «Camina la gráfica» se camina, no se corre: despeja el pasillo antes.", "Del libro, para ti: A 3 · B 4 · C 2 · D 1: la D sale una sola vez. Reportado a la editorial. No lo digas en clase.", "Los cuatro conceptos que tienes que poder explicar hoy en dos minutos, sin jerga. Si un estudiante sabe más que tú de un tema, déjalo explicar y pide que lo muestre con una flecha o con una cuenta con unidades:", "Fuerza y diagrama de cuerpo libre: Una fuerza es un empujón o un jalón que alguien le hace a algo. Se dibuja como flecha desde el objeto, con nombre: peso (la Tierra, hacia abajo), normal (la superficie, perpendicular a ella), rozamiento (la superficie, contra el deslizamiento) y tensión (la cuerda, a lo largo de ella).", "Inercia: Si sobre un cuerpo no hay fuerza neta, sigue como iba: quieto, o en línea recta con la misma rapidez. Por eso, si la tabla se retira de golpe, el tomate no se va con ella: solo cae.", "Gráfica de rapidez contra tiempo: La altura de la línea es la rapidez y su inclinación es la aceleración. Recta que sube: acelera parejo; horizontal: rapidez constante; que baja: frena. Más inclinada, más aceleración.", "Trabajo y energía: Una fuerza trabaja solo con la parte que va a lo largo del movimiento: W = F · d · cos θ. Si es perpendicular al camino, no trabaja. La energía que «se pierde» con el rozamiento se vuelve calor: no desaparece.", "Abre esta guía con la tecla G en cada diapositiva: trae lo que dices y, debajo, lo que necesitas saber si Física no es tu área.", "El cronómetro arranca con T y se reinicia solo cuando cambia el momento de la clase."]}}, {"m": null, "html": "<div class=\"eyebrow\"><span class=\"kicker\">Así vamos a trabajar<\/span><\/div><h2>Seis momentos, una sola regla<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:var(--m1)\"><div class=\"k\">1<\/div><div><b>Activación<\/b><span class=\"sub\"> · 15 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m2)\"><div class=\"k\">2<\/div><div><b>Pregunta problematizadora<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m3)\"><div class=\"k\">3<\/div><div><b>Desarrollo guiado<\/b><span class=\"sub\"> · 35 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m4)\"><div class=\"k\">4<\/div><div><b>Reto en equipo<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m5)\"><div class=\"k\">5<\/div><div><b>Evaluación individual<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m6)\"><div class=\"k\">6<\/div><div><b>Cierre<\/b><span class=\"sub\"> · 10 min<\/span><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--area)\"><h3>La regla del cuaderno<\/h3><p class=\"lead\">Si el instrumento está vacío, no lo resolviste: lo adivinaste.<\/p><p>Primero se hace el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento—, después se marca la opción. Una respuesta correcta con el instrumento en blanco no cuenta como resuelta.<\/p><\/div><\/div>", "guia": {"obj": "Que la regla quede dicha en voz alta antes de cualquier texto.", "decir": ["«La respuesta correcta con el instrumento vacío no cuenta. ¿Por qué? Porque en Física casi todas las opciones usan palabras técnicas: el que no dibujó la flecha ni hizo la cuenta escoge la que suena mejor, no la que es.»"], "apoyo": ["Si alguien pregunta para qué dibujar, la respuesta corta es: lo que separa la opción correcta de las que suenan bien está en el sentido de una flecha, en un signo o en una unidad, y eso se pierde si no se escribe.", "Si alguien dice «es por la gravedad» o «es la energía», devuélvele la pregunta: «¿quién empuja a quién, y hacia dónde?»."]}}, {"m": 0, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Activación<\/span><span class=\"kicker\">Cuaderno cerrado<\/span><\/div><h2>¿Qué cambió y qué lo causó?<\/h2><blockquote class=\"cita xl\">Un bus frena de golpe y los pasajeros que iban de pie se van hacia adelante, aunque nadie los empujó.<\/blockquote><p class=\"lead\">Dos respuestas antes de cualquier fórmula. Todavía no se abre el cuaderno.<\/p><div class=\"ctl\"><button class=\"btn\" data-show=\"pista1\">Mostrar la pista<\/button><\/div><div class=\"note\" id=\"pista1\" hidden style=\"--accent:var(--m1)\"><b>Pista:<\/b> cambió la rapidez del bus, no la de ellos: siguieron como iban (inercia). La flecha que los frena es la del piso en los zapatos o la de la mano en el tubo<\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno corto diciendo qué cambió y qué lo causó —qué fuerza, qué calor, qué carga— antes de explicarlo con fórmulas y antes de ver cualquier opción.", "decir": ["Proyecta o lee una observación de dos o tres renglones sin decir de dónde salió.", "Pide dos respuestas, en voz alta o en el tablero: qué cambió y qué lo causó, dicho como una flecha con nombre («el piso frena…», «el calor va de… a…»).", "Ejecuta la dinámica de apertura según la estrategia del encuentro."], "como": "No explica el fenómeno ni acepta todavía fórmulas. Si alguien dice «es por la gravedad» o «es la energía», le devuelve la pregunta: «¿quién empuja a quién, y hacia dónde?». El cuaderno sigue cerrado.", "apoyo": ["No expliques el fenómeno ni aceptes todavía fórmulas: primero qué cambió y qué lo causó, dicho como una flecha con nombre. La observación es inventada para la clase: no sale del libro.", "La pista existe para el cierre de los 15 minutos, no para el principio: cambió la rapidez del bus, no la de ellos: siguieron como iban (inercia). La flecha que los frena es la del piso en los zapatos o la de la mano en el tubo."]}}, {"m": 0, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#242478\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 1 · Las fuerzas, una por una<\/span><\/div><h2>Las flechas de la mochila<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Una mochila liviana en el pupitre del frente, con tres cordones amarrados; tres estudiantes toman uno cada uno, sin halar.<\/li><li>El grupo nombra en voz alta todas las fuerzas sobre la mochila: quién la hace y hacia dónde.<\/li><li>El docente dice cómo van a halar («dos a la derecha, uno a la izquierda») y el grupo predice si se mueve y hacia dónde.<\/li><li>Halan suave. Si la predicción falla, buscan la flecha olvidada: casi siempre, el rozamiento.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Una mochila liviana · tres cordones de un metro<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno corto diciendo qué cambió y qué lo causó —qué fuerza, qué calor, qué carga— antes de explicarlo con fórmulas y antes de ver cualquier opción.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No explica el fenómeno ni acepta todavía fórmulas. Si alguien dice «es por la gravedad» o «es la energía», le devuelve la pregunta: «¿quién empuja a quién, y hacia dónde?». El cuaderno sigue cerrado.", "apoyo": ["Qué movimiento mental entrena: Nombrar cada fuerza —quién la hace y hacia dónde apunta— antes de decir qué pasa con el movimiento. Es el movimiento de las preguntas 3, 6, 7 y 9, y de la primera del entrenamiento (la fuerza que sostiene los paquetes).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 1, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m2)\">Pregunta problematizadora<\/span><span class=\"kicker\">Libro abierto en la pregunta modelo<\/span><\/div><h2>Abran el libro en la pregunta 1, página 205<\/h2><p class=\"lead\">Antes de dibujar o calcular: ¿cuál creen que es? Levanten la mano.<\/p><div class=\"ctl\"><button class=\"btn tally\" data-tally=\"h1A\">A <span class=\"n\" id=\"h1A\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h1B\">B <span class=\"n\" id=\"h1B\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h1C\">C <span class=\"n\" id=\"h1C\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h1D\">D <span class=\"n\" id=\"h1D\">0<\/span><\/button><button class=\"btn\" data-reset=\"h1\">↺<\/button><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta que gobierna el área<\/h3><p class=\"lead\">¿Qué lo causó? Muéstrame la flecha o el julio que lo explica.<\/p><p class=\"sub\">Nadie justifica con «así dice la fórmula» ni con «eso es obvio»: toda respuesta señala una flecha del dibujo, un número con su unidad o un renglón del enunciado.<\/p><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta de este momento<\/h3><p class=\"lead\">¿Qué fuerza —con su nombre y su dirección— explica ese movimiento?<\/p><\/div>", "guia": {"obj": "Que el estudiante compruebe que en Física la respuesta sale de la causa dibujada o de la cuenta con unidades, y no de la opción que suena más técnica, usando la pregunta modelo del libro.", "decir": ["Presenta la pregunta modelo del libro y la deja a la vista todo el momento.", "Pide respuestas a mano alzada ANTES de dibujar o calcular nada, y las anota en el tablero.", "Hace la pregunta que gobierna el área: ¿qué lo causó? Muéstrame la flecha o el julio que lo explica.", "Revela la clave solo al final y trabaja por qué cae cada una de las otras tres."], "como": "Regla del momento: nadie justifica con «así dice la fórmula» ni con «eso es obvio». Toda intervención señala una flecha del dibujo, un número con su unidad o un renglón del enunciado.", "apoyo": ["La pregunta modelo es la 1 del libro (página 205). El cuaderno se abre en la página 265 solo en «mi primera idea».", "Cuenta las manos tocando cada letra: el número queda en pantalla y sirve para el final del momento, cuando el grupo vea cuántos cambiaron de opinión al dibujar la flecha o hacer la cuenta.", "No digas la clave en este momento: sale en el bloque de las preguntas 1 y 2, después de llenar el instrumento en pantalla, casilla por casilla. Ahí se trabaja por qué cae cada una de las otras tres."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 1 y 2<\/span><span class=\"kicker\">En pantalla, casilla por casilla<\/span><\/div><h2>Preguntas 1 y 2: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 1<\/span><span class=\"min\" style=\"--accent:#A82424\">E2 · La gráfica cuenta el movimiento<\/span><\/div><p class=\"sub\">Dos bloques en planos de distinto ángulo · gráfica v–t · qué procedimiento<\/p><h3 style=\"color:#A82424\">El escalón de cada recta<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k11\"><span class=\"keychip\" style=\"background:#A82424\">A<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 2<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E4 · Lo que se conserva<\/span><\/div><p class=\"sub\">Ciclista que se detiene en la arena · por qué la conclusión es incorrecta<\/p><h3 style=\"color:#5B3E96\">La caja de la energía del ciclista<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k11\"><span class=\"keychip\" style=\"background:#5B3E96\">C<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k11\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 1·A y 2·C. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 1 · aviso del libro (baja), solo para ti, no se proyecta: La gráfica no dice qué bloque baja por el plano más inclinado, y las dos rectas arrancan un poco por debajo de cero. Qué haces: Se responde comparando pendientes. No cambia la clave A."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 3 y 4<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 3 y 4: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 3<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Las fuerzas, una por una<\/span><\/div><p class=\"sub\">Automóvil en un plano inclinado · por qué se desliza sin el freno<\/p><h3 style=\"color:#242478\">El diagrama de cuerpo libre en la rampa<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k13\"><span class=\"keychip\" style=\"background:#242478\">B<\/span> es la clave del libro<\/div><div class=\"aviso sev-medi\" hidden data-grupo=\"k13\"><b>Ojo con esta clave:<\/b> El diagrama del libro dibuja la normal vertical: es perpendicular a la rampa. Y la parte del peso que hace bajar el carro va a lo largo de la rampa, no hacia abajo.<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 4<\/span><span class=\"min\" style=\"--accent:#C9821B\">E3 · El experimento justo<\/span><\/div><p class=\"sub\">Bailarín · cómo investigar si la superficie influye en el impulso<\/p><h3 style=\"color:#C9821B\">La ficha del experimento justo<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k13\"><span class=\"keychip\" style=\"background:#C9821B\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k13\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 3·B y 4·A. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 3 · aviso del libro (media): El diagrama del libro dibuja la normal vertical: es perpendicular a la rampa. Y la parte del peso que hace bajar el carro va a lo largo de la rampa, no hacia abajo. Qué haces: No cambia la clave B. Que dibujen su diagrama antes de mirar el del libro."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#A82424\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 2 · La gráfica cuenta el movimiento<\/span><\/div><h2>Camina la gráfica<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>El docente dibuja una gráfica de rapidez contra tiempo: parte de cero, sube, se queda plana y vuelve a subir, más inclinada.<\/li><li>Un voluntario la camina por el pasillo mientras otro cuenta segundos: si sube, va cada vez más rápido; si es plana, mantiene el paso. Sin correr.<\/li><li>El grupo lo corrige en el momento: «¡ahí estaba plana, no aceleres!».<\/li><li>Al revés: otro camina una historia que el docente le dice al oído y el grupo la dibuja.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Tablero · pasillo despejado<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Qué movimiento mental entrena: Leer cada tramo de una gráfica como un pedazo de movimiento —sube, plano o baja— y traducir en las dos direcciones. Es el movimiento de las preguntas 1 y 10, y de la segunda del entrenamiento (la gráfica de la energía del vagón).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 5 y 6<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 5 y 6: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 5<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E4 · Lo que se conserva<\/span><\/div><p class=\"sub\">Bailarín que gira 540° en el aire · qué lo mantuvo estable<\/p><h3 style=\"color:#5B3E96\">La regla del giro en el aire<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Momento angular<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k15\"><span class=\"keychip\" style=\"background:#5B3E96\">C<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 6<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Las fuerzas, una por una<\/span><\/div><p class=\"sub\">Bailarín que aterriza · qué acción ayuda al equilibrio<\/p><h3 style=\"color:#242478\">Los pies vistos desde arriba<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k15\"><span class=\"keychip\" style=\"background:#242478\">B<\/span> es la clave del libro<\/div><div class=\"aviso sev-medi\" hidden data-grupo=\"k15\"><b>Ojo con esta clave:<\/b> Dos opciones se pueden defender: apoyar los dos pies (B) agranda la base de apoyo, y flexionar más la rodilla (C) alarga el choque y baja la fuerza. La clave tomada es B. Si defendiste C con el impulso, tienes un argumento.<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k15\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 5·C y 6·B. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 5 · Momento angular: Mide cuánto «giro» lleva un cuerpo: L = I · ω. I depende de qué tan lejos del eje está la masa (brazos o piernas abiertas, I grande) y ω de qué tan rápido gira. En el aire nada de afuera lo cambia: si el bailarín abre las piernas, I sube y gira más despacio. Para destrabar: «¿Cambió el giro total, o solo cómo está repartida la masa?»", "Pregunta 5 · aviso del libro (atención), solo para ti, no se proyecta: Pregunta por el «equilibrio en el aire», pero lo que explica la clave C es la conservación del momento angular (L = I · ω). Qué haces: Usa el sello: abrir las piernas sube I y baja ω; el giro total no cambia.", "Pregunta 6 · aviso del libro (media): Dos opciones se pueden defender: apoyar los dos pies (B) agranda la base de apoyo, y flexionar más la rodilla (C) alarga el choque y baja la fuerza. La clave tomada es B. Si defendiste C con el impulso, tienes un argumento. Qué haces: Clave tomada: B. Si alguien defiende la C con el impulso, tiene un argumento: reconócelo."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#C9821B\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 3 · El experimento justo<\/span><\/div><h2>Una sola perilla<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Un borrador amarrado a un cordón es un péndulo: un estudiante cuenta cuánto tarda en hacer diez idas y vueltas.<\/li><li>«¿De qué depende ese tiempo?». Las ideas van al tablero: el largo, el peso, qué tan lejos se suelta.<\/li><li>Cada equipo escoge una y llena: LO QUE CAMBIO, LO QUE DEJO QUIETO, LO QUE MIDO.<\/li><li>Dos equipos prueban al frente. Si uno cambió dos cosas, el grupo dice por qué no se sabe cuál fue.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Un borrador · un cordón de un metro · un reloj<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Qué movimiento mental entrena: Separar lo que se cambia de lo que se deja quieto, y aceptar que un experimento solo responde por la variable que movió. Es el movimiento de las preguntas 4 y 8, y de la tercera del entrenamiento (qué pregunta se puede contestar con lo observado).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 7 y 8<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 7 y 8: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 7<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Las fuerzas, una por una<\/span><\/div><p class=\"sub\">Tomate sobre una tabla que baja de golpe · inercia<\/p><h3 style=\"color:#242478\">Tres fotos del tomate<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k17\"><span class=\"keychip\" style=\"background:#242478\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 8<\/span><span class=\"min\" style=\"--accent:#C9821B\">E3 · El experimento justo<\/span><\/div><p class=\"sub\">Prenda en el tambor de una lavadora · qué variable modificar<\/p><h3 style=\"color:#C9821B\">La fórmula escoge la variable<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Fuerza centrípeta<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k17\"><span class=\"keychip\" style=\"background:#C9821B\">A<\/span> es la clave del libro<\/div><div class=\"aviso sev-medi\" hidden data-grupo=\"k17\"><b>Ojo con esta clave:<\/b> La flecha de la fuerza centrípeta del libro apunta hacia el borde: la fuerza centrípeta apunta hacia el centro del giro.<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k17\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 7·B y 8·A. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 8 · Fuerza centrípeta: La fuerza que mantiene algo dando vueltas apunta siempre hacia el centro: F = m · v² ÷ r. Crece con la masa, mucho con la rapidez (al cuadrado) y baja con el radio. En la lavadora la pared del tambor empuja la ropa hacia el centro; el agua sale por los huecos. Para destrabar: «Si duplico la rapidez, ¿cuántas veces más fuerza hace falta? (cuatro)»", "Pregunta 8 · aviso del libro (media): La flecha de la fuerza centrípeta del libro apunta hacia el borde: la fuerza centrípeta apunta hacia el centro del giro. Qué haces: No cambia la clave A. Corrige la flecha en el tablero."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#5B3E96\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 4 · Lo que se conserva<\/span><\/div><h2>Los tres bolsillos de la energía<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Tres estudiantes son tres bolsillos: ALTURA, MOVIMIENTO y CALOR. El de ALTURA tiene diez fichas.<\/li><li>El docente narra despacio: «un carrito está arriba de una rampa… baja… rueda… frena hasta quedarse quieto».<\/li><li>En cada frase el grupo dice cuántas fichas pasan y de qué bolsillo a cuál; se las pasan de mano en mano.<\/li><li>Al final se cuentan: tienen que ser diez. Ninguna desaparece ni aparece de la nada.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Diez fichas de papel · tres letreros<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Qué movimiento mental entrena: Seguir lo que se conserva: lo que sale de una forma aparece en otra y el total no cambia. Es el movimiento de las preguntas 2 y 5 —en la 5 lo que se conserva es el giro— y de la cuarta del entrenamiento (el salto bungee).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 9 y 10<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 9 y 10: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 9<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Las fuerzas, una por una<\/span><\/div><p class=\"sub\">Bloque de 5 kg en un plano de 30° · trabajo de la gravedad<\/p><h3 style=\"color:#242478\">Solo trabaja lo que va a lo largo<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>El peso en una rampa<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k19\"><span class=\"keychip\" style=\"background:#242478\">D<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 10<\/span><span class=\"min\" style=\"--accent:#A82424\">E2 · La gráfica cuenta el movimiento<\/span><\/div><p class=\"sub\">Acelera, va constante y frena · qué gráfica v–t<\/p><h3 style=\"color:#A82424\">Dibujo la historia antes de mirar las gráficas<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k19\"><span class=\"keychip\" style=\"background:#A82424\">B<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k19\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 9·D y 10·B. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 9 · El peso en una rampa: En una rampa el peso se parte en dos flechas: una a lo largo del plano (P · sen θ), que hace bajar el bloque, y otra contra el plano (P · cos θ), que la normal equilibra. Con 30°, sen 30° = 0,5: la mitad del peso empuja rampa abajo. Para destrabar: «¿Cuál de las dos flechas va en la dirección en que se mueve el bloque?»", "Pregunta 9 · aviso del libro (baja), solo para ti, no se proyecta: En la 9 la figura no marca cuál es el bloque A (es el de 5 kg); en la 10 el eje de la gráfica C dice 1,5 donde va 0,5. Qué haces: Dilo antes del bloque. No cambian las claves D y B."]}}, {"m": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m4)\">Reto en equipo · 20 min<\/span><span class=\"kicker\">Equipos de tres · cada uno responde en su cuaderno<\/span><\/div><h2>Reto del corte: El tobogán del parque<\/h2><div class=\"card big edge mt\" style=\"--accent:var(--m4)\"><p class=\"lead\">Cada equipo de tres recibe un caso: un niño baja por un tobogán y, al llegar abajo, frena en la arena hasta quedarse quieto. En doce minutos dibujan las fuerzas sobre el niño en el tobogán, cada una con su nombre y quién la hace; esbozan la gráfica de su rapidez contra el tiempo, de arriba hasta que se detiene; diseñan una prueba justa para saber si la ropa (jean o sudadera) cambia la rapidez al llegar; y escriben a dónde se fue la energía de la altura. Cada integrante defiende una de las cuatro partes.<\/p><\/div><div class=\"note mt\" style=\"--accent:var(--m4)\"><b>La defensa:<\/b> tres minutos por equipo, señalando la flecha, la cuenta con su unidad o la variable que los respalda. «Porque sí» o «así dice la fórmula» no cuentan.<\/div>", "guia": {"obj": "Que el estudiante defienda su explicación con el dibujo o la cuenta en la mano y acepte que otro equipo puede ver una fuerza, una pérdida o una variable que él no vio.", "decir": ["Arma equipos de tres y entrega el reto del corte de este momento.", "Exige que cada integrante llegue con su instrumento YA diligenciado individualmente.", "Da tres minutos de defensa por equipo: muestran la flecha, la cuenta o la variable que los respalda.", "Cierra mostrando qué fuerza, qué julio o qué variable quedó por fuera en cada propuesta."], "como": "El equipo discute, pero cada uno escribe en SU tarjeta del reto. No se acepta una defensa que diga «porque sí» o «eso dice la fórmula»: se señala la flecha, el número con su unidad o la variable que se controló.", "apoyo": ["Las cuentas del reto, para ti (no se proyectan): Fuerzas en el tobogán: el peso (la Tierra, hacia abajo), la normal (el tobogán, perpendicular a él) y el rozamiento (el tobogán, contra el movimiento). La gráfica sube mientras baja por el tobogán y baja hasta cero en la arena. La prueba justa cambia solo la ropa: el mismo niño, el mismo tobogán, desde el mismo punto. La energía de la altura se volvió movimiento y, por el rozamiento, calor.", "El reto no tiene una sola respuesta correcta en todas sus partes: gana el equipo que mejor sostiene la suya con flechas y cuentas. Si dos explicaciones están sostenidas, dilo: eso también es hacer física.", "Si un equipo entrega una sola hoja para los tres, el reto no cuenta. La discusión es compartida; el registro es individual.", "Cierra mostrando qué fuerza, qué julio o qué variable quedó por fuera en cada propuesta."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 1<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Los paquetes del supermercado<\/h3><p>Una persona sale del supermercado con dos paquetes que pesan 5 kgf, uno en cada mano. Para llegar a su casa debe recorrer 2 cuadras de 100 metros cada una. El trayecto recorrido por la persona es completamente horizontal, lo hace sin detenerse y llega en 2 minutos a su casa.<\/p><\/div><div><p class=\"enun\">Sobre el trabajo mecánico en kgf × m realizado, podemos afirmar que<\/p><div class=\"ops\" id=\"icf11\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>tiene un valor de 2000 kgf × m ya que el trabajo es fuerza × distancia.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>es indeterminable porque el trabajo siempre se realiza contra la gravedad.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>es nulo porque la fuerza para sostener los paquetes no es en la dirección del movimiento.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>su valor numérico es de 500 kgf × m por cada paquete.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf11\" data-k=\"C\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la C.", "⚑ Fuente: compilado ASED (no es del ICFES). Nelson decide si se reemplaza; mientras tanto, no la presentes como «del ICFES».", "Por qué es la C: la mano sostiene cada paquete con una fuerza vertical, hacia arriba (5 kgf, igual a su peso), y el camino es horizontal: entre la fuerza y el desplazamiento hay 90°, y W = F · d · cos 90° = 5 kgf · 200 m · 0 = 0 (C). A multiplica 10 kgf × 200 m sin mirar la dirección de la fuerza; D hace una cuenta parecida para cada paquete, y tampoco sale de la fórmula (5 kgf × 200 m daría 1000, no 500); B dice que el trabajo «siempre» es contra la gravedad, y no es así.", "Dos flechas antes de cualquier cuenta: hacia dónde empuja la mano (arriba) y hacia dónde va el camino (al frente). Si son perpendiculares, esa fuerza no trabaja.", "La persona se cansa, pero eso es el trabajo de sus músculos por dentro, no trabajo sobre el paquete. Es la misma idea de la pregunta 6 de la misión 5.", "El kgf (kilogramo-fuerza) es una unidad antigua: 1 kgf ≈ 9,8 N. Los 2 minutos sobran: el tiempo no entra en el trabajo."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 2<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>La montaña rusa de la gráfica<\/h3><p>Un estudiante calculó la energía potencial de un vagón 27\" stroke-width=\"2\"/><text x=\"60.0\" y=\"266.2\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\" font-style=\"italic\">t₁<\/text><rect x=\"103.0\" y=\"206.0\" width=\"22.0\" height=\"16.0\" rx=\"3\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><text x=\"114.0\" y=\"198.0\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\" font-style=\"italic\">t₂<\/text><rect x=\"163.0\" y=\"286.1\" width=\"22.0\" height=\"16.0\" rx=\"3\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><text x=\"174.0\" y=\"278.1\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\" font-style=\"italic\">t₃<\/text><rect x=\"223.0\" y=\"310.8\" width=\"22.0\" height=\"16.0\" rx=\"3\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><text x=\"234.0\" y=\"302.8\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\" font-style=\"italic\">t₄<\/text><circle cx=\"326.0\" cy=\"193.0\" r=\"13.0\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><text x=\"326.0\" y=\"198.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">D<\/text><polyline points=\"340.0,199.0 360.0,314.0 510.0,314.0 535.0,274.0 582.0,274.0\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><circle cx=\"440.0\" cy=\"281.0\" r=\"33.0\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"2.6\"/><rect x=\"377.0\" y=\"296.0\" width=\"22.0\" height=\"16.0\" rx=\"3\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><text x=\"388.0\" y=\"288.0\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\" font-style=\"italic\">t₁<\/text><rect x=\"429.0\" y=\"248.0\" width=\"22.0\" height=\"16.0\" rx=\"3\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><text x=\"440.0\" y=\"239.0\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\" font-style=\"italic\">t₂<\/text><rect x=\"479.0\" y=\"296.0\" width=\"22.0\" height=\"16.0\" rx=\"3\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><text x=\"490.0\" y=\"288.0\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\" font-style=\"italic\">t₃<\/text><rect x=\"554.0\" y=\"256.0\" width=\"22.0\" height=\"16.0\" rx=\"3\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><text x=\"565.0\" y=\"248.0\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\" font-style=\"italic\">t₄<\/text><\/svg><\/figure><\/div><div class=\"ops cuatro\" id=\"icf12\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>El modelo A.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>El modelo B.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>El modelo C.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>El modelo D.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf12\" data-k=\"D\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la D.", "Por qué es la D: la energía potencial gravitacional crece con la altura, así que la gráfica es un dibujo de qué tan alto está el vagón. Dice: muy alto al principio; abajo del todo en t₁; arriba otra vez en t₂, pero menos que al principio; abajo en t₃; y en t₄, a media altura, sin cambiar. Solo el modelo D cuenta esa historia: la caída, el fondo, la cima del rizo, el fondo y el tramo alto del final (D). En A el vagón está en lo más bajo en t₂, justo cuando la gráfica marca un pico; en B está abajo en t₁ y en t₂; en C empieza abajo, y la gráfica empieza en lo más alto.", "Que traduzcan la gráfica a alturas, instante por instante, antes de mirar los dibujos: t₁ abajo, t₂ arriba, t₃ abajo, t₄ a media altura.", "La energía potencial no dice qué tan rápido va el vagón: solo qué tan alto está."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 3<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Tres objetos que caen distinto<\/h3><p>El profesor de Juan le entrega tres objetos de igual volumen y forma, pero de diferente material, y le pide que los deje caer desde la altura de sus hombros y observe el tiempo de caída al suelo, de cada uno de ellos. Juan observa que los tres tardan tiempos diferentes para llegar al suelo, a pesar de que los tres están sometidos a la misma aceleración gravitacional.<\/p><\/div><div><p class=\"enun\">Teniendo en cuenta la información anterior, ¿cuál de las siguientes preguntas se puede contestar a partir de las observaciones que realizó Juan?<\/p><div class=\"ops\" id=\"icf13\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>¿El tiempo de caída de los objetos depende de la altura de lanzamiento?<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>¿La fuerza gravitacional es proporcional a la masa de los objetos?<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>¿La fuerza neta que actúa sobre cada uno de los objetos es diferente?<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>¿La forma de los objetos está relacionada con diferencias en la fuerza de fricción?<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf13\" data-k=\"C\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la C.", "Por qué es la C: Juan cambió solo el material: el volumen, la forma y la altura fueron iguales. Si los tres caen con la misma gravedad y aun así tardan distinto, sus aceleraciones fueron distintas, y la aceleración la da la fuerza neta sobre cada uno (el peso menos el empuje del aire, que no los frena igual): esa pregunta sí se contesta con lo que observó (C). A pregunta por la altura y D por la forma, que no se cambiaron; B pide relacionar fuerza y masa, y Juan no midió ni masas ni fuerzas.", "Es de indagación: no pide física nueva, pide la ficha del experimento justo. ¿Qué cambió Juan? ¿Qué dejó igual? ¿Qué observó?", "Una pregunta solo se contesta si lo que ella pregunta es justo lo que se cambió o lo que se midió."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 4<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>El salto desde el puente<\/h3><p>El salto bungee es un deporte que se practica generalmente en puentes. En uno de estos saltos, el deportista se lanzará desde un puente de 65 metros de altura, utilizando una banda elástica que tiene una longitud sin estirar de 30 metros y que puede estirarse 30 metros más.<\/p><\/div><div><p class=\"enun\">Cuando el deportista ha descendido apenas 20 metros de altura, ¿cuál de las siguientes transformaciones de energía se habrá dado?<\/p><div class=\"ops\" id=\"icf14\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>De energía cinética a potencial elástica.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>De energía cinética a potencial gravitacional.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>De energía potencial gravitacional a potencial elástica.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>De energía potencial gravitacional a cinética.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf14\" data-k=\"D\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la D.", "Por qué es la D: la banda mide 30 m sin estirar: durante los primeros 30 m de caída va floja y no hace fuerza. A los 20 m solo ha actuado la gravedad: el deportista perdió altura y ganó rapidez, de energía potencial gravitacional a cinética (D). La energía elástica (A y C) aparece después de los 30 m, cuando la banda empieza a estirarse; B es al revés, sería subir.", "Que marquen en una regla dos puntos: dónde empieza a estirarse la banda (a los 30 m) y dónde va el deportista (a los 20 m).", "La palabra que decide es «apenas»: todavía falta la transformación de abajo. Con la banda estirada del todo, a los 60 m, el deportista se detiene 5 m por encima del fondo.", "El cuadernillo trae una foto del puente; no hace falta para responder y no se proyecta. ---"]}}, {"m": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m6)\">Cierre<\/span><span class=\"kicker\">La pregunta de siempre<\/span><\/div><h2>¿En qué se parecía la pregunta tipo Saber 11 a la de tu libro?<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:#242478\"><div class=\"k\">1<\/div><div><b>Las fuerzas, una por una<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#A82424\"><div class=\"k\">2<\/div><div><b>La gráfica cuenta el movimiento<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#C9821B\"><div class=\"k\">3<\/div><div><b>El experimento justo<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#5B3E96\"><div class=\"k\">4<\/div><div><b>Lo que se conserva<\/b><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--m6)\"><h3>Antes de salir<\/h3><ol class=\"pasos\"><li>El concepto del día —una ley, una magnitud o una relación—, en «Palabras que me frenaron», con tus palabras.<\/li><li>«Lo que me llevo de esta pregunta».<\/li><li>Tu carita de salida.<\/li><li>La clase 1 de la portada del área, con la causa que encontraste.<\/li><\/ol><\/div><\/div>", "guia": {"obj": "Que el estudiante nombre la estrategia que usó y se lleve un concepto del día —una ley, una magnitud o una relación— escrito en sus propias palabras.", "decir": ["Socializa solo las preguntas que el grupo falló, pidiendo la flecha o la cuenta que las resuelve.", "Pide que lean en voz alta su salvavidas: lo mínimo que sí tenían claro.", "Cada uno escribe el concepto del día en «Palabras que me frenaron» y la causa que encontró en la portada del área."], "como": "No dicta la definición ni la fórmula. El concepto se escribe como el estudiante lo entendió; si quedó mal entendido, eso se ve en la hoja y se corrige la próxima clase.", "apoyo": ["El concepto del día no se dicta. Si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase: es mejor que dictarla bien.", "Para el cierre del momento: La pregunta 5 dice «equilibrio» donde la física dice «conservación del momento angular». Vale la pena separar las dos palabras: el bailarín no está quieto, está girando con el giro total constante."]}}];
var MOM = [{"n": 1, "nom": "Activación", "min": 15, "c": "--m1"}, {"n": 2, "nom": "Pregunta problematizadora", "min": 20, "c": "--m2"}, {"n": 3, "nom": "Desarrollo guiado", "min": 35, "c": "--m3"}, {"n": 4, "nom": "Reto en equipo", "min": 20, "c": "--m4"}, {"n": 5, "nom": "Evaluación individual", "min": 20, "c": "--m5"}, {"n": 6, "nom": "Cierre", "min": 10, "c": "--m6"}];
var NOMBRE = document.getElementById("momnom").textContent, SUB = document.getElementById("momsub").textContent;
var $ = function(s){ return document.querySelector(s); };
var wrap = $("#wrap"), stage = $("#stage"), i = 0;
var tBase = 0, tLeft = 0, tOn = false, tick = null;
var elegidas = [];
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function paintClock(){
  var n = $("#tnum");
  if(!tBase){ n.textContent = "—"; n.classList.remove("over"); return; }
  var s = Math.abs(tLeft), mm = Math.floor(s/60), ss = s%60;
  n.textContent = (tLeft<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", tLeft<0);
}
function setTimer(min){
  tBase = min||0; tLeft = tBase*60; tOn = false;
  if(tick){ clearInterval(tick); tick = null; }
  $("#play").textContent = "Iniciar"; paintClock();
}
function toggleTimer(){
  if(!tBase) return;
  tOn = !tOn; $("#play").textContent = tOn ? "Pausar" : "Seguir";
  if(tick){ clearInterval(tick); tick = null; }
  if(tOn) tick = setInterval(function(){ tLeft--; paintClock(); }, 1000);
  paintClock();
}
// cronómetro de la prueba (clase 7): aparte del de la barra, no se reinicia al cambiar de diapositiva
var EX = {base:0, left:0, on:false, t:null, ini:null};
function hhmm(d){ return d.getHours() + ":" + (d.getMinutes()<10?"0":"") + d.getMinutes(); }
function exPaint(){
  var box = wrap.querySelector("[data-examen]"); if(!box) return;
  if(!EX.base){ EX.base = +box.dataset.examen; EX.left = EX.base*60; }
  var s = Math.abs(EX.left), mm = Math.floor(s/60), ss = s%60;
  var n = box.querySelector("[data-exnum]");
  n.textContent = (EX.left<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", EX.left<0);
  box.querySelector("[data-exini]").textContent = EX.ini ? hhmm(EX.ini) : "—";
  box.querySelector("[data-exfin]").textContent = EX.on ? hhmm(new Date(Date.now() + EX.left*1000)) : (EX.ini ? "en pausa" : "—");
  var p = box.querySelector('[data-ex="play"]');
  p.textContent = EX.on ? "Pausar" : (EX.ini ? "Seguir" : "Iniciar la prueba");
}
function exToggle(){
  if(!EX.base) exPaint();
  EX.on = !EX.on;
  if(EX.t){ clearInterval(EX.t); EX.t = null; }
  if(EX.on){ if(!EX.ini) EX.ini = new Date(); EX.t = setInterval(function(){ EX.left--; exPaint(); }, 1000); }
  exPaint();
}
function exReset(){
  if(EX.ini && !window.confirm("¿Volver a poner el cronómetro de la prueba en cero?")) return;
  if(EX.t){ clearInterval(EX.t); EX.t = null; }
  EX.on = false; EX.ini = null; EX.left = EX.base*60; exPaint();
}
// casillas que llena el profe (clase 8): se guardan mientras la página esté abierta
var CAMPOS = {};
function pintaCampos(){
  [].forEach.call(wrap.querySelectorAll("[data-campo]"), function(x){ x.value = CAMPOS[x.dataset.campo] || ""; });
  [].forEach.call(wrap.querySelectorAll("[data-eco]"), function(x){ x.textContent = CAMPOS[x.dataset.eco] || "—"; });
}
function guiaHTML(g){
  if(!g) return '<p class="sub">Sin notas para esta diapositiva.</p>';
  var h = '<div class="gbox"><h4>Objetivo</h4><p>'+esc(g.obj)+'</p></div>';
  if(g.decir && g.decir.length) h += '<div class="gbox"><h4>Qué haces y qué dices</h4><ul>'+
     g.decir.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  if(g.como) h += '<div class="gbox como"><h4>Lo que no haces</h4><p>'+esc(g.como)+'</p></div>';
  if(g.apoyo && g.apoyo.length) h += '<div class="gbox apoyo"><h4>Si Física no es tu fuerte</h4><ul>'+
     g.apoyo.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  return h;
}
function pintaElegidas(){
  var box = document.getElementById("elegidas"); if(!box) return;
  if(!elegidas.length){ box.innerHTML = '<p class="sub">Vuelve a la diapositiva anterior y escoge las cinco.</p>'; return; }
  box.innerHTML = elegidas.map(function(t,k){
    return '<div class="card edge" style="--accent:var(--m'+((k%6)+1)+')"><h3>'+(k+1)+'. '+esc(t)+'</h3>'+
      '<p class="sub">Busca esta pregunta en tu simulacro y en la hoja de taller de la misma estrategia.</p></div>';
  }).join("");
}
function go(n){
  var prev = SC[i];
  i = Math.max(0, Math.min(SC.length-1, n));
  var s = SC[i];
  wrap.innerHTML = s.html;
  wrap.classList.remove("enter"); void wrap.offsetWidth; wrap.classList.add("enter");
  stage.scrollTop = 0;
  var m = s.m!=null ? MOM[s.m] : null;
  $("#momdot").style.background = m ? "var("+m.c+")" : "var(--faint)";
  $("#momdot").textContent = m ? m.n : "·";
  $("#momnom").textContent = m ? m.nom : NOMBRE;
  $("#momsub").textContent = m ? (m.min+" minutos") : SUB;
  var want = s.min!=null ? s.min : (m ? m.min : 0);
  var cambio = !prev || prev===s || prev.m!==s.m || (prev.min||null)!==(s.min||null);
  if(cambio) setTimer(want);
  $("#count").textContent = (i+1)+" / "+SC.length;
  $("#prog i").style.width = (SC.length>1 ? i/(SC.length-1)*100 : 100)+"%";
  $("#guiabody").innerHTML = guiaHTML(s.guia);
  [].forEach.call(wrap.querySelectorAll("[data-pick]"), function(b){
    b.setAttribute("aria-pressed", elegidas.indexOf(b.textContent)>=0 ? "true" : "false"); });
  pintaElegidas();
  pintaCampos();
  exPaint();
  $("#clock").style.visibility = wrap.querySelector("[data-examen]") ? "hidden" : "";   // la prueba tiene su reloj
}
wrap.addEventListener("input", function(e){
  var x = e.target; if(!x.dataset || !x.dataset.campo) return;
  CAMPOS[x.dataset.campo] = x.value;
});
wrap.addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.dataset.ex==="play") exToggle();
  if(b.dataset.ex==="reset") exReset();
  if(b.dataset.show){ var t = document.getElementById(b.dataset.show); if(t) t.hidden = !t.hidden; }
  if(b.dataset.showgrupo){
    var g = wrap.querySelectorAll('[data-grupo="'+b.dataset.showgrupo+'"]'), abrir = g.length && g[0].hidden;
    [].forEach.call(g, function(x){ x.hidden = !abrir; });
    b.textContent = abrir ? "Ocultar las claves" : "Revelar las claves";
  }
  if(b.dataset.clave){
    var box = document.getElementById(b.dataset.clave), ok = box.querySelector('[data-op="'+b.dataset.k+'"]');
    var on = ok && !ok.classList.contains("ok");
    [].forEach.call(box.querySelectorAll(".op"), function(o){ o.classList.remove("ok"); });
    if(on) ok.classList.add("ok");
    b.textContent = on ? "Ocultar la clave" : "Revelar la clave";
  }
  if(b.dataset.tally){ var n = document.getElementById(b.dataset.tally); n.textContent = (+n.textContent||0)+1; }
  if(b.dataset.reset){ [].forEach.call(wrap.querySelectorAll('[id^="'+b.dataset.reset+'"]'), function(x){
    if(x.classList.contains("n")) x.textContent = "0"; }); }
  if(b.dataset.pick!=null){
    var t = b.textContent, k = elegidas.indexOf(t);
    if(k>=0) elegidas.splice(k,1); else if(elegidas.length<5) elegidas.push(t);
    b.setAttribute("aria-pressed", elegidas.indexOf(t)>=0 ? "true" : "false");
  }
});
function setGuia(on){ $("#guia").classList.toggle("open", on); $("#scrim").classList.toggle("on", on);
  $("#gbtn").setAttribute("aria-pressed", on ? "true" : "false"); }
$("#next").addEventListener("click", function(){ go(i+1); });
$("#prev").addEventListener("click", function(){ go(i-1); });
$("#play").addEventListener("click", toggleTimer);
$("#reset").addEventListener("click", function(){ setTimer(tBase); });
$("#gbtn").addEventListener("click", function(){ setGuia(!$("#guia").classList.contains("open")); });
$("#gclose").addEventListener("click", function(){ setGuia(false); });
$("#scrim").addEventListener("click", function(){ setGuia(false); });
document.addEventListener("keydown", function(e){
  var t = e.target.tagName; if(t==="INPUT"||t==="TEXTAREA"||e.target.isContentEditable) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ go(i+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ go(i-1); e.preventDefault(); }
  else if(e.key==="Home"){ go(0); e.preventDefault(); }
  else if(e.key==="End"){ go(SC.length-1); e.preventDefault(); }
  else if(e.key==="g"||e.key==="G"){ setGuia(!$("#guia").classList.contains("open")); }
  else if(e.key==="t"||e.key==="T"){ if(wrap.querySelector("[data-examen]")) exToggle(); else toggleTimer(); }
  else if(e.key==="Escape"){ setGuia(false); }
});
go(0);
})();
</script>
</body>
</html>
