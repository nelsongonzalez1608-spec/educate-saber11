<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Física · Clase 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>[hidden]{display:none!important}
:root{
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --text:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --area:#5C7A1E; --azul:#1F4E8C; --oro:#B0711A; --morado:#5B3E96; --verde:#2E7A39;
  --m1:#5C7A1E; --m2:#1F4E8C; --m3:#3B3BA6; --m4:#5B3E96; --m5:#A82424; --m6:#4A5A70; --rojo:#A82424;
  --ink:#1B1F27; --muted:#5C6472; --faint:#A9B0BB; --line:#E3E7ED; --paper:#FFFFFF; --bg:#F6F4F1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:clamp(16px,1.25vw,21px);line-height:1.5}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
#top{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding:10px clamp(14px,2vw,28px);background:var(--paper);flex-wrap:wrap}
.logo img{height:clamp(28px,2.6vw,40px);display:block}
#mom{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
#momdot{width:clamp(30px,2.4vw,40px);height:clamp(30px,2.4vw,40px);border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;background:var(--faint)}
#momnom{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.2vw,20px)}
#momsub{color:var(--muted);font-size:.85em}
#clock{display:flex;align-items:center;gap:8px}
#tnum{font-family:var(--display);font-weight:800;font-size:clamp(20px,1.8vw,30px);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
#tnum.over{color:var(--area)}
.btn{appearance:none;font:inherit;font-size:.86em;font-weight:600;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.solid{background:var(--area);border-color:var(--area);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#stage{overflow:auto;padding:clamp(18px,3vw,48px) clamp(16px,4vw,72px)}
#wrap{max-width:1500px;margin:0 auto}
#wrap.enter{animation:ent .28s ease-out}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bot{display:flex;align-items:center;gap:12px;padding:10px clamp(14px,2vw,28px);background:var(--paper)}
#prog{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
#prog i{display:block;height:100%;background:var(--area);transition:width .25s}
#count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
#hint{color:var(--faint);font-size:.8em}
@media (max-width:760px){#hint{display:none}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.2vw,68px);line-height:1.05;margin:.2em 0 .25em;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,2.8vw,46px);line-height:1.1;margin:.25em 0 .3em;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:clamp(18px,1.5vw,26px);margin:.1em 0 .4em;line-height:1.2}
p{margin:.35em 0 .6em}
.lead{font-size:1.2em;line-height:1.45;max-width:70ch}
.sub{color:var(--muted)}
.mt{margin-top:clamp(14px,1.8vw,26px)}
.logo-xl img{height:clamp(54px,6vw,96px);margin-bottom:12px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tag,.min,.membrete{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.78em;font-weight:700;letter-spacing:.02em}
.tag{background:var(--ink);color:#fff}
.min{background:var(--accent,var(--area));color:#fff}
.membrete{border:1.5px solid var(--line);color:var(--muted)}
.kicker{color:var(--muted);font-size:.85em;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.grid{display:grid;gap:clamp(12px,1.4vw,22px)}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid>*{min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,1.6vw,24px)}
.card.edge{border-left:6px solid var(--accent,var(--area))}
.card.big .lead{font-size:1.3em}
.step{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px}
.step .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;flex:none}
.note{border-left:5px solid var(--accent,var(--area));background:var(--paper);border-radius:10px;padding:10px 16px;margin-top:12px}
.cita{font-family:var(--display);font-weight:600;line-height:1.35;background:var(--paper);border-left:6px solid var(--area);border-radius:12px;padding:clamp(16px,2vw,30px);margin:18px 0}
.cita.xl{font-size:clamp(24px,2.6vw,44px)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally .n{display:inline-block;min-width:1.6em;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.pasos{margin:.2em 0 0;padding-left:1.3em}.pasos li{margin:.3em 0}
.sello{margin-top:12px;border:2px dashed var(--oro);border-radius:12px;padding:10px 14px;background:#FDF6EA}
.sello b{display:block;color:var(--oro);font-size:.8em;letter-spacing:.06em;text-transform:uppercase}
.clave{margin-top:12px;display:flex;align-items:center;gap:10px;font-weight:600}
.keychip{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:10px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.2em}
.aviso{margin-top:10px;border-radius:10px;padding:10px 14px;background:#FBEFEF;border-left:5px solid var(--area);font-size:.92em}
.aviso.sev-aten{background:#EDF5EE;border-left-color:var(--verde)}
.aviso.sev-medi{background:#FDF5E7;border-left-color:var(--oro)}
.icfes .texto{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.6vw,24px);max-height:62vh;overflow:auto;font-size:.95em}
.enun{font-weight:600;font-size:1.08em}
.ops{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.op .L{flex:none;width:1.8em;height:1.8em;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-family:var(--display);font-weight:800}
.op.ok{border-color:var(--verde);background:#EDF5EE}.op.ok .L{background:var(--verde);color:#fff}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick[aria-pressed="true"]{background:var(--area);border-color:var(--area);color:#fff}
#scrim{position:fixed;inset:0;background:rgba(15,18,24,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#guia{position:fixed;top:0;right:0;height:100%;width:min(520px,92vw);background:var(--paper);box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column;z-index:10}
#guia.open{transform:none}
#guiahead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg)}
#guiabody{overflow:auto;padding:16px 20px 30px;font-size:.92em}
.gbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.gbox h4{margin:0 0 6px;font-family:var(--display);font-size:.8em;letter-spacing:.07em;text-transform:uppercase;color:var(--area)}
.gbox ul{margin:0;padding-left:1.1em}.gbox li{margin:.35em 0}
.gbox.como{background:#F6F7F9}.gbox.como h4{color:var(--muted)}
.gbox.apoyo{background:#FDF6EA;border-color:#EAD9B4}.gbox.apoyo h4{color:var(--oro)}
.examen{background:var(--paper);border:1px solid var(--line);border-left:8px solid var(--area);border-radius:22px;padding:clamp(16px,2.4vw,40px);margin-top:clamp(12px,1.6vw,24px);text-align:center}
.relojxl{font-family:var(--display);font-weight:800;font-size:clamp(96px,17vw,280px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.relojxl.over{color:var(--area)}
.exhoras{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 36px;color:var(--muted);font-size:1.15em;margin-top:10px}
.exhoras b{color:var(--ink);font-variant-numeric:tabular-nums}
.nbig{font-family:var(--display);font-weight:800;font-size:clamp(40px,4vw,64px);line-height:1;color:var(--accent,var(--area))}
.asig{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:8px 0}
.asig .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;flex:none}
.asig label{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted)}
.asig label.w{flex:1;min-width:min(100%,260px)}
.campo{font:inherit;font-size:1.1em;font-weight:700;color:var(--ink);border:none;border-bottom:2px dashed var(--faint);background:transparent;padding:4px 6px;min-width:0;flex:1;outline:none}
.campo.n{width:4.5em;flex:none;text-align:center}
.campo:focus{border-bottom-color:var(--area)}
.nums1{border:1.5px solid var(--line);border-radius:999px;padding:3px 14px;background:var(--paper);font-weight:600;color:var(--muted)}
.nums1 b{color:var(--ink)}
.pides{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:1.08em}
.pide{display:inline-flex;align-items:center;gap:8px}
.chk{display:inline-block;width:20px;height:20px;border:2px solid var(--area);border-radius:4px;background:#fff;flex:none}
.herrs{display:grid;gap:clamp(12px,1.4vw,22px);grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.herr{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--area);border-radius:16px;padding:14px 18px;font-size:1.12em}
.herr svg{flex:none}
[hidden]{display:none!important}
.fig{margin:12px 0}.fig svg{display:block;width:100%;max-width:760px;height:auto}
.tabla{border-collapse:collapse;width:100%;table-layout:fixed;font-size:.86em;line-height:1.35;margin:0 auto}
.tabla th,.tabla td{border:1px solid var(--line);padding:5px 8px;vertical-align:top;overflow-wrap:anywhere}
.tabla th{background:#F2F4EE;text-align:left}.fig figcaption{font-size:.85em;font-style:italic;color:var(--muted)}
.ops.cuatro{grid-template-columns:repeat(4,1fr)}.ops.cuatro .op{padding:8px 10px;gap:8px;font-size:.92em;align-items:center}
.derfig .fig{margin:0 0 10px}.opsfig{background:var(--paper);border:1px solid var(--line);
border-radius:14px;padding:8px 10px;margin-top:10px}.opsfig .fig{margin:0}
.aviso{border-left-color:var(--rojo)}.aviso.sev-baja{background:#EEF3FA;border-left-color:var(--azul)}
</style>
</head>

>Las diez preguntas de la prueba de campo, páginas 216 a 218<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m4)\"><h3>Tu cuaderno<\/h3><p class=\"sub\">Páginas 272 a 278<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m6)\"><h3>Hoy<\/h3><p class=\"sub\">120 minutos · 6 momentos · EF y UC · calor, cuentas y partículas<\/p><\/div><\/div>", "guia": {"obj": "Que el grupo sepa desde el primer minuto qué va a pasar en estos 120 minutos y qué tiene que tener sobre la mesa.", "decir": ["«Libro abierto, cuaderno cerrado, lápiz. Hoy nadie me va a decir la fórmula de memoria: me van a mostrar la flecha o el julio que explica lo que pasa.»"], "apoyo": ["⚑ Antes del sábado: La pregunta 10 tiene dos opciones correctas (la A y la D dan el mismo 0,25) y la 4 explica al revés cómo funciona la olla a presión. Las dos están en la hoja de esta clase, con qué hacer.", "Seguridad de las dinámicas: En «El baile de las moléculas» los pupitres van a un lado y nadie corre, aunque las palmas vayan rápido.", "Los cuatro conceptos que tienes que poder explicar hoy en dos minutos, sin jerga. Si un estudiante sabe más que tú de un tema, déjalo explicar y pide que lo muestre con una flecha o con una cuenta con unidades:", "Calor y temperatura: La temperatura mide qué tan agitadas están las partículas; el calor es la energía que pasa de lo más caliente a lo más frío. Solo, el calor nunca va del frío al caliente.", "Conducción, convección y radiación: Conducción: el calor pasa de partícula en partícula por un sólido (la pared, la cuchara). Convección: el aire o el agua caliente, menos densos, suben y se llevan el calor. Radiación: viaja sin medio, como el calor del sol.", "Q = m · c · ΔT: El calor que gana o pierde algo es su masa por su calor específico por el cambio de temperatura. El agua tiene c = 1 cal/(g·°C): un gramo sube un grado con una caloría. Doble masa con el mismo calor: la mitad de grados.", "Ebullición y presión: El agua hierve cuando la presión de su vapor iguala la presión de afuera. Con menos presión, como en una montaña, hierve a menos de 100 °C; en la olla a presión, a más, y por eso cocina rápido.", "Abre esta guía con la tecla G en cada diapositiva: trae lo que dices y, debajo, lo que necesitas saber si Física no es tu área.", "El cronómetro arranca con T y se reinicia solo cuando cambia el momento de la clase."]}}, {"m": null, "html": "<div class=\"eyebrow\"><span class=\"kicker\">Así vamos a trabajar<\/span><\/div><h2>Seis momentos, una sola regla<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:var(--m1)\"><div class=\"k\">1<\/div><div><b>Activación<\/b><span class=\"sub\"> · 15 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m2)\"><div class=\"k\">2<\/div><div><b>Pregunta problematizadora<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m3)\"><div class=\"k\">3<\/div><div><b>Desarrollo guiado<\/b><span class=\"sub\"> · 35 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m4)\"><div class=\"k\">4<\/div><div><b>Reto en equipo<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m5)\"><div class=\"k\">5<\/div><div><b>Evaluación individual<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m6)\"><div class=\"k\">6<\/div><div><b>Cierre<\/b><span class=\"sub\"> · 10 min<\/span><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--area)\"><h3>La regla del cuaderno<\/h3><p class=\"lead\">Si el instrumento está vacío, no lo resolviste: lo adivinaste.<\/p><p>Primero se hace el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento—, después se marca la opción. Una respuesta correcta con el instrumento en blanco no cuenta como resuelta.<\/p><\/div><\/div>", "guia": {"obj": "Que la regla quede dicha en voz alta antes de cualquier texto.", "decir": ["«La respuesta correcta con el instrumento vacío no cuenta. ¿Por qué? Porque en Física casi todas las opciones usan palabras técnicas: el que no dibujó la flecha ni hizo la cuenta escoge la que suena mejor, no la que es.»"], "apoyo": ["Si alguien pregunta para qué dibujar, la respuesta corta es: lo que separa la opción correcta de las que suenan bien está en el sentido de una flecha, en un signo o en una unidad, y eso se pierde si no se escribe.", "Si alguien dice «es por la gravedad» o «es la energía», devuélvele la pregunta: «¿quién empuja a quién, y hacia dónde?»."]}}, {"m": 0, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Activación<\/span><span class=\"kicker\">Cuaderno cerrado<\/span><\/div><h2>¿Qué cambió y qué lo causó?<\/h2><blockquote class=\"cita xl\">Al soplar sobre una cucharada de sopa caliente, se enfría más rápido que si se deja quieta.<\/blockquote><p class=\"lead\">Dos respuestas antes de cualquier fórmula. Todavía no se abre el cuaderno.<\/p><div class=\"ctl\"><button class=\"btn\" data-show=\"pista2\">Mostrar la pista<\/button><\/div><div class=\"note\" id=\"pista2\" hidden style=\"--accent:var(--m1)\"><b>Pista:<\/b> el calor va de la sopa al aire más frío; el soplo se lleva el aire caliente y húmedo de encima, y las partículas más rápidas se evaporan y se llevan su energía<\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno corto diciendo qué cambió y qué lo causó —qué fuerza, qué calor, qué carga— antes de explicarlo con fórmulas y antes de ver cualquier opción.", "decir": ["Proyecta o lee una observación de dos o tres renglones sin decir de dónde salió.", "Pide dos respuestas, en voz alta o en el tablero: qué cambió y qué lo causó, dicho como una flecha con nombre («el piso frena…», «el calor va de… a…»).", "Ejecuta la dinámica de apertura según la estrategia del encuentro."], "como": "No explica el fenómeno ni acepta todavía fórmulas. Si alguien dice «es por la gravedad» o «es la energía», le devuelve la pregunta: «¿quién empuja a quién, y hacia dónde?». El cuaderno sigue cerrado.", "apoyo": ["No expliques el fenómeno ni aceptes todavía fórmulas: primero qué cambió y qué lo causó, dicho como una flecha con nombre. La observación es inventada para la clase: no sale del libro.", "La pista existe para el cierre de los 15 minutos, no para el principio: el calor va de la sopa al aire más frío; el soplo se lleva el aire caliente y húmedo de encima, y las partículas más rápidas se evaporan y se llevan su energía."]}}, {"m": 0, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#242478\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 1 · El calor va del caliente al frío<\/span><\/div><h2>La fila del calor<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Ocho estudiantes en fila son las partículas de una varilla. Los dos de un extremo están «calientes»: se frotan las manos rápido.<\/li><li>Solo se le pasa agitación al vecino más quieto, tocándole el hombro: él se frota más rápido y el que la dio, más despacio.<\/li><li>El grupo mira hacia dónde viaja la agitación y cuándo se detiene: cuando todos se frotan igual.<\/li><li>«¿Puedes pasarle agitación al que está más caliente que tú?». El grupo dice por qué no.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Ninguno<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno corto diciendo qué cambió y qué lo causó —qué fuerza, qué calor, qué carga— antes de explicarlo con fórmulas y antes de ver cualquier opción.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No explica el fenómeno ni acepta todavía fórmulas. Si alguien dice «es por la gravedad» o «es la energía», le devuelve la pregunta: «¿quién empuja a quién, y hacia dónde?». El cuaderno sigue cerrado.", "apoyo": ["Qué movimiento mental entrena: Ubicar quién está más caliente y quién más frío antes de decir hacia dónde va el calor, y ver que el paso se detiene cuando las temperaturas se igualan. Es el movimiento de las preguntas 1, 6 y 8, y de la primera del entrenamiento (el aire caliente del globo).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 1, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m2)\">Pregunta problematizadora<\/span><span class=\"kicker\">Libro abierto en la pregunta modelo<\/span><\/div><h2>Abran el libro en la pregunta 1, página 216<\/h2><p class=\"lead\">Antes de dibujar o calcular: ¿cuál creen que es? Levanten la mano.<\/p><div class=\"ctl\"><button class=\"btn tally\" data-tally=\"h2A\">A <span class=\"n\" id=\"h2A\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h2B\">B <span class=\"n\" id=\"h2B\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h2C\">C <span class=\"n\" id=\"h2C\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h2D\">D <span class=\"n\" id=\"h2D\">0<\/span><\/button><button class=\"btn\" data-reset=\"h2\">↺<\/button><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta que gobierna el área<\/h3><p class=\"lead\">¿Qué lo causó? Muéstrame la flecha o el julio que lo explica.<\/p><p class=\"sub\">Nadie justifica con «así dice la fórmula» ni con «eso es obvio»: toda respuesta señala una flecha del dibujo, un número con su unidad o un renglón del enunciado.<\/p><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta de este momento<\/h3><p class=\"lead\">¿De dónde a dónde va el calor, y cuánto hace falta para ese cambio?<\/p><\/div>", "guia": {"obj": "Que el estudiante compruebe que en Física la respuesta sale de la causa dibujada o de la cuenta con unidades, y no de la opción que suena más técnica, usando la pregunta modelo del libro.", "decir": ["Presenta la pregunta modelo del libro y la deja a la vista todo el momento.", "Pide respuestas a mano alzada ANTES de dibujar o calcular nada, y las anota en el tablero.", "Hace la pregunta que gobierna el área: ¿qué lo causó? Muéstrame la flecha o el julio que lo explica.", "Revela la clave solo al final y trabaja por qué cae cada una de las otras tres."], "como": "Regla del momento: nadie justifica con «así dice la fórmula» ni con «eso es obvio». Toda intervención señala una flecha del dibujo, un número con su unidad o un renglón del enunciado.", "apoyo": ["La pregunta modelo es la 1 del libro (página 216). El cuaderno se abre en la página 272 solo en «mi primera idea».", "Cuenta las manos tocando cada letra: el número queda en pantalla y sirve para el final del momento, cuando el grupo vea cuántos cambiaron de opinión al dibujar la flecha o hacer la cuenta.", "No digas la clave en este momento: sale en el bloque de las preguntas 1 y 2, después de llenar el instrumento en pantalla, casilla por casilla. Ahí se trabaja por qué cae cada una de las otras tres."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 1 y 2<\/span><span class=\"kicker\">En pantalla, casilla por casilla<\/span><\/div><h2>Preguntas 1 y 2: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 1<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · El calor va del caliente al frío<\/span><\/div><p class=\"sub\">Pared de ladrillo de doble grosor · qué pasa con el calor<\/p><h3 style=\"color:#242478\">Dos paredes, una misma diferencia de temperatura<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Ley de Fourier<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k21\"><span class=\"keychip\" style=\"background:#242478\">A<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 2<\/span><span class=\"min\" style=\"--accent:#C9821B\">E3 · Lo que hacen las partículas<\/span><\/div><p class=\"sub\">Agua hirviendo lanzada al aire bajo cero · por qué se congela<\/p><h3 style=\"color:#C9821B\">Un balde de agua o mil gotitas<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k21\"><span class=\"keychip\" style=\"background:#C9821B\">B<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k21\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 1·A y 2·B. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 1 · Ley de Fourier: El calor que cruza una pared cada segundo es Q ÷ t = k · A · (T₁ − T₂) ÷ d: crece con el área y con la diferencia de temperatura, y baja con el grosor d, que está dividiendo. Doble grosor, la mitad del calor por segundo. Para destrabar: «¿El grosor está multiplicando o dividiendo?»", "Pregunta 1 · aviso del libro (baja), solo para ti, no se proyecta: El libro escribe la ley de Fourier sin el tiempo: es el calor por segundo (Q ÷ t). Qué haces: El sello del cuaderno ya la trae bien escrita.", "Pregunta 2 · aviso del libro (atención), solo para ti, no se proyecta: El caso se llama «efecto Mpemba», pero lanzar agua hirviendo al aire bajo cero es otro fenómeno: gotas finas que se evaporan y se congelan. Qué haces: No cambia las claves B y C. No enseñes ese nombre para este fenómeno."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 3 y 4<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 3 y 4: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 3<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E4 · El ambiente decide el cambio de fase<\/span><\/div><p class=\"sub\">El mismo fenómeno en otro lugar · qué condición es indispensable<\/p><h3 style=\"color:#5B3E96\">La prueba de quitar una condición<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k23\"><span class=\"keychip\" style=\"background:#5B3E96\">C<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 4<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E4 · El ambiente decide el cambio de fase<\/span><\/div><p class=\"sub\">Olla a presión que suelta vapor · temperatura de ebullición<\/p><h3 style=\"color:#5B3E96\">La tabla de la presión de vapor<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k23\"><span class=\"keychip\" style=\"background:#5B3E96\">B<\/span> es la clave del libro<\/div><div class=\"aviso sev-medi\" hidden data-grupo=\"k23\"><b>Ojo con esta clave:<\/b> El texto del libro lo dice al revés: con menos presión el agua hierve a menos temperatura y cocina más despacio. La olla a presión cocina rápido porque la presión es alta.<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k23\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 3·C y 4·B. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 3 · aviso del libro (atención), solo para ti, no se proyecta: El caso se llama «efecto Mpemba», pero lanzar agua hirviendo al aire bajo cero es otro fenómeno: gotas finas que se evaporan y se congelan. Qué haces: No cambia las claves B y C. No enseñes ese nombre para este fenómeno.", "Pregunta 4 · aviso del libro (media): El texto del libro lo dice al revés: con menos presión el agua hierve a menos temperatura y cocina más despacio. La olla a presión cocina rápido porque la presión es alta. Qué haces: No cambia la clave B. Corrígelo en voz alta: la olla a presión cocina rápido por la presión alta."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#A82424\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 2 · La cuenta del calor<\/span><\/div><h2>El mismo calor para más masa<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Dos equipos: uno de dos estudiantes y otro de cuatro. Cada uno es una porción igual del mismo material y empieza agachado: 20 grados.<\/li><li>Cada equipo recibe ocho fichas de calor; cada ficha sube un grado a quien la recibe, y por cada grado se estira un poco.<\/li><li>Reparten por igual y el grupo compara: ¿qué equipo subió más grados por persona?<\/li><li>Segunda ronda: un equipo es de un material «terco», de dos fichas por grado. El grupo predice antes de repartir.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Dieciséis fichas de papel<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Qué movimiento mental entrena: Llevar la cuenta del calor: el mismo calor en más masa sube menos la temperatura, y un calor específico mayor pide más calor por grado (Q = m · c · ΔT). Es el movimiento de las preguntas 7, 9 y 10, y de la segunda del entrenamiento (dos litros en la misma estufa).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 5 y 6<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 5 y 6: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 5<\/span><span class=\"min\" style=\"--accent:#C9821B\">E3 · Lo que hacen las partículas<\/span><\/div><p class=\"sub\">Gas que se enfría hacia el cero absoluto · qué dice la gráfica<\/p><h3 style=\"color:#C9821B\">Lo que baja por cada 20 J<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k25\"><span class=\"keychip\" style=\"background:#C9821B\">C<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 6<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · El calor va del caliente al frío<\/span><\/div><p class=\"sub\">Vidrio que se empaña y luego se aclara · qué proceso<\/p><h3 style=\"color:#242478\">La ventana por dentro y por fuera<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k25\"><span class=\"keychip\" style=\"background:#242478\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k25\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 5·C y 6·A. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 5 · aviso del libro (media), solo para ti, no se proyecta: La gráfica se aplana cerca de −273 °C como si costara cada vez más energía bajar un grado; la física dice otra cosa, y un gas real se vuelve líquido mucho antes. Qué haces: Se responde leyendo la forma de la curva (C). No entres en la física de fondo: va al especialista."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#C9821B\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 3 · Lo que hacen las partículas<\/span><\/div><h2>El baile de las moléculas<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Doce estudiantes forman cuatro moléculas de agua: tríos de la mano, el oxígeno en el medio. Pupitres a un lado.<\/li><li>Palmas lentas: se mueven despacio y juntas. Palmas rápidas: más rápido y repartidas por el salón. Caminando, nunca corriendo.<\/li><li>Regla que nadie rompe: cambian la rapidez y la distancia, pero ningún trío se suelta.<\/li><li>El ritmo baja hasta casi parar: el grupo dice qué cambió y qué no cambió.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cinta para el piso<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Qué movimiento mental entrena: Explicar la temperatura y los cambios de fase con lo que hacen las partículas: más rápidas y más separadas, pero enteras. Es el movimiento de las preguntas 2 y 5, y de la tercera del entrenamiento (el modelo del agua líquida y en gas).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 7 y 8<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 7 y 8: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 7<\/span><span class=\"min\" style=\"--accent:#A82424\">E2 · La cuenta del calor<\/span><\/div><p class=\"sub\">Cobre y aluminio de 5 kg de 120 °C a 10 °C · cuál llega primero<\/p><h3 style=\"color:#A82424\">El calor que tiene que soltar cada bloque<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k27\"><span class=\"keychip\" style=\"background:#A82424\">C<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 8<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · El calor va del caliente al frío<\/span><\/div><p class=\"sub\">Termómetros cerca del suelo y del techo · qué proceso<\/p><h3 style=\"color:#242478\">El viaje del aire caliente por el salón<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k27\"><span class=\"keychip\" style=\"background:#242478\">D<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k27\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 7·C y 8·D. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 7 · aviso del libro (baja), solo para ti, no se proyecta: La clave C supone que los dos bloques pierden calor al mismo ritmo; con la misma masa, el de aluminio es más grande y tiene más superficie. Qué haces: La C se sostiene con Q = m · c · ΔT. Nombra el supuesto."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#5B3E96\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 4 · El ambiente decide el cambio de fase<\/span><\/div><h2>La puerta de la olla<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Cinco estudiantes son el agua de una olla. Junto a una «puerta» de cinta, cuatro más son el aire de afuera.<\/li><li>Cada palmada es más calor: las moléculas dan un paso hacia la puerta.<\/li><li>Una molécula sale —el agua hierve— cuando sus pasos igualan las personas de la puerta.<\/li><li>La puerta cambia: dos personas (menos aire empujando) o seis (olla tapada). El grupo predice antes de aplaudir.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cinta · un letrero «puerta»<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Qué movimiento mental entrena: Antes de decir a qué temperatura cambia de fase, mirar qué pone el ambiente: con menos presión afuera hierve antes; con más, después. Es el movimiento de las preguntas 3 y 4, y de la cuarta del entrenamiento (hervir agua a 25 km de altura).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 9 y 10<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 9 y 10: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 9<\/span><span class=\"min\" style=\"--accent:#A82424\">E2 · La cuenta del calor<\/span><\/div><p class=\"sub\">Calorímetro · 2 kg a 80 °C con 3 kg de agua a 20 °C<\/p><h3 style=\"color:#A82424\">La balanza del calor<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k29\"><span class=\"keychip\" style=\"background:#A82424\">C<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 10<\/span><span class=\"min\" style=\"--accent:#A82424\">E2 · La cuenta del calor<\/span><\/div><p class=\"sub\">Calorímetro · expresión del calor específico c₂<\/p><h3 style=\"color:#A82424\">Quién pierde, quién gana y cuánto<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k29\"><span class=\"keychip\" style=\"background:#A82424\">D<\/span> es la clave del libro<\/div><div class=\"aviso sev-alta\" hidden data-grupo=\"k29\"><b>Ojo con esta clave:<\/b> Dos opciones son correctas: la A y la D dan el mismo 0,25 cal/(g·°C), porque los dos signos menos de la A se cancelan. La clave tomada es D. Si marcaste A con la cuenta bien hecha, también tienes razón.<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k29\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 9·C y 10·D. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 9 · aviso del libro (atención), solo para ti, no se proyecta: Las masas vienen en kilogramos y el calor específico en cal/(g·°C): hay que pasar a gramos. La temperatura final es 35 °C. Qué haces: Que escriban la unidad de cada número antes de multiplicar.", "Pregunta 10 · aviso del libro (alta): Dos opciones son correctas: la A y la D dan el mismo 0,25 cal/(g·°C), porque los dos signos menos de la A se cancelan. La clave tomada es D. Si marcaste A con la cuenta bien hecha, también tienes razón. Qué haces: Clave tomada: D. Quien marque A con la cuenta bien hecha también tiene razón: dilo."]}}, {"m": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m4)\">Reto en equipo · 20 min<\/span><span class=\"kicker\">Equipos de tres · cada uno responde en su cuaderno<\/span><\/div><h2>Reto del corte: El tinto de las seis<\/h2><div class=\"card big edge mt\" style=\"--accent:var(--m4)\"><p class=\"lead\">Cada equipo recibe un caso: una taza con 200 g de tinto a 80 °C se deja en un salón a 20 °C. En doce minutos dibujan con flechas por dónde se va el calor (la taza, el aire que sube, el vapor); calculan cuánto calor suelta el tinto hasta llegar a 30 °C, con c = 1 cal/(g·°C), llevando las unidades; explican qué les pasa a las partículas mientras se enfría; y dicen hasta qué temperatura baja y por qué ahí se detiene. Cada uno cierra: «El tinto dejó de enfriarse porque ___, y eso no quiere decir que ___».<\/p><\/div><div class=\"note mt\" style=\"--accent:var(--m4)\"><b>La defensa:<\/b> tres minutos por equipo, señalando la flecha, la cuenta con su unidad o la variable que los respalda. «Porque sí» o «así dice la fórmula» no cuentan.<\/div>", "guia": {"obj": "Que el estudiante defienda su explicación con el dibujo o la cuenta en la mano y acepte que otro equipo puede ver una fuerza, una pérdida o una variable que él no vio.", "decir": ["Arma equipos de tres y entrega el reto del corte de este momento.", "Exige que cada integrante llegue con su instrumento YA diligenciado individualmente.", "Da tres minutos de defensa por equipo: muestran la flecha, la cuenta o la variable que los respalda.", "Cierra mostrando qué fuerza, qué julio o qué variable quedó por fuera en cada propuesta."], "como": "El equipo discute, pero cada uno escribe en SU tarjeta del reto. No se acepta una defensa que diga «porque sí» o «eso dice la fórmula»: se señala la flecha, el número con su unidad o la variable que se controló.", "apoyo": ["Las cuentas del reto, para ti (no se proyectan): Q = m · c · ΔT = 200 g · 1 cal/(g·°C) · (80 − 30) °C = 10 000 cal. El tinto se enfría hasta 20 °C, la temperatura del salón: ahí ya no hay diferencia que empuje el calor. Las partículas se mueven cada vez más despacio; las que se van como vapor son las más rápidas.", "El reto no tiene una sola respuesta correcta en todas sus partes: gana el equipo que mejor sostiene la suya con flechas y cuentas. Si dos explicaciones están sostenidas, dilo: eso también es hacer física.", "Si un equipo entrega una sola hoja para los tres, el reto no cuenta. La discusión es compartida; el registro es individual.", "Cierra mostrando qué fuerza, qué julio o qué variable quedó por fuera en cada propuesta."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 1<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>El globo que sube<\/h3><p>Para elevar un globo se calienta con fuego el aire que está dentro de él.<\/p><\/div><div><p class=\"enun\">La explicación más acertada de por qué el globo se eleva, es que al calentar el aire<\/p><div class=\"ops\" id=\"icf21\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>la presión contra las paredes internas del globo es mayor que la presión externa.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>una parte del aire sale con velocidad hacia abajo, generando un impulso hacia arriba.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>una parte del aire sale del globo, disminuyendo la densidad y generando un empuje que lo eleva.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>el plástico del globo se tensa disminuyendo su peso específico y el globo se eleva.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf21\" data-k=\"C\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la C.", "⚑ Fuente: compilado ASED (no es del ICFES). Nelson decide si se reemplaza; mientras tanto, no la presentes como «del ICFES».", "Por qué es la C: el fuego le pasa calor al aire de adentro, que se expande; como el globo está abierto por abajo, parte de ese aire sale. Adentro queda menos aire en el mismo volumen: el globo con su aire pesa menos que el aire frío que desplaza, y el empuje de ese aire lo sube (C). A: en un globo abierto la presión de adentro es casi la de afuera; B describe un cohete, no un globo; D: el plástico no pesa menos por tensarse.", "La cadena tiene tres eslabones: el calor entra al aire, el aire caliente queda menos denso, el empuje gana al peso. Que la escriban antes de mirar las opciones.", "Es el mismo principio de la pregunta 8 del taller: el aire caliente sube porque es menos denso."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 2<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Dos litros en la misma estufa<\/h3><p>Una estudiante calentó en una estufa, durante 1 minuto, un litro de agua que inicialmente estaba a 15 °C. La temperatura final del agua fue 17 °C.<\/p><\/div><div><p class=\"enun\">Si ahora calienta 2 litros de agua que inicialmente están a 15 °C, en la misma estufa durante un minuto, ¿cuál será la temperatura final de los 2 litros de agua?<\/p><div class=\"ops\" id=\"icf22\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>19 °C.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>17 °C.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>16 °C.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>15 °C.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf22\" data-k=\"C\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la C.", "Por qué es la C: la misma estufa durante el mismo minuto entrega el mismo calor. Con 1 L (1000 g): Q = 1000 g · 1 cal/(g·°C) · 2 °C = 2000 cal. Con 2 L (2000 g) y las mismas 2000 cal: ΔT = 2000 cal ÷ (2000 g · 1 cal/(g·°C)) = 1 °C. La temperatura final es 15 °C + 1 °C = 16 °C (C). A supone que el doble de agua sube el doble; B repite el resultado de un litro; D supone que no sube nada.", "Que escriban qué es igual en los dos casos (la estufa y el minuto: el mismo calor) y qué cambió (la masa).", "Supone que la estufa entrega lo mismo las dos veces y que se pierde lo mismo: es lo que la pregunta da por hecho."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 3<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>El agua que hierve, molécula por molécula<\/h3><p>A continuación, se muestra un modelo de la distribución de las moléculas de agua en estado líquido, en un recipiente cerrado.<\/p><figure class=\"fig\"><svg viewBox=\"0 0 120 110\" role=\"img\" aria-label=\"Recipiente cerrado con moléculas de agua líquida en el fondo\" style=\"font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif;max-width:170px;margin:0 auto\"><path d=\"M 28 14 L 28 92 Q 28 98 34 98 L 86 98 Q 92 98 92 92 L 92 14\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><ellipse cx=\"60.0\" cy=\"14\" rx=\"32.0\" ry=\"6\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><circle cx=\"42.7\" cy=\"89.7\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"33.3\" cy=\"89.7\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"38.0\" cy=\"86.0\" r=\"3.7\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"0\"/><circle cx=\"34.3\" cy=\"77.7\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"34.3\" cy=\"68.3\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"38.0\" cy=\"73.0\" r=\"3.7\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"0\"/><circle cx=\"53.5\" cy=\"91.9\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"47.1\" cy=\"85.1\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"53.0\" cy=\"86.0\" r=\"3.7\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"0\"/><circle cx=\"47.1\" cy=\"73.5\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"53.9\" cy=\"67.1\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"53.0\" cy=\"73.0\" r=\"3.7\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"0\"/><circle cx=\"64.0\" cy=\"90.4\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"64.7\" cy=\"81.1\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"68.0\" cy=\"86.0\" r=\"3.7\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"0\"/><circle cx=\"63.6\" cy=\"69.0\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"72.9\" cy=\"69.7\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"68.0\" cy=\"73.0\" r=\"3.7\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"0\"/><circle cx=\"77.1\" cy=\"86.1\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"84.3\" cy=\"80.2\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"83.0\" cy=\"86.0\" r=\"3.7\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"0\"/><circle cx=\"82.9\" cy=\"67.1\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"88.8\" cy=\"74.3\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"83.0\" cy=\"73.0\" r=\"3.7\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"0\"/><\/svg><\/figure><p>Cuando este recipiente se calienta manteniendo la presión constante, la distribución de las moléculas cambia, modificando el estado del agua.<\/p><\/div><div><p class=\"enun\">¿Cuál de los siguientes modelos muestra correctamente la distribución de las moléculas de agua en estado líquido y gaseoso?<\/p><div class=\"opsfig\"><figure class=\"fig\"><svg viewBox=\"0 0 430 316\" role=\"img\" aria-label=\"Cuatro modelos, A a D, del agua líquida y en gas en un recipiente\" style=\"font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif;max-width:520px;margin:0 auto\"><circle cx=\"16.0\" cy=\"22.0\" r=\"13.0\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><text x=\"16.0\" y=\"27.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">A<\/text><text x=\"76.0\" y=\"20.0\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"middle\">Líquido<\/text><text x=\"156.0\" y=\"20.0\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"middle\">Gas<\/text><path d=\"M 44 34 L 44 112 Q 44 118 50 118 L 102 118 Q 108 118 108 112 L 108 34\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><ellipse cx=\"76.0\" cy=\"34\" rx=\"32.0\" ry=\"6\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><circle cx=\"58.7\" cy=\"109.7\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"49.3\" cy=\"109.7\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"54.0\" cy=\"106.0\" r=\"3.7\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"0\"/><circle cx=\"50.3\" cy=\"97.7\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"50.3\" cy=\"88.3\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"54.0\" cy=\"93.0\" r=\"3.7\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"0\"/><circle cx=\"69.5\" cy=\"111.9\" r=\"2.7\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.3\"/><circle cx=\"63.1\" cy=\"105.1\" r=\"2.7\" fill=\"wh ladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la B.", "Por qué es la B: al hervir, las moléculas se mueven más rápido y se separan hasta ocupar todo el recipiente, pero cada una sigue siendo H₂O: un oxígeno con dos hidrógenos. El modelo B tiene las moléculas enteras repartidas por todo el recipiente (B). A separa los oxígenos de los hidrógenos, es decir, rompe las moléculas; C deja las moléculas apretadas como en el líquido, solo que arriba; D tiene átomos sueltos y revueltos.", "La trampa es la D: «el gas está desordenado» es cierto, pero desordenado no es roto.", "Hervir es un cambio físico: cambian la distancia y la rapidez de las moléculas, no las moléculas."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 4<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Hervir agua a 25 km de altura<\/h3><p>El siguiente modelo representa la relación entre la altura y la cantidad de partículas de aire.<\/p><figure class=\"fig\"><svg viewBox=\"0 0 300 240\" role=\"img\" aria-label=\"Columna de aire: muchas partículas cerca del suelo y muy pocas a 25 y 30 km\" style=\"font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif;max-width:300px;margin:0 auto\"><rect x=\"110.0\" y=\"22.0\" width=\"160.0\" height=\"200.0\" rx=\"0\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><circle cx=\"219.8\" cy=\"174.4\" r=\"1.8\" fill=\"#5C6472\"/><circle cx=\"145.1\" cy=\"54.3\" r=\"1.8\" fill=\"#5C6472\"/><circle cx=\"238.0\" cy=\"218.0\" r=\"1.8\" fill=\"#5C6472\"/><circle cx=\"171.1\" cy=\"213.5\" r=\"1.8\" fill=\"#5C6472\"/><circle cx=\"143.1\" cy=\"123.3\" r=\" 02.0\" y1=\"188.7\" x2=\"110.0\" y2=\"188.7\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><text x=\"98.0\" y=\"193.7\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"end\">5<\/text><line x1=\"102.0\" y1=\"155.3\" x2=\"110.0\" y2=\"155.3\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><text x=\"98.0\" y=\"160.3\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"end\">10<\/text><line x1=\"102.0\" y1=\"122.0\" x2=\"110.0\" y2=\"122.0\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><text x=\"98.0\" y=\"127.0\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"end\">15<\/text><line x1=\"102.0\" y1=\"88.7\" x2=\"110.0\" y2=\"88.7\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><text x=\"98.0\" y=\"93.7\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"end\">20<\/text><line x1=\"102.0\" y1=\"55.3\" x2=\"110.0\" y2=\"55.3\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><text x=\"98.0\" y=\"60.3\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"end\">25<\/text><line x1=\"102.0\" y1=\"22.0\" x2=\"110.0\" y2=\"22.0\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><text x=\"98.0\" y=\"27.0\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"end\">30<\/text><text x=\"60.0\" y=\"122.0\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\" transform=\"rotate(-90 60.0 122.0)\">Altura (km)<\/text><\/svg><\/figure><p>Una olla con agua hierve a una temperatura de 100 °C, cuando la altura es de 0 km.<\/p><\/div><div><p class=\"enun\">Teniendo en cuenta que el punto de ebullición corresponde a la temperatura a la cual la presión de vapor del líquido iguala a la presión atmosférica, si se pone a calentar la misma cantidad de agua a una altura de 25 km, ¿qué le sucede al agua?<\/p><div class=\"ops\" id=\"icf24\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>Hierve a una temperatura menor que 100 °C, porque la presión es menor en esta altura.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>Hierve a una temperatura mayor que 100 °C, porque la presión es menor en esta altura.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>Nunca hierve, porque en esta altura hay muy poca cantidad de aire.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Se congela, porque al no haber aire el agua pasará a estado sólido.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf24\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la A.", "Por qué es la A: en el modelo, a 25 km hay muchas menos partículas de aire que a 0 km: la presión atmosférica es mucho menor. El agua hierve cuando la presión de su vapor iguala la de afuera, y con menos presión afuera eso pasa a menor temperatura: hierve por debajo de 100 °C (A). B tiene bien la razón y mal la conclusión; C confunde poca presión con que no pueda hervir; D dice que sin aire el agua se congela, y nada en el texto lo sostiene.", "Dato para ti: a 25 km la presión es de unos 2,5 kPa, la cuadragésima parte de la del nivel del mar, y el agua herviría cerca de 21 °C.", "Ejemplo cercano: en Bogotá el agua hierve hacia 92 °C, por la misma razón. ---"]}}, {"m": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m6)\">Cierre<\/span><span class=\"kicker\">La pregunta de siempre<\/span><\/div><h2>¿En qué se parecía la pregunta tipo Saber 11 a la de tu libro?<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:#242478\"><div class=\"k\">1<\/div><div><b>El calor va del caliente al frío<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#A82424\"><div class=\"k\">2<\/div><div><b>La cuenta del calor<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#C9821B\"><div class=\"k\">3<\/div><div><b>Lo que hacen las partículas<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#5B3E96\"><div class=\"k\">4<\/div><div><b>El ambiente decide el cambio de fase<\/b><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--m6)\"><h3>Antes de salir<\/h3><ol class=\"pasos\"><li>El concepto del día —una ley, una magnitud o una relación—, en «Palabras que me frenaron», con tus palabras.<\/li><li>«Lo que me llevo de esta pregunta».<\/li><li>Tu carita de salida.<\/li><li>La clase 2 de la portada del área, con la causa que encontraste.<\/li><\/ol><\/div><\/div>", "guia": {"obj": "Que el estudiante nombre la estrategia que usó y se lleve un concepto del día —una ley, una magnitud o una relación— escrito en sus propias palabras.", "decir": ["Socializa solo las preguntas que el grupo falló, pidiendo la flecha o la cuenta que las resuelve.", "Pide que lean en voz alta su salvavidas: lo mínimo que sí tenían claro.", "Cada uno escribe el concepto del día en «Palabras que me frenaron» y la causa que encontró en la portada del área."], "como": "No dicta la definición ni la fórmula. El concepto se escribe como el estudiante lo entendió; si quedó mal entendido, eso se ve en la hoja y se corrige la próxima clase.", "apoyo": ["El concepto del día no se dicta. Si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase: es mejor que dictarla bien.", "Para el cierre del momento: La pregunta 9 mezcla kilogramos con cal/(g·°C). Cierra con eso: un número sin su unidad no se puede multiplicar con otro."]}}];

function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function paintClock(){
  var n = $("#tnum");
  if(!tBase){ n.textContent = "—"; n.classList.remove("over"); return; }
  var s = Math.abs(tLeft), mm = Math.floor(s/60), ss = s%60;
  n.textContent = (tLeft<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", tLeft<0);
}
function setTimer(min){
  tBase = min||0; tLeft = tBase*60; tOn = false;
  if(tick){ clearInterval(tick); tick = null; }
  $("#play").textContent = "Iniciar"; paintClock();
}
function toggleTimer(){
  if(!tBase) return;
  tOn = !tOn; $("#play").textContent = tOn ? "Pausar" : "Seguir";
  if(tick){ clearInterval(tick); tick = null; }
  if(tOn) tick = setInterval(function(){ tLeft--; paintClock(); }, 1000);
  paintClock();
}
// cronómetro de la prueba (clase 7): aparte del de la barra, no se reinicia al cambiar de diapositiva
var EX = {base:0, left:0, on:false, t:null, ini:null};
function hhmm(d){ return d.getHours() + ":" + (d.getMinutes()<10?"0":"") + d.getMinutes(); }
function exPaint(){
  var box = wrap.querySelector("[data-examen]"); if(!box) return;
  if(!EX.base){ EX.base = +box.dataset.examen; EX.left = EX.base*60; }
  var s = Math.abs(EX.left), mm = Math.floor(s/60), ss = s%60;
  var n = box.querySelector("[data-exnum]");
  n.textContent = (EX.left<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", EX.left<0);
  box.querySelector("[data-exini]").textContent = EX.ini ? hhmm(EX.ini) : "—";
  box.querySelector("[data-exfin]").textContent = EX.on ? hhmm(new Date(Date.now() + EX.left*1000)) : (EX.ini ? "en pausa" : "—");
  var p = box.querySelector('[data-ex="play"]');
  p.textContent = EX.on ? "Pausar" : (EX.ini ? "Seguir" : "Iniciar la prueba");
}
function exToggle(){
  if(!EX.base) exPaint();
  EX.on = !EX.on;
  if(EX.t){ clearInterval(EX.t); EX.t = null; }
  if(EX.on){ if(!EX.ini) EX.ini = new Date(); EX.t = setInterval(function(){ EX.left--; exPaint(); }, 1000); }
  exPaint();
}
function exReset(){
  if(EX.ini && !window.confirm("¿Volver a poner el cronómetro de la prueba en cero?")) return;
  if(EX.t){ clearInterval(EX.t); EX.t = null; }
  EX.on = false; EX.ini = null; EX.left = EX.base*60; exPaint();
}
// casillas que llena el profe (clase 8): se guardan mientras la página esté abierta
var CAMPOS = {};
function pintaCampos(){
  [].forEach.call(wrap.querySelectorAll("[data-campo]"), function(x){ x.value = CAMPOS[x.dataset.campo] || ""; });
  [].forEach.call(wrap.querySelectorAll("[data-eco]"), function(x){ x.textContent = CAMPOS[x.dataset.eco] || "—"; });
}
function guiaHTML(g){
  if(!g) return '<p class="sub">Sin notas para esta diapositiva.</p>';
  var h = '<div class="gbox"><h4>Objetivo</h4><p>'+esc(g.obj)+'</p></div>';
  if(g.decir && g.decir.length) h += '<div class="gbox"><h4>Qué haces y qué dices</h4><ul>'+
     g.decir.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  if(g.como) h += '<div class="gbox como"><h4>Lo que no haces</h4><p>'+esc(g.como)+'</p></div>';
  if(g.apoyo && g.apoyo.length) h += '<div class="gbox apoyo"><h4>Si Física no es tu fuerte</h4><ul>'+
     g.apoyo.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  return h;
}
function pintaElegidas(){
  var box = document.getElementById("elegidas"); if(!box) return;
  if(!elegidas.length){ box.innerHTML = '<p class="sub">Vuelve a la diapositiva anterior y escoge las cinco.</p>'; return; }
  box.innerHTML = elegidas.map(function(t,k){
    return '<div class="card edge" style="--accent:var(--m'+((k%6)+1)+')"><h3>'+(k+1)+'. '+esc(t)+'</h3>'+
      '<p class="sub">Busca esta pregunta en tu simulacro y en la hoja de taller de la misma estrategia.</p></div>';
  }).join("");
}
function go(n){
  var prev = SC[i];
  i = Math.max(0, Math.min(SC.length-1, n));
  var s = SC[i];
  wrap.innerHTML = s.html;
  wrap.classList.remove("enter"); void wrap.offsetWidth; wrap.classList.add("enter");
  stage.scrollTop = 0;
  var m = s.m!=null ? MOM[s.m] : null;
  $("#momdot").style.background = m ? "var("+m.c+")" : "var(--faint)";
  $("#momdot").textContent = m ? m.n : "·";
  $("#momnom").textContent = m ? m.nom : NOMBRE;
  $("#momsub").textContent = m ? (m.min+" minutos") : SUB;
  var want = s.min!=null ? s.min : (m ? m.min : 0);
  var cambio = !prev || prev===s || prev.m!==s.m || (prev.min||null)!==(s.min||null);
  if(cambio) setTimer(want);
  $("#count").textContent = (i+1)+" / "+SC.length;
  $("#prog i").style.width = (SC.length>1 ? i/(SC.length-1)*100 : 100)+"%";
  $("#guiabody").innerHTML = guiaHTML(s.guia);
  [].forEach.call(wrap.querySelectorAll("[data-pick]"), function(b){
    b.setAttribute("aria-pressed", elegidas.indexOf(b.textContent)>=0 ? "true" : "false"); });
  pintaElegidas();
  pintaCampos();
  exPaint();
  $("#clock").style.visibility = wrap.querySelector("[data-examen]") ? "hidden" : "";   // la prueba tiene su reloj
}
wrap.addEventListener("input", function(e){
  var x = e.target; if(!x.dataset || !x.dataset.campo) return;
  CAMPOS[x.dataset.campo] = x.value;
});
wrap.addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.dataset.ex==="play") exToggle();
  if(b.dataset.ex==="reset") exReset();
  if(b.dataset.show){ var t = document.getElementById(b.dataset.show); if(t) t.hidden = !t.hidden; }
  if(b.dataset.showgrupo){
    var g = wrap.querySelectorAll('[data-grupo="'+b.dataset.showgrupo+'"]'), abrir = g.length && g[0].hidden;
    [].forEach.call(g, function(x){ x.hidden = !abrir; });
    b.textContent = abrir ? "Ocultar las claves" : "Revelar las claves";
  }
  if(b.dataset.clave){
    var box = document.getElementById(b.dataset.clave), ok = box.querySelector('[data-op="'+b.dataset.k+'"]');
    var on = ok && !ok.classList.contains("ok");
    [].forEach.call(box.querySelectorAll(".op"), function(o){ o.classList.remove("ok"); });
    if(on) ok.classList.add("ok");
    b.textContent = on ? "Ocultar la clave" : "Revelar la clave";
  }
  if(b.dataset.tally){ var n = document.getElementById(b.dataset.tally); n.textContent = (+n.textContent||0)+1; }
  if(b.dataset.reset){ [].forEach.call(wrap.querySelectorAll('[id^="'+b.dataset.reset+'"]'), function(x){
    if(x.classList.contains("n")) x.textContent = "0"; }); }
  if(b.dataset.pick!=null){
    var t = b.textContent, k = elegidas.indexOf(t);
    if(k>=0) elegidas.splice(k,1); else if(elegidas.length<5) elegidas.push(t);
    b.setAttribute("aria-pressed", elegidas.indexOf(t)>=0 ? "true" : "false");
  }
});
function setGuia(on){ $("#guia").classList.toggle("open", on); $("#scrim").classList.toggle("on", on);
  $("#gbtn").setAttribute("aria-pressed", on ? "true" : "false"); }
$("#next").addEventListener("click", function(){ go(i+1); });
$("#prev").addEventListener("click", function(){ go(i-1); });
$("#play").addEventListener("click", toggleTimer);
$("#reset").addEventListener("click", function(){ setTimer(tBase); });
$("#gbtn").addEventListener("click", function(){ setGuia(!$("#guia").classList.contains("open")); });
$("#gclose").addEventListener("click", function(){ setGuia(false); });
$("#scrim").addEventListener("click", function(){ setGuia(false); });
document.addEventListener("keydown", function(e){
  var t = e.target.tagName; if(t==="INPUT"||t==="TEXTAREA"||e.target.isContentEditable) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ go(i+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ go(i-1); e.preventDefault(); }
  else if(e.key==="Home"){ go(0); e.preventDefault(); }
  else if(e.key==="End"){ go(SC.length-1); e.preventDefault(); }
  else if(e.key==="g"||e.key==="G"){ setGuia(!$("#guia").classList.contains("open")); }
  else if(e.key==="t"||e.key==="T"){ if(wrap.querySelector("[data-examen]")) exToggle(); else toggleTimer(); }
  else if(e.key==="Escape"){ setGuia(false); }
});
go(0);
})();
</script>
</body>
</html>
