<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Física · Clase 3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>[hidden]{display:none!important}
:root{
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --text:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --area:#5C7A1E; --azul:#1F4E8C; --oro:#B0711A; --morado:#5B3E96; --verde:#2E7A39;
  --m1:#5C7A1E; --m2:#1F4E8C; --m3:#3B3BA6; --m4:#5B3E96; --m5:#A82424; --m6:#4A5A70; --rojo:#A82424;
  --ink:#1B1F27; --muted:#5C6472; --faint:#A9B0BB; --line:#E3E7ED; --paper:#FFFFFF; --bg:#F6F4F1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:clamp(16px,1.25vw,21px);line-height:1.5}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
#top{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding:10px clamp(14px,2vw,28px);background:var(--paper);flex-wrap:wrap}
.logo img{height:clamp(28px,2.6vw,40px);display:block}
#mom{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
#momdot{width:clamp(30px,2.4vw,40px);height:clamp(30px,2.4vw,40px);border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;background:var(--faint)}
#momnom{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.2vw,20px)}
#momsub{color:var(--muted);font-size:.85em}
#clock{display:flex;align-items:center;gap:8px}
#tnum{font-family:var(--display);font-weight:800;font-size:clamp(20px,1.8vw,30px);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
#tnum.over{color:var(--area)}
.btn{appearance:none;font:inherit;font-size:.86em;font-weight:600;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.solid{background:var(--area);border-color:var(--area);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#stage{overflow:auto;padding:clamp(18px,3vw,48px) clamp(16px,4vw,72px)}
#wrap{max-width:1500px;margin:0 auto}
#wrap.enter{animation:ent .28s ease-out}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bot{display:flex;align-items:center;gap:12px;padding:10px clamp(14px,2vw,28px);background:var(--paper)}
#prog{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
#prog i{display:block;height:100%;background:var(--area);transition:width .25s}
#count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
#hint{color:var(--faint);font-size:.8em}
@media (max-width:760px){#hint{display:none}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.2vw,68px);line-height:1.05;margin:.2em 0 .25em;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,2.8vw,46px);line-height:1.1;margin:.25em 0 .3em;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:clamp(18px,1.5vw,26px);margin:.1em 0 .4em;line-height:1.2}
p{margin:.35em 0 .6em}
.lead{font-size:1.2em;line-height:1.45;max-width:70ch}
.sub{color:var(--muted)}
.mt{margin-top:clamp(14px,1.8vw,26px)}
.logo-xl img{height:clamp(54px,6vw,96px);margin-bottom:12px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tag,.min,.membrete{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.78em;font-weight:700;letter-spacing:.02em}
.tag{background:var(--ink);color:#fff}
.min{background:var(--accent,var(--area));color:#fff}
.membrete{border:1.5px solid var(--line);color:var(--muted)}
.kicker{color:var(--muted);font-size:.85em;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.grid{display:grid;gap:clamp(12px,1.4vw,22px)}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid>*{min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,1.6vw,24px)}
.card.edge{border-left:6px solid var(--accent,var(--area))}
.card.big .lead{font-size:1.3em}
.step{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px}
.step .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;flex:none}
.note{border-left:5px solid var(--accent,var(--area));background:var(--paper);border-radius:10px;padding:10px 16px;margin-top:12px}
.cita{font-family:var(--display);font-weight:600;line-height:1.35;background:var(--paper);border-left:6px solid var(--area);border-radius:12px;padding:clamp(16px,2vw,30px);margin:18px 0}
.cita.xl{font-size:clamp(24px,2.6vw,44px)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally .n{display:inline-block;min-width:1.6em;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.pasos{margin:.2em 0 0;padding-left:1.3em}.pasos li{margin:.3em 0}
.sello{margin-top:12px;border:2px dashed var(--oro);border-radius:12px;padding:10px 14px;background:#FDF6EA}
.sello b{display:block;color:var(--oro);font-size:.8em;letter-spacing:.06em;text-transform:uppercase}
.clave{margin-top:12px;display:flex;align-items:center;gap:10px;font-weight:600}
.keychip{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:10px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.2em}
.aviso{margin-top:10px;border-radius:10px;padding:10px 14px;background:#FBEFEF;border-left:5px solid var(--area);font-size:.92em}
.aviso.sev-aten{background:#EDF5EE;border-left-color:var(--verde)}
.aviso.sev-medi{background:#FDF5E7;border-left-color:var(--oro)}
.icfes .texto{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.6vw,24px);max-height:62vh;overflow:auto;font-size:.95em}
.enun{font-weight:600;font-size:1.08em}
.ops{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.op .L{flex:none;width:1.8em;height:1.8em;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-family:var(--display);font-weight:800}
.op.ok{border-color:var(--verde);background:#EDF5EE}.op.ok .L{background:var(--verde);color:#fff}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick[aria-pressed="true"]{background:var(--area);border-color:var(--area);color:#fff}
#scrim{position:fixed;inset:0;background:rgba(15,18,24,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#guia{position:fixed;top:0;right:0;height:100%;width:min(520px,92vw);background:var(--paper);box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column;z-index:10}
#guia.open{transform:none}
#guiahead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg)}
#guiabody{overflow:auto;padding:16px 20px 30px;font-size:.92em}
.gbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.gbox h4{margin:0 0 6px;font-family:var(--display);font-size:.8em;letter-spacing:.07em;text-transform:uppercase;color:var(--area)}
.gbox ul{margin:0;padding-left:1.1em}.gbox li{margin:.35em 0}
.gbox.como{background:#F6F7F9}.gbox.como h4{color:var(--muted)}
.gbox.apoyo{background:#FDF6EA;border-color:#EAD9B4}.gbox.apoyo h4{color:var(--oro)}
[hidden]{display:none!important}
.fig{margin:12px 0}.fig svg{display:block;width:100%;max-width:760px;height:auto}
.tabla{border-collapse:collapse;width:100%;table-layout:fixed;font-size:.86em;line-height:1.35;margin:0 auto}
.tabla th,.tabla td{border:1px solid var(--line);padding:5px 8px;vertical-align:top;overflow-wrap:anywhere}
.tabla th{background:#F2F4EE;text-align:left}.fig figcaption{font-size:.85em;font-style:italic;color:var(--muted)}
.ops.cuatro{grid-template-columns:repeat(4,1fr)}.ops.cuatro .op{padding:8px 10px;gap:8px;font-size:.92em;align-items:center}
.derfig .fig{margin:0 0 10px}.opsfig{background:var(--paper);border:1px solid var(--line);
border-radius:14px;padding:8px 10px;margin-top:10px}.opsfig .fig{margin:0}
.aviso{border-left-color:var(--rojo)}.aviso.sev-baja{background:#EEF3FA;border-left-color:var(--azul)}
</style>
</head>

 preguntas de la prueba de campo, páginas 226 a 228<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m4)\"><h3>Tu cuaderno<\/h3><p class=\"sub\">Páginas 279 a 285<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m6)\"><h3>Hoy<\/h3><p class=\"sub\">120 minutos · 6 momentos · EF, UC e IN · cargas, campos y datos<\/p><\/div><\/div>", "guia": {"obj": "Que el grupo sepa desde el primer minuto qué va a pasar en estos 120 minutos y qué tiene que tener sobre la mesa.", "decir": ["«Libro abierto, cuaderno cerrado, lápiz. Hoy nadie me va a decir la fórmula de memoria: me van a mostrar la flecha o el julio que explica lo que pasa.»"], "apoyo": ["⚑ Antes del sábado: La B es clave en cinco de las diez preguntas y en la 6 las flechas de la figura que es clave están al revés. En la 1 hay dos opciones defendibles. Exige el instrumento lleno antes de mirar las opciones.", "Seguridad de las dinámicas: Ninguna dinámica usa pilas, cables ni enchufes de verdad: las cargas y los circuitos se hacen con personas y carteles.", "Del libro, para ti: La B es clave en cinco de diez preguntas (3, 5, 6, 8 y 9). Reportado a la editorial. No lo digas en clase.", "Los cuatro conceptos que tienes que poder explicar hoy en dos minutos, sin jerga. Si un estudiante sabe más que tú de un tema, déjalo explicar y pide que lo muestre con una flecha o con una cuenta con unidades:", "Carga eléctrica: Hay positiva y negativa: iguales se repelen, distintas se atraen. En un metal se mueven los electrones, que son negativos; los protones se quedan en los núcleos.", "Campo eléctrico y sus líneas: Las líneas salen de las cargas positivas y llegan a las negativas, nunca se cruzan y se aprietan donde el campo es más fuerte. Una carga positiva se empuja a favor de la línea; una negativa, en contra.", "F = q · E y las unidades: La fuerza sobre una carga es la carga (en coulombs, C) por el campo (en newtons por coulomb, N/C) y da newtons. 1 μC = 0,000001 C. Para pasar de km/h a m/s se divide por 3,6.", "Inducción y temperatura de Curie: Un imán quieto dentro de una bobina no produce corriente: aparece solo mientras el campo cambia, cuando el imán entra o sale. Y un imán calentado por encima de su temperatura de Curie deja de ser imán: sus dominios se desordenan.", "Abre esta guía con la tecla G en cada diapositiva: trae lo que dices y, debajo, lo que necesitas saber si Física no es tu área.", "El cronómetro arranca con T y se reinicia solo cuando cambia el momento de la clase."]}}, {"m": null, "html": "<div class=\"eyebrow\"><span class=\"kicker\">Así vamos a trabajar<\/span><\/div><h2>Seis momentos, una sola regla<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:var(--m1)\"><div class=\"k\">1<\/div><div><b>Activación<\/b><span class=\"sub\"> · 15 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m2)\"><div class=\"k\">2<\/div><div><b>Pregunta problematizadora<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m3)\"><div class=\"k\">3<\/div><div><b>Desarrollo guiado<\/b><span class=\"sub\"> · 35 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m4)\"><div class=\"k\">4<\/div><div><b>Reto en equipo<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m5)\"><div class=\"k\">5<\/div><div><b>Evaluación individual<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m6)\"><div class=\"k\">6<\/div><div><b>Cierre<\/b><span class=\"sub\"> · 10 min<\/span><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--area)\"><h3>La regla del cuaderno<\/h3><p class=\"lead\">Si el instrumento está vacío, no lo resolviste: lo adivinaste.<\/p><p>Primero se hace el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento—, después se marca la opción. Una respuesta correcta con el instrumento en blanco no cuenta como resuelta.<\/p><\/div><\/div>", "guia": {"obj": "Que la regla quede dicha en voz alta antes de cualquier texto.", "decir": ["«La respuesta correcta con el instrumento vacío no cuenta. ¿Por qué? Porque en Física casi todas las opciones usan palabras técnicas: el que no dibujó la flecha ni hizo la cuenta escoge la que suena mejor, no la que es.»"], "apoyo": ["Si alguien pregunta para qué dibujar, la respuesta corta es: lo que separa la opción correcta de las que suenan bien está en el sentido de una flecha, en un signo o en una unidad, y eso se pierde si no se escribe.", "Si alguien dice «es por la gravedad» o «es la energía», devuélvele la pregunta: «¿quién empuja a quién, y hacia dónde?»."]}}, {"m": 0, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Activación<\/span><span class=\"kicker\">Cuaderno cerrado<\/span><\/div><h2>¿Qué cambió y qué lo causó?<\/h2><blockquote class=\"cita xl\">Al quitarse un saco de lana en un cuarto oscuro se ven chispitas y se oye un chasquido.<\/blockquote><p class=\"lead\">Dos respuestas antes de cualquier fórmula. Todavía no se abre el cuaderno.<\/p><div class=\"ctl\"><button class=\"btn\" data-show=\"pista3\">Mostrar la pista<\/button><\/div><div class=\"note\" id=\"pista3\" hidden style=\"--accent:var(--m1)\"><b>Pista:<\/b> al frotar, unos electrones pasaron de un material al otro; las cargas separadas se juntan de golpe a través del aire: eso es la chispa<\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno corto diciendo qué cambió y qué lo causó —qué fuerza, qué calor, qué carga— antes de explicarlo con fórmulas y antes de ver cualquier opción.", "decir": ["Proyecta o lee una observación de dos o tres renglones sin decir de dónde salió.", "Pide dos respuestas, en voz alta o en el tablero: qué cambió y qué lo causó, dicho como una flecha con nombre («el piso frena…», «el calor va de… a…»).", "Ejecuta la dinámica de apertura según la estrategia del encuentro."], "como": "No explica el fenómeno ni acepta todavía fórmulas. Si alguien dice «es por la gravedad» o «es la energía», le devuelve la pregunta: «¿quién empuja a quién, y hacia dónde?». El cuaderno sigue cerrado.", "apoyo": ["No expliques el fenómeno ni aceptes todavía fórmulas: primero qué cambió y qué lo causó, dicho como una flecha con nombre. La observación es inventada para la clase: no sale del libro.", "La pista existe para el cierre de los 15 minutos, no para el principio: al frotar, unos electrones pasaron de un material al otro; las cargas separadas se juntan de golpe a través del aire: eso es la chispa."]}}, {"m": 0, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#242478\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 1 · Busca el dato que decide<\/span><\/div><h2>El dato que tumba la idea<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Cuatro carteles en las esquinas: VOLTAJE DE LA PILA, LARGO DEL CABLE, COLOR DEL BOMBILLO y TEMPERATURA DEL BOMBILLO.<\/li><li>El docente lee una idea: «la linterna alumbra menos porque la pila ya se gastó».<\/li><li>Cada estudiante camina al cartel del dato que pondría a prueba ESA idea.<\/li><li>Para quedarse, dice qué valor le daría la razón a la idea y cuál se la quitaría. Si no puede, cambia de esquina.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cuatro carteles · sin pilas ni cables de verdad<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno corto diciendo qué cambió y qué lo causó —qué fuerza, qué calor, qué carga— antes de explicarlo con fórmulas y antes de ver cualquier opción.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No explica el fenómeno ni acepta todavía fórmulas. Si alguien dice «es por la gravedad» o «es la energía», le devuelve la pregunta: «¿quién empuja a quién, y hacia dónde?». El cuaderno sigue cerrado.", "apoyo": ["Qué movimiento mental entrena: Antes de mirar las opciones, leer qué dice exactamente la idea y buscar la medida —en qué lugar y en qué condición— que la confirma o la tumba. Es el movimiento de las preguntas 2, 5 y 8, y de la primera del entrenamiento (la resistencia a 90 °C).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 1, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m2)\">Pregunta problematizadora<\/span><span class=\"kicker\">Libro abierto en la pregunta modelo<\/span><\/div><h2>Abran el libro en la pregunta 1, página 226<\/h2><p class=\"lead\">Antes de dibujar o calcular: ¿cuál creen que es? Levanten la mano.<\/p><div class=\"ctl\"><button class=\"btn tally\" data-tally=\"h3A\">A <span class=\"n\" id=\"h3A\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h3B\">B <span class=\"n\" id=\"h3B\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h3C\">C <span class=\"n\" id=\"h3C\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h3D\">D <span class=\"n\" id=\"h3D\">0<\/span><\/button><button class=\"btn\" data-reset=\"h3\">↺<\/button><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta que gobierna el área<\/h3><p class=\"lead\">¿Qué lo causó? Muéstrame la flecha o el julio que lo explica.<\/p><p class=\"sub\">Nadie justifica con «así dice la fórmula» ni con «eso es obvio»: toda respuesta señala una flecha del dibujo, un número con su unidad o un renglón del enunciado.<\/p><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta de este momento<\/h3><p class=\"lead\">¿Qué carga se movió, hacia dónde, y qué dato lo prueba?<\/p><\/div>", "guia": {"obj": "Que el estudiante compruebe que en Física la respuesta sale de la causa dibujada o de la cuenta con unidades, y no de la opción que suena más técnica, usando la pregunta modelo del libro.", "decir": ["Presenta la pregunta modelo del libro y la deja a la vista todo el momento.", "Pide respuestas a mano alzada ANTES de dibujar o calcular nada, y las anota en el tablero.", "Hace la pregunta que gobierna el área: ¿qué lo causó? Muéstrame la flecha o el julio que lo explica.", "Revela la clave solo al final y trabaja por qué cae cada una de las otras tres."], "como": "Regla del momento: nadie justifica con «así dice la fórmula» ni con «eso es obvio». Toda intervención señala una flecha del dibujo, un número con su unidad o un renglón del enunciado.", "apoyo": ["La pregunta modelo es la 1 del libro (página 226). El cuaderno se abre en la página 279 solo en «mi primera idea».", "Cuenta las manos tocando cada letra: el número queda en pantalla y sirve para el final del momento, cuando el grupo vea cuántos cambiaron de opinión al dibujar la flecha o hacer la cuenta.", "No digas la clave en este momento: sale en el bloque de las preguntas 1 y 2, después de llenar el instrumento en pantalla, casilla por casilla. Ahí se trabaja por qué cae cada una de las otras tres."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 1 y 2<\/span><span class=\"kicker\">En pantalla, casilla por casilla<\/span><\/div><h2>Preguntas 1 y 2: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 1<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E4 · Del modelo al mecanismo<\/span><\/div><p class=\"sub\">Imán y bobina con galvanómetro · ¿es correcta la explicación?<\/p><h3 style=\"color:#5B3E96\">La aguja del galvanómetro en cuatro momentos<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k31\"><span class=\"keychip\" style=\"background:#5B3E96\">D<\/span> es la clave del libro<\/div><div class=\"aviso sev-medi\" hidden data-grupo=\"k31\"><b>Ojo con esta clave:<\/b> La corriente aparece porque el campo magnético cambia mientras el imán entra o sale, no porque el campo «empuje» a los electrones. La clave tomada es D; la B también se puede defender.<\/div><\/div><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 2<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Busca el dato que decide<\/span><\/div><p class=\"sub\">Freno electromagnético del tren · qué dato evalúa la explicación<\/p><h3 style=\"color:#242478\">Los eslabones del freno sin contacto<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k31\"><span class=\"keychip\" style=\"background:#242478\">C<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k31\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 1·D y 2·C. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 1 · aviso del libro (media): La corriente aparece porque el campo magnético cambia mientras el imán entra o sale, no porque el campo «empuje» a los electrones. La clave tomada es D; la B también se puede defender. Qué haces: Clave tomada: D. Aclara que lo que produce la corriente es que el campo cambie."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 3 y 4<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 3 y 4: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 3<\/span><span class=\"min\" style=\"--accent:#C9821B\">E3 · Signo, sentido y unidad<\/span><\/div><p class=\"sub\">Freno electromagnético del tren · la aceleración promedio<\/p><h3 style=\"color:#C9821B\">La escalera de km/h a m/s<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k33\"><span class=\"keychip\" style=\"background:#C9821B\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 4<\/span><span class=\"min\" style=\"--accent:#A82424\">E2 · Dibuja el campo primero<\/span><\/div><p class=\"sub\">Sensor de campo eléctrico en la tormenta · por qué se curvan las líneas<\/p><h3 style=\"color:#A82424\">El campo del sensor, antes y durante la tormenta<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k33\"><span class=\"keychip\" style=\"background:#A82424\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k33\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 3·B y 4·A. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 4 · aviso del libro (atención), solo para ti, no se proyecta: La opción A dice que la carga es negativa, pero el texto no da el signo. Qué haces: Es plausible: la base de las nubes de tormenta suele ser negativa. No cambia la clave."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#A82424\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 2 · Dibuja el campo primero<\/span><\/div><h2>El salón es un campo<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>El docente es una carga positiva en un extremo del salón; un estudiante con un cartel «−», una negativa en el otro.<\/li><li>Seis estudiantes son cargas positivas pequeñas: cada uno apunta con el brazo hacia donde lo empujan las dos cargas.<\/li><li>El grupo revisa: cerca de la + los brazos se alejan; cerca de la −, apuntan hacia ella.<\/li><li>Con lana unen los brazos en líneas de la + a la −, y comprueban que nunca se cruzan.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Dos carteles (+ y −) · un ovillo de lana<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Qué movimiento mental entrena: Dibujar el campo antes de elegir una figura: de dónde salen las líneas, a dónde llegan y hacia dónde empujan en cada punto. Es el movimiento de las preguntas 4 y 6, y de la segunda del entrenamiento (las fuerzas de dos cargas sobre una tercera).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 5 y 6<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 5 y 6: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 5<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Busca el dato que decide<\/span><\/div><p class=\"sub\">Descargadores estáticos del avión · qué información evalúa la propuesta<\/p><h3 style=\"color:#242478\">Qué mide el dato y dónde lo mide<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k35\"><span class=\"keychip\" style=\"background:#242478\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 6<\/span><span class=\"min\" style=\"--accent:#A82424\">E2 · Dibuja el campo primero<\/span><\/div><p class=\"sub\">Dos cargas positivas idénticas · qué diagrama del campo<\/p><h3 style=\"color:#A82424\">Tres reglas para revisar un dibujo de campo<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Las reglas de un dibujo de campo<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k35\"><span class=\"keychip\" style=\"background:#A82424\">B<\/span> es la clave del libro<\/div><div class=\"aviso sev-medi\" hidden data-grupo=\"k35\"><b>Ojo con esta clave:<\/b> En la figura B las flechas apuntan al revés: con dos cargas positivas las líneas salen de cada carga. La forma de la B es la correcta: por eso es la mejor de las cuatro.<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k35\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 5·B y 6·B. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 6 · Las reglas de un dibujo de campo: Las líneas salen de las cargas positivas y llegan a las negativas, nunca se cruzan, y entre dos cargas iguales se apartan: nunca van de una a la otra. En la figura B del libro la forma es la correcta, pero las flechas apuntan al revés. Es la mejor de las cuatro. Para destrabar: «¿De dónde salen y hacia dónde van las flechas?»", "Pregunta 6 · aviso del libro (media): En la figura B las flechas apuntan al revés: con dos cargas positivas las líneas salen de cada carga. La forma de la B es la correcta: por eso es la mejor de las cuatro. Qué haces: Ninguna figura es perfecta: la B tiene la forma correcta. Usa el sello del cuaderno."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#C9821B\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 3 · Signo, sentido y unidad<\/span><\/div><h2>Pasos con signo<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Una cinta en el piso con una flecha es el campo eléctrico: apunta hacia la ventana.<\/li><li>Cada estudiante tiene una tarjeta con una carga: «+2 μC», «−1 μC», «+1 μC», «−3 μC».<\/li><li>Antes de moverse dice su cuenta: «menos tres microcoulombs: tres pasos contra el campo». Positiva, hacia la ventana; negativa, hacia la puerta.<\/li><li>Segunda ronda: la carga viene en otra unidad («0,000002 C») y hay que pasarla a μC antes.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cinta · tarjetas con cargas<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Qué movimiento mental entrena: Llevar el signo, el sentido y la unidad en cada cuenta: una carga negativa se empuja en contra del campo, y un número sin unidad no se puede usar. Es el movimiento de las preguntas 3 y 7, y de la tercera del entrenamiento (hacia dónde se mueve la carga −q).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 7 y 8<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 7 y 8: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 7<\/span><span class=\"min\" style=\"--accent:#C9821B\">E3 · Signo, sentido y unidad<\/span><\/div><p class=\"sub\">Carga de prueba en la maqueta del ala · el vector de la fuerza<\/p><h3 style=\"color:#C9821B\">La flecha del campo y la flecha de la fuerza<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k37\"><span class=\"keychip\" style=\"background:#C9821B\">A<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 8<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Busca el dato que decide<\/span><\/div><p class=\"sub\">Agujas imantadas y la llama · qué información comprueba la idea<\/p><h3 style=\"color:#242478\">Si la idea es cierta, ¿qué tendría que pasar?<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k37\"><span class=\"keychip\" style=\"background:#242478\">B<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k37\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 7·A y 8·B. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 7 · aviso del libro (baja), solo para ti, no se proyecta: La carga y la fuerza vienen sin unidades: faltan los coulombs y los newtons. Qué haces: Que las escriban: 2 × 10⁻⁶ C · 400 N/C = 8 × 10⁻⁴ N. No cambia la clave A.", "Pregunta 8 · aviso del libro (atención), solo para ti, no se proyecta: 770 °C es la temperatura de Curie del hierro puro, no la de cualquier acero; y la 9 supone que las dos agujas se calientan igual. Qué haces: No cambia las claves."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#5B3E96\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 4 · Del modelo al mecanismo<\/span><\/div><h2>Quién se puede mover<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Diez estudiantes son un pelo: cinco sentados son protones y cinco de pie, electrones. Otros diez son un globo, igual.<\/li><li>El docente «frota» el globo con el pelo: tres electrones caminan del pelo al globo. Los protones no se levantan.<\/li><li>El grupo cuenta la carga de cada uno: pelo +3, globo −3. Nada se creó ni se destruyó.<\/li><li>«El globo quedó negativo: ¿qué se movió?». Quien diga «protones» muestra cuál se levantó.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Ninguno<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Qué movimiento mental entrena: Usar el modelo para decir, paso a paso, qué partícula se mueve, hacia dónde y por qué, sin mover lo que el modelo no deja mover. Es el movimiento de las preguntas 1, 9 y 10, y de la cuarta del entrenamiento (las dos esferas metálicas que se tocan).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 9 y 10<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 9 y 10: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 9<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E4 · Del modelo al mecanismo<\/span><\/div><p class=\"sub\">Agujas de acero y de níquel · cuál pierde primero el magnetismo<\/p><h3 style=\"color:#5B3E96\">Dos metas en el mismo termómetro<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k39\"><span class=\"keychip\" style=\"background:#5B3E96\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 10<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E4 · Del modelo al mecanismo<\/span><\/div><p class=\"sub\">Agujas imantadas · la explicación según el modelo del magnetismo<\/p><h3 style=\"color:#5B3E96\">Los dominios, antes y después de la llama<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k39\"><span class=\"keychip\" style=\"background:#5B3E96\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k39\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 9·B y 10·A. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 9 · aviso del libro (atención), solo para ti, no se proyecta: 770 °C es la temperatura de Curie del hierro puro, no la de cualquier acero; y la 9 supone que las dos agujas se calientan igual. Qué haces: No cambia las claves."]}}, {"m": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m4)\">Reto en equipo · 20 min<\/span><span class=\"kicker\">Equipos de tres · cada uno responde en su cuaderno<\/span><\/div><h2>Reto del corte: La tormenta y el pararrayos<\/h2><div class=\"card big edge mt\" style=\"--accent:var(--m4)\"><p class=\"lead\">Cada equipo recibe una idea que circula en el barrio: «el pararrayos atrae los rayos». En doce minutos escriben qué dato pondría a prueba esa idea; dibujan el campo entre la base de una nube, con carga negativa, y el suelo; calculan la fuerza sobre una carga de 2 μC en un campo de 10 000 N/C, con su unidad, y dicen hacia dónde va si la carga es negativa; y explican qué partículas se mueven por el cable del pararrayos hasta la tierra. Cada integrante defiende una de las cuatro partes.<\/p><\/div><div class=\"note mt\" style=\"--accent:var(--m4)\"><b>La defensa:<\/b> tres minutos por equipo, señalando la flecha, la cuenta con su unidad o la variable que los respalda. «Porque sí» o «así dice la fórmula» no cuentan.<\/div>", "guia": {"obj": "Que el estudiante defienda su explicación con el dibujo o la cuenta en la mano y acepte que otro equipo puede ver una fuerza, una pérdida o una variable que él no vio.", "decir": ["Arma equipos de tres y entrega el reto del corte de este momento.", "Exige que cada integrante llegue con su instrumento YA diligenciado individualmente.", "Da tres minutos de defensa por equipo: muestran la flecha, la cuenta o la variable que los respalda.", "Cierra mostrando qué fuerza, qué julio o qué variable quedó por fuera en cada propuesta."], "como": "El equipo discute, pero cada uno escribe en SU tarjeta del reto. No se acepta una defensa que diga «porque sí» o «eso dice la fórmula»: se señala la flecha, el número con su unidad o la variable que se controló.", "apoyo": ["Las cuentas del reto, para ti (no se proyectan): F = q · E = 2 × 10⁻⁶ C · 10 000 N/C = 0,02 N. Si la carga es negativa, la fuerza va en contra del campo. Por el cable del pararrayos se mueven electrones. Un dato que pone a prueba la idea: contar los rayos que caen en edificios iguales con y sin pararrayos, en la misma zona.", "El reto no tiene una sola respuesta correcta en todas sus partes: gana el equipo que mejor sostiene la suya con flechas y cuentas. Si dos explicaciones están sostenidas, dilo: eso también es hacer física.", "Si un equipo entrega una sola hoja para los tres, el reto no cuenta. La discusión es compartida; el registro es individual.", "Cierra mostrando qué fuerza, qué julio o qué variable quedó por fuera en cada propuesta."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 1<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>La resistencia que manda a 90 °C<\/h3><p>La siguiente gráfica muestra la relación entre la resistencia eléctrica y la temperatura para cuatro resistencias eléctricas (R₁, R₂, R₃ y R₄).<\/p><figure class=\"fig\"><svg viewBox=\"0 0 790 260\" role=\"img\" aria-label=\"Resistencia contra temperatura de R1 a R4, de 0 a 80 grados\" style=\"font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif;max-width:760px;margin:0 auto\"><line x1=\"80.0\" y1=\"190.0\" x2=\"620.0\" y2=\"190.0\" stroke=\"#E1E5EB\" stroke-width=\"1.2\" stroke-dasharray=\"4,6\"/><text x=\"68.0\" y=\"195.0\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"end\">0<\/text><line x1=\"80.0\" y1=\"161.7\" x2=\"620.0\" y2=\"161.7\" stroke=\"#E1E5EB\" stroke-width=\"1.2\" stroke-dasharray=\ fill=\"#7A7F8A\"/><text x=\"734.0\" y=\"47.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"start\">R₁<\/text><line x1=\"674.0\" y1=\"76.0\" x2=\"720.0\" y2=\"76.0\" stroke=\"#1B1F27\" stroke-width=\"3\"/><polygon points=\"697.0,68.0 705.0,76.0 697.0,84.0 689.0,76.0\" fill=\"#1B1F27\"/><text x=\"734.0\" y=\"83.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"start\">R₂<\/text><line x1=\"674.0\" y1=\"112.0\" x2=\"720.0\" y2=\"112.0\" stroke=\"#4A4F5A\" stroke-width=\"3\" stroke-dasharray=\"7,5\"/><line x1=\"690.0\" y1=\"105.0\" x2=\"704.0\" y2=\"119.0\" stroke=\"#4A4F5A\" stroke-width=\"3\"/><line x1=\"690.0\" y1=\"119.0\" x2=\"704.0\" y2=\"105.0\" stroke=\"#4A4F5A\" stroke-width=\"3\"/><text x=\"734.0\" y=\"119.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"start\">R₃<\/text><line x1=\"674.0\" y1=\"148.0\" x2=\"720.0\" y2=\"148.0\" stroke=\"#9AA0AA\" stroke-width=\"3\"/><rect x=\"690.0\" y=\"141.0\" width=\"14.0\" height=\"14.0\" rx=\"0\" fill=\"#9AA0AA\" stroke=\"#9AA0AA\" stroke-width=\"0\"/><text x=\"734.0\" y=\"155.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"start\">R₄<\/text><\/svg><\/figure><p>Un estudiante realiza actividades experimentales y encuentra que la corriente eléctrica en un circuito es inversamente proporcional a la resistencia eléctrica. Se le solicita al estudiante construir un circuito usando una de estas resistencias, de forma que pase la menor cantidad de corriente eléctrica a 90 °C.<\/p><\/div><div><p class=\"enun\">Si las tendencias de resistencia como función de la temperatura se mantienen, ¿cuál resistencia se debe utilizar?<\/p><div class=\"ops\" id=\"icf31\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>R₁, porque tiene la mayor resistencia eléctrica desde los 40 °C hasta los 80 °C.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>R₂, porque su resistencia eléctrica será la mayor a 90 °C.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>R₃, porque tiene la menor resistencia desde los 40 °C hasta los 80 °C.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>R₄, porque su resistencia eléctrica no depende de la temperatura.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf31\" data-k=\"B\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la B.", "Por qué es la B: menos corriente pide la mayor resistencia (I = V ÷ R), y la pregunta es a 90 °C. A 80 °C, R₁ y R₂ valen 5 Ω, R₄ vale 4 Ω y R₃, 2 Ω. Siguiendo la tendencia: R₁ sube parejo, medio ohmio cada 20 °C (unos 5,25 Ω a 90 °C); R₂ sube cada vez más rápido (de 60 a 80 °C subió 1,2 Ω): a 90 °C pasa de 5,5 Ω; R₃ baja y R₄ no cambia. La mayor a 90 °C es R₂ (B). A y C razonan con el tramo de 40 a 80 °C, no con 90 °C; D dice algo cierto de R₄ que no responde la pregunta.", "El dato que decide está fuera de la gráfica: hay que mirar hacia dónde va cada curva después de 80 °C.", "La A es la trampa: R₁ es la mayor entre 40 y 80 °C, pero a 90 °C ya no."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 2<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Tres cargas en triángulo<\/h3><p>De la ley de Coulomb se sabe que la fuerza eléctrica debido a la interacción entre cargas de signos iguales es repulsiva y entre cargas de signos opuestos es atractiva. La siguiente figura muestra un sistema conformado por tres cargas eléctricas.<\/p><figure class=\"fig\"><svg viewBox=\"0 0 260 160\" role=\"img\" aria-label=\"Tres cargas en triángulo: 1 positiva arriba, 2 positiva abajo a la izquierda y 3 negativa abajo a la derecha\" style=\"font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif;max-width:260px;margin:0 auto\"><polygon points=\"130.0,32.0 69.1,137.0 190.9,137.0\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"2.4\"/><circle cx=\"130.0\" cy=\"32.0\" r=\"13.0\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><line x1=\"122.8\" y1=\"32.0\" x2=\"137.2\" y2=\"32.0\" stroke=\"#1B1F27\" stroke-width=\"2.4\"/><line x1=\"130.0\" y1=\"24.9\" x2=\"130.0\" y2=\"39.1\" stroke=\"#1B1F27\" stroke-width=\"2.4\"/><text x=\"130.0\" y=\"12.0\" font-size=\"16\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">1<\/text><circle cx=\"69.1\" cy=\"137.0\" r=\"13.0\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><line x1=\"61.9\" y1=\"137.0\" x2=\"76.2\" y2=\"137.0\" stroke=\"#1B1F27\" stroke-width=\"2.4\"/><line x1=\"69.1\" y1=\"129.8\" x2=\"69.1\" y2=\"144.2\" stroke=\"#1B1F27\" stroke-width=\"2.4\"/><text x=\"39.1\" y=\"143.0\" font-size=\"16\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">2<\/text><circle cx=\"190.9\" cy=\"137.0\" r=\"13.0\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><line x1=\"183.8\" y1=\"137.0\" x2=\"198.1\" y2=\"137.0\" stroke=\"#1B1F27\" stroke-width=\"2.4\"/><text x=\"220.9\" y=\"143.0\" font-size=\"16\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">3<\/text><\/svg><\/figure><\/div><div><p class=\"enun\">¿Cuál de las siguientes figuras muestra la fuerza eléctrica que ejercen la carga 2 y la carga 3 sobre la carga 1?<\/p><div class=\"opsfig\"><figure class=\"fig\"><svg viewBox=\"0 0 600 445\" role=\"img\" aria-label=\"Cuatro figuras, A a D, con las fue "B\"><span class=\"L\">B<\/span><span>La figura B.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>La figura C.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>La figura D.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf32\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la A.", "Por qué es la A: la carga 1 es positiva. La 2 también es positiva: se repelen, y la fuerza de 2 sobre 1 va sobre la línea que las une, alejándose de 2 (hacia arriba y a la derecha). La 3 es negativa: se atraen, y la fuerza de 3 sobre 1 apunta hacia 3 (hacia abajo y a la derecha). Esa es la figura A. B pone las dos al revés; C pone las dos como repulsión; D, las dos como atracción.", "Una flecha por cada carga vecina, sobre la línea que une las dos cargas: primero los signos, después si se atraen o se repelen.", "Las dos flechas se dibujan sobre la carga 1, que es la que recibe las fuerzas."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 3<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Hacia dónde se mueve la carga −q<\/h3><p>En la figura se muestra un campo eléctrico E, generado por dos esferas cargadas; en el interior del camp \" stroke-width=\"2\"/><line x1=\"361.6\" y1=\"327.0\" x2=\"374.8\" y2=\"327.0\" stroke=\"#1B1F27\" stroke-width=\"2.4\"/><line x1=\"368.2\" y1=\"320.4\" x2=\"368.2\" y2=\"333.6\" stroke=\"#1B1F27\" stroke-width=\"2.4\"/><circle cx=\"451.8\" cy=\"327.0\" r=\"12.0\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><line x1=\"445.2\" y1=\"327.0\" x2=\"458.4\" y2=\"327.0\" stroke=\"#1B1F27\" stroke-width=\"2.4\"/><circle cx=\"384.4\" cy=\"287.2\" r=\"6.5\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"0\"/><rect x=\"394.4\" y=\"259.2\" width=\"28.0\" height=\"19.0\" rx=\"4\" fill=\"white\" stroke=\"white\" stroke-width=\"0\"/><text x=\"396.4\" y=\"274.2\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"start\" font-weight=\"700\">−q<\/text><line x1=\"384.4\" y1=\"287.2\" x2=\"360.6\" y2=\"268.4\" stroke=\"#1B1F27\" stroke-width=\"3.2\"/><polygon points=\"354.6,263.6 365.3,266.3 359.7,273.4\" fill=\"#1B1F27\"/><\/svg><\/figure><\/div><div class=\"ops cuatro\" id=\"icf33\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>La figura A.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>La figura B.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>La figura C.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>La figura D.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf33\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la A.", "Por qué es la A: las líneas de campo salen de la esfera positiva y llegan a la negativa; donde está −q, el campo va a lo largo de la línea, en el sentido de sus flechas. Sobre una carga negativa la fuerza va al revés del campo (F = q · E, con q negativa): a lo largo de la línea, de regreso hacia la esfera positiva. Eso muestra la figura A. B va a favor del campo (sería una carga positiva); C y D son perpendiculares a la línea, y una carga que parte del reposo arranca en la dirección de la fuerza.", "La negativa va hacia la positiva: tiene sentido, se atraen. El signo cambia el sentido, no la línea.", "La pregunta es por la dirección al soltarla. Después la carga no sigue exactamente la línea, pero eso no se pregunta."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 4<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Dos esferas que se tocan<\/h3><p>En un metal que pierde electrones, la cantidad de protones es mayor que la de electrones y, por tanto, la carga total es positiva y se representa con signos +. Se tienen dos esferas metálicas idénticas: una esfera (1) inicialmente con carga + Q y otra esfera (2) inicialmente neutra. Al ponerlas en contacto y luego separarlas, se observa que las dos esferas quedan con cargas iguales + Q/2, como muestra la figura.<\/p><figure class=\"fig\"><svg viewBox=\"0 0 660 205\" role=\"img\" aria-label=\"Dos esferas metálicas antes y después del contacto: + Q y neutra; luego + Q/2 y + Q/2\" style=\"font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif;max-width:640px;margin:0 auto\"><text x=\"145.0\" y=\"20.0\" font-size=\"16\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">Antes del contacto<\/text><circle cx=\"75.0\" cy=\"112.0\" r=\"34.0\" fill=\"#C9CED6\" stroke=\"#1B1F27\" stroke-width=\"2\"/><text x=\"75.0\" y=\"119.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">1<\/text><text x=\"75.0\" y=\"66.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">+<\/text><text x=\"111.8\" y=\"81.2\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">+<\/text><text x=\"127.0\" y=\"118.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">+<\/text><text x=\"111.8\" y=\"154.8\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">+<\/text><text x=\"75.0\" y=\"170.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">+<\/text><text x=\"38.2\" y=\"154.8\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">+<\/text><text x=\"23.0\" y=\"118.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">+<\/text><text x=\"38.2\" y=\"81.2\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">+<\/text><circle cx=\"215.0\" cy=\"112.0\" r=\"34.0\" fill=\"#C9CED6\" stroke=\"#1B1F27\" stroke-width=\"2\"/><text x=\"215.0\" y=\"119.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">2<\/text><text x=\"75.0\" y=\"192.0\" font-size=\"16\" fill=\"#1B1F27\" text-anchor=\"middle\" font-style=\"italic\">+ Q<\/text><text x=\"215.0\" y=\"192.0\" font-size=\"14\" fill=\"#5C6472\" text-anchor=\"middle\" font-style=\"italic\">neutra<\/text><text x=\"475.0\" y=\"20.0\" font-size=\"16\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">Después del contacto<\/text><circle cx=\"405.0\" cy=\"112.0\" r=\"34.0\" fill=\"#C9CED6\" stroke=\"#1B1F27\" stroke-width=\"2\"/><text x=\"405.0\" y=\"119.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">1<\/text><text x=\"405.0\" y=\"66.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">+<\/text><text x=\"457.0\" y=\"118.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">+<\/text><text x=\"405.0\" y=\"170.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">+<\/text><text x=\"353.0\" y=\"118.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">+<\/text><circle cx=\"545.0\" cy=\"112.0\" r=\"34.0\" fill=\"#C9CED6\" stroke=\"#1B1F27\" stroke-width=\"2\"/><text x=\"545.0\" y=\"119.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">2<\/text><text x=\"545.0\" y=\"66.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">+<\/text><text x=\"597.0\" y=\"118.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">+<\/text><text x=\"545.0\" y=\"170.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">+<\/text><text x=\"493.0\" y=\"118.0\" font-size=\"18\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">+<\/text><text x=\"405.0\" y=\"192.0\" font-size=\"16\" fill=\"#1B1F27\" text-anchor=\"middle\" font-style=\"italic\">+ Q/2<\/text><text x=\"545.0\" y=\"192.0\" font-size=\"16\" fill=\"#1B1F27\" text-anchor=\"middle\" font-style=\"italic\">+ Q/2<\/text><\/svg><\/figure><\/div><div><p class=\"enun\">Con base en la información anterior, ¿qué sucedió al poner las esferas en contacto?<\/p><div class=\"ops\" id=\"icf34\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>De la esfera 2 pasaron electrones hacia la esfera 1.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>De la esfera 2 pasaron protones hacia la esfera 1.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>De la esfera 1 pasaron electrones hacia la esfera 2.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>De la esfera 1 pasaron protones hacia la esfera 2.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf34\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la A.", "Por qué es la A: en un metal solo se mueven los electrones; los protones están en los núcleos. La esfera 2 era neutra y quedó con + Q/2: perdió electrones. La esfera 1 pasó de + Q a + Q/2: su carga positiva bajó, así que ganó electrones. Los electrones pasaron de la 2 a la 1 (A). B y D mueven protones; C da el sentido contrario.", "«Positiva» quiere decir «le faltan electrones». Contar lo que falta es la mitad de la pregunta.", "La carga total no cambia: + Q antes, + Q/2 + Q/2 después. ---"]}}, {"m": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m6)\">Cierre<\/span><span class=\"kicker\">La pregunta de siempre<\/span><\/div><h2>¿En qué se parecía la pregunta tipo Saber 11 a la de tu libro?<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:#242478\"><div class=\"k\">1<\/div><div><b>Busca el dato que decide<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#A82424\"><div class=\"k\">2<\/div><div><b>Dibuja el campo primero<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#C9821B\"><div class=\"k\">3<\/div><div><b>Signo, sentido y unidad<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#5B3E96\"><div class=\"k\">4<\/div><div><b>Del modelo al mecanismo<\/b><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--m6)\"><h3>Antes de salir<\/h3><ol class=\"pasos\"><li>El concepto del día —una ley, una magnitud o una relación—, en «Palabras que me frenaron», con tus palabras.<\/li><li>«Lo que me llevo de esta pregunta».<\/li><li>Tu carita de salida.<\/li><li>La clase 3 de la portada del área, con la causa que encontraste.<\/li><\/ol><\/div><\/div>", "guia": {"obj": "Que el estudiante nombre la estrategia que usó y se lleve un concepto del día —una ley, una magnitud o una relación— escrito en sus propias palabras.", "decir": ["Socializa solo las preguntas que el grupo falló, pidiendo la flecha o la cuenta que las resuelve.", "Pide que lean en voz alta su salvavidas: lo mínimo que sí tenían claro.", "Cada uno escribe el concepto del día en «Palabras que me frenaron» y la causa que encontró en la portada del área."], "como": "No dicta la definición ni la fórmula. El concepto se escribe como el estudiante lo entendió; si quedó mal entendido, eso se ve en la hoja y se corrige la próxima clase.", "apoyo": ["El concepto del día no se dicta. Si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase: es mejor que dictarla bien.", "Para el cierre del momento: La pregunta 7 trae la carga y la fuerza sin unidades. Cierra pidiéndolas: 2 × 10⁻⁶ C por 400 N/C da 8 × 10⁻⁴ N."]}}];
var MOM = [{"n": 1, "nom": "Activación", "min": 15, "c": "--m1"}, {"n": 2, "nom": "Pregunta problematizadora", "min": 20, "c": "--m2"}, {"n": 3, "nom": "Desarrollo guiado", "min": 35, "c": "--m3"}, {"n": 4, "nom": "Reto en equipo", "min": 20, "c": "--m4"}, {"n": 5, "nom": "Evaluación individual", "min": 20, "c": "--m5"}, {"n": 6, "nom": "Cierre", "min": 10, "c": "--m6"}];
var NOMBRE = document.getElementById("momnom").textContent, SUB = document.getElementById("momsub").textContent;
var $ = function(s){ return document.querySelector(s); };
var wrap = $("#wrap"), stage = $("#stage"), i = 0;
var tBase = 0, tLeft = 0, tOn = false, tick = null;
var elegidas = [];
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function paintClock(){
  var n = $("#tnum");
  if(!tBase){ n.textContent = "—"; n.classList.remove("over"); return; }
  var s = Math.abs(tLeft), mm = Math.floor(s/60), ss = s%60;
  n.textContent = (tLeft<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", tLeft<0);
}
function setTimer(min){
  tBase = min||0; tLeft = tBase*60; tOn = false;
  if(tick){ clearInterval(tick); tick = null; }
  $("#play").textContent = "Iniciar"; paintClock();
}
function toggleTimer(){
  if(!tBase) return;
  tOn = !tOn; $("#play").textContent = tOn ? "Pausar" : "Seguir";
  if(tick){ clearInterval(tick); tick = null; }
  if(tOn) tick = setInterval(function(){ tLeft--; paintClock(); }, 1000);
  paintClock();
}
function guiaHTML(g){
  if(!g) return '<p class="sub">Sin notas para esta diapositiva.</p>';
  var h = '<div class="gbox"><h4>Objetivo</h4><p>'+esc(g.obj)+'</p></div>';
  if(g.decir && g.decir.length) h += '<div class="gbox"><h4>Qué haces y qué dices</h4><ul>'+
     g.decir.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  if(g.como) h += '<div class="gbox como"><h4>Lo que no haces</h4><p>'+esc(g.como)+'</p></div>';
  if(g.apoyo && g.apoyo.length) h += '<div class="gbox apoyo"><h4>Si Física no es tu fuerte</h4><ul>'+
     g.apoyo.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  return h;
}
function pintaElegidas(){
  var box = document.getElementById("elegidas"); if(!box) return;
  if(!elegidas.length){ box.innerHTML = '<p class="sub">Vuelve a la diapositiva anterior y escoge las cinco.</p>'; return; }
  box.innerHTML = elegidas.map(function(t,k){
    return '<div class="card edge" style="--accent:var(--m'+((k%6)+1)+')"><h3>'+(k+1)+'. '+esc(t)+'</h3>'+
      '<p class="sub">Busca esta pregunta en tu simulacro y en la hoja de taller de la misma estrategia.</p></div>';
  }).join("");
}
function go(n){
  var prev = SC[i];
  i = Math.max(0, Math.min(SC.length-1, n));
  var s = SC[i];
  wrap.innerHTML = s.html;
  wrap.classList.remove("enter"); void wrap.offsetWidth; wrap.classList.add("enter");
  stage.scrollTop = 0;
  var m = s.m!=null ? MOM[s.m] : null;
  $("#momdot").style.background = m ? "var("+m.c+")" : "var(--faint)";
  $("#momdot").textContent = m ? m.n : "·";
  $("#momnom").textContent = m ? m.nom : NOMBRE;
  $("#momsub").textContent = m ? (m.min+" minutos") : SUB;
  var want = s.min!=null ? s.min : (m ? m.min : 0);
  var cambio = !prev || prev===s || prev.m!==s.m || (prev.min||null)!==(s.min||null);
  if(cambio) setTimer(want);
  $("#count").textContent = (i+1)+" / "+SC.length;
  $("#prog i").style.width = (SC.length>1 ? i/(SC.length-1)*100 : 100)+"%";
  $("#guiabody").innerHTML = guiaHTML(s.guia);
  [].forEach.call(wrap.querySelectorAll("[data-pick]"), function(b){
    b.setAttribute("aria-pressed", elegidas.indexOf(b.textContent)>=0 ? "true" : "false"); });
  pintaElegidas();
}
wrap.addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.dataset.show){ var t = document.getElementById(b.dataset.show); if(t) t.hidden = !t.hidden; }
  if(b.dataset.showgrupo){
    var g = wrap.querySelectorAll('[data-grupo="'+b.dataset.showgrupo+'"]'), abrir = g.length && g[0].hidden;
    [].forEach.call(g, function(x){ x.hidden = !abrir; });
    b.textContent = abrir ? "Ocultar las claves" : "Revelar las claves";
  }
  if(b.dataset.clave){
    var box = document.getElementById(b.dataset.clave), ok = box.querySelector('[data-op="'+b.dataset.k+'"]');
    var on = ok && !ok.classList.contains("ok");
    [].forEach.call(box.querySelectorAll(".op"), function(o){ o.classList.remove("ok"); });
    if(on) ok.classList.add("ok");
    b.textContent = on ? "Ocultar la clave" : "Revelar la clave";
  }
  if(b.dataset.tally){ var n = document.getElementById(b.dataset.tally); n.textContent = (+n.textContent||0)+1; }
  if(b.dataset.reset){ [].forEach.call(wrap.querySelectorAll('[id^="'+b.dataset.reset+'"]'), function(x){
    if(x.classList.contains("n")) x.textContent = "0"; }); }
  if(b.dataset.pick!=null){
    var t = b.textContent, k = elegidas.indexOf(t);
    if(k>=0) elegidas.splice(k,1); else if(elegidas.length<5) elegidas.push(t);
    b.setAttribute("aria-pressed", elegidas.indexOf(t)>=0 ? "true" : "false");
  }
});
function setGuia(on){ $("#guia").classList.toggle("open", on); $("#scrim").classList.toggle("on", on);
  $("#gbtn").setAttribute("aria-pressed", on ? "true" : "false"); }
$("#next").addEventListener("click", function(){ go(i+1); });
$("#prev").addEventListener("click", function(){ go(i-1); });
$("#play").addEventListener("click", toggleTimer);
$("#reset").addEventListener("click", function(){ setTimer(tBase); });
$("#gbtn").addEventListener("click", function(){ setGuia(!$("#guia").classList.contains("open")); });
$("#gclose").addEventListener("click", function(){ setGuia(false); });
$("#scrim").addEventListener("click", function(){ setGuia(false); });
document.addEventListener("keydown", function(e){
  var t = e.target.tagName; if(t==="INPUT"||t==="TEXTAREA") return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ go(i+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ go(i-1); e.preventDefault(); }
  else if(e.key==="Home"){ go(0); e.preventDefault(); }
  else if(e.key==="End"){ go(SC.length-1); e.preventDefault(); }
  else if(e.key==="g"||e.key==="G"){ setGuia(!$("#guia").classList.contains("open")); }
  else if(e.key==="t"||e.key==="T"){ toggleTimer(); }
  else if(e.key==="Escape"){ setGuia(false); }
});
go(0);
})();
</script>
</body>
