<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Física · Clase 4</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>[hidden]{display:none!important}
:root{
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --text:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --area:#5C7A1E; --azul:#1F4E8C; --oro:#B0711A; --morado:#5B3E96; --verde:#2E7A39;
  --m1:#5C7A1E; --m2:#1F4E8C; --m3:#3B3BA6; --m4:#5B3E96; --m5:#A82424; --m6:#4A5A70; --rojo:#A82424;
  --ink:#1B1F27; --muted:#5C6472; --faint:#A9B0BB; --line:#E3E7ED; --paper:#FFFFFF; --bg:#F6F4F1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:clamp(16px,1.25vw,21px);line-height:1.5}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
#top{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding:10px clamp(14px,2vw,28px);background:var(--paper);flex-wrap:wrap}
.logo img{height:clamp(28px,2.6vw,40px);display:block}
#mom{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
#momdot{width:clamp(30px,2.4vw,40px);height:clamp(30px,2.4vw,40px);border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;background:var(--faint)}
#momnom{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.2vw,20px)}
#momsub{color:var(--muted);font-size:.85em}
#clock{display:flex;align-items:center;gap:8px}
#tnum{font-family:var(--display);font-weight:800;font-size:clamp(20px,1.8vw,30px);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
#tnum.over{color:var(--area)}
.btn{appearance:none;font:inherit;font-size:.86em;font-weight:600;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.solid{background:var(--area);border-color:var(--area);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#stage{overflow:auto;padding:clamp(18px,3vw,48px) clamp(16px,4vw,72px)}
#wrap{max-width:1500px;margin:0 auto}
#wrap.enter{animation:ent .28s ease-out}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bot{display:flex;align-items:center;gap:12px;padding:10px clamp(14px,2vw,28px);background:var(--paper)}
#prog{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
#prog i{display:block;height:100%;background:var(--area);transition:width .25s}
#count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
#hint{color:var(--faint);font-size:.8em}
@media (max-width:760px){#hint{display:none}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.2vw,68px);line-height:1.05;margin:.2em 0 .25em;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,2.8vw,46px);line-height:1.1;margin:.25em 0 .3em;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:clamp(18px,1.5vw,26px);margin:.1em 0 .4em;line-height:1.2}
p{margin:.35em 0 .6em}
.lead{font-size:1.2em;line-height:1.45;max-width:70ch}
.sub{color:var(--muted)}
.mt{margin-top:clamp(14px,1.8vw,26px)}
.logo-xl img{height:clamp(54px,6vw,96px);margin-bottom:12px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tag,.min,.membrete{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.78em;font-weight:700;letter-spacing:.02em}
.tag{background:var(--ink);color:#fff}
.min{background:var(--accent,var(--area));color:#fff}
.membrete{border:1.5px solid var(--line);color:var(--muted)}
.kicker{color:var(--muted);font-size:.85em;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.grid{display:grid;gap:clamp(12px,1.4vw,22px)}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid>*{min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,1.6vw,24px)}
.card.edge{border-left:6px solid var(--accent,var(--area))}
.card.big .lead{font-size:1.3em}
.step{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px}
.step .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;flex:none}
.note{border-left:5px solid var(--accent,var(--area));background:var(--paper);border-radius:10px;padding:10px 16px;margin-top:12px}
.cita{font-family:var(--display);font-weight:600;line-height:1.35;background:var(--paper);border-left:6px solid var(--area);border-radius:12px;padding:clamp(16px,2vw,30px);margin:18px 0}
.cita.xl{font-size:clamp(24px,2.6vw,44px)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally .n{display:inline-block;min-width:1.6em;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.pasos{margin:.2em 0 0;padding-left:1.3em}.pasos li{margin:.3em 0}
.sello{margin-top:12px;border:2px dashed var(--oro);border-radius:12px;padding:10px 14px;background:#FDF6EA}
.sello b{display:block;color:var(--oro);font-size:.8em;letter-spacing:.06em;text-transform:uppercase}
.clave{margin-top:12px;display:flex;align-items:center;gap:10px;font-weight:600}
.keychip{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:10px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.2em}
.aviso{margin-top:10px;border-radius:10px;padding:10px 14px;background:#FBEFEF;border-left:5px solid var(--area);font-size:.92em}
.aviso.sev-aten{background:#EDF5EE;border-left-color:var(--verde)}
.aviso.sev-medi{background:#FDF5E7;border-left-color:var(--oro)}
.icfes .texto{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.6vw,24px);max-height:62vh;overflow:auto;font-size:.95em}
.enun{font-weight:600;font-size:1.08em}
.ops{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.op .L{flex:none;width:1.8em;height:1.8em;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-family:var(--display);font-weight:800}
.op.ok{border-color:var(--verde);background:#EDF5EE}.op.ok .L{background:var(--verde);color:#fff}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick[aria-pressed="true"]{background:var(--area);border-color:var(--area);color:#fff}
#scrim{position:fixed;inset:0;background:rgba(15,18,24,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#guia{position:fixed;top:0;right:0;height:100%;width:min(520px,92vw);background:var(--paper);box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column;z-index:10}
#guia.open{transform:none}
#guiahead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg)}
#guiabody{overflow:auto;padding:16px 20px 30px;font-size:.92em}
.gbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.gbox h4{margin:0 0 6px;font-family:var(--display);font-size:.8em;letter-spacing:.07em;text-transform:uppercase;color:var(--area)}
.gbox ul{margin:0;padding-left:1.1em}.gbox li{margin:.35em 0}
.gbox.como{background:#F6F7F9}.gbox.como h4{color:var(--muted)}
.gbox.apoyo{background:#FDF6EA;border-color:#EAD9B4}.gbox.apoyo h4{color:var(--oro)}
[hidden]{display:none!important}
.fig{margin:12px 0}.fig svg{display:block;width:100%;max-width:760px;height:auto}
.tabla{border-collapse:collapse;width:100%;table-layout:fixed;font-size:.86em;line-height:1.35;margin:0 auto}
.tabla th,.tabla td{border:1px solid var(--line);padding:5px 8px;vertical-align:top;overflow-wrap:anywhere}
.tabla th{background:#F2F4EE;text-align:left}.fig figcaption{font-size:.85em;font-style:italic;color:var(--muted)}
.ops.cuatro{grid-template-columns:repeat(4,1fr)}.ops.cuatro .op{padding:8px 10px;gap:8px;font-size:.92em;align-items:center}
.derfig .fig{margin:0 0 10px}.opsfig{background:var(--paper);border:1px solid var(--line);
border-radius:14px;padding:8px 10px;margin-top:10px}.opsfig .fig{margin:0}
.aviso{border-left-color:var(--rojo)}.aviso.sev-baja{background:#EEF3FA;border-left-color:var(--azul)}
</style>
</head>

ueba de campo, páginas 236 a 239<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m4)\"><h3>Tu cuaderno<\/h3><p class=\"sub\">Páginas 286 a 292<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m6)\"><h3>Hoy<\/h3><p class=\"sub\">120 minutos · 6 momentos · EF, UC e IN · ondas, luz y sonido<\/p><\/div><\/div>", "guia": {"obj": "Que el grupo sepa desde el primer minuto qué va a pasar en estos 120 minutos y qué tiene que tener sobre la mesa.", "decir": ["«Libro abierto, cuaderno cerrado, lápiz. Hoy nadie me va a decir la fórmula de memoria: me van a mostrar la flecha o el julio que explica lo que pasa.»"], "apoyo": ["⚑ Antes del sábado: Dos claves de reserva alta: en la 3 el esquema tiene dos rayos con la letra A, y en la 9 ninguna opción da la razón física. Otras dos de reserva media (4 y 6). Es la misión que más le pide al profe: prepara los cuatro sellos.", "Seguridad de las dinámicas: En «El ritmo y el piso» se camina, nunca se corre. En «Lo que oímos» el golpe a los pupitres es suave, siempre igual.", "Del libro, para ti: El repaso del libro dice que en el caucho la onda llega tarde «por su absorción»: la causa es la poca rigidez. Si alguien lo cita, corrígelo con el sello de la pregunta 8.", "Los cuatro conceptos que tienes que poder explicar hoy en dos minutos, sin jerga. Si un estudiante sabe más que tú de un tema, déjalo explicar y pide que lo muestre con una flecha o con una cuenta con unidades:", "Frecuencia, longitud de onda y rapidez: Frecuencia: cuántas ondas pasan por segundo; la pone la fuente. Rapidez: qué tan rápido avanza; la pone el medio. Longitud de onda: la distancia entre dos crestas, λ = v ÷ f.", "Refracción: Cuando la luz pasa a un medio donde va más lenta, como del aire al agua, se dobla acercándose a la normal. El ojo cree que la luz llegó en línea recta: por eso las cosas se ven donde no están.", "Interferencia: Dos ondas que se encuentran se suman. Cresta con cresta: más fuerte (constructiva). Cresta con valle: se anulan (destructiva). Por eso frente a dos parlantes hay puntos de sonido fuerte y otros donde casi no se oye.", "Decibeles: Es una escala de veces, no de sumas: 10 dB más es 10 veces más potencia; 20 dB, 100 veces; 30 dB, 1000 veces. Por eso 33 dB de diferencia son unas 2000 veces.", "Abre esta guía con la tecla G en cada diapositiva: trae lo que dices y, debajo, lo que necesitas saber si Física no es tu área.", "El cronómetro arranca con T y se reinicia solo cuando cambia el momento de la clase."]}}, {"m": null, "html": "<div class=\"eyebrow\"><span class=\"kicker\">Así vamos a trabajar<\/span><\/div><h2>Seis momentos, una sola regla<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:var(--m1)\"><div class=\"k\">1<\/div><div><b>Activación<\/b><span class=\"sub\"> · 15 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m2)\"><div class=\"k\">2<\/div><div><b>Pregunta problematizadora<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m3)\"><div class=\"k\">3<\/div><div><b>Desarrollo guiado<\/b><span class=\"sub\"> · 35 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m4)\"><div class=\"k\">4<\/div><div><b>Reto en equipo<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m5)\"><div class=\"k\">5<\/div><div><b>Evaluación individual<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m6)\"><div class=\"k\">6<\/div><div><b>Cierre<\/b><span class=\"sub\"> · 10 min<\/span><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--area)\"><h3>La regla del cuaderno<\/h3><p class=\"lead\">Si el instrumento está vacío, no lo resolviste: lo adivinaste.<\/p><p>Primero se hace el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento—, después se marca la opción. Una respuesta correcta con el instrumento en blanco no cuenta como resuelta.<\/p><\/div><\/div>", "guia": {"obj": "Que la regla quede dicha en voz alta antes de cualquier texto.", "decir": ["«La respuesta correcta con el instrumento vacío no cuenta. ¿Por qué? Porque en Física casi todas las opciones usan palabras técnicas: el que no dibujó la flecha ni hizo la cuenta escoge la que suena mejor, no la que es.»"], "apoyo": ["Si alguien pregunta para qué dibujar, la respuesta corta es: lo que separa la opción correcta de las que suenan bien está en el sentido de una flecha, en un signo o en una unidad, y eso se pierde si no se escribe.", "Si alguien dice «es por la gravedad» o «es la energía», devuélvele la pregunta: «¿quién empuja a quién, y hacia dónde?»."]}}, {"m": 0, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Activación<\/span><span class=\"kicker\">Cuaderno cerrado<\/span><\/div><h2>¿Qué cambió y qué lo causó?<\/h2><blockquote class=\"cita xl\">En el estadio, cuando el público hace «la ola», nadie avanza por la tribuna: cada uno se para y se sienta en su puesto, y aun así la ola le da la vuelta a la cancha.<\/blockquote><p class=\"lead\">Dos respuestas antes de cualquier fórmula. Todavía no se abre el cuaderno.<\/p><div class=\"ctl\"><button class=\"btn\" data-show=\"pista4\">Mostrar la pista<\/button><\/div><div class=\"note\" id=\"pista4\" hidden style=\"--accent:var(--m1)\"><b>Pista:<\/b> lo que viaja es la perturbación, no las personas; el ritmo lo pone quien se para primero, y qué tan rápido avanza depende de qué tan rápido reacciona la tribuna<\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno corto diciendo qué cambió y qué lo causó —qué fuerza, qué calor, qué carga— antes de explicarlo con fórmulas y antes de ver cualquier opción.", "decir": ["Proyecta o lee una observación de dos o tres renglones sin decir de dónde salió.", "Pide dos respuestas, en voz alta o en el tablero: qué cambió y qué lo causó, dicho como una flecha con nombre («el piso frena…», «el calor va de… a…»).", "Ejecuta la dinámica de apertura según la estrategia del encuentro."], "como": "No explica el fenómeno ni acepta todavía fórmulas. Si alguien dice «es por la gravedad» o «es la energía», le devuelve la pregunta: «¿quién empuja a quién, y hacia dónde?». El cuaderno sigue cerrado.", "apoyo": ["No expliques el fenómeno ni aceptes todavía fórmulas: primero qué cambió y qué lo causó, dicho como una flecha con nombre. La observación es inventada para la clase: no sale del libro.", "La pista existe para el cierre de los 15 minutos, no para el principio: lo que viaja es la perturbación, no las personas; el ritmo lo pone quien se para primero, y qué tan rápido avanza depende de qué tan rápido reacciona la tribuna."]}}, {"m": 0, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#242478\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 1 · La fuente pone la frecuencia<\/span><\/div><h2>El ritmo y el piso<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>El docente marca un ritmo con palmas: es la fuente. Seis estudiantes salen uno por palmada y dan un paso largo por palmada.<\/li><li>En una zona marcada con cinta, el medio «lento», dan pasos cortos, pero siempre uno por palmada.<\/li><li>El grupo mira: ¿cambió el ritmo?, ¿la distancia entre compañeros?, ¿qué tan rápido avanza la fila?<\/li><li>Al salir de la zona: ¿qué vuelve a cambiar, qué no cambió nunca y quién lo puso?<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cinta · pasillo despejado · sin correr<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno corto diciendo qué cambió y qué lo causó —qué fuerza, qué calor, qué carga— antes de explicarlo con fórmulas y antes de ver cualquier opción.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No explica el fenómeno ni acepta todavía fórmulas. Si alguien dice «es por la gravedad» o «es la energía», le devuelve la pregunta: «¿quién empuja a quién, y hacia dónde?». El cuaderno sigue cerrado.", "apoyo": ["Qué movimiento mental entrena: Separar lo que pone la fuente (la frecuencia, que no cambia de un medio a otro) de lo que pone el medio (la rapidez y, con ella, la longitud de onda). Es el movimiento de las preguntas 2, 3 y 9, y de la primera del entrenamiento (el detector de sonido fuera del agua).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 1, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m2)\">Pregunta problematizadora<\/span><span class=\"kicker\">Libro abierto en la pregunta modelo<\/span><\/div><h2>Abran el libro en la pregunta 1, página 236<\/h2><p class=\"lead\">Antes de dibujar o calcular: ¿cuál creen que es? Levanten la mano.<\/p><div class=\"ctl\"><button class=\"btn tally\" data-tally=\"h4A\">A <span class=\"n\" id=\"h4A\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h4B\">B <span class=\"n\" id=\"h4B\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h4C\">C <span class=\"n\" id=\"h4C\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h4D\">D <span class=\"n\" id=\"h4D\">0<\/span><\/button><button class=\"btn\" data-reset=\"h4\">↺<\/button><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta que gobierna el área<\/h3><p class=\"lead\">¿Qué lo causó? Muéstrame la flecha o el julio que lo explica.<\/p><p class=\"sub\">Nadie justifica con «así dice la fórmula» ni con «eso es obvio»: toda respuesta señala una flecha del dibujo, un número con su unidad o un renglón del enunciado.<\/p><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta de este momento<\/h3><p class=\"lead\">¿Qué pone la fuente, qué pone el medio y qué se puede concluir de lo que se ve?<\/p><\/div>", "guia": {"obj": "Que el estudiante compruebe que en Física la respuesta sale de la causa dibujada o de la cuenta con unidades, y no de la opción que suena más técnica, usando la pregunta modelo del libro.", "decir": ["Presenta la pregunta modelo del libro y la deja a la vista todo el momento.", "Pide respuestas a mano alzada ANTES de dibujar o calcular nada, y las anota en el tablero.", "Hace la pregunta que gobierna el área: ¿qué lo causó? Muéstrame la flecha o el julio que lo explica.", "Revela la clave solo al final y trabaja por qué cae cada una de las otras tres."], "como": "Regla del momento: nadie justifica con «así dice la fórmula» ni con «eso es obvio». Toda intervención señala una flecha del dibujo, un número con su unidad o un renglón del enunciado.", "apoyo": ["La pregunta modelo es la 1 del libro (página 236). El cuaderno se abre en la página 286 solo en «mi primera idea».", "Cuenta las manos tocando cada letra: el número queda en pantalla y sirve para el final del momento, cuando el grupo vea cuántos cambiaron de opinión al dibujar la flecha o hacer la cuenta.", "No digas la clave en este momento: sale en el bloque de las preguntas 1 y 2, después de llenar el instrumento en pantalla, casilla por casilla. Ahí se trabaja por qué cae cada una de las otras tres."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 1 y 2<\/span><span class=\"kicker\">En pantalla, casilla por casilla<\/span><\/div><h2>Preguntas 1 y 2: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 1<\/span><span class=\"min\" style=\"--accent:#A82424\">E2 · Dibújalo antes de elegir<\/span><\/div><p class=\"sub\">Láser y doble rendija · la pantalla más cerca<\/p><h3 style=\"color:#A82424\">Los mismos ángulos sobre dos pantallas<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k41\"><span class=\"keychip\" style=\"background:#A82424\">D<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 2<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · La fuente pone la frecuencia<\/span><\/div><p class=\"sub\">Onda de una cuerda delgada a una gruesa · qué cambia<\/p><h3 style=\"color:#242478\">La mano marca el ritmo; la cuerda, la rapidez<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Rapidez de una onda en una cuerda<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k41\"><span class=\"keychip\" style=\"background:#242478\">B<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k41\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 1·D y 2·B. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 2 · Rapidez de una onda en una cuerda: La onda va más rápido si la cuerda está más tensa y más despacio si pesa más por cada metro. La frecuencia la pone la mano y no cambia al pasar a la parte gruesa; como allá va más lenta, la longitud de onda se acorta: λ = v ÷ f. Para destrabar: «¿Quién pone el ritmo: la mano o la cuerda?»"]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 3 y 4<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 3 y 4: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 3<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · La fuente pone la frecuencia<\/span><\/div><p class=\"sub\">Láser rojo que entra al agua · qué trayectoria<\/p><h3 style=\"color:#242478\">La normal manda: ángulo de entrada y de salida<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Refracción, y un esquema con dos letras A<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k43\"><span class=\"keychip\" style=\"background:#242478\">B<\/span> es la clave del libro<\/div><div class=\"aviso sev-alta\" hidden data-grupo=\"k43\"><b>Ojo con esta clave:<\/b> El esquema del libro tiene dos rayos con la letra A y el B está en el aire. La razón correcta es la de la opción B: al entrar al agua la luz va más lenta y se acerca a la normal.<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 4<\/span><span class=\"min\" style=\"--accent:#C9821B\">E4 · Lee la tabla y su escala<\/span><\/div><p class=\"sub\">Wi-Fi en tres puntos · por qué baja la descarga en C<\/p><h3 style=\"color:#C9821B\">El plano de la casa con sus tres medidas<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k43\"><span class=\"keychip\" style=\"background:#C9821B\">A<\/span> es la clave del libro<\/div><div class=\"aviso sev-medi\" hidden data-grupo=\"k43\"><b>Ojo con esta clave:<\/b> La A y la D se pueden defender; la explicación principal es la A: el metal refleja casi toda la señal que le llega.<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k43\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 3·B y 4·A. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 3 · Refracción, y un esquema con dos letras A: La luz que entra al agua va más lenta y se dobla acercándose a la normal (la línea perpendicular a la superficie). En el esquema del libro dos rayos llevan la letra A y el B está en el aire: la opción con la razón correcta es la B. Que cada uno marque sus rayos. Para destrabar: «¿Este rayo se quedó en el aire o entró al agua?»", "Pregunta 3 · aviso del libro (alta): El esquema del libro tiene dos rayos con la letra A y el B está en el aire. La razón correcta es la de la opción B: al entrar al agua la luz va más lenta y se acerca a la normal. Qué haces: Clave tomada: B, por la razón. Con el sello, que cada uno le ponga su letra a cada rayo.", "Pregunta 4 · aviso del libro (media): La A y la D se pueden defender; la explicación principal es la A: el metal refleja casi toda la señal que le llega. Qué haces: Clave tomada: A. La editorial podría tener la D: si alguien la defiende, escúchalo."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#A82424\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 2 · Dibújalo antes de elegir<\/span><\/div><h2>La moneda que sube<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Una cinta en el piso es la superficie del agua. Un estudiante agachado bajo ella tiene una moneda en el «fondo».<\/li><li>Con un cordón arman el camino de la luz hasta el ojo de otro, de pie: recto en el agua, se dobla en la cinta alejándose de la normal, recto en el aire.<\/li><li>«Mi ojo no sabe que la luz se dobló»: con otro cordón prolongan hacia atrás el último tramo.<\/li><li>El grupo marca dónde se «ve» la moneda y lo compara con dónde está.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cinta · dos cordones · una moneda<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Qué movimiento mental entrena: Dibujar los rayos antes de elegir y prolongar en línea recta lo que le llega al ojo. Es el movimiento de las preguntas 1 y 8, y de la segunda del entrenamiento (cómo ve el nadador el farol).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 5 y 6<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 5 y 6: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 5<\/span><span class=\"min\" style=\"--accent:#C9821B\">E4 · Lee la tabla y su escala<\/span><\/div><p class=\"sub\">Wi-Fi en A y en C · qué indican 33 dB de diferencia<\/p><h3 style=\"color:#C9821B\">La escalera de los decibeles<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k45\"><span class=\"keychip\" style=\"background:#C9821B\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 6<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E3 · Concluye solo lo observado<\/span><\/div><p class=\"sub\">Los vasos de Jurassic Park · qué conclusión permite la observación<\/p><h3 style=\"color:#5B3E96\">Dos vasos en el mismo tablero<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k45\"><span class=\"keychip\" style=\"background:#5B3E96\">A<\/span> es la clave del libro<\/div><div class=\"aviso sev-medi\" hidden data-grupo=\"k45\"><b>Ojo con esta clave:<\/b> Los dos vasos están casi a la misma distancia del dinosaurio: la diferencia se explica mejor por el vaso y el agua. La clave A concluye más de lo que se observa.<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k45\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 5·B y 6·A. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 6 · aviso del libro (media): Los dos vasos están casi a la misma distancia del dinosaurio: la diferencia se explica mejor por el vaso y el agua. La clave A concluye más de lo que se observa. Qué haces: Clave tomada: A. Úsala para discutir justo la estrategia: concluye solo lo observado."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#5B3E96\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 3 · Concluye solo lo observado<\/span><\/div><h2>Lo que oímos y lo que decimos<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>El docente golpea suave, siempre igual, la punta de una fila de pupitres; tres estudiantes con la oreja en la madera dicen si oyen fuerte, medio o débil.<\/li><li>El docente lee conclusiones: «el sonido se debilita al alejarse», «la madera transmite mejor que el aire».<\/li><li>Cada uno camina a una zona: LO OBSERVAMOS, NO LO OBSERVAMOS o NECESITO OTRA PRUEBA.<\/li><li>Para quedarse, dice qué dato lo respalda o qué cambiaría en la otra prueba.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Una fila de pupitres · tres letreros<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Qué movimiento mental entrena: Concluir solo lo que la observación permite y nombrar qué habría que controlar para decir más. Es el movimiento de las preguntas 6 y 7, y de la tercera del entrenamiento (los puntos donde se oye fuerte y donde casi no).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 7 y 8<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 7 y 8: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 7<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E3 · Concluye solo lo observado<\/span><\/div><p class=\"sub\">Vasos alineados a distintas distancias · qué controlar<\/p><h3 style=\"color:#5B3E96\">Lo que muevo, lo que mido y lo que dejo quieto<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k47\"><span class=\"keychip\" style=\"background:#5B3E96\">A<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 8<\/span><span class=\"min\" style=\"--accent:#A82424\">E2 · Dibújalo antes de elegir<\/span><\/div><p class=\"sub\">Ondas en aluminio, plástico y caucho · qué figura<\/p><h3 style=\"color:#A82424\">Tres placas, un segundo: dibuja tú los anillos<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Rigidez y rapidez<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k47\"><span class=\"keychip\" style=\"background:#A82424\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k47\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 7·A y 8·A. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 7 · aviso del libro (atención), solo para ti, no se proyecta: La B y la C también son variables que hay que controlar; la A es la que más pesa sobre lo que se mide. Qué haces: Buena ocasión para hablar de variables de control.", "Pregunta 8 · Rigidez y rapidez: Un material rígido recupera su forma enseguida y por eso pasa la perturbación rápido: en el aluminio una onda va mucho más rápido que en el caucho, que es blando. No es por el peso: el caucho es menos denso que el aluminio. Para destrabar: «¿Este material vuelve rápido a su forma o se queda deformado?»", "Pregunta 8 · aviso del libro (atención), solo para ti, no se proyecta: Se responde mejor con los radios que da después la pregunta 10 (12, 8 y 3 cm). Qué haces: El sello del cuaderno trae la idea: más rígido, más rápido."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#C9821B\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 4 · Lee la tabla y su escala<\/span><\/div><h2>La gráfica humana<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Con cinta, dos ejes en el piso; un equipo escribe los rótulos y las marcas de cada escala.<\/li><li>El docente dicta una tabla: a los 0, 5, 10 y 15 minutos, una taza de agua está a 80, 65, 55 y 50 °C. Cuatro estudiantes se ubican como puntos.<\/li><li>El grupo revisa que cada uno esté en su minuto y en su temperatura.<\/li><li>El docente voltea en secreto una escala o cambia los rótulos de eje: ¿la gráfica cuenta la misma historia?<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cinta · hojas para rótulos y marcas<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Qué movimiento mental entrena: Antes de leer la forma, leer qué variable va en cada eje y hacia dónde crece su escala. Es el movimiento de las preguntas 4, 5 y 10, y de la cuarta del entrenamiento (qué gráfica muestra la tabla del sonido).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 9 y 10<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 9 y 10: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 9<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · La fuente pone la frecuencia<\/span><\/div><p class=\"sub\">Ondas en la placa de caucho · por qué van más lento<\/p><h3 style=\"color:#242478\">¿Cambia la rapidez o cambia el tamaño?<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Cuando la razón física no está en las opciones<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k49\"><span class=\"keychip\" style=\"background:#242478\">C<\/span> es la clave del libro<\/div><div class=\"aviso sev-alta\" hidden data-grupo=\"k49\"><b>Ojo con esta clave:<\/b> Ninguna opción da la razón principal: en el caucho la onda va lenta porque el caucho es poco rígido. La absorción hace la onda más pequeña, no más lenta. La C es la única que dice algo cierto del caucho.<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 10<\/span><span class=\"min\" style=\"--accent:#C9821B\">E4 · Lee la tabla y su escala<\/span><\/div><p class=\"sub\">Radios a un segundo · cuánto recorre la onda en el aluminio<\/p><h3 style=\"color:#C9821B\">Mismo reloj, tres reglas<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k49\"><span class=\"keychip\" style=\"background:#C9821B\">D<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k49\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 9·C y 10·D. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 9 · Cuando la razón física no está en las opciones: La rapidez depende de la rigidez y de la densidad. La absorción hace que la onda pierda tamaño y no llegue lejos, pero no la hace más lenta. La C es la única opción que dice algo cierto del caucho: se marca, y se dice en voz alta que no es la razón principal. Para destrabar: «¿Eso explica que vaya más lento, o que llegue más pequeña?»", "Pregunta 9 · aviso del libro (alta): Ninguna opción da la razón principal: en el caucho la onda va lenta porque el caucho es poco rígido. La absorción hace la onda más pequeña, no más lenta. La C es la única que dice algo cierto del caucho. Qué haces: Clave tomada: C, la única que dice algo cierto del caucho. Dilo de frente, con el sello."]}}, {"m": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m4)\">Reto en equipo · 20 min<\/span><span class=\"kicker\">Equipos de tres · cada uno responde en su cuaderno<\/span><\/div><h2>Reto del corte: El parlante de la fiesta<\/h2><div class=\"card big edge mt\" style=\"--accent:var(--m4)\"><p class=\"lead\">Cada equipo recibe una tabla: un parlante suena a 90 dB a 2 m, a 84 dB a 4 m y, detrás de una pared, a 4 m, a 64 dB. En doce minutos dicen qué pone el parlante y qué pone la pared (¿cambia la nota al atravesarla?); dibujan los frentes de onda que salen del parlante y llegan a la pared; escriben una conclusión que los datos permiten y otra que no («la pared absorbe todo el sonido»); y calculan cuántas veces más débil se oye detrás de la pared que delante, a la misma distancia. Cada integrante defiende una de las cuatro partes.<\/p><\/div><div class=\"note mt\" style=\"--accent:var(--m4)\"><b>La defensa:<\/b> tres minutos por equipo, señalando la flecha, la cuenta con su unidad o la variable que los respalda. «Porque sí» o «así dice la fórmula» no cuentan.<\/div>", "guia": {"obj": "Que el estudiante defienda su explicación con el dibujo o la cuenta en la mano y acepte que otro equipo puede ver una fuerza, una pérdida o una variable que él no vio.", "decir": ["Arma equipos de tres y entrega el reto del corte de este momento.", "Exige que cada integrante llegue con su instrumento YA diligenciado individualmente.", "Da tres minutos de defensa por equipo: muestran la flecha, la cuenta o la variable que los respalda.", "Cierra mostrando qué fuerza, qué julio o qué variable quedó por fuera en cada propuesta."], "como": "El equipo discute, pero cada uno escribe en SU tarjeta del reto. No se acepta una defensa que diga «porque sí» o «eso dice la fórmula»: se señala la flecha, el número con su unidad o la variable que se controló.", "apoyo": ["Las cuentas del reto, para ti (no se proyectan): La nota (la frecuencia) la pone el parlante: no cambia al atravesar la pared. 84 − 64 = 20 dB: cien veces menos potencia detrás de la pared que delante, a la misma distancia. «La pared absorbe todo» no se puede concluir: detrás todavía se oyen 64 dB.", "El reto no tiene una sola respuesta correcta en todas sus partes: gana el equipo que mejor sostiene la suya con flechas y cuentas. Si dos explicaciones están sostenidas, dilo: eso también es hacer física.", "Si un equipo entrega una sola hoja para los tres, el reto no cuenta. La discusión es compartida; el registro es individual.", "Cierra mostrando qué fuerza, qué julio o qué variable quedó por fuera en cada propuesta."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 1<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>El detector fuera del agua<\/h3><p>Un investigador sumerge un detector de sonido en agua para grabar los sonidos emitidos por los animales. El detector muestra la longitud de onda, la frecuencia, la velocidad de propagación y la distancia a la que se produce el sonido emitido por los animales. El investigador saca el detector del agua y registra un sonido.<\/p><\/div><div><p class=\"enun\">¿Cuál cambio de las variables mencionadas le permite asegurar al investigador que el sonido se trasmite por el aire y no por el agua?<\/p><div class=\"ops\" id=\"icf41\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>La longitud de onda.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>La frecuencia de la onda.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>La forma de la onda.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>La velocidad de la onda.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf41\" data-k=\"D\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la D.", "Por qué es la D: la frecuencia la pone el animal que hace el sonido y no cambia al pasar de un medio a otro (B no sirve). La rapidez la pone el medio: unos 1500 m/s en el agua y unos 340 m/s en el aire; si el detector marca unos 340 m/s, el sonido viajó por el aire (D). La longitud de onda también cambia (λ = v ÷ f), pero depende a la vez de la fuente y del medio, así que sola no identifica el medio (A). La forma de la onda (C) tampoco.", "La A es la trampa razonable: si la frecuencia no cambia y la rapidez sí, la longitud de onda cambia. Pero para reconocer el medio sirve la magnitud que depende solo del medio.", "Para cada magnitud, preguntar: ¿quién la pone, el animal o el agua?"]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 2<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>El farol visto desde el agua<\/h3><p>Los rayos de luz emitidos por objetos luminosos viajan en línea recta dentro de un mismo medio, como se muestra en la Figura 1. Si un rayo de luz pasa de aire a agua cambia su dirección, como se muestra en la Figura 2.<\/p><figure class=\"fig\"><svg viewBox=\"0 0 660 220\" role=\"img\" aria-label=\"Figura 1: piscina vacía, el rayo del farol llega recto al nadador. Figura 2: piscina llena, el rayo se dobla al entrar al agua\" style=\"font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif;max-width:660px;margin:0 auto\"><text x=\"10.0\" y=\"20.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"start\" font-weight=\"700\">Figura 1. Piscina vacía<\/text><rect x=\"10.0\" y=\"86.0\" width=\"70.0\" height=\"120.0\" rx=\"0\" fill=\"#6E7480\" stroke=\"#6E7480\" stroke-width=\"0\"/><line x1=\"45.0\" y1=\"46.0\" x2=\"45.0\" y2=\"104.0\" stroke=\"#1B1F27\" stroke-width=\"4\"/><circle cx=\"45.0\" cy=\"38.0\" r=\"9.0\" fill=\"#FFF4E0\" stroke=\"#1B1F27\" stroke-width=\"2\"/><line x1=\"58.0\" y1=\"38.0\" x2=\"65.0\" y2=\"38.0\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><line x1=\"54.2\" y1=\"47.2\" x2=\"59.1\" y2=\"52.1\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><line x1=\"45.0\" y1=\"51.0\" x2=\"45.0\" y2=\"58.0\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><line x1=\"35.8\" y1=\"47.2\" x2=\"30.9\" y2=\"52.1\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><line x1=\"32.0\" y1=\"38.0\" x2=\"25.0\" y2=\"38.0\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><line x1=\"35.8\" y1=\"28.8\" x2=\"30.9\" y2=\"23.9\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><line x1=\"45.0\" y1=\"25.0\" x2=\"45.0\" y2=\"18.0\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><line x1=\"54.2\" y1=\"28.8\" x2=\"59.1\" y2=\"23.9\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><text x=\"12.0\" y=\"80.0\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"start\">Farol<\/text><text x=\"110.0\" y=\"156.0\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"start\" font-weight=\"700\">Aire<\/text><line x1=\"80.0\" y1=\"86.0\" x2=\"80.0\" y2=\"206.0\" stroke=\"#1B1F27\" stroke-width=\"3\"/><line x1=\"80.0\" y1=\"206.0\" x2=\"310.0\" y2=\"206.0\" stroke=\"#1B1F27\" stroke-width=\"3\"/><line x1=\"310.0\" y1=\"86.0\" x2=\"310.0\" y2=\"206.0\" stroke=\"#1B1F27\" stroke-width=\"3\"/><circle cx=\"264.0\" cy=\"166.0\" r=\"11.0\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2.2\"/><text x=\"264.0\" y=\"196.0\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"middle\">Nadador<\/text><line x1=\"55.0\" y1=\"44.0\" x2=\"248.6\" y2=\"156.8\" stroke=\"#1B1F27\" stroke-width=\"2\"/><polygon points=\"254.0,160.0 245.1,159.0 248.7,152.7\" fill=\"#1B1F27\"/><text x=\"170.5\" y=\"88.0\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"start\">Rayo de luz<\/text><text x=\"350.0\" y=\"20.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"start\" font-weight=\"700\">Figura 2. Piscina llena de agua<\/text><rect x=\"350.0\" y=\"86.0\" width=\"70.0\" height=\"120.0\" rx=\"0\" fill=\"#6E7480\" stroke=\"#6E7480\" stroke-width=\"0\"/><line x1=\"385.0\" y1=\"46.0\" x2=\"385.0\" y2=\"104.0\" stroke=\"#1B1F27\" stroke-width=\"4\"/><circle cx=\"385.0\" cy=\"38.0\" r=\"9.0\" fill=\"#FFF4E0\" stroke=\"#1B1F27\" stroke-width=\"2\"/><line x1=\"398.0\" y1=\"38.0\" x2=\"405.0\" y2=\"38.0\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><line x1=\"394.2\" y1=\"47.2\" x2=\"399.1\" y2=\"52.1\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><line x1=\"385.0\" y1=\"51.0\" x2=\"385.0\" y2=\"58.0\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><line x1=\"375.8\" y1=\"47.2\" x2=\"370.9\" y2=\"52.1\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><line x1=\"372.0\" y1=\"38.0\" x2=\"365.0\" y2=\"38.0\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><line x1=\"375.8\" y1=\"28.8\" x2=\"370.9\" y2=\"23.9\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><line x1=\"385.0\" y1=\"25.0\" x2=\"385.0\" y2=\"18.0\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><line x1=\"394.2\" y1=\"28.8\" x2=\"399.1\" y2=\"23.9\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><text x=\"352.0\" y=\"80.0\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"start\">Farol<\/text><rect x=\"420.0\" y=\"88.0\" width=\"230.0\" height=\"118.0\" rx=\"0\" fill=\"#D7E4EF\" stroke=\"#D7E4EF\" stroke-width=\"0\"/><text x=\"434.0\" y=\"118.0\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"start\" font-weight=\"700\">Agua<\/text><text x=\"644.0\" y=\"76.0\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"end\" font-weight=\"700\">Aire<\/text><line x1=\"420.0\" y1=\"86.0\" x2=\"420.0\" y2=\"206.0\" stroke=\"#1B1F27\" stroke-width=\"3\"/><line x1=\"420.0\" y1=\"206.0\" x2=\"650.0\" y2=\"206.0\" stroke=\"#1B1F27\" stroke-width=\"3\"/><line x1=\"650.0\" y1=\"86.0\" x2=\"650.0\" y2=\"206.0\" stroke=\"#1B1F27\" stroke-width=\"3\"/><circle cx=\"604.0\" cy=\"166.0\" r=\"11.0\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2.2\"/><text x=\"604.0\" y=\"196.0\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"middle\">Nadador<\/text><line x1=\"395.0\" y1=\"44.0\" x2=\"528.0\" y2=\"86.1\" stroke=\"#1B1F27\" stroke-width=\"2\"/><polygon points=\"534.0,88.0 525.1,89.0 527.3,82.0\" fill=\"#1B1F27\"/><line x1=\"534.0\" y1=\"88.0\" x2=\"591.8\" y2=\"152.3\" stroke=\"#1B1F27\" stroke-width=\"2\"/><polygon points=\"596.0,157.0 587.8,153.3 593.2,148.4\" fill=\"#1B1F27\"/><text x=\"489.5\" y=\"51.0\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"start\">Rayo de luz<\/text><\/svg><\/figure><\/div><div><p class=\"enun\">Cuando una piscina está vacía, un nadador observa el farol que está en el borde, como se observa en la figura 1; luego, cuando se llena la piscina como se muestra en la figura 2, ¿cómo verá el nadador el farol?<\/p><div class=\"ops\" id=\"icf42\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>Más bajo.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>De la misma altura.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>Más alto.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Invertido.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf42\" data-k=\"C\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la C.", "Por qué es la C: con la piscina llena, la luz del farol entra al agua, va más lenta y se dobla acercándose a la normal: le llega al nadador más empinada que antes. El ojo no sabe que la luz se dobló: prolonga en línea recta el rayo que le llega, y esa recta apunta más arriba que el farol de verdad. Lo ve más alto (C). Para verlo más bajo (A) la luz tendría que doblarse al revés; de la misma altura (B), no doblarse; invertido (D) es lo que hace una lente, no una superficie plana de agua.", "Que prolonguen con una regla el último tramo del rayo de la figura 2 antes de mirar las opciones.", "Es lo mismo que pasa con una moneda en el fondo de un vaso, pero al revés: allá el ojo está en el aire y la moneda parece más cerca de la superficie."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 3<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Dos parlantes y una sola nota<\/h3><p>Un estudiante camina por el frente de dos parlantes ubicados afuera de la emisora del colegio. Dentro de la emisora la profesora de física toca la nota «do», en un clarinete, para ayudar al profesor de música a afinar algunos instrumentos musicales. El estudiante nota que hay lugares en donde el sonido del clarinete se escucha más fuerte mientras que en otros no, y los marca como se muestra en la siguiente figura.<\/p><figure class=\"fig\"><svg viewBox=\"0 0 640 210\" role=\"img\" aria-label=\"Dos parlantes frente a la emisora y puntos negros y blancos marcados por el estudiante\" style=\"font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif;max-width:640px;margin:0 auto\"><rect x=\"10.0\" y=\"6.0\" width=\"620.0\" height=\"196.0\" rx=\"0\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><rect x=\"12.0\" y=\"8.0\" width=\"616.0\" height=\"60.0\" rx=\"0\" fill=\"#EEF0F4\" stroke=\"#EEF0F4\" stroke-width=\"0\"/><text x=\"320.0\" y=\"44.0\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\">emisora del colegio<\/text><rect x=\"34.0\" y=\"34.0\" width=\"44.0\" height=\"64.0\" rx=\"4\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><circle cx=\"56.0\" cy=\"52.0\" r=\"9.0\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"2\"/><circle cx=\"56.0\" cy=\"78.0\" r=\"14.0\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"2\"/><rect x=\"562.0\" y=\"34.0\" width=\"44.0\" height=\"64.0\" rx=\"4\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><circle cx=\"584.0\" cy=\"52.0\" r=\"9.0\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"2\"/><circle cx=\"584.0\" cy=\"78.0\" r=\"14.0\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"2\"/><ellipse cx=\"198.8\" cy=\"113.8\" rx=\"11\" ry=\"6\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><ellipse cx=\"260.8\" cy=\"106.2\" rx=\"11\" ry=\"6\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><ellipse cx=\"322.8\" cy=\"101.2\" rx=\"11\" ry=\"6\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><ellipse cx=\"384.8\" cy=\"106.2\" rx=\"11\" ry=\"6\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><ellipse cx=\"446.8\" cy=\"113.8\" rx=\"11\" ry=\"6\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><ellipse cx=\"161.6\" cy=\"145.3\" rx=\"11\" ry=\"6\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><ellipse cx=\"229.8\" cy=\"139.0\" rx=\"11\" ry=\"6\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><ellipse cx=\"291.8\" cy=\"134.0\" rx=\"11\" ry=\"6\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><ellipse cx=\"353.8\" cy=\"132.7\" rx=\"11\" ry=\"6\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><ellipse cx=\"415.8\" cy=\"134.0\" rx=\"11\" ry=\"6\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><ellipse cx=\"477.8\" cy=\"141.5\" rx=\"11\" ry=\"6\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><ellipse cx=\"186.4\" cy=\"176.8\" rx=\"11\" ry=\"6\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><ellipse cx=\"254.6\" cy=\"170.5\" rx=\"11\" ry=\"6\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><ellipse cx=\"322.8\" cy=\"166.7\" rx=\"11\" ry=\"6\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><ellipse cx=\"391.0\" cy=\"169.2\" rx=\"11\" ry=\"6\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><ellipse cx=\"459.2\" cy=\"176.8\" rx=\"11\" ry=\"6\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><circle cx=\"580.0\" cy=\"154.0\" r=\"20.0\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><text x=\"580.0\" y=\"162.0\" font-size=\"22\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">?<\/text><text x=\"580.0\" y=\"192.0\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"middle\">estudiante<\/text><\/svg><\/figure><\/div><div><p class=\"enun\">Si el estudiante le pregunta a la profesora la razón por la cual en los puntos negros el sonido se escucha más fuerte que en los blancos, ¿cuál de las siguientes argumentaciones debe darle la profesora al estudiante?<\/p><div class=\"ops\" id=\"icf43\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>Porque las ondas de sonido interfieren constructivamente en los puntos negros, y en los puntos blancos se reflejan.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>Porque las ondas de sonido interfieren constructivamente y destructivamente en todos los puntos, pero en los blancos las ondas se refractan.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>Porque las ondas de sonido interfieren constructivamente en los puntos negros, y destructivamente, en los puntos blancos.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Porque las ondas de sonido interfieren destructivamente en los puntos blancos y negros, pero en los negros se reflejan y se refractan.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf43\" data-k=\"C\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la C.", "Por qué es la C: los dos parlantes emiten la misma nota, y a cada punto llegan dos ondas. Donde llegan cresta con cresta se suman (interferencia constructiva: sonido fuerte, los puntos negros); donde llegan cresta con valle se anulan (destructiva: sonido débil, los puntos blancos). Eso dice la C. A y D meten reflexión o refracción, que no explican puntos fuertes y débiles alternados; B dice que en todos los puntos pasan las dos cosas a la vez.", "La pista está en el patrón: fuerte, débil, fuerte, débil, a distancias regulares. Eso lo hacen dos ondas que se suman.", "Con un solo parlante no habría puntos blancos: hacen falta las dos fuentes."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 4<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>La tabla del sonido y sus gráficas<\/h3><p>Una estudiante realizó un experimento para medir la velocidad de propagación del sonido en el aire a diferentes temperaturas. Los resultados que obtuvo se muestran en la siguiente tabla.<\/p><figure class=\"fig\"><table class=\"tabla\" style=\"max-width:460px\"><thead><tr><th>Temperatura (°C)<\/th><th>Velocidad del sonido (m/s)<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>331,7<\/td><\/tr><tr><td>1<\/td><td>332,3<\/td><\/tr><tr><td>2<\/td><td>332,9<\/td><\/tr><tr><td>3<\/td><td>333,5<\/td><\/tr><\/tbody><\/table><\/figure><\/div><div><p class=\"enun\">¿Cuál de las siguientes gráficas muestra los resultados del experimento?<\/p><div class=\"opsfig\"><figure class=\"fig\"><svg viewBox=\"0 0 580 425\" role=\"img\" aria-label=\"Cuatro gráficas, A a D, de velocidad del sonido y temperatura\" style=\"font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif;max-width:510px;margin:0 auto\"><circle cx=\"16.0\" cy=\"18.0\" r=\"13.0\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><text x=\"16.0\" y=\"23.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">A<\/text><line x1=\"110.0\" y1=\"150.0\" x2=\"270.0\" y2=\"150.0\" stroke=\"#E1E5EB\" stroke-width=\"1.2\"/><line x1=\"110.0\" y1=\"30.0\" x2=\"110.0\" y2=\"150.0\" stroke=\"#E1E5EB\" stroke-width=\"1.2\"/><text x=\"104.0\" y=\"155.0\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"end\">331,7<\/text><text x=\"110.0\" y=\"168.0\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"middle\">0<\/text><line x1=\"110.0\" y1=\"110.0\" x2=\"270.0\" y2=\"110.0\" stroke=\" 4.5\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"0\"/><circle cx=\"506.7\" cy=\"285.0\" r=\"4.5\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"0\"/><circle cx=\"560.0\" cy=\"245.0\" r=\"4.5\" fill=\"#1B1F27\" stroke=\"#1B1F27\" stroke-width=\"0\"/><text x=\"480.0\" y=\"405.0\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">Temperatura (°C)<\/text><text x=\"318.0\" y=\"305.0\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\" transform=\"rotate(-90 318.0 305.0)\">Velocidad del<\/text><text x=\"334.0\" y=\"305.0\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\" transform=\"rotate(-90 334.0 305.0)\">sonido (m/s)<\/text><\/svg><\/figure><\/div><div class=\"ops cuatro\" id=\"icf44\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>La gráfica A.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>La gráfica B.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>La gráfica C.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>La gráfica D.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf44\" data-k=\"B\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la B.", "Por qué es la B: lo que la estudiante cambió (la temperatura) va en el eje horizontal y lo que midió (la velocidad) en el vertical, cada uno con su escala creciente: de 0 a 3 °C y de 331,7 a 333,5 m/s. Cada grado, la velocidad sube 0,6 m/s: una recta que sube. Esa es la gráfica B. A tiene los rótulos de los ejes intercambiados (dice «temperatura» junto a los números de la velocidad); C pone la velocidad abajo con su escala al revés, de 333,5 a 331,7, y D además cambia los rótulos de lugar.", "Primero qué variable va en cada eje y hacia dónde crece su escala; después la forma de la línea.", "La escala de la velocidad no empieza en cero, empieza en 331,7. No está mal, pero hay que leerla. ---"]}}, {"m": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m6)\">Cierre<\/span><span class=\"kicker\">La pregunta de siempre<\/span><\/div><h2>¿En qué se parecía la pregunta tipo Saber 11 a la de tu libro?<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:#242478\"><div class=\"k\">1<\/div><div><b>La fuente pone la frecuencia<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#A82424\"><div class=\"k\">2<\/div><div><b>Dibújalo antes de elegir<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#5B3E96\"><div class=\"k\">3<\/div><div><b>Concluye solo lo observado<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#C9821B\"><div class=\"k\">4<\/div><div><b>Lee la tabla y su escala<\/b><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--m6)\"><h3>Antes de salir<\/h3><ol class=\"pasos\"><li>El concepto del día —una ley, una magnitud o una relación—, en «Palabras que me frenaron», con tus palabras.<\/li><li>«Lo que me llevo de esta pregunta».<\/li><li>Tu carita de salida.<\/li><li>La clase 4 de la portada del área, con la causa que encontraste.<\/li><\/ol><\/div><\/div>", "guia": {"obj": "Que el estudiante nombre la estrategia que usó y se lleve un concepto del día —una ley, una magnitud o una relación— escrito en sus propias palabras.", "decir": ["Socializa solo las preguntas que el grupo falló, pidiendo la flecha o la cuenta que las resuelve.", "Pide que lean en voz alta su salvavidas: lo mínimo que sí tenían claro.", "Cada uno escribe el concepto del día en «Palabras que me frenaron» y la causa que encontró en la portada del área."], "como": "No dicta la definición ni la fórmula. El concepto se escribe como el estudiante lo entendió; si quedó mal entendido, eso se ve en la hoja y se corrige la próxima clase.", "apoyo": ["El concepto del día no se dicta. Si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase: es mejor que dictarla bien.", "Para el cierre del momento: El repaso del libro (página 236) dice que en el caucho la onda llega tarde «por su absorción». Cierra corrigiéndolo: llega tarde porque el caucho es blando, poco rígido."]}}];
var MOM = [{"n": 1, "nom": "Activación", "min": 15, "c": "--m1"}, {"n": 2, "nom": "Pregunta problematizadora", "min": 20, "c": "--m2"}, {"n": 3, "nom": "Desarrollo guiado", "min": 35, "c": "--m3"}, {"n": 4, "nom": "Reto en equipo", "min": 20, "c": "--m4"}, {"n": 5, "nom": "Evaluación individual", "min": 20, "c": "--m5"}, {"n": 6, "nom": "Cierre", "min": 10, "c": "--m6"}];
var NOMBRE = document.getElementById("momnom").textContent, SUB = document.getElementById("momsub").textContent;
var $ = function(s){ return document.querySelector(s); };
var wrap = $("#wrap"), stage = $("#stage"), i = 0;
var tBase = 0, tLeft = 0, tOn = false, tick = null;
var elegidas = [];
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function paintClock(){
  var n = $("#tnum");
  if(!tBase){ n.textContent = "—"; n.classList.remove("over"); return; }
  var s = Math.abs(tLeft), mm = Math.floor(s/60), ss = s%60;
  n.textContent = (tLeft<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", tLeft<0);
}
function setTimer(min){
  tBase = min||0; tLeft = tBase*60; tOn = false;
  if(tick){ clearInterval(tick); tick = null; }
  $("#play").textContent = "Iniciar"; paintClock();
}
function toggleTimer(){
  if(!tBase) return;
  tOn = !tOn; $("#play").textContent = tOn ? "Pausar" : "Seguir";
  if(tick){ clearInterval(tick); tick = null; }
  if(tOn) tick = setInterval(function(){ tLeft--; paintClock(); }, 1000);
  paintClock();
}
function guiaHTML(g){
  if(!g) return '<p class="sub">Sin notas para esta diapositiva.</p>';
  var h = '<div class="gbox"><h4>Objetivo</h4><p>'+esc(g.obj)+'</p></div>';
  if(g.decir && g.decir.length) h += '<div class="gbox"><h4>Qué haces y qué dices</h4><ul>'+
     g.decir.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  if(g.como) h += '<div class="gbox como"><h4>Lo que no haces</h4><p>'+esc(g.como)+'</p></div>';
  if(g.apoyo && g.apoyo.length) h += '<div class="gbox apoyo"><h4>Si Física no es tu fuerte</h4><ul>'+
     g.apoyo.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  return h;
}
function pintaElegidas(){
  var box = document.getElementById("elegidas"); if(!box) return;
  if(!elegidas.length){ box.innerHTML = '<p class="sub">Vuelve a la diapositiva anterior y escoge las cinco.</p>'; return; }
  box.innerHTML = elegidas.map(function(t,k){
    return '<div class="card edge" style="--accent:var(--m'+((k%6)+1)+')"><h3>'+(k+1)+'. '+esc(t)+'</h3>'+
      '<p class="sub">Busca esta pregunta en tu simulacro y en la hoja de taller de la misma estrategia.</p></div>';
  }).join("");
}
function go(n){
  var prev = SC[i];
  i = Math.max(0, Math.min(SC.length-1, n));
  var s = SC[i];
  wrap.innerHTML = s.html;
  wrap.classList.remove("enter"); void wrap.offsetWidth; wrap.classList.add("enter");
  stage.scrollTop = 0;
  var m = s.m!=null ? MOM[s.m] : null;
  $("#momdot").style.background = m ? "var("+m.c+")" : "var(--faint)";
  $("#momdot").textContent = m ? m.n : "·";
  $("#momnom").textContent = m ? m.nom : NOMBRE;
  $("#momsub").textContent = m ? (m.min+" minutos") : SUB;
  var want = s.min!=null ? s.min : (m ? m.min : 0);
  var cambio = !prev || prev===s || prev.m!==s.m || (prev.min||null)!==(s.min||null);
  if(cambio) setTimer(want);
  $("#count").textContent = (i+1)+" / "+SC.length;
  $("#prog i").style.width = (SC.length>1 ? i/(SC.length-1)*100 : 100)+"%";
  $("#guiabody").innerHTML = guiaHTML(s.guia);
  [].forEach.call(wrap.querySelectorAll("[data-pick]"), function(b){
    b.setAttribute("aria-pressed", elegidas.indexOf(b.textContent)>=0 ? "true" : "false"); });
  pintaElegidas();
}
wrap.addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.dataset.show){ var t = document.getElementById(b.dataset.show); if(t) t.hidden = !t.hidden; }
  if(b.dataset.showgrupo){
    var g = wrap.querySelectorAll('[data-grupo="'+b.dataset.showgrupo+'"]'), abrir = g.length && g[0].hidden;
    [].forEach.call(g, function(x){ x.hidden = !abrir; });
    b.textContent = abrir ? "Ocultar las claves" : "Revelar las claves";
  }
  if(b.dataset.clave){
    var box = document.getElementById(b.dataset.clave), ok = box.querySelector('[data-op="'+b.dataset.k+'"]');
    var on = ok && !ok.classList.contains("ok");
    [].forEach.call(box.querySelectorAll(".op"), function(o){ o.classList.remove("ok"); });
    if(on) ok.classList.add("ok");
    b.textContent = on ? "Ocultar la clave" : "Revelar la clave";
  }
  if(b.dataset.tally){ var n = document.getElementById(b.dataset.tally); n.textContent = (+n.textContent||0)+1; }
  if(b.dataset.reset){ [].forEach.call(wrap.querySelectorAll('[id^="'+b.dataset.reset+'"]'), function(x){
    if(x.classList.contains("n")) x.textContent = "0"; }); }
  if(b.dataset.pick!=null){
    var t = b.textContent, k = elegidas.indexOf(t);
    if(k>=0) elegidas.splice(k,1); else if(elegidas.length<5) elegidas.push(t);
    b.setAttribute("aria-pressed", elegidas.indexOf(t)>=0 ? "true" : "false");
  }
});
function setGuia(on){ $("#guia").classList.toggle("open", on); $("#scrim").classList.toggle("on", on);
  $("#gbtn").setAttribute("aria-pressed", on ? "true" : "false"); }
$("#next").addEventListener("click", function(){ go(i+1); });
$("#prev").addEventListener("click", function(){ go(i-1); });
$("#play").addEventListener("click", toggleTimer);
$("#reset").addEventListener("click", function(){ setTimer(tBase); });
$("#gbtn").addEventListener("click", function(){ setGuia(!$("#guia").classList.contains("open")); });
$("#gclose").addEventListener("click", function(){ setGuia(false); });
$("#scrim").addEventListener("click", function(){ setGuia(false); });
document.addEventListener("keydown", function(e){
  var t = e.target.tagName; if(t==="INPUT"||t==="TEXTAREA") return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ go(i+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ go(i-1); e.preventDefault(); }
  else if(e.key==="Home"){ go(0); e.preventDefault(); }
  else if(e.key==="End"){ go(SC.length-1); e.preventDefault(); }
  else if(e.key==="g"||e.key==="G"){ setGuia(!$("#guia").classList.contains("open")); }
  else if(e.key==="t"||e.key==="T"){ toggleTimer(); }
  else if(e.key==="Escape"){ setGuia(false); }
});
go(0);
})();
</script>
