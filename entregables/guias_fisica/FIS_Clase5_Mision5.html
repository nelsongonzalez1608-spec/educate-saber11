<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Física · Clase 5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>[hidden]{display:none!important}
:root{
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --text:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --area:#5C7A1E; --azul:#1F4E8C; --oro:#B0711A; --morado:#5B3E96; --verde:#2E7A39;
  --m1:#5C7A1E; --m2:#1F4E8C; --m3:#3B3BA6; --m4:#5B3E96; --m5:#A82424; --m6:#4A5A70; --rojo:#A82424;
  --ink:#1B1F27; --muted:#5C6472; --faint:#A9B0BB; --line:#E3E7ED; --paper:#FFFFFF; --bg:#F6F4F1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:clamp(16px,1.25vw,21px);line-height:1.5}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
#top{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding:10px clamp(14px,2vw,28px);background:var(--paper);flex-wrap:wrap}
.logo img{height:clamp(28px,2.6vw,40px);display:block}
#mom{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
#momdot{width:clamp(30px,2.4vw,40px);height:clamp(30px,2.4vw,40px);border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;background:var(--faint)}
#momnom{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.2vw,20px)}
#momsub{color:var(--muted);font-size:.85em}
#clock{display:flex;align-items:center;gap:8px}
#tnum{font-family:var(--display);font-weight:800;font-size:clamp(20px,1.8vw,30px);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
#tnum.over{color:var(--area)}
.btn{appearance:none;font:inherit;font-size:.86em;font-weight:600;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.solid{background:var(--area);border-color:var(--area);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#stage{overflow:auto;padding:clamp(18px,3vw,48px) clamp(16px,4vw,72px)}
#wrap{max-width:1500px;margin:0 auto}
#wrap.enter{animation:ent .28s ease-out}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bot{display:flex;align-items:center;gap:12px;padding:10px clamp(14px,2vw,28px);background:var(--paper)}
#prog{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
#prog i{display:block;height:100%;background:var(--area);transition:width .25s}
#count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
#hint{color:var(--faint);font-size:.8em}
@media (max-width:760px){#hint{display:none}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.2vw,68px);line-height:1.05;margin:.2em 0 .25em;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,2.8vw,46px);line-height:1.1;margin:.25em 0 .3em;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:clamp(18px,1.5vw,26px);margin:.1em 0 .4em;line-height:1.2}
p{margin:.35em 0 .6em}
.lead{font-size:1.2em;line-height:1.45;max-width:70ch}
.sub{color:var(--muted)}
.mt{margin-top:clamp(14px,1.8vw,26px)}
.logo-xl img{height:clamp(54px,6vw,96px);margin-bottom:12px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tag,.min,.membrete{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.78em;font-weight:700;letter-spacing:.02em}
.tag{background:var(--ink);color:#fff}
.min{background:var(--accent,var(--area));color:#fff}
.membrete{border:1.5px solid var(--line);color:var(--muted)}
.kicker{color:var(--muted);font-size:.85em;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.grid{display:grid;gap:clamp(12px,1.4vw,22px)}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid>*{min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,1.6vw,24px)}
.card.edge{border-left:6px solid var(--accent,var(--area))}
.card.big .lead{font-size:1.3em}
.step{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px}
.step .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;flex:none}
.note{border-left:5px solid var(--accent,var(--area));background:var(--paper);border-radius:10px;padding:10px 16px;margin-top:12px}
.cita{font-family:var(--display);font-weight:600;line-height:1.35;background:var(--paper);border-left:6px solid var(--area);border-radius:12px;padding:clamp(16px,2vw,30px);margin:18px 0}
.cita.xl{font-size:clamp(24px,2.6vw,44px)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally .n{display:inline-block;min-width:1.6em;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.pasos{margin:.2em 0 0;padding-left:1.3em}.pasos li{margin:.3em 0}
.sello{margin-top:12px;border:2px dashed var(--oro);border-radius:12px;padding:10px 14px;background:#FDF6EA}
.sello b{display:block;color:var(--oro);font-size:.8em;letter-spacing:.06em;text-transform:uppercase}
.clave{margin-top:12px;display:flex;align-items:center;gap:10px;font-weight:600}
.keychip{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:10px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.2em}
.aviso{margin-top:10px;border-radius:10px;padding:10px 14px;background:#FBEFEF;border-left:5px solid var(--area);font-size:.92em}
.aviso.sev-aten{background:#EDF5EE;border-left-color:var(--verde)}
.aviso.sev-medi{background:#FDF5E7;border-left-color:var(--oro)}
.icfes .texto{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.6vw,24px);max-height:62vh;overflow:auto;font-size:.95em}
.enun{font-weight:600;font-size:1.08em}
.ops{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.op .L{flex:none;width:1.8em;height:1.8em;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-family:var(--display);font-weight:800}
.op.ok{border-color:var(--verde);background:#EDF5EE}.op.ok .L{background:var(--verde);color:#fff}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick[aria-pressed="true"]{background:var(--area);border-color:var(--area);color:#fff}
#scrim{position:fixed;inset:0;background:rgba(15,18,24,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#guia{position:fixed;top:0;right:0;height:100%;width:min(520px,92vw);background:var(--paper);box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column;z-index:10}
#guia.open{transform:none}
#guiahead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg)}
#guiabody{overflow:auto;padding:16px 20px 30px;font-size:.92em}
.gbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.gbox h4{margin:0 0 6px;font-family:var(--display);font-size:.8em;letter-spacing:.07em;text-transform:uppercase;color:var(--area)}
.gbox ul{margin:0;padding-left:1.1em}.gbox li{margin:.35em 0}
.gbox.como{background:#F6F7F9}.gbox.como h4{color:var(--muted)}
.gbox.apoyo{background:#FDF6EA;border-color:#EAD9B4}.gbox.apoyo h4{color:var(--oro)}
.examen{background:var(--paper);border:1px solid var(--line);border-left:8px solid var(--area);border-radius:22px;padding:clamp(16px,2.4vw,40px);margin-top:clamp(12px,1.6vw,24px);text-align:center}
.relojxl{font-family:var(--display);font-weight:800;font-size:clamp(96px,17vw,280px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.relojxl.over{color:var(--area)}
.exhoras{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 36px;color:var(--muted);font-size:1.15em;margin-top:10px}
.exhoras b{color:var(--ink);font-variant-numeric:tabular-nums}
.nbig{font-family:var(--display);font-weight:800;font-size:clamp(40px,4vw,64px);line-height:1;color:var(--accent,var(--area))}
.asig{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:8px 0}
.asig .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;flex:none}
.asig label{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted)}
.asig label.w{flex:1;min-width:min(100%,260px)}
.campo{font:inherit;font-size:1.1em;font-weight:700;color:var(--ink);border:none;border-bottom:2px dashed var(--faint);background:transparent;padding:4px 6px;min-width:0;flex:1;outline:none}
.campo.n{width:4.5em;flex:none;text-align:center}
.campo:focus{border-bottom-color:var(--area)}
.nums1{border:1.5px solid var(--line);border-radius:999px;padding:3px 14px;background:var(--paper);font-weight:600;color:var(--muted)}
.nums1 b{color:var(--ink)}
.pides{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:1.08em}
.pide{display:inline-flex;align-items:center;gap:8px}
.chk{display:inline-block;width:20px;height:20px;border:2px solid var(--area);border-radius:4px;background:#fff;flex:none}
.herrs{display:grid;gap:clamp(12px,1.4vw,22px);grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.herr{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--area);border-radius:16px;padding:14px 18px;font-size:1.12em}
.herr svg{flex:none}

.cv-voc{display:grid;gap:clamp(10px,1.2vw,18px);grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));margin-top:clamp(14px,1.8vw,26px)}
.cv-voc div{background:#fff;border:1.5px solid var(--line);border-top:5px solid var(--acc,var(--area));border-radius:14px;padding:12px 16px;box-shadow:4px 4px 0 rgba(30,34,48,.08)}
.cv-voc b{display:block;font-family:var(--display);font-size:1.18em;color:var(--ink)}
.cv-voc span{color:var(--muted)}
.cv-voc.tapar span{visibility:hidden}
.cv-mapa{position:relative;display:grid;gap:clamp(14px,2vw,34px);grid-template-columns:1fr 1.1fr 1fr;grid-template-areas:"a . b" ". c ." "d . e";margin-top:clamp(12px,1.6vw,22px)}
.cv-mapa>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cv-nodo{font:inherit;text-align:left;cursor:pointer;background:#fff;border:2px solid var(--acc);border-radius:16px;padding:12px 16px;box-shadow:6px 6px 0 var(--acc);transition:transform .15s, box-shadow .15s;position:relative}
.cv-nodo:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--acc)}
.cv-nodo .n{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--acc);color:#fff;font-family:var(--display);font-weight:800;margin-right:8px}
.cv-nodo b{font-family:var(--display);font-size:1.12em}
.cv-nodo small{display:block;color:var(--muted);font-size:.9em;margin-top:4px}
.cv-centro{grid-area:c;text-align:center;border-width:3px}
.cv-centro b{font-size:1.35em;color:var(--acc)}
.cv-det{margin-top:clamp(14px,1.8vw,26px);display:grid;gap:clamp(14px,2vw,30px);grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:center;background:#fff;border:1.5px solid var(--line);border-left:6px solid var(--acc);border-radius:18px;padding:clamp(14px,1.8vw,28px)}
.cv-det svg{width:100%;height:auto;max-height:52vh}
.cv-mapa[hidden],.cv-det[hidden]{display:none}
.cv-det h3{color:var(--acc)}
.cv-f{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:1.12em;border:2px dashed var(--acc);border-radius:10px;padding:4px 12px;margin:4px 0 8px}
.cv-ej{color:var(--muted)}
.cv-ojo{margin-top:8px;padding-left:12px;border-left:4px solid var(--oro)}
.cv-ojo b{color:var(--oro)}
#wrap{position:relative}
.cv-motivo{position:absolute;top:-6px;right:0;width:clamp(110px,13vw,220px);opacity:.22;pointer-events:none;z-index:0}
.cv-motivo svg{width:100%;height:auto;display:block}
.cv-motivo~*{position:relative;z-index:1}
@media (max-width:760px){.cv-motivo{display:none}}
@media (max-width:760px){.cv-mapa{grid-template-columns:1fr;grid-template-areas:"c" "a" "b" "d" "e"}.cv-mapa>svg{display:none}.cv-det{grid-template-columns:1fr}}
[hidden]{display:none!important}
.fig{margin:12px 0}.fig svg{display:block;width:100%;max-width:760px;height:auto}
.tabla{border-collapse:collapse;width:100%;table-layout:fixed;font-size:.86em;line-height:1.35;margin:0 auto}
.tabla th,.tabla td{border:1px solid var(--line);padding:5px 8px;vertical-align:top;overflow-wrap:anywhere}
.tabla th{background:#F2F4EE;text-align:left}.fig figcaption{font-size:.85em;font-style:italic;color:var(--muted)}
.ops.cuatro{grid-template-columns:repeat(4,1fr)}.ops.cuatro .op{padding:8px 10px;gap:8px;font-size:.92em;align-items:center}
.derfig .fig{margin:0 0 10px}.opsfig{background:var(--paper);border:1px solid var(--line);
border-radius:14px;padding:8px 10px;margin-top:10px}.opsfig .fig{margin:0}
.aviso{border-left-color:var(--rojo)}.aviso.sev-baja{background:#EEF3FA;border-left-color:var(--azul)}
</style>
</head>

ooOZl6P5dabA4mI5HM13Lq+xVzUqFalRgfEgBzr7O9i0Rw/kede9N6plfUrargOrncxULm1CgK9EN4S3ou5ANCqx2q+ffo9wUzHbDcvSYxnPRdw4HDMx2QN272aBaJtUzRosAVZRXCriZx7RU2+Pm8S7tZpo0XFOo78lc97J7nULaYPN6WdtgauvUOeZnMGVtsH394/WMAP8fxF+lKXgx3PUAAAAASUVORK5CYII=\" alt=\"EDUCATE · Para el Saber\"><\/div><div class=\"eyebrow\"><span class=\"tag\">Clase 5 de 8<\/span><span class=\"kicker\">Física · Componente Mecánica clásica<\/span><\/div><h1>La energía que sube, corre y se escapa<\/h1><p class=\"lead\">Un dron, un sifón, un reloj en órbita. Hoy cada magnitud va con su fórmula y su unidad, y ninguna fuerza se queda sin decir quién la hace.<\/p><div class=\"grid c3 mt\"><div class=\"card edge\" style=\"--accent:var(--m1)\"><h3>Tu libro<\/h3><p class=\"sub\">Las diez preguntas de la prueba de campo, páginas 247 a 250<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m4)\"><h3>Tu cuaderno<\/h3><p class=\"sub\">Páginas 293 a 299<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m6)\"><h3>Hoy<\/h3><p class=\"sub\">120 minutos · 6 momentos · UC, EF e IN · energía, fuerzas y control<\/p><\/div><\/div>", "guia": {"obj": "Que el grupo sepa desde el primer minuto qué va a pasar en estos 120 minutos y qué tiene que tener sobre la mesa.", "decir": ["«Libro abierto, cuaderno cerrado, lápiz. Hoy nadie me va a decir la fórmula de memoria: me van a mostrar la flecha o el julio que explica lo que pasa.»"], "apoyo": ["⚑ Antes del sábado: La pregunta 8 tiene dos valoraciones defendibles (A y D) y la 1 dice que el astronauta «pesa 80 kg». La 3 pide un concepto que el estudiante no trae, la relatividad general: es un sello.", "Seguridad de las dinámicas: La mochila de «¿Trabaja o no trabaja?» es liviana y se sube despacio. El carrito de la rampa rueda solo: no se lanza.", "Del libro, para ti: Dice que el sifón funciona si la salida está más baja que el nivel inicial; es el nivel que tenga el agua de arriba en cada momento. No afecta ninguna clave.", "Del libro, para ti: La D sale una sola vez (pregunta 9). Reportado a la editorial. No lo digas en clase.", "Los cuatro conceptos que tienes que poder explicar hoy en dos minutos, sin jerga. Si un estudiante sabe más que tú de un tema, déjalo explicar y pide que lo muestre con una flecha o con una cuenta con unidades:", "Energía potencial y cinética: Ep = m · g · h, con la masa en kg, g ≈ 10 m/s² en la Tierra y la altura en m: da julios (J). Ec = ½ · m · v²: con el doble de rapidez, cuatro veces la energía. La mecánica es la suma de las dos.", "Trabajo: W = F · d · cos θ. Sostener algo quieto cansa, pero no hace trabajo sobre el objeto: no hay desplazamiento. Una fuerza trabaja si empuja, al menos en parte, en la dirección del movimiento.", "Momento y fuerza: El momento es p = m · v, en kg·m/s. El cambio del momento en un choque es la fuerza por el tiempo que dura el empujón: si los choques duran lo mismo, cambia más el momento donde la fuerza fue mayor.", "Presión atmosférica y sifón: El aire empuja sobre todo lo que toca, unos 10 N por cm² al nivel del mar. En el sifón, ese empuje sube el agua por el tramo corto y el peso de la columna larga la hace bajar.", "Abre esta guía con la tecla G en cada diapositiva: trae lo que dices y, debajo, lo que necesitas saber si Física no es tu área.", "El cronómetro arranca con T y se reinicia solo cuando cambia el momento de la clase."]}}, {"m": null, "html": "<div class=\"eyebrow\"><span class=\"kicker\">Así vamos a trabajar<\/span><\/div><h2>Seis momentos, una sola regla<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:var(--m1)\"><div class=\"k\">1<\/div><div><b>Activación<\/b><span class=\"sub\"> · 15 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m2)\"><div class=\"k\">2<\/div><div><b>Pregunta problematizadora<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m3)\"><div class=\"k\">3<\/div><div><b>Desarrollo guiado<\/b><span class=\"sub\"> · 35 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m4)\"><div class=\"k\">4<\/div><div><b>Reto en equipo<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m5)\"><div class=\"k\">5<\/div><div><b>Evaluación individual<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m6)\"><div class=\"k\">6<\/div><div><b>Cierre<\/b><span class=\"sub\"> · 10 min<\/span><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--area)\"><h3>La regla del cuaderno<\/h3><p class=\"lead\">Si el instrumento está vacío, no lo resolviste: lo adivinaste.<\/p><p>Primero se hace el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento—, después se marca la opción. Una respuesta correcta con el instrumento en blanco no cuenta como resuelta.<\/p><\/div><\/div>", "guia": {"obj": "Que la regla quede dicha en voz alta antes de cualquier texto.", "decir": ["«La respuesta correcta con el instrumento vacío no cuenta. ¿Por qué? Porque en Física casi todas las opciones usan palabras técnicas: el que no dibujó la flecha ni hizo la cuenta escoge la que suena mejor, no la que es.»"], "apoyo": ["Si alguien pregunta para qué dibujar, la respuesta corta es: lo que separa la opción correcta de las que suenan bien está en el sentido de una flecha, en un signo o en una unidad, y eso se pierde si no se escribe.", "Si alguien dice «es por la gravedad» o «es la energía», devuélvele la pregunta: «¿quién empuja a quién, y hacia dónde?»."]}}, {"m": 0, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Activación<\/span><span class=\"kicker\">Cuaderno cerrado<\/span><\/div><h2>¿Qué cambió y qué lo causó?<\/h2><blockquote class=\"cita xl\">Para subir una loma en bicicleta hay que pedalear duro y uno suda; para bajarla, sin pedalear, la bicicleta acelera sola.<\/blockquote><p class=\"lead\">Dos respuestas antes de cualquier fórmula. Todavía no se abre el cuaderno.<\/p><div class=\"ctl\"><button class=\"btn\" data-show=\"pista5\">Mostrar la pista<\/button><\/div><div class=\"note\" id=\"pista5\" hidden style=\"--accent:var(--m1)\"><b>Pista:<\/b> subiendo, la energía de la comida se vuelve altura (y calor del cuerpo); bajando, la altura se vuelve rapidez. Ningún julio aparece ni desaparece<\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno corto diciendo qué cambió y qué lo causó —qué fuerza, qué calor, qué carga— antes de explicarlo con fórmulas y antes de ver cualquier opción.", "decir": ["Proyecta o lee una observación de dos o tres renglones sin decir de dónde salió.", "Pide dos respuestas, en voz alta o en el tablero: qué cambió y qué lo causó, dicho como una flecha con nombre («el piso frena…», «el calor va de… a…»).", "Ejecuta la dinámica de apertura según la estrategia del encuentro."], "como": "No explica el fenómeno ni acepta todavía fórmulas. Si alguien dice «es por la gravedad» o «es la energía», le devuelve la pregunta: «¿quién empuja a quién, y hacia dónde?». El cuaderno sigue cerrado.", "apoyo": ["No expliques el fenómeno ni aceptes todavía fórmulas: primero qué cambió y qué lo causó, dicho como una flecha con nombre. La observación es inventada para la clase: no sale del libro.", "La pista existe para el cierre de los 15 minutos, no para el principio: subiendo, la energía de la comida se vuelve altura (y calor del cuerpo); bajando, la altura se vuelve rapidez. Ningún julio aparece ni desaparece."]}}, {"m": 0, "min": 3, "html": "<div class=\"cv-motivo\"><svg viewBox=\"0 0 320 320\" aria-hidden=\"true\"><g fill=\"none\" stroke=\"#5C7A1E\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><ellipse cx=\"110\" cy=\"110\" rx=\"90\" ry=\"32\"/><ellipse cx=\"110\" cy=\"110\" rx=\"90\" ry=\"32\" transform=\"rotate(60 110 110)\"/><ellipse cx=\"110\" cy=\"110\" rx=\"90\" ry=\"32\" transform=\"rotate(-60 110 110)\"/><circle cx=\"110\" cy=\"110\" r=\"10\"/><path d=\"M190 240 L300 240 M245 240 L245 236\" stroke-width=\"3\"/><path d=\"M220 40 L290 40 M255 40 L215 200\"/><circle cx=\"210\" cy=\"215\" r=\"16\"/><path d=\"M255 40 L255 190\" stroke-dasharray=\"6 8\" stroke-width=\"2\"/><path d=\"M222 192 Q255 210 288 192\" stroke-dasharray=\"4 7\" stroke-width=\"2\"/><\/g><\/svg><\/div><div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Conceptualización · 3 min<\/span><span class=\"kicker\">Las palabras de hoy<\/span><\/div><h2>9 palabras para esta clase<\/h2><div class=\"cv-voc\" id=\"voc5\"><div style=\"--acc:#242478\"><b>Energía potencial<\/b><span>energía por la altura: m · g · h<\/span><\/div><div style=\"--acc:#A82424\"><b>Energía cinética<\/b><span>energía por la rapidez: ½ · m · v²<\/span><\/div><div style=\"--acc:#5B3E96\"><b>Energía mecánica<\/b><span>potencial más cinética<\/span><\/div><div style=\"--acc:#C9821B\"><b>Julio (J)<\/b><span>la unidad de energía y de trabajo<\/span><\/div><div style=\"--acc:#242478\"><b>Trabajo<\/b><span>fuerza a lo largo de un desplazamiento<\/span><\/div><div style=\"--acc:#A82424\"><b>Desplazamiento<\/b><span>cuánto y hacia dónde se movió<\/span><\/div><div style=\"--acc:#5B3E96\"><b>Momento<\/b><span>masa por velocidad: p = m · v<\/span><\/div><div style=\"--acc:#C9821B\"><b>Presión atmosférica<\/b><span>el empuje del aire sobre todo<\/span><\/div><div style=\"--acc:#242478\"><b>Principio<\/b><span>regla de la física que explica fenómenos<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-tapar=\"voc5\">Tapar las definiciones<\/button><\/div>", "guia": {"obj": "Que el grupo tenga a la vista, desde el principio, las palabras con las que se va a hablar hoy.", "decir": ["Lee las palabras en voz alta, una vez, sin explicar ninguna: «estas son las palabras de hoy».", "Juego de un minuto: tapa las definiciones, di una definición y que el grupo responda la palabra."], "como": "", "apoyo": ["No es una clase de vocabulario: son treinta segundos de lectura y un minuto de juego. Las palabras se aprenden usándolas en el taller.", "Si una palabra ya salió en la activación, señálala: «esta es la que dijo …»."]}}, {"m": 0, "min": 3, "html": "<div class=\"cv-motivo\"><svg viewBox=\"0 0 320 320\" aria-hidden=\"true\"><g fill=\"none\" stroke=\"#5C7A1E\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><ellipse cx=\"110\" cy=\"110\" rx=\"90\" ry=\"32\"/><ellipse cx=\"110\" cy=\"110\" rx=\"90\" ry=\"32\" transform=\"rotate(60 110 110)\"/><ellipse cx=\"110\" cy=\"110\" rx=\"90\" ry=\"32\" transform=\"rotate(-60 110 110)\"/><circle cx=\"110\" cy=\"110\" r=\"10\"/><path d=\"M190 240 L300 240 M245 240 L245 236\" stroke-width=\"3\"/><path d=\"M220 40 L290 40 M255 40 L215 200\"/><circle cx=\"210\" cy=\"215\" r=\"16\"/><path d=\"M255 40 L255 190\" stroke-dasharray=\"6 8\" stroke-width=\"2\"/><path d=\"M222 192 Q255 210 288 192\" stroke-dasharray=\"4 7\" stroke-width=\"2\"/><\/g><\/svg><\/div><div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Conceptualización · 3 min<\/span><span class=\"kicker\">El mapa de la misión · toca una tarjeta para abrirla<\/span><\/div><h2>La energía que sube, corre y se escapa<\/h2><div class=\"cv-mapa\" id=\"cv5\"><svg aria-hidden=\"true\" viewBox=\"0 0 100 100\" preserveAspectRatio=\"none\"><line x1=\"50\" y1=\"50\" x2=\"18\" y2=\"16\" stroke=\"#9AA3B2\" stroke-width=\"2\" stroke-dasharray=\"6 6\" vector-effect=\"non-scaling-stroke\"/><line x1=\"50\" y1=\"50\" x2=\"82\" y2=\"16\" stroke=\"#9AA3B2\" stroke-width=\"2\" stroke-dasharray=\"6 6\" vector-effect=\"non-scaling-stroke\"/><line x1=\"50\" y1=\"50\" x2=\"18\" y2=\"84\" stroke=\"#9AA3B2\" stroke-width=\"2\" stroke-dasharray=\"6 6\" vector-effect=\"non-scaling-stroke\"/><line x1=\"50\" y1=\"50\" x2=\"82\" y2=\"84\" stroke=\"#9AA3B2\" stroke-width=\"2\" stroke-dasharray=\"6 6\" vector-effect=\"non-scaling-stroke\"/><\/svg><button class=\"cv-nodo cv-centro\" style=\"--acc:var(--area)\" data-cv=\"cv5c\" data-cvg=\"cv5\"><b>Energía mecánica<\/b><small>la suma de la energía de altura (potencial) y la de movimiento (cinética)<\/small><\/button><button class=\"cv-nodo\" style=\"--acc:#242478;grid-area:a\" data-cv=\"cv50\" data-cvg=\"cv5\"><span class=\"n\">1<\/span><b>Cada magnitud con su fórmula y su unidad<\/b><small>Ep, Ec y W, en julios<\/small><\/button><button class=\"cv-nodo\" style=\"--acc:#A82424;grid-area:b\" data-cv=\"cv51\" data-cvg=\"cv5\"><span class=\"n\">2<\/span><b>¿Quién empuja y hacia dónde?<\/b><small>trabajo: fuerza a lo largo del camino<\/small><\/button><button class=\"cv-nodo\" style=\"--acc:#5B3E96;grid-area:d\" data-cv=\"cv52\" data-cvg=\"cv5\"><span class=\"n\">3<\/span><b>Una variable a la vez<\/b><small>una variable, lo demás fijo, repetir<\/small><\/button><button class=\"cv-nodo\" style=\"--acc:#C9821B;grid-area:e\" data-cv=\"cv53\" data-cvg=\"cv5\"><span class=\"n\">4<\/span><b>El principio que explica lo que se ve<\/b><small>nombrar el principio y mostrar cómo<\/small><\/button><\/div><div class=\"cv-det\" id=\"cv5c\" hidden style=\"--acc:var(--area)\"><div><svg viewBox=\"0 0 420 300\" role=\"img\" aria-label=\"Una pelota arriba de una loma tiene energía de altura; abajo, energía de movimiento\"><ellipse cx=\"210.0\" cy=\"286\" rx=\"176.4\" ry=\"10\" fill=\"#1E2230\" opacity=\".07\"/><path d=\"M30 92 C140 92 160 240 260 240 L395 240\" fill=\"none\" stroke=\"#1E2230\" stroke-width=\"4\"/><circle cx=\"52\" cy=\"76\" r=\"16\" fill=\"#242478\"/><circle cx=\"320\" cy=\"224\" r=\"16\" fill=\"#C9821B\"/><path d=\"M282 216 l-26 0 M286 228 l-34 0\" stroke=\"#C9821B\" stroke-width=\"3.5\" stroke-linecap=\"round\"/><text x=\"76\" y=\"66\" text-anchor=\"start\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"20\" fill=\"#242478\" font-weight=\"700\">Ep: altura<\/text><text x=\"320\" y=\"192\" text-anchor=\"middle\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"20\" fill=\"#C9821B\" font-weight=\"700\">Ec: rapidez<\/text><text x=\"210\" y=\"284\" text-anchor=\"middle\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"20\" fill=\"#1E2230\" font-weight=\"700\">Ep + Ec = energía mecánica<\/text><\/svg><\/div><div><h3>Energía mecánica<\/h3><p>la suma de la energía de altura (potencial) y la de movimiento (cinética)<\/p><p class=\"cv-ej\"><b>Ejemplo:<\/b> una manzana de 0,2 kg en una rama a 3 m tiene Ep = 0,2 · 10 · 3 = 6 J; justo antes de tocar el suelo, esos 6 J son casi todos cinéticos.<\/p><p class=\"cv-ojo\"><b>Ojo:<\/b> sin roce, la energía mecánica se conserva; con roce, una parte se vuelve calor.<\/p><div class=\"ctl\"><button class=\"btn\" data-cvback=\"cv5c\" data-cvg=\"cv5\">← Volver al mapa<\/button><\/div><\/div><\/div><div class=\"cv-det\" id=\"cv50\" hidden style=\"--acc:#242478\"><div><svg viewBox=\"0 0 420 300\" role=\"img\" aria-label=\"Etiquetas: masa en kilogramos, altura en metros, rapidez en m/s y energía en julios\"><ellipse cx=\"210.0\" cy=\"286\" rx=\"176.4\" ry=\"10\" fill=\"#1E2230\" opacity=\".07\"/><rect x=\"40\" y=\"52\" width=\"150\" height=\"70\" rx=\"14\" fill=\"#fff\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><circle cx=\"58\" cy=\"87\" r=\"7\" fill=\"#fff\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><text x=\"128\" y=\"96\" text-anchor=\"middle\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"24\" fill=\"#1E2230\" font-weight=\"700\">m → kg<\/text><rect x=\"230\" y=\"52\" width=\"150\" height=\"70\" rx=\"14\" fill=\"#fff\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><circle cx=\"248\" cy=\"87\" r=\"7\" fill=\"#fff\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><text x=\"318\" y=\"96\" text-anchor=\"middle\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"24\" fill=\"#1E2230\" font-weight=\"700\">h → m<\/text><rect x=\"40\" y=\"152\" width=\"150\" height=\"70\" rx=\"14\" fill=\"#fff\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><circle cx=\"58\" cy=\"187\" r=\"7\" fill=\"#fff\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><text x=\"128\" y=\"196\" text-anchor=\"middle\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"24\" fill=\"#1E2230\" font-weight=\"700\">v → m/s<\/text><rect x=\"230\" y=\"152\" width=\"150\" height=\"70\" rx=\"14\" fill=\"#E9E9F2\" stroke=\"#242478\" stroke-width=\"4\"/><circle cx=\"248\" cy=\"187\" r=\"7\" fill=\"#fff\" stroke=\"#242478\" stroke-width=\"2.5\"/><text x=\"318\" y=\"196\" text-anchor=\"middle\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"24\" fill=\"#242478\" font-weight=\"700\">E → J<\/text><text x=\"210\" y=\"270\" text-anchor=\"middle\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"20\" fill=\"#1E2230\" font-weight=\"700\">sin unidad, no hay cuenta<\/text><\/svg><\/div><div><h3>Cada magnitud con su fórmula y su unidad<\/h3><p>Cada magnitud tiene su fórmula y su unidad: Ep = m · g · h y Ec = ½ · m · v², las dos en julios (J), con la masa en kg, la altura en m y la rapidez en m/s. En la Tierra, g ≈ 10 m/s².<\/p><span class=\"cv-f\">Ep = m · g · h   ·   Ec = ½ · m · v²<\/span><p class=\"cv-ej\"><b>Ejemplo:<\/b> una ciclista con su bicicleta (80 kg) a 5 m/s: Ec = ½ · 80 · 5² = 1.000 J.<\/p><p class=\"cv-ojo\"><b>Ojo:<\/b> la masa va en kg, no en gramos. Y el peso es una fuerza (en N), no una masa (en kg).<\/p><div class=\"ctl\"><button class=\"btn\" data-cvback=\"cv50\" data-cvg=\"cv5\">← Volver al mapa<\/button><\/div><\/div><\/div><div class=\"cv-det\" id=\"cv51\" hidden style=\"--acc:#A82424\"><div><svg viewBox=\"0 0 420 300\" role=\"img\" aria-label=\"Un carrito jalado en diagonal: solo la parte de la fuerza a lo largo del camino hace trabajo\"><ellipse cx=\"210.0\" cy=\"286\" rx=\"176.4\" ry=\"10\" fill=\"#1E2230\" opacity=\".07\"/><line x1=\"40\" y1=\"242\" x2=\"390\" y2=\"242\" stroke=\"#C9D1DC\" stroke-width=\"3\"/><rect x=\"110\" y=\"170\" width=\"120\" height=\"50\" rx=\"6\" fill=\"#F5E5E5\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><circle cx=\"135\" cy=\"230\" r=\"12\" fill=\"#fff\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><circle cx=\"205\" cy=\"230\" r=\"12\" fill=\"#fff\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><path d=\"M230 180 L330 110 M323.2 122.2 L330 110 L316.2 112.2\" fill=\"none\" stroke=\"#A82424\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"338\" y=\"108\" text-anchor=\"start\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"24\" fill=\"#A82424\" font-weight=\"700\">F<\/text><line x1=\"230\" y1=\"180\" x2=\"330\" y2=\"180\" stroke=\"#C9821B\" stroke-width=\"4\" stroke-dasharray=\"9 6\"/><path d=\"M270 180 A40 40 0 0 0 263 157\" fill=\"none\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><text x=\"278\" y=\"170\" text-anchor=\"start\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"20\" fill=\"#1E2230\" font-weight=\"700\">θ<\/text><text x=\"240\" y=\"206\" text-anchor=\"start\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"18\" fill=\"#C9821B\" font-weight=\"600\">la que trabaja<\/text><path d=\"M110 272 L300 272 M287.4 278.1 L300 272 L287.4 265.9\" fill=\"none\" stroke=\"#6E7480\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"310\" y=\"279\" text-anchor=\"start\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"22\" fill=\"#6E7480\" font-weight=\"700\">d<\/text><\/svg><\/div><div><h3>¿Quién empuja y hacia dónde?<\/h3><p>Una fuerza hace trabajo solo si el objeto se desplaza y ella empuja, al menos en parte, en esa dirección. Si es perpendicular al movimiento o no hay desplazamiento, el trabajo es cero.<\/p><span class=\"cv-f\">W = F · d · cos θ<\/span><p class=\"cv-ej\"><b>Ejemplo:<\/b> empujar un carrito de mercado 10 m con 30 N en la dirección del camino: W = 30 · 10 = 300 J.<\/p><p class=\"cv-ojo\"><b>Ojo:<\/b> cansarse no es hacer trabajo: empujar una pared que no se mueve da W = 0.<\/p><div class=\"ctl\"><button class=\"btn\" data-cvback=\"cv51\" data-cvg=\"cv5\">← Volver al mapa<\/button><\/div><\/div><\/div><div class=\"cv-det\" id=\"cv52\" hidden style=\"--acc:#5B3E96\"><div><svg viewBox=\"0 0 420 300\" role=\"img\" aria-label=\"Tres péndulos de distinto largo, con la misma masa, medidos cinco veces cada uno\"><ellipse cx=\"210.0\" cy=\"286\" rx=\"176.4\" ry=\"10\" fill=\"#1E2230\" opacity=\".07\"/><rect x=\"50\" y=\"40\" width=\"320\" height=\"12\" fill=\"#CEC5E0\" stroke=\"#1E2230\" stroke-width=\"2\"/><line x1=\"90\" y1=\"52\" x2=\"90\" y2=\"132\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><path d=\"M60 126 Q90 146 120 126\" fill=\"none\" stroke=\"#6E7480\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/><circle cx=\"90\" cy=\"132\" r=\"16\" fill=\"#DED8EA\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><text x=\"124\" y=\"156\" text-anchor=\"start\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"18\" fill=\"#C9821B\" font-weight=\"700\">×5<\/text><line x1=\"210\" y1=\"52\" x2=\"210\" y2=\"182\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><path d=\"M180 176 Q210 196 240 176\" fill=\"none\" stroke=\"#6E7480\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/><circle cx=\"210\" cy=\"182\" r=\"16\" fill=\"#DED8EA\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><text x=\"244\" y=\"206\" text-anchor=\"start\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"18\" fill=\"#C9821B\" font-weight=\"700\">×5<\/text><line x1=\"330\" y1=\"52\" x2=\"330\" y2=\"232\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><path d=\"M300 226 Q330 246 360 226\" fill=\"none\" stroke=\"#6E7480\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/><circle cx=\"330\" cy=\"232\" r=\"16\" fill=\"#DED8EA\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><text x=\"364\" y=\"256\" text-anchor=\"start\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"18\" fill=\"#C9821B\" font-weight=\"700\">×5<\/text><text x=\"150\" y=\"280\" text-anchor=\"middle\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"20\" fill=\"#5B3E96\" font-weight=\"700\">solo cambia el largo<\/text><\/svg><\/div><div><h3>Una variable a la vez<\/h3><p>Un procedimiento es confiable si cambia una sola variable, deja fijas las demás y repite cada medida varias veces. Un solo ensayo puede salir así por casualidad.<\/p><span class=\"cv-f\">1 variable · las demás fijas · varias repeticiones<\/span><p class=\"cv-ej\"><b>Ejemplo:<\/b> ¿el largo de un péndulo cambia su periodo? Misma masa, mismo ángulo al soltar, solo cambia el largo, y cada largo se mide cinco veces.<\/p><p class=\"cv-ojo\"><b>Ojo:<\/b> repetir no es cambiar otra cosa: se repite la misma prueba para ver si da lo mismo.<\/p><div class=\"ctl\"><button class=\"btn\" data-cvback=\"cv52\" data-cvg=\"cv5\">← Volver al mapa<\/button><\/div><\/div><\/div><div class=\"cv-det\" id=\"cv53\" hidden style=\"--acc:#C9821B\"><div><svg viewBox=\"0 0 420 300\" role=\"img\" aria-label=\"Un globo suelta aire hacia atrás y sale disparado hacia adelante\"><ellipse cx=\"210.0\" cy=\"286\" rx=\"176.4\" ry=\"10\" fill=\"#1E2230\" opacity=\".07\"/><ellipse cx=\"250\" cy=\"160\" rx=\"90\" ry=\"62\" fill=\"#F5E8D6\" stroke=\"#1E2230\" stroke-width=\"3\"/><polygon points=\"162,160 146,149 146,171\" fill=\"#E9CDA4\" stroke=\"#1E2230\" stroke-width=\"2.5\"/><path d=\"M140 146 L66 136 M79.3 131.7 L66 136 L77.7 143.7\" fill=\"none\" stroke=\"#6E7480\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M140 160 L56 160 M68.6 153.9 L56 160 L68.6 166.1\" fill=\"none\" stroke=\"#6E7480\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M140 174 L66 184 M77.7 176.3 L66 184 L79.3 188.3\" fill=\"none\" stroke=\"#6E7480\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"60\" y=\"118\" text-anchor=\"start\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"20\" fill=\"#1E2230\" font-weight=\"700\">acción<\/text><path d=\"M220 70 L370 70 M357.4 76.1 L370 70 L357.4 63.9\" fill=\"none\" stroke=\"#C9821B\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"290\" y=\"52\" text-anchor=\"middle\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"20\" fill=\"#C9821B\" font-weight=\"700\">reacción<\/text><text x=\"100\" y=\"230\" text-anchor=\"middle\" font-family=\"Carlito, Calibri, Arial, sans-serif\" font-size=\"18\" fill=\"#6E7480\" font-weight=\"600\">el aire sale<\/text><\/svg><\/div><div><h3>El principio que explica lo que se ve<\/h3><p>Para explicar un fenómeno se nombra el principio que lo gobierna (conservación de la energía, acción y reacción, inercia, presión del aire) y se muestra cómo produce lo que se ve.<\/p><span class=\"cv-f\">fenómeno → ¿qué principio? → cómo lo produce<\/span><p class=\"cv-ej\"><b>Ejemplo:<\/b> un globo inflado que se suelta sale volando: empuja el aire hacia atrás y el aire lo empuja a él hacia adelante (acción y reacción).<\/p><p class=\"cv-ojo\"><b>Ojo:<\/b> describir lo que pasa no es explicarlo: falta el nombre del principio y el porqué.<\/p><div class=\"ctl\"><button class=\"btn\" data-cvback=\"cv53\" data-cvg=\"cv5\">← Volver al mapa<\/button><\/div><\/div><\/div>", "guia": {"obj": "Ponerle nombre a lo que el grupo acaba de descubrir en la activación: una idea central y una por estrategia.", "decir": ["«Lo que acaban de descubrir tiene nombre». Toca la tarjeta del centro y dila en una frase.", "Abre solo la tarjeta de la estrategia 1: es la que se entrena ya en la dinámica. Las demás se abren cuando aparezcan en el taller: vuelve a esta diapositiva con ← cuando haga falta.", "Una frase por tarjeta, nada más. Si alguien pregunta algo largo: «lo vemos en la pregunta que toca»."], "como": "", "apoyo": ["Lo de las tarjetas está para reconocerlo en el taller, no para memorizarlo hoy.", "Los ejemplos son propios de la guía: no son los del libro, para que no resuelvan el taller por adelantado.", "La conceptualización se toma 3 de los 15 minutos de la Activación. Si la activación se alargó, pasa directo a la dinámica: el mapa sigue disponible para el cierre.", "Para comprobar la idea central: Un balón quieto en una terraza, ¿tiene más energía potencial o cinética? (potencial)", "Estrategia 1 · Cada magnitud con su fórmula y su unidad: Si la rapidez se duplica, ¿cuántas veces crece la energía cinética? (cuatro veces)", "Estrategia 2 · ¿Quién empuja y hacia dónde?: Una fuerza forma 90° con el camino. ¿Cuánto trabajo hace? (cero: cos 90° = 0)", "Estrategia 3 · Una variable a la vez: Un solo ensayo dio que la canica pesada llegó primero. ¿Basta para concluir? (no: hay que repetir)", "Estrategia 4 · El principio que explica lo que se ve: ¿Qué principio explica que un cohete avance en el espacio, sin aire en qué apoyarse? (acción y reacción)"]}}, {"m": 0, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#242478\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 1 · Cada magnitud con su fórmula y su unidad<\/span><\/div><h2>La fórmula llama a sus datos<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Cada estudiante tiene una tarjeta: «m = 2 kg», «h = 3 m», «v = 4 m/s», «g = 10 m/s²», «t = 5 s»; tres más tienen Ep = m · g · h, Ec = ½ · m · v² y p = m · v.<\/li><li>Cada fórmula llama al frente solo los datos que necesita; los que sobran se quedan sentados.<\/li><li>La cuenta va con números y unidades a la vez: 2 kg · 10 m/s² · 3 m = 60 J.<\/li><li>Cambia una tarjeta («h = 6 m», «v = 8 m/s»): ¿el resultado se duplica, se cuadruplica o no cambia?<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Tarjetas con datos y fórmulas<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno corto diciendo qué cambió y qué lo causó —qué fuerza, qué calor, qué carga— antes de explicarlo con fórmulas y antes de ver cualquier opción.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No explica el fenómeno ni acepta todavía fórmulas. Si alguien dice «es por la gravedad» o «es la energía», le devuelve la pregunta: «¿quién empuja a quién, y hacia dónde?». El cuaderno sigue cerrado.", "apoyo": ["Qué movimiento mental entrena: Escoger la fórmula por la magnitud que se pide, llamar solo los datos que usa y arrastrar la unidad hasta el final. Es el movimiento de las preguntas 1, 4 y 5, y de la primera del entrenamiento (cuánto cambió el momento en cada choque).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 1, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m2)\">Pregunta problematizadora<\/span><span class=\"kicker\">Libro abierto en la pregunta modelo<\/span><\/div><h2>Abran el libro en la pregunta 1, página 247<\/h2><p class=\"lead\">Antes de dibujar o calcular: ¿cuál creen que es? Levanten la mano.<\/p><div class=\"ctl\"><button class=\"btn tally\" data-tally=\"h5A\">A <span class=\"n\" id=\"h5A\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h5B\">B <span class=\"n\" id=\"h5B\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h5C\">C <span class=\"n\" id=\"h5C\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h5D\">D <span class=\"n\" id=\"h5D\">0<\/span><\/button><button class=\"btn\" data-reset=\"h5\">↺<\/button><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta que gobierna el área<\/h3><p class=\"lead\">¿Qué lo causó? Muéstrame la flecha o el julio que lo explica.<\/p><p class=\"sub\">Nadie justifica con «así dice la fórmula» ni con «eso es obvio»: toda respuesta señala una flecha del dibujo, un número con su unidad o un renglón del enunciado.<\/p><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta de este momento<\/h3><p class=\"lead\">¿Cuántos julios hay, quién los puso y a dónde se fueron?<\/p><\/div>", "guia": {"obj": "Que el estudiante compruebe que en Física la respuesta sale de la causa dibujada o de la cuenta con unidades, y no de la opción que suena más técnica, usando la pregunta modelo del libro.", "decir": ["Presenta la pregunta modelo del libro y la deja a la vista todo el momento.", "Pide respuestas a mano alzada ANTES de dibujar o calcular nada, y las anota en el tablero.", "Hace la pregunta que gobierna el área: ¿qué lo causó? Muéstrame la flecha o el julio que lo explica.", "Revela la clave solo al final y trabaja por qué cae cada una de las otras tres."], "como": "Regla del momento: nadie justifica con «así dice la fórmula» ni con «eso es obvio». Toda intervención señala una flecha del dibujo, un número con su unidad o un renglón del enunciado.", "apoyo": ["La pregunta modelo es la 1 del libro (página 247). El cuaderno se abre en la página 293 solo en «mi primera idea».", "Cuenta las manos tocando cada letra: el número queda en pantalla y sirve para el final del momento, cuando el grupo vea cuántos cambiaron de opinión al dibujar la flecha o hacer la cuenta.", "No digas la clave en este momento: sale en el bloque de las preguntas 1 y 2, después de llenar el instrumento en pantalla, casilla por casilla. Ahí se trabaja por qué cae cada una de las otras tres."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 1 y 2<\/span><span class=\"kicker\">En pantalla, casilla por casilla<\/span><\/div><h2>Preguntas 1 y 2: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 1<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Cada magnitud con su fórmula y su unidad<\/span><\/div><p class=\"sub\">Una herramienta en la Tierra y en Marte · diferencia de energía potencial<\/p><h3 style=\"color:#242478\">Dos planetas, la misma herramienta<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k51\"><span class=\"keychip\" style=\"background:#242478\">C<\/span> es la clave del libro<\/div><div class=\"aviso sev-baja\" hidden data-grupo=\"k51\"><b>Ojo con esta clave:<\/b> El libro dice que el astronauta «pesa 80 kg». El kilogramo mide masa; el peso es una fuerza y se mide en newtons.<\/div><\/div><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 2<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E3 · Una variable a la vez<\/span><\/div><p class=\"sub\">Central mareomotriz en el laboratorio · qué procedimiento es confiable<\/p><h3 style=\"color:#5B3E96\">El tablero de control del canal<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k51\"><span class=\"keychip\" style=\"background:#5B3E96\">B<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k51\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 1·C y 2·B. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 1 · aviso del libro (baja): El libro dice que el astronauta «pesa 80 kg». El kilogramo mide masa; el peso es una fuerza y se mide en newtons. Qué haces: No cambia la clave C. Dilo: el peso es una fuerza."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 3 y 4<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 3 y 4: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 3<\/span><span class=\"min\" style=\"--accent:#C9821B\">E4 · El principio que explica lo que se ve<\/span><\/div><p class=\"sub\">Relojes en la Tierra y en un satélite · qué principio explica el GPS<\/p><h3 style=\"color:#C9821B\">Dos relojes a distinta distancia de la Tierra<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Relatividad general<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k53\"><span class=\"keychip\" style=\"background:#C9821B\">A<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 4<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Cada magnitud con su fórmula y su unidad<\/span><\/div><p class=\"sub\">Dron en Bogotá · energía mecánica del paquete en el piso 20 y en el 5<\/p><h3 style=\"color:#242478\">La cuenta de joules en dos entregas<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k53\"><span class=\"keychip\" style=\"background:#242478\">B<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k53\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 3·A y 4·B. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 3 · Relatividad general: La gravedad cambia el ritmo del tiempo: en la superficie de la Tierra un reloj va un poquito más despacio que en un satélite, donde la gravedad es más débil. Son millonésimas de segundo al día, pero el GPS mide distancias con la rapidez de la luz: sin corregir, se equivocaría kilómetros en un día. Para destrabar: «¿Dónde es más fuerte la gravedad: en el suelo o en la órbita?»", "Pregunta 3 · aviso del libro (atención), solo para ti, no se proyecta: El enunciado ya trae la causa y la clave la repite; además, en el GPS real la velocidad del satélite atrasa su reloj, al revés de lo que dice la C. Qué haces: Usa el sello sobre la relatividad general. No entres en la otra relatividad.", "Pregunta 4 · aviso del libro (baja), solo para ti, no se proyecta: Las rapideces son promedios en los trayectos horizontales, no la rapidez en el momento de la entrega. Qué haces: No cambia la clave B: solo con la energía potencial la diferencia ya pasa de 1000 J."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#A82424\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 2 · ¿Quién empuja y hacia dónde?<\/span><\/div><h2>¿Trabaja o no trabaja?<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Un estudiante con una mochila liviana; cada uno del grupo tiene dos tarjetas: SÍ TRABAJA y NO TRABAJA.<\/li><li>Despacio, el estudiante sube la mochila al pupitre, la sostiene quieta, camina con ella a la misma altura y la baja.<\/li><li>Antes de cada acción, el grupo dibuja en el aire dos flechas: hacia dónde empuja la mano y hacia dónde va la mochila.<\/li><li>Levantan la tarjeta: trabaja si las dos flechas van, al menos en parte, en la misma línea.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Una mochila liviana · dos tarjetas por estudiante<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Qué movimiento mental entrena: Nombrar quién empuja y hacia dónde, y compararlo con hacia dónde se mueve el objeto, antes de hablar de trabajo o de equilibrio. Es el movimiento de las preguntas 6 y 10, y de la segunda del entrenamiento (las fuerzas sobre la piñata quieta).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 5 y 6<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 5 y 6: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 5<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Cada magnitud con su fórmula y su unidad<\/span><\/div><p class=\"sub\">Dron en Bogotá · consumo de batería proporcional a la altura<\/p><h3 style=\"color:#242478\">Cada metro de altura cuesta lo mismo<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k55\"><span class=\"keychip\" style=\"background:#242478\">C<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 6<\/span><span class=\"min\" style=\"--accent:#A82424\">E2 · ¿Quién empuja y hacia dónde?<\/span><\/div><p class=\"sub\">Dron en Bogotá · cuándo hace trabajo sobre el paquete<\/p><h3 style=\"color:#A82424\">Fuerza y camino: ¿van juntos o no?<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k55\"><span class=\"keychip\" style=\"background:#A82424\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k55\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 5·C y 6·A. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#5B3E96\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 3 · Una variable a la vez<\/span><\/div><h2>Las perillas de la rampa<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Cuatro estudiantes son las perillas de una rampa de cuadernos: ALTURA, CARRITO, SUPERFICIE y LARGO.<\/li><li>Pregunta: «¿la altura cambia qué tan lejos llega el carrito?». Solo esa perilla cambia; las demás se cruzan de brazos.<\/li><li>Se prueba dos veces con un carrito de juguete o una tapa, cambiando solo la altura.<\/li><li>El docente mueve dos perillas a escondidas: ¿se sabe cuál fue?, ¿vale para cualquier rampa?<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cuadernos · un carrito de juguete o una tapa<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Qué movimiento mental entrena: Cambiar una variable a la vez, dejar fijas las demás y no estirar la conclusión más allá de lo que se probó. Es el movimiento de las preguntas 2 y 8, y de la tercera del entrenamiento (qué asegurar al repetir la medida de los resortes).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 7 y 8<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 7 y 8: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 7<\/span><span class=\"min\" style=\"--accent:#C9821B\">E4 · El principio que explica lo que se ve<\/span><\/div><p class=\"sub\">Dron en Bogotá · la energía que no llegó al paquete<\/p><h3 style=\"color:#C9821B\">El río de energía que sale de la batería<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k57\"><span class=\"keychip\" style=\"background:#C9821B\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 8<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E3 · Una variable a la vez<\/span><\/div><p class=\"sub\">Sifón con dos vasos · ¿vale la conclusión de un solo ensayo?<\/p><h3 style=\"color:#5B3E96\">Las tres palabras grandes de la conclusión<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k57\"><span class=\"keychip\" style=\"background:#5B3E96\">A<\/span> es la clave del libro<\/div><div class=\"aviso sev-medi\" hidden data-grupo=\"k57\"><b>Ojo con esta clave:<\/b> La A y la D señalan algo que de verdad no se probó. La clave tomada es A, porque «cualquier líquido» es lo que más se aleja de un solo ensayo con agua.<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k57\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 7·B y 8·A. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 8 · aviso del libro (media): La A y la D señalan algo que de verdad no se probó. La clave tomada es A, porque «cualquier líquido» es lo que más se aleja de un solo ensayo con agua. Qué haces: Clave tomada: A, porque ataca «cualquier líquido». Quien marque D tiene un argumento."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#C9821B\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 4 · El principio que explica lo que se ve<\/span><\/div><h2>El rincón del principio<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Tres rincones: LA ENERGÍA NO DESAPARECE, SI HAY FUERZA NETA HAY ACELERACIÓN y EL AIRE EMPUJA.<\/li><li>El docente muestra un fenómeno: una pelota que rebota cada vez más bajo, un carrito que arranca con un empujón, una ventosa pegada a la baldosa.<\/li><li>Cada estudiante camina al rincón del principio que lo explica.<\/li><li>Para quedarse, lo dice con las palabras del principio. Si solo describe lo que ve, cambia de rincón.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Tres carteles · una pelota · una ventosa<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el dibujo o con la cuenta en cinco minutos —nombrar la flecha, llevar la cuenta, separar lo que cambia de lo que no—, pero con el cuerpo.»", "Nadie corre ni lanza nada. Si la dinámica pide moverse, se camina."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Qué movimiento mental entrena: Explicar un fenómeno nombrando el principio y usándolo, no describiéndolo otra vez. Es el movimiento de las preguntas 3, 7 y 9, y de la cuarta del entrenamiento (la pelota que sube acelerada por el tubo).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 9 y 10<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 9 y 10: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 9<\/span><span class=\"min\" style=\"--accent:#C9821B\">E4 · El principio que explica lo que se ve<\/span><\/div><p class=\"sub\">Sifón con dos vasos · qué modelo explica el flujo<\/p><h3 style=\"color:#C9821B\">El sifón por dentro: dos columnas de agua<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Presión atmosférica<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k59\"><span class=\"keychip\" style=\"background:#C9821B\">D<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 10<\/span><span class=\"min\" style=\"--accent:#A82424\">E2 · ¿Quién empuja y hacia dónde?<\/span><\/div><p class=\"sub\">Sifón con dos vasos · qué fuerzas mueven el agua<\/p><h3 style=\"color:#A82424\">Diagrama de cuerpo libre de un poco de agua del pitillo<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k59\"><span class=\"keychip\" style=\"background:#A82424\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k59\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante haga el instrumento —el diagrama de fuerzas, la cuenta con unidades, la ficha del experimento o la cadena de la energía— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué flecha dibujaron, o qué cuenta hicieron? Léanmela con su unidad.»", "Si alguien se traba, pregúntale qué cambió y quién lo causó. Si el instrumento está vacío, vuelve al dibujo o al enunciado antes que a las opciones."], "como": "No resuelve la cuenta en el tablero antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué cambió y quién lo causó; si la cuenta no tiene unidades, la devuelve antes de mirar el número.", "apoyo": ["Las claves del libro son 9·D y 10·A. No las reveles hasta que todos tengan el instrumento hecho: el botón es para el cierre del bloque.", "Pregunta 9 · Presión atmosférica: El aire pesa y empuja sobre todo lo que toca: unos 10 N por centímetro cuadrado al nivel del mar (en Bogotá, unos 7,5). Un pitillo lleno y tapado arriba con el dedo no se vacía porque el aire empuja el agua desde abajo. En el sifón, ese empuje sube el agua por el tramo corto. Para destrabar: «¿Quién empuja el agua hacia arriba, si nadie la chupa?»", "Pregunta 9 · aviso del libro (atención), solo para ti, no se proyecta: La 9 pide un «modelo» y la clave D nombra fuerzas. En la 10, dentro del pitillo lleno no hay «resistencia del aire»: frena la fricción del agua con las paredes. Qué haces: No cambian las claves D y A."]}}, {"m": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m4)\">Reto en equipo · 20 min<\/span><span class=\"kicker\">Equipos de tres · cada uno responde en su cuaderno<\/span><\/div><h2>Reto del corte: La patineta en la rampa<\/h2><div class=\"card big edge mt\" style=\"--accent:var(--m4)\"><p class=\"lead\">Cada equipo recibe un caso: una patinadora de 50 kg baja desde el borde de una rampa de 2 m de altura y llega abajo a 6 m/s. En doce minutos calculan su energía potencial arriba y su energía cinética abajo, con g = 10 m/s² y con unidades; dibujan las fuerzas sobre ella cuando rueda en el piso y dicen cuáles hacen trabajo; diseñan una prueba para saber si la masa de quien patina cambia la rapidez al llegar abajo; y explican con un principio a dónde se fueron los julios que faltan. Cada integrante defiende una de las cuatro partes.<\/p><\/div><div class=\"note mt\" style=\"--accent:var(--m4)\"><b>La defensa:<\/b> tres minutos por equipo, señalando la flecha, la cuenta con su unidad o la variable que los respalda. «Porque sí» o «así dice la fórmula» no cuentan.<\/div>", "guia": {"obj": "Que el estudiante defienda su explicación con el dibujo o la cuenta en la mano y acepte que otro equipo puede ver una fuerza, una pérdida o una variable que él no vio.", "decir": ["Arma equipos de tres y entrega el reto del corte de este momento.", "Exige que cada integrante llegue con su instrumento YA diligenciado individualmente.", "Da tres minutos de defensa por equipo: muestran la flecha, la cuenta o la variable que los respalda.", "Cierra mostrando qué fuerza, qué julio o qué variable quedó por fuera en cada propuesta."], "como": "El equipo discute, pero cada uno escribe en SU tarjeta del reto. No se acepta una defensa que diga «porque sí» o «eso dice la fórmula»: se señala la flecha, el número con su unidad o la variable que se controló.", "apoyo": ["Las cuentas del reto, para ti (no se proyectan): Ep = 50 kg · 10 m/s² · 2 m = 1000 J. Ec = ½ · 50 kg · (6 m/s)² = 900 J. Faltan 100 J: se fueron como calor y sonido por el rozamiento. En el piso, el peso y la normal no hacen trabajo (son perpendiculares al camino); el rozamiento sí, en contra.", "El reto no tiene una sola respuesta correcta en todas sus partes: gana el equipo que mejor sostiene la suya con flechas y cuentas. Si dos explicaciones están sostenidas, dilo: eso también es hacer física.", "Si un equipo entrega una sola hoja para los tres, el reto no cuenta. La discusión es compartida; el registro es individual.", "Cierra mostrando qué fuerza, qué julio o qué variable quedó por fuera en cada propuesta."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 1<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Dos pelotas y la tabla de momentos<\/h3><p>Una estudiante suelta varias veces una pelota de 5 kg de masa (pelota 1), desde la parte más alta de una rampa de 1,5 m de altura, para que choque elásticamente con una pelota de masa diferente (pelota 2), que inicialmente se encuentra en reposo, como se muestra en la figura. La estudiante registra en la tabla las variaciones del momento antes y después del choque de cada pelota.<\/p><figure class=\"fig\"><svg viewBox=\"0 0 540 160\" role=\"img\" aria-label=\"Rampa de 1,5 m: la pelota 1, de 5 kg, baja y choca con la pelota 2 en reposo\" style=\"font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif;max-width:500px;margin:0 auto\"><line x1=\"70.0\" y1=\"24.0\" x2=\"70.0\" y2=\"144.0\" stroke=\"#1B1F27\" stroke-width=\"3\"/><path d=\"M 70 34 Q 130 134 330 142 L 490 142\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"3\"/><line x1=\"40.0\" y1=\"146.0\" x2=\"510.0\" y2=\"146.0\" stroke=\"#1B1F27\" stroke-width=\"2\"/><circle cx=\"84.0\" cy=\"20.0\" r=\"14.0\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2.2\"/><circle cx=\"474.0\" cy=\"130.0\" r=\"12.0\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2.2\"/><text x=\"106.0\" y=\"24.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"start\">Pelota 1 · masa = 5 kg<\/text><text x=\"400.0\" y=\"110.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"start\">Pelota 2<\/text><text x=\"58.0\" y=\"94.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"end\">1,5 m<\/text><\/svg><\/figure><\/div><div><div class=\"derfig\"><figure class=\"fig\"><table class=\"tabla\"><thead><tr><th>Lanzamiento<\/th><th>Pelota 1 · antes<\/th><th>Pelota 1 · después<\/th><th>Masa pelota 2 (kg)<\/th><th>Pelota 2 · antes<\/th><th>Pelota 2 · después<\/th><\/tr><\/thead><tbody><tr><td>I<\/td><td>27,10<\/td><td>18,05<\/td><td>1<\/td><td>0<\/td><td>9,00<\/td><\/tr><tr><td>II<\/td><td>27,10<\/td><td>6,50<\/td><td>3<\/td><td>0<\/td><td>20,60<\/td><\/tr><tr><td>III<\/td><td>27,10<\/td><td>0,00<\/td><td>5<\/td><td>0<\/td><td>27,10<\/td><\/tr><tr><td>IV<\/td><td>27,10<\/td><td>−4,50<\/td><td>7<\/td><td>0<\/td><td>31,60<\/td><\/tr><\/tbody><\/table><figcaption>Momentos en kg·m/s.<\/figcaption><\/figure><\/div><p class=\"enun\">Si la estudiante sabe que la variación del momento es proporcional a la fuerza, ¿en cuál de los lanzamientos la pelota 1 se ejerció mayor fuerza para mover la pelota 2?<\/p><div class=\"ops\" id=\"icf51\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>IV.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>III.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>II.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>I.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf51\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la A.", "Por qué es la A: la fuerza sobre la pelota 2 se ve en cuánto cambió su momento: después menos antes. Lanzamiento I: 9,00 − 0 = 9,00 kg·m/s; II: 20,60; III: 27,10; IV: 31,60. El mayor cambio es el del lanzamiento IV: opción A. La pelota 1 pierde lo mismo que gana la 2 (27,10 − 18,05 ≈ 9,05; 27,10 − (−4,50) = 31,60): el momento total se conserva. Y la tabla cuadra: 5 kg que bajan 1,5 m llegan a v = √(2 · 9,8 m/s² · 1,5 m) ≈ 5,42 m/s, y 5 kg · 5,42 m/s ≈ 27,1 kg·m/s.", "Las opciones vienen al revés: la A es el lanzamiento IV. Que lean la letra y el número.", "En el lanzamiento IV la pelota 1 rebota hacia atrás (momento negativo): por eso es el cambio más grande.", "El cuadernillo dice «la pelota 1 se ejerció»: quiere decir «la pelota 1 ejerció». Y en rigor el cambio del momento es la fuerza por el tiempo del choque: la pregunta supone que los cuatro choques duran lo mismo."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 2<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>La piñata en equilibrio<\/h3><p>En una fiesta, un niño sostiene una piñata por medio de una cuerda que pasa por una polea, como muestra la figura.<\/p><figure class=\"fig\"><svg viewBox=\"0 0 280 235\" role=\"img\" aria-label=\"Una cuerda pasa por una polea: de un lado cuelga la piñata y del otro la sostiene el niño\" style=\"font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif;max-width:280px;margin:0 auto\"><line x1=\"60.0\" y1=\"20.0\" x2=\"220.0\" y2=\"20.0\" stroke=\"#1B1F27\" stroke-width=\"3\"/><line x1=\"140.0\" y1=\"20.0\" x2=\"140.0\" y2=\"50.0\" stroke=\"#1B1F27\" stroke-width=\"2\"/><circle cx=\"140.0\" cy=\"70.0\" r=\"22.0\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2.4\"/><line x1=\"118.0\" y1=\"70.0\" x2=\"118.0\" y2=\"170.0\" stroke=\"#1B1F27\" stroke-width=\"2\"/><line x1=\"162.0\" y1=\"70.0\" x2=\"162.0\" y2=\"130.0\" stroke=\"#1B1F27\" stroke-width=\"2\"/><polygon points=\"162,130 192,160 162,190 132,160\" fill=\"#F1DDB8\" stroke=\"#1B1F27\" stroke-width=\"2\"/><text x=\"200.0\" y=\"166.0\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"start\">piñata<\/text><text x=\"170.0\" y=\"74.0\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"start\">polea<\/text><circle cx=\"118.0\" cy=\"182.0\" r=\"9.0\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><line x1=\"118.0\" y1=\"191.0\" x2=\"118.0\" y2=\"225.0\" stroke=\"#1B1F27\" stroke-width=\"2.4\"/><text x=\"100.0\" y=\"216.0\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"end\">niño<\/text><\/svg><\/figure><\/div><div><p class=\"enun\">La piñata se mantiene en equilibrio y no se cae. Esto ocurre porque<\/p><div class=\"ops\" id=\"icf52\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>el peso de la piñata disminuye con la altura.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>el niño está ubicado debajo de la polea.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>la polea sostiene por sí sola el peso de la piñata.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>la fuerza que hace el niño es igual al peso de la piñata.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf52\" data-k=\"D\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la D.", "Por qué es la D: la piñata está quieta: la fuerza neta sobre ella es cero. Sobre ella actúan su peso, hacia abajo, y la tensión de la cuerda, hacia arriba, y son iguales. Una polea fija solo cambia la dirección de la cuerda: la tensión que sostiene la piñata es la misma con la que hala el niño, así que la fuerza del niño es igual al peso de la piñata (D). A: el peso no cambia en unos metros de altura; B: dónde está el niño no es una fuerza; C: la polea sola no sostiene nada si nadie hala la cuerda.", "Dos flechas sobre la piñata antes de mirar las opciones: el peso hacia abajo y la tensión hacia arriba.", "Supone una polea sin rozamiento y una cuerda liviana, como se hace siempre en el colegio."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 3<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Repetir la medida de los resortes<\/h3><p>Un estudiante tenía algunos resortes y quería saber cuál de ellos era el más elástico. Para esto colgó una masa de 500 g a cada uno de los resortes y midió cuánto se estiraban. Un compañero de clase desea corroborar las medidas realizadas.<\/p><\/div><div><p class=\"enun\">Para esto, él vuelve a hacer mediciones asegurándose de<\/p><div class=\"ops\" id=\"icf53\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>usar la misma masa para probar todos los resortes.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>que todos los resortes terminen estirados la misma longitud.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>estirar todos los resortes al mismo tiempo.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>que todos los resortes tengan el mismo tamaño.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf53\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la A.", "Por qué es la A: para comparar qué tan elástico es cada resorte, lo único
