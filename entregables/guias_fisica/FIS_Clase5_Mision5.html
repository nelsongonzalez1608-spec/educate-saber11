que cambia es el resorte; lo demás se deja quieto, empezando por la masa que se cuelga (500 g en todos). Si cambia la masa, no se sabe si un resorte se estiró más por ser más elástico o por cargar más (A). B obliga al resultado que se quiere medir; C, estirarlos al mismo tiempo, no cambia cuánto se estira cada uno; D cambiaría los mismos resortes que se quieren comparar.", "No tiene figura ni cuentas: es la ficha de una variable a la vez. ¿Qué se compara? ¿Qué se deja quieto? ¿Qué se mide?", "La B es la trampa del que piensa en el resultado: si todos terminan igual, ya no hay nada que medir."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 4<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>La pelota que sube por el tubo<\/h3><p>Un estudiante sopla una pelota por un tubo vertical y esta sube aceleradamente por el tubo, como se muestra en la siguiente figura:<\/p><figure class=\"fig\"><svg viewBox=\"0 0 480 220\" role=\"img\" aria-label=\"Tubo vertical con una pelota que sube acelerada; el aire soplado va hacia arriba\" style=\"font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif;max-width:480px;margin:0 auto\"><rect x=\"30.0\" y=\"8.0\" width=\"70.0\" height=\"200.0\" rx=\"8\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2.2\"/><circle cx=\"65.0\" cy=\"88.0\" r=\"30.0\" fill=\"#D8DCE2\" stroke=\"#1B1F27\" stroke-width=\"2\"/><line x1=\"48.0\" y1=\"198.0\" x2=\"48.0\" y2=\"144.3\" stroke=\"#1B1F27\" stroke-width=\"2.2\"/><polygon points=\"48.0,138.0 51.7,146.2 44.3,146.2\" fill=\"#1B1F27\"/><line x1=\"82.0\" y1=\"198.0\" x2=\"82.0\" y2=\"144.3\" stroke=\"#1B1F27\" stroke-width=\"2.2\"/><polygon points=\"82.0,138.0 85.7,146.2 78.3,146.2\" fill=\"#1B1F27\"/><text x=\"130.0\" y=\"48.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"start\" font-weight=\"700\">La pelota se mueve aceleradamente hacia arriba<\/text><line x1=\"140.0\" y1=\"158.0\" x2=\"140.0\" y2=\"114.3\" stroke=\"#1B1F27\" stroke-width=\"2.2\"/><polygon points=\"140.0,108.0 143.7,116.2 136.3,116.2\" fill=\"#1B1F27\"/><text x=\"156.0\" y=\"132.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"start\" font-weight=\"700\">dirección de movimiento<\/text><text x=\"156.0\" y=\"151.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"start\" font-weight=\"700\">del aire soplado<\/text><\/svg><\/figure><\/div><div><p class=\"enun\">Teniendo en cuenta lo anterior, ¿por qué ocurre esto?<\/p><div class=\"ops\" id=\"icf54\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>Porque el peso de la pelota cambia cuando el estudiante sopla aire por el tubo.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>Porque la fuerza que ejerce el aire que sopla el estudiante es igual que el peso de la pelota.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>Porque el peso de la pelota es mayor que la fuerza del aire que sopla el estudiante.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Porque la fuerza que ejerce el aire que sopla el estudiante es mayor que el peso de la pelota.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf54\" data-k=\"D\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué dibujaste o qué calculaste antes de mirar las opciones? ¿Qué flecha o qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la D.", "Por qué es la D: si la pelota sube cada vez más rápido, tiene aceleración hacia arriba, y por la segunda ley de Newton la fuerza neta también va hacia arriba: la fuerza del aire soplado es mayor que el peso (D). Si fueran iguales (B), estaría quieta o subiría con rapidez constante; si el peso fuera mayor (C), la pelota bajaría o frenaría; y el peso no cambia porque alguien sople (A).", "La palabra que decide es «aceleradamente»: aceleración hacia arriba, fuerza neta hacia arriba.", "La B es la trampa más común: fuerzas iguales no quieren decir quieto, quieren decir sin aceleración. ---"]}}, {"m": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m6)\">Cierre<\/span><span class=\"kicker\">La pregunta de siempre<\/span><\/div><h2>¿En qué se parecía la pregunta tipo Saber 11 a la de tu libro?<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:#242478\"><div class=\"k\">1<\/div><div><b>Cada magnitud con su fórmula y su unidad<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#A82424\"><div class=\"k\">2<\/div><div><b>¿Quién empuja y hacia dónde?<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#5B3E96\"><div class=\"k\">3<\/div><div><b>Una variable a la vez<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#C9821B\"><div class=\"k\">4<\/div><div><b>El principio que explica lo que se ve<\/b><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--m6)\"><h3>Antes de salir<\/h3><ol class=\"pasos\"><li>El concepto del día —una ley, una magnitud o una relación—, en «Palabras que me frenaron», con tus palabras.<\/li><li>«Lo que me llevo de esta pregunta».<\/li><li>Tu carita de salida.<\/li><li>La clase 5 de la portada del área, con la causa que encontraste.<\/li><\/ol><\/div><\/div>", "guia": {"obj": "Que el estudiante nombre la estrategia que usó y se lleve un concepto del día —una ley, una magnitud o una relación— escrito en sus propias palabras.", "decir": ["Socializa solo las preguntas que el grupo falló, pidiendo la flecha o la cuenta que las resuelve.", "Pide que lean en voz alta su salvavidas: lo mínimo que sí tenían claro.", "Cada uno escribe el concepto del día en «Palabras que me frenaron» y la causa que encontró en la portada del área."], "como": "No dicta la definición ni la fórmula. El concepto se escribe como el estudiante lo entendió; si quedó mal entendido, eso se ve en la hoja y se corrige la próxima clase.", "apoyo": ["El concepto del día no se dicta. Si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase: es mejor que dictarla bien.", "Para el cierre del momento: La pregunta 6 es la más contraria a la intuición: sostener un paquete quieto cansa, pero no hace trabajo sobre él. Ciérrala con la fórmula: sin desplazamiento, W = 0."]}}];
var MOM = [{"n": 1, "nom": "Activación", "min": 15, "c": "--m1"}, {"n": 2, "nom": "Pregunta problematizadora", "min": 20, "c": "--m2"}, {"n": 3, "nom": "Desarrollo guiado", "min": 35, "c": "--m3"}, {"n": 4, "nom": "Reto en equipo", "min": 20, "c": "--m4"}, {"n": 5, "nom": "Evaluación individual", "min": 20, "c": "--m5"}, {"n": 6, "nom": "Cierre", "min": 10, "c": "--m6"}];
var NOMBRE = document.getElementById("momnom").textContent, SUB = document.getElementById("momsub").textContent;
var $ = function(s){ return document.querySelector(s); };
var wrap = $("#wrap"), stage = $("#stage"), i = 0;
var tBase = 0, tLeft = 0, tOn = false, tick = null;
var elegidas = [];
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function paintClock(){
  var n = $("#tnum");
  if(!tBase){ n.textContent = "—"; n.classList.remove("over"); return; }
  var s = Math.abs(tLeft), mm = Math.floor(s/60), ss = s%60;
  n.textContent = (tLeft<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", tLeft<0);
}
function setTimer(min){
  tBase = min||0; tLeft = tBase*60; tOn = false;
  if(tick){ clearInterval(tick); tick = null; }
  $("#play").textContent = "Iniciar"; paintClock();
}
function toggleTimer(){
  if(!tBase) return;
  tOn = !tOn; $("#play").textContent = tOn ? "Pausar" : "Seguir";
  if(tick){ clearInterval(tick); tick = null; }
  if(tOn) tick = setInterval(function(){ tLeft--; paintClock(); }, 1000);
  paintClock();
}
// cronómetro de la prueba (clase 7): aparte del de la barra, no se reinicia al cambiar de diapositiva
var EX = {base:0, left:0, on:false, t:null, ini:null};
function hhmm(d){ return d.getHours() + ":" + (d.getMinutes()<10?"0":"") + d.getMinutes(); }
function exPaint(){
  var box = wrap.querySelector("[data-examen]"); if(!box) return;
  if(!EX.base){ EX.base = +box.dataset.examen; EX.left = EX.base*60; }
  var s = Math.abs(EX.left), mm = Math.floor(s/60), ss = s%60;
  var n = box.querySelector("[data-exnum]");
  n.textContent = (EX.left<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", EX.left<0);
  box.querySelector("[data-exini]").textContent = EX.ini ? hhmm(EX.ini) : "—";
  box.querySelector("[data-exfin]").textContent = EX.on ? hhmm(new Date(Date.now() + EX.left*1000)) : (EX.ini ? "en pausa" : "—");
  var p = box.querySelector('[data-ex="play"]');
  p.textContent = EX.on ? "Pausar" : (EX.ini ? "Seguir" : "Iniciar la prueba");
}
function exToggle(){
  if(!EX.base) exPaint();
  EX.on = !EX.on;
  if(EX.t){ clearInterval(EX.t); EX.t = null; }
  if(EX.on){ if(!EX.ini) EX.ini = new Date(); EX.t = setInterval(function(){ EX.left--; exPaint(); }, 1000); }
  exPaint();
}
function exReset(){
  if(EX.ini && !window.confirm("¿Volver a poner el cronómetro de la prueba en cero?")) return;
  if(EX.t){ clearInterval(EX.t); EX.t = null; }
  EX.on = false; EX.ini = null; EX.left = EX.base*60; exPaint();
}
// casillas que llena el profe (clase 8): se guardan mientras la página esté abierta
var CAMPOS = {};
function pintaCampos(){
  [].forEach.call(wrap.querySelectorAll("[data-campo]"), function(x){ x.value = CAMPOS[x.dataset.campo] || ""; });
  [].forEach.call(wrap.querySelectorAll("[data-eco]"), function(x){ x.textContent = CAMPOS[x.dataset.eco] || "—"; });
}
function guiaHTML(g){
  if(!g) return '<p class="sub">Sin notas para esta diapositiva.</p>';
  var h = '<div class="gbox"><h4>Objetivo</h4><p>'+esc(g.obj)+'</p></div>';
  if(g.decir && g.decir.length) h += '<div class="gbox"><h4>Qué haces y qué dices</h4><ul>'+
     g.decir.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  if(g.como) h += '<div class="gbox como"><h4>Lo que no haces</h4><p>'+esc(g.como)+'</p></div>';
  if(g.apoyo && g.apoyo.length) h += '<div class="gbox apoyo"><h4>Si Física no es tu fuerte</h4><ul>'+
     g.apoyo.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  return h;
}
function pintaElegidas(){
  var box = document.getElementById("elegidas"); if(!box) return;
  if(!elegidas.length){ box.innerHTML = '<p class="sub">Vuelve a la diapositiva anterior y escoge las cinco.</p>'; return; }
  box.innerHTML = elegidas.map(function(t,k){
    return '<div class="card edge" style="--accent:var(--m'+((k%6)+1)+')"><h3>'+(k+1)+'. '+esc(t)+'</h3>'+
      '<p class="sub">Busca esta pregunta en tu simulacro y en la hoja de taller de la misma estrategia.</p></div>';
  }).join("");
}
function go(n){
  var prev = SC[i];
  i = Math.max(0, Math.min(SC.length-1, n));
  var s = SC[i];
  wrap.innerHTML = s.html;
  wrap.classList.remove("enter"); void wrap.offsetWidth; wrap.classList.add("enter");
  stage.scrollTop = 0;
  var m = s.m!=null ? MOM[s.m] : null;
  $("#momdot").style.background = m ? "var("+m.c+")" : "var(--faint)";
  $("#momdot").textContent = m ? m.n : "·";
  $("#momnom").textContent = m ? m.nom : NOMBRE;
  $("#momsub").textContent = m ? (m.min+" minutos") : SUB;
  var want = s.min!=null ? s.min : (m ? m.min : 0);
  var cambio = !prev || prev===s || prev.m!==s.m || (prev.min||null)!==(s.min||null);
  if(cambio) setTimer(want);
  $("#count").textContent = (i+1)+" / "+SC.length;
  $("#prog i").style.width = (SC.length>1 ? i/(SC.length-1)*100 : 100)+"%";
  $("#guiabody").innerHTML = guiaHTML(s.guia);
  [].forEach.call(wrap.querySelectorAll("[data-pick]"), function(b){
    b.setAttribute("aria-pressed", elegidas.indexOf(b.textContent)>=0 ? "true" : "false"); });
  pintaElegidas();
  pintaCampos();
  exPaint();
  $("#clock").style.visibility = wrap.querySelector("[data-examen]") ? "hidden" : "";   // la prueba tiene su reloj
}
wrap.addEventListener("input", function(e){
  var x = e.target; if(!x.dataset || !x.dataset.campo) return;
  CAMPOS[x.dataset.campo] = x.value;
});
wrap.addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.dataset.ex==="play") exToggle();
  if(b.dataset.ex==="reset") exReset();
  if(b.dataset.show){ var t = document.getElementById(b.dataset.show); if(t) t.hidden = !t.hidden; }
  if(b.dataset.showgrupo){
    var g = wrap.querySelectorAll('[data-grupo="'+b.dataset.showgrupo+'"]'), abrir = g.length && g[0].hidden;
    [].forEach.call(g, function(x){ x.hidden = !abrir; });
    b.textContent = abrir ? "Ocultar las claves" : "Revelar las claves";
  }
  if(b.dataset.clave){
    var box = document.getElementById(b.dataset.clave), ok = box.querySelector('[data-op="'+b.dataset.k+'"]');
    var on = ok && !ok.classList.contains("ok");
    [].forEach.call(box.querySelectorAll(".op"), function(o){ o.classList.remove("ok"); });
    if(on) ok.classList.add("ok");
    b.textContent = on ? "Ocultar la clave" : "Revelar la clave";
  }
  if(b.dataset.tally){ var n = document.getElementById(b.dataset.tally); n.textContent = (+n.textContent||0)+1; }
  if(b.dataset.reset){ [].forEach.call(wrap.querySelectorAll('[id^="'+b.dataset.reset+'"]'), function(x){
    if(x.classList.contains("n")) x.textContent = "0"; }); }
  if(b.dataset.pick!=null){
    var t = b.textContent, k = elegidas.indexOf(t);
    if(k>=0) elegidas.splice(k,1); else if(elegidas.length<5) elegidas.push(t);
    b.setAttribute("aria-pressed", elegidas.indexOf(t)>=0 ? "true" : "false");
  }
});

wrap.addEventListener("click", function(e){
  var b = e.target.closest("[data-cv]"), v = e.target.closest("[data-cvback]");
  if(b){ var d = document.getElementById(b.dataset.cv), m = document.getElementById(b.dataset.cvg);
    if(d && m){ m.hidden = true; d.hidden = false; } }
  if(v){ var d2 = document.getElementById(v.dataset.cvback), m2 = document.getElementById(v.dataset.cvg);
    if(d2 && m2){ d2.hidden = true; m2.hidden = false; } }
  var t = e.target.closest("[data-tapar]");
  if(t){ var x = document.getElementById(t.dataset.tapar); x.classList.toggle("tapar");
    t.textContent = x.classList.contains("tapar") ? "Destapar las definiciones" : "Tapar las definiciones"; }
});
function setGuia(on){ $("#guia").classList.toggle("open", on); $("#scrim").classList.toggle("on", on);
  $("#gbtn").setAttribute("aria-pressed", on ? "true" : "false"); }
$("#next").addEventListener("click", function(){ go(i+1); });
$("#prev").addEventListener("click", function(){ go(i-1); });
$("#play").addEventListener("click", toggleTimer);
$("#reset").addEventListener("click", function(){ setTimer(tBase); });
$("#gbtn").addEventListener("click", function(){ setGuia(!$("#guia").classList.contains("open")); });
$("#gclose").addEventListener("click", function(){ setGuia(false); });
$("#scrim").addEventListener("click", function(){ setGuia(false); });
document.addEventListener("keydown", function(e){
  var t = e.target.tagName; if(t==="INPUT"||t==="TEXTAREA"||e.target.isContentEditable) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ go(i+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ go(i-1); e.preventDefault(); }
  else if(e.key==="Home"){ go(0); e.preventDefault(); }
  else if(e.key==="End"){ go(SC.length-1); e.preventDefault(); }
  else if(e.key==="g"||e.key==="G"){ setGuia(!$("#guia").classList.contains("open")); }
  else if(e.key==="t"||e.key==="T"){ if(wrap.querySelector("[data-examen]")) exToggle(); else toggleTimer(); }
  else if(e.key==="Escape"){ setGuia(false); }
});
go(0);
})();
</script>
</body>
</html>
