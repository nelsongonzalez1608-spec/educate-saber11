<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inglés · Clase 5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>[hidden]{display:none!important}
:root{
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --text:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --area:#1BA0A8; --azul:#1F4E8C; --oro:#B0711A; --morado:#5B3E96; --verde:#2E7A39;
  --m1:#1BA0A8; --m2:#1F4E8C; --m3:#3B3BA6; --m4:#5B3E96; --m5:#A82424; --m6:#4A5A70; --rojo:#A82424;
  --ink:#1B1F27; --muted:#5C6472; --faint:#A9B0BB; --line:#E3E7ED; --paper:#FFFFFF; --bg:#F6F4F1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:clamp(16px,1.25vw,21px);line-height:1.5}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
#top{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding:10px clamp(14px,2vw,28px);background:var(--paper);flex-wrap:wrap}
.logo img{height:clamp(28px,2.6vw,40px);display:block}
#mom{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
#momdot{width:clamp(30px,2.4vw,40px);height:clamp(30px,2.4vw,40px);border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;background:var(--faint)}
#momnom{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.2vw,20px)}
#momsub{color:var(--muted);font-size:.85em}
#clock{display:flex;align-items:center;gap:8px}
#tnum{font-family:var(--display);font-weight:800;font-size:clamp(20px,1.8vw,30px);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
#tnum.over{color:var(--area)}
.btn{appearance:none;font:inherit;font-size:.86em;font-weight:600;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.solid{background:var(--area);border-color:var(--area);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#stage{overflow:auto;padding:clamp(18px,3vw,48px) clamp(16px,4vw,72px)}
#wrap{max-width:1500px;margin:0 auto}
#wrap.enter{animation:ent .28s ease-out}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bot{display:flex;align-items:center;gap:12px;padding:10px clamp(14px,2vw,28px);background:var(--paper)}
#prog{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
#prog i{display:block;height:100%;background:var(--area);transition:width .25s}
#count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
#hint{color:var(--faint);font-size:.8em}
@media (max-width:760px){#hint{display:none}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.2vw,68px);line-height:1.05;margin:.2em 0 .25em;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,2.8vw,46px);line-height:1.1;margin:.25em 0 .3em;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:clamp(18px,1.5vw,26px);margin:.1em 0 .4em;line-height:1.2}
p{margin:.35em 0 .6em}
.lead{font-size:1.2em;line-height:1.45;max-width:70ch}
.sub{color:var(--muted)}
.mt{margin-top:clamp(14px,1.8vw,26px)}
.logo-xl img{height:clamp(54px,6vw,96px);margin-bottom:12px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tag,.min,.membrete{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.78em;font-weight:700;letter-spacing:.02em}
.tag{background:var(--ink);color:#fff}
.min{background:var(--accent,var(--area));color:#fff}
.membrete{border:1.5px solid var(--line);color:var(--muted)}
.kicker{color:var(--muted);font-size:.85em;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.grid{display:grid;gap:clamp(12px,1.4vw,22px)}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid>*{min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,1.6vw,24px)}
.card.edge{border-left:6px solid var(--accent,var(--area))}
.card.big .lead{font-size:1.3em}
.step{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px}
.step .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;flex:none}
.note{border-left:5px solid var(--accent,var(--area));background:var(--paper);border-radius:10px;padding:10px 16px;margin-top:12px}
.cita{font-family:var(--display);font-weight:600;line-height:1.35;background:var(--paper);border-left:6px solid var(--area);border-radius:12px;padding:clamp(16px,2vw,30px);margin:18px 0}
.cita.xl{font-size:clamp(24px,2.6vw,44px)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally .n{display:inline-block;min-width:1.6em;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.pasos{margin:.2em 0 0;padding-left:1.3em}.pasos li{margin:.3em 0}
.sello{margin-top:12px;border:2px dashed var(--oro);border-radius:12px;padding:10px 14px;background:#FDF6EA}
.sello b{display:block;color:var(--oro);font-size:.8em;letter-spacing:.06em;text-transform:uppercase}
.clave{margin-top:12px;display:flex;align-items:center;gap:10px;font-weight:600}
.keychip{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:10px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.2em}
.aviso{margin-top:10px;border-radius:10px;padding:10px 14px;background:#FBEFEF;border-left:5px solid var(--area);font-size:.92em}
.aviso.sev-aten{background:#EDF5EE;border-left-color:var(--verde)}
.aviso.sev-medi{background:#FDF5E7;border-left-color:var(--oro)}
.icfes .texto{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.6vw,24px);max-height:62vh;overflow:auto;font-size:.95em}
.enun{font-weight:600;font-size:1.08em}
.ops{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.op .L{flex:none;width:1.8em;height:1.8em;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-family:var(--display);font-weight:800}
.op.ok{border-color:var(--verde);background:#EDF5EE}.op.ok .L{background:var(--verde);color:#fff}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick[aria-pressed="true"]{background:var(--area);border-color:var(--area);color:#fff}
#scrim{position:fixed;inset:0;background:rgba(15,18,24,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#guia{position:fixed;top:0;right:0;height:100%;width:min(520px,92vw);background:var(--paper);box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column;z-index:10}
#guia.open{transform:none}
#guiahead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg)}
#guiabody{overflow:auto;padding:16px 20px 30px;font-size:.92em}
.gbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.gbox h4{margin:0 0 6px;font-family:var(--display);font-size:.8em;letter-spacing:.07em;text-transform:uppercase;color:var(--area)}
.gbox ul{margin:0;padding-left:1.1em}.gbox li{margin:.35em 0}
.gbox.como{background:#F6F7F9}.gbox.como h4{color:var(--muted)}
.gbox.apoyo{background:#FDF6EA;border-color:#EAD9B4}.gbox.apoyo h4{color:var(--oro)}
[hidden]{display:none!important}
.en{font-family:var(--display);font-weight:600;font-size:1.32em;line-height:1.35;margin:.4em 0 .5em;color:var(--ink)}
.en.xl{font-size:1.6em}
.eops{list-style:none;margin:.3em 0 .6em;padding:0;display:grid;gap:4px}
.eops li{display:flex;gap:10px;align-items:baseline;font-size:1.12em;line-height:1.3}
.eops li b{flex:none;width:1.6em;height:1.6em;border-radius:7px;display:inline-grid;place-items:center;background:var(--bg);font-family:var(--display);font-size:.85em}
.eops.banco{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.ins{font-size:.95em;color:var(--muted);margin:.2em 0}
.corr{margin-top:10px;border-left:5px solid #242478;background:#F2F3FA;border-radius:10px;padding:8px 14px;font-size:.92em}
.corr b{display:block;color:#242478;font-size:.78em;letter-spacing:.06em;text-transform:uppercase}
.kgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.kg{display:inline-flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--paper);font-weight:700}
.kg span{color:var(--muted);font-weight:600}
.nums{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nums span{border:1.5px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:700;background:var(--paper)}
.op .L{flex:none}
.icfes .texto{font-size:1.1em;line-height:1.5}
.icfes .texto .en{font-size:1.5em}
.icfes .op{font-size:1.08em}
.icfes .enun{font-size:1.18em}
</style>
</head>

 páginas 456 a 459; hoy, diez en clase<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m4)\"><h3>Tu cuaderno<\/h3><p class=\"sub\">Páginas 366 a 375<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m6)\"><h3>Hoy<\/h3><p class=\"sub\">120 minutos · 6 momentos · Parte 6 · lectura inferencial<\/p><\/div><\/div>", "guia": {"obj": "Que el grupo sepa desde el primer minuto qué va a pasar en estos 120 minutos y qué tiene que tener sobre la mesa.", "decir": ["«Libro abierto, cuaderno cerrado, lápiz. Hoy nadie traduce palabra por palabra: hoy buscamos la pista que decide.»"], "apoyo": ["⚑ Antes del sábado: En casi todas las preguntas los distractores cierran con absolutos («exclusively», «completely», «all») y la correcta matiza. No lo enseñes como truco: la tarjeta 14 enseña a tratar la palabra fuerte como una alarma que se comprueba en el texto. Las cuatro del entrenamiento traen erratas corregidas por EDUCATE: la dirección de EDUCATE decide si se cambian.", "Lo que no cabe en clase: La misión no deja tarea: diez tarjetas en clase y seis en el reto. Son preguntas largas: en el desarrollo guiado cada texto se lee una vez, entero, antes de su primer bloque de tarjetas.", "Los cuatro conceptos que tienes que poder explicar hoy en dos minutos, sin jerga:", "Inferir: Es sacar lo que el texto no dice con todas las letras pero deja entender. Siempre tiene que haber una frase que lo pruebe: si no se puede señalar, es invento.", "Para qué lo pone el autor: Un ejemplo o un detalle está para algo: ilustrar una idea, contrastar, convencer o mostrar que algo pasa cerca (los árboles de la ciudad, el andén roto).", "Sentido figurado: «Foundation» es la base de una casa: si se cae, se cae todo. «I am here, my story matters» no es una letra de canción: es alguien que dice que existe y que vale.", "Palabras absolutas: Exclusively, completely, all, never: en las opciones casi siempre exageran. No es un truco: es una alarma que se comprueba en el texto.", "Cómo se dicen las palabras clave (la sílaba fuerte lleva tilde): photosynthesis (fou-tou-SÍN-ze-sis), breathable (BRÍ-da-bol), foundation (faun-DÉI-shon), deforestation (di-fo-res-TÉI-shon), sidewalk (SÁID-uok), pedestrians (pe-DÉS-tri-ans), heritage (JÉ-ri-tich), anonymity (a-no-NÍ-mi-ti).", "Si un estudiante pregunta algo que no sabes, no inventes: «No lo sé; vamos a ver qué dice el texto». Anótalo en tu registro y tráelo resuelto. Si alguien sabe más inglés, que lea en voz alta.", "Abre esta guía con la tecla G en cada diapositiva: trae lo que dices y, debajo, lo que necesitas saber si Inglés no es tu área.", "El cronómetro arranca con T y se reinicia solo cuando cambia el momento de la clase."]}}, {"m": null, "html": "<div class=\"eyebrow\"><span class=\"kicker\">Así vamos a trabajar<\/span><\/div><h2>Seis momentos, una sola regla<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:var(--m1)\"><div class=\"k\">1<\/div><div><b>Activación<\/b><span class=\"sub\"> · 15 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m2)\"><div class=\"k\">2<\/div><div><b>Pregunta problematizadora<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m3)\"><div class=\"k\">3<\/div><div><b>Desarrollo guiado<\/b><span class=\"sub\"> · 35 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m4)\"><div class=\"k\">4<\/div><div><b>Reto en equipo<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m5)\"><div class=\"k\">5<\/div><div><b>Evaluación individual<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m6)\"><div class=\"k\">6<\/div><div><b>Cierre<\/b><span class=\"sub\"> · 10 min<\/span><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--area)\"><h3>La regla del cuaderno<\/h3><p class=\"lead\">Si el instrumento está vacío, no lo resolviste: lo adivinaste.<\/p><p>Primero se escribe la pista en el instrumento —la palabra que decide, lo que tacha, el tiempo, la intención—, después se marca la letra. Una respuesta correcta con el instrumento en blanco no cuenta como resuelta.<\/p><\/div><\/div>", "guia": {"obj": "Que la regla quede dicha en voz alta antes de cualquier texto.", "decir": ["«La respuesta correcta con el instrumento vacío no cuenta. ¿Por qué? Porque en inglés casi todas las opciones suenan bien: el que no escribió la pista escoge la que suena, no la que dice el texto.»"], "apoyo": ["Si alguien pregunta para qué escribir, la respuesta corta es: en el examen nadie traduce; el que encuentra la pista responde en segundos.", "Si alguien dice «es que suena mejor», devuélvele la pregunta: «¿qué palabra del texto te lo dice?»."]}}, {"m": 0, "min": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Ronda de claves · 5 min<\/span><span class=\"kicker\">Tarea de la Misión 3 · texto 2 · Spider-Verse<\/span><\/div><h2>Antes de empezar: la tarea de la Misión 3<\/h2><p class=\"lead\">Cuaderno abierto en las páginas 339 a 343 y un color distinto en la mano. Junto a cada X escribe la pista que no viste.<\/p><div class=\"nums\"><span>11<\/span><span>13<\/span><span>15<\/span><span>16<\/span><span>17<\/span><span>18<\/span><span>19<\/span><span>20<\/span><\/div><div class=\"ctl\"><button class=\"btn\" data-show=\"ronda5\">Revelar las claves de la tarea<\/button><\/div><div class=\"clave kgrid\" id=\"ronda5\" hidden><span class=\"kg\"><span>11<\/span>B<\/span><span class=\"kg\"><span>13<\/span>C<\/span><span class=\"kg\"><span>15<\/span>A<\/span><span class=\"kg\"><span>16<\/span>C<\/span><span class=\"kg\"><span>17<\/span>B<\/span><span class=\"kg\"><span>18<\/span>A<\/span><span class=\"kg\"><span>19<\/span>C<\/span><span class=\"kg\"><span>20<\/span>B<\/span><\/div>", "guia": {"obj": "Que la tarea se revise en cinco minutos y cada uno vea qué pista no vio.", "decir": ["«Cuaderno abierto en la tarea. Lápiz de otro color. Voy a revelar las claves: chulita o X, y junto a cada X la pista que no vieron.»"], "apoyo": ["Las claves: 11·B, 13·C, 15·A, 16·C, 17·B, 18·A, 19·C, 20·B.", "Manos arriba por tarjeta: la más fallada se explica en un minuto, con la pista. Las demás van a tu registro. No se corrige la letra: se escribe la pista que faltó.", "Tarjeta 17 · Del libro (corrección): 17 a 20: valen el pasado del relato (combined, dealt, tried, left) y el presente de la trama; 24: by, with y through son correctas. Qué haces: Son de la casa: en las rondas de las clases 5 y 6 acéptalas (en 18 a 20, el mismo reloj en las tres).", "Tarjeta 18 · Del libro (corrección): 17 a 20: valen el pasado del relato (combined, dealt, tried, left) y el presente de la trama; 24: by, with y through son correctas. Qué haces: Son de la casa: en las rondas de las clases 5 y 6 acéptalas (en 18 a 20, el mismo reloj en las tres).", "Tarjeta 19 · Del libro (corrección): 17 a 20: valen el pasado del relato (combined, dealt, tried, left) y el presente de la trama; 24: by, with y through son correctas. Qué haces: Son de la casa: en las rondas de las clases 5 y 6 acéptalas (en 18 a 20, el mismo reloj en las tres).", "Tarjeta 20 · Del libro (corrección): 17 a 20: valen el pasado del relato (combined, dealt, tried, left) y el presente de la trama; 24: by, with y through son correctas. Qué haces: Son de la casa: en las rondas de las clases 5 y 6 acéptalas (en 18 a 20, el mismo reloj en las tres)."]}}, {"m": 0, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Activación<\/span><span class=\"kicker\">Cuaderno cerrado<\/span><\/div><h2>¿Qué palabra decide?<\/h2><blockquote class=\"cita xl\" lang=\"en\">When I opened the door, everybody shouted «Surprise!» and the lights came on.<\/blockquote><p class=\"lead\">Léela despacio. Señala la palabra que decide y di qué decide. Todavía no se abre el libro.<\/p><div class=\"ctl\"><button class=\"btn\" data-show=\"pista5\">Mostrar la pista<\/button><\/div><div class=\"note\" id=\"pista5\" hidden style=\"--accent:var(--m1)\"><b>Pista:<\/b> nadie dice «fiesta» ni «cumpleaños», pero «Surprise!» y las luces lo dejan entender<\/div>", "guia": {"obj": "Que el estudiante, antes de abrir el libro, busque en una frase corta en inglés la pista que decide —una palabra, un tiempo, una intención— y la nombre en voz alta.", "decir": ["Si hay tarea de la misión anterior, abre con la ronda de claves: cinco minutos, reloj a la vista.", "Proyecta la frase del día, inventada para la clase, y la lee despacio dos veces.", "Pide que el grupo señale la palabra que decide y diga qué decide: quién habla, cuándo pasa, qué falta.", "Ejecuta la dinámica de la subestrategia 1 (ocho minutos)."], "como": "No traduce la frase ni explica gramática. Si alguien pregunta qué significa una palabra, le devuelve: «¿qué palabra de al lado te ayuda?». El cuaderno sigue cerrado, salvo en la ronda de claves.", "apoyo": ["No traduzcas la frase ni expliques gramática: primero la palabra que decide. La frase es inventada para la clase: no sale del libro.", "La pista existe para el cierre de los 15 minutos, no para el principio: nadie dice «fiesta» ni «cumpleaños», pero «Surprise!» y las luces lo dejan entender."]}, "min": 2}, {"m": 0, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#242478\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 1 · Lo que el texto deja entender<\/span><\/div><h2>Detectives de la mochila<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>El docente muestra o lee lo que hay en una mochila inventada: a ticket, sunscreen, a map, a camera.<\/li><li>En equipos escriben una inferencia: a dónde va la dueña y para qué.<\/li><li>Cada equipo defiende la suya señalando el objeto que la prueba.<\/li><li>Si una inferencia no se puede señalar en un objeto, se tacha: es invento.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cuatro objetos o una lista<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante, antes de abrir el libro, busque en una frase corta en inglés la pista que decide —una palabra, un tiempo, una intención— y la nombre en voz alta.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto en inglés en cinco minutos —buscar, tachar, ubicar en el tiempo—, pero con el cuerpo.»"], "como": "No traduce la frase ni explica gramática. Si alguien pregunta qué significa una palabra, le devuelve: «¿qué palabra de al lado te ayuda?». El cuaderno sigue cerrado, salvo en la ronda de claves.", "apoyo": ["Qué movimiento mental entrena: Inferir con la prueba en la mano: lo que se deja entender tiene que poder señalarse. Es el movimiento de las tarjetas 1 y 3 y de la primera del entrenamiento (Mark y la comida rápida).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 1, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m2)\">Pregunta problematizadora<\/span><span class=\"kicker\">Libro abierto en la pregunta modelo<\/span><\/div><h2>Abran el libro: tarjeta 1, página 457<\/h2><p class=\"lead\">Antes de buscar la pista: ¿cuál creen que es? Levanten la mano.<\/p><p class=\"en xl\" lang=\"en\">The text implies that human existence is fundamentally dependent on which of the following principles?<\/p><ul class=\"eops\"><li><b>A<\/b><span>The successful agricultural domestication of various animal and plant species.<\/span><\/li><li><b>B<\/b><span>The ongoing advancement of humanity&#x27;s technological and industrial innovations.<\/span><\/li><li><b>C<\/b><span>The intricate and delicate balance of key planetary biological processes.<\/span><\/li><li><b>D<\/b><span>The complete separation of urban environments from natural ecological systems.<\/span><\/li><\/ul><div class=\"ctl\"><button class=\"btn tally\" data-tally=\"h5A\">A <span class=\"n\" id=\"h5A\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h5B\">B <span class=\"n\" id=\"h5B\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h5C\">C <span class=\"n\" id=\"h5C\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h5D\">D <span class=\"n\" id=\"h5D\">0<\/span><\/button><button class=\"btn\" data-reset=\"h5\">↺<\/button><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta que gobierna el área<\/h3><p class=\"lead\">¿Qué palabra del texto te lo dice?<\/p><p class=\"sub\">Nadie justifica con «me suena» ni con «en español se dice así»: toda respuesta señala la palabra del texto que decide.<\/p><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta de este momento<\/h3><p class=\"lead\">¿Qué frase del texto me deja entender eso?<\/p><\/div>", "guia": {"obj": "Que el estudiante compruebe que en Inglés la respuesta sale de una pista del texto —la palabra vecina, el verbo, el marcador de tiempo, quién habla— y no de lo que suena bonito ni de traducir palabra por palabra.", "decir": ["Presenta la pregunta modelo (la primera de las diez de clase) y la deja a la vista todo el momento.", "Pide respuestas a mano alzada ANTES de buscar la pista, y las cuenta en pantalla.", "Hace la pregunta que gobierna el área: ¿qué palabra del texto te lo dice?", "Al final del momento llena con el grupo el instrumento de esa tarjeta y trabaja por qué cae cada opción."], "como": "Regla del momento: nadie justifica con «me suena» ni con «en español se dice así». Toda intervención señala la palabra del texto que decide.", "apoyo": ["La pregunta modelo es la tarjeta 1 (Bloque 1, n.º 1, libro página 457). El cuaderno se abre en la página 366 solo en «mi primera idea».", "Cuenta las manos tocando cada letra: el número queda en pantalla y sirve para el final del momento, cuando el grupo vea cuántos cambiaron de opinión al encontrar la pista.", "No digas la clave en este momento: sale en el primer bloque del desarrollo guiado, después de llenar el instrumento en pantalla, casilla por casilla."]}}, {"m": 2, "min": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · tarjetas 1 y 3<\/span><span class=\"kicker\">En pantalla, casilla por casilla<\/span><\/div><h2>Tarjetas 1 y 3: primero la pista, después la letra<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Tarjeta 1 · libro p. 457 · Bloque 1, n.º 1<\/span><span class=\"min\" style=\"--accent:#242478\">S1 · Lo que el texto deja entender<\/span><\/div><p class=\"en\">The text implies that human existence is fundamentally dependent on which of the following principles?<\/p><ul class=\"eops\"><li><b>A<\/b><span>The successful agricultural domestication of various animal and plant species.<\/span><\/li><li><b>B<\/b><span>The ongoing advancement of humanity&#x27;s technological and industrial innovations.<\/span><\/li><li><b>C<\/b><span>The intricate and delicate balance of key planetary biological processes.<\/span><\/li><li><b>D<\/b><span>The complete separation of urban environments from natural ecological systems.<\/span><\/li><\/ul><p class=\"ins\">Instrumento: <b style=\"color:#242478\">Quita una pieza y mira qué se cae<\/b>. Llénalo antes de marcar.<\/p><div class=\"clave\" hidden data-grupo=\"k51\"><span class=\"keychip\" style=\"background:#242478\">C<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Tarjeta 3 · libro p. 457 · Bloque 1, n.º 3<\/span><span class=\"min\" style=\"--accent:#242478\">S1 · Lo que el texto deja entender<\/span><\/div><p class=\"en\">From the third paragraph, it can be inferred that local human activities, such as deforestation:<\/p><ul class=\"eops\"><li><b>A<\/b><span>have consequences that are primarily restricted to their immediate geographic areas.<\/span><\/li><li><b>B<\/b><span>represent a necessary sacrifice for the continued economic development of societies.<\/span><\/li><li><b>C<\/b><span>are generally less impactful to the planet than are most natural geological events.<\/span><\/li><li><b>D<\/b><span>possess the significant capacity to alter large-scale global atmospheric systems.<\/span><\/li><\/ul><p class=\"ins\">Instrumento: <b style=\"color:#242478\">Del árbol talado al clima de todos<\/b>. Llénalo antes de marcar.<\/p><div class=\"clave\" hidden data-grupo=\"k51\"><span class=\"keychip\" style=\"background:#242478\">D<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k51\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante llene el instrumento de cada tarjeta —la pista, lo que tacha, el tiempo, la intención— antes de marcar la letra, en las diez tarjetas de clase de la misión.", "decir": ["«Antes de marcar: ¿qué pista escribieron? Léanmela.»", "Si alguien se traba, pregúntale qué palabra vecina mira. Si el instrumento está vacío, vuelve al texto antes que a las opciones."], "como": "No traduce el texto ni dicta la respuesta. Si un estudiante se traba, le pregunta qué palabra vecina mira; si el instrumento está vacío, lo devuelve al texto antes que a las opciones. Las tarjetas del reto y de la casa no se tocan en este momento.", "apoyo": ["Las claves del libro son 1·C y 3·D. No las reveles hasta que todos tengan la pista escrita: el botón es para el cierre del bloque.", "Tarjeta 1 · por qué: «Without this process… most species could not survive»: la vida humana depende de un proceso biológico.", "Tarjeta 3 · por qué: «directly affect the quality of the air we breathe and the stability of our climate»: lo local altera lo global.", "Tarjeta 3 · cómo se dice: deforestation (di-fo-res-TÉI-shon)."]}}, {"m": 2, "min": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#C9821B\">Dinámica · 3 min<\/span><span class=\"kicker\">Entrena la estrategia 3 · La frase que dice más de lo que dice<\/span><\/div><h2>Lo que dice y lo que quiere decir<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>El docente lee una frase figurada: «My room is a jungle», «This homework is a mountain».<\/li><li>El grupo la actúa primero al pie de la letra: monos y árboles; escalar una montaña.<\/li><li>Después la actúa con lo que quiere decir: un cuarto desordenado, una tarea larga.<\/li><li>Alguien dice en español lo que la frase dice de verdad.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Ninguno<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante llene el instrumento de cada tarjeta —la pista, lo que tacha, el tiempo, la intención— antes de marcar la letra, en las diez tarjetas de clase de la misión.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto en inglés en cinco minutos —buscar, tachar, ubicar en el tiempo—, pero con el cuerpo.»"], "como": "No traduce el texto ni dicta la respuesta. Si un estudiante se traba, le pregunta qué palabra vecina mira; si el instrumento está vacío, lo devuelve al texto antes que a las opciones. Las tarjetas del reto y de la casa no se tocan en este momento.", "apoyo": ["Qué movimiento mental entrena: Separar lo que la frase dice de lo que quiere decir. Es el movimiento de las tarjetas 5, 12 y 13 y de la tercera del entrenamiento (If you die, will you enjoy it?).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#5B3E96\">Dinámica · 3 min<\/span><span class=\"kicker\">Entrena la estrategia 4 · Dos cosas frente a frente<\/span><\/div><h2>Frente a frente<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Dos filas, una frente a la otra. Una tiene tarjetas de ANTES y la otra de DESPUÉS de un cambio inventado (un barrio antes y después del parque).<\/li><li>Cada uno lee su tarjeta y busca en la otra fila la que le hace pareja.<\/li><li>Cada pareja dice qué cambió y qué no.<\/li><li>El docente pregunta: ¿qué causó el cambio?<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Diez tarjetas<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante llene el instrumento de cada tarjeta —la pista, lo que tacha, el tiempo, la intención— antes de marcar la letra, en las diez tarjetas de clase de la misión.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto en inglés en cinco minutos —buscar, tachar, ubicar en el tiempo—, pero con el cuerpo.»"], "como": "No traduce el texto ni dicta la respuesta. Si un estudiante se traba, le pregunta qué palabra vecina mira; si el instrumento está vacío, lo devuelve al texto antes que a las opciones. Las tarjetas del reto y de la casa no se tocan en este momento.", "apoyo": ["Qué movimiento mental entrena: Poner dos cosas frente a frente y decir qué las separa. Es el movimiento de las tarjetas 4 y 6 y de la cuarta del entrenamiento (antes y después del espejo).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · tarjetas 4 y 5<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Tarjetas 4 y 5: primero la pista, después la letra<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Tarjeta 4 · libro p. 457 · Bloque 1, n.º 4<\/span><span class=\"min\" style=\"--accent:#5B3E96\">S4 · Dos cosas frente a frente<\/span><\/div><p class=\"en\">The author&#x27;s conclusion about &quot;protecting our own future&quot; reframes environmental conservation as:<\/p><ul class=\"eops\"><li><b>A<\/b><span>a moral duty focused exclusively on the preservation of a variety of non-human species.<\/span><\/li><li><b>B<\/b><span>an essential and pragmatic strategy for ensuring human survival and long-term well-being.<\/span><\/li><li><b>C<\/b><span>an optional recreational activity for communities with sufficient economic and social resources.<\/span><\/li><li><b>D<\/b><span>an economic burden that inevitably limits industrial progress and necessary societal expansion.<\/span><\/li><\/ul><p class=\"ins\">Instrumento: <b style=\"color:#5B3E96\">Dos marcos para el mismo cuadro<\/b>. Llénalo antes de marcar.<\/p><div class=\"clave\" hidden data-grupo=\"k54\"><span class=\"keychip\" style=\"background:#5B3E96\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Tarjeta 5 · libro p. 457 · Bloque 1, n.º 5<\/span><span class=\"min\" style=\"--accent:#C9821B\">S3 · La frase que dice más de lo que dice<\/span><\/div><p class=\"en\">By describing photosynthesis as the &quot;foundation of almost every ecosystem,&quot; the author implies that it is:<\/p><ul class=\"eops\"><li><b>A<\/b><span>a biological process that is important but easily replaceable by other modern energy sources.<\/span><\/li><li><b>B<\/b><span>a biological function that benefits the plant kingdom far more than it benefits animal species.<\/span><\/li><li><b>C<\/b><span>a life-support system whose large-scale disruption would lead to systemic ecological collapse.<\/span><\/li><li><b>D<\/b><span>a natural mechanism that is relevant mainly to the botanical studies of specialized plant life.<\/span><\/li><\/ul><p class=\"ins\">Instrumento: <b style=\"color:#C9821B\">«Foundation» es una palabra de albañil<\/b>. Llénalo antes de marcar.<\/p><div class=\"clave\" hidden data-grupo=\"k54\"><span class=\"keychip\" style=\"background:#C9821B\">C<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k54\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante llene el instrumento de cada tarjeta —la pista, lo que tacha, el tiempo, la intención— antes de marcar la letra, en las diez tarjetas de clase de la misión.", "decir": ["«Antes de marcar: ¿qué pista escribieron? Léanmela.»", "Si alguien se traba, pregúntale qué palabra vecina mira. Si el instrumento está vacío, vuelve al texto antes que a las opciones."], "como": "No traduce el texto ni dicta la respuesta. Si un estudiante se traba, le pregunta qué palabra vecina mira; si el instrumento está vacío, lo devuelve al texto antes que a las opciones. Las tarjetas del reto y de la casa no se tocan en este momento.", "apoyo": ["Las claves del libro son 4·B y 5·C. No las reveles hasta que todos tengan la pista escrita: el botón es para el cierre del bloque.", "Tarjeta 4 · por qué: «not only about saving nature: it is about protecting our own future»: cuidar las plantas nos conviene para sobrevivir. A es el marco viejo («exclusively»).", "Tarjeta 5 · por qué: «foundation» es la base de una casa: si se rompe, se cae todo. C.", "Tarjeta 5 · cómo se dice: photosynthesis (fou-tou-SÍN-ze-sis), foundation (faun-DÉI-shon)."]}}, {"m": 2, "min": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#A82424\">Dinámica · 3 min<\/span><span class=\"kicker\">Entrena la estrategia 2 · Para qué lo pone el autor<\/span><\/div><h2>¿Para qué me lo cuentas?<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Cuatro rincones: PARA DAR UN EJEMPLO, PARA CONTRASTAR, PARA CONVENCER y PARA MOSTRAR QUE PASA CERCA.<\/li><li>El docente lee un párrafo corto con un detalle: «Even in our school, the garden has fewer bees every year».<\/li><li>Cada uno camina al rincón del para qué.<\/li><li>Alguien de cada rincón dice qué idea del párrafo sostiene ese detalle.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cuatro carteles<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante llene el instrumento de cada tarjeta —la pista, lo que tacha, el tiempo, la intención— antes de marcar la letra, en las diez tarjetas de clase de la misión.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto en inglés en cinco minutos —buscar, tachar, ubicar en el tiempo—, pero con el cuerpo.»"], "como": "No traduce el texto ni dicta la respuesta. Si un estudiante se traba, le pregunta qué palabra vecina mira; si el instrumento está vacío, lo devuelve al texto antes que a las opciones. Las tarjetas del reto y de la casa no se tocan en este momento.", "apoyo": ["Qué movimiento mental entrena: Preguntar para qué pone el autor un detalle o un ejemplo. Es el movimiento de las tarjetas 7, 9 y 15 y de la segunda del entrenamiento (Jonathan).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · tarjetas 6 y 7<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Tarjetas 6 y 7: primero la pista, después la letra<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Tarjeta 6 · libro p. 457 · Bloque 1, n.º 6<\/span><span class=\"min\" style=\"--accent:#5B3E96\">S4 · Dos cosas frente a frente<\/span><\/div><p class=\"en\">The text implicitly contrasts the Earth&#x27;s current, photosynthesis-maintained atmosphere with:<\/p><ul class=\"eops\"><li><b>A<\/b><span>a previous or potential atmospheric state that is uninhabitable for complex aerobic life.<\/span><\/li><li><b>B<\/b><span>a hypothetical atmosphere containing much higher levels of oxygen than are present today.<\/span><\/li><li><b>C<\/b><span>a gaseous environment similar to those found on other non-inhabited planets in our solar system.<\/span><\/li><li><b>D<\/b><span>a future atmosphere where advanced technology will fully replace all biological functions.<\/span><\/li><\/ul><p class=\"ins\">Instrumento: <b style=\"color:#5B3E96\">El termómetro del aire: respirable o tóxico<\/b>. Llénalo antes de marcar.<\/p><div class=\"clave\" hidden data-grupo=\"k56\"><span class=\"keychip\" style=\"background:#5B3E96\">A<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Tarjeta 7 · libro p. 457 · Bloque 1, n.º 7<\/span><span class=\"min\" style=\"--accent:#A82424\">S2 · Para qué lo pone el autor<\/span><\/div><p class=\"en\">By mentioning the effects of urban pollution on tree leaves, the author primarily illustrates that:<\/p><ul class=\"eops\"><li><b>A<\/b><span>the inherent resilience of plants allows them to adapt without issue to any environmental conditions.<\/span><\/li><li><b>B<\/b><span>modern technology has nearly eliminated human dependence on the functions of urban plant life.<\/span><\/li><li><b>C<\/b><span>natural environments and human-built ones operate in completely separate and unrelated spheres.<\/span><\/li><li><b>D<\/b><span>threats to photosynthesis are not just distant problems but occur in our immediate daily lives.<\/span><\/li><\/ul><p class=\"ins\">Instrumento: <b style=\"color:#A82424\">La cabeza del lector antes y después del ejemplo<\/b>. Llénalo antes de marcar.<\/p><div class=\"clave\" hidden data-grupo=\"k56\"><span class=\"keychip\" style=\"background:#A82424\">D<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k56\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante llene el instrumento de cada tarjeta —la pista, lo que tacha, el tiempo, la intención— antes de marcar la letra, en las diez tarjetas de clase de la misión.", "decir": ["«Antes de marcar: ¿qué pista escribieron? Léanmela.»", "Si alguien se traba, pregúntale qué palabra vecina mira. Si el instrumento está vacío, vuelve al texto antes que a las opciones."], "como": "No traduce el texto ni dicta la respuesta. Si un estudiante se traba, le pregunta qué palabra vecina mira; si el instrumento está vacío, lo devuelve al texto antes que a las opciones. Las tarjetas del reto y de la casa no se tocan en este momento.", "apoyo": ["Las claves del libro son 6·A y 7·D. No las reveles hasta que todos tengan la pista escrita: el botón es para el cierre del bloque.", "Tarjeta 6 · por qué: «the atmosphere would quickly become toxic»: el contraste es con una atmósfera posible e invivible.", "Tarjeta 6 · cómo se dice: photosynthesis (fou-tou-SÍN-ze-sis).", "Tarjeta 7 · por qué: «In cities, air pollution…» y «may seem distant, but they directly affect…»: la amenaza está cerca. D.", "Tarjeta 7 · cómo se dice: photosynthesis (fou-tou-SÍN-ze-sis)."]}}, {"m": 2, "min": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · tarjetas 9 y 12<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Tarjetas 9 y 12: primero la pista, después la letra<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Tarjeta 9 · libro p. 458 · Bloque 2, n.º 1<\/span><span class=\"min\" style=\"--accent:#A82424\">S2 · Para qué lo pone el autor<\/span><\/div><p class=\"en\">The text&#x27;s description of the musician&#x27;s performance on a &quot;cracked sidewalk&quot; serves to highlight the idea that public spaces:<\/p><ul class=\"eops\"><li><b>A<\/b><span>represent significant physical dangers for performers.<\/span><\/li><li><b>B<\/b><span>require municipal funding for artistic development.<\/span><\/li><li><b>C<\/b><span>are inherently unsuited for cultural gatherings.<\/span><\/li><li><b>D<\/b><span>can be redefined and reclaimed by creative expression.<\/span><\/li><\/ul><p class=\"ins\">Instrumento: <b style=\"color:#A82424\">La misma esquina, con y sin guitarra<\/b>. Llénalo antes de marcar.<\/p><div class=\"clave\" hidden data-grupo=\"k59\"><span class=\"keychip\" style=\"background:#A82424\">D<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Tarjeta 12 · libro p. 459 · Bloque 2, n.º 4<\/span><span class=\"min\" style=\"--accent:#C9821B\">S3 · La frase que dice más de lo que dice<\/span><\/div><p class=\"en\">The phrase &quot;I am here, my story matters&quot; is used to imply that street performance is fundamentally an act of:<\/p><ul class=\"eops\"><li><b>A<\/b><span>commercial negotiation with the passing audience.<\/span><\/li><li><b>B<\/b><span>personal and cultural affirmation against anonymity.<\/span><\/li><li><b>C<\/b><span>organized protest against government policies.<\/span><\/li><li><b>D<\/b><span>professional ambition aimed at being discovered.<\/span><\/li><\/ul><p class=\"ins\">Instrumento: <b style=\"color:#C9821B\">Parte la frase en dos y busca su pareja<\/b>. Llénalo antes de marcar.<\/p><div class=\"clave\" hidden data-grupo=\"k59\"><span class=\"keychip\" style=\"background:#C9821B\">B<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k59\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante llene el instrumento de cada tarjeta —la pista, lo que tacha, el tiempo, la intención— antes de marcar la letra, en las diez tarjetas de clase de la misión.", "decir": ["«Antes de marcar: ¿qué pista escribieron? Léanmela.»", "Si alguien se traba, pregúntale qué palabra vecina mira. Si el instrumento está vacío, vuelve al texto antes que a las opciones."], "como": "No traduce el texto ni dicta la respuesta. Si un estudiante se traba, le pregunta qué palabra vecina mira; si el instrumento está vacío, lo devuelve al texto antes que a las opciones. Las tarjetas del reto y de la casa no se tocan en este momento.", "apoyo": ["Las claves del libro son 9·D y 12·B. No las reveles hasta que todos tengan la pista escrita: el botón es para el cierre del bloque.", "Tarjeta 9 · por qué: Un andén roto se vuelve escenario: «transform public spaces into places of expression». D.", "Tarjeta 9 · cómo se dice: sidewalk (SÁID-uok).", "Tarjeta 12 · por qué: «not only about money. It is also about visibility and dignity»: decir «existo y valgo». B.", "Tarjeta 12 · cómo se dice: anonymity (a-no-NÍ-mi-ti)."]}}, {"m": 2, "min": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · tarjetas 13 y 15<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Tarjetas 13 y 15: primero la pista, después la letra<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Tarjeta 13 · libro p. 459 · Bloque 2, n.º 5<\/span><span class=\"min\" style=\"--accent:#C9821B\">S3 · La frase que dice más de lo que dice<\/span><\/div><p class=\"en\">The author&#x27;s concluding statement that Colombians are &quot;unwilling to let silence define their cities&quot; frames street music as a form of:<\/p><ul class=\"eops\"><li><b>A<\/b><span>historical preservation of nearly forgotten art forms.<\/span><\/li><li><b>B<\/b><span>simple background entertainment for city dwellers.<\/span><\/li><li><b>C<\/b><span>structured musical education for the population.<\/span><\/li><li><b>D<\/b><span>defiant cultural vitality against urban indifference.<\/span><\/li><\/ul><p class=\"ins\">Instrumento: <b style=\"color:#C9821B\">El silencio como personaje<\/b>. Llénalo antes de marcar.<\/p><div class=\"clave\" hidden data-grupo=\"k513\"><span class=\"keychip\" style=\"background:#C9821B\">D<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Tarjeta 15 · libro p. 459 · Bloque 2, n.º 7<\/span><span class=\"min\" style=\"--accent:#A82424\">S2 · Para qué lo pone el autor<\/span><\/div><p class=\"en\">The author introduces the complaint about noise and blocked sidewalks in the final paragraph primarily to:<\/p><ul class=\"eops\"><li><b>A<\/b><span>suggest that street music should be more heavily regulated.<\/span><\/li><li><b>B<\/b><span>create a counterargument that is then overcome by a greater ideal.<\/span><\/li><li><b>C<\/b><span>conclude that the negative aspects ultimately outweigh the positive ones.<\/span><\/li><li><b>D<\/b><span>admit that the central issue of the text is far too complex to resolve.<\/span><\/li><\/ul><p class=\"ins\">Instrumento: <b style=\"color:#A82424\">Dos voces en la balanza y quién gana<\/b>. Llénalo antes de marcar.<\/p><div class=\"clave\" hidden data-grupo=\"k513\"><span class=\"keychip\" style=\"background:#A82424\">B<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k513\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante llene el instrumento de cada tarjeta —la pista, lo que tacha, el tiempo, la intención— antes de marcar la letra, en las diez tarjetas de clase de la misión.", "decir": ["«Antes de marcar: ¿qué pista escribieron? Léanmela.»", "Si alguien se traba, pregúntale qué palabra vecina mira. Si el instrumento está vacío, vuelve al texto antes que a las opciones."], "como": "No traduce el texto ni dicta la respuesta. Si un estudiante se traba, le pregunta qué palabra vecina mira; si el instrumento está vacío, lo devuelve al texto antes que a las opciones. Las tarjetas del reto y de la casa no se tocan en este momento.", "apoyo": ["Las claves del libro son 13·D y 15·B. No las reveles hasta que todos tengan la pista escrita: el botón es para el cierre del bloque.", "Tarjeta 13 · por qué: «resilient, creative, and unwilling to let silence define their cities», frente a la gente que pasa de afán del primer párrafo. D.", "Tarjeta 13 · Del libro (atención): «Urban indifference» no está en el texto: se infiere del primer párrafo (la gente que pasa de afán). Qué haces: La tarjeta lo arma: ¿dónde estaba el silencio en el primer párrafo?", "Tarjeta 15 · por qué: «Some people complain… Others, however, argue…»: la queja se pone para superarla. B.", "Tarjeta 15 · cómo se dice: sidewalk (SÁID-uok)."]}}, {"m": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m4)\">Reto en equipo · 20 min<\/span><span class=\"kicker\">Equipos de tres · cada uno responde en su cuaderno<\/span><\/div><h2>Reto del corte: La prueba en la mano<\/h2><div class=\"card big edge mt\" style=\"--accent:var(--m4)\"><p class=\"lead\">Equipos de tres con las seis tarjetas que no se hicieron en clase (2, 8, 10, 11, 14 y 16). Cada integrante se hace dueño de dos y las llena en su cuaderno: lo que se infiere y la frase del texto que lo prueba, copiada. En el relevo, cada dueño lee su frase y los otros dos llenan esa tarjeta en su cuaderno. Gana la defensa que señale la frase exacta; si una respuesta no se puede señalar en el texto, el equipo la tacha.<\/p><div class=\"nums\"><span>2<\/span><span>8<\/span><span>10<\/span><span>11<\/span><span>14<\/span><span>16<\/span><\/div><p class=\"sub\">Cuaderno, páginas 366, 369 y 371 a 374.<\/p><div class=\"ctl\"><button class=\"btn\" data-show=\"reto5\">Revelar las claves del reto<\/button><\/div><div class=\"clave kgrid\" id=\"reto5\" hidden><span class=\"kg\"><span>2<\/span>A<\/span><span class=\"kg\"><span>8<\/span>B<\/span><span class=\"kg\"><span>10<\/span>A<\/span><span class=\"kg\"><span>11<\/span>A<\/span><span class=\"kg\"><span>14<\/span>C<\/span><span class=\"kg\"><span>16<\/span>A<\/span><\/div><\/div><div class=\"note mt\" style=\"--accent:var(--m4)\"><b>La defensa:<\/b> tres minutos por equipo, leyendo en voz alta la palabra del texto que decide. «Es que suena mejor» no cuenta.<\/div>", "guia": {"obj": "Que el estudiante defienda su respuesta con la pista en la mano y acepte que otro equipo puede ver una pista que él no vio.", "decir": ["Arma equipos de tres y anuncia el reto del corte de la misión.", "Cada integrante trabaja primero su parte, en SU cuaderno.", "Da tres minutos de defensa por equipo: leen en voz alta la palabra que decide.", "Cierra con las claves del reto (en la guía, con «Revelar»)."], "como": "El equipo discute, pero cada uno escribe en su propio cuaderno. No se acepta «es que suena mejor»: se nombra la pista. Si el libro tiene una «Corrección EDUCATE» en el reto, se discute ahí.", "apoyo": ["Las claves del reto: 2·A, 8·B, 10·A, 11·A, 14·C, 16·A. Revélalas al final, después de las defensas.", "Si un equipo entrega una sola hoja para los tres, el reto no cuenta. La discusión es compartida; el registro es individual, en el cuaderno de cada uno.", "Tarjeta 14 · Del libro (atención): La clave C se sostiene con los tambores y «shared roots», pero el rap del texto improvisa «about politics or love». Qué haces: Es del reto. Es la mejor de las cuatro."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 1<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Swift Pizza and Sandwich House<\/h3><p lang=\"en\">SWIFT PIZZA AND SANDWICH HOUSE<\/p><p lang=\"en\">Today we have the pleasure of showing you the best letter written by our customer Mark. He wins £25 for writing about us this week. He is so happy with the orders at Swift Pizza and Sandwich House that he wants to declare a holiday to celebrate his experience here: &quot;Happy burgerday and Merry Sandwichmas to everyone!&quot; he wrote.<\/p><p lang=\"en\">Wednesday May 18, 2011. One typical day I was too tired after working all day long to cook for myself, and I was very hungry. I really wanted something to eat, so I decided to find a burger. I ordered a half-pound burger and a lamb and chicken sandwich. I also had some special requests about extra cheese and vegetables.<\/p><p lang=\"en\">Food arrived very fast (less than twenty minutes) and was hot and fresh. The burger was delicious, and left me wanting more – fortunately I had the sandwich left. It felt as if it was cut just a minute before I opened it – juicy, fresh, and great. Every single special request I made was completely satisfied, 100%! And the best thing was that all of the above and some drinks cost me ONLY 10 dollars! If that doesn&#x27;t say value for money, I don&#x27;t know what it does.<\/p><p lang=\"en\">It certainly feels great to find new excellent food delivery companies for whenever you don&#x27;t feel like cooking yourself. I recently had a sad experience with my usual take away restaurant, so I decided to change to something else – and on my first try I got what I wanted! Order now from Swift Pizza and Sandwich House. Mark<\/p><\/div><div><p class=\"enun\">It can be inferred from the text that Mark<\/p><div class=\"ops\" id=\"icf51\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>does not like cooking food for himself.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>almost always eats hamburgers.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>enjoys eating fast food sometimes.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>is tired of going to restaurants.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf51\" data-k=\"C\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la subestrategia a preguntas tipo Saber 11, con textos que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué pista escribiste en el instrumento antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["⚑ Texto con erratas corregidas por EDUCATE; pendiente de decisión.", "La clave es la C. Por qué: tres frases dicen la frecuencia: «One typical day… too tired… to cook», «for whenever you don't feel like cooking yourself» y «my usual take away restaurant». Mark pide comida rápida algunas veces y le gusta: C. La A exagera (no dice que no le guste cocinar, sino que a veces no tiene ganas); «almost always» (B) y «tired of going to restaurants» (D) no están en el texto.", "Texto con erratas corregidas por EDUCATE; pendiente de decisión. El cuadernillo dice «It left as if it was cut…»; el cuaderno imprime «It felt as if…», como lo trae el SIMULACRO II 2023.", "La inferencia sale de las palabras de frecuencia: one typical day, whenever, usual."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 2<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Jonathan&#x27;s trip to Colombia<\/h3><p lang=\"en\">JONATHAN&#x27;S TRIP TO COLOMBIA<\/p><p lang=\"en\">I went to Colombia last summer. My journey began on the Caribbean coast and ended on the border with Ecuador. Colombia is a splendid country, extremely diverse and full of wonderful people. I will tell you why.<\/p><p lang=\"en\">In South Colombia there is a city called Pereira, just outside you can find an area where you will see the farm Villa Maria – a hidden paradise that takes a long time to get to. It is a working coffee farm located in the middle of a valley. Coffee and plantain grow as far as the eye can see. The farm is made up of the house and the processing plant. The family business has guests at the house for just $45.000 a night. This includes three home-cooked meals a day, a swimming pool, and as much coffee as you can drink. The scene is quite unbelievable. Bamboo chairs rest on the corners of the Villa, mangos hang from the trees and parrots and birds fly wild.<\/p><p lang=\"en\">A wonderful man named Hector who runs the farm is happy to show guests around the coffee processing plant. By day, the only sounds are of the horses coming down the valley side carrying food. By night, the wildlife comes alive, and depending on the time of the year thunderstorms offer a spectacular light show. For those who wish to escape, Villa Maria is the answer.<\/p><p lang=\"en\">This is just one attraction of many in Colombia. I could write pages on the country and not get bored. I graduate next year and I can&#x27;t wait to return to this beautiful country. Some of you reading this may feel inspired to do the same.<\/p><\/div><div><p class=\"enun\">What is the writer trying to do in this article?<\/p><div class=\"ops\" id=\"icf52\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>encouraging tourists to visit Colombia.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>convincing people to buy a Colombian coffee farm.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>telling readers to run a coffee business in Colombia.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>inviting tourists to write about places they visit in Colombia.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf52\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la subestrategia a preguntas tipo Saber 11, con textos que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué pista escribiste en el instrumento antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["⚑ Texto con erratas corregidas por EDUCATE; pendiente de decisión.", "La clave es la A. Por qué: el texto describe el país y la finca y cierra con «Some of you reading this may feel inspired to do the same»: lo mismo que él, viajar y volver a Colombia. Todo lo de la finca está al servicio de esa invitación: A. Comprar la finca (B) o manejar un negocio de café (C) no aparecen; escribir sobre los lugares (D) es lo que hace él, no lo que pide.", "Texto con erratas corregidas por EDUCATE; pendiente de decisión. El cuadernillo trae doce erratas de impresión («Faador», «Cdombia», «caled Perera», «Vila Maria»…); el cuaderno las corrige sin cambiar nada más.", "El propósito se ve en la última oración. Pide que la lean en voz alta antes de las opciones."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 3<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>My trip to Bogota and others<\/h3><p lang=\"en\">MY TRIP TO BOGOTA AND OTHERS<\/p><p lang=\"en\">I arrived in Bogotá feeling excited and ready to explore a big city. Unfortunately, many hours of unstoppable rain didn&#x27;t allow me to go out for a while. It rains a lot there, maybe more than in Wales, and I never thought that was possible.<\/p><p lang=\"en\">First: I decided to visit a museum. I think museums are now more interesting and enjoyable places than before. I visited the gold museum and saw the gold from all over Colombia. Ancient people used to stick little gold pieces to their clothes during religious activities. They never considered it as a valuable metal. I wonder why people love gold and money so much nowadays, it&#x27;s nothing special, just a metal. If you die, will you enjoy it?<\/p><p lang=\"en\">After that, I went and stayed with a family I met at the museum. They invited me to stay with them in Chía. They live on the land that used to be their parents&#x27; farm. That&#x27;s why they have divided it in smaller parts, which means that they all live close to, next to, opposite or near each other. That is one really close and warm family! The houses are old and badly arranged, built by themselves in different styles, but all beautiful and amazing. To have such a beautiful sense of family was something I had not seen in my whole life.<\/p><p lang=\"en\">Finally, we went to a restaurant called &quot;EL PORTICO&quot;. It&#x27;s a huge place, with a fantastic view, and the food I ate was great. This was the part I like the most Colombian food is magnificent.<\/p><\/div><div><p class=\"enun\">What do we know about the writer&#x27;s attitude towards life?<\/p><div class=\"ops\" id=\"icf53\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>A place is really boring when it rains.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>Other things are more important than money.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>Food must always be well prepared.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Museums are the best places in the world.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf53\" data-k=\"B\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la subestrategia a preguntas tipo Saber 11, con textos que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué pista escribiste en el instrumento antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["⚑ Texto con erratas corregidas por EDUCATE; pendiente de decisión.", "La clave es la B. Por qué: «I wonder why people love gold and money so much nowadays, it's nothing special, just a metal. If you die, will you enjoy it?» y, después, lo que admira es la familia unida de Chía. Para él hay cosas más importantes que el dinero: B. La lluvia (A) y la comida (C) son detalles del viaje, no su actitud ante la vida; D exagera lo que dice de los museos.", "Texto con erratas corregidas por EDUCATE; pendiente de decisión. Erratas de digitación del simulacro corregidas: «avaluable» → «a valuable», «to say with them» → «to stay with them», «That`s why They» → «That's why they». La última oración se deja sin puntuación, como en la fuente.", "«If you die, will you enjoy it?» es una pregunta retórica: no espera respuesta, afirma que el dinero no sirve después de la muerte."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 4<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>What to wear?<\/h3><p lang=\"en\">WHAT TO WEAR?<\/p><p lang=\"en\">Hello dear readers.<\/p><p lang=\"en\">It&#x27;s February and London Fashion Week has just ended. Fashion shows have been happening around the city. Magazines are full of chats about who the model of the moment is. Superstars and journalists have announced what the best dressed will be wearing in the coming seasons. Honestly, clothes can make you happy. I have decided that tomorrow I will dress success.<\/p><p lang=\"en\">At 7.30 AM, I remember my promise. I decided that dressing for success means more than putting on my clothes the right way. I need to look good and feel good! The right clothing will make me feel confident and all my problems will disappear. Colleagues will be proud of me and I will get a better position.<\/p><p lang=\"en\">I open my closet and notice that most of my clothes are black, brown and grey. They hang down sadly on their hangers. Are they depressed? I decide that a bright color is needed for successful dressing, and choose a red sweater. Now, I also want to look cool and casual – I take the blue jean shorts. Finally, it&#x27;s cold outside; black tights and long boots are a fashion rule. I look in the mirror. I realize that I wore exactly the same clothing two days ago. That was the day I lost my purse and had an argument with my partner. Not what you would call a successful day. I look in my closet. My black, grey and brown clothes seem to fall even further down. I shut the drawer of my closet and think that success is a state of mind and decide not to pay attention to London Fashion Week.<\/p><\/div><div><p class=\"enun\">The writer&#x27;s opinion changed because<\/p><div class=\"ops\" id=\"icf54\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>nothing good happened when she wore the same.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>she realized that she couldn&#x27;t feel or look better.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>she had only dark color clothing to wear.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>her clothes looked really miserable.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf54\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la subestrategia a preguntas tipo Saber 11, con textos que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué pista escribiste en el instrumento antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["⚑ Texto con erratas corregidas por EDUCATE; pendiente de decisión.", "La clave es la A. Por qué: frente al espejo recuerda que llevó la misma ropa el día en que perdió el bolso y discutió con su pareja: «Not what you would call a successful day». Por eso deja de creer que la ropa da el éxito: A. B es falsa; C es cierta (casi toda su ropa es oscura) pero no es lo que la hace cambiar; D toma al pie de la letra la broma de la ropa «deprimida».", "Texto con erratas corregidas por EDUCATE; pendiente de decisión. Solo se pasaron a minúscula dos mayúsculas de digitación; «I will dress success» (falta «for») se deja como está en la fuente.", "Antes y después del espejo: lo que creía a las 7.30 y lo que piensa al cerrar el clóset. La causa está en el medio."]}}, {"m": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m6)\">Cierre<\/span><span class=\"kicker\">La pregunta de siempre<\/span><\/div><h2>¿En qué se parecía la pregunta Saber 11 a la de tu libro?<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:#242478\"><div class=\"k\">1<\/div><div><b>Lo que el texto deja entender<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#A82424\"><div class=\"k\">2<\/div><div><b>Para qué lo pone el autor<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#C9821B\"><div class=\"k\">3<\/div><div><b>La frase que dice más de lo que dice<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#5B3E96\"><div class=\"k\">4<\/div><div><b>Dos cosas frente a frente<\/b><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--m6)\"><h3>Antes de salir<\/h3><ol class=\"pasos\"><li>La palabra o la expresión del día, en la franja de vocabulario, con tus palabras.<\/li><li>«Lo que me llevo de esta pregunta».<\/li><li>Tu carita de salida.<\/li><li>La casilla 5 de la portada del área.<\/li><\/ol><\/div><\/div><div class=\"card edge mt\" style=\"--accent:var(--oro)\"><h3>Para la casa<\/h3><p>Esta misión no deja tarea: todas sus tarjetas se hicieron en clase o en el reto.<\/p><\/div>", "guia": {"obj": "Que el estudiante nombre la subestrategia que usó, sepa qué tarjetas quedan para la casa y se lleve una palabra o una expresión nueva, escrita en sus palabras.", "decir": ["Socializa solo las preguntas que el grupo falló, pidiendo la pista que las resuelve.", "Dice en voz alta la tarea de la misión y cuándo se revisa (está en la última diapositiva).", "Cada uno escribe la palabra del día en la franja de vocabulario y marca su carita de salida."], "como": "No dicta traducciones. La palabra se escribe como el estudiante la entendió; si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase.", "apoyo": ["Di la tarea en voz alta y que la anoten: no hay.", "La palabra nueva no se dicta. Si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase: es mejor que dictarla bien.", "Para el cierre del momento: La misión no deja tarea: diez tarjetas en clase y seis en el reto. Son preguntas largas: en el desarrollo guiado cada texto se lee una vez, entero, antes de su primer bloque de tarjetas."]}}];
var MOM = [{"n": 1, "nom": "Activación", "min": 15, "c": "--m1"}, {"n": 2, "nom": "Pregunta problematizadora", "min": 20, "c": "--m2"}, {"n": 3, "nom": "Desarrollo guiado", "min": 35, "c": "--m3"}, {"n": 4, "nom": "Reto en equipo", "min": 20, "c": "--m4"}, {"n": 5, "nom": "Evaluación individual", "min": 20, "c": "--m5"}, {"n": 6, "nom": "Cierre", "min": 10, "c": "--m6"}];
var NOMBRE = document.getElementById("momnom").textContent, SUB = document.getElementById("momsub").textContent;
var $ = function(s){ return document.querySelector(s); };
var wrap = $("#wrap"), stage = $("#stage"), i = 0;
var tBase = 0, tLeft = 0, tOn = false, tick = null;
var elegidas = [];
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function paintClock(){
  var n = $("#tnum");
  if(!tBase){ n.textContent = "—"; n.classList.remove("over"); return; }
  var s = Math.abs(tLeft), mm = Math.floor(s/60), ss = s%60;
  n.textContent = (tLeft<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", tLeft<0);
}
function setTimer(min){
  tBase = min||0; tLeft = tBase*60; tOn = false;
  if(tick){ clearInterval(tick); tick = null; }
  $("#play").textContent = "Iniciar"; paintClock();
}
function toggleTimer(){
  if(!tBase) return;
  tOn = !tOn; $("#play").textContent = tOn ? "Pausar" : "Seguir";
  if(tick){ clearInterval(tick); tick = null; }
  if(tOn) tick = setInterval(function(){ tLeft--; paintClock(); }, 1000);
  paintClock();
}
function guiaHTML(g){
  if(!g) return '<p class="sub">Sin notas para esta diapositiva.</p>';
  var h = '<div class="gbox"><h4>Objetivo</h4><p>'+esc(g.obj)+'</p></div>';
  if(g.decir && g.decir.length) h += '<div class="gbox"><h4>Qué haces y qué dices</h4><ul>'+
     g.decir.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  if(g.como) h += '<div class="gbox como"><h4>Lo que no haces</h4><p>'+esc(g.como)+'</p></div>';
  if(g.apoyo && g.apoyo.length) h += '<div class="gbox apoyo"><h4>Si Inglés no es tu fuerte</h4><ul>'+
     g.apoyo.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  return h;
}
function pintaElegidas(){
  var box = document.getElementById("elegidas"); if(!box) return;
  if(!elegidas.length){ box.innerHTML = '<p class="sub">Vuelve a la diapositiva anterior y escoge las cinco.</p>'; return; }
  box.innerHTML = elegidas.map(function(t,k){
    return '<div class="card edge" style="--accent:var(--m'+((k%6)+1)+')"><h3>'+(k+1)+'. '+esc(t)+'</h3>'+
      '<p class="sub">Busca esta pregunta en tu simulacro y en la hoja de taller de la misma estrategia.</p></div>';
  }).join("");
}
function go(n){
  var prev = SC[i];
  i = Math.max(0, Math.min(SC.length-1, n));
  var s = SC[i];
  wrap.innerHTML = s.html;
  wrap.classList.remove("enter"); void wrap.offsetWidth; wrap.classList.add("enter");
  stage.scrollTop = 0;
  var m = s.m!=null ? MOM[s.m] : null;
  $("#momdot").style.background = m ? "var("+m.c+")" : "var(--faint)";
  $("#momdot").textContent = m ? m.n : "·";
  $("#momnom").textContent = m ? m.nom : NOMBRE;
  $("#momsub").textContent = m ? (m.min+" minutos") : SUB;
  var want = s.min!=null ? s.min : (m ? m.min : 0);
  var cambio = !prev || prev===s || prev.m!==s.m || (prev.min||null)!==(s.min||null);
  if(cambio) setTimer(want);
  $("#count").textContent = (i+1)+" / "+SC.length;
  $("#prog i").style.width = (SC.length>1 ? i/(SC.length-1)*100 : 100)+"%";
  $("#guiabody").innerHTML = guiaHTML(s.guia);
  [].forEach.call(wrap.querySelectorAll("[data-pick]"), function(b){
    b.setAttribute("aria-pressed", elegidas.indexOf(b.textContent)>=0 ? "true" : "false"); });
  pintaElegidas();
}
wrap.addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.dataset.show){ var t = document.getElementById(b.dataset.show); if(t) t.hidden = !t.hidden; }
  if(b.dataset.showgrupo){
    var g = wrap.querySelectorAll('[data-grupo="'+b.dataset.showgrupo+'"]'), abrir = g.length && g[0].hidden;
    [].forEach.call(g, function(x){ x.hidden = !abrir; });
    b.textContent = abrir ? "Ocultar las claves" : "Revelar las claves";
  }
  if(b.dataset.clave){
    var box = document.getElementById(b.dataset.clave), ok = box.querySelector('[data-op="'+b.dataset.k+'"]');
    var on = ok && !ok.classList.contains("ok");
    [].forEach.call(box.querySelectorAll(".op"), function(o){ o.classList.remove("ok"); });
    if(on) ok.classList.add("ok");
    b.textContent = on ? "Ocultar la clave" : "Revelar la clave";
  }
  if(b.dataset.tally){ var n = document.getElementById(b.dataset.tally); n.textContent = (+n.textContent||0)+1; }
  if(b.dataset.reset){ [].forEach.call(wrap.querySelectorAll('[id^="'+b.dataset.reset+'"]'), function(x){
    if(x.classList.contains("n")) x.textContent = "0"; }); }
  if(b.dataset.pick!=null){
    var t = b.textContent, k = elegidas.indexOf(t);
    if(k>=0) elegidas.splice(k,1); else if(elegidas.length<5) elegidas.push(t);
    b.setAttribute("aria-pressed", elegidas.indexOf(t)>=0 ? "true" : "false");
  }
});
function setGuia(on){ $("#guia").classList.toggle("open", on); $("#scrim").classList.toggle("on", on);
  $("#gbtn").setAttribute("aria-pressed", on ? "true" : "false"); }
$("#next").addEventListener("click", function(){ go(i+1); });
$("#prev").addEventListener("click", function(){ go(i-1); });
$("#play").addEventListener("click", toggleTimer);
$("#reset").addEventListener("click", function(){ setTimer(tBase); });
$("#gbtn").addEventListener("click", function(){ setGuia(!$("#guia").classList.contains("open")); });
$("#gclose").addEventListener("click", function(){ setGuia(false); });
$("#scrim").addEventListener("click", function(){ setGuia(false); });
document.addEventListener("keydown", function(e){
  var t = e.target.tagName; if(t==="INPUT"||t==="TEXTAREA") return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ go(i+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ go(i-1); e.preventDefault(); }
  else if(e.key==="Home"){ go(0); e.preventDefault(); }
  else if(e.key==="End"){ go(SC.length-1); e.preventDefault(); }
  else if(e.key==="g"||e.key==="G"){ setGuia(!$("#guia").classList.contains("open")); }
  else if(e.key==="t"||e.key==="T"){ toggleTimer(); }
  else if(e.key==="Escape"){ setGuia(false); }
});
go(0);
})();
</script>
</body>
</html>
