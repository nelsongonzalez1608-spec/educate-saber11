<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inglés · Clase 6</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>[hidden]{display:none!important}
:root{
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --text:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --area:#1BA0A8; --azul:#1F4E8C; --oro:#B0711A; --morado:#5B3E96; --verde:#2E7A39;
  --m1:#1BA0A8; --m2:#1F4E8C; --m3:#3B3BA6; --m4:#5B3E96; --m5:#A82424; --m6:#4A5A70; --rojo:#A82424;
  --ink:#1B1F27; --muted:#5C6472; --faint:#A9B0BB; --line:#E3E7ED; --paper:#FFFFFF; --bg:#F6F4F1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:clamp(16px,1.25vw,21px);line-height:1.5}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
#top{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding:10px clamp(14px,2vw,28px);background:var(--paper);flex-wrap:wrap}
.logo img{height:clamp(28px,2.6vw,40px);display:block}
#mom{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
#momdot{width:clamp(30px,2.4vw,40px);height:clamp(30px,2.4vw,40px);border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;background:var(--faint)}
#momnom{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.2vw,20px)}
#momsub{color:var(--muted);font-size:.85em}
#clock{display:flex;align-items:center;gap:8px}
#tnum{font-family:var(--display);font-weight:800;font-size:clamp(20px,1.8vw,30px);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
#tnum.over{color:var(--area)}
.btn{appearance:none;font:inherit;font-size:.86em;font-weight:600;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.solid{background:var(--area);border-color:var(--area);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#stage{overflow:auto;padding:clamp(18px,3vw,48px) clamp(16px,4vw,72px)}
#wrap{max-width:1500px;margin:0 auto}
#wrap.enter{animation:ent .28s ease-out}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bot{display:flex;align-items:center;gap:12px;padding:10px clamp(14px,2vw,28px);background:var(--paper)}
#prog{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
#prog i{display:block;height:100%;background:var(--area);transition:width .25s}
#count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
#hint{color:var(--faint);font-size:.8em}
@media (max-width:760px){#hint{display:none}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.2vw,68px);line-height:1.05;margin:.2em 0 .25em;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,2.8vw,46px);line-height:1.1;margin:.25em 0 .3em;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:clamp(18px,1.5vw,26px);margin:.1em 0 .4em;line-height:1.2}
p{margin:.35em 0 .6em}
.lead{font-size:1.2em;line-height:1.45;max-width:70ch}
.sub{color:var(--muted)}
.mt{margin-top:clamp(14px,1.8vw,26px)}
.logo-xl img{height:clamp(54px,6vw,96px);margin-bottom:12px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tag,.min,.membrete{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.78em;font-weight:700;letter-spacing:.02em}
.tag{background:var(--ink);color:#fff}
.min{background:var(--accent,var(--area));color:#fff}
.membrete{border:1.5px solid var(--line);color:var(--muted)}
.kicker{color:var(--muted);font-size:.85em;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.grid{display:grid;gap:clamp(12px,1.4vw,22px)}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid>*{min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,1.6vw,24px)}
.card.edge{border-left:6px solid var(--accent,var(--area))}
.card.big .lead{font-size:1.3em}
.step{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px}
.step .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;flex:none}
.note{border-left:5px solid var(--accent,var(--area));background:var(--paper);border-radius:10px;padding:10px 16px;margin-top:12px}
.cita{font-family:var(--display);font-weight:600;line-height:1.35;background:var(--paper);border-left:6px solid var(--area);border-radius:12px;padding:clamp(16px,2vw,30px);margin:18px 0}
.cita.xl{font-size:clamp(24px,2.6vw,44px)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally .n{display:inline-block;min-width:1.6em;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.pasos{margin:.2em 0 0;padding-left:1.3em}.pasos li{margin:.3em 0}
.sello{margin-top:12px;border:2px dashed var(--oro);border-radius:12px;padding:10px 14px;background:#FDF6EA}
.sello b{display:block;color:var(--oro);font-size:.8em;letter-spacing:.06em;text-transform:uppercase}
.clave{margin-top:12px;display:flex;align-items:center;gap:10px;font-weight:600}
.keychip{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:10px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.2em}
.aviso{margin-top:10px;border-radius:10px;padding:10px 14px;background:#FBEFEF;border-left:5px solid var(--area);font-size:.92em}
.aviso.sev-aten{background:#EDF5EE;border-left-color:var(--verde)}
.aviso.sev-medi{background:#FDF5E7;border-left-color:var(--oro)}
.icfes .texto{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.6vw,24px);max-height:62vh;overflow:auto;font-size:.95em}
.enun{font-weight:600;font-size:1.08em}
.ops{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.op .L{flex:none;width:1.8em;height:1.8em;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-family:var(--display);font-weight:800}
.op.ok{border-color:var(--verde);background:#EDF5EE}.op.ok .L{background:var(--verde);color:#fff}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick[aria-pressed="true"]{background:var(--area);border-color:var(--area);color:#fff}
#scrim{position:fixed;inset:0;background:rgba(15,18,24,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#guia{position:fixed;top:0;right:0;height:100%;width:min(520px,92vw);background:var(--paper);box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column;z-index:10}
#guia.open{transform:none}
#guiahead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg)}
#guiabody{overflow:auto;padding:16px 20px 30px;font-size:.92em}
.gbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.gbox h4{margin:0 0 6px;font-family:var(--display);font-size:.8em;letter-spacing:.07em;text-transform:uppercase;color:var(--area)}
.gbox ul{margin:0;padding-left:1.1em}.gbox li{margin:.35em 0}
.gbox.como{background:#F6F7F9}.gbox.como h4{color:var(--muted)}
.gbox.apoyo{background:#FDF6EA;border-color:#EAD9B4}.gbox.apoyo h4{color:var(--oro)}
.examen{background:var(--paper);border:1px solid var(--line);border-left:8px solid var(--area);border-radius:22px;padding:clamp(16px,2.4vw,40px);margin-top:clamp(12px,1.6vw,24px);text-align:center}
.relojxl{font-family:var(--display);font-weight:800;font-size:clamp(96px,17vw,280px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.relojxl.over{color:var(--area)}
.exhoras{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 36px;color:var(--muted);font-size:1.15em;margin-top:10px}
.exhoras b{color:var(--ink);font-variant-numeric:tabular-nums}
.nbig{font-family:var(--display);font-weight:800;font-size:clamp(40px,4vw,64px);line-height:1;color:var(--accent,var(--area))}
.asig{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:8px 0}
.asig .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;flex:none}
.asig label{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted)}
.asig label.w{flex:1;min-width:min(100%,260px)}
.campo{font:inherit;font-size:1.1em;font-weight:700;color:var(--ink);border:none;border-bottom:2px dashed var(--faint);background:transparent;padding:4px 6px;min-width:0;flex:1;outline:none}
.campo.n{width:4.5em;flex:none;text-align:center}
.campo:focus{border-bottom-color:var(--area)}
.nums1{border:1.5px solid var(--line);border-radius:999px;padding:3px 14px;background:var(--paper);font-weight:600;color:var(--muted)}
.nums1 b{color:var(--ink)}
.pides{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:1.08em}
.pide{display:inline-flex;align-items:center;gap:8px}
.chk{display:inline-block;width:20px;height:20px;border:2px solid var(--area);border-radius:4px;background:#fff;flex:none}
.herrs{display:grid;gap:clamp(12px,1.4vw,22px);grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.herr{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--area);border-radius:16px;padding:14px 18px;font-size:1.12em}
.herr svg{flex:none}
[hidden]{display:none!important}
.en{font-family:var(--display);font-weight:600;font-size:1.32em;line-height:1.35;margin:.4em 0 .5em;color:var(--ink)}
.en.xl{font-size:1.6em}
.eops{list-style:none;margin:.3em 0 .6em;padding:0;display:grid;gap:4px}
.eops li{display:flex;gap:10px;align-items:baseline;font-size:1.12em;line-height:1.3}
.eops li b{flex:none;width:1.6em;height:1.6em;border-radius:7px;display:inline-grid;place-items:center;background:var(--bg);font-family:var(--display);font-size:.85em}
.eops.banco{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.ins{font-size:.95em;color:var(--muted);margin:.2em 0}
.corr{margin-top:10px;border-left:5px solid #242478;background:#F2F3FA;border-radius:10px;padding:8px 14px;font-size:.92em}
.corr b{display:block;color:#242478;font-size:.78em;letter-spacing:.06em;text-transform:uppercase}
.kgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.kg{display:inline-flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--paper);font-weight:700}
.kg span{color:var(--muted);font-weight:600}
.nums{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nums span{border:1.5px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:700;background:var(--paper)}
.op .L{flex:none}
.icfes .texto{font-size:1.1em;line-height:1.5}
.icfes .texto .en{font-size:1.5em}
.icfes .op{font-size:1.08em}
.icfes .enun{font-size:1.18em}
</style>
</head>

mpo, páginas 468 a 470; hoy, diez en clase<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m4)\"><h3>Tu cuaderno<\/h3><p class=\"sub\">Páginas 376 a 389<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m6)\"><h3>Hoy<\/h3><p class=\"sub\">120 minutos · 6 momentos · Parte 7 · texto con espacios<\/p><\/div><\/div>", "guia": {"obj": "Que el grupo sepa desde el primer minuto qué va a pasar en estos 120 minutos y qué tiene que tener sobre la mesa.", "decir": ["«Libro abierto, cuaderno cerrado, lápiz. Hoy nadie traduce palabra por palabra: hoy buscamos la pista que decide.»"], "apoyo": ["⚑ Antes del sábado: Seis Corrección EDUCATE en esta misión: dos con dos opciones correctas (2 y 9) en clase, una en la casa (3, falta «up») y tres en el reto (17, 20 y 23). La tarjeta 8 tiene el sello «Alto»: el pasado de un pasado. Es la última clase de contenido.", "Lo que no cabe en clase: La tarea de la Misión 6 (seis tarjetas) se revisa al comenzar la clase 8, antes de la devolución del simulacro: la clase 7 es toda de prueba.", "Los cuatro conceptos que tienes que poder explicar hoy en dos minutos, sin jerga:", "Los tiempos del relato: Pasado simple (went, felt); pasado continuo, una acción larga (were setting); presente perfecto, desde el pasado hasta hoy (have been); pasado perfecto, antes de otro pasado (had imagined).", "La palabra de al lado: Have o has piden la tercera forma (have taken); to pide el verbo sin cambios (to develop); un sujeto plural pide were o feel; uno solo, was o feels.", "Palabras que andan juntas: Express points of view, develop critical thinking, check evidence, allow someone to: son parejas fijas (colocaciones). Se reconocen porque «suenan» en inglés, y eso se entrena leyendo.", "El párrafo entero: Cuando la oración sola no decide, decide el párrafo: si todo va en presente, el espacio también; si es un relato en pasado, el espacio sigue ese reloj.", "Cómo se dicen las palabras clave (la sílaba fuerte lleva tilde): went (uént), taken (TÉI-ken), debate (di-BÉIT), thinking (ZÍN-kin), evidence (É-vi-dens), lit (lit), footsteps (FÚT-steps), wandering (UÁN-de-rin).", "Si un estudiante pregunta algo que no sabes, no inventes: «No lo sé; vamos a ver qué dice el texto». Anótalo en tu registro y tráelo resuelto. Si alguien sabe más inglés, que lea en voz alta.", "Abre esta guía con la tecla G en cada diapositiva: trae lo que dices y, debajo, lo que necesitas saber si Inglés no es tu área.", "El cronómetro arranca con T y se reinicia solo cuando cambia el momento de la clase."]}}, {"m": null, "html": "<div class=\"eyebrow\"><span class=\"kicker\">Así vamos a trabajar<\/span><\/div><h2>Seis momentos, una sola regla<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:var(--m1)\"><div class=\"k\">1<\/div><div><b>Activación<\/b><span class=\"sub\"> · 15 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m2)\"><div class=\"k\">2<\/div><div><b>Pregunta problematizadora<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m3)\"><div class=\"k\">3<\/div><div><b>Desarrollo guiado<\/b><span class=\"sub\"> · 35 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m4)\"><div class=\"k\">4<\/div><div><b>Reto en equipo<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m5)\"><div class=\"k\">5<\/div><div><b>Evaluación individual<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m6)\"><div class=\"k\">6<\/div><div><b>Cierre<\/b><span class=\"sub\"> · 10 min<\/span><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--area)\"><h3>La regla del cuaderno<\/h3><p class=\"lead\">Si el instrumento está vacío, no lo resolviste: lo adivinaste.<\/p><p>Primero se escribe la pista en el instrumento —la palabra que decide, lo que tacha, el tiempo, la intención—, después se marca la letra. Una respuesta correcta con el instrumento en blanco no cuenta como resuelta.<\/p><\/div><\/div>", "guia": {"obj": "Que la regla quede dicha en voz alta antes de cualquier texto.", "decir": ["«La respuesta correcta con el instrumento vacío no cuenta. ¿Por qué? Porque en inglés casi todas las opciones suenan bien: el que no escribió la pista escoge la que suena, no la que dice el texto.»"], "apoyo": ["Si alguien pregunta para qué escribir, la respuesta corta es: en el examen nadie traduce; el que encuentra la pista responde en segundos.", "Si alguien dice «es que suena mejor», devuélvele la pregunta: «¿qué palabra del texto te lo dice?»."]}}, {"m": 0, "min": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Ronda de claves · 5 min<\/span><span class=\"kicker\">Tarea de la Misión 3 · texto 3 · AI in the Classroom<\/span><\/div><h2>Antes de empezar: la tarea de la Misión 3<\/h2><p class=\"lead\">Cuaderno abierto en las páginas 345 a 349 y un color distinto en la mano. Junto a cada X escribe la pista que no viste.<\/p><div class=\"nums\"><span>22<\/span><span>24<\/span><span>26<\/span><span>27<\/span><span>28<\/span><span>30<\/span><\/div><div class=\"ctl\"><button class=\"btn\" data-show=\"ronda6\">Revelar las claves de la tarea<\/button><\/div><div class=\"clave kgrid\" id=\"ronda6\" hidden><span class=\"kg\"><span>22<\/span>B<\/span><span class=\"kg\"><span>24<\/span>A<\/span><span class=\"kg\"><span>26<\/span>C<\/span><span class=\"kg\"><span>27<\/span>A<\/span><span class=\"kg\"><span>28<\/span>C<\/span><span class=\"kg\"><span>30<\/span>A<\/span><\/div>", "guia": {"obj": "Que la tarea se revise en cinco minutos y cada uno vea qué pista no vio.", "decir": ["«Cuaderno abierto en la tarea. Lápiz de otro color. Voy a revelar las claves: chulita o X, y junto a cada X la pista que no vieron.»"], "apoyo": ["Las claves: 22·B, 24·A, 26·C, 27·A, 28·C, 30·A.", "Manos arriba por tarjeta: la más fallada se explica en un minuto, con la pista. Las demás van a tu registro. No se corrige la letra: se escribe la pista que faltó.", "Tarjeta 24 · Del libro (corrección): 17 a 20: valen el pasado del relato (combined, dealt, tried, left) y el presente de la trama; 24: by, with y through son correctas. Qué haces: Son de la casa: en las rondas de las clases 5 y 6 acéptalas (en 18 a 20, el mismo reloj en las tres)."]}}, {"m": 0, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Activación<\/span><span class=\"kicker\">Cuaderno cerrado<\/span><\/div><h2>¿Qué palabra decide?<\/h2><blockquote class=\"cita xl\" lang=\"en\">My grandmother is eighty, but she ___ to the gym three times a week. (go)<\/blockquote><p class=\"lead\">Léela despacio. Señala la palabra que decide y di qué decide. Todavía no se abre el libro.<\/p><div class=\"ctl\"><button class=\"btn\" data-show=\"pista6\">Mostrar la pista<\/button><\/div><div class=\"note\" id=\"pista6\" hidden style=\"--accent:var(--m1)\"><b>Pista:<\/b> «three times a week» es una costumbre y el sujeto es ella sola: goes<\/div>", "guia": {"obj": "Que el estudiante, antes de abrir el libro, busque en una frase corta en inglés la pista que decide —una palabra, un tiempo, una intención— y la nombre en voz alta.", "decir": ["Si hay tarea de la misión anterior, abre con la ronda de claves: cinco minutos, reloj a la vista.", "Proyecta la frase del día, inventada para la clase, y la lee despacio dos veces.", "Pide que el grupo señale la palabra que decide y diga qué decide: quién habla, cuándo pasa, qué falta.", "Ejecuta la dinámica de la subestrategia 1 (ocho minutos)."], "como": "No traduce la frase ni explica gramática. Si alguien pregunta qué significa una palabra, le devuelve: «¿qué palabra de al lado te ayuda?». El cuaderno sigue cerrado, salvo en la ronda de claves.", "apoyo": ["No traduzcas la frase ni expliques gramática: primero la palabra que decide. La frase es inventada para la clase: no sale del libro.", "La pista existe para el cierre de los 15 minutos, no para el principio: «three times a week» es una costumbre y el sujeto es ella sola: goes."]}, "min": 2}, {"m": 0, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#242478\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 1 · La línea de tiempo del verbo<\/span><\/div><h2>La línea de tiempo humana<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Cinco estudiantes al frente con una tarjeta de un relato inventado: llegué al pueblo · llovía · conocí a mi mejor amigo · desde entonces somos amigos · hoy.<\/li><li>El grupo los ordena en una línea, del más viejo al de hoy.<\/li><li>El docente lee una oración con hueco de ese relato («Since then, we ___ friends») y el que tiene esa tarjeta da un paso al frente.<\/li><li>Desde su lugar en la línea, el grupo dice el tiempo del verbo y por qué.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cinco tarjetas<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante, antes de abrir el libro, busque en una frase corta en inglés la pista que decide —una palabra, un tiempo, una intención— y la nombre en voz alta.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto en inglés en cinco minutos —buscar, tachar, ubicar en el tiempo—, pero con el cuerpo.»"], "como": "No traduce la frase ni explica gramática. Si alguien pregunta qué significa una palabra, le devuelve: «¿qué palabra de al lado te ayuda?». El cuaderno sigue cerrado, salvo en la ronda de claves.", "apoyo": ["Qué movimiento mental entrena: Ubicar cada acción en la línea de tiempo antes de escoger el verbo. Es el movimiento de las tarjetas 1, 5 y 8 y de la primera del entrenamiento (At the time… found).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 1, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m2)\">Pregunta problematizadora<\/span><span class=\"kicker\">Libro abierto en la pregunta modelo<\/span><\/div><h2>Abran el libro: tarjeta 1, página 468<\/h2><p class=\"lead\">Antes de buscar la pista: ¿cuál creen que es? Levanten la mano.<\/p><p class=\"en xl\" lang=\"en\">Two years ago, my family and I (1) ____ to the mountains for a weekend trip.<\/p><ul class=\"eops\"><li><b>A<\/b><span>go<\/span><\/li><li><b>B<\/b><span>went<\/span><\/li><li><b>C<\/b><span>going<\/span><\/li><li><b>D<\/b><span>gone<\/span><\/li><\/ul><div class=\"ctl\"><button class=\"btn tally\" data-tally=\"h6A\">A <span class=\"n\" id=\"h6A\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h6B\">B <span class=\"n\" id=\"h6B\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h6C\">C <span class=\"n\" id=\"h6C\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h6D\">D <span class=\"n\" id=\"h6D\">0<\/span><\/button><button class=\"btn\" data-reset=\"h6\">↺<\/button><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta que gobierna el área<\/h3><p class=\"lead\">¿Qué palabra del texto te lo dice?<\/p><p class=\"sub\">Nadie justifica con «me suena» ni con «en español se dice así»: toda respuesta señala la palabra del texto que decide.<\/p><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta de este momento<\/h3><p class=\"lead\">¿Qué parte del texto entero decide el espacio?<\/p><\/div>", "guia": {"obj": "Que el estudiante compruebe que en Inglés la respuesta sale de una pista del texto —la palabra vecina, el verbo, el marcador de tiempo, quién habla— y no de lo que suena bonito ni de traducir palabra por palabra.", "decir": ["Presenta la pregunta modelo (la primera de las diez de clase) y la deja a la vista todo el momento.", "Pide respuestas a mano alzada ANTES de buscar la pista, y las cuenta en pantalla.", "Hace la pregunta que gobierna el área: ¿qué palabra del texto te lo dice?", "Al final del momento llena con el grupo el instrumento de esa tarjeta y trabaja por qué cae cada opción."], "como": "Regla del momento: nadie justifica con «me suena» ni con «en español se dice así». Toda intervención señala la palabra del texto que decide.", "apoyo": ["La pregunta modelo es la tarjeta 1 (Bloque 1, n.º 1, libro página 468). El cuaderno se abre en la página 376 solo en «mi primera idea».", "Cuenta las manos tocando cada letra: el número queda en pantalla y sirve para el final del momento, cuando el grupo vea cuántos cambiaron de opinión al encontrar la pista.", "No digas la clave en este momento: sale en el primer bloque del desarrollo guiado, después de llenar el instrumento en pantalla, casilla por casilla."]}}, {"m": 2, "min": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · tarjetas 1 y 2<\/span><span class=\"kicker\">En pantalla, casilla por casilla<\/span><\/div><h2>Tarjetas 1 y 2: primero la pista, después la letra<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Tarjeta 1 · libro p. 468 · Bloque 1, n.º 1<\/span><span class=\"min\" style=\"--accent:#242478\">S1 · La línea de tiempo del verbo<\/span><\/div><p class=\"en\">Two years ago, my family and I (1) ____ to the mountains for a weekend trip.<\/p><ul class=\"eops\"><li><b>A<\/b><span>go<\/span><\/li><li><b>B<\/b><span>went<\/span><\/li><li><b>C<\/b><span>going<\/span><\/li><li><b>D<\/b><span>gone<\/span><\/li><\/ul><p class=\"ins\">Instrumento: <b style=\"color:#242478\">El marcador clava el verbo en el tiempo<\/b>. Llénalo antes de marcar.<\/p><div class=\"clave\" hidden data-grupo=\"k61\"><span class=\"keychip\" style=\"background:#242478\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Tarjeta 2 · libro p. 468 · Bloque 1, n.º 2<\/span><span class=\"min\" style=\"--accent:#5B3E96\">S4 · El párrafo entero decide<\/span><\/div><p class=\"en\">The road was long, and we (2) ____ tired when we finally arrived.<\/p><ul class=\"eops\"><li><b>A<\/b><span>feel<\/span><\/li><li><b>B<\/b><span>felt<\/span><\/li><li><b>C<\/b><span>were feeling<\/span><\/li><li><b>D<\/b><span>feels<\/span><\/li><\/ul><p class=\"ins\">Instrumento: <b style=\"color:#5B3E96\">El camino a la montaña, verbo por verbo<\/b>. Llénalo antes de marcar.<\/p><div class=\"corr\"><b>Corrección EDUCATE<\/b>El libro espera una sola respuesta, pero en inglés hay dos opciones correctas. Encuéntralas, márcalas las dos y escribe en qué cambia lo que cuenta cada una.<\/div><div class=\"clave\" hidden data-grupo=\"k61\"><span class=\"keychip\" style=\"background:#5B3E96\">B<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k61\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante llene el instrumento de cada tarjeta —la pista, lo que tacha, el tiempo, la intención— antes de marcar la letra, en las diez tarjetas de clase de la misión.", "decir": ["«Antes de marcar: ¿qué pista escribieron? Léanmela.»", "Si alguien se traba, pregúntale qué palabra vecina mira. Si el instrumento está vacío, vuelve al texto antes que a las opciones."], "como": "No traduce el texto ni dicta la respuesta. Si un estudiante se traba, le pregunta qué palabra vecina mira; si el instrumento está vacío, lo devuelve al texto antes que a las opciones. Las tarjetas del reto y de la casa no se tocan en este momento.", "apoyo": ["Las claves del libro son 1·B y 2·B. No las reveles hasta que todos tengan la pista escrita: el botón es para el cierre del bloque.", "Tarjeta 1 · por qué: «Two years ago» clava el verbo en el pasado terminado: went.", "Tarjeta 1 · cómo se dice: went (uént).", "Tarjeta 2 · por qué: El relato va en pasado: felt es la del libro, y were feeling también es correcta (Corrección EDUCATE).", "Tarjeta 2 · la Corrección EDUCATE de la tarjeta es la que está en pantalla: léela en voz alta. No da la clave.", "Tarjeta 2 · Del libro (corrección): Dos opciones correctas: felt y were feeling (2); express y explore (9). El libro espera una. Qué haces: La tarjeta pide encontrar y marcar las dos."]}}, {"m": 2, "min": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#A82424\">Dinámica · 3 min<\/span><span class=\"kicker\">Entrena la estrategia 2 · La palabra de al lado manda la forma<\/span><\/div><h2>El jefe de al lado<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Unos tienen un jefe: HAVE, TO, CAN, WAS, SHE. Otros, una forma de un verbo: taken, take, taking, takes.<\/li><li>El docente dice un jefe y los verbos que le sirven se paran junto a él.<\/li><li>El grupo dice la regla en voz alta: «have pide la tercera forma».<\/li><li>Se repite con otro verbo (write, written, writing, writes).<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Doce tarjetas<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante llene el instrumento de cada tarjeta —la pista, lo que tacha, el tiempo, la intención— antes de marcar la letra, en las diez tarjetas de clase de la misión.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto en inglés en cinco minutos —buscar, tachar, ubicar en el tiempo—, pero con el cuerpo.»"], "como": "No traduce el texto ni dicta la respuesta. Si un estudiante se traba, le pregunta qué palabra vecina mira; si el instrumento está vacío, lo devuelve al texto antes que a las opciones. Las tarjetas del reto y de la casa no se tocan en este momento.", "apoyo": ["Qué movimiento mental entrena: Mirar la palabra que va justo antes del espacio: ella manda la forma. Es el movimiento de las tarjetas 6 y 13 y de la segunda del entrenamiento (have said).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · tarjetas 5 y 6<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Tarjetas 5 y 6: primero la pista, después la letra<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Tarjeta 5 · libro p. 468 · Bloque 1, n.º 5<\/span><span class=\"min\" style=\"--accent:#242478\">S1 · La línea de tiempo del verbo<\/span><\/div><p class=\"en\">Since that day, I (5) ____ fascinated by nature and camping.<\/p><ul class=\"eops\"><li><b>A<\/b><span>became<\/span><\/li><li><b>B<\/b><span>have been<\/span><\/li><li><b>C<\/b><span>was becoming<\/span><\/li><li><b>D<\/b><span>turn<\/span><\/li><\/ul><p class=\"ins\">Instrumento: <b style=\"color:#242478\">«Since» tiende un puente hasta hoy<\/b>. Llénalo antes de marcar.<\/p><div class=\"clave\" hidden data-grupo=\"k65\"><span class=\"keychip\" style=\"background:#242478\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Tarjeta 6 · libro p. 468 · Bloque 1, n.º 6<\/span><span class=\"min\" style=\"--accent:#A82424\">S2 · La palabra de al lado manda la forma<\/span><\/div><p class=\"en\">I have already (6) ____ many photographs of our trips, and I (7) ____ a blog to share them with friends.<\/p><ul class=\"eops\"><li><b>A<\/b><span>taken<\/span><\/li><li><b>B<\/b><span>took<\/span><\/li><li><b>C<\/b><span>taking<\/span><\/li><li><b>D<\/b><span>take<\/span><\/li><\/ul><p class=\"ins\">Instrumento: <b style=\"color:#A82424\">Cada auxiliar llega con su pareja<\/b>. Llénalo antes de marcar.<\/p><div class=\"clave\" hidden data-grupo=\"k65\"><span class=\"keychip\" style=\"background:#A82424\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\" ome): feel."]}}, {"m": 2, "min": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#5B3E96\">Dinámica · 3 min<\/span><span class=\"kicker\">Entrena la estrategia 4 · El párrafo entero decide<\/span><\/div><h2>El jurado del párrafo<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>El docente lee un párrafo inventado de cuatro oraciones con un hueco en la última.<\/li><li>La pista que decide está en la primera oración, lejos del hueco.<\/li><li>Los equipos buscan la oración que decide y la leen en voz alta.<\/li><li>El jurado (tres estudiantes) dice si la pista está bien buscada antes de dar la palabra.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Ninguno<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante llene el instrumento de cada tarjeta —la pista, lo que tacha, el tiempo, la intención— antes de marcar la letra, en las diez tarjetas de clase de la misión.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto en inglés en cinco minutos —buscar, tachar, ubicar en el tiempo—, pero con el cuerpo.»"], "como": "No traduce el texto ni dicta la respuesta. Si un estudiante se traba, le pregunta qué palabra vecina mira; si el instrumento está vacío, lo devuelve al texto antes que a las opciones. Las tarjetas del reto y de la casa no se tocan en este momento.", "apoyo": ["Qué movimiento mental entrena: Cuando la oración sola no alcanza, buscar la pista en el párrafo entero. Es el movimiento de las tarjetas 2 y 14 y de la cuarta del entrenamiento (So, it is not surprising).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · tarjetas 14 y 16<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Tarjetas 14 y 16: primero la pista, después la letra<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Tarjeta 14 · libro p. 469 · Bloque 2, n.º 6<\/span><span class=\"min\" style=\"--accent:#5B3E96\">S4 · El párrafo entero decide<\/span><\/div><p class=\"en\">Teachers (6) ____ debates as a way to make classes more dynamic and interactive.<\/p><ul class=\"eops\"><li><b>A<\/b><span>gives<\/span><\/li><li><b>B<\/b><span>use<\/span><\/li><li><b>C<\/b><span>used<\/span><\/li><li><b>D<\/b><span>using<\/span><\/li><\/ul><p class=\"ins\">Instrumento: <b style=\"color:#5B3E96\">Notas adhesivas: el tiempo de cada párrafo<\/b>. Llénalo antes de marcar.<\/p><div class=\"clave\" hidden data-grupo=\"k614\"><span class=\"keychip\" style=\"background:#5B3E96\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Tarjeta 16 · libro p. 469 · Bloque 2, n.º 8<\/span><span class=\"min\" style=\"--accent:#C9821B\">S3 · Palabras que andan juntas<\/span><\/div><p class=\"en\">These experiences (8) ____ students to become more active citizens in their communities.<\/p><ul class=\"eops\"><li><b>A<\/b><span>allow<\/span><\/li><li><b>B<\/b><span>stop<\/span><\/li><li><b>C<\/b><span>cancel<\/span><\/li><li><b>D<\/b><span>prevent<\/span><\/li><\/ul><p class=\"ins\">Instrumento: <b style=\"color:#C9821B\">El molde «___ + alguien + to + verbo»<\/b>. Llénalo antes de marcar.<\/p><div class=\"clave\" hidden data-grupo=\"k614\"><span class=\"keychip\" style=\"background:#C9821B\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k614\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante llene el instrumento de cada tarjeta —la pista, lo que tacha, el tiempo, la intención— antes de marcar la letra, en las diez tarjetas de clase de la misión.", "decir": ["«Antes de marcar: ¿qué pista escribieron? Léanmela.»", "Si alguien se traba, pregúntale qué palabra vecina mira. Si el instrumento está vacío, vuelve al texto antes que a las opciones."], "como": "No traduce el texto ni dicta la respuesta. Si un estudiante se traba, le pregunta qué palabra vecina mira; si el instrumento está vacío, lo devuelve al texto antes que a las opciones. Las tarjetas del reto y de la casa no se tocan en este momento.", "apoyo": ["Las claves del libro son 14·B y 16·A. No las reveles hasta que todos tengan la pista escrita: el botón es para el cierre del bloque.", "Tarjeta 14 · por qué: Todo el texto va en presente: use. used es gramatical, pero rompe el tiempo del párrafo.", "Tarjeta 14 · Del libro (atención): 7: lo natural sería «have started»; 10: «involve subjects» es poco natural; 14: used también es gramatical. Qué haces: No cambian las claves: decide el tiempo del párrafo.", "Tarjeta 14 · cómo se dice: debate (di-BÉIT).", "Tarjeta 16 · por qué: allow + alguien + to + verbo, el mismo molde de «encourage students to» del párrafo 1."]}}, {"m": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m4)\">Reto en equipo · 20 min<\/span><span class=\"kicker\">Equipos de tres · cada uno responde en su cuaderno<\/span><\/div><h2>Reto del corte: El misterio de Baker Street<\/h2><div class=\"card big edge mt\" style=\"--accent:var(--m4)\"><p class=\"lead\">Equipos de tres con el Bloque 3 del libro, «A Late Visitor» (tarjetas 17 a 24). Cinco minutos para leer el texto entero y marcar su reloj: ¿en qué tiempo va el relato? Cada integrante se hace dueño de dos o tres espacios y los llena en su cuaderno; en el relevo, los otros llenan esas tarjetas en el suyo. Tres tarjetas tienen Corrección EDUCATE (17, 20 y 23): el equipo escribe cómo diría la oración un hablante. Tres minutos de defensa por equipo.<\/p><div class=\"nums\"><span>17<\/span><span>18<\/span><span>19<\/span><span>20<\/span><span>21<\/span><span>22<\/span><span>23<\/span><span>24<\/span><\/div><p class=\"sub\">Cuaderno, páginas 385 a 388.<\/p><div class=\"ctl\"><button class=\"btn\" data-show=\"reto6\">Revelar las claves del reto<\/button><\/div><div class=\"clave kgrid\" id=\"reto6\" hidden><span class=\"kg\"><span>17<\/span>C<\/span><span class=\"kg\"><span>18<\/span>C<\/span><span class=\"kg\"><span>19<\/span>B<\/span><span class=\"kg\"><span>20<\/span>B<\/span><span class=\"kg\"><span>21<\/span>C<\/span><span class=\"kg\"><span>22<\/span>C<\/span><span class=\"kg\"><span>23<\/span>C<\/span><span class=\"kg\"><span>24<\/span>B<\/span><\/div><\/div><div class=\"note mt\" style=\"--accent:var(--m4)\"><b>La defensa:<\/b> tres minutos por equipo, leyendo en voz alta la palabra del texto que decide. «Es que suena mejor» no cuenta.<\/div>", "guia": {"obj": "Que el estudiante defienda su respuesta con la pista en la mano y acepte que otro equipo puede ver una pista que él no vio.", "decir": ["Arma equipos de tres y anuncia el reto del corte de la misión.", "Cada integrante trabaja primero su parte, en SU cuaderno.", "Da tres minutos de defensa por equipo: leen en voz alta la palabra que decide.", "Cierra con las claves del reto (en la guía, con «Revelar»)."], "como": "El equipo discute, pero cada uno escribe en su propio cuaderno. No se acepta «es que suena mejor»: se nombra la pista. Si el libro tiene una «Corrección EDUCATE» en el reto, se discute ahí.", "apoyo": ["Las claves del reto: 17·C, 18·C, 19·B, 20·B, 21·C, 22·C, 23·C, 24·B. Revélalas al final, después de las defensas.", "Si un equipo entrega una sola hoja para los tres, el reto no cuenta. La discusión es compartida; el registro es individual, en el cuaderno de cada uno.", "Tarjeta 17 · Del libro (corrección): 17: lit y lighted son correctas; 20: los pasos no «corren» (sounded, echoed); 23: falta «to» (listened to). Qué haces: Reto: el equipo lo discute con la tarjeta.", "Tarjeta 20 · Del libro (corrección): 17: lit y lighted son correctas; 20: los pasos no «corren» (sounded, echoed); 23: falta «to» (listened to). Qué haces: Reto: el equipo lo discute con la tarjeta.", "Tarjeta 23 · Del libro (corrección): 17: lit y lighted son correctas; 20: los pasos no «corren» (sounded, echoed); 23: falta «to» (listened to). Qué haces: Reto: el equipo lo discute con la tarjeta."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 1<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>History of paper · espacio 253<\/h3><p lang=\"en\">HISTORY OF PAPER<\/p><p lang=\"en\">Since the beginning of writing, people tried to think of something easy and cheap to write on, (246) ________ it took 3000 years until the Chinese people made paper. Only one thousand years afterwards, people were (247) ________ paper all over Europe and Asia. In the 8th century, the Arabs and the Chinese were enemies, and the Arabs captured (248) ________ Chinese men. Many of (249) ________ men knew how to make paper, and (250) ________ explained it to the Arabs as the price to be able to go home. Almost eight centuries (251) ________ Europeans began to make (252) ________ own paper. At the time, people in the country of the Aztecs (253) ________ the way to make paper too, while the Chinese people were already famous for paper kites and toilet paper!<\/p><\/div><div><p class=\"enun\">Espacio (253): «At the time, people in the country of the Aztecs (253) ___ the way to make paper too».<\/p><div class=\"ops\" id=\"icf61\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>find<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>finding<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>found<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf61\" data-k=\"C\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la subestrategia a preguntas tipo Saber 11, con textos que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué pista escribiste en el instrumento antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la C. Por qué: «At the time» remite a un momento del pasado ya nombrado («Almost eight centuries later… began») y la oración sigue con «were already famous»: pasado simple, found. «Find» es presente y «finding» necesita un auxiliar delante (were finding). C.", "Los relojes del párrafo: began, were already famous. El espacio vive donde vive su marcador.", "Find, found, found: el pasado de find es irregular. No confundir con «to found» (fundar)."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 2<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>The Ethiopian wolf · espacio 10<\/h3><p lang=\"en\">THE ETHIOPIAN WOLF<\/p><p lang=\"en\">It is an African animal, (0) which is called the Simien Jackal. Some scientists have (10) ________ it is not a real wolf. But studies show that (11) ________ close relationship to grey wolves and coyotes is evident. (12) ________ Ethiopian wolves are more similar to grey wolves and coyotes than any other African canines. Scientists also believe there are about 450 of them living in wild conditions. The (13) ________ group of Ethiopian wolves lives (14) ________ the Bale Mountains National Park. The Ethiopian wolf has a special red coat with a white part in the front of the body. It is in size from 1,1 to 1,4 meters. By nature, the Ethiopian wolf looks for food by day, but it is sometimes nocturnal in areas where other animals may hunt it.<\/p><\/div><div><p class=\"enun\">Espacio (10): «Some scientists have (10) ___ it is not a real wolf».<\/p><div class=\"ops\" id=\"icf62\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>saying<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>said<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>say<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf62\" data-k=\"B\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la subestrategia a preguntas tipo Saber 11, con textos que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué pista escribiste en el instrumento antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la B. Por qué: la palabra que manda es «have»: have + participio (presente perfecto). Say, said, said: el participio es said. «Saying» necesitaría «have been» y «say» no va después de «have». B.", "Mira la palabra que va justo antes del espacio: have pide la tercera forma.", "El cuadernillo trae una errata de numeración («(4)» por «(14)»): el cuaderno imprime (14)."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 3<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Coffee · espacio 12<\/h3><p lang=\"en\">COFFEE<\/p><p lang=\"en\">Coffee is popular around the world. (0) Over the past centuries, few subjects have been as carefully studied as coffee. Its (9) ________ important component is caffeine and it has lots of benefits. Coffee has been well-known (10) ________ the beginning of the 14th century, (11) ________ Sufi Yemenis started using coffee to stay alert during special activities. It became a popular medicine (12) ________ Europeans in the 1600s. Caffeine was first (13) ________ in the 1800s by Ferdinand Runge, a doctor that found out some effects of coffee on people. Some people say (14) ________ coffee isn&#x27;t good, but doctors say you (15) ________ believe this. Thanks to caffeine you don&#x27;t get hungry. Coffee can also reduce headaches and blood problems. (16) ________ many people believe coffee is bad, studies show it is good for your heart.<\/p><\/div><div><p class=\"enun\">Espacio (12): «It became a popular medicine (12) ___ Europeans in the 1600s».<\/p><div class=\"ops\" id=\"icf63\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>among<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>about<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>along<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf63\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la subestrategia a preguntas tipo Saber 11, con textos que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué pista escribiste en el instrumento antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la A. Por qué: «popular among» + un grupo de personas: popular entre los europeos. «About» es «sobre un tema» y «along» es «a lo largo de»; ninguna va con «popular… Europeans». A.", "Es el mismo texto de la Misión 3 (espacios 10, 13 y 16): los estudiantes ya lo conocen.", "Among = entre muchos; between = entre dos. Es la tarjeta 21 del libro (popular among teenagers)."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 4<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>The Apple · espacio 222<\/h3><p lang=\"en\">THE APPLE<\/p><p lang=\"en\">An apple is good for one&#x27;s health. It has important vitamins and minerals. Also, it helps to clean one&#x27;s teeth after a meal. No other fruit has such good things for your body. (222) ______, it is not surprising that the apple is known (223) ______ the &quot;King&quot; of all fruits. The Romans helped greatly in (224) ______ the apple trees in European lands. Each time the Romans traveled around a country, they always (225) ______ apple seeds and planted (226) ______. They also carried the apple to England. The apple was brought to America (227) ______ the first explorers from Europe. The Americans eat (228) ______ apples and apple cakes than any other people and (229) ______ two things have become American national foods.<\/p><\/div><div><p class=\"enun\">Espacio (222): «No other fruit has such good things for your body. (222) ___, it is not surprising that the apple is known…».<\/p><div class=\"ops\" id=\"icf64\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>Because<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>So<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>But<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf64\" data-k=\"B\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la subestrategia a preguntas tipo Saber 11, con textos que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué pista escribiste en el instrumento antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la B. Por qué: las oraciones de antes dan las razones (vitaminas, minerales, limpia los dientes, ninguna fruta tiene tanto) y la del espacio dice el resultado: no sorprende que la llamen «the King». Hace falta un conector de consecuencia: So. «But» es contraste; «Because» introduce una causa y no puede abrir sola una oración principal seguida de coma. B.", "Lo que viene antes, el puente y lo que viene después: las razones están en las cuatro oraciones anteriores, no en la misma.", "Es el ejemplo con que abre la Misión 6 en el libro: «The team trained hard; ___, they were ready»."]}}, {"m": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m6)\">Cierre<\/span><span class=\"kicker\">La pregunta de siempre<\/span><\/div><h2>¿En qué se parecía la pregunta Saber 11 a la de tu libro?<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:#242478\"><div class=\"k\">1<\/div><div><b>La línea de tiempo del verbo<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#A82424\"><div class=\"k\">2<\/div><div><b>La palabra de al lado manda la forma<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#C9821B\"><div class=\"k\">3<\/div><div><b>Palabras que andan juntas<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#5B3E96\"><div class=\"k\">4<\/div><div><b>El párrafo entero decide<\/b><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--m6)\"><h3>Antes de salir<\/h3><ol class=\"pasos\"><li>La palabra o la expresión del día, en la franja de vocabulario, con tus palabras.<\/li><li>«Lo que me llevo de esta pregunta».<\/li><li>Tu carita de salida.<\/li><li>La casilla 6 de la portada del área.<\/li><\/ol><\/div><\/div><div class=\"card edge mt\" style=\"--accent:var(--oro)\"><h3>Para la casa<\/h3><ol class=\"pasos\"><li>Tarjetas <b>3, 4, 7, 10, 11 y 15<\/b> (bloques 1 y 2, páginas 377, 379 a 381 y 384): se revisan al comenzar la clase 8.<\/li><\/ol><p class=\"sub\">Con el instrumento lleno, como en clase. La ronda de claves es de cinco minutos.<\/p><\/div>", "guia": {"obj": "Que el estudiante nombre la subestrategia que usó, sepa qué tarjetas quedan para la casa y se lleve una palabra o una expresión nueva, escrita en sus palabras.", "decir": ["Socializa solo las preguntas que el grupo falló, pidiendo la pista que las resuelve.", "Dice en voz alta la tarea de la misión y cuándo se revisa (está en la última diapositiva).", "Cada uno escribe la palabra del día en la franja de vocabulario y marca su carita de salida."], "como": "No dicta traducciones. La palabra se escribe como el estudiante la entendió; si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase.", "apoyo": ["Di la tarea en voz alta y que la anoten: tarjetas 3, 4, 7, 10, 11 y 15, ronda en la clase 8", "La palabra nueva no se dicta. Si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase: es mejor que dictarla bien.", "Para el cierre del momento: La tarea de la Misión 6 (seis tarjetas) se revisa al comenzar la clase 8, antes de la devolución del simulacro: la clase 7 es toda de prueba."]}}];

function paintClock(){
  var n = $("#tnum");
  if(!tBase){ n.textContent = "—"; n.classList.remove("over"); return; }
  var s = Math.abs(tLeft), mm = Math.floor(s/60), ss = s%60;
  n.textContent = (tLeft<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", tLeft<0);
}
function setTimer(min){
  tBase = min||0; tLeft = tBase*60; tOn = false;
  if(tick){ clearInterval(tick); tick = null; }
  $("#play").textContent = "Iniciar"; paintClock();
}
function toggleTimer(){
  if(!tBase) return;
  tOn = !tOn; $("#play").textContent = tOn ? "Pausar" : "Seguir";
  if(tick){ clearInterval(tick); tick = null; }
  if(tOn) tick = setInterval(function(){ tLeft--; paintClock(); }, 1000);
  paintClock();
}
// cronómetro de la prueba (clase 7): aparte del de la barra, no se reinicia al cambiar de diapositiva
var EX = {base:0, left:0, on:false, t:null, ini:null};
function hhmm(d){ return d.getHours() + ":" + (d.getMinutes()<10?"0":"") + d.getMinutes(); }
function exPaint(){
  var box = wrap.querySelector("[data-examen]"); if(!box) return;
  if(!EX.base){ EX.base = +box.dataset.examen; EX.left = EX.base*60; }
  var s = Math.abs(EX.left), mm = Math.floor(s/60), ss = s%60;
  var n = box.querySelector("[data-exnum]");
  n.textContent = (EX.left<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", EX.left<0);
  box.querySelector("[data-exini]").textContent = EX.ini ? hhmm(EX.ini) : "—";
  box.querySelector("[data-exfin]").textContent = EX.on ? hhmm(new Date(Date.now() + EX.left*1000)) : (EX.ini ? "en pausa" : "—");
  var p = box.querySelector('[data-ex="play"]');
  p.textContent = EX.on ? "Pausar" : (EX.ini ? "Seguir" : "Iniciar la prueba");
}
function exToggle(){
  if(!EX.base) exPaint();
  EX.on = !EX.on;
  if(EX.t){ clearInterval(EX.t); EX.t = null; }
  if(EX.on){ if(!EX.ini) EX.ini = new Date(); EX.t = setInterval(function(){ EX.left--; exPaint(); }, 1000); }
  exPaint();
}
function exReset(){
  if(EX.ini && !window.confirm("¿Volver a poner el cronómetro de la prueba en cero?")) return;
  if(EX.t){ clearInterval(EX.t); EX.t = null; }
  EX.on = false; EX.ini = null; EX.left = EX.base*60; exPaint();
}

  if(g.decir && g.decir.length) h += '<div class="gbox"><h4>Qué haces y qué dices</h4><ul>'+
     g.decir.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  if(g.como) h += '<div class="gbox como"><h4>Lo que no haces</h4><p>'+esc(g.como)+'</p></div>';
  if(g.apoyo && g.apoyo.length) h += '<div class="gbox apoyo"><h4>Si Inglés no es tu fuerte</h4><ul>'+
     g.apoyo.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  return h;
}
function pintaElegidas(){
  var box = document.getElementById("elegidas"); if(!box) return;
  if(!elegidas.length){ box.innerHTML = '<p class="sub">Vuelve a la diapositiva anterior y escoge las cinco.</p>'; return; }
  box.innerHTML = elegidas.map(function(t,k){
    return '<div class="card edge" style="--accent:var(--m'+((k%6)+1)+')"><h3>'+(k+1)+'. '+esc(t)+'</h3>'+
      '<p class="sub">Busca esta pregunta en tu simulacro y en la hoja de taller de la misma estrategia.</p></div>';
  }).join("");
}
function go(n){
  var prev = SC[i];
  i = Math.max(0, Math.min(SC.length-1, n));
  var s = SC[i];
  wrap.innerHTML = s.html;
  wrap.classList.remove("enter"); void wrap.offsetWidth; wrap.classList.add("enter");
  stage.scrollTop = 0;
  var m = s.m!=null ? MOM[s.m] : null;
  $("#momdot").style.background = m ? "var("+m.c+")" : "var(--faint)";
  $("#momdot").textContent = m ? m.n : "·";
  $("#momnom").textContent = m ? m.nom : NOMBRE;
  $("#momsub").textContent = m ? (m.min+" minutos") : SUB;
  var want = s.min!=null ? s.min : (m ? m.min : 0);
  var cambio = !prev || prev===s || prev.m!==s.m || (prev.min||null)!==(s.min||null);
  if(cambio) setTimer(want);
  $("#count").textContent = (i+1)+" / "+SC.length;
  $("#prog i").style.width = (SC.length>1 ? i/(SC.length-1)*100 : 100)+"%";
  $("#guiabody").innerHTML = guiaHTML(s.guia);
  [].forEach.call(wrap.querySelectorAll("[data-pick]"), function(b){
    b.setAttribute("aria-pressed", elegidas.indexOf(b.textContent)>=0 ? "true" : "false"); });
  pintaElegidas();
  pintaCampos();
  exPaint();
  $("#clock").style.visibility = wrap.querySelector("[data-examen]") ? "hidden" : "";   // la prueba tiene su reloj
}
wrap.addEventListener("input", function(e){
  var x = e.target; if(!x.dataset || !x.dataset.campo) return;
  CAMPOS[x.dataset.campo] = x.value;
});
wrap.addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.dataset.ex==="play") exToggle();
  if(b.dataset.ex==="reset") exReset();
  if(b.dataset.show){ var t = document.getElementById(b.dataset.show); if(t) t.hidden = !t.hidden; }
  if(b.dataset.showgrupo){
    var g = wrap.querySelectorAll('[data-grupo="'+b.dataset.showgrupo+'"]'), abrir = g.length && g[0].hidden;
    [].forEach.call(g, function(x){ x.hidden = !abrir; });
    b.textContent = abrir ? "Ocultar las claves" : "Revelar las claves";
  }
  if(b.dataset.clave){
    var box = document.getElementById(b.dataset.clave), ok = box.querySelector('[data-op="'+b.dataset.k+'"]');
    var on = ok && !ok.classList.contains("ok");
    [].forEach.call(box.querySelectorAll(".op"), function(o){ o.classList.remove("ok"); });
    if(on) ok.classList.add("ok");
    b.textContent = on ? "Ocultar la clave" : "Revelar la clave";
  }
  if(b.dataset.tally){ var n = document.getElementById(b.dataset.tally); n.textContent = (+n.textContent||0)+1; }
  if(b.dataset.reset){ [].forEach.call(wrap.querySelectorAll('[id^="'+b.dataset.reset+'"]'), function(x){
    if(x.classList.contains("n")) x.textContent = "0"; }); }
  if(b.dataset.pick!=null){
    var t = b.textContent, k = elegidas.indexOf(t);
    if(k>=0) elegidas.splice(k,1); else if(elegidas.length<5) elegidas.push(t);
    b.setAttribute("aria-pressed", elegidas.indexOf(t)>=0 ? "true" : "false");
  }
});
function setGuia(on){ $("#guia").classList.toggle("open", on); $("#scrim").classList.toggle("on", on);
  $("#gbtn").setAttribute("aria-pressed", on ? "true" : "false"); }
$("#next").addEventListener("click", function(){ go(i+1); });
$("#prev").addEventListener("click", function(){ go(i-1); });
$("#play").addEventListener("click", toggleTimer);
$("#reset").addEventListener("click", function(){ setTimer(tBase); });
$("#gbtn").addEventListener("click", function(){ setGuia(!$("#guia").classList.contains("open")); });
$("#gclose").addEventListener("click", function(){ setGuia(false); });
$("#scrim").addEventListener("click", function(){ setGuia(false); });
document.addEventListener("keydown", function(e){
  var t = e.target.tagName; if(t==="INPUT"||t==="TEXTAREA"||e.target.isContentEditable) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ go(i+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ go(i-1); e.preventDefault(); }
  else if(e.key==="Home"){ go(0); e.preventDefault(); }
  else if(e.key==="End"){ go(SC.length-1); e.preventDefault(); }
  else if(e.key==="g"||e.key==="G"){ setGuia(!$("#guia").classList.contains("open")); }
  else if(e.key==="t"||e.key==="T"){ if(wrap.querySelector("[data-examen]")) exToggle(); else toggleTimer(); }
  else if(e.key==="Escape"){ setGuia(false); }
});
go(0);
})();
</script>
</body>
</html>
