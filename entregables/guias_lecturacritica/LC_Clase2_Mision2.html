<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lectura Crítica · Clase 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>[hidden]{display:none!important}
:root{
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --text:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --lc:#A82424; --azul:#1F4E8C; --oro:#B0711A; --morado:#5B3E96; --verde:#2E7A39;
  --m1:#A82424; --m2:#1F4E8C; --m3:#3B3BA6; --m4:#5B3E96; --m5:#B0711A; --m6:#2E7A39;
  --ink:#1B1F27; --muted:#5C6472; --faint:#A9B0BB; --line:#E3E7ED; --paper:#FFFFFF; --bg:#F6F4F1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:clamp(16px,1.25vw,21px);line-height:1.5}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
#top{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding:10px clamp(14px,2vw,28px);background:var(--paper);flex-wrap:wrap}
.logo img{height:clamp(28px,2.6vw,40px);display:block}
#mom{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
#momdot{width:clamp(30px,2.4vw,40px);height:clamp(30px,2.4vw,40px);border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;background:var(--faint)}
#momnom{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.2vw,20px)}
#momsub{color:var(--muted);font-size:.85em}
#clock{display:flex;align-items:center;gap:8px}
#tnum{font-family:var(--display);font-weight:800;font-size:clamp(20px,1.8vw,30px);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
#tnum.over{color:var(--lc)}
.btn{appearance:none;font:inherit;font-size:.86em;font-weight:600;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.solid{background:var(--lc);border-color:var(--lc);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#stage{overflow:auto;padding:clamp(18px,3vw,48px) clamp(16px,4vw,72px)}
#wrap{max-width:1500px;margin:0 auto}
#wrap.enter{animation:ent .28s ease-out}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bot{display:flex;align-items:center;gap:12px;padding:10px clamp(14px,2vw,28px);background:var(--paper)}
#prog{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
#prog i{display:block;height:100%;background:var(--lc);transition:width .25s}
#count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
#hint{color:var(--faint);font-size:.8em}
@media (max-width:760px){#hint{display:none}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.2vw,68px);line-height:1.05;margin:.2em 0 .25em;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,2.8vw,46px);line-height:1.1;margin:.25em 0 .3em;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:clamp(18px,1.5vw,26px);margin:.1em 0 .4em;line-height:1.2}
p{margin:.35em 0 .6em}
.lead{font-size:1.2em;line-height:1.45;max-width:70ch}
.sub{color:var(--muted)}
.mt{margin-top:clamp(14px,1.8vw,26px)}
.logo-xl img{height:clamp(54px,6vw,96px);margin-bottom:12px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tag,.min,.membrete{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.78em;font-weight:700;letter-spacing:.02em}
.tag{background:var(--ink);color:#fff}
.min{background:var(--accent,var(--lc));color:#fff}
.membrete{border:1.5px solid var(--line);color:var(--muted)}
.kicker{color:var(--muted);font-size:.85em;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.grid{display:grid;gap:clamp(12px,1.4vw,22px)}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid>*{min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,1.6vw,24px)}
.card.edge{border-left:6px solid var(--accent,var(--lc))}
.card.big .lead{font-size:1.3em}
.step{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px}
.step .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;flex:none}
.note{border-left:5px solid var(--accent,var(--lc));background:var(--paper);border-radius:10px;padding:10px 16px;margin-top:12px}
.cita{font-family:var(--display);font-weight:600;line-height:1.35;background:var(--paper);border-left:6px solid var(--lc);border-radius:12px;padding:clamp(16px,2vw,30px);margin:18px 0}
.cita.xl{font-size:clamp(24px,2.6vw,44px)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally .n{display:inline-block;min-width:1.6em;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.pasos{margin:.2em 0 0;padding-left:1.3em}.pasos li{margin:.3em 0}
.sello{margin-top:12px;border:2px dashed var(--oro);border-radius:12px;padding:10px 14px;background:#FDF6EA}
.sello b{display:block;color:var(--oro);font-size:.8em;letter-spacing:.06em;text-transform:uppercase}
.clave{margin-top:12px;display:flex;align-items:center;gap:10px;font-weight:600}
.keychip{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:10px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.2em}
.aviso{margin-top:10px;border-radius:10px;padding:10px 14px;background:#FBEFEF;border-left:5px solid var(--lc);font-size:.92em}
.aviso.sev-aten{background:#EDF5EE;border-left-color:var(--verde)}
.aviso.sev-medi{background:#FDF5E7;border-left-color:var(--oro)}
.icfes .texto{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.6vw,24px);max-height:62vh;overflow:auto;font-size:.95em}
.enun{font-weight:600;font-size:1.08em}
.ops{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.op .L{flex:none;width:1.8em;height:1.8em;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-family:var(--display);font-weight:800}
.op.ok{border-color:var(--verde);background:#EDF5EE}.op.ok .L{background:var(--verde);color:#fff}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick[aria-pressed="true"]{background:var(--lc);border-color:var(--lc);color:#fff}
#scrim{position:fixed;inset:0;background:rgba(15,18,24,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#guia{position:fixed;top:0;right:0;height:100%;width:min(520px,92vw);background:var(--paper);box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column;z-index:10}
#guia.open{transform:none}
#guiahead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg)}
#guiabody{overflow:auto;padding:16px 20px 30px;font-size:.92em}
.gbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.gbox h4{margin:0 0 6px;font-family:var(--display);font-size:.8em;letter-spacing:.07em;text-transform:uppercase;color:var(--lc)}
.gbox ul{margin:0;padding-left:1.1em}.gbox li{margin:.35em 0}
.gbox.como{background:#F6F7F9}.gbox.como h4{color:var(--muted)}
.gbox.apoyo{background:#FDF6EA;border-color:#EAD9B4}.gbox.apoyo h4{color:var(--oro)}
</style>
</head>

íste: pasaste los ojos.<\/p><p>Primero se marca el texto —el subrayado y la pregunta al margen—, después se marca la opción. Una respuesta correcta con el texto en blanco no cuenta como resuelta.<\/p><\/div><\/div>", "guia": {"obj": "Que la regla quede dicha en voz alta antes de cualquier texto.", "decir": ["«La respuesta correcta con la hoja limpia no cuenta. ¿Por qué? Porque en la prueba nadie les va a decir si acertaron: tienen que saber de dónde lo sacaron.»"], "apoyo": ["Si alguien pregunta para qué marcar, la respuesta corta es: porque el ICFES pregunta tres o cuatro cosas distintas del mismo texto, y el que marcó la primera vez no tiene que volver a leerlo entero."]}}, {"m": 0, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Activación<\/span><span class=\"kicker\">Cuaderno cerrado<\/span><\/div><h2>¿Qué palabra pesa más aquí?<\/h2><blockquote class=\"cita xl\">Muchos creen que leer rápido es leer bien. Pero quien lee rápido suele recordar el tema y olvidar el argumento.<\/blockquote><p class=\"lead\">Subráyala en tu cabeza. Escríbele al lado una pregunta.<\/p><div class=\"ctl\"><button class=\"btn\" data-show=\"pista2\">Mostrar la pista<\/button><\/div><div class=\"note\" id=\"pista2\" hidden style=\"--accent:var(--m1)\"><b>Pista:<\/b> la segunda frase no explica: objeta<\/div>", "guia": {"obj": "Que el estudiante note que leer no es pasar los ojos, trabajando sobre un texto corto antes de que aparezca cualquier pregunta de opción múltiple.", "decir": ["Proyecta dos o tres renglones sin decir de dónde salieron ni de qué tratan.", "Pide una sola cosa: subrayar la palabra que más pesa y escribirle una pregunta al lado.", "Ejecuta la dinámica de apertura según la estrategia del encuentro."], "como": "No explica el texto, no da el contexto y no corrige el subrayado. Si alguien pregunta «¿de qué es esto?», lo devuelve: «eso es lo que vamos a averiguar». El cuaderno sigue cerrado.", "apoyo": ["No expliques la frase. Si alguien pregunta de dónde salió, di: «eso es lo que vamos a averiguar». La frase es inventada para la clase: no sale del libro.", "La pista existe para el cierre de los 15 minutos, no para el principio: la segunda frase no explica: objeta."]}}, {"m": 0, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--lc)\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 1 · Qué hace este párrafo<\/span><\/div><h2>El verbo del párrafo<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:var(--lc)\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Cada estudiante recibe cuatro tarjetas: EJEMPLIFICA, OBJETA, MATIZA, CONCLUYE.<\/li><li>El docente lee un párrafo en voz alta.<\/li><li>A la cuenta de tres, todos levantan la tarjeta que creen.<\/li><li>Quien levantó una distinta a la mayoría tiene que leer la frase que lo hizo decidir.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cuatro tarjetas por estudiante<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante note que leer no es pasar los ojos, trabajando sobre un texto corto antes de que aparezca cualquier pregunta de opción múltiple.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto en cinco minutos, pero con el cuerpo.»"], "como": "No explica el texto, no da el contexto y no corrige el subrayado. Si alguien pregunta «¿de qué es esto?», lo devuelve: «eso es lo que vamos a averiguar». El cuaderno sigue cerrado.", "apoyo": ["Qué movimiento mental entrena: Ver qué hace un párrafo, no qué dice. Es el movimiento de las preguntas 1, 2 y 7.", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 1, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m2)\">Pregunta problematizadora<\/span><span class=\"kicker\">Libro abierto en la pregunta modelo<\/span><\/div><h2>Abran el libro en la pregunta modelo del momento 2<\/h2><p class=\"lead\">Antes de releer: ¿cuál creen que es? Levanten la mano.<\/p><div class=\"ctl\"><button class=\"btn tally\" data-tally=\"h2A\">A <span class=\"n\" id=\"h2A\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h2B\">B <span class=\"n\" id=\"h2B\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h2C\">C <span class=\"n\" id=\"h2C\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h2D\">D <span class=\"n\" id=\"h2D\">0<\/span><\/button><button class=\"btn\" data-reset=\"h2\">↺<\/button><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta que gobierna el área<\/h3><p class=\"lead\">¿En qué renglón está eso que estás diciendo?<\/p><p class=\"sub\">Nadie justifica con «yo creo» ni con «se entiende que». Toda respuesta señala una palabra o un renglón del texto.<\/p><\/div>", "guia": {"obj": "Que el estudiante compruebe que la respuesta está en el texto y no en su opinión, usando la pregunta modelo del libro.", "decir": ["Presenta la pregunta modelo del libro y la deja a la vista todo el momento.", "Pide respuestas a mano alzada ANTES de releer, y las anota en el tablero.", "Hace la pregunta que gobierna el área: ¿en qué renglón está eso que estás diciendo?", "Revela la clave solo al final y trabaja el análisis de distractores."], "como": "Regla del momento: nadie justifica con «yo creo» ni con «se entiende que». Toda intervención tiene que señalar una palabra o un renglón concreto del texto.", "apoyo": ["Cuenta las manos tocando cada letra: el número queda en pantalla y sirve para el final del momento, cuando el grupo vea cuántos cambiaron de opinión al volver al texto.", "La clave de la pregunta modelo está en el libro mismo, en el análisis de distractores que viene después. Revélala solo al final de los 20 minutos."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 1 y 2<\/span><span class=\"kicker\">En pantalla, casilla por casilla<\/span><\/div><h2>Preguntas 1 y 2: primero el texto, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:var(--lc)\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 1<\/span><span class=\"min\" style=\"--accent:var(--lc)\">E1 · Qué hace este párrafo<\/span><\/div><p class=\"sub\">Post en redes · el último párrafo, «lo más irónico»<\/p><h3 style=\"color:var(--lc)\">Un párrafo no hace lo mismo al principio que al final<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k21\"><span class=\"keychip\" style=\"background:var(--lc)\">C<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:var(--lc)\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 2<\/span><span class=\"min\" style=\"--accent:var(--lc)\">E1 · Qué hace este párrafo<\/span><\/div><p class=\"sub\">Cosas que solo los árboles saben · el tercer párrafo<\/p><h3 style=\"color:var(--lc)\">Busca el verbo que delata lo que el párrafo hace<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k21\"><span class=\"keychip\" style=\"background:var(--lc)\">B<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k21\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante marque el texto antes de mirar las opciones, y deje por escrito de dónde sacó lo que va a responder.", "decir": ["«Antes de marcar: ¿qué subrayaron? Léanme el renglón.»", "Si alguien se traba, pregúntale qué subrayó. Si la hoja está limpia, vuelve al texto antes que a la respuesta."], "como": "No parafrasea el texto ni lo resume. Si un estudiante se traba, le pregunta qué subrayó; si la hoja está limpia, lo devuelve a leer antes que a responder.", "apoyo": ["Las claves del libro son 1·C y 2·B. No las reveles hasta que todos tengan el texto marcado: el botón es para el cierre del bloque."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 3 y 4<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 3 y 4: primero el texto, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:var(--oro)\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 3<\/span><span class=\"min\" style=\"--accent:var(--oro)\">E3 · Para qué lo escribió<\/span><\/div><p class=\"sub\">Los árboles · para qué compara árboles con humanos<\/p><h3 style=\"color:var(--oro)\">Casi nunca se compara por comparar<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Metáfora extendida<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k23\"><span class=\"keychip\" style=\"background:var(--oro)\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:var(--azul)\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 4<\/span><span class=\"min\" style=\"--accent:var(--azul)\">E2 · La crítica que no se ve<\/span><\/div><p class=\"sub\">Los árboles · la crítica del segundo párrafo<\/p><h3 style=\"color:var(--azul)\">Rastrea las palabras del texto dentro de las opciones<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k23\"><span class=\"keychip\" style=\"background:var(--azul)\">C<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k23\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante marque el texto antes de mirar las opciones, y deje por escrito de dónde sacó lo que va a responder.", "decir": ["«Antes de marcar: ¿qué subrayaron? Léanme el renglón.»", "Si alguien se traba, pregúntale qué subrayó. Si la hoja está limpia, vuelve al texto antes que a la respuesta."], "como": "No parafrasea el texto ni lo resume. Si un estudiante se traba, le pregunta qué subrayó; si la hoja está limpia, lo devuelve a leer antes que a responder.", "apoyo": ["Las claves del libro son 3·B y 4·C. No las reveles hasta que todos tengan el texto marcado: el botón es para el cierre del bloque.", "Pregunta 3 · Metáfora extendida: Una comparación que no se usa una vez: organiza el texto entero. Cada parte del texto corresponde a una parte de la imagen. Para destrabar: «Si el texto fuera la imagen, ¿qué parte de la imagen es este párrafo?»"]}}, {"m": 2, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--azul)\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 2 · La crítica que no se ve<\/span><\/div><h2>Miente u omite<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:var(--azul)\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Tres zonas en el piso: MIENTE, OMITE y NI LO UNO NI LO OTRO.<\/li><li>El docente lee afirmaciones sobre un texto que todos tienen a la vista.<\/li><li>Cada estudiante se para en una zona.<\/li><li>Para quedarse tiene que señalar en el texto lo que dice o lo que calla.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Tres zonas marcadas · el texto proyectado<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante marque el texto antes de mirar las opciones, y deje por escrito de dónde sacó lo que va a responder.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto en cinco minutos, pero con el cuerpo.»"], "como": "No parafrasea el texto ni lo resume. Si un estudiante se traba, le pregunta qué subrayó; si la hoja está limpia, lo devuelve a leer antes que a responder.", "apoyo": ["Qué movimiento mental entrena: Distinguir las formas en que un texto critica sin decirlo: no es lo mismo mentir que omitir. Es el movimiento de las preguntas 4, 6 y 8.", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 5 y 6<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 5 y 6: primero el texto, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:var(--morado)\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 5<\/span><span class=\"min\" style=\"--accent:var(--morado)\">E4 · Cómo se enlazan<\/span><\/div><p class=\"sub\">Caricatura · el gráfico contra la fila del fondo<\/p><h3 style=\"color:var(--morado)\">Una caricatura se lee por planos, del frente al fondo<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k25\"><span class=\"keychip\" style=\"background:var(--morado)\">A<\/span> es la clave del libro<\/div><div class=\"aviso sev-aten\" hidden data-grupo=\"k25\"><b>Ojo con esta clave:<\/b> Dos opciones afirman que el gráfico contradice la escena; una agrega una mayoría que el dibujo no muestra.<\/div><\/div><div class=\"card edge\" style=\"--accent:var(--azul)\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 6<\/span><span class=\"min\" style=\"--accent:var(--azul)\">E2 · La crítica que no se ve<\/span><\/div><p class=\"sub\">Caricatura · «la estadística a veces miente… o simplemente omite»<\/p><h3 style=\"color:var(--azul)\">«Miente» y «omite» no son la misma acusación<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k25\"><span class=\"keychip\" style=\"background:var(--azul)\">C<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k25\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante marque el texto antes de mirar las opciones, y deje por escrito de dónde sacó lo que va a responder.", "decir": ["«Antes de marcar: ¿qué subrayaron? Léanme el renglón.»", "Si alguien se traba, pregúntale qué subrayó. Si la hoja está limpia, vuelve al texto antes que a la respuesta."], "como": "No parafrasea el texto ni lo resume. Si un estudiante se traba, le pregunta qué subrayó; si la hoja está limpia, lo devuelve a leer antes que a responder.", "apoyo": ["Las claves del libro son 5·A y 6·C. No las reveles hasta que todos tengan el texto marcado: el botón es para el cierre del bloque.", "Pregunta 5 · aviso del libro (atención): Dos opciones afirman que el gráfico contradice la escena; una agrega una mayoría que el dibujo no muestra. Qué haces: No es un error de fondo, pero si un estudiante defiende la otra, pídele que señale la mayoría en el dibujo. Ahí se cae sola."]}}, {"m": 2, "min": 10, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--oro)\">Dinámica · 10 min<\/span><span class=\"kicker\">Entrena la estrategia 3 · Para qué lo escribió<\/span><\/div><h2>Un verbo para todo el texto<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:var(--oro)\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Cada equipo lee el mismo texto y escribe UN verbo que diga para qué fue escrito.<\/li><li>Los verbos se escriben en el tablero, uno al lado del otro.<\/li><li>Cada equipo tiene que mostrar en el texto lo que respalda su verbo.<\/li><li>Se tachan los verbos que no aguantan la prueba.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Tablero · el mismo texto para todos<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante marque el texto antes de mirar las opciones, y deje por escrito de dónde sacó lo que va a responder.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto en cinco minutos, pero con el cuerpo.»"], "como": "No parafrasea el texto ni lo resume. Si un estudiante se traba, le pregunta qué subrayó; si la hoja está limpia, lo devuelve a leer antes que a responder.", "apoyo": ["Qué movimiento mental entrena: Ver que todo texto tiene un verbo que lo resume y que la intención se demuestra con el texto, no con la opinión. Es el movimiento de las preguntas 3 y 9.", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 7 y 8<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 7 y 8: primero el texto, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:var(--lc)\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 7<\/span><span class=\"min\" style=\"--accent:var(--lc)\">E1 · Qué hace este párrafo<\/span><\/div><p class=\"sub\">El lado solitario del algoritmo · el tercer párrafo<\/p><h3 style=\"color:var(--lc)\">Arma la cadena de los tres párrafos<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k27\"><span class=\"keychip\" style=\"background:var(--lc)\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:var(--azul)\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 8<\/span><span class=\"min\" style=\"--accent:var(--azul)\">E2 · La crítica que no se ve<\/span><\/div><p class=\"sub\">El algoritmo · «burbuja cómoda, pero también peligrosa»<\/p><h3 style=\"color:var(--azul)\">Cuando hay un «pero», el peso cae del lado derecho<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k27\"><span class=\"keychip\" style=\"background:var(--azul)\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k27\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante marque el texto antes de mirar las opciones, y deje por escrito de dónde sacó lo que va a responder.", "decir": ["«Antes de marcar: ¿qué subrayaron? Léanme el renglón.»", "Si alguien se traba, pregúntale qué subrayó. Si la hoja está limpia, vuelve al texto antes que a la respuesta."], "como": "No parafrasea el texto ni lo resume. Si un estudiante se traba, le pregunta qué subrayó; si la hoja está limpia, lo devuelve a leer antes que a responder.", "apoyo": ["Las claves del libro son 7·B y 8·A. No las reveles hasta que todos tengan el texto marcado: el botón es para el cierre del bloque."]}}, {"m": 2, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--morado)\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 4 · Cómo se enlazan<\/span><\/div><h2>Cambia el conector<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:var(--morado)\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Se proyecta una frase con un conector subrayado.<\/li><li>El grupo propone otros conectores para reemplazarlo.<\/li><li>Cada uno se lee en voz alta dentro de la frase.<\/li><li>Se decide cuáles mantienen la relación entre las dos ideas y cuáles la rompen.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Proyector · una frase con conector<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante marque el texto antes de mirar las opciones, y deje por escrito de dónde sacó lo que va a responder.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el texto en cinco minutos, pero con el cuerpo.»"], "como": "No parafrasea el texto ni lo resume. Si un estudiante se traba, le pregunta qué subrayó; si la hoja está limpia, lo devuelve a leer antes que a responder.", "apoyo": ["Qué movimiento mental entrena: Ver que la relación entre dos ideas está escrita en el conector. Es el movimiento de las preguntas 5 y 10, y de la del ICFES sobre la función del «Pero».", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 9 y 10<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 9 y 10: primero el texto, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:var(--oro)\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 9<\/span><span class=\"min\" style=\"--accent:var(--oro)\">E3 · Para qué lo escribió<\/span><\/div><p class=\"sub\">El algoritmo · el propósito de todo el texto<\/p><h3 style=\"color:var(--oro)\">Todo texto tiene un verbo que lo resume<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k29\"><span class=\"keychip\" style=\"background:var(--oro)\">C<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:var(--morado)\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 10<\/span><span class=\"min\" style=\"--accent:var(--morado)\">E4 · Cómo se enlazan<\/span><\/div><p class=\"sub\">El algoritmo · «la fricción con ideas distintas»<\/p><h3 style=\"color:var(--morado)\">La relación está escrita: búscala en el conector<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Conectores lógicos<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k29\"><span class=\"keychip\" style=\"background:var(--morado)\">B<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k29\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante marque el texto antes de mirar las opciones, y deje por escrito de dónde sacó lo que va a responder.", "decir": ["«Antes de marcar: ¿qué subrayaron? Léanme el renglón.»", "Si alguien se traba, pregúntale qué subrayó. Si la hoja está limpia, vuelve al texto antes que a la respuesta."], "como": "No parafrasea el texto ni lo resume. Si un estudiante se traba, le pregunta qué subrayó; si la hoja está limpia, lo devuelve a leer antes que a responder.", "apoyo": ["Las claves del libro son 9·C y 10·B. No las reveles hasta que todos tengan el texto marcado: el botón es para el cierre del bloque.", "Pregunta 10 · Conectores lógicos: Dicen qué relación hay entre dos ideas. Causa: porque, ya que. Consecuencia: por eso, así que. Contraste: pero, sin embargo. Adición: además. Reformulación: es decir. Para destrabar: «Cambia el conector por otro de la lista. ¿Se rompe la frase?»"]}}, {"m": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m4)\">Reto en equipo · 20 min<\/span><span class=\"kicker\">Equipos de tres · cada uno responde en su cuaderno<\/span><\/div><h2>Reto del corte: El verbo de cada párrafo<\/h2><div class=\"card big edge mt\" style=\"--accent:var(--m4)\"><p class=\"lead\">Cada equipo recibe un texto de cuatro párrafos desordenados. Deben asignar a cada párrafo un verbo —ejemplifica, objeta, matiza, concluye— y pasarle SOLO la lista de verbos a otro equipo. El otro equipo tiene que reconstruir el orden del texto con esa lista. Gana el equipo cuyos verbos permitieron reconstruirlo.<\/p><\/div><div class=\"note mt\" style=\"--accent:var(--m4)\"><b>La defensa:<\/b> tres minutos por equipo, leyendo en voz alta el renglón que los respalda. Citar de memoria no cuenta.<\/div>", "guia": {"obj": "Que el estudiante defienda su lectura con el texto en la mano y acepte que otra lectura también puede estar sostenida.", "decir": ["Arma equipos de tres y entrega el reto del corte de este momento.", "Exige que cada integrante llegue con su cuaderno YA diligenciado individualmente.", "Da tres minutos de defensa por equipo: deben leer en voz alta el renglón que los respalda.", "Cierra señalando dónde el texto permite las dos lecturas y dónde no."], "como": "El equipo discute, pero cada uno responde en SU cuaderno. No se acepta una defensa sin lectura en voz alta del fragmento: citar de memoria no cuenta.", "apoyo": ["El reto no tiene una sola respuesta correcta: gana el equipo que mejor sostiene la suya con el texto. Si dos lecturas están sostenidas, dilo: eso también es leer bien.", "Si un equipo entrega una sola hoja para los tres, el reto no cuenta. La discusión es compartida; el registro es individual."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 1<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Ética para Amador (fragmento)<\/h3><p>Quieres darte la buena vida: estupendo.<\/p><p>Pero también quieres que esa buena vida no sea la buena vida de una coliflor o de un\nescarabajo, con todo mi respeto para ambas especies, sino una buena vida humana. Es lo que te\ncorresponde, creo yo. Y estoy seguro de que a ello no renunciarías por nada del mundo. Ser\nhumano, ya lo hemos indicado antes, consiste principalmente en tener relaciones con los otros\nseres humanos. Si pudieras tener muchísimo dinero, una casa más lujosa que un palacio de las\nmil y una noches, las mejores ropas, los más exquisitos alimentos —en tu caso, muchísimas\nlentejas—, los más sofisticados aparatos, etc., pero todo ello a costa de no volver a ver ni a\nser visto por ningún ser humano jamás, ¿estarías contento? ¿Cuánto tiempo podrías vivir así sin\nvolverte loco? ¿No es la mayor de las locuras querer las cosas a costa de la relación con las\npersonas? ¡Pero si precisamente la gracia de todas esas cosas radica en que te permiten —o\nparecen permitirte— relacionarte más favorablemente con los demás! Por medio del dinero se\nespera poder deslumbrar o comprar a los otros; las ropas son para gustarles o para que nos\nenvidien; y lo mismo la buena casa, los mejores vinos, etcétera. Muy pocas cosas conservan su\ngracia en la soledad; y si la soledad es completa y definitiva, todas las cosas resultan\ntristes inevitablemente. La buena vida humana es una buena vida entre seres humanos o de lo\ncontrario puede que sea vida, pero no será ni buena ni humana.<\/p><\/div><div><p class=\"enun\">Lea el siguiente fragmento del texto. ¿Qué función cumple este fragmento al interior del texto?<\/p><div class=\"ops\" id=\"icf21\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>Presenta la tesis general del texto.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>Introduce el tema que se trata en el texto.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>Expone la conclusión general del texto.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Sintetiza el contenido del texto.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf21\" data-k=\"B\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con textos que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué subrayaste en el texto antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin subrayar, se le anota, no se le corrige.", "apoyo": ["La clave es la B.", "La diferencia entre *tema y tesis*, que es lo que decide la primera pregunta. El tema es de qué habla (qué es una buena vida humana); la tesis es qué defiende (ser humano es tener relaciones con otros). El fragmento de la coliflor y el escarabajo abre el tema, no la tesis.", "Las *cuatro preguntas retóricas seguidas y los ejemplos (dinero, ropa, casa, vinos). Y que no cita a ninguna autoridad*: eso es lo que tumba una de las opciones."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 2<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Ética para Amador (fragmento)<\/h3><p>Quieres darte la buena vida: estupendo.<\/p><p>Pero también quieres que esa buena vida no sea la buena vida de una coliflor o de un\nescarabajo, con todo mi respeto para ambas especies, sino una buena vida humana. Es lo que te\ncorresponde, creo yo. Y estoy seguro de que a ello no renunciarías por nada del mundo. Ser\nhumano, ya lo hemos indicado antes, consiste principalmente en tener relaciones con los otros\nseres humanos. Si pudieras tener muchísimo dinero, una casa más lujosa que un palacio de las\nmil y una noches, las mejores ropas, los más exquisitos alimentos —en tu caso, muchísimas\nlentejas—, los más sofisticados aparatos, etc., pero todo ello a costa de no volver a ver ni a\nser visto por ningún ser humano jamás, ¿estarías contento? ¿Cuánto tiempo podrías vivir así sin\nvolverte loco? ¿No es la mayor de las locuras querer las cosas a costa de la relación con las\npersonas? ¡Pero si precisamente la gracia de todas esas cosas radica en que te permiten —o\nparecen permitirte— relacionarte más favorablemente con los demás! Por medio del dinero se\nespera poder deslumbrar o comprar a los otros; las ropas son para gustarles o para que nos\nenvidien; y lo mismo la buena casa, los mejores vinos, etcétera. Muy pocas cosas conservan su\ngracia en la soledad; y si la soledad es completa y definitiva, todas las cosas resultan\ntristes inevitablemente. La buena vida humana es una buena vida entre seres humanos o de lo\ncontrario puede que sea vida, pero no será ni buena ni humana.<\/p><\/div><div><p class=\"enun\">¿Qué tipo de estrategia argumentativa utiliza el autor para convencer al lector de su posición?<\/p><div class=\"ops\" id=\"icf22\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>El autor introduce el tema y la tesis con ironía, para hacer entender lo contrario de lo que dice, con la intención de restarle credibilidad a dicha tesis.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>El autor contextualiza el problema sobre la buena vida, presenta algunas opiniones suyas sobre el tema y concluye con la tesis contraria.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>El autor introduce el tema y la tesis a través de diversas preguntas retóricas, ofreciendo ejemplos que lo conducen a una conclusión.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>El autor contextualiza el problema sobre la buena vida, presenta su tesis y la defiende con la ayuda de ejemplos dados por autoridades en el tema.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf22\" data-k=\"C\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con textos que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué subrayaste en el texto antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin subrayar, se le anota, no se le corrige.", "apoyo": ["La clave es la C.", "La diferencia entre *tema y tesis*, que es lo que decide la primera pregunta. El tema es de qué habla (qué es una buena vida humana); la tesis es qué defiende (ser humano es tener relaciones con otros). El fragmento de la coliflor y el escarabajo abre el tema, no la tesis.", "Las *cuatro preguntas retóricas seguidas y los ejemplos (dinero, ropa, casa, vinos). Y que no cita a ninguna autoridad*: eso es lo que tumba una de las opciones."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 3<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Parábola de la solitaria<\/h3><p>Querido amigo:<\/p><p>Usted ha decidido dedicarse a la literatura, ¿ahora qué?<\/p><p>Su decisión de asumir su afición por la literatura como un destino deberá convertirse en\nservidumbre, en nada menos que esclavitud. Para explicarlo de una manera gráfica, le diré que\nacaba usted de hacer algo que, por lo visto, hacían en el siglo XIX algunas damas espantadas\ncon el grosor de su cuerpo, que, a fin de recobrar una silueta de sílfide, se tragaban una\nsolitaria. ¿Ha tenido usted ocasión de ver a alguien que lleva en sus entrañas ese horrendo\nparásito? Yo sí, y puedo asegurarle que aquellas damas eran unas heroínas, unas mártires de la\nbelleza. A comienzos de los años sesenta, en París, yo tenía un magnífico amigo, José María, un\nmuchacho español, pintor y cineasta, que padeció esa enfermedad. Una vez que la solitaria se\ninstala en el organismo se consubstancia con él, se alimenta de él, crece y se fortalece a\nexpensas de él, y es dificilísimo expulsarla de ese cuerpo del que medra, al que tiene\ncolonizado. José María enflaquecía, a pesar de que debía comer y beber líquidos (leche, sobre\ntodo) constantemente para aplacar la ansiedad del animal aposentado en sus entrañas, pues, si\nno, su malestar se volvía insoportable. Pero todo lo que comía y bebía no era para su gusto y\nplacer, sino para los de la solitaria. Un día, que estábamos conversando en un pequeño bistrot\nde Montparnasse, me sorprendió con esta confesión: «Nosotros hacemos tantas cosas juntos. Vamos\nal cine, a exposiciones, a recorrer librerías, y discutimos horas de horas sobre política,\nlibros, amigos comunes. Y tú crees que yo estoy haciendo esas cosas como las haces tú, porque\nte divierte hacerlas. Pero te equivocas. Yo las hago para ella, la solitaria. Esa es la\nimpresión que tengo: que todo en mi vida, ahora, no lo vivo para mí, sino para ese ser que\nllevo adentro, del que ya no soy más que un sirviente».<\/p><p>Desde entonces, me gusta comparar la situación del escritor con la de mi amigo José María\ncuando llevaba adentro la solitaria.<\/p><\/div><div><p class=\"enun\">Al comentar que algunas mujeres del siglo XIX se tragaban una solitaria para recobrar una silueta esbelta, el autor<\/p><div class=\"ops\" id=\"icf23\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>exalta el valor de aquellas mujeres que realizaban tal acción.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>desaprueba que aquellas mujeres realizaran tal acción.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>condena que aquellas mujeres realizaran sacrificios en nombre de la belleza.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>aprueba las formas de esclavitud a las que se sometían voluntariamente aquellas mujeres.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf23\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con textos que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué subrayaste en el texto antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin subrayar, se le anota, no se le corrige.", "apoyo": ["La clave es la A.", "Es una *carta: hay un «usted» al que se le habla. Dentro de la carta hay una parábola y dentro de la parábola una cita textual de José María. Tres niveles de voz en una página. Vale la pena dibujarlos en el tablero, porque es lo mismo que vieron en Satanás* en la Misión 1 con el monólogo interior.", "La comparación no es un adorno: *organiza todo el texto. Escritor = mujer del siglo XIX; literatura = solitaria. Y el término que las une está dicho sin rodeos al principio: servidumbre, esclavitud*.", "La palabra *«heroínas»* es la que decide una de las preguntas. El autor no dice «las admiro»: lo deja en esa palabra. Conviene preguntarle al curso quién usa esa palabra y para quién.", "Palabras que suelen frenar: *sílfide, medra, consubstancia, aposentado, servidumbre*."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 4<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Parábola de la solitaria<\/h3><p>Querido amigo:<\/p><p>Usted ha decidido dedicarse a la literatura, ¿ahora qué?<\/p><p>Su decisión de asumir su afición por la literatura como un destino deberá convertirse en\nservidumbre, en nada menos que esclavitud. Para explicarlo de una manera gráfica, le diré que\nacaba usted de hacer algo que, por lo visto, hacían en el siglo XIX algunas damas espantadas\ncon el grosor de su cuerpo, que, a fin de recobrar una silueta de sílfide, se tragaban una\nsolitaria. ¿Ha tenido usted ocasión de ver a alguien que lleva en sus entrañas ese horrendo\nparásito? Yo sí, y puedo asegurarle que aquellas damas eran unas heroínas, unas mártires de la\nbelleza. A comienzos de los años sesenta, en París, yo tenía un magnífico amigo, José María, un\nmuchacho español, pintor y cineasta, que padeció esa enfermedad. Una vez que la solitaria se\ninstala en el organismo se consubstancia con él, se alimenta de él, crece y se fortalece a\nexpensas de él, y es dificilísimo expulsarla de ese cuerpo del que medra, al que tiene\ncolonizado. José María enflaquecía, a pesar de que debía comer y beber líquidos (leche, sobre\ntodo) constantemente para aplacar la ansiedad del animal aposentado en sus entrañas, pues, si\nno, su malestar se volvía insoportable. Pero todo lo que comía y bebía no era para su gusto y\nplacer, sino para los de la solitaria. Un día, que estábamos conversando en un pequeño bistrot\nde Montparnasse, me sorprendió con esta confesión: «Nosotros hacemos tantas cosas juntos. Vamos\nal cine, a exposiciones, a recorrer librerías, y discutimos horas de horas sobre política,\nlibros, amigos comunes. Y tú crees que yo estoy haciendo esas cosas como las haces tú, porque\nte divierte hacerlas. Pero te equivocas. Yo las hago para ella, la solitaria. Esa es la\nimpresión que tengo: que todo en mi vida, ahora, no lo vivo para mí, sino para ese ser que\nllevo adentro, del que ya no soy más que un sirviente».<\/p><p>Desde entonces, me gusta comparar la situación del escritor con la de mi amigo José María\ncuando llevaba adentro la solitaria.<\/p><\/div><div><p class=\"enun\">Considere el siguiente fragmento. ¿Cuál es la función de la expresión «Pero» en el fragmento?<\/p><div class=\"ops\" id=\"icf24\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>Enunciar las ventajas y desventajas de una situación.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>Mostrar una relación de producción o causa-efecto.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>Realizar un contraste entre dos situaciones.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Relacionar dos ideas iguales.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf24\" data-k=\"C\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con textos que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué subrayaste en el texto antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin subrayar, se le anota, no se le corrige.", "apoyo": ["La clave es la C.", "Es una *carta: hay un «usted» al que se le habla. Dentro de la carta hay una parábola y dentro de la parábola una cita textual de José María. Tres niveles de voz en una página. Vale la pena dibujarlos en el tablero, porque es lo mismo que vieron en Satanás* en la Misión 1 con el monólogo interior.", "La comparación no es un adorno: *organiza todo el texto. Escritor = mujer del siglo XIX; literatura = solitaria. Y el término que las une está dicho sin rodeos al principio: servidumbre, esclavitud*.", "La palabra *«heroínas»* es la que decide una de las preguntas. El autor no dice «las admiro»: lo deja en esa palabra. Conviene preguntarle al curso quién usa esa palabra y para quién.", "Palabras que suelen frenar: *sílfide, medra, consubstancia, aposentado, servidumbre*."]}}, {"m": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m6)\">Cierre<\/span><span class=\"kicker\">La pregunta de siempre<\/span><\/div><h2>¿En qué se parecía la pregunta del ICFES a la de tu libro?<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:var(--lc)\"><div class=\"k\">1<\/div><div><b>Qué hace este párrafo<\/b><\/div><\/div><div class=\"step\" style=\"--accent:var(--azul)\"><div class=\"k\">2<\/div><div><b>La crítica que no se ve<\/b><\/div><\/div><div class=\"step\" style=\"--accent:var(--oro)\"><div class=\"k\">3<\/div><div><b>Para qué lo escribió<\/b><\/div><\/div><div class=\"step\" style=\"--accent:var(--morado)\"><div class=\"k\">4<\/div><div><b>Cómo se enlazan<\/b><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--m6)\"><h3>Antes de salir<\/h3><ol class=\"pasos\"><li>La palabra nueva del día, en la franja de vocabulario, con tus palabras.<\/li><li>«Lo que me llevo de esta pregunta».<\/li><li>Tu carita de salida.<\/li><li>La casilla 2 de la portada del área.<\/li><\/ol><\/div><\/div>", "guia": {"obj": "Que el estudiante nombre la estrategia que usó y se lleve una palabra nueva del día, escrita en sus propios términos.", "decir": ["Socializa solo las preguntas que el grupo falló, pidiendo el renglón que las sostiene.", "Pide que lean en voz alta su salvavidas: la ruta mínima que los habría salvado.", "Cada uno escribe la palabra nueva del día en la franja de vocabulario de su hoja."], "como": "No dicta la definición. La palabra nueva se escribe como el estudiante la entendió; si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase.", "apoyo": ["La palabra nueva no se dicta. Si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase: es mejor que dictarla bien.", "Para el cierre del momento: Esta misión introduce la caricatura como texto discontinuo. Se lee por planos, del frente al fondo, y eso hay que mostrarlo señalando con el dedo en la proyección."]}}];
var MOM = [{"n": 1, "nom": "Activación", "min": 15, "c": "--m1"}, {"n": 2, "nom": "Pregunta problematizadora", "min": 20, "c": "--m2"}, {"n": 3, "nom": "Desarrollo guiado", "min": 35, "c": "--m3"}, {"n": 4, "nom": "Reto en equipo", "min": 20, "c": "--m4"}, {"n": 5, "nom": "Evaluación individual", "min": 20, "c": "--m5"}, {"n": 6, "nom": "Cierre", "min": 10, "c": "--m6"}];
var NOMBRE = document.getElementById("momnom").textContent, SUB = document.getElementById("momsub").textContent;
var $ = function(s){ return document.querySelector(s); };
var wrap = $("#wrap"), stage = $("#stage"), i = 0;
var tBase = 0, tLeft = 0, tOn = false, tick = null;
var elegidas = [];
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function paintClock(){
  var n = $("#tnum");
  if(!tBase){ n.textContent = "—"; n.classList.remove("over"); return; }
  var s = Math.abs(tLeft), mm = Math.floor(s/60), ss = s%60;
  n.textContent = (tLeft<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", tLeft<0);
}
function setTimer(min){
  tBase = min||0; tLeft = tBase*60; tOn = false;
  if(tick){ clearInterval(tick); tick = null; }
  $("#play").textContent = "Iniciar"; paintClock();
}
function toggleTimer(){
  if(!tBase) return;
  tOn = !tOn; $("#play").textContent = tOn ? "Pausar" : "Seguir";
  if(tick){ clearInterval(tick); tick = null; }
  if(tOn) tick = setInterval(function(){ tLeft--; paintClock(); }, 1000);
  paintClock();
}
function guiaHTML(g){
  if(!g) return '<p class="sub">Sin notas para esta diapositiva.</p>';
  var h = '<div class="gbox"><h4>Objetivo</h4><p>'+esc(g.obj)+'</p></div>';
  if(g.decir && g.decir.length) h += '<div class="gbox"><h4>Qué haces y qué dices</h4><ul>'+
     g.decir.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  if(g.como) h += '<div class="gbox como"><h4>Lo que no haces</h4><p>'+esc(g.como)+'</p></div>';
  if(g.apoyo && g.apoyo.length) h += '<div class="gbox apoyo"><h4>Si la lectura crítica no es tu fuerte</h4><ul>'+
     g.apoyo.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  return h;
}
function pintaElegidas(){
  var box = document.getElementById("elegidas"); if(!box) return;
  if(!elegidas.length){ box.innerHTML = '<p class="sub">Vuelve a la diapositiva anterior y escoge las cinco.</p>'; return; }
  box.innerHTML = elegidas.map(function(t,k){
    return '<div class="card edge" style="--accent:var(--m'+((k%6)+1)+')"><h3>'+(k+1)+'. '+esc(t)+'</h3>'+
      '<p class="sub">Busca esta pregunta en tu simulacro y en la hoja de taller de la misma estrategia.</p></div>';
  }).join("");
}
function go(n){
  var prev = SC[i];
  i = Math.max(0, Math.min(SC.length-1, n));
  var s = SC[i];
  wrap.innerHTML = s.html;
  wrap.classList.remove("enter"); void wrap.offsetWidth; wrap.classList.add("enter");
  stage.scrollTop = 0;
  var m = s.m!=null ? MOM[s.m] : null;
  $("#momdot").style.background = m ? "var("+m.c+")" : "var(--faint)";
  $("#momdot").textContent = m ? m.n : "·";
  $("#momnom").textContent = m ? m.nom : NOMBRE;
  $("#momsub").textContent = m ? (m.min+" minutos") : SUB;
  var want = s.min!=null ? s.min : (m ? m.min : 0);
  var cambio = !prev || prev===s || prev.m!==s.m || (prev.min||null)!==(s.min||null);
  if(cambio) setTimer(want);
  $("#count").textContent = (i+1)+" / "+SC.length;
  $("#prog i").style.width = (SC.length>1 ? i/(SC.length-1)*100 : 100)+"%";
  $("#guiabody").innerHTML = guiaHTML(s.guia);
  [].forEach.call(wrap.querySelectorAll("[data-pick]"), function(b){
    b.setAttribute("aria-pressed", elegidas.indexOf(b.textContent)>=0 ? "true" : "false"); });
  pintaElegidas();
}
wrap.addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.dataset.show){ var t = document.getElementById(b.dataset.show); if(t) t.hidden = !t.hidden; }
  if(b.dataset.showgrupo){
    var g = wrap.querySelectorAll('[data-grupo="'+b.dataset.showgrupo+'"]'), abrir = g.length && g[0].hidden;
    [].forEach.call(g, function(x){ x.hidden = !abrir; });
    b.textContent = abrir ? "Ocultar las claves" : "Revelar las claves";
  }
  if(b.dataset.clave){
    var box = document.getElementById(b.dataset.clave), ok = box.querySelector('[data-op="'+b.dataset.k+'"]');
    var on = ok && !ok.classList.contains("ok");
    [].forEach.call(box.querySelectorAll(".op"), function(o){ o.classList.remove("ok"); });
    if(on) ok.classList.add("ok");
    b.textContent = on ? "Ocultar la clave" : "Revelar la clave";
  }
  if(b.dataset.tally){ var n = document.getElementById(b.dataset.tally); n.textContent = (+n.textContent||0)+1; }
  if(b.dataset.reset){ [].forEach.call(wrap.querySelectorAll('[id^="'+b.dataset.reset+'"]'), function(x){
    if(x.classList.contains("n")) x.textContent = "0"; }); }
  if(b.dataset.pick!=null){
    var t = b.textContent, k = elegidas.indexOf(t);
    if(k>=0) elegidas.splice(k,1); else if(elegidas.length<5) elegidas.push(t);
    b.setAttribute("aria-pressed", elegidas.indexOf(t)>=0 ? "true" : "false");
  }
});
function setGuia(on){ $("#guia").classList.toggle("open", on); $("#scrim").classList.toggle("on", on);
  $("#gbtn").setAttribute("aria-pressed", on ? "true" : "false"); }
$("#next").addEventListener("click", function(){ go(i+1); });
$("#prev").addEventListener("click", function(){ go(i-1); });
$("#play").addEventListener("click", toggleTimer);
$("#reset").addEventListener("click", function(){ setTimer(tBase); });
$("#gbtn").addEventListener("click", function(){ setGuia(!$("#guia").classList.contains("open")); });
$("#gclose").addEventListener("click", function(){ setGuia(false); });
$("#scrim").addEventListener("click", function(){ setGuia(false); });
document.addEventListener("keydown", function(e){
  var t = e.target.tagName; if(t==="INPUT"||t==="TEXTAREA") return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ go(i+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ go(i-1); e.preventDefault(); }
  else if(e.key==="Home"){ go(0); e.preventDefault(); }
  else if(e.key==="End"){ go(SC.length-1); e.preventDefault(); }
  else if(e.key==="g"||e.key==="G"){ setGuia(!$("#guia").classList.contains("open")); }
  else if(e.key==="t"||e.key==="T"){ toggleTimer(); }
  else if(e.key==="Escape"){ setGuia(false); }
});
go(0);
})();
</script>
</body>
</html>
