<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Matemáticas · Clase 1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>[hidden]{display:none!important}
:root{
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --text:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --area:#1F4E8C; --azul:#242478; --oro:#B0711A; --morado:#5B3E96; --verde:#2E7A39;
  --m1:#1F4E8C; --m2:#A23B72; --m3:#5B3E96; --m4:#0E7C86; --m5:#3E4A5C; --m6:#8C5A2B; --rojo:#A82424;
  --ink:#1B1F27; --muted:#5C6472; --faint:#A9B0BB; --line:#E3E7ED; --paper:#FFFFFF; --bg:#F6F4F1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:clamp(16px,1.25vw,21px);line-height:1.5}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
#top{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding:10px clamp(14px,2vw,28px);background:var(--paper);flex-wrap:wrap}
.logo img{height:clamp(28px,2.6vw,40px);display:block}
#mom{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
#momdot{width:clamp(30px,2.4vw,40px);height:clamp(30px,2.4vw,40px);border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;background:var(--faint)}
#momnom{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.2vw,20px)}
#momsub{color:var(--muted);font-size:.85em}
#clock{display:flex;align-items:center;gap:8px}
#tnum{font-family:var(--display);font-weight:800;font-size:clamp(20px,1.8vw,30px);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
#tnum.over{color:var(--area)}
.btn{appearance:none;font:inherit;font-size:.86em;font-weight:600;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.solid{background:var(--area);border-color:var(--area);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#stage{overflow:auto;padding:clamp(18px,3vw,48px) clamp(16px,4vw,72px)}
#wrap{max-width:1500px;margin:0 auto}
#wrap.enter{animation:ent .28s ease-out}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bot{display:flex;align-items:center;gap:12px;padding:10px clamp(14px,2vw,28px);background:var(--paper)}
#prog{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
#prog i{display:block;height:100%;background:var(--area);transition:width .25s}
#count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
#hint{color:var(--faint);font-size:.8em}
@media (max-width:760px){#hint{display:none}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.2vw,68px);line-height:1.05;margin:.2em 0 .25em;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,2.8vw,46px);line-height:1.1;margin:.25em 0 .3em;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:clamp(18px,1.5vw,26px);margin:.1em 0 .4em;line-height:1.2}
p{margin:.35em 0 .6em}
.lead{font-size:1.2em;line-height:1.45;max-width:70ch}
.sub{color:var(--muted)}
.mt{margin-top:clamp(14px,1.8vw,26px)}
.logo-xl img{height:clamp(54px,6vw,96px);margin-bottom:12px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tag,.min,.membrete{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.78em;font-weight:700;letter-spacing:.02em}
.tag{background:var(--ink);color:#fff}
.min{background:var(--accent,var(--area));color:#fff}
.membrete{border:1.5px solid var(--line);color:var(--muted)}
.kicker{color:var(--muted);font-size:.85em;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.grid{display:grid;gap:clamp(12px,1.4vw,22px)}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid>*{min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,1.6vw,24px)}
.card.edge{border-left:6px solid var(--accent,var(--area))}
.card.big .lead{font-size:1.3em}
.step{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px}
.step .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;flex:none}
.note{border-left:5px solid var(--accent,var(--area));background:var(--paper);border-radius:10px;padding:10px 16px;margin-top:12px}
.cita{font-family:var(--display);font-weight:600;line-height:1.35;background:var(--paper);border-left:6px solid var(--area);border-radius:12px;padding:clamp(16px,2vw,30px);margin:18px 0}
.cita.xl{font-size:clamp(24px,2.6vw,44px)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally .n{display:inline-block;min-width:1.6em;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.pasos{margin:.2em 0 0;padding-left:1.3em}.pasos li{margin:.3em 0}
.sello{margin-top:12px;border:2px dashed var(--oro);border-radius:12px;padding:10px 14px;background:#FDF6EA}
.sello b{display:block;color:var(--oro);font-size:.8em;letter-spacing:.06em;text-transform:uppercase}
.clave{margin-top:12px;display:flex;align-items:center;gap:10px;font-weight:600}
.keychip{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:10px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.2em}
.aviso{margin-top:10px;border-radius:10px;padding:10px 14px;background:#FBEFEF;border-left:5px solid var(--area);font-size:.92em}
.aviso.sev-aten{background:#EDF5EE;border-left-color:var(--verde)}
.aviso.sev-medi{background:#FDF5E7;border-left-color:var(--oro)}
.icfes .texto{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.6vw,24px);max-height:62vh;overflow:auto;font-size:.95em}
.enun{font-weight:600;font-size:1.08em}
.ops{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.op .L{flex:none;width:1.8em;height:1.8em;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-family:var(--display);font-weight:800}
.op.ok{border-color:var(--verde);background:#EDF5EE}.op.ok .L{background:var(--verde);color:#fff}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick[aria-pressed="true"]{background:var(--area);border-color:var(--area);color:#fff}
#scrim{position:fixed;inset:0;background:rgba(15,18,24,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#guia{position:fixed;top:0;right:0;height:100%;width:min(520px,92vw);background:var(--paper);box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column;z-index:10}
#guia.open{transform:none}
#guiahead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg)}
#guiabody{overflow:auto;padding:16px 20px 30px;font-size:.92em}
.gbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.gbox h4{margin:0 0 6px;font-family:var(--display);font-size:.8em;letter-spacing:.07em;text-transform:uppercase;color:var(--area)}
.gbox ul{margin:0;padding-left:1.1em}.gbox li{margin:.35em 0}
.gbox.como{background:#F6F7F9}.gbox.como h4{color:var(--muted)}
.gbox.apoyo{background:#FDF6EA;border-color:#EAD9B4}.gbox.apoyo h4{color:var(--oro)}

.dat{border-collapse:collapse;margin-top:10px;font-size:.95em;background:var(--paper)}
.dat th,.dat td{border:1px solid var(--line);padding:6px 14px;text-align:center}
.dat th{background:#EEF3FA;font-weight:700}
.dat.act{font-size:1.15em;margin-top:0}.dat.act td,.dat.act th{min-width:4.2em;padding:8px 16px}
.dat td.q{color:var(--faint);font-weight:700}
.fig{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:10px}
.fig svg{display:block;width:100%;height:auto;margin:0 auto}
.fig text{font-family:var(--text)}
.ops.c2{grid-template-columns:1fr 1fr}
.modelo{font-size:.9em}.manos{align-self:center}.modelo .card p{margin-top:0}
.lado{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}.lado .fig{flex:1 1 260px}.lado .dat{flex:0 0 auto}
.inst{font-style:italic;color:var(--muted)}
.nota{font-size:.85em;margin-top:4px}
.enun2{font-weight:600;margin-top:10px}
.cajas{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.caja{flex:1 1 200px;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--m5);border-radius:10px;padding:8px 14px}
.caja b{display:block;font-family:var(--display)}.caja span{display:block}
.suc{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.suc span{min-width:3.6em;text-align:center;font-family:var(--display);font-weight:800;font-size:1.4em;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}
.keychip.doble{width:auto;padding:0 .45em}
</style>
</head>

de campo, páginas 271 a 273<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m4)\"><h3>Tu cuaderno<\/h3><p class=\"sub\">Páginas 11 a 17<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m6)\"><h3>Hoy<\/h3><p class=\"sub\">120 minutos · 6 momentos · 4 estrategias · 10 preguntas del libro · 4 de entrenamiento<\/p><\/div><\/div>", "guia": {"obj": "Que el grupo sepa desde el primer minuto qué va a pasar en estos 120 minutos y qué tiene que tener sobre la mesa.", "decir": ["«Libro abierto, cuaderno cerrado, lápiz. Esfero no: hoy vamos a equivocarnos por escrito, y eso se corrige con borrador.»"], "apoyo": ["⚑ Antes del sábado, lo que tienes que instalar: Qué es una razón de cambio y por qué es la misma cosa que la pendiente de una recta. Esa equivalencia no está dicha en el libro con esas palabras y es la que amarra todo el componente.", "Ojo con esto: En el libro de grado 10 el revisor pidió justamente esto: que «tasa de cambio promedio» se relacione de inmediato con la pendiente. Aquí vale igual.", "Aviso del libro, preg. 5 (alta): Las opciones A y B dicen la misma justificación con otras palabras. Qué haces: Hay dos respuestas correctas. Acepta las dos y pide que escriban por qué son la misma.", "Lo que tienes que poder explicar hoy en dos minutos, sin jerga. Si un estudiante lo sabe mejor que tú, déjalo explicar y pide que lo muestre con un número:", "Razón de cambio: cuánto cambia una cantidad por cada unidad que avanza la otra. En una recta es la pendiente, y es la misma en todos los tramos.", "Modelo lineal y = mx + b: b es lo que hay desde el principio (lo fijo) y m lo que se suma por cada unidad (lo que crece). C(x) = 2.500x + 10.000: 10.000 de entrada y 2.500 por artículo.", "Parábola: sube, llega a un punto máximo (el vértice) y vuelve a bajar. Es simétrica: lo que pasa un segundo antes del vértice se repite un segundo después.", "Patrones: antes de buscar una fórmula se restan términos seguidos. Si la resta es siempre la misma, el patrón es lineal; si la resta se duplica, hay una potencia de 2.", "Abre esta guía con la tecla G en cada diapositiva: trae lo que dices y, debajo, lo que necesitas saber si Matemáticas no es tu área.", "El cronómetro arranca con T y se reinicia solo cuando cambia el momento de la clase."]}}, {"m": null, "html": "<div class=\"eyebrow\"><span class=\"kicker\">Así vamos a trabajar<\/span><\/div><h2>Seis momentos, una sola regla<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:var(--m1)\"><div class=\"k\">1<\/div><div><b>Activación<\/b><span class=\"sub\"> · 15 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m2)\"><div class=\"k\">2<\/div><div><b>Pregunta problematizadora<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m3)\"><div class=\"k\">3<\/div><div><b>Desarrollo guiado<\/b><span class=\"sub\"> · 35 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m4)\"><div class=\"k\">4<\/div><div><b>Reto en equipo<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m5)\"><div class=\"k\">5<\/div><div><b>Evaluación individual<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m6)\"><div class=\"k\">6<\/div><div><b>Cierre<\/b><span class=\"sub\"> · 10 min<\/span><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--area)\"><h3>La regla del cuaderno<\/h3><p class=\"lead\">Si el instrumento está vacío, no resolviste: adivinaste.<\/p><p>Primero se escribe el instrumento —la tabla, la cuenta, el dibujo—, después se marca la opción. Una respuesta correcta con el instrumento en blanco no cuenta como resuelta.<\/p><\/div><\/div>", "guia": {"obj": "Que la regla quede dicha en voz alta antes de cualquier texto.", "decir": ["«Si marcas sin llenar, para mí esa pregunta está en blanco, aunque esté bien.»", "Pasa por los puestos mirando el instrumento, no la respuesta."], "apoyo": ["Si alguien pregunta para qué escribir si ya sabe la respuesta: porque en la prueba nadie le va a decir si acertó, y la única manera de saberlo es tener la cuenta en el papel.", "Tú no tienes que resolver nada en este momento: tu trabajo es verificar que estén escribiendo. Ese registro es lo que la coordinación revisa después."]}}, {"m": 0, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Activación<\/span><span class=\"kicker\">Cuaderno cerrado<\/span><\/div><h2>¿Qué está cambiando aquí, y respecto a qué?<\/h2><p class=\"lead\">Unos números en una tabla. Nadie dice todavía de qué son.<\/p><table class=\"dat act\"><thead><tr><th>segundo<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><\/thead><tbody id=\"datos1\" hidden><tr><th>metros<\/th><td>0<\/td><td>15<\/td><td>20<\/td><td>15<\/td><td>0<\/td><\/tr><\/tbody><\/table><p class=\"lead mt\">Y una más: ¿en qué momento deja de pasar lo que venía pasando?<\/p><div class=\"ctl\"><button class=\"btn\" data-show=\"datos1\">Destapar los datos<\/button><button class=\"btn\" data-show=\"pista1\">Mostrar la pista<\/button><\/div><div class=\"note\" id=\"pista1\" hidden style=\"--accent:var(--m1)\"><b>De dónde salen:<\/b> Es la altura de un balón pateado hacia arriba, segundo a segundo: sube, llega y vuelve. El proyectil de la pregunta 1 hace lo mismo.<\/div>", "guia": {"obj": "Que el estudiante active con el cuerpo la noción de cambio antes de ver cualquier fórmula, reconociendo en datos cotidianos qué magnitud varía y respecto a cuál.", "decir": ["Destapa los datos y haz una sola pregunta: «¿qué está cambiando aquí, y respecto a qué?». Anota en el tablero tres respuestas distintas sin calificar ninguna.", "Después, la segunda pregunta de la pantalla."], "como": "No resuelve, no corrige y no adelanta vocabulario técnico. Si alguien dice «función» o «pendiente», lo deja pasar sin confirmar ni negar. El cuaderno permanece cerrado.", "apoyo": ["No tienes que explicar nada en este momento. Si alguien dice «función», «pendiente» o «variable», no lo confirmes ni lo niegues: «anótalo, volvemos a eso».", "Los datos son inventados para la clase: no salen del libro. Dilo si te lo preguntan.", "La pista es para el cierre de los 15 minutos, no para el principio: Es la altura de un balón pateado hacia arriba, segundo a segundo: sube, llega y vuelve. El proyectil de la pregunta 1 hace lo mismo."]}}, {"m": 0, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#242478\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 1 · Subir, llegar y volver<\/span><\/div><h2>La gráfica humana<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Seis estudiantes se paran en fila sobre una cinta en el piso: cada uno es un segundo.<\/li><li>El docente dice la altura de cada segundo; el estudiante se agacha, se para o estira los brazos según qué tan alto sea el valor.<\/li><li>El resto del grupo, desde el frente, «lee» la figura: ¿sube, baja, hay un pico?<\/li><li>Quien quedó más alto levanta la mano. Ahí se nombra el cambio de dirección.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Espacio despejado · cinta en el piso como eje<\/p><h3 class=\"mt\">Qué entrena<\/h3><p>Ubicar el vértice y detectar en qué punto la curva deja de subir. Es exactamente el movimiento de las preguntas 1, 2 y 3.<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante active con el cuerpo la noción de cambio antes de ver cualquier fórmula, reconociendo en datos cotidianos qué magnitud varía y respecto a cuál.", "decir": ["«Esto no es recreo: es el mismo movimiento que van a hacer con la pregunta en cinco minutos, pero con el cuerpo.»"], "como": "No resuelve, no corrige y no adelanta vocabulario técnico. Si alguien dice «función» o «pendiente», lo deja pasar sin confirmar ni negar. El cuaderno permanece cerrado.", "apoyo": ["Qué movimiento mental entrena: Ubicar el vértice y detectar en qué punto la curva deja de subir. Es exactamente el movimiento de las preguntas 1, 2 y 3.", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase.", "Es la dinámica de la estrategia 1 del cuaderno, «Subir, llegar y volver». Al terminar, di el nombre en voz alta: es el mismo que el estudiante ve en el chip de su hoja."]}}, {"m": 1, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m2)\">Pregunta problematizadora<\/span><span class=\"membrete\">Libro · pregunta 1 · página 271<\/span><\/div><h2>Abran el libro en la página 271<\/h2><div class=\"grid c2 mt modelo\"><div class=\"card\"><p>La función f(t) = −5t² + 30t representa la altura en metros de un proyectil lanzado verticalmente durante los primeros 6 segundos.<\/p><div class=\"fig\"><svg viewBox=\"0 0 530 300\" role=\"img\" aria-label=\"Gráfica de la altura del proyectil\" style=\"max-height:min(280px,34vh)\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"70.0\" y1=\"250.0\" x2=\"500.0\" y2=\"250.0\" stroke=\"#E6EAF0\" stroke-width=\"1\" stroke-linecap=\"round\"/><text x=\"62.0\" y=\"255.0\" font-size=\"13\" fill=\"#5C6472\" text-anchor=\"end\" font-weight=\"400\">0<\/text><line x1=\"70.0\" y1=\"204.0\" x2=\"500.0\" y2=\"204.0\" stroke=\"#E6EAF0\" stroke-width=\"1\" stroke-linecap=\"round\"/><text x=\"62.0\" y=\"209.0\" font-size=\"13\" fill=\"#5C6472\" text-anchor=\"end\" font-weight=\"400\">10<\/text><line x1=\"70.0\" y1=\"158.0\" x2=\"500.0\" y2=\"158.0\" stroke=\"#E6EAF0\" stroke-width=\"1\" stroke-linecap=\"round\"/><text x=\"62.0\" y=\"163.0\" font-size=\"13\" fill=\"#5C6472\" text-anchor=\"end\" font-weight=\"400\">20<\/text><line x1=\"70.0\" y1=\"112.0\" x2=\"500.0\" y2=\"112.0\" stroke=\"#E6EAF0\" stroke-width=\"1\" stroke-linecap=\"round\"/><text x=\"62.0\" y=\"117.0\" font-size=\"13\" fill=\"#5C6472\" text-anchor=\"end\" font-weight=\"400\">30<\/text><line x1=\"70.0\" y1=\"66.0\" x2=\"500.0\" y2=\"66.0\" stroke=\"#E6EAF0\" stroke-width=\"1\" stroke-linecap=\"round\"/><text x=\"62.0\" y=\"71.0\" font-size=\"13\" fill=\"#5C6472\" text-anchor=\"end\" font-weight=\"400\">40<\/text><line x1=\"70.0\" y1=\"20.0\" x2=\"500.0\" y2=\"20.0\" stroke=\"#E6EAF0\" stroke-width=\"1\" stroke-linecap=\"round\"/><text x=\"62.0\" y=\"25.0\" font-size=\"13\" fill=\"#5C6472\" text-anchor=\"end\" font-weight=\"400\">50<\/text><text x=\"70.0\" y=\"270.0\" font-size=\"13\" fill=\"#5C6472\" text-anchor=\"middle\" font-weight=\"400\">0<\/text><text x=\"141.7\" y=\"270.0\" font-size=\"13\" fill=\"#5C6472\" text-anchor=\"middle\" font-weight=\"400\">1<\/text><text x=\"213.3\" y=\"270.0\" font-size=\"13\" fill=\"#5C6472\" text-anchor=\"middle\" font-weight=\"400\">2<\/text><text x=\"285.0\" y=\"270.0\" font-size=\"13\" fill=\"#5C6472\" text-anchor=\"middle\" font-weight=\"400\">3<\/text><text x=\"356.7\" y=\"270.0\" font-size=\"13\" fill=\"#5C6472\" text-anchor=\"middle\" font-weight=\"400\">4<\/text><text x=\"428.3\" y=\"270.0\" font-size=\"13\" fill=\"#5C6472\" text-anchor=\"middle\" font-weight=\"400\">5<\/text><text x=\"500.0\" y=\"270.0\" font-size=\"13\" fill=\"#5C6472\" text-anchor=\"middle\" font-weight=\"400\">6<\/text><line x1=\"70.0\" y1=\"250.0\" x2=\"500.0\" y2=\"250.0\" stroke=\"#1B1F27\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"70.0\" y1=\"250.0\" x2=\"70.0\" y2=\"20.0\" stroke=\"#1B1F27\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"285.0\" y=\"292.0\" font-size=\"14\" fill=\"#5C6472\" text-anchor=\"middle\" font-weight=\"400\">Tiempo (s)<\/text><text x=\"26\" y=\"135.0\" font-size=\"14\" fill=\"#5C6472\" text-anchor=\"middle\" transform=\"rotate(-90 26 135.0)\">Altura (m)<\/text><polyline points=\"70.0,250.0 73.6,243.2 77.2,236.4 80.8,229.8 84.3,223.3 87.9,216.9 91.5,210.7 95.1,204.5 98.7,198.5 102.2,192.6 105.8,186.8 109.4,181.1 113.0,175.5 116.6,170.0 120.2,164.7 123.8,159.4 127.3,154.3 130.9,149.3 134.5,144.4 138.1,139.7 141.7,135.0 145.2,130.5 148.8,126.0 152.4,121.7 156.0,117.5 159.6,113.4 163.2,109.5 166.8,105.6 170.3,101.9 173.9,98.3 177.5,94.8 181.1,91.4 184.7,88.1 188.2,84.9 191.8,81.9 195.4,78.9 199.0,76.1 202.6,73.4 206.2,70.8 209.8,68.4 213.3,66.0 216.9,63.8 220.5,61.6 224.1,59.6 227.7,57.7 231.2,55.9 234.8,54.3 238.4,52.7 242.0,51.3 245.6,50.0 249.2,48.8 252.8,47.7 256.3,46.7 259.9,45.8 263.5,45.1 267.1,44.4 270.7,43.9 274.2,43.5 277.8,43.2 281.4,43.1 285.0,43.0 288.6,43.1 292.2,43.2 295.8,43.5 299.3,43.9 302.9,44.4 306.5,45.1 310.1,45.8 313.7,46.7 317.2,47.7 320.8,48.8 324.4,50.0 328.0,51.3 331.6,52.7 335.2,54.3 338.8,55.9 342.3,57.7 345.9,59.6 349.5,61.6 353.1,63.8 356.7,66.0 360.2,68.4 363.8,70.8 367.4,73.4 371.0,76.1 374.6,78.9 378.2,81.9 381.8,84.9 385.3,88.1 388.9,91.4 392.5,94.8 396.1,98.3 399.7,101.9 403.2,105.6 406.8,109.5 410.4,113.4 414.0,117.5 417.6,121.7 421.2,126.0 424.8,130.5 428.3,135.0 431.9,139.7 435.5,144.4 439.1,149.3 442.7,154.3 446.2,159.4 449.8,164.7 453.4,170.0 457.0,175.5 460.6,181.1 464.2,186.8 467.7,192.6 471.3,198.5 474.9,204.5 478.5,210.7 482.1,216.9 485.7,223.3 489.2,229.8 492.8,236.4 496.4,243.2 500.0,250.0\" fill=\"none\" stroke=\"#1F4E8C\" stroke-width=\"3\" stroke-linejoin=\"round\"/><circle cx=\"285.0\" cy=\"43.0\" r=\"5\" fill=\"#1F4E8C\"/><\/svg><\/div><\/div><div><p class=\"enun\">Según la gráfica, ¿en qué intervalo de tiempo la altura del proyectil aumenta?<\/p><div class=\"ops\" id=\"mod1\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>De 0 a 3 segundos, porque la pendiente es positiva en ese tramo.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>De 3 a 6 segundos, porque el proyectil sigue en movimiento.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>En todo el intervalo, porque siempre está por encima del suelo.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Nunca, porque la función es decreciente en todo el recorrido.<\/span><\/div><\/div><div class=\"ctl\"><span class=\"sub manos\">Antes de analizar, manos:<\/span><button class=\"btn tally\" data-tally=\"h1A\">A <span class=\"n\" id=\"h1A\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h1B\">B <span class=\"n\" id=\"h1B\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h1C\">C <span class=\"n\" id=\"h1C\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h1D\">D <span class=\"n\" id=\"h1D\">0<\/span><\/button><button class=\"btn\" data-reset=\"h1\">↺<\/button><button class=\"btn\" data-clave=\"mod1\" data-k=\"A\">Revelar la clave<\/button><\/div><div class=\"note\" style=\"--accent:var(--m2)\"><b>La regla de este momento:<\/b> nadie justifica diciendo «porque se ve así». Cada intervención nombra un dato: un valor, un punto de la gráfica, una cuenta.<\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante compruebe que una pregunta tipo Saber 11 no se resuelve calculando sino interpretando, usando la pregunta modelo del libro.", "decir": ["Presenta la pregunta modelo del libro y la deja a la vista todo el momento.", "Pide hipótesis a mano alzada ANTES de cualquier análisis y las anota en el tablero.", "Recorre en voz alta con el grupo el paso a paso que el libro propone.", "Revela la clave solo al final y trabaja el análisis de distractores."], "como": "Regla del momento: nadie justifica diciendo «porque se ve así». Cada intervención debe nombrar un dato concreto de la gráfica o de la tabla.", "apoyo": ["Cuenta las manos con los botones antes de cualquier análisis. El número queda en pantalla: al final del momento vuelves a él y el grupo ve cuántos cambiaron de opinión al hacer la cuenta.", "Primer paso en voz alta: Recorran la gráfica de izquierda a derecha: ¿dónde sube, dónde baja? El intervalo es el tramo que solo sube.", "La clave es la A. Cómo se llega: La gráfica sube de t = 0 a t = 3 (llega a 45 m) y baja de 3 a 6. Sube solo de 0 a 3 s. La C confunde «estar arriba del suelo» con «estar subiendo».", "Revélala solo al final de los 20 minutos, después del análisis de distractores: el botón es para ese momento. En el bloque de las preguntas 1 y 2 la vuelven a trabajar en su instrumento."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 1 y 2<\/span><span class=\"kicker\">En pantalla, casilla por casilla<\/span><\/div><h2>Preguntas 1 y 2: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 1 · página 271<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Subir, llegar y volver<\/span><\/div><p class=\"sub\">El proyectil · f(t) = −5t² + 30t<\/p><h3 style=\"color:#242478\">El recorrido, segundo a segundo<\/h3><p class=\"inst\">No respondas desde la fórmula todavía. Recorre la gráfica de tu libro de izquierda a derecha y anota, en cada tramo de un segundo, si la altura sube o baja. El intervalo que te piden es el que tenga puras flechas hacia arriba.<\/p><div class=\"clave\" hidden data-grupo=\"k11\"><span class=\"keychip\" style=\"background:#242478\">A<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 2 · página 272<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Subir, llegar y volver<\/span><\/div><p class=\"sub\">El proyectil · ¿cuándo vuelve a 40 m?<\/p><h3 style=\"color:#242478\">El espejo de la parábola<\/h3><p class=\"inst\">Una parábola es simétrica: lo que pasa antes del punto más alto se repite después, a la misma distancia. Hay dos caminos para esta pregunta. Haz el que te resulte más claro y comprueba con el otro.<\/p><div class=\"clave\" hidden data-grupo=\"k11\"><span class=\"keychip\" style=\"background:#242478\">B<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k11\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante resuelva las preguntas del taller dejando registro escrito de su razonamiento antes de marcar la respuesta.", "decir": ["«Antes de marcar: ¿qué escribieron en el instrumento? Léanme la cuenta.»", "Si alguien se traba, pregúntale en qué casilla del instrumento se quedó. No le des la respuesta: devuélvelo a su hoja."], "como": "No da respuestas. Si un estudiante se traba, lo devuelve al paso a paso de su propia hoja y le pregunta en cuál de los pasos se quedó.", "apoyo": ["Las claves del libro son 1·A y 2·B. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Este bloque se hace en el tablero, casilla por casilla del instrumento, con todo el grupo: es el modelo de cómo se llenan las demás hojas.", "Pregunta 1 · clave A. Cómo se llega: La gráfica sube de t = 0 a t = 3 (llega a 45 m) y baja de 3 a 6. Sube solo de 0 a 3 s. La C confunde «estar arriba del suelo» con «estar subiendo».", "Pregunta 2 · clave B. Cómo se llega: −5t² + 30t = 40 → t² − 6t + 8 = 0 → (t − 2)(t − 4) = 0. Pasa por 40 m en t = 2 (subiendo) y en t = 4 (bajando): después del máximo, 4 s. Por simetría: el pico está en 3; el 2 está 1 s antes, así que el otro cruce está 1 s después."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 3 y 4<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 3 y 4: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 3 · página 272<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Subir, llegar y volver<\/span><\/div><p class=\"sub\">El proyectil · ¿cuál gráfica es?<\/p><h3 style=\"color:#242478\">Tres sellos de control<\/h3><p class=\"inst\">No busques «la que se parece». Pásale a cada gráfica tres controles que salen del enunciado. La correcta es la única que los pasa los tres; las demás fallan por lo menos en uno.<\/p><div class=\"clave\" hidden data-grupo=\"k13\"><span class=\"keychip\" style=\"background:#242478\">C<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#30843C\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 4 · página 272<\/span><span class=\"min\" style=\"--accent:#30843C\">E2 · Lo fijo y lo que crece<\/span><\/div><p class=\"sub\">Costo de producción · C(x) = 2.500x + 10.000<\/p><h3 style=\"color:#30843C\">La escalera entre dos puntos<\/h3><p class=\"inst\">La tasa de cambio promedio responde a: cuando avanzo de un punto al otro, ¿cuánto sube el costo por cada unidad que avanzo? Es un escalón: lo que sube dividido entre lo que avanza.<\/p><div class=\"clave\" hidden data-grupo=\"k13\"><span class=\"keychip\" style=\"background:#30843C\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k13\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante resuelva las preguntas del taller dejando registro escrito de su razonamiento antes de marcar la respuesta.", "decir": ["«Antes de marcar: ¿qué escribieron en el instrumento? Léanme la cuenta.»", "Si alguien se traba, pregúntale en qué casilla del instrumento se quedó. No le des la respuesta: devuélvelo a su hoja."], "como": "No da respuestas. Si un estudiante se traba, lo devuelve al paso a paso de su propia hoja y le pregunta en cuál de los pasos se quedó.", "apoyo": ["Las claves del libro son 3·C y 4·A. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 3 · clave C. Cómo se llega: Tres controles: sale de (0, 0), llega a 45 m en t = 3 y vuelve a 0 en t = 6. Solo la C los pasa. La A es una recta, la B se queda plana en 40 y la D arranca en 10 y no pasa de 40.", "Pregunta 4 · clave A. Cómo se llega: C(25) − C(20) = 72.500 − 60.000 = 12.500, en 5 artículos: 2.500 por artículo. La B (12.500) es el cambio total, no la tasa. En un modelo lineal la tasa es siempre el número que acompaña a x."]}}, {"m": 2, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#30843C\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 2 · Lo fijo y lo que crece<\/span><\/div><h2>La cadena de a tantos<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#30843C\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>El grupo se para en círculo. El docente da una base («arrancamos en 10.000») y una regla fija («cada uno suma 2.500»).<\/li><li>Van diciendo su valor en voz alta, uno tras otro, sin calculadora.<\/li><li>Quien se equivoca pasa al centro y debe decir cuál era el dato fijo que se repetía.<\/li><li>Variante: a mitad de ronda el docente cambia la base pero deja la misma regla.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Círculo de sillas · una tarjeta con la base<\/p><h3 class=\"mt\">Qué entrena<\/h3><p>Separar la base de partida del valor que se repite. Es la estructura de C(x) = mx + b que resuelven las preguntas 4, 5 y 6.<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante resuelva las preguntas del taller dejando registro escrito de su razonamiento antes de marcar la respuesta.", "decir": ["«Esto no es recreo: es el mismo movimiento que van a hacer con la pregunta en cinco minutos, pero con el cuerpo.»"], "como": "No da respuestas. Si un estudiante se traba, lo devuelve al paso a paso de su propia hoja y le pregunta en cuál de los pasos se quedó.", "apoyo": ["Qué movimiento mental entrena: Separar la base de partida del valor que se repite. Es la estructura de C(x) = mx + b que resuelven las preguntas 4, 5 y 6.", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase.", "Es la dinámica de la estrategia 2 del cuaderno, «Lo fijo y lo que crece». Al terminar, di el nombre en voz alta: es el mismo que el estudiante ve en el chip de su hoja."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 5 y 6<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 5 y 6: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#30843C\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 5 · página 272<\/span><span class=\"min\" style=\"--accent:#30843C\">E2 · Lo fijo y lo que crece<\/span><\/div><p class=\"sub\">Servicio por días · C(n) = 2.000n + 15.000<\/p><h3 style=\"color:#30843C\">Poner a prueba la afirmación<\/h3><p class=\"inst\">El cliente hizo una afirmación. No la creas ni la descartes: compruébala. Reemplaza el dato que él dice y mira si la cuenta cierra.<\/p><div class=\"clave\" hidden data-grupo=\"k15\"><span class=\"keychip doble\" style=\"background:#30843C\">A · B<\/span> son las claves del libro<\/div><div class=\"aviso sev-alta\" hidden data-grupo=\"k15\"><b>Ojo con esta clave:<\/b> La A y la B dicen lo mismo con otras palabras: las dos son correctas.<\/div><\/div><div class=\"card edge\" style=\"--accent:#30843C\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 6 · página 272<\/span><span class=\"min\" style=\"--accent:#30843C\">E2 · Lo fijo y lo que crece<\/span><\/div><p class=\"sub\">Ingreso del evento · I = 50.000p + 200.000<\/p><h3 style=\"color:#30843C\">Deshacer la máquina<\/h3><p class=\"inst\">La fórmula es una máquina: entran personas y sale dinero. Aquí te dan la salida y te piden la entrada, así que hay que recorrerla al revés, deshaciendo cada paso en orden contrario.<\/p><div class=\"clave\" hidden data-grupo=\"k15\"><span class=\"keychip\" style=\"background:#30843C\">D<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k15\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante resuelva las preguntas del taller dejando registro escrito de su razonamiento antes de marcar la respuesta.", "decir": ["«Antes de marcar: ¿qué escribieron en el instrumento? Léanme la cuenta.»", "Si alguien se traba, pregúntale en qué casilla del instrumento se quedó. No le des la respuesta: devuélvelo a su hoja."], "como": "No da respuestas. Si un estudiante se traba, lo devuelve al paso a paso de su propia hoja y le pregunta en cuál de los pasos se quedó.", "apoyo": ["Las claves del libro son 5·A · B y 6·D. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 5 · clave A · B. Cómo se llega: C(7) = 2.000 × 7 + 15.000 = 29.000: el cliente tiene razón. La A dice la cuenta y la B dice la misma cuenta en palabras (costo fijo más 7 pagos de 2.000): las dos son correctas.", "Pregunta 5 · aviso del libro (alta): Las opciones A y B dicen la misma justificación con otras palabras. Qué haces: Hay dos respuestas correctas. Acepta las dos y pide que escriban por qué son la misma.", "Pregunta 6 · clave D. Cómo se llega: 1.450.000 − 200.000 = 1.250.000; 1.250.000 ÷ 50.000 = 25 personas. Se comprueba: 50.000 × 25 + 200.000 = 1.450.000."]}}, {"m": 2, "min": 10, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#C9821B\">Dinámica · 10 min<\/span><span class=\"kicker\">Entrena la estrategia 3 · Un modelo, tres preguntas<\/span><\/div><h2>La misma máquina, tres preguntas<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Se escribe un solo modelo en el tablero y no se borra en toda la dinámica.<\/li><li>Tres estudiantes sacan una tarjeta al azar: «dame el valor», «dame la entrada», «¿se puede?».<\/li><li>Cada uno dice qué operación necesita, SIN hacerla todavía.<\/li><li>El grupo vota si la operación es la correcta; solo entonces se calcula.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Tablero · tres tarjetas con los tipos de pregunta<\/p><h3 class=\"mt\">Qué entrena<\/h3><p>Ver que el mismo modelo responde preguntas distintas según de qué lado se despeje. Es el movimiento de las preguntas 7, 8 y 9.<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante resuelva las preguntas del taller dejando registro escrito de su razonamiento antes de marcar la respuesta.", "decir": ["«Esto no es recreo: es el mismo movimiento que van a hacer con la pregunta en cinco minutos, pero con el cuerpo.»"], "como": "No da respuestas. Si un estudiante se traba, lo devuelve al paso a paso de su propia hoja y le pregunta en cuál de los pasos se quedó.", "apoyo": ["Qué movimiento mental entrena: Ver que el mismo modelo responde preguntas distintas según de qué lado se despeje. Es el movimiento de las preguntas 7, 8 y 9.", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase.", "Es la dinámica de la estrategia 3 del cuaderno, «Un modelo, tres preguntas». Al terminar, di el nombre en voz alta: es el mismo que el estudiante ve en el chip de su hoja."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 7 y 8<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 7 y 8: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 7 · página 273<\/span><span class=\"min\" style=\"--accent:#C9821B\">E3 · Un modelo, tres preguntas<\/span><\/div><p class=\"sub\">Transporte de paquetes · C(p) = 8.500(p−1) + 60.000<\/p><h3 style=\"color:#C9821B\">La tabla que delata el patrón<\/h3><p class=\"inst\">La pregunta es sobre el comportamiento, no sobre un valor. Calcula cuatro costos seguidos y resta cada uno con el anterior: esa resta es la que responde.<\/p><div class=\"clave\" hidden data-grupo=\"k17\"><span class=\"keychip\" style=\"background:#C9821B\">A<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 8 · página 273<\/span><span class=\"min\" style=\"--accent:#C9821B\">E3 · Un modelo, tres preguntas<\/span><\/div><p class=\"sub\">Transporte · ¿cuánto pesaba el paquete?<\/p><h3 style=\"color:#C9821B\">Acotar antes de despejar<\/h3><p class=\"inst\">Antes de hacer cuentas, encierra la respuesta entre dos valores con la tabla que ya hiciste. Así, cuando despejes, ya sabes si el resultado tiene sentido.<\/p><div class=\"clave\" hidden data-grupo=\"k17\"><span class=\"keychip\" style=\"background:#C9821B\">C<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k17\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante resuelva las preguntas del taller dejando registro escrito de su razonamiento antes de marcar la respuesta.", "decir": ["«Antes de marcar: ¿qué escribieron en el instrumento? Léanme la cuenta.»", "Si alguien se traba, pregúntale en qué casilla del instrumento se quedó. No le des la respuesta: devuélvelo a su hoja."], "como": "No da respuestas. Si un estudiante se traba, lo devuelve al paso a paso de su propia hoja y le pregunta en cuál de los pasos se quedó.", "apoyo": ["Las claves del libro son 7·A y 8·C. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 7 · clave A. Cómo se llega: C(1) = 60.000, C(2) = 68.500, C(3) = 77.000, C(4) = 85.500: cada kilo suma 8.500. Aumenta siempre lo mismo.", "Pregunta 8 · clave C. Cómo se llega: 102.000 − 60.000 = 42.000; 42.000 ÷ 8.500 ≈ 4,94 kilos adicionales al primero, así que p ≈ 5,94 ≈ 6 kg. C(6) = 102.500 es el valor más cercano a lo que pagó."]}}, {"m": 2, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#A82424\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 4 · El patrón que continúa<\/span><\/div><h2>La fila de las diferencias<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Ocho estudiantes en fila, cada uno con un número de la sucesión en una hoja.<\/li><li>Otros se paran entre dos y dicen en voz alta la diferencia que ven.<\/li><li>Si las diferencias no son iguales, se forma una segunda fila: las diferencias de las diferencias.<\/li><li>Nadie opera en papel. Si la segunda fila sale pareja, el patrón ya está encontrado.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Ocho hojas con números · espacio para dos filas<\/p><h3 class=\"mt\">Qué entrena<\/h3><p>Mirar las diferencias antes que los números. Es el movimiento de la pregunta 10 y de la de entrenamiento sobre la sucesión 11, 17, 29, 53, 101.<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante resuelva las preguntas del taller dejando registro escrito de su razonamiento antes de marcar la respuesta.", "decir": ["«Esto no es recreo: es el mismo movimiento que van a hacer con la pregunta en cinco minutos, pero con el cuerpo.»"], "como": "No da respuestas. Si un estudiante se traba, lo devuelve al paso a paso de su propia hoja y le pregunta en cuál de los pasos se quedó.", "apoyo": ["Qué movimiento mental entrena: Mirar las diferencias antes que los números. Es el movimiento de la pregunta 10 y de la de entrenamiento sobre la sucesión 11, 17, 29, 53, 101.", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase.", "Es la dinámica de la estrategia 4 del cuaderno, «El patrón que continúa». Al terminar, di el nombre en voz alta: es el mismo que el estudiante ve en el chip de su hoja."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 9 y 10<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 9 y 10: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 9 · página 273<\/span><span class=\"min\" style=\"--accent:#C9821B\">E3 · Un modelo, tres preguntas<\/span><\/div><p class=\"sub\">Transporte · ¿qué se concluye del costo adicional?<\/p><h3 style=\"color:#C9821B\">Cazar la condición escondida<\/h3><p class=\"inst\">Tres de las cuatro opciones inventan una condición: que algo cambia después de cierto peso. Una condición así tendría que estar escrita en la fórmula. Ve a buscarla.<\/p><div class=\"clave\" hidden data-grupo=\"k19\"><span class=\"keychip\" style=\"background:#C9821B\">A<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 10 · página 273<\/span><span class=\"min\" style=\"--accent:#A82424\">E4 · El patrón que continúa<\/span><\/div><p class=\"sub\">Ahorro semanal · el patrón de las barras<\/p><h3 style=\"color:#A82424\">Los escalones de las barras<\/h3><p class=\"inst\">La barra de la semana 5 está marcada con un signo de interrogación. Para saber su altura no hace falta adivinar: mide los escalones entre las barras que sí están.<\/p><div class=\"clave\" hidden data-grupo=\"k19\"><span class=\"keychip\" style=\"background:#A82424\">B<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k19\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante resuelva las preguntas del taller dejando registro escrito de su razonamiento antes de marcar la respuesta.", "decir": ["«Antes de marcar: ¿qué escribieron en el instrumento? Léanme la cuenta.»", "Si alguien se traba, pregúntale en qué casilla del instrumento se quedó. No le des la respuesta: devuélvelo a su hoja."], "como": "No da respuestas. Si un estudiante se traba, lo devuelve al paso a paso de su propia hoja y le pregunta en cuál de los pasos se quedó.", "apoyo": ["Las claves del libro son 9·A y 10·B. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 9 · clave A. Cómo se llega: La fórmula tiene un solo número por kilo (8.500) y ninguna condición de «después de tantos kilos». Las otras tres opciones inventan esa condición.", "Pregunta 10 · clave B. Cómo se llega: Las barras van 120, 140, 160, 180: suben 20 cada semana. La semana 5 es 200 mil: 200.000."]}}, {"m": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m4)\">Reto en equipo · 20 min<\/span><span class=\"kicker\">Equipos de tres · cada uno responde en su cuaderno<\/span><\/div><h2>Reto del corte: El modelo de otro equipo<\/h2><div class=\"card big edge mt\" style=\"--accent:var(--m4)\"><p class=\"lead\">Cada equipo de tres recibe una situación distinta con cuatro datos. En diez minutos deben: (1) escribir el modelo que la describe, (2) decir si es lineal o no y por qué, y (3) predecir el quinto dato. Después intercambian hojas: el otro equipo tiene que responder una pregunta nueva usando el modelo que recibió, sin rehacerlo. Gana el equipo cuyo modelo le sirvió al otro.<\/p><\/div><div class=\"note mt\" style=\"--accent:var(--m4)\"><b>La defensa:<\/b> tres minutos por equipo, citando un dato o una cuenta. «Porque se ve así» no cuenta.<\/div>", "guia": {"obj": "Que el estudiante contraste su razonamiento con el de otros y defienda su elección con datos, sin que el equipo reemplace su registro individual.", "decir": ["Arma equipos de tres y entrega el reto del corte de este momento.", "Exige que cada integrante llegue con su cuaderno YA diligenciado individualmente.", "Da tres minutos de defensa por equipo: deben citar un dato, no una opinión.", "Cierra señalando en qué se parecían los razonamientos y en qué no."], "como": "El equipo discute, pero cada uno responde en SU cuaderno. Si un equipo entrega una sola respuesta colectiva, el reto no cuenta: el producto es individual, la discusión es compartida.", "apoyo": ["El reto es el del planeador (banco de dinámicas, hoja de la misión 1): Cada equipo de tres recibe una situación distinta con cuatro datos. En diez minutos deben: (1) escribir el modelo que la describe, (2) decir si es lineal o no y por qué, y (3) predecir el quinto dato. Después intercambian hojas: el otro equipo tiene que responder una pregunta nueva usando el modelo que recibió, sin rehacerlo. Gana el equipo cuyo modelo le sirvió al otro.", "El reto se gana con el dato que sostiene la decisión, no con llegar primero. Si dos equipos llegan a respuestas distintas bien sostenidas, dilo: también es hacer matemáticas.", "Si un equipo entrega una sola hoja para los tres, el reto no cuenta. La discusión es compartida; el registro es individual.", "Cierra señalando en qué se parecían los razonamientos y en qué no."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 1<\/span><span class=\"min\" style=\"--accent:#30843C\">E2 · Lo fijo y lo que crece<\/span><\/div><div class=\"grid c2 icfes mt\"><div><p class=\"enun\">Una empresa alquila automóviles a sus clientes de acuerdo con dos planes. Si durante una semana Juan obtuvo mayor rentabilidad con el primer plan, fue probablemente porque<\/p><div class=\"cajas\"><div class=\"caja\"><b>Plan 1<\/b><span>$ 320.000 por semana<\/span><span>kilometraje ilimitado<\/span><\/div><div class=\"caja\"><b>Plan 2<\/b><span>$ 100.000 por semana<\/span><span>más $ 2.000 por cada kilómetro<\/span><\/div><\/div><\/div><div><div class=\"ops c2\" id=\"icf11\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>su recorrido fue menor de 110 km.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>su recorrido fue de 110 km.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>su recorrido fue de 150 km.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>su recorrido fue de 100 km.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf11\" data-k=\"C\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia aprendida a preguntas tipo Saber 11, sin acompañamiento del docente ni de sus compañeros.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué cuenta escribiste antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento del encuentro. Si un estudiante marca sin llenar la columna, se le anota, no se le corrige.", "apoyo": ["⚑ Fuente: compilado ASED (no es del ICFES). No la presentes como pregunta del ICFES; Nelson decide si se reemplaza.", "La clave es la C. Cómo se llega: El plan 2 cuesta 100.000 + 2.000k. Empatan cuando 320.000 = 100.000 + 2.000k → k = 110 km. Por encima de 110 km el plan 2 sale más caro y conviene el 1: 150 km. A 100 km conviene el plan 2 (180.000) y a 110 empatan.", "En el cuaderno la trabajan con el instrumento «Busca el kilometraje donde los dos planes empatan» (estrategia 2 · Lo fijo y lo que crece)."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 2<\/span><span class=\"min\" style=\"--accent:#C9821B\">E3 · Un modelo, tres preguntas<\/span><\/div><div class=\"grid c2 icfes mt\"><div><p class=\"enun\">Dos ciudades E y F están separadas por una distancia h. Desde E sale un carro con velocidad constante V₁ hacia F, sin detenerse en ella; al mismo tiempo sale un segundo carro desde F con velocidad constante V₂, menor que V₁, en la misma dirección. ¿Qué información es necesaria para determinar el tiempo que transcurre entre la salida de los dos carros y el momento en que están a la misma distancia de la ciudad E?<\/p><div class=\"fig\"><svg viewBox=\"0 0 680 165\" role=\"img\" aria-label=\"Las ciudades E y F y los dos carros\" style=\"max-height:min(200px,34vh)\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"40.0\" y1=\"90.0\" x2=\"640.0\" y2=\"90.0\" stroke=\"#1B1F27\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"90\" cy=\"90\" r=\"7\" fill=\"#A82424\"/><circle cx=\"420\" cy=\"90\" r=\"7\" fill=\"#A82424\"/><text x=\"90.0\" y=\"120.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">ciudad E<\/text><text x=\"420.0\" y=\"120.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">ciudad F<\/text><line x1=\"90.0\" y1=\"40.0\" x2=\"420.0\" y2=\"40.0\" stroke=\"#5C6472\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"90.0\" y1=\"32.0\" x2=\"90.0\" y2=\"48.0\" stroke=\"#5C6472\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><line x1=\"420.0\" y1=\"32.0\" x2=\"420.0\" y2=\"48.0\" stroke=\"#5C6472\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><text x=\"255.0\" y=\"32.0\" font-size=\"17\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\" font-style=\"italic\">h<\/text><line x1=\"100.0\" y1=\"72.0\" x2=\"190.0\" y2=\"72.0\" stroke=\"#1F4E8C\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><polygon points=\"190.0,72.0 180.0,66.0 180.0,78.0\" fill=\"#1F4E8C\" stroke=\"#1F4E8C\" stroke-width=\"1\" stroke-linejoin=\"round\"/><text x=\"145.0\" y=\"64.0\" font-size=\"15\" fill=\"#1F4E8C\" text-anchor=\"middle\" font-weight=\"700\">V₁<\/text><line x1=\"430.0\" y1=\"72.0\" x2=\"500.0\" y2=\"72.0\" stroke=\"#2E7A39\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><polygon points=\"500.0,72.0 490.0,66.0 490.0,78.0\" fill=\"#2E7A39\" stroke=\"#2E7A39\" stroke-width=\"1\" stroke-linejoin=\"round\"/><text x=\"465.0\" y=\"64.0\" font-size=\"15\" fill=\"#2E7A39\" text-anchor=\"middle\" font-weight=\"700\">V₂<\/text><text x=\"560.0\" y=\"40.0\" font-size=\"15\" fill=\"#5C6472\" text-anchor=\"middle\" font-weight=\"400\" font-style=\"italic\">V₂ &lt; V₁<\/text><text x=\"330.0\" y=\"150.0\" font-size=\"14\" fill=\"#5C6472\" text-anchor=\"middle\" font-weight=\"400\" font-style=\"italic\">los dos carros salen al mismo tiempo, en la misma dirección<\/text><\/svg><\/div><\/div><div><div class=\"ops c2\" id=\"icf12\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>V₁ − V₂ y V₁<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>h y V₁ + V₂<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>V₁ + V₂ y V₁<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>h y V₁ − V₂<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf12\" data-k=\"D\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia aprendida a preguntas tipo Saber 11, sin acompañamiento del docente ni de sus compañeros.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué cuenta escribiste antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento del encuentro. Si un estudiante marca sin llenar la columna, se le anota, no se le corrige.", "apoyo": ["La clave es la D. Cómo se llega: A la misma distancia de E: V₁t = V₂t + h → t(V₁ − V₂) = h → t = h ÷ (V₁ − V₂). Hacen falta h y V₁ − V₂. La suma V₁ + V₂ sirve cuando van uno contra el otro.", "En el cuaderno la trabajan con el instrumento «Despeja el tiempo y lee qué quedó al lado derecho» (estrategia 3 · Un modelo, tres preguntas)."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 3<\/span><span class=\"min\" style=\"--accent:#A82424\">E4 · El patrón que continúa<\/span><\/div><div class=\"grid c2 icfes mt\"><div><p class=\"enun\">Observe la siguiente secuencia numérica. El décimo término de la sucesión es 3.077 porque<\/p><div class=\"suc\"><span>11<\/span><span>17<\/span><span>29<\/span><span>53<\/span><span>101<\/span><span>…<\/span><\/div><\/div><div><div class=\"ops\" id=\"icf13\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>cada término se obtiene multiplicando 6 por un número primo y restando 1.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>el término n-ésimo de la sucesión es de la forma 6n + 5.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>al restar un término con cualquiera de los anteriores se obtiene un múltiplo de 6.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>el término n-ésimo de la sucesión es de la forma 2ⁿ × 3 + 5.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf13\" data-k=\"D\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia aprendida a preguntas tipo Saber 11, sin acompañamiento del docente ni de sus compañeros.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué cuenta escribiste antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento del encuentro. Si un estudiante marca sin llenar la columna, se le anota, no se le corrige.", "apoyo": ["⚑ Fuente: compilado ASED (no es del ICFES). No la presentes como pregunta del ICFES; Nelson decide si se reemplaza.", "La clave es la D. Cómo se llega: Las diferencias son 6, 12, 24, 48: se duplican. 2ⁿ × 3 + 5 da 11, 17, 29, 53, 101, y en n = 10: 1.024 × 3 + 5 = 3.077. La C es cierta pero no explica el décimo término; la B (6n + 5) falla desde el término 3.", "En el cuaderno la trabajan con el instrumento «Mira las diferencias antes que los números» (estrategia 4 · El patrón que continúa)."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 4<\/span><span class=\"min\" style=\"--accent:#30843C\">E2 · Lo fijo y lo que crece<\/span><\/div><div class=\"grid c2 icfes mt\"><div><p class=\"enun\">La empresa de Acueducto y Alcantarillado de una ciudad liquida las cuentas de sus usuarios del estrato X con el siguiente cuadro. Si una persona necesita calcular el costo total de su recibo, debe<\/p><table class=\"dat\"><tr><th>Consumo (m³)<\/th><th>Acueducto<\/th><th>Alcantarillado<\/th><th>Aseo<\/th><\/tr><tr><td>0 a 40<\/td><td>263,33<\/td><td>131,66<\/td><td>5.305<\/td><\/tr><tr><td>41 a 80<\/td><td>689,30<\/td><td>344,65<\/td><td>5.305<\/td><\/tr><tr><td>más de 80<\/td><td>883,57<\/td><td>441,78<\/td><td>5.305<\/td><\/tr><tr><td>Cargo fijo<\/td><td>5.912<\/td><td>1.401<\/td><td>1.336<\/td><\/tr><\/table><p class=\"sub nota\">Tarifas en pesos por metro cúbico. La de aseo y los cargos fijos son valores fijos del mes.<\/p><\/div><div><div class=\"ops\" id=\"icf14\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>sumar el cargo fijo al consumo y al alcantarillado.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>multiplicar los m³ consumidos por las tarifas de acueducto y de alcantarillado, y sumar la tarifa de aseo y los cargos fijos.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>multiplicar los m³ consumidos por el costo de consumo y por el costo de alcantarillado.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>multiplicar los m³ consumidos por las tarifas y sumar los cargos fijos de aseo y alcantarillado.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf14\" data-k=\"B\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia aprendida a preguntas tipo Saber 11, sin acompañamiento del docente ni de sus compañeros.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué cuenta escribiste antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento del encuentro. Si un estudiante marca sin llenar la columna, se le anota, no se le corrige.", "apoyo": ["⚑ Fuente: compilado ASED (no es del ICFES). No la presentes como pregunta del ICFES; Nelson decide si se reemplaza.", "La clave es la B. Cómo se llega: Acueducto y alcantarillado dependen de los m³ (se multiplican); aseo y cargos fijos se cobran siempre (se suman). Solo la B incluye todo: la D olvida el cargo fijo del acueducto.", "En el cuaderno la trabajan con el instrumento «Arma el recibo por partes» (estrategia 2 · Lo fijo y lo que crece)."]}}, {"m": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m6)\">Cierre<\/span><span class=\"kicker\">La pregunta de siempre<\/span><\/div><h2>¿En qué se parecía la pregunta Saber 11 a la de tu libro?<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:#242478\"><div class=\"k\">1<\/div><div><b>Subir, llegar y volver<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#30843C\"><div class=\"k\">2<\/div><div><b>Lo fijo y lo que crece<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#C9821B\"><div class=\"k\">3<\/div><div><b>Un modelo, tres preguntas<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#A82424\"><div class=\"k\">4<\/div><div><b>El patrón que continúa<\/b><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--m6)\"><h3>Antes de salir<\/h3><ol class=\"pasos\"><li>La palabra que te frenó hoy, en «Palabras que me frenaron», con tus palabras.<\/li><li>«Lo que me llevo de esta pregunta».<\/li><li>Tu carita de salida.<\/li><li>La casilla 1 de la portada del área.<\/li><\/ol><\/div><\/div>", "guia": {"obj": "Que el estudiante verbalice qué tienen en común la pregunta del libro y la de entrenamiento, y nombre la estrategia que usó para resolverlas.", "decir": ["Socializa solo las preguntas que el grupo falló, con dos o tres respuestas del salón.", "Pide que lean en voz alta su salvavidas: la ruta mínima que los habría salvado.", "Cierra nombrando la estrategia y anunciando en qué momento vuelve a aparecer."], "como": "No dicta la conclusión. Si nadie la escribe en sus palabras, la clase no cerró: vale más dejar una pregunta sin socializar que dictar el resumen.", "apoyo": ["Pide que dos o tres lean en voz alta su salvavidas: la ruta mínima que los habría salvado en la pregunta que fallaron.", "La palabra nueva no se dicta. Si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase: es mejor que dictarla bien.", "Para el cierre del momento: La estrategia 1 cubre la parábola completa (subir, vértice, bajar). El banco verificado no tiene todavía una pregunta Saber 11 de parábola completa, así que el entrenamiento de este momento refuerza las otras tres."]}}];
var MOM = [{"n": 1, "nom": "Activación", "min": 15, "c": "--m1"}, {"n": 2, "nom": "Pregunta problematizadora", "min": 20, "c": "--m2"}, {"n": 3, "nom": "Desarrollo guiado", "min": 35, "c": "--m3"}, {"n": 4, "nom": "Reto en equipo", "min": 20, "c": "--m4"}, {"n": 5, "nom": "Evaluación individual", "min": 20, "c": "--m5"}, {"n": 6, "nom": "Cierre", "min": 10, "c": "--m6"}];
var NOMBRE = document.getElementById("momnom").textContent, SUB = document.getElementById("momsub").textContent;
var $ = function(s){ return document.querySelector(s); };
var wrap = $("#wrap"), stage = $("#stage"), i = 0;
var tBase = 0, tLeft = 0, tOn = false, tick = null;
var elegidas = [];
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function paintClock(){
  var n = $("#tnum");
  if(!tBase){ n.textContent = "—"; n.classList.remove("over"); return; }
  var s = Math.abs(tLeft), mm = Math.floor(s/60), ss = s%60;
  n.textContent = (tLeft<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", tLeft<0);
}
function setTimer(min){
  tBase = min||0; tLeft = tBase*60; tOn = false;
  if(tick){ clearInterval(tick); tick = null; }
  $("#play").textContent = "Iniciar"; paintClock();
}
function toggleTimer(){
  if(!tBase) return;
  tOn = !tOn; $("#play").textContent = tOn ? "Pausar" : "Seguir";
  if(tick){ clearInterval(tick); tick = null; }
  if(tOn) tick = setInterval(function(){ tLeft--; paintClock(); }, 1000);
  paintClock();
}
function guiaHTML(g){
  if(!g) return '<p class="sub">Sin notas para esta diapositiva.</p>';
  var h = '<div class="gbox"><h4>Objetivo</h4><p>'+esc(g.obj)+'</p></div>';
  if(g.decir && g.decir.length) h += '<div class="gbox"><h4>Qué haces y qué dices</h4><ul>'+
     g.decir.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  if(g.como) h += '<div class="gbox como"><h4>Lo que no haces</h4><p>'+esc(g.como)+'</p></div>';
  if(g.apoyo && g.apoyo.length) h += '<div class="gbox apoyo"><h4>Si Matemáticas no es tu fuerte</h4><ul>'+
     g.apoyo.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  return h;
}
function pintaElegidas(){
  var box = document.getElementById("elegidas"); if(!box) return;
  if(!elegidas.length){ box.innerHTML = '<p class="sub">Vuelve a la diapositiva anterior y escoge las cinco.</p>'; return; }
  box.innerHTML = elegidas.map(function(t,k){
    return '<div class="card edge" style="--accent:var(--m'+((k%6)+1)+')"><h3>'+(k+1)+'. '+esc(t)+'</h3>'+
      '<p class="sub">Busca esta pregunta en tu simulacro y en la hoja de taller de la misma estrategia.</p></div>';
  }).join("");
}
function go(n){
  var prev = SC[i];
  i = Math.max(0, Math.min(SC.length-1, n));
  var s = SC[i];
  wrap.innerHTML = s.html;
  wrap.classList.remove("enter"); void wrap.offsetWidth; wrap.classList.add("enter");
  stage.scrollTop = 0;
  var m = s.m!=null ? MOM[s.m] : null;
  $("#momdot").style.background = m ? "var("+m.c+")" : "var(--faint)";
  $("#momdot").textContent = m ? m.n : "·";
  $("#momnom").textContent = m ? m.nom : NOMBRE;
  $("#momsub").textContent = m ? (m.min+" minutos") : SUB;
  var want = s.min!=null ? s.min : (m ? m.min : 0);
  var cambio = !prev || prev===s || prev.m!==s.m || (prev.min||null)!==(s.min||null);
  if(cambio) setTimer(want);
  $("#count").textContent = (i+1)+" / "+SC.length;
  $("#prog i").style.width = (SC.length>1 ? i/(SC.length-1)*100 : 100)+"%";
  $("#guiabody").innerHTML = guiaHTML(s.guia);
  [].forEach.call(wrap.querySelectorAll("[data-pick]"), function(b){
    b.setAttribute("aria-pressed", elegidas.indexOf(b.textContent)>=0 ? "true" : "false"); });
  pintaElegidas();
}
wrap.addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.dataset.show){ var t = document.getElementById(b.dataset.show); if(t) t.hidden = !t.hidden; }
  if(b.dataset.showgrupo){
    var g = wrap.querySelectorAll('[data-grupo="'+b.dataset.showgrupo+'"]'), abrir = g.length && g[0].hidden;
    [].forEach.call(g, function(x){ x.hidden = !abrir; });
    b.textContent = abrir ? "Ocultar las claves" : "Revelar las claves";
  }
  if(b.dataset.clave){
    var box = document.getElementById(b.dataset.clave), ok = box.querySelector('[data-op="'+b.dataset.k+'"]');
    var on = ok && !ok.classList.contains("ok");
    [].forEach.call(box.querySelectorAll(".op"), function(o){ o.classList.remove("ok"); });
    if(on) ok.classList.add("ok");
    b.textContent = on ? "Ocultar la clave" : "Revelar la clave";
  }
  if(b.dataset.tally){ var n = document.getElementById(b.dataset.tally); n.textContent = (+n.textContent||0)+1; }
  if(b.dataset.reset){ [].forEach.call(wrap.querySelectorAll('[id^="'+b.dataset.reset+'"]'), function(x){
    if(x.classList.contains("n")) x.textContent = "0"; }); }
  if(b.dataset.pick!=null){
    var t = b.textContent, k = elegidas.indexOf(t);
    if(k>=0) elegidas.splice(k,1); else if(elegidas.length<5) elegidas.push(t);
    b.setAttribute("aria-pressed", elegidas.indexOf(t)>=0 ? "true" : "false");
  }
});
function setGuia(on){ $("#guia").classList.toggle("open", on); $("#scrim").classList.toggle("on", on);
  $("#gbtn").setAttribute("aria-pressed", on ? "true" : "false"); }
$("#next").addEventListener("click", function(){ go(i+1); });
$("#prev").addEventListener("click", function(){ go(i-1); });
$("#play").addEventListener("click", toggleTimer);
$("#reset").addEventListener("click", function(){ setTimer(tBase); });
$("#gbtn").addEventListener("click", function(){ setGuia(!$("#guia").classList.contains("open")); });
$("#gclose").addEventListener("click", function(){ setGuia(false); });
$("#scrim").addEventListener("click", function(){ setGuia(false); });
document.addEventListener("keydown", function(e){
  var t = e.target.tagName; if(t==="INPUT"||t==="TEXTAREA") return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ go(i+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ go(i-1); e.preventDefault(); }
  else if(e.key==="Home"){ go(0); e.preventDefault(); }
  else if(e.key==="End"){ go(SC.length-1); e.preventDefault(); }
  else if(e.key==="g"||e.key==="G"){ setGuia(!$("#guia").classList.contains("open")); }
  else if(e.key==="t"||e.key==="T"){ toggleTimer(); }
  else if(e.key==="Escape"){ setGuia(false); }
});
go(0);
})();
</script>
</body>
</html>
