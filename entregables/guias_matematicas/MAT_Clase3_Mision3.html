<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Matemáticas · Clase 3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>[hidden]{display:none!important}
:root{
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --text:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --area:#1F4E8C; --azul:#242478; --oro:#B0711A; --morado:#5B3E96; --verde:#2E7A39;
  --m1:#1F4E8C; --m2:#A23B72; --m3:#5B3E96; --m4:#0E7C86; --m5:#3E4A5C; --m6:#8C5A2B; --rojo:#A82424;
  --ink:#1B1F27; --muted:#5C6472; --faint:#A9B0BB; --line:#E3E7ED; --paper:#FFFFFF; --bg:#F6F4F1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:clamp(16px,1.25vw,21px);line-height:1.5}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
#top{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding:10px clamp(14px,2vw,28px);background:var(--paper);flex-wrap:wrap}
.logo img{height:clamp(28px,2.6vw,40px);display:block}
#mom{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
#momdot{width:clamp(30px,2.4vw,40px);height:clamp(30px,2.4vw,40px);border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;background:var(--faint)}
#momnom{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.2vw,20px)}
#momsub{color:var(--muted);font-size:.85em}
#clock{display:flex;align-items:center;gap:8px}
#tnum{font-family:var(--display);font-weight:800;font-size:clamp(20px,1.8vw,30px);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
#tnum.over{color:var(--area)}
.btn{appearance:none;font:inherit;font-size:.86em;font-weight:600;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.solid{background:var(--area);border-color:var(--area);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#stage{overflow:auto;padding:clamp(18px,3vw,48px) clamp(16px,4vw,72px)}
#wrap{max-width:1500px;margin:0 auto}
#wrap.enter{animation:ent .28s ease-out}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bot{display:flex;align-items:center;gap:12px;padding:10px clamp(14px,2vw,28px);background:var(--paper)}
#prog{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
#prog i{display:block;height:100%;background:var(--area);transition:width .25s}
#count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
#hint{color:var(--faint);font-size:.8em}
@media (max-width:760px){#hint{display:none}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.2vw,68px);line-height:1.05;margin:.2em 0 .25em;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,2.8vw,46px);line-height:1.1;margin:.25em 0 .3em;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:clamp(18px,1.5vw,26px);margin:.1em 0 .4em;line-height:1.2}
p{margin:.35em 0 .6em}
.lead{font-size:1.2em;line-height:1.45;max-width:70ch}
.sub{color:var(--muted)}
.mt{margin-top:clamp(14px,1.8vw,26px)}
.logo-xl img{height:clamp(54px,6vw,96px);margin-bottom:12px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tag,.min,.membrete{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.78em;font-weight:700;letter-spacing:.02em}
.tag{background:var(--ink);color:#fff}
.min{background:var(--accent,var(--area));color:#fff}
.membrete{border:1.5px solid var(--line);color:var(--muted)}
.kicker{color:var(--muted);font-size:.85em;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.grid{display:grid;gap:clamp(12px,1.4vw,22px)}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid>*{min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,1.6vw,24px)}
.card.edge{border-left:6px solid var(--accent,var(--area))}
.card.big .lead{font-size:1.3em}
.step{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px}
.step .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;flex:none}
.note{border-left:5px solid var(--accent,var(--area));background:var(--paper);border-radius:10px;padding:10px 16px;margin-top:12px}
.cita{font-family:var(--display);font-weight:600;line-height:1.35;background:var(--paper);border-left:6px solid var(--area);border-radius:12px;padding:clamp(16px,2vw,30px);margin:18px 0}
.cita.xl{font-size:clamp(24px,2.6vw,44px)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally .n{display:inline-block;min-width:1.6em;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.pasos{margin:.2em 0 0;padding-left:1.3em}.pasos li{margin:.3em 0}
.sello{margin-top:12px;border:2px dashed var(--oro);border-radius:12px;padding:10px 14px;background:#FDF6EA}
.sello b{display:block;color:var(--oro);font-size:.8em;letter-spacing:.06em;text-transform:uppercase}
.clave{margin-top:12px;display:flex;align-items:center;gap:10px;font-weight:600}
.keychip{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:10px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.2em}
.aviso{margin-top:10px;border-radius:10px;padding:10px 14px;background:#FBEFEF;border-left:5px solid var(--area);font-size:.92em}
.aviso.sev-aten{background:#EDF5EE;border-left-color:var(--verde)}
.aviso.sev-medi{background:#FDF5E7;border-left-color:var(--oro)}
.icfes .texto{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.6vw,24px);max-height:62vh;overflow:auto;font-size:.95em}
.enun{font-weight:600;font-size:1.08em}
.ops{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.op .L{flex:none;width:1.8em;height:1.8em;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-family:var(--display);font-weight:800}
.op.ok{border-color:var(--verde);background:#EDF5EE}.op.ok .L{background:var(--verde);color:#fff}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick[aria-pressed="true"]{background:var(--area);border-color:var(--area);color:#fff}
#scrim{position:fixed;inset:0;background:rgba(15,18,24,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#guia{position:fixed;top:0;right:0;height:100%;width:min(520px,92vw);background:var(--paper);box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column;z-index:10}
#guia.open{transform:none}
#guiahead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg)}
#guiabody{overflow:auto;padding:16px 20px 30px;font-size:.92em}
.gbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.gbox h4{margin:0 0 6px;font-family:var(--display);font-size:.8em;letter-spacing:.07em;text-transform:uppercase;color:var(--area)}
.gbox ul{margin:0;padding-left:1.1em}.gbox li{margin:.35em 0}
.gbox.como{background:#F6F7F9}.gbox.como h4{color:var(--muted)}
.gbox.apoyo{background:#FDF6EA;border-color:#EAD9B4}.gbox.apoyo h4{color:var(--oro)}

.dat{border-collapse:collapse;margin-top:10px;font-size:.95em;background:var(--paper)}
.dat th,.dat td{border:1px solid var(--line);padding:6px 14px;text-align:center}
.dat th{background:#EEF3FA;font-weight:700}
.dat.act{font-size:1.15em;margin-top:0}.dat.act td,.dat.act th{min-width:4.2em;padding:8px 16px}
.dat td.q{color:var(--faint);font-weight:700}
.fig{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:10px}
.fig svg{display:block;width:100%;height:auto;margin:0 auto}
.fig text{font-family:var(--text)}
.ops.c2{grid-template-columns:1fr 1fr}
.modelo{font-size:.9em}.manos{align-self:center}.modelo .card p{margin-top:0}
.lado{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}.lado .fig{flex:1 1 260px}.lado .dat{flex:0 0 auto}
.inst{font-style:italic;color:var(--muted)}
.nota{font-size:.85em;margin-top:4px}
.enun2{font-weight:600;margin-top:10px}
.cajas{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.caja{flex:1 1 200px;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--m5);border-radius:10px;padding:8px 14px}
.caja b{display:block;font-family:var(--display)}.caja span{display:block}
.suc{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.suc span{min-width:3.6em;text-align:center;font-family:var(--display);font-weight:800;font-size:1.4em;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}
.keychip.doble{width:auto;padding:0 .45em}
</style>
</head>

a prueba de campo, páginas 293 a 295<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m4)\"><h3>Tu cuaderno<\/h3><p class=\"sub\">Páginas 25 a 31<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m6)\"><h3>Hoy<\/h3><p class=\"sub\">120 minutos · 6 momentos · 4 estrategias · 10 preguntas del libro · 4 de entrenamiento<\/p><\/div><\/div>", "guia": {"obj": "Que el grupo sepa desde el primer minuto qué va a pasar en estos 120 minutos y qué tiene que tener sobre la mesa.", "decir": ["«Libro abierto, cuaderno cerrado, lápiz. Esfero no: hoy vamos a equivocarnos por escrito, y eso se corrige con borrador.»"], "apoyo": ["⚑ Antes del sábado, lo que tienes que instalar: Semejanza: qué cambia y qué no cambia entre dos figuras semejantes. Y que «altura : sombra» y «sombra : altura» son razones distintas, aunque las dos sean ciertas. Lo que decide es el orden en que la pregunta las nombra.", "Ojo con esto: La unidad primero, la cuenta después. La mitad de los errores de este momento son metros contra centímetros, no geometría.", "Aviso del libro, preg. 10 (alta): La figura tiene 7 casillas vacías y la opción correcta afirma que hay 14. Qué haces: Ninguna opción coincide con la figura. Que cuenten las casillas ellos mismos y escriban qué no les cuadró: el cuaderno les deja el renglón para eso.", "Aviso del libro, preg. 2 (media): La cuarta opción está rotulada «A.» en lugar de «D.». Qué haces: Avísalo antes de empezar, no después de que marquen.", "Aviso del libro, preg. 8 (baja): La opción correcta dice «se multiplican los volúmenes de 32 cubos». Qué haces: Redacción imprecisa: es un cubo y después los 32. Léela corrigiendo en voz alta.", "Lo que tienes que poder explicar hoy en dos minutos, sin jerga. Si un estudiante lo sabe mejor que tú, déjalo explicar y pide que lo muestre con un número:", "Volumen de un prisma = área de la base × altura. Volumen de una pirámide = ⅓ × área de la base × altura.", "Semejanza: si dos triángulos tienen los mismos ángulos, sus lados son proporcionales. Los rayos del sol llegan paralelos, así que un objeto y su sombra forman triángulos semejantes con otro objeto y la suya.", "Unidades: 1 m = 100 cm, pero 1 m² = 10.000 cm² y 1 m³ = 1.000.000 cm³. Antes de dividir, todo en la misma unidad.", "Longitud de una circunferencia = 2πr; un cuarto de vuelta es la cuarta parte.", "Abre esta guía con la tecla G en cada diapositiva: trae lo que dices y, debajo, lo que necesitas saber si Matemáticas no es tu área.", "El cronómetro arranca con T y se reinicia solo cuando cambia el momento de la clase."]}}, {"m": null, "html": "<div class=\"eyebrow\"><span class=\"kicker\">Así vamos a trabajar<\/span><\/div><h2>Seis momentos, una sola regla<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:var(--m1)\"><div class=\"k\">1<\/div><div><b>Activación<\/b><span class=\"sub\"> · 15 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m2)\"><div class=\"k\">2<\/div><div><b>Pregunta problematizadora<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m3)\"><div class=\"k\">3<\/div><div><b>Desarrollo guiado<\/b><span class=\"sub\"> · 35 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m4)\"><div class=\"k\">4<\/div><div><b>Reto en equipo<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m5)\"><div class=\"k\">5<\/div><div><b>Evaluación individual<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m6)\"><div class=\"k\">6<\/div><div><b>Cierre<\/b><span class=\"sub\"> · 10 min<\/span><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--area)\"><h3>La regla del cuaderno<\/h3><p class=\"lead\">Si el instrumento está vacío, no resolviste: adivinaste.<\/p><p>Primero se escribe el instrumento —la tabla, la cuenta, el dibujo—, después se marca la opción. Una respuesta correcta con el instrumento en blanco no cuenta como resuelta.<\/p><\/div><\/div>", "guia": {"obj": "Que la regla quede dicha en voz alta antes de cualquier texto.", "decir": ["«Si marcas sin llenar, para mí esa pregunta está en blanco, aunque esté bien.»", "Pasa por los puestos mirando el instrumento, no la respuesta."], "apoyo": ["Si alguien pregunta para qué escribir si ya sabe la respuesta: porque en la prueba nadie le va a decir si acertó, y la única manera de saberlo es tener la cuenta en el papel.", "Tú no tienes que resolver nada en este momento: tu trabajo es verificar que estén escribiendo. Ese registro es lo que la coordinación revisa después."]}}, {"m": 0, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Activación<\/span><span class=\"kicker\">Cuaderno cerrado<\/span><\/div><h2>¿Qué está cambiando aquí, y respecto a qué?<\/h2><p class=\"lead\">Unos números en una tabla. Nadie dice todavía de qué son.<\/p><table class=\"dat act\"><thead><tr><th>lado (cm)<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><\/thead><tbody id=\"datos3\" hidden><tr><th>cubitos que caben<\/th><td>1<\/td><td>8<\/td><td>27<\/td><td>64<\/td><\/tr><\/tbody><\/table><p class=\"lead mt\">Y una más: ¿el segundo número crece igual que el primero?<\/p><div class=\"ctl\"><button class=\"btn\" data-show=\"datos3\">Destapar los datos<\/button><button class=\"btn\" data-show=\"pista3\">Mostrar la pista<\/button><\/div><div class=\"note\" id=\"pista3\" hidden style=\"--accent:var(--m1)\"><b>De dónde salen:<\/b> Son cubos armados con cubitos de 1 cm. Si el lado se duplica, caben 8 veces más cubitos: lo que mide no crece igual que lo que llena.<\/div>", "guia": {"obj": "Que el estudiante active con el cuerpo la noción de cambio antes de ver cualquier fórmula, reconociendo en datos cotidianos qué magnitud varía y respecto a cuál.", "decir": ["Destapa los datos y haz una sola pregunta: «¿qué está cambiando aquí, y respecto a qué?». Anota en el tablero tres respuestas distintas sin calificar ninguna.", "Después, la segunda pregunta de la pantalla."], "como": "No resuelve, no corrige y no adelanta vocabulario técnico. Si alguien dice «función» o «pendiente», lo deja pasar sin confirmar ni negar. El cuaderno permanece cerrado.", "apoyo": ["No tienes que explicar nada en este momento. Si alguien dice «función», «pendiente» o «variable», no lo confirmes ni lo niegues: «anótalo, volvemos a eso».", "Los datos son inventados para la clase: no salen del libro. Dilo si te lo preguntan.", "La pista es para el cierre de los 15 minutos, no para el principio: Son cubos armados con cubitos de 1 cm. Si el lado se duplica, caben 8 veces más cubitos: lo que mide no crece igual que lo que llena."]}}, {"m": 0, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#242478\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 1 · Partir el cuerpo en piezas<\/span><\/div><h2>El cuerpo por partes<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Con pupitres o cajas de cartón se arma en el salón un cuerpo compuesto.<\/li><li>El grupo tiene que separarlo físicamente en las dos o tres piezas que sí sabe medir.<\/li><li>Cada pieza se nombra en voz alta antes de tocar la calculadora.<\/li><li>Si alguien propone una pieza cuya fórmula no puede escribir de memoria, no vale.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Pupitres o cajas · espacio para armar y separar<\/p><h3 class=\"mt\">Qué entrena<\/h3><p>Descomponer antes de calcular, y cobrar cada parte por separado. Es el movimiento de las preguntas 1, 8 y 9.<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante active con el cuerpo la noción de cambio antes de ver cualquier fórmula, reconociendo en datos cotidianos qué magnitud varía y respecto a cuál.", "decir": ["«Esto no es recreo: es el mismo movimiento que van a hacer con la pregunta en cinco minutos, pero con el cuerpo.»"], "como": "No resuelve, no corrige y no adelanta vocabulario técnico. Si alguien dice «función» o «pendiente», lo deja pasar sin confirmar ni negar. El cuaderno permanece cerrado.", "apoyo": ["Qué movimiento mental entrena: Descomponer antes de calcular, y cobrar cada parte por separado. Es el movimiento de las preguntas 1, 8 y 9.", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase.", "Es la dinámica de la estrategia 1 del cuaderno, «Partir el cuerpo en piezas». Al terminar, di el nombre en voz alta: es el mismo que el estudiante ve en el chip de su hoja."]}}, {"m": 1, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m2)\">Pregunta problematizadora<\/span><span class=\"membrete\">Libro · pregunta 1 · página 293<\/span><\/div><h2>Abran el libro en la página 293<\/h2><div class=\"grid c2 mt modelo\"><div class=\"card\"><p>En un parque se construye un tanque de agua formado por un prisma rectangular de base cuadrada, sobre el que se instala una cubierta piramidal. El lado de la base cuadrada es de 4 m, la altura del prisma es de 3 m y la altura de la pirámide es de 6 m.<\/p><div class=\"fig\"><svg viewBox=\"0 0 520 360\" role=\"img\" aria-label=\"Tanque: prisma de base cuadrada con cubierta piramidal\" style=\"max-height:min(300px,34vh)\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"70.0,330.0 206.0,330.0 206.0,228.0 70.0,228.0\" fill=\"#EEF3FA\" stroke=\"#1F4E8C\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"206.0,330.0 260.4,292.6 260.4,190.6 206.0,228.0\" fill=\"#E1E9F4\" stroke=\"#1F4E8C\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"70.0,228.0 206.0,228.0 165.2,5.3\" fill=\"#F4F7FB\" stroke=\"#1F4E8C\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"206.0,228.0 260.4,190.6 165.2,5.3\" fill=\"#E9EFF7\" stroke=\"#1F4E8C\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"70.0\" y1=\"330.0\" x2=\"124.4\" y2=\"292.6\" stroke=\"#1F4E8C\" stroke-width=\"1.5\" stroke-dasharray=\"5,5\" stroke-linecap=\"round\"/><line x1=\"124.4\" y1=\"292.6\" x2=\"260.4\" y2=\"292.6\" stroke=\"#1F4E8C\" stroke-width=\"1.5\" stroke-dasharray=\"5,5\" stroke-linecap=\"round\"/><line x1=\"124.4\" y1=\"292.6\" x2=\"124.4\" y2=\"190.6\" stroke=\"#1F4E8C\" stroke-width=\"1.5\" stroke-dasharray=\"5,5\" stroke-linecap=\"round\"/><line x1=\"124.4\" y1=\"190.6\" x2=\"165.2\" y2=\"5.3\" stroke=\"#1F4E8C\" stroke-width=\"1.5\" stroke-dasharray=\"5,5\" stroke-linecap=\"round\"/><line x1=\"70.0\" y1=\"228.0\" x2=\"124.4\" y2=\"190.6\" stroke=\"#1F4E8C\" stroke-width=\"1.5\" stroke-dasharray=\"5,5\" stroke-linecap=\"round\"/><line x1=\"124.4\" y1=\"190.6\" x2=\"260.4\" y2=\"190.6\" stroke=\"#1F4E8C\" stroke-width=\"1.5\" stroke-dasharray=\"5,5\" stroke-linecap=\"round\"/><text x=\"138.0\" y=\"356.0\" font-size=\"16\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">4 m<\/text><text x=\"255.2\" y=\"325.3\" font-size=\"16\" fill=\"#1B1F27\" text-anchor=\"start\" font-weight=\"700\">4 m<\/text><text x=\"60.0\" y=\"284.0\" font-size=\"16\" fill=\"#1B1F27\" text-anchor=\"end\" font-weight=\"700\">3 m<\/text><line x1=\"165.2\" y1=\"5.3\" x2=\"165.2\" y2=\"209.3\" stroke=\"#A82424\" stroke-width=\"1.5\" stroke-dasharray=\"4,4\" stroke-linecap=\"round\"/><text x=\"181.2\" y=\"107.3\" font-size=\"16\" fill=\"#A82424\" text-anchor=\"start\" font-weight=\"700\">6 m<\/text><text x=\"300.0\" y=\"60.0\" font-size=\"15\" fill=\"#5C6472\" text-anchor=\"start\" font-weight=\"400\">Volumen de la pirámide =<\/text><text x=\"300.0\" y=\"82.0\" font-size=\"15\" fill=\"#5C6472\" text-anchor=\"start\" font-weight=\"400\">⅓ · área de la base · altura<\/text><\/svg><\/div><\/div><div><p class=\"enun\">Según el esquema, ¿cuál es el volumen total de la estructura?<\/p><div class=\"ops c2\" id=\"mod3\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>64 m³<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>80 m³<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>96 m³<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>112 m³<\/span><\/div><\/div><div class=\"ctl\"><span class=\"sub manos\">Antes de analizar, manos:<\/span><button class=\"btn tally\" data-tally=\"h3A\">A <span class=\"n\" id=\"h3A\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h3B\">B <span class=\"n\" id=\"h3B\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h3C\">C <span class=\"n\" id=\"h3C\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h3D\">D <span class=\"n\" id=\"h3D\">0<\/span><\/button><button class=\"btn\" data-reset=\"h3\">↺<\/button><button class=\"btn\" data-clave=\"mod3\" data-k=\"B\">Revelar la clave<\/button><\/div><div class=\"note\" style=\"--accent:var(--m2)\"><b>La regla de este momento:<\/b> nadie justifica diciendo «porque se ve así». Cada intervención nombra un dato: un valor, un punto de la gráfica, una cuenta.<\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante compruebe que una pregunta tipo Saber 11 no se resuelve calculando sino interpretando, usando la pregunta modelo del libro.", "decir": ["Presenta la pregunta modelo del libro y la deja a la vista todo el momento.", "Pide hipótesis a mano alzada ANTES de cualquier análisis y las anota en el tablero.", "Recorre en voz alta con el grupo el paso a paso que el libro propone.", "Revela la clave solo al final y trabaja el análisis de distractores."], "como": "Regla del momento: nadie justifica diciendo «porque se ve así». Cada intervención debe nombrar un dato concreto de la gráfica o de la tabla.", "apoyo": ["Cuenta las manos con los botones antes de cualquier análisis. El número queda en pantalla: al final del momento vuelves a él y el grupo ve cuántos cambiaron de opinión al hacer la cuenta.", "Primer paso en voz alta: ¿Hay una fórmula para la figura entera? No: hay una para la caja y otra para la punta.", "La clave es la B. Cómo se llega: Prisma: 4 × 4 × 3 = 48 m³. Pirámide: ⅓ × 16 × 6 = 32 m³. Total: 80 m³. La C (96 m³) sale de olvidar el ⅓ y quitar el prisma; las otras, de usar mal la fórmula de la pirámide.", "Revélala solo al final de los 20 minutos, después del análisis de distractores: el botón es para ese momento. En el bloque de las preguntas 1 y 2 la vuelven a trabajar en su instrumento."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 1 y 2<\/span><span class=\"kicker\">En pantalla, casilla por casilla<\/span><\/div><h2>Preguntas 1 y 2: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 1 · página 293<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Partir el cuerpo en piezas<\/span><\/div><p class=\"sub\">Tanque de agua · prisma de 4 × 4 × 3 con cubierta piramidal<\/p><h3 style=\"color:#242478\">Separa el cuerpo y cóbralo por partes<\/h3><p class=\"inst\">Nadie tiene una fórmula para «prisma con sombrero». Lo que sí hay es una fórmula para la caja y otra para la punta. Separa las dos piezas, calcula cada una y después súmalas.<\/p><div class=\"clave\" hidden data-grupo=\"k31\"><span class=\"keychip\" style=\"background:#242478\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 2 · página 293<\/span><span class=\"min\" style=\"--accent:#A82424\">E2 · La misma razón para los dos<\/span><\/div><p class=\"sub\">Cristo Rey y la farola · sombras en la misma dirección<\/p><h3 style=\"color:#A82424\">Dos triángulos con la misma forma<\/h3><p class=\"inst\">El sol está tan lejos que sus rayos llegan paralelos: la farola y la estatua hacen el mismo triángulo, uno pequeño y otro grande. Dibuja los dos y pon en cada uno lo que sabes.<\/p><div class=\"clave\" hidden data-grupo=\"k31\"><span class=\"keychip\" style=\"background:#A82424\">B<\/span> es la clave del libro<\/div><div class=\"aviso sev-medi\" hidden data-grupo=\"k31\"><b>Ojo con esta clave:<\/b> En el libro la cuarta opción viene rotulada «A.»: es la D.<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k31\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante resuelva las preguntas del taller dejando registro escrito de su razonamiento antes de marcar la respuesta.", "decir": ["«Antes de marcar: ¿qué escribieron en el instrumento? Léanme la cuenta.»", "Si alguien se traba, pregúntale en qué casilla del instrumento se quedó. No le des la respuesta: devuélvelo a su hoja."], "como": "No da respuestas. Si un estudiante se traba, lo devuelve al paso a paso de su propia hoja y le pregunta en cuál de los pasos se quedó.", "apoyo": ["Las claves del libro son 1·B y 2·B. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Este bloque se hace en el tablero, casilla por casilla del instrumento, con todo el grupo: es el modelo de cómo se llenan las demás hojas.", "Pregunta 1 · clave B. Cómo se llega: Prisma: 4 × 4 × 3 = 48 m³. Pirámide: ⅓ × 16 × 6 = 32 m³. Total: 80 m³. La C (96 m³) sale de olvidar el ⅓ y quitar el prisma; las otras, de usar mal la fórmula de la pirámide.", "Pregunta 2 · clave B. Cómo se llega: Rayos paralelos, triángulos semejantes: 10 ÷ 12 = 26 ÷ x → x = 26 × 12 ÷ 10 = 31,2 m. En el libro la cuarta opción viene rotulada «A.»: es la D.", "Pregunta 2 · aviso del libro (media): La cuarta opción está rotulada «A.» en lugar de «D.». Qué haces: Avísalo antes de empezar, no después de que marquen."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 3 y 4<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 3 y 4: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 3 · página 293<\/span><span class=\"min\" style=\"--accent:#A82424\">E2 · La misma razón para los dos<\/span><\/div><p class=\"sub\">La razón altura : sombra, escrita en decimales<\/p><h3 style=\"color:#A82424\">Las cuatro divisiones posibles<\/h3><p class=\"inst\">Con dos alturas y dos sombras se pueden armar cuatro divisiones distintas, y cada una da un número diferente. Hazlas todas: después solo tienes que ver cuál es la que te piden.<\/p><div class=\"clave\" hidden data-grupo=\"k33\"><span class=\"keychip\" style=\"background:#A82424\">A<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#30843C\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 4 · página 294<\/span><span class=\"min\" style=\"--accent:#30843C\">E3 · Cuántas veces cabe<\/span><\/div><p class=\"sub\">Auditorio de Pasto · 12 m × 8 m con baldosas de 40 cm<\/p><h3 style=\"color:#30843C\">Primero la misma unidad, después la cuenta<\/h3><p class=\"inst\">El piso viene en metros y la baldosa en centímetros. Mientras no estén en la misma unidad, cualquier división da un número sin sentido. Pásalo todo a metros y escoge tu camino.<\/p><div class=\"clave\" hidden data-grupo=\"k33\"><span class=\"keychip\" style=\"background:#30843C\">C<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k33\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante resuelva las preguntas del taller dejando registro escrito de su razonamiento antes de marcar la respuesta.", "decir": ["«Antes de marcar: ¿qué escribieron en el instrumento? Léanme la cuenta.»", "Si alguien se traba, pregúntale en qué casilla del instrumento se quedó. No le des la respuesta: devuélvelo a su hoja."], "como": "No da respuestas. Si un estudiante se traba, lo devuelve al paso a paso de su propia hoja y le pregunta en cuál de los pasos se quedó.", "apoyo": ["Las claves del libro son 3·A y 4·C. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 3 · clave A. Cómo se llega: altura ÷ sombra: farola 10 ÷ 12 ≈ 0,83; estatua 26 ÷ 31,2 ≈ 0,83. La B (1,2 = 1,2) también es una igualdad cierta, pero es sombra ÷ altura: no es la razón altura : sombra que piden.", "Pregunta 4 · clave C. Cómo se llega: Todo en metros: la baldosa mide 0,4 m y cubre 0,16 m². El piso: 12 × 8 = 96 m². 96 ÷ 0,16 = 600. Por filas: 12 ÷ 0,4 = 30 y 8 ÷ 0,4 = 20; 30 × 20 = 600."]}}, {"m": 2, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#A82424\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 2 · La misma razón para los dos<\/span><\/div><h2>Dos sombras, un ángulo<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Con una linterna y dos objetos de alturas distintas se proyectan dos sombras.<\/li><li>Se mide cada sombra y cada altura y se escriben las dos razones en el tablero.<\/li><li>El grupo decide: ¿qué cambió entre los dos objetos y qué no cambió?<\/li><li>Se mueve la linterna y se repite: la razón se mantiene, los tamaños no.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Una linterna · dos objetos de alturas distintas · metro<\/p><h3 class=\"mt\">Qué entrena<\/h3><p>Reconocer qué se conserva entre dos figuras semejantes, y que «altura : sombra» no es lo mismo que «sombra : altura». Es el movimiento de las preguntas 2 y 3.<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante resuelva las preguntas del taller dejando registro escrito de su razonamiento antes de marcar la respuesta.", "decir": ["«Esto no es recreo: es el mismo movimiento que van a hacer con la pregunta en cinco minutos, pero con el cuerpo.»"], "como": "No da respuestas. Si un estudiante se traba, lo devuelve al paso a paso de su propia hoja y le pregunta en cuál de los pasos se quedó.", "apoyo": ["Qué movimiento mental entrena: Reconocer qué se conserva entre dos figuras semejantes, y que «altura : sombra» no es lo mismo que «sombra : altura». Es el movimiento de las preguntas 2 y 3.", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase.", "Es la dinámica de la estrategia 2 del cuaderno, «La misma razón para los dos». Al terminar, di el nombre en voz alta: es el mismo que el estudiante ve en el chip de su hoja."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 5 y 6<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 5 y 6: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#30843C\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 5 · página 294<\/span><span class=\"min\" style=\"--accent:#30843C\">E3 · Cuántas veces cabe<\/span><\/div><p class=\"sub\">Sendero circular de radio 10 m · cuatro arcos iguales<\/p><h3 style=\"color:#30843C\">Una tajada de la curva, no del queso<\/h3><p class=\"inst\">Te piden caminar por el borde, no cubrir el terreno. Antes de calcular, decide qué te están pidiendo: eso cambia la fórmula y la respuesta.<\/p><div class=\"clave\" hidden data-grupo=\"k35\"><span class=\"keychip\" style=\"background:#30843C\">A<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 6 · página 294<\/span><span class=\"min\" style=\"--accent:#C9821B\">E4 · Antes de mover, mide<\/span><\/div><p class=\"sub\">Pirámide de cajas · la altura hasta donde empieza la muñeca<\/p><h3 style=\"color:#C9821B\">Arma la torre piso por piso<\/h3><p class=\"inst\">La altura no se adivina mirando el dibujo: se suma. Escribe lo que mide cada nivel, súmalos hacia arriba y compara el total con el techo de la vitrina.<\/p><div class=\"clave\" hidden data-grupo=\"k35\"><span class=\"keychip\" style=\"background:#C9821B\">C<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k35\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante resuelva las preguntas del taller dejando registro escrito de su razonamiento antes de marcar la respuesta.", "decir": ["«Antes de marcar: ¿qué escribieron en el instrumento? Léanme la cuenta.»", "Si alguien se traba, pregúntale en qué casilla del instrumento se quedó. No le des la respuesta: devuélvelo a su hoja."], "como": "No da respuestas. Si un estudiante se traba, lo devuelve al paso a paso de su propia hoja y le pregunta en cuál de los pasos se quedó.", "apoyo": ["Las claves del libro son 5·A y 6·C. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 5 · clave A. Cómo se llega: Circunferencia: 2π × 10 ≈ 62,8 m; un cuarto ≈ 15,7 m. La C es la vuelta entera y la B, media.", "Pregunta 6 · clave C. Cómo se llega: Base: dos capas de cubos de 20 cm = 40 cm; nivel 2: 20 cm; nivel 3: 20 cm. Total: 80 cm."]}}, {"m": 2, "min": 10, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#30843C\">Dinámica · 10 min<\/span><span class=\"kicker\">Entrena la estrategia 3 · Cuántas veces cabe<\/span><\/div><h2>Cabe o no cabe<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#30843C\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Se pone una caja al frente y un objeto que podría ir adentro.<\/li><li>Antes de probar, cada equipo escribe su predicción: cuántos caben y en qué orden.<\/li><li>Se prueba de verdad, metiéndolos uno por uno.<\/li><li>Quien dividió volúmenes sin mirar las tres dimensiones explica por qué falló.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Una caja y varios objetos iguales · metro<\/p><h3 class=\"mt\">Qué entrena<\/h3><p>Medir el hueco y medir lo que se va a meter, y comprobar que encaje en las tres dimensiones. Es el movimiento de las preguntas 4 y 5.<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante resuelva las preguntas del taller dejando registro escrito de su razonamiento antes de marcar la respuesta.", "decir": ["«Esto no es recreo: es el mismo movimiento que van a hacer con la pregunta en cinco minutos, pero con el cuerpo.»"], "como": "No da respuestas. Si un estudiante se traba, lo devuelve al paso a paso de su propia hoja y le pregunta en cuál de los pasos se quedó.", "apoyo": ["Qué movimiento mental entrena: Medir el hueco y medir lo que se va a meter, y comprobar que encaje en las tres dimensiones. Es el movimiento de las preguntas 4 y 5.", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase.", "Es la dinámica de la estrategia 3 del cuaderno, «Cuántas veces cabe». Al terminar, di el nombre en voz alta: es el mismo que el estudiante ve en el chip de su hoja."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 7 y 8<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 7 y 8: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 7 · página 294<\/span><span class=\"min\" style=\"--accent:#C9821B\">E4 · Antes de mover, mide<\/span><\/div><p class=\"sub\">La muñeca no cabe · reorganizar con las mismas piezas<\/p><h3 style=\"color:#C9821B\">Cuánto falta, y de dónde puede salir<\/h3><p class=\"inst\">Primero el número: cuánto espacio necesitas y cuánto tienes. Con esa diferencia en la mano, cada propuesta se juzga sola — y además hay tres reglas que ninguna puede romper.<\/p><div class=\"clave\" hidden data-grupo=\"k37\"><span class=\"keychip\" style=\"background:#C9821B\">A<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 8 · página 295<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Partir el cuerpo en piezas<\/span><\/div><p class=\"sub\">Los 32 cubos de la base · volumen total en m³<\/p><h3 style=\"color:#242478\">Un cubo primero, los 32 después<\/h3><p class=\"inst\">Las opciones vienen con explicación, y tres de ellas explican mal. Haz tu propia cuenta en dos pasos y después busca cuál opción coincide con lo que a ti te dio.<\/p><div class=\"clave\" hidden data-grupo=\"k37\"><span class=\"keychip\" style=\"background:#242478\">B<\/span> es la clave del libro<\/div><div class=\"aviso sev-baja\" hidden data-grupo=\"k37\"><b>Ojo con esta clave:<\/b> La B dice «se multiplican los volúmenes de 32 cubos»: se entiende el volumen de un cubo multiplicado por 32.<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k37\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante resuelva las preguntas del taller dejando registro escrito de su razonamiento antes de marcar la respuesta.", "decir": ["«Antes de marcar: ¿qué escribieron en el instrumento? Léanme la cuenta.»", "Si alguien se traba, pregúntale en qué casilla del instrumento se quedó. No le des la respuesta: devuélvelo a su hoja."], "como": "No da respuestas. Si un estudiante se traba, lo devuelve al paso a paso de su propia hoja y le pregunta en cuál de los pasos se quedó.", "apoyo": ["Las claves del libro son 7·A y 8·B. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 7 · clave A. Cómo se llega: La vitrina mide 100 cm y la muñeca 40: tiene que empezar a 60 cm o menos. Sin los prismas del nivel 3, la cima queda a 60 cm y la muñeca llega justo a 100. Las otras opciones suben la pirámide o desarman la base.", "Pregunta 8 · clave B. Cómo se llega: Un cubo: 0,2 × 0,2 × 0,2 = 0,008 m³; 32 cubos: 0,256 m³. La opción dice «se multiplican los volúmenes de 32 cubos»: se entiende el volumen de un cubo multiplicado por 32.", "Pregunta 8 · aviso del libro (baja): La opción correcta dice «se multiplican los volúmenes de 32 cubos». Qué haces: Redacción imprecisa: es un cubo y después los 32. Léela corrigiendo en voz alta."]}}, {"m": 2, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#C9821B\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 4 · Antes de mover, mide<\/span><\/div><h2>La torre piso por piso<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Se arma una torre con vasos o cajas, de a un piso por turno.<\/li><li>Antes de poner su piso, el estudiante dice en voz alta la medida que se acumula.<\/li><li>Si pone el piso sin decir la medida, la torre se devuelve al piso anterior.<\/li><li>Al llegar al tope se pregunta: ¿cuánto falta para el techo y de dónde puede salir?<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Vasos o cajas iguales · metro · espacio vertical<\/p><h3 class=\"mt\">Qué entrena<\/h3><p>Medir antes de mover, y acumular la medida piso por piso. Es el movimiento de las preguntas 6, 7 y 10.<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante resuelva las preguntas del taller dejando registro escrito de su razonamiento antes de marcar la respuesta.", "decir": ["«Esto no es recreo: es el mismo movimiento que van a hacer con la pregunta en cinco minutos, pero con el cuerpo.»"], "como": "No da respuestas. Si un estudiante se traba, lo devuelve al paso a paso de su propia hoja y le pregunta en cuál de los pasos se quedó.", "apoyo": ["Qué movimiento mental entrena: Medir antes de mover, y acumular la medida piso por piso. Es el movimiento de las preguntas 6, 7 y 10.", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase.", "Es la dinámica de la estrategia 4 del cuaderno, «Antes de mover, mide». Al terminar, di el nombre en voz alta: es el mismo que el estudiante ve en el chip de su hoja."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 9 y 10<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 9 y 10: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 9 · página 295<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Partir el cuerpo en piezas<\/span><\/div><p class=\"sub\">Un prisma frente a un cubo de la base<\/p><h3 style=\"color:#242478\">Pártelo con la vista, compruébalo con la cuenta<\/h3><p class=\"inst\">Las dos piezas tienen 20 cm en dos de sus lados; solo cambia la tercera. Dibuja la raya que parte el prisma en cubos y después confirma con números que no te engañó el ojo.<\/p><div class=\"clave\" hidden data-grupo=\"k39\"><span class=\"keychip\" style=\"background:#242478\">D<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 10 · página 295<\/span><span class=\"min\" style=\"--accent:#C9821B\">E4 · Antes de mover, mide<\/span><\/div><p class=\"sub\">Tetris · completar las dos últimas filas<\/p><h3 style=\"color:#C9821B\">Cuenta antes de encajar<\/h3><p class=\"inst\">Antes de imaginar giros y encajes, cuenta. Si las casillas que tienes no son las mismas que los huecos que hay, ninguna manera de girar las piezas va a servir.<\/p><div class=\"clave\" hidden data-grupo=\"k39\"><span class=\"keychip\" style=\"background:#C9821B\">C<\/span> es la clave del libro<\/div><div class=\"aviso sev-alta\" hidden data-grupo=\"k39\"><b>Ojo con esta clave:<\/b> En la figura hay 7 casillas vacías, no 14. «No es posible» sigue siendo cierto, pero la razón que da la C no coincide con la figura.<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k39\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante resuelva las preguntas del taller dejando registro escrito de su razonamiento antes de marcar la respuesta.", "decir": ["«Antes de marcar: ¿qué escribieron en el instrumento? Léanme la cuenta.»", "Si alguien se traba, pregúntale en qué casilla del instrumento se quedó. No le des la respuesta: devuélvelo a su hoja."], "como": "No da respuestas. Si un estudiante se traba, lo devuelve al paso a paso de su propia hoja y le pregunta en cuál de los pasos se quedó.", "apoyo": ["Las claves del libro son 9·D y 10·C. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 9 · clave D. Cómo se llega: Prisma: 40 × 20 × 20 = 16.000 cm³; cubo: 20 × 20 × 20 = 8.000 cm³. El prisma son 2 cubos: se ve partiendo su largo de 40 en dos de 20.", "Pregunta 10 · clave C. Cómo se llega: Las tres piezas cubren 4 + 4 + 4 = 12 casillas. En la figura del libro hay 7 casillas vacías, no 14 como dice la C. «No es posible» es cierto (12 no es 7), pero la razón de la C usa un número que la figura no muestra. La clave del libro es la C.", "Pregunta 10 · aviso del libro (alta): La figura tiene 7 casillas vacías y la opción correcta afirma que hay 14. Qué haces: Ninguna opción coincide con la figura. Que cuenten las casillas ellos mismos y escriban qué no les cuadró: el cuaderno les deja el renglón para eso."]}}, {"m": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m4)\">Reto en equipo · 20 min<\/span><span class=\"kicker\">Equipos de tres · cada uno responde en su cuaderno<\/span><\/div><h2>Reto del corte: Cabe, no cabe y por qué<\/h2><div class=\"card big edge mt\" style=\"--accent:var(--m4)\"><p class=\"lead\">Cada equipo recibe un cuerpo compuesto dibujado y un espacio donde debería caber. En doce minutos deben partir el cuerpo en piezas medibles, calcular lo que ocupa y decidir si cabe. La decisión no basta: tienen que nombrar cuál de las tres dimensiones es la que decide. Gana el equipo que identifique la dimensión crítica, aunque el cálculo le quede largo.<\/p><\/div><div class=\"note mt\" style=\"--accent:var(--m4)\"><b>La defensa:<\/b> tres minutos por equipo, citando un dato o una cuenta. «Porque se ve así» no cuenta.<\/div>", "guia": {"obj": "Que el estudiante contraste su razonamiento con el de otros y defienda su elección con datos, sin que el equipo reemplace su registro individual.", "decir": ["Arma equipos de tres y entrega el reto del corte de este momento.", "Exige que cada integrante llegue con su cuaderno YA diligenciado individualmente.", "Da tres minutos de defensa por equipo: deben citar un dato, no una opinión.", "Cierra señalando en qué se parecían los razonamientos y en qué no."], "como": "El equipo discute, pero cada uno responde en SU cuaderno. Si un equipo entrega una sola respuesta colectiva, el reto no cuenta: el producto es individual, la discusión es compartida.", "apoyo": ["El reto es el del planeador (banco de dinámicas, hoja de la misión 3): Cada equipo recibe un cuerpo compuesto dibujado y un espacio donde debería caber. En doce minutos deben partir el cuerpo en piezas medibles, calcular lo que ocupa y decidir si cabe. La decisión no basta: tienen que nombrar cuál de las tres dimensiones es la que decide. Gana el equipo que identifique la dimensión crítica, aunque el cálculo le quede largo.", "El reto se gana con el dato que sostiene la decisión, no con llegar primero. Si dos equipos llegan a respuestas distintas bien sostenidas, dilo: también es hacer matemáticas.", "Si un equipo entrega una sola hoja para los tres, el reto no cuenta. La discusión es compartida; el registro es individual.", "Cierra señalando en qué se parecían los razonamientos y en qué no."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 1<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Partir el cuerpo en piezas<\/span><\/div><div class=\"grid c2 icfes mt\"><div><p class=\"enun\">Para preparar una mezcla de cemento y arena, se debe calcular el volumen de la zona por construir (alto × largo × ancho), y posteriormente calcular la cantidad de cemento y arena por utilizar. La tabla muestra la cantidad necesaria para preparar un metro cúbico de mezcla, según su aplicación. De acuerdo con la información anterior, ¿qué cantidad de mezcla se requiere para construir un muro de dimensiones 3 m × 2 m × 0,5 m?<\/p><div class=\"lado\"><div class=\"fig\"><svg viewBox=\"0 0 330 225\" role=\"img\" aria-label=\"Muro de 3 m × 2 m × 0,5 m\" style=\"max-height:min(230px,34vh)\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"50.0,190.0 230.0,190.0 230.0,70.0 50.0,70.0\" fill=\"#EEF3FA\" stroke=\"#A82424\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"230.0,190.0 263.0,166.0 263.0,46.0 230.0,70.0\" fill=\"#E1E9F4\" stroke=\"#A82424\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"50.0,70.0 230.0,70.0 263.0,46.0 83.0,46.0\" fill=\"#F4F7FB\" stroke=\"#A82424\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"140.0\" y=\"216.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">3 m de largo<\/text><text x=\"40.0\" y=\"130.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"end\" font-weight=\"700\">2 m<\/text><text x=\"40.0\" y=\"148.0\" font-size=\"13\" fill=\"#5C6472\" text-anchor=\"end\" font-weight=\"400\">de alto<\/text><text x=\"271.0\" y=\"50.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"start\" font-weight=\"700\">0,5 m<\/text><text x=\"271.0\" y=\"68.0\" font-size=\"13\" fill=\"#5C6472\" text-anchor=\"start\" font-weight=\"400\">de ancho<\/text><\/svg><\/div><table class=\"dat\"><tr><th>Aplicación<\/th><th>Cemento (kg)<\/th><th>Arena (kg)<\/th><\/tr><tr><td>Pisos<\/td><td>35<\/td><td>70<\/td><\/tr><tr><td>Techos<\/td><td>30<\/td><td>90<\/td><\/tr><tr><td>Muros<\/td><td>25<\/td><td>75<\/td><\/tr><tr><td>Revestimientos<\/td><td>20<\/td><td>100<\/td><\/tr><\/table><p class=\"sub nota\">Cantidad necesaria para preparar un metro cúbico de mezcla.<\/p><\/div><\/div><div><div class=\"ops\" id=\"icf31\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>105 kg de cemento y 210 kg de arena.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>90 kg de cemento y 270 kg de arena.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>75 kg de cemento y 225 kg de arena.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>60 kg de cemento y 300 kg de arena.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf31\" data-k=\"C\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia aprendida a preguntas tipo Saber 11, sin acompañamiento del docente ni de sus compañeros.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué cuenta escribiste antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento del encuentro. Si un estudiante marca sin llenar la columna, se le anota, no se le corrige.", "apoyo": ["La clave es la C. Cómo se llega: Volumen: 3 × 2 × 0,5 = 3 m³. Fila «Muros»: 25 kg de cemento y 75 de arena por m³ → 75 kg y 225 kg. Las otras son la misma cuenta con la fila de pisos, techos o revestimientos.", "En el cuaderno la trabajan con el instrumento «Primero el cuerpo, después la fila correcta» (estrategia 1 · Partir el cuerpo en piezas)."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 2<\/span><span class=\"min\" style=\"--accent:#A82424\">E2 · La misma razón para los dos<\/span><\/div><div class=\"grid c2 icfes mt\"><div><p class=\"enun\">Las sombras proyectadas por dos postes paralelos de 10 metros y 5 metros se muestran en la figura. El ángulo entre la acera horizontal y la sombra del poste 1 es α = 30°. De acuerdo con esto, se puede afirmar que el ángulo entre la acera horizontal y la sombra del poste 2 es<\/p><div class=\"fig\"><svg viewBox=\"0 0 720 225\" role=\"img\" aria-label=\"Dos postes de 10 m y 5 m y sus sombras\" style=\"max-height:min(230px,34vh)\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"30.0\" y1=\"150.0\" x2=\"690.0\" y2=\"150.0\" stroke=\"#1B1F27\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"150.0\" y1=\"150.0\" x2=\"150.0\" y2=\"50.0\" stroke=\"#1B1F27\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"150\" cy=\"50\" r=\"7\" fill=\"#1B1F27\"/><text x=\"138.0\" y=\"100.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"end\" font-weight=\"700\">10 m<\/text><line x1=\"150.0\" y1=\"150.0\" x2=\"289.1\" y2=\"206.2\" stroke=\"#1B1F27\" stroke-width=\"2\" stroke-linecap=\"round\"/><path d=\"M 184 150 A 34 34 0 0 1 181.5 162.7\" fill=\"none\" stroke=\"#A82424\" stroke-width=\"2\"/><text x=\"180.0\" y=\"202.0\" font-size=\"16\" fill=\"#A82424\" text-anchor=\"start\" font-weight=\"700\">α = 30°<\/text><line x1=\"470.0\" y1=\"150.0\" x2=\"470.0\" y2=\"100.0\" stroke=\"#1B1F27\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"470\" cy=\"100\" r=\"7\" fill=\"#1B1F27\"/><text x=\"458.0\" y=\"125.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"end\" font-weight=\"700\">5 m<\/text><line x1=\"470.0\" y1=\"150.0\" x2=\"539.5\" y2=\"178.1\" stroke=\"#1B1F27\" stroke-width=\"2\" stroke-linecap=\"round\"/><path d=\"M 504 150 A 34 34 0 0 1 501.5 162.7\" fill=\"none\" stroke=\"#B0711A\" stroke-width=\"2\"/><text x=\"500.0\" y=\"202.0\" font-size=\"16\" fill=\"#B0711A\" text-anchor=\"start\" font-weight=\"700\">β = ¿?<\/text><text x=\"150.0\" y=\"38.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">Poste 1<\/text><text x=\"470.0\" y=\"88.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">Poste 2<\/text><text x=\"690.0\" y=\"142.0\" font-size=\"13\" fill=\"#5C6472\" text-anchor=\"end\" font-weight=\"400\" font-style=\"italic\">acera<\/text><\/svg><\/div><\/div><div><div class=\"ops c2\" id=\"icf32\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>β = 5°<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>β = 15°<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>β = 30°<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>β = 60°<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf32\" data-k=\"C\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia aprendida a preguntas tipo Saber 11, sin acompañamiento del docente ni de sus compañeros.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué cuenta escribiste antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento del encuentro. Si un estudiante marca sin llenar la columna, se le anota, no se le corrige.", "apoyo": ["La clave es la C. Cómo se llega: Los rayos del sol llegan paralelos: el ángulo de la sombra con la acera es el mismo para los dos postes, 30°. La altura cambia el tamaño de la sombra, no su dirección.", "En el cuaderno la trabajan con el instrumento «Qué cambia y qué no cambia entre los dos» (estrategia 2 · La misma razón para los dos)."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 3<\/span><span class=\"min\" style=\"--accent:#30843C\">E3 · Cuántas veces cabe<\/span><\/div><div class=\"grid c2 icfes mt\"><div><p class=\"enun\">Cuatro locales cuadrados p, q, r y s, con medidas iguales, se instalaron alrededor de una fuente circular. Por comodidad para los turistas, se planea situar cinco bancas de forma que: cada una tenga 2 m de longitud; quedarán una seguida de la otra, entre los locales p y r; formarán una línea paralela al borde izquierdo del terreno; y mantendrán un espacio libre para paso entre las bancas y los locales. Este plan<\/p><div class=\"fig\"><svg viewBox=\"0 0 540 300\" role=\"img\" aria-label=\"Plano: cuatro locales cuadrados alrededor de una fuente\" style=\"max-height:min(260px,34vh)\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"20\" y=\"10\" width=\"330\" height=\"280\" rx=\"6\" fill=\"#FAFBFD\" stroke=\"#5C6472\" stroke-width=\"1.5\"/><rect x=\"70\" y=\"30\" width=\"80\" height=\"80\" rx=\"4\" fill=\"#EEF3FA\" stroke=\"#A82424\" stroke-width=\"2\"/><text x=\"80.0\" y=\"52.0\" font-size=\"17\" fill=\"#A82424\" text-anchor=\"start\" font-weight=\"700\" font-style=\"italic\">p<\/text><rect x=\"230\" y=\"30\" width=\"80\" height=\"80\" rx=\"4\" fill=\"#EEF3FA\" stroke=\"#A82424\" stroke-width=\"2\"/><text x=\"240.0\" y=\"52.0\" font-size=\"17\" fill=\"#A82424\" text-anchor=\"start\" font-weight=\"700\" font-style=\"italic\">q<\/text><rect x=\"70\" y=\"190\" width=\"80\" height=\"80\" rx=\"4\" fill=\"#EEF3FA\" stroke=\"#A82424\" stroke-width=\"2\"/><text x=\"80.0\" y=\"212.0\" font-size=\"17\" fill=\"#A82424\" text-anchor=\"start\" font-weight=\"700\" font-style=\"italic\">r<\/text><rect x=\"230\" y=\"190\" width=\"80\" height=\"80\" rx=\"4\" fill=\"#EEF3FA\" stroke=\"#A82424\" stroke-width=\"2\"/><text x=\"240.0\" y=\"212.0\" font-size=\"17\" fill=\"#A82424\" text-anchor=\"start\" font-weight=\"700\" font-style=\"italic\">s<\/text><circle cx=\"190\" cy=\"150\" r=\"24\" fill=\"#D4D9E0\" stroke=\"#5C6472\" stroke-width=\"1.5\"/><text x=\"190.0\" y=\"192.0\" font-size=\"13\" fill=\"#5C6472\" text-anchor=\"middle\" font-weight=\"400\" font-style=\"italic\">fuente<\/text><line x1=\"52.0\" y1=\"110.0\" x2=\"52.0\" y2=\"190.0\" stroke=\"#2E7A39\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"44.0\" y1=\"110.0\" x2=\"60.0\" y2=\"110.0\" stroke=\"#2E7A39\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"44.0\" y1=\"190.0\" x2=\"60.0\" y2=\"190.0\" stroke=\"#2E7A39\" stroke-width=\"2\" stroke-linecap=\"round\"/><text x=\"36\" y=\"150\" font-size=\"15\" font-weight=\"700\" fill=\"#2E7A39\" text-anchor=\"middle\" transform=\"rotate(-90 36 150)\">10 m<\/text><text x=\"370.0\" y=\"130.0\" font-size=\"14\" fill=\"#5C6472\" text-anchor=\"start\" font-weight=\"400\" font-style=\"italic\">entre los locales p y r<\/text><text x=\"370.0\" y=\"150.0\" font-size=\"14\" fill=\"#5C6472\" text-anchor=\"start\" font-weight=\"400\" font-style=\"italic\">hay 10 m<\/text><\/svg><\/div><\/div><div><div class=\"ops\" id=\"icf33\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>es posible implementarlo, porque la longitud del lado del terreno es mayor que la medida total de las bancas.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>es posible implementarlo, porque el espacio entre los locales es suficiente para ubicar las cinco bancas.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>no es posible implementarlo, porque se debería tener la información sobre la distancia entre las bancas y los locales.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>no es posible implementarlo, porque la medida total de las cinco bancas es igual a la distancia entre los locales.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf33\" data-k=\"D\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia aprendida a preguntas tipo Saber 11, sin acompañamiento del docente ni de sus compañeros.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué cuenta escribiste antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento del encuentro. Si un estudiante marca sin llenar la columna, se le anota, no se le corrige.", "apoyo": ["La clave es la D. Cómo se llega: Cinco bancas de 2 m = 10 m, lo mismo que hay entre p y r. Caben justas, pero no queda espacio libre para pasar, que es una de las condiciones del plan.", "En el cuaderno la trabajan con el instrumento «Mide el hueco y mide lo que vas a meter» (estrategia 3 · Cuántas veces cabe)."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 4<\/span><span class=\"min\" style=\"--accent:#C9821B\">E4 · Antes de mover, mide<\/span><\/div><div class=\"grid c2 icfes mt\"><div><p class=\"enun\">Una persona elabora una vela en forma de cubo, de lado 2 cm, y coloca una cinta, que le cuesta $ x, alrededor de la vela. Cuando le encargan una vela en forma de cubo de lado 4 cm, él calcula correctamente que necesita multiplicar por 8 la cantidad de cera que debe usar, pero calcula incorrectamente que el precio de la cinta será $ 8x. ¿Cuál es el precio correcto de la cinta y por qué?<\/p><div class=\"fig\"><svg viewBox=\"0 0 560 230\" role=\"img\" aria-label=\"Vela en cubo de lado 2 cm y de lado 4 cm, con la cinta alrededor\" style=\"max-height:min(230px,34vh)\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"60.0,190.0 130.0,190.0 130.0,120.0 60.0,120.0\" fill=\"#F4F7FB\" stroke=\"#A82424\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"130.0,190.0 159.4,167.6 159.4,97.6 130.0,120.0\" fill=\"#E6ECF5\" stroke=\"#A82424\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"60.0,120.0 130.0,120.0 159.4,97.6 89.4,97.6\" fill=\"#FAFBFD\" stroke=\"#A82424\" stroke-width=\"2\" stroke-linejoin=\"round\"/><rect x=\"60\" y=\"146.6\" width=\"70\" height=\"14.0\" fill=\"#E3B65A\"/><polygon points=\"130.0,146.6 159.4,124.2 159.4,138.2 130.0,160.6\" fill=\"#D6A748\" stroke=\"#D6A748\" stroke-width=\"1\" stroke-linejoin=\"round\"/><polygon points=\"340.0,190.0 480.0,190.0 480.0,50.0 340.0,50.0\" fill=\"#F4F7FB\" stroke=\"#A82424\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"480.0,190.0 538.8,145.2 538.8,5.2 480.0,50.0\" fill=\"#E6ECF5\" stroke=\"#A82424\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polygon points=\"340.0,50.0 480.0,50.0 538.8,5.2 398.8,5.2\" fill=\"#FAFBFD\" stroke=\"#A82424\" stroke-width=\"2\" stroke-linejoin=\"round\"/><rect x=\"340\" y=\"103.2\" width=\"140\" height=\"28.0\" fill=\"#E3B65A\"/><polygon points=\"480.0,103.2 538.8,58.4 538.8,86.4 480.0,131.2\" fill=\"#D6A748\" stroke=\"#D6A748\" stroke-width=\"1\" stroke-linejoin=\"round\"/><text x=\"95.0\" y=\"216.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">lado 2 cm<\/text><text x=\"410.0\" y=\"216.0\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">lado 4 cm<\/text><line x1=\"200.0\" y1=\"130.0\" x2=\"260.0\" y2=\"130.0\" stroke=\"#5C6472\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"260.0,130.0 250.0,124.0 250.0,136.0\" fill=\"#5C6472\" stroke=\"#5C6472\" stroke-width=\"1\" stroke-linejoin=\"round\"/><text x=\"20.0\" y=\"26.0\" font-size=\"14\" fill=\"#5C6472\" text-anchor=\"start\" font-weight=\"400\" font-style=\"italic\">la cinta rodea la vela por el contorno<\/text><\/svg><\/div><\/div><div><div class=\"ops\" id=\"icf34\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>$ 2x; porque hay exactamente dos caras que la cinta no abarca.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>$ 4x; porque son cuatro caras que la cinta cubre y todas aumentan.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>$ 2x; porque la cinta solo aumenta su longitud y en la nueva vela dicha longitud se duplica.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>$ 4x; porque la cantidad de cera aumenta 8 veces y el lado 2 veces, y por tanto la cinta aumenta 8 ÷ 2 = 4 veces.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf34\" data-k=\"C\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia aprendida a preguntas tipo Saber 11, sin acompañamiento del docente ni de sus compañeros.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué cuenta escribiste antes de mirar las opciones?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento del encuentro. Si un estudiante marca sin llenar la columna, se le anota, no se le corrige.", "apoyo": ["La clave es la C. Cómo se llega: La cinta rodea el contorno: es una longitud. Si el lado pasa de 2 a 4 cm, el contorno se duplica y la cinta cuesta 2x. La cera es un volumen: esa sí se multiplica por 8.", "En el cuaderno la trabajan con el instrumento «Cada cosa crece a su manera» (estrategia 4 · Antes de mover, mide)."]}}, {"m": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m6)\">Cierre<\/span><span class=\"kicker\">La pregunta de siempre<\/span><\/div><h2>¿En qué se parecía la pregunta Saber 11 a la de tu libro?<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:#242478\"><div class=\"k\">1<\/div><div><b>Partir el cuerpo en piezas<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#A82424\"><div class=\"k\">2<\/div><div><b>La misma razón para los dos<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#30843C\"><div class=\"k\">3<\/div><div><b>Cuántas veces cabe<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#C9821B\"><div class=\"k\">4<\/div><div><b>Antes de mover, mide<\/b><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--m6)\"><h3>Antes de salir<\/h3><ol class=\"pasos\"><li>La palabra que te frenó hoy, en «Palabras que me frenaron», con tus palabras.<\/li><li>«Lo que me llevo de esta pregunta».<\/li><li>Tu carita de salida.<\/li><li>La casilla 3 de la portada del área.<\/li><\/ol><\/div><\/div>", "guia": {"obj": "Que el estudiante verbalice qué tienen en común la pregunta del libro y la de entrenamiento, y nombre la estrategia que usó para resolverlas.", "decir": ["Socializa solo las preguntas que el grupo falló, con dos o tres respuestas del salón.", "Pide que lean en voz alta su salvavidas: la ruta mínima que los habría salvado.", "Cierra nombrando la estrategia y anunciando en qué momento vuelve a aparecer."], "como": "No dicta la conclusión. Si nadie la escribe en sus palabras, la clase no cerró: vale más dejar una pregunta sin socializar que dictar el resumen.", "apoyo": ["Pide que dos o tres lean en voz alta su salvavidas: la ruta mínima que los habría salvado en la pregunta que fallaron.", "La palabra nueva no se dicta. Si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase: es mejor que dictarla bien.", "Para el cierre del momento: «Cuántas veces cabe» no es dividir volúmenes a ciegas: hay que medir el hueco y medir lo que se va a meter, y comprobar que encaje en las tres dimensiones."]}}];
var MOM = [{"n": 1, "nom": "Activación", "min": 15, "c": "--m1"}, {"n": 2, "nom": "Pregunta problematizadora", "min": 20, "c": "--m2"}, {"n": 3, "nom": "Desarrollo guiado", "min": 35, "c": "--m3"}, {"n": 4, "nom": "Reto en equipo", "min": 20, "c": "--m4"}, {"n": 5, "nom": "Evaluación individual", "min": 20, "c": "--m5"}, {"n": 6, "nom": "Cierre", "min": 10, "c": "--m6"}];
var NOMBRE = document.getElementById("momnom").textContent, SUB = document.getElementById("momsub").textContent;
var $ = function(s){ return document.querySelector(s); };
var wrap = $("#wrap"), stage = $("#stage"), i = 0;
var tBase = 0, tLeft = 0, tOn = false, tick = null;
var elegidas = [];
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function paintClock(){
  var n = $("#tnum");
  if(!tBase){ n.textContent = "—"; n.classList.remove("over"); return; }
  var s = Math.abs(tLeft), mm = Math.floor(s/60), ss = s%60;
  n.textContent = (tLeft<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", tLeft<0);
}
function setTimer(min){
  tBase = min||0; tLeft = tBase*60; tOn = false;
  if(tick){ clearInterval(tick); tick = null; }
  $("#play").textContent = "Iniciar"; paintClock();
}
function toggleTimer(){
  if(!tBase) return;
  tOn = !tOn; $("#play").textContent = tOn ? "Pausar" : "Seguir";
  if(tick){ clearInterval(tick); tick = null; }
  if(tOn) tick = setInterval(function(){ tLeft--; paintClock(); }, 1000);
  paintClock();
}
function guiaHTML(g){
  if(!g) return '<p class="sub">Sin notas para esta diapositiva.</p>';
  var h = '<div class="gbox"><h4>Objetivo</h4><p>'+esc(g.obj)+'</p></div>';
  if(g.decir && g.decir.length) h += '<div class="gbox"><h4>Qué haces y qué dices</h4><ul>'+
     g.decir.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  if(g.como) h += '<div class="gbox como"><h4>Lo que no haces</h4><p>'+esc(g.como)+'</p></div>';
  if(g.apoyo && g.apoyo.length) h += '<div class="gbox apoyo"><h4>Si Matemáticas no es tu fuerte</h4><ul>'+
     g.apoyo.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  return h;
}
function pintaElegidas(){
  var box = document.getElementById("elegidas"); if(!box) return;
  if(!elegidas.length){ box.innerHTML = '<p class="sub">Vuelve a la diapositiva anterior y escoge las cinco.</p>'; return; }
  box.innerHTML = elegidas.map(function(t,k){
    return '<div class="card edge" style="--accent:var(--m'+((k%6)+1)+')"><h3>'+(k+1)+'. '+esc(t)+'</h3>'+
      '<p class="sub">Busca esta pregunta en tu simulacro y en la hoja de taller de la misma estrategia.</p></div>';
  }).join("");
}
function go(n){
  var prev = SC[i];
  i = Math.max(0, Math.min(SC.length-1, n));
  var s = SC[i];
  wrap.innerHTML = s.html;
  wrap.classList.remove("enter"); void wrap.offsetWidth; wrap.classList.add("enter");
  stage.scrollTop = 0;
  var m = s.m!=null ? MOM[s.m] : null;
  $("#momdot").style.background = m ? "var("+m.c+")" : "var(--faint)";
  $("#momdot").textContent = m ? m.n : "·";
  $("#momnom").textContent = m ? m.nom : NOMBRE;
  $("#momsub").textContent = m ? (m.min+" minutos") : SUB;
  var want = s.min!=null ? s.min : (m ? m.min : 0);
  var cambio = !prev || prev===s || prev.m!==s.m || (prev.min||null)!==(s.min||null);
  if(cambio) setTimer(want);
  $("#count").textContent = (i+1)+" / "+SC.length;
  $("#prog i").style.width = (SC.length>1 ? i/(SC.length-1)*100 : 100)+"%";
  $("#guiabody").innerHTML = guiaHTML(s.guia);
  [].forEach.call(wrap.querySelectorAll("[data-pick]"), function(b){
    b.setAttribute("aria-pressed", elegidas.indexOf(b.textContent)>=0 ? "true" : "false"); });
  pintaElegidas();
}
wrap.addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.dataset.show){ var t = document.getElementById(b.dataset.show); if(t) t.hidden = !t.hidden; }
  if(b.dataset.showgrupo){
    var g = wrap.querySelectorAll('[data-grupo="'+b.dataset.showgrupo+'"]'), abrir = g.length && g[0].hidden;
    [].forEach.call(g, function(x){ x.hidden = !abrir; });
    b.textContent = abrir ? "Ocultar las claves" : "Revelar las claves";
  }
  if(b.dataset.clave){
    var box = document.getElementById(b.dataset.clave), ok = box.querySelector('[data-op="'+b.dataset.k+'"]');
    var on = ok && !ok.classList.contains("ok");
    [].forEach.call(box.querySelectorAll(".op"), function(o){ o.classList.remove("ok"); });
    if(on) ok.classList.add("ok");
    b.textContent = on ? "Ocultar la clave" : "Revelar la clave";
  }
  if(b.dataset.tally){ var n = document.getElementById(b.dataset.tally); n.textContent = (+n.textContent||0)+1; }
  if(b.dataset.reset){ [].forEach.call(wrap.querySelectorAll('[id^="'+b.dataset.reset+'"]'), function(x){
    if(x.classList.contains("n")) x.textContent = "0"; }); }
  if(b.dataset.pick!=null){
    var t = b.textContent, k = elegidas.indexOf(t);
    if(k>=0) elegidas.splice(k,1); else if(elegidas.length<5) elegidas.push(t);
    b.setAttribute("aria-pressed", elegidas.indexOf(t)>=0 ? "true" : "false");
  }
});
function setGuia(on){ $("#guia").classList.toggle("open", on); $("#scrim").classList.toggle("on", on);
  $("#gbtn").setAttribute("aria-pressed", on ? "true" : "false"); }
$("#next").addEventListener("click", function(){ go(i+1); });
$("#prev").addEventListener("click", function(){ go(i-1); });
$("#play").addEventListener("click", toggleTimer);
$("#reset").addEventListener("click", function(){ setTimer(tBase); });
$("#gbtn").addEventListener("click", function(){ setGuia(!$("#guia").classList.contains("open")); });
$("#gclose").addEventListener("click", function(){ setGuia(false); });
$("#scrim").addEventListener("click", function(){ setGuia(false); });
document.addEventListener("keydown", function(e){
  var t = e.target.tagName; if(t==="INPUT"||t==="TEXTAREA") return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ go(i+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ go(i-1); e.preventDefault(); }
  else if(e.key==="Home"){ go(0); e.preventDefault(); }
  else if(e.key==="End"){ go(SC.length-1); e.preventDefault(); }
  else if(e.key==="g"||e.key==="G"){ setGuia(!$("#guia").classList.contains("open")); }
  else if(e.key==="t"||e.key==="T"){ toggleTimer(); }
  else if(e.key==="Escape"){ setGuia(false); }
});
go(0);
})();
</script>
</body>
</html>
