<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Química · Clase 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>[hidden]{display:none!important}
:root{
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --text:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --area:#0F7A68; --azul:#1F4E8C; --oro:#B0711A; --morado:#5B3E96; --verde:#2E7A39;
  --m1:#0F7A68; --m2:#1F4E8C; --m3:#3B3BA6; --m4:#5B3E96; --m5:#A82424; --m6:#4A5A70; --rojo:#A82424;
  --ink:#1B1F27; --muted:#5C6472; --faint:#A9B0BB; --line:#E3E7ED; --paper:#FFFFFF; --bg:#F6F4F1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:clamp(16px,1.25vw,21px);line-height:1.5}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
#top{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding:10px clamp(14px,2vw,28px);background:var(--paper);flex-wrap:wrap}
.logo img{height:clamp(28px,2.6vw,40px);display:block}
#mom{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
#momdot{width:clamp(30px,2.4vw,40px);height:clamp(30px,2.4vw,40px);border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;background:var(--faint)}
#momnom{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.2vw,20px)}
#momsub{color:var(--muted);font-size:.85em}
#clock{display:flex;align-items:center;gap:8px}
#tnum{font-family:var(--display);font-weight:800;font-size:clamp(20px,1.8vw,30px);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
#tnum.over{color:var(--area)}
.btn{appearance:none;font:inherit;font-size:.86em;font-weight:600;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.solid{background:var(--area);border-color:var(--area);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#stage{overflow:auto;padding:clamp(18px,3vw,48px) clamp(16px,4vw,72px)}
#wrap{max-width:1500px;margin:0 auto}
#wrap.enter{animation:ent .28s ease-out}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bot{display:flex;align-items:center;gap:12px;padding:10px clamp(14px,2vw,28px);background:var(--paper)}
#prog{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
#prog i{display:block;height:100%;background:var(--area);transition:width .25s}
#count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
#hint{color:var(--faint);font-size:.8em}
@media (max-width:760px){#hint{display:none}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.2vw,68px);line-height:1.05;margin:.2em 0 .25em;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,2.8vw,46px);line-height:1.1;margin:.25em 0 .3em;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:clamp(18px,1.5vw,26px);margin:.1em 0 .4em;line-height:1.2}
p{margin:.35em 0 .6em}
.lead{font-size:1.2em;line-height:1.45;max-width:70ch}
.sub{color:var(--muted)}
.mt{margin-top:clamp(14px,1.8vw,26px)}
.logo-xl img{height:clamp(54px,6vw,96px);margin-bottom:12px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tag,.min,.membrete{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.78em;font-weight:700;letter-spacing:.02em}
.tag{background:var(--ink);color:#fff}
.min{background:var(--accent,var(--area));color:#fff}
.membrete{border:1.5px solid var(--line);color:var(--muted)}
.kicker{color:var(--muted);font-size:.85em;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.grid{display:grid;gap:clamp(12px,1.4vw,22px)}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid>*{min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,1.6vw,24px)}
.card.edge{border-left:6px solid var(--accent,var(--area))}
.card.big .lead{font-size:1.3em}
.step{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px}
.step .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;flex:none}
.note{border-left:5px solid var(--accent,var(--area));background:var(--paper);border-radius:10px;padding:10px 16px;margin-top:12px}
.cita{font-family:var(--display);font-weight:600;line-height:1.35;background:var(--paper);border-left:6px solid var(--area);border-radius:12px;padding:clamp(16px,2vw,30px);margin:18px 0}
.cita.xl{font-size:clamp(24px,2.6vw,44px)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally .n{display:inline-block;min-width:1.6em;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.pasos{margin:.2em 0 0;padding-left:1.3em}.pasos li{margin:.3em 0}
.sello{margin-top:12px;border:2px dashed var(--oro);border-radius:12px;padding:10px 14px;background:#FDF6EA}
.sello b{display:block;color:var(--oro);font-size:.8em;letter-spacing:.06em;text-transform:uppercase}
.clave{margin-top:12px;display:flex;align-items:center;gap:10px;font-weight:600}
.keychip{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:10px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.2em}
.aviso{margin-top:10px;border-radius:10px;padding:10px 14px;background:#FBEFEF;border-left:5px solid var(--area);font-size:.92em}
.aviso.sev-aten{background:#EDF5EE;border-left-color:var(--verde)}
.aviso.sev-medi{background:#FDF5E7;border-left-color:var(--oro)}
.icfes .texto{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.6vw,24px);max-height:62vh;overflow:auto;font-size:.95em}
.enun{font-weight:600;font-size:1.08em}
.ops{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.op .L{flex:none;width:1.8em;height:1.8em;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-family:var(--display);font-weight:800}
.op.ok{border-color:var(--verde);background:#EDF5EE}.op.ok .L{background:var(--verde);color:#fff}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick[aria-pressed="true"]{background:var(--area);border-color:var(--area);color:#fff}
#scrim{position:fixed;inset:0;background:rgba(15,18,24,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#guia{position:fixed;top:0;right:0;height:100%;width:min(520px,92vw);background:var(--paper);box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column;z-index:10}
#guia.open{transform:none}
#guiahead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg)}
#guiabody{overflow:auto;padding:16px 20px 30px;font-size:.92em}
.gbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.gbox h4{margin:0 0 6px;font-family:var(--display);font-size:.8em;letter-spacing:.07em;text-transform:uppercase;color:var(--area)}
.gbox ul{margin:0;padding-left:1.1em}.gbox li{margin:.35em 0}
.gbox.como{background:#F6F7F9}.gbox.como h4{color:var(--muted)}
.gbox.apoyo{background:#FDF6EA;border-color:#EAD9B4}.gbox.apoyo h4{color:var(--oro)}
[hidden]{display:none!important}
.fig{margin:12px 0}.fig svg{display:block;width:100%;max-width:760px;height:auto}
.tabla{border-collapse:collapse;width:100%;table-layout:fixed;font-size:.86em;line-height:1.35}
.tabla th,.tabla td{border:1px solid var(--line);padding:5px 8px;vertical-align:top;overflow-wrap:anywhere}
.tabla th{background:#EEF4F2;text-align:left}.tabla caption{text-align:left;font-weight:700;padding:0 0 6px}
.fig figcaption,.figcap{font-size:.85em;font-style:italic;margin-top:6px}
.ops.cuatro{grid-template-columns:repeat(4,1fr)}.opsfig svg{max-width:760px}
.aviso{border-left-color:var(--rojo)}.aviso.sev-baja{background:#EEF3FA;border-left-color:var(--azul)}
</style>
</head>

p class=\"sub\">Las diez preguntas de la prueba de campo, páginas 150 a 152<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m4)\"><h3>Tu cuaderno<\/h3><p class=\"sub\">Páginas 190 a 196<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m6)\"><h3>Hoy<\/h3><p class=\"sub\">120 minutos · 6 momentos · EF · calor, estados y densidad<\/p><\/div><\/div>", "guia": {"obj": "Que el grupo sepa desde el primer minuto qué va a pasar en estos 120 minutos y qué tiene que tener sobre la mesa.", "decir": ["«Libro abierto, cuaderno cerrado, lápiz. Hoy no les voy a preguntar fórmulas de memoria: les voy a preguntar qué número, con qué unidad, lo dice.»"], "apoyo": ["⚑ Antes del sábado: La gráfica de la pregunta 1 pone la meseta de Y en 200 °C y el texto dice 160 °C: se responde con el texto. La curva del tanque de la 3 sube mucho más de lo que predice la ley de los gases. Y la 10 no ofrece la causa principal de que la esfera suba —el empuje—: la clave A solo explica la rapidez.", "Seguridad: las dinámicas son con el cuerpo, tarjetas, cinta y clips; ninguna usa sustancias, fuego ni calor de verdad, y los retos se resuelven en papel. Si alguien propone hacer en el salón el experimento del libro, la respuesta es no.", "Los cuatro conceptos que tienes que poder explicar hoy en dos minutos, sin jerga. Si un estudiante sabe más que tú de un tema, déjalo explicar y pide que señale en el texto o en la tabla de dónde lo saca:", "Calor sensible y calor latente: Calor sensible: sube la temperatura (Q = m · c · ΔT). Calor latente: cambia el estado sin subir la temperatura (Q = m · L). Por eso la gráfica tiene una meseta: mientras la sustancia se funde, el termómetro no se mueve.", "Cambios de estado: Fusión: de sólido a líquido. Ebullición: de líquido a gas. Sublimación: de sólido a gas sin pasar por líquido, como el hielo seco. Cada sustancia pura tiene su temperatura fija de fusión y de ebullición.", "Partículas, temperatura y presión: La temperatura dice qué tan rápido se mueven las partículas. Si un gas encerrado se calienta, sus partículas chocan más fuerte y más seguido contra las paredes: sube la presión. Un objeto muy caliente le pasa calor rápido al aire; cuando la diferencia es poca, despacio.", "Densidad y flotación: Densidad = masa ÷ volumen (g/cm³). Lo menos denso flota sobre lo más denso: el hielo (0,92) sobre el agua (1,00), el acero (7,9) sobre el mercurio (13,6). Lo que empuja hacia arriba es el empuje del líquido.", "Abre esta guía con la tecla G en cada diapositiva: trae lo que dices y, debajo, lo que necesitas saber si Química no es tu área.", "El cronómetro arranca con T y se reinicia solo cuando cambia el momento de la clase."]}}, {"m": null, "html": "<div class=\"eyebrow\"><span class=\"kicker\">Así vamos a trabajar<\/span><\/div><h2>Seis momentos, una sola regla<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:var(--m1)\"><div class=\"k\">1<\/div><div><b>Activación<\/b><span class=\"sub\"> · 15 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m2)\"><div class=\"k\">2<\/div><div><b>Pregunta problematizadora<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m3)\"><div class=\"k\">3<\/div><div><b>Desarrollo guiado<\/b><span class=\"sub\"> · 35 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m4)\"><div class=\"k\">4<\/div><div><b>Reto en equipo<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m5)\"><div class=\"k\">5<\/div><div><b>Evaluación individual<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m6)\"><div class=\"k\">6<\/div><div><b>Cierre<\/b><span class=\"sub\"> · 10 min<\/span><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--area)\"><h3>La regla del cuaderno<\/h3><p class=\"lead\">Si el instrumento está vacío, no lo resolviste: lo adivinaste.<\/p><p>Primero se escribe el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas—, después se marca la opción. Una respuesta correcta con el instrumento en blanco no cuenta como resuelta.<\/p><\/div><\/div>", "guia": {"obj": "Que la regla quede dicha en voz alta antes de cualquier texto.", "decir": ["«La respuesta correcta con el instrumento vacío no cuenta. ¿Por qué? Porque en Química casi todas las opciones suenan técnicas: el que no escribió la cuenta escoge la que suena mejor, no la que dicen los números.»"], "apoyo": ["Si alguien pregunta para qué escribir, la respuesta corta es: lo que separa la opción correcta de las que suenan bien está en un número, una unidad o una fila de la tabla, y eso se pierde si no se escribe.", "Si alguien dice «es una reacción química» o «es por la presión», devuélvele la pregunta: «¿qué viste o qué mediste que te lo dice?»."]}}, {"m": 0, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Activación<\/span><span class=\"kicker\">Cuaderno cerrado<\/span><\/div><h2>¿Qué se observó, qué se midió y con qué unidad, y qué hacen las partículas?<\/h2><blockquote class=\"cita xl\">Una olla de agua hierve en una ciudad de montaña. Se sube el fuego y el termómetro sigue marcando lo mismo: unos 92 °C.<\/blockquote><p class=\"lead\">Tres respuestas antes de cualquier explicación. Todavía no se abre el cuaderno.<\/p><div class=\"ctl\"><button class=\"btn\" data-show=\"pista2\">Mostrar la pista<\/button><\/div><div class=\"note\" id=\"pista2\" hidden style=\"--accent:var(--m1)\"><b>Pista:<\/b> se observó que no subió; se midió en °C; el calor de más se gasta en volver vapor el agua, no en calentarla<\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno de todos los días con tres preguntas —qué se observó, qué se midió y con qué unidad, y qué hacen las partículas— antes de explicarlo y antes de ver cualquier opción.", "decir": ["Proyecta o lee una observación de dos o tres renglones sin decir de dónde salió.", "Pide tres respuestas, en voz alta o en el tablero: qué se observó, qué se midió y con qué unidad, y qué hacen las partículas.", "Ejecuta la dinámica de apertura según la estrategia del encuentro."], "como": "No explica el fenómeno ni acepta todavía explicaciones. Si alguien dice «es una reacción química», le devuelve la pregunta: «¿qué viste o qué mediste que te lo dice?». El cuaderno sigue cerrado.", "apoyo": ["No expliques el fenómeno ni aceptes todavía explicaciones: primero las tres respuestas. La observación es inventada para la clase: no sale del libro, y nada de ella se hace en el salón.", "La pista existe para el cierre de los 15 minutos, no para el principio: se observó que no subió; se midió en °C; el calor de más se gasta en volver vapor el agua, no en calentarla."]}}, {"m": 0, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#242478\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 1 · Donde la temperatura se queda quieta<\/span><\/div><h2>El termómetro humano<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Cuatro estudiantes tomados de los brazos son un sólido; otro es el termómetro y sube el brazo con cada ficha de calor que entra.<\/li><li>En el «punto de fusión», cada ficha suelta a una pareja y el brazo del termómetro NO sube.<\/li><li>Cuando todos están sueltos (líquido), las fichas vuelven a subir el brazo.<\/li><li>El grupo dibuja lo que hizo el brazo —subió, se quedó, subió— y dice en qué se gastaron las fichas del tramo plano.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Doce fichas de papel<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno de todos los días con tres preguntas —qué se observó, qué se midió y con qué unidad, y qué hacen las partículas— antes de explicarlo y antes de ver cualquier opción.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con la tabla o la ecuación en cinco minutos —contar, comparar o seguir a las partículas—, pero con el cuerpo.»"], "como": "No explica el fenómeno ni acepta todavía explicaciones. Si alguien dice «es una reacción química», le devuelve la pregunta: «¿qué viste o qué mediste que te lo dice?». El cuaderno sigue cerrado.", "apoyo": ["Qué movimiento mental entrena: Leer la meseta: mientras cambia el estado, el calor entra y la temperatura no se mueve, porque se gasta en separar las partículas. Es el movimiento de las preguntas 1, 7 y 8, y de la primera del entrenamiento (lo que el alumno anotó y lo que nunca midió).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 1, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m2)\">Pregunta problematizadora<\/span><span class=\"kicker\">Libro abierto en la pregunta modelo<\/span><\/div><h2>Abran el libro en la pregunta 1, página 150<\/h2><p class=\"lead\">Antes de releer el texto o la tabla: ¿cuál creen que es? Levanten la mano.<\/p><div class=\"ctl\"><button class=\"btn tally\" data-tally=\"h2A\">A <span class=\"n\" id=\"h2A\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h2B\">B <span class=\"n\" id=\"h2B\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h2C\">C <span class=\"n\" id=\"h2C\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h2D\">D <span class=\"n\" id=\"h2D\">0<\/span><\/button><button class=\"btn\" data-reset=\"h2\">↺<\/button><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta que gobierna el área<\/h3><p class=\"lead\">¿Qué número, con su unidad, o qué observación respalda eso?<\/p><p class=\"sub\">Nadie justifica con «yo sé que» ni con una palabra técnica suelta: toda respuesta señala un número con su unidad, una fila de la tabla o un punto de la gráfica.<\/p><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta de este momento<\/h3><p class=\"lead\">Si entra calor y el termómetro no se mueve, ¿en qué se gastó la energía?<\/p><\/div>", "guia": {"obj": "Que el estudiante compruebe que en Química la respuesta sale del dato con su unidad —del texto, la tabla o la gráfica— y de lo que hacen las partículas, no de la palabra que suena más técnica, usando la pregunta modelo del libro.", "decir": ["Presenta la pregunta modelo del libro y la deja a la vista todo el momento.", "Pide respuestas a mano alzada ANTES de releer el texto o la tabla, y las anota en el tablero.", "Hace la pregunta que gobierna el área: ¿qué número, con su unidad, o qué observación respalda eso?", "Revela la clave solo al final y trabaja por qué cae cada una de las otras tres."], "como": "Regla del momento: nadie justifica con «yo sé que» ni con una palabra técnica suelta. Toda intervención señala un número con su unidad, una fila de la tabla o un punto de la gráfica.", "apoyo": ["La pregunta modelo es la 1 del libro (página 150). El cuaderno se abre en la página 190 solo en «mi primera idea».", "Cuenta las manos tocando cada letra: el número queda en pantalla y sirve para el final del momento, cuando el grupo vea cuántos cambiaron de opinión al volver al texto o a la tabla.", "No digas la clave en este momento: sale en el bloque de las preguntas 1 y 2, después de llenar el instrumento en pantalla, casilla por casilla. Ahí se trabaja por qué cae cada una de las otras tres."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 1 y 2<\/span><span class=\"kicker\">En pantalla, casilla por casilla<\/span><\/div><h2>Preguntas 1 y 2: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 1<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Donde la temperatura se queda quieta<\/span><\/div><p class=\"sub\">Dos sólidos X y Y calentados igual · por qué Y tarda más en fundirse<\/p><h3 style=\"color:#242478\">Dos curvas, dos mesetas, dos esperas<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k21\"><span class=\"keychip\" style=\"background:#242478\">B<\/span> es la clave del libro<\/div><div class=\"aviso sev-medi\" hidden data-grupo=\"k21\"><b>Ojo con esta clave:<\/b> Errata del libro: el texto dice que Y se funde a 160 °C y la gráfica pone la meseta en 200 °C. Se responde con el texto; la clave no cambia.<\/div><\/div><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 2<\/span><span class=\"min\" style=\"--accent:#A82424\">E2 · El calor, tramo por tramo<\/span><\/div><p class=\"sub\">Bloques de parafina en un incendio · cuánta energía para fundirse<\/p><h3 style=\"color:#A82424\">La cuenta del calor en dos tramos<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k21\"><span class=\"keychip\" style=\"background:#A82424\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k21\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué cuenta o qué dato escribieron en el instrumento? Léanmelo con su unidad.»", "Si alguien se traba, pregúntale qué se midió y en qué unidad. Si el instrumento está vacío, vuelve al texto o a la tabla antes que a las opciones."], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Las claves del libro son 1·B y 2·A. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 1 · aviso del libro (media): Errata del libro: el texto dice que Y se funde a 160 °C y la gráfica pone la meseta en 200 °C. Se responde con el texto; la clave no cambia. Qué haces: Se responde con el texto. La clave B se sostiene: Y tiene que subir más antes de fundirse."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 3 y 4<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 3 y 4: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 3<\/span><span class=\"min\" style=\"--accent:#C9821B\">E3 · Lo explican los choques de partículas<\/span><\/div><p class=\"sub\">Tanque de propano al sol · por qué sube la presión<\/p><h3 style=\"color:#C9821B\">Partículas en un tanque que no puede agrandarse<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k23\"><span class=\"keychip\" style=\"background:#C9821B\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 4<\/span><span class=\"min\" style=\"--accent:#A82424\">E2 · El calor, tramo por tramo<\/span><\/div><p class=\"sub\">Grasa vegetal · por qué una cantidad específica de energía<\/p><h3 style=\"color:#A82424\">La misma energía, dos trabajos distintos<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k23\"><span class=\"keychip\" style=\"background:#A82424\">B<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k23\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué cuenta o qué dato escribieron en el instrumento? Léanmelo con su unidad.»", "Si alguien se traba, pregúntale qué se midió y en qué unidad. Si el instrumento está vacío, vuelve al texto o a la tabla antes que a las opciones."], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Las claves del libro son 3·B y 4·B. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 3 · aviso del libro (media), solo para ti, no se proyecta: La curva del tanque sube de 1,5 a 8 atm entre 20 y 70 °C; con la ley de los gases a volumen fijo subiría apenas un 17 %. Qué haces: No cambia la clave B. Si alguien hace la cuenta, tiene razón: el propano del tanque es un líquido que se evapora."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#A82424\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 2 · El calor, tramo por tramo<\/span><\/div><h2>La factura en dos tramos<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Dos casillas en el tablero: TRAMO 1 · SUBIR LA TEMPERATURA y TRAMO 2 · CAMBIAR DE ESTADO.<\/li><li>El docente cuenta: «un chocolate pasa de la nevera a la mano y se derrite»; los equipos ordenan los tramos.<\/li><li>Un cajero pide para cada tramo los datos con su unidad —masa, grados, calor por gramo— y los escribe.<\/li><li>La factura se suma solo si los dos tramos tienen sus unidades; si falta una, se devuelve.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Tablero<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con la tabla o la ecuación en cinco minutos —contar, comparar o seguir a las partículas—, pero con el cuerpo.»"], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Partir el calor en tramos y sumarlos, con las unidades en cada uno: lo que sube la temperatura y lo que cambia el estado. Es el movimiento de las preguntas 2 y 4, y de la segunda del entrenamiento (la plancha que vuelve vapor el agua del tanque).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 5 y 6<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 5 y 6: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 5<\/span><span class=\"min\" style=\"--accent:#C9821B\">E3 · Lo explican los choques de partículas<\/span><\/div><p class=\"sub\">Bandeja metálica o baño a 80 °C · qué método es más eficiente<\/p><h3 style=\"color:#C9821B\">Por cuántas caras le entra el calor<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k25\"><span class=\"keychip\" style=\"background:#C9821B\">C<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 6<\/span><span class=\"min\" style=\"--accent:#C9821B\">E3 · Lo explican los choques de partículas<\/span><\/div><p class=\"sub\">El baño caliente y el tiempo de fusión · qué hipótesis<\/p><h3 style=\"color:#C9821B\">El termómetro del baño<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k25\"><span class=\"keychip\" style=\"background:#C9821B\">D<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k25\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué cuenta o qué dato escribieron en el instrumento? Léanmelo con su unidad.»", "Si alguien se traba, pregúntale qué se midió y en qué unidad. Si el instrumento está vacío, vuelve al texto o a la tabla antes que a las opciones."], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Las claves del libro son 5·C y 6·D. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 5 · aviso del libro (baja), solo para ti, no se proyecta: La opción A habla de «aire caliente» en un método que es una bandeja metálica. Qué haces: No cambia la clave C."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#C9821B\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 3 · Lo explican los choques de partículas<\/span><\/div><h2>Partículas en la cancha<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Diez estudiantes caminan dentro de un rectángulo de cinta; dos de afuera cuentan los toques a la cinta en veinte segundos.<\/li><li>«Frío»: caminan despacio y tocan poco. «Caliente»: más rápido y tocan más: sube la presión.<\/li><li>Cinco «calientes» entran entre cinco «fríos» y frenan un poco con cada toque: al principio mucho, al final casi nada.<\/li><li>Cada cambio se explica con una frase de partículas, no con «porque sí».<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cinta · reloj con segundero<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con la tabla o la ecuación en cinco minutos —contar, comparar o seguir a las partículas—, pero con el cuerpo.»"], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Explicar lo que se mide afuera (la presión, lo rápido que algo se enfría) con lo que hacen las partículas adentro. Es el movimiento de las preguntas 3, 5 y 6, y de la tercera del entrenamiento (el agua que se enfría rápido al principio y despacio al final).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 7 y 8<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 7 y 8: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 7<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Donde la temperatura se queda quieta<\/span><\/div><p class=\"sub\">Hielo seco que se reduce sin dejar charco · qué propiedad<\/p><h3 style=\"color:#242478\">El triángulo de los estados y el atajo del hielo seco<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k27\"><span class=\"keychip\" style=\"background:#242478\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 8<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Donde la temperatura se queda quieta<\/span><\/div><p class=\"sub\">Matraz con un sólido orgánico · la temperatura que se estabiliza<\/p><h3 style=\"color:#242478\">Dibuja lo que cuenta el termómetro<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k27\"><span class=\"keychip\" style=\"background:#242478\">A<\/span> es la clave del libro<\/div><div class=\"aviso sev-baja\" hidden data-grupo=\"k27\"><b>Ojo con esta clave:<\/b> Errata del libro: un sólido no se mide en mililitros. La clave no cambia.<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k27\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué cuenta o qué dato escribieron en el instrumento? Léanmelo con su unidad.»", "Si alguien se traba, pregúntale qué se midió y en qué unidad. Si el instrumento está vacío, vuelve al texto o a la tabla antes que a las opciones."], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Las claves del libro son 7·B y 8·A. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 8 · aviso del libro (baja): Errata del libro: un sólido no se mide en mililitros. La clave no cambia. Qué haces: Errata. No cambia la clave A."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#5B3E96\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 4 · Más denso abajo, menos denso arriba<\/span><\/div><h2>La escalera de densidades<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Cinco tarjetas con densidades en g/cm³: aceite 0,92, agua 1,00, miel 1,40, hierro 7,9 y mercurio 13,6.<\/li><li>Quienes las tienen se ordenan como escalera: el más denso agachado, el menos denso en puntas.<\/li><li>Otro recibe un objeto en tarjeta —corcho 0,24, canica 2,5, moneda 8,9— y se ubica donde quedaría.<\/li><li>El grupo dice qué lo sostiene ahí (el empuje) y lo corrige si se pasó o se quedó corto.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Ocho tarjetas con densidades<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con la tabla o la ecuación en cinco minutos —contar, comparar o seguir a las partículas—, pero con el cuerpo.»"], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Comparar densidades, con su unidad, para decir qué queda arriba y qué abajo. Es el movimiento de las preguntas 9 y 10, y de la cuarta del entrenamiento (por qué el hielo flota en el agua).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 9 y 10<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 9 y 10: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 9<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E4 · Más denso abajo, menos denso arriba<\/span><\/div><p class=\"sub\">Una esfera metálica que flota en mercurio · qué hipótesis<\/p><h3 style=\"color:#5B3E96\">La escalera de las densidades<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k29\"><span class=\"keychip\" style=\"background:#5B3E96\">D<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 10<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E4 · Más denso abajo, menos denso arriba<\/span><\/div><p class=\"sub\">La esfera sube rápido desde el fondo · qué propiedad del mercurio<\/p><h3 style=\"color:#5B3E96\">Lo que la empuja y lo que la frena<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k29\"><span class=\"keychip\" style=\"background:#5B3E96\">A<\/span> es la clave del libro<\/div><div class=\"aviso sev-medi\" hidden data-grupo=\"k29\"><b>Ojo con esta clave:<\/b> Lo que hace subir la esfera es el empuje: el mercurio es más denso que ella. La clave A solo explica por qué sube rápido; la causa principal no estaba entre las opciones.<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k29\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué cuenta o qué dato escribieron en el instrumento? Léanmelo con su unidad.»", "Si alguien se traba, pregúntale qué se midió y en qué unidad. Si el instrumento está vacío, vuelve al texto o a la tabla antes que a las opciones."], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Las claves del libro son 9·D y 10·A. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 9 · aviso del libro (atención), solo para ti, no se proyecta: El contexto remite a un video que no está en el cuaderno y no dice de qué metal es la esfera. Qué haces: El cuaderno supone acero (7,9 g/cm³) y lo dice.", "Pregunta 10 · aviso del libro (media): Lo que hace subir la esfera es el empuje: el mercurio es más denso que ella. La clave A solo explica por qué sube rápido; la causa principal no estaba entre las opciones. Qué haces: Separa «por qué sube» de «por qué sube rápido», como el cuaderno."]}}, {"m": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m4)\">Reto en equipo · 20 min<\/span><span class=\"kicker\">Equipos de tres · cada uno responde en su cuaderno<\/span><\/div><h2>Reto del corte: La paleta que se derrite<\/h2><div class=\"card big edge mt\" style=\"--accent:var(--m4)\"><p class=\"lead\">Una paleta de hielo de 100 g sale del congelador a −10 °C (hielo: 2,1 J/(g·°C); fundirlo: 334 J/g). En doce minutos cada equipo dibuja la gráfica de temperatura que espera y marca la meseta, calcula el calor de los dos tramos hasta tener agua a 0 °C, explica cada tramo con partículas y dice qué queda arriba si se echa un cubo de hielo en esa agua. Cada uno escribe su cuenta con unidades. (Docente: 2.100 J + 33.400 J = 35.500 J.)<\/p><\/div><div class=\"note mt\" style=\"--accent:var(--m4)\"><b>La defensa:<\/b> tres minutos por equipo, señalando el dato con su unidad, la cuenta o la propiedad que los respalda. «Es que así reacciona» no cuenta.<\/div>", "guia": {"obj": "Que el estudiante defienda su explicación con el dato y la unidad en la mano, y acepte que otro equipo puede ver una variable o una propiedad que él no vio.", "decir": ["Arma equipos de tres y entrega el reto del corte de este momento.", "Exige que cada integrante llegue con su instrumento YA diligenciado individualmente.", "Da tres minutos de defensa por equipo: señalan el dato, la cuenta o la propiedad que los respalda.", "Cierra mostrando qué variable, qué unidad o qué propiedad quedó por fuera en cada propuesta."], "como": "El equipo discute, pero cada uno escribe en SU tarjeta del reto. No se acepta una defensa que diga «es que así reacciona»: se nombra el dato con su unidad, la cuenta o la propiedad.", "apoyo": ["El reto no tiene una sola respuesta correcta: gana el equipo que mejor sostiene la suya con datos. Si dos explicaciones están sostenidas, dilo: eso también es hacer ciencia.", "Si un equipo entrega una sola hoja para los tres, el reto no cuenta. La discusión es compartida; el registro es individual.", "Los retos se resuelven en papel: ninguno se hace con sustancias en el salón.", "Cierra mostrando qué variable, qué unidad o qué propiedad quedó por fuera en cada propuesta."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 1<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Lo que el alumno anotó<\/h3><p>Un alumno fundió dos sustancias puras con la intención de saber cuál de ellas cambia de estado más rápidamente. Metió un trozo de cada sustancia en un recipiente de vidrio, los calentó con un mechero, y midió el tiempo que tardaron en cambiar de estado. Los resultados se muestran a continuación.<\/p><figure class=\"fig\"><table class=\"tabla\"><thead><tr><th>Sustancia<\/th><th>Tiempo<\/th><th>Observación final<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>50<\/td><td>Pasa de estado sólido a líquido.<\/td><\/tr><tr><td>2<\/td><td>163<\/td><td>Pasa de estado sólido a líquido.<\/td><\/tr><\/tbody><\/table><\/figure><\/div><div><p class=\"enun\">Las observaciones realizadas por el estudiante se pueden considerar<\/p><div class=\"ops\" id=\"icf21\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>una conclusión, porque las dos sustancias empiezan a cambiar de estado a los 50 segundos.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>una evidencia de que las sustancias se funden por efecto de la temperatura.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>una conclusión, porque los cambios de estado se dan a la misma temperatura.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>una evidencia de que las sustancias tienen puntos de fusión cercanos.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf21\" data-k=\"B\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la B.", "Por qué es la B: el alumno anotó un tiempo y lo que vio (las dos pasaron de sólido a líquido); nunca midió una temperatura. B solo dice lo que se observó: que se funden con el calor. A dice que las dos empiezan a los 50 segundos (la 2 tardó 163); C afirma que el cambio fue a la misma temperatura y D, que los puntos de fusión son cercanos: ninguna temperatura se midió.", "Separar lo que se anotó de lo que nunca se midió: la columna de temperatura no existe.", "La tabla no trae la unidad del tiempo (la opción A habla de segundos). Úsalo: un número sin unidad no se puede comparar.", "La clave es la menos mala más que una conclusión fuerte. Si alguien lo dice, tiene razón.", "Aviso (atención), solo para ti: La tabla no trae la unidad del tiempo, y la clave B es la menos mala más que una conclusión fuerte. Qué haces: Úsalo: un tiempo sin unidad no se puede comparar."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 2<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>La plancha de vapor<\/h3><p>Algunas planchas almacenan agua en un tanque y transforman energía eléctrica en calor.<\/p><\/div><div><p class=\"enun\">Esta transformación de energía permite<\/p><div class=\"ops\" id=\"icf22\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>que se produzca vapor y este ayude en la eliminación de arrugas.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>que la plancha se haga más pesada y este peso elimine las arrugas.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>que el aire que circula entre la plancha y la ropa elimine las arrugas.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>que el agua del tanque permanezca líquida y elimine las arrugas.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf22\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la A.", "Por qué es la A: el calor que produce la plancha pasa al agua del tanque: primero la calienta y después la vuelve vapor, y el vapor ayuda a quitar las arrugas (A). B dice que el calor hace más pesada la plancha; C habla de un aire que la plancha no mueve; D deja el agua líquida, como si el calor no hubiera hecho nada.", "Es el calor tramo por tramo: un tramo sube la temperatura del agua y el otro la cambia de estado.", "D es la trampa: «permanezca líquida» contradice lo que hace el calor que entra."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 3<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>El agua que se enfría<\/h3><p>Juan calienta una gran cantidad de agua en una olla. Al retirarla del fuego, la temperatura del agua se mide con un termómetro y este indica 100 °C. Juan mide la temperatura del ambiente obteniendo 20 °C. La ley de enfriamiento de Newton establece que cuanto mayor es la diferencia de temperatura entre un objeto y el ambiente, mayor es el flujo de calor y, por tanto, más rápido se enfría el objeto.<\/p><\/div><div><p class=\"enun\">Teniendo en cuenta la información anterior, ¿cuál de las siguientes gráficas describe mejor el proceso de enfriamiento del agua en la olla?<\/p><div class=\"opsfig\"><figure class=\"fig\"><svg viewBox=\"0 0 840 214\" role=\"img\" aria-label=\"Cuatro gráficas de temperatura contra tiempo, A a D\" style=\"font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif\"><text x=\"6\" y=\"20\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"start\" font-weight=\"700\">Gráfica A<\/text><line x1=\"44.0\" y1=\"184.0\" x2=\"194.0\" y2=\"184.0\" stroke=\"#E3E8EF\" stroke-width=\"1\"/><text x=\"39\" y=\"188\" font-size=\"10\" fill=\"#1B1F27\" text-anchor=\"end\">0<\/text><line x1=\"44.0\" y1=\"159.0\" x2=\"194.0\" y2=\"159.0\" stroke=\"#E3E8EF\" stroke-width=\"1\"/><text x=\"39\" y=\"163\" font-size=\"10\" fill=\"#1B1F27\" text-anchor=\"end\">20<\/text><line x1=\"44.0\" y1=\"134.0\" x2=\"194.0\" y2=\"134.0\" stroke=\"#E3E8EF\" stroke-width=\"1\"/><text x=\"39\" y=\"138\" font-size=\"10\" fill=\"#1B1F27\" text-anchor=\"end\">40<\/text><line x1=\"44.0\" y1=\"109.0\" x2=\"194.0\" y2=\"109.0\" stroke=\"#E3E8EF\" stroke-width=\"1\"/><text x=\"39\" y=\"113\" font-size=\"10\" fill=\"#1B1F27\" text-anchor=\"end\">60<\/text><line x1=\"44.0\" y1=\"84.0\" x2=\"194.0\" y2=\"84.0\" stroke=\"#E3E8EF\" stroke-width=\"1\"/><text x=\"39\" y=\"88\" font-size=\"10\" fill=\"#1B1F27\" text-anchor=\"end\">80<\/text><line x1=\"44.0\" y1=\"59.0\" x2=\"194.0\" y2=\"59.0\" stroke=\"#E3E8EF\" stroke-width=\"1\"/><text x=\"39\" y=\"63\" font-size=\"10\" fill=\"#1B1F27\" text-anchor=\"end\">100<\/text><line x1=\"44.0\" y1=\"34.0\" x2=\"194.0\" y2=\"34.0\" stroke=\"#E3E8EF\" stroke-width=\"1\"/><text x=\"39\" y=\"38\" font preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la C.", "Por qué es la C: al principio la diferencia con el ambiente es de 80 °C y el agua se enfría rápido; a medida que se acerca a 20 °C, cada vez más despacio. Es la curva C: cae empinada al comienzo y se aplana cerca de 20 °C. A y B empiezan suaves (al revés); D es una recta, que sería enfriarse siempre al mismo ritmo.", "Que dibujen su curva antes de ver las cuatro: ¿empieza rápido o despacio?, ¿dónde se detiene?", "La curva nunca baja de 20 °C: el agua no se enfría más que el ambiente.", "Las cuatro gráficas se redibujaron con la misma forma que en el cuadernillo."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 4<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>El hielo que flota<\/h3><p>Cuando se congela el agua, flota sobre el agua líquida como ocurre en los casquetes glaciares.<\/p><\/div><div><p class=\"enun\">Esto sucede porque el agua sólida presenta una densidad<\/p><div class=\"ops\" id=\"icf24\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>menor que en estado líquido, porque en estado sólido se generan espacios vacíos entre las moléculas.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>mayor que en estado líquido, porque en este estado líquido las moléculas de agua se encuentran más cercanas.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>menor que en estado líquido, porque en estado sólido las fuerzas de atracción entre las moléculas son mayores.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>mayor que en estado líquido, porque en estado sólido las moléculas de agua se atraen débilmente entre sí.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf24\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la A.", "Por qué es la A: si el hielo flota, es menos denso que el agua líquida (0,92 frente a 1,00 g/cm³). Al congelarse, las moléculas se acomodan en una red que deja espacios vacíos: la misma masa ocupa más volumen (A). B y D dicen «mayor», contra lo que se ve; C dice «menor», pero da una razón que no explica por qué ocupa más espacio.", "C es la trampa: la primera mitad es cierta y la razón no.", "Un kilo de hielo ocupa unos 1,09 litros: por eso una botella llena de agua revienta en el congelador. ---"]}}, {"m": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m6)\">Cierre<\/span><span class=\"kicker\">La pregunta de siempre<\/span><\/div><h2>¿En qué se parecía la pregunta Saber 11 a la de tu libro?<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:#242478\"><div class=\"k\">1<\/div><div><b>Donde la temperatura se queda quieta<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#A82424\"><div class=\"k\">2<\/div><div><b>El calor, tramo por tramo<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#C9821B\"><div class=\"k\">3<\/div><div><b>Lo explican los choques de partículas<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#5B3E96\"><div class=\"k\">4<\/div><div><b>Más denso abajo, menos denso arriba<\/b><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--m6)\"><h3>Antes de salir<\/h3><ol class=\"pasos\"><li>El concepto del día —una propiedad, una ley o una relación entre cantidades—, en «Palabras que me frenaron», con tus palabras.<\/li><li>«Lo que me llevo de esta pregunta».<\/li><li>Tu carita de salida.<\/li><li>La casilla 2 de la portada del área.<\/li><\/ol><\/div><\/div>", "guia": {"obj": "Que el estudiante nombre la estrategia que usó y se lleve un concepto del día —una propiedad, una ley o una relación entre cantidades— escrito en sus propias palabras.", "decir": ["Socializa solo las preguntas que el grupo falló, pidiendo el dato, la cuenta o la propiedad que las resuelve.", "Pide que lean en voz alta su salvavidas: lo mínimo que sí tenían claro.", "Cada uno escribe el concepto del día en la franja «Palabras que me frenaron» de su hoja."], "como": "No dicta la definición. El concepto se escribe como el estudiante lo entendió; si quedó mal entendido, eso se ve en la hoja y se corrige la próxima clase.", "apoyo": ["La palabra nueva no se dicta. Si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase: es mejor que dictarla bien.", "Para el cierre del momento: Las preguntas 2 y 4 hacen la misma cuenta de dos tramos (m · c · ΔT más m · L). Usa la segunda para que la hagan solos, con las unidades escritas en cada paso: J/(g·°C) por g por °C da julios."]}}];

function paintClock(){
  var n = $("#tnum");
  if(!tBase){ n.textContent = "—"; n.classList.remove("over"); return; }
  var s = Math.abs(tLeft), mm = Math.floor(s/60), ss = s%60;
  n.textContent = (tLeft<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", tLeft<0);
}
function setTimer(min){
  tBase = min||0; tLeft = tBase*60; tOn = false;

}
function toggleTimer(){
  if(!tBase) return;
  tOn = !tOn; $("#play").textContent = tOn ? "Pausar" : "Seguir";

  if(tOn) tick = setInterval(function(){ tLeft--; paintClock(); }, 1000);
  paintClock();
}
function guiaHTML(g){
  if(!g) return '<p class="sub">Sin notas para esta diapositiva.</p>';

     g.decir.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  if(g.como) h += '<div class="gbox como"><h4>Lo que no haces</h4><p>'+esc(g.como)+'</p></div>';

}
function pintaElegidas(){

}
wrap.addEventListener("click", function(e){

    var g = wrap.querySelectorAll('[data-grupo="'+b.dataset.showgrupo+'"]'), abrir = g.length && g[0].hidden;

    var box = document.getElementById(b.dataset.clave), ok = box.querySelector('[data-op="'+b.dataset.k+'"]');

});
function setGuia(on){ $("#guia").classList.toggle("open", on); $("#scrim").classList.toggle("on", on);
  $("#gbtn").setAttribute("aria-pressed", on ? "true" : "false"); }
$("#next").addEventListener("click", function(){ go(i+1); });
$("#prev").addEventListener("click", function(){ go(i-1); });
$("#play").addEventListener("click", toggleTimer);
$("#reset").addEventListener("click", function(){ setTimer(tBase); });
$("#gbtn").addEventListener("click", function(){ setGuia(!$("#guia").classList.contains("open")); });
$("#gclose").addEventListener("click", function(){ setGuia(false); });
$("#scrim").addEventListener("click", function(){ setGuia(false); });
document.addEventListener("keydown", function(e){
  var t = e.target.tagName; if(t==="INPUT"||t==="TEXTAREA") return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ go(i+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ go(i-1); e.preventDefault(); }
  else if(e.key==="Home"){ go(0); e.preventDefault(); }
  else if(e.key==="End"){ go(SC.length-1); e.preventDefault(); }
  else if(e.key==="g"||e.key==="G"){ setGuia(!$("#guia").classList.contains("open")); }
  else if(e.key==="t"||e.key==="T"){ toggleTimer(); }
  else if(e.key==="Escape"){ setGuia(false); }
});
go(0);
})();
</script>
</body>
</html>
