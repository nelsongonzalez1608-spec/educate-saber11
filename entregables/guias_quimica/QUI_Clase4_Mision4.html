<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Química · Clase 4</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>[hidden]{display:none!important}
:root{
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --text:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --area:#0F7A68; --azul:#1F4E8C; --oro:#B0711A; --morado:#5B3E96; --verde:#2E7A39;
  --m1:#0F7A68; --m2:#1F4E8C; --m3:#3B3BA6; --m4:#5B3E96; --m5:#A82424; --m6:#4A5A70; --rojo:#A82424;
  --ink:#1B1F27; --muted:#5C6472; --faint:#A9B0BB; --line:#E3E7ED; --paper:#FFFFFF; --bg:#F6F4F1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:clamp(16px,1.25vw,21px);line-height:1.5}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
#top{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding:10px clamp(14px,2vw,28px);background:var(--paper);flex-wrap:wrap}
.logo img{height:clamp(28px,2.6vw,40px);display:block}
#mom{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
#momdot{width:clamp(30px,2.4vw,40px);height:clamp(30px,2.4vw,40px);border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;background:var(--faint)}
#momnom{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.2vw,20px)}
#momsub{color:var(--muted);font-size:.85em}
#clock{display:flex;align-items:center;gap:8px}
#tnum{font-family:var(--display);font-weight:800;font-size:clamp(20px,1.8vw,30px);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
#tnum.over{color:var(--area)}
.btn{appearance:none;font:inherit;font-size:.86em;font-weight:600;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.solid{background:var(--area);border-color:var(--area);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#stage{overflow:auto;padding:clamp(18px,3vw,48px) clamp(16px,4vw,72px)}
#wrap{max-width:1500px;margin:0 auto}
#wrap.enter{animation:ent .28s ease-out}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bot{display:flex;align-items:center;gap:12px;padding:10px clamp(14px,2vw,28px);background:var(--paper)}
#prog{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
#prog i{display:block;height:100%;background:var(--area);transition:width .25s}
#count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
#hint{color:var(--faint);font-size:.8em}
@media (max-width:760px){#hint{display:none}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.2vw,68px);line-height:1.05;margin:.2em 0 .25em;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,2.8vw,46px);line-height:1.1;margin:.25em 0 .3em;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:clamp(18px,1.5vw,26px);margin:.1em 0 .4em;line-height:1.2}
p{margin:.35em 0 .6em}
.lead{font-size:1.2em;line-height:1.45;max-width:70ch}
.sub{color:var(--muted)}
.mt{margin-top:clamp(14px,1.8vw,26px)}
.logo-xl img{height:clamp(54px,6vw,96px);margin-bottom:12px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tag,.min,.membrete{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.78em;font-weight:700;letter-spacing:.02em}
.tag{background:var(--ink);color:#fff}
.min{background:var(--accent,var(--area));color:#fff}
.membrete{border:1.5px solid var(--line);color:var(--muted)}
.kicker{color:var(--muted);font-size:.85em;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.grid{display:grid;gap:clamp(12px,1.4vw,22px)}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid>*{min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,1.6vw,24px)}
.card.edge{border-left:6px solid var(--accent,var(--area))}
.card.big .lead{font-size:1.3em}
.step{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px}
.step .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;flex:none}
.note{border-left:5px solid var(--accent,var(--area));background:var(--paper);border-radius:10px;padding:10px 16px;margin-top:12px}
.cita{font-family:var(--display);font-weight:600;line-height:1.35;background:var(--paper);border-left:6px solid var(--area);border-radius:12px;padding:clamp(16px,2vw,30px);margin:18px 0}
.cita.xl{font-size:clamp(24px,2.6vw,44px)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally .n{display:inline-block;min-width:1.6em;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.pasos{margin:.2em 0 0;padding-left:1.3em}.pasos li{margin:.3em 0}
.sello{margin-top:12px;border:2px dashed var(--oro);border-radius:12px;padding:10px 14px;background:#FDF6EA}
.sello b{display:block;color:var(--oro);font-size:.8em;letter-spacing:.06em;text-transform:uppercase}
.clave{margin-top:12px;display:flex;align-items:center;gap:10px;font-weight:600}
.keychip{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:10px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.2em}
.aviso{margin-top:10px;border-radius:10px;padding:10px 14px;background:#FBEFEF;border-left:5px solid var(--area);font-size:.92em}
.aviso.sev-aten{background:#EDF5EE;border-left-color:var(--verde)}
.aviso.sev-medi{background:#FDF5E7;border-left-color:var(--oro)}
.icfes .texto{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.6vw,24px);max-height:62vh;overflow:auto;font-size:.95em}
.enun{font-weight:600;font-size:1.08em}
.ops{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.op .L{flex:none;width:1.8em;height:1.8em;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-family:var(--display);font-weight:800}
.op.ok{border-color:var(--verde);background:#EDF5EE}.op.ok .L{background:var(--verde);color:#fff}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick[aria-pressed="true"]{background:var(--area);border-color:var(--area);color:#fff}
#scrim{position:fixed;inset:0;background:rgba(15,18,24,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#guia{position:fixed;top:0;right:0;height:100%;width:min(520px,92vw);background:var(--paper);box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column;z-index:10}
#guia.open{transform:none}
#guiahead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg)}
#guiabody{overflow:auto;padding:16px 20px 30px;font-size:.92em}
.gbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.gbox h4{margin:0 0 6px;font-family:var(--display);font-size:.8em;letter-spacing:.07em;text-transform:uppercase;color:var(--area)}
.gbox ul{margin:0;padding-left:1.1em}.gbox li{margin:.35em 0}
.gbox.como{background:#F6F7F9}.gbox.como h4{color:var(--muted)}
.gbox.apoyo{background:#FDF6EA;border-color:#EAD9B4}.gbox.apoyo h4{color:var(--oro)}
.examen{background:var(--paper);border:1px solid var(--line);border-left:8px solid var(--area);border-radius:22px;padding:clamp(16px,2.4vw,40px);margin-top:clamp(12px,1.6vw,24px);text-align:center}
.relojxl{font-family:var(--display);font-weight:800;font-size:clamp(96px,17vw,280px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.relojxl.over{color:var(--area)}
.exhoras{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 36px;color:var(--muted);font-size:1.15em;margin-top:10px}
.exhoras b{color:var(--ink);font-variant-numeric:tabular-nums}
.nbig{font-family:var(--display);font-weight:800;font-size:clamp(40px,4vw,64px);line-height:1;color:var(--accent,var(--area))}
.asig{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:8px 0}
.asig .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;flex:none}
.asig label{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted)}
.asig label.w{flex:1;min-width:min(100%,260px)}
.campo{font:inherit;font-size:1.1em;font-weight:700;color:var(--ink);border:none;border-bottom:2px dashed var(--faint);background:transparent;padding:4px 6px;min-width:0;flex:1;outline:none}
.campo.n{width:4.5em;flex:none;text-align:center}
.campo:focus{border-bottom-color:var(--area)}
.nums1{border:1.5px solid var(--line);border-radius:999px;padding:3px 14px;background:var(--paper);font-weight:600;color:var(--muted)}
.nums1 b{color:var(--ink)}
.pides{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:1.08em}
.pide{display:inline-flex;align-items:center;gap:8px}
.chk{display:inline-block;width:20px;height:20px;border:2px solid var(--area);border-radius:4px;background:#fff;flex:none}
.herrs{display:grid;gap:clamp(12px,1.4vw,22px);grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.herr{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--area);border-radius:16px;padding:14px 18px;font-size:1.12em}
.herr svg{flex:none}
[hidden]{display:none!important}
.fig{margin:12px 0}.fig svg{display:block;width:100%;max-width:760px;height:auto}
.tabla{border-collapse:collapse;width:100%;table-layout:fixed;font-size:.86em;line-height:1.35}
.tabla th,.tabla td{border:1px solid var(--line);padding:5px 8px;vertical-align:top;overflow-wrap:anywhere}
.tabla th{background:#EEF4F2;text-align:left}.tabla caption{text-align:left;font-weight:700;padding:0 0 6px}
.fig figcaption,.figcap{font-size:.85em;font-style:italic;margin-top:6px}
.ops.cuatro{grid-template-columns:repeat(4,1fr)}.opsfig svg{max-width:760px}
.aviso{border-left-color:var(--rojo)}.aviso.sev-baja{background:#EEF3FA;border-left-color:var(--azul)}
</style>
</head>

=\"sub\">Las diez preguntas de la prueba de campo, páginas 170 a 173<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m4)\"><h3>Tu cuaderno<\/h3><p class=\"sub\">Páginas 237 a 243<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m6)\"><h3>Hoy<\/h3><p class=\"sub\">120 minutos · 6 momentos · EF · propiedades que separan<\/p><\/div><\/div>", "guia": {"obj": "Que el grupo sepa desde el primer minuto qué va a pasar en estos 120 minutos y qué tiene que tener sobre la mesa.", "decir": ["«Libro abierto, cuaderno cerrado, lápiz. Hoy no les voy a preguntar fórmulas de memoria: les voy a preguntar qué número, con qué unidad, lo dice.»"], "apoyo": ["⚑ Antes del sábado: La pregunta 1 pide justificar algo que en la realidad es falso: el sulfato de cobre NO es el más soluble de los tres (a 20 °C el azúcar se disuelve mucho más). Se responde con la tabla, y el cuaderno pone un sello. La 8 da por hecho que magnetismo y tamaño «no fueron eficientes», cosa que el texto nunca dice.", "Seguridad: las dinámicas son con el cuerpo, tarjetas, cinta y clips; ninguna usa sustancias, fuego ni calor de verdad, y los retos se resuelven en papel. Si alguien propone hacer en el salón el experimento del libro, la respuesta es no.", "Del libro, para ti: El texto de teoría dice que «un colador de plástico no transfiere calor» (sí transfiere, mucho menos que el metal). Corrígelo si sale en clase.", "Los cuatro conceptos que tienes que poder explicar hoy en dos minutos, sin jerga. Si un estudiante sabe más que tú de un tema, déjalo explicar y pide que señale en el texto o en la tabla de dónde lo saca:", "Comparación justa: Dos resultados se comparan solo si todo lo demás fue igual: la misma agua, la misma temperatura, la misma cantidad. Si la carrera no fue pareja, la conclusión no vale.", "Sedimentar, quedar suspendido, disolverse: Las partículas grandes y densas se van rápido al fondo. Las muy finas se quedan flotando mucho tiempo: es una suspensión. Disolverse es otra cosa: la sustancia se separa en partículas tan pequeñas que no se ven.", "Propiedades físicas que separan: El imán separa lo magnético (el hierro). El tamiz separa por tamaño. El aire o la vibración separan por densidad: lo liviano para su tamaño se va. Ninguno de estos métodos cambia las sustancias.", "Conducir la electricidad: Conducen los materiales con cargas que se pueden mover: los metales y el grafito. Una sal sólida no conduce; disuelta en agua, sí. Conducir el calor y conducir la electricidad no son lo mismo.", "Abre esta guía con la tecla G en cada diapositiva: trae lo que dices y, debajo, lo que necesitas saber si Química no es tu área.", "El cronómetro arranca con T y se reinicia solo cuando cambia el momento de la clase."]}}, {"m": null, "html": "<div class=\"eyebrow\"><span class=\"kicker\">Así vamos a trabajar<\/span><\/div><h2>Seis momentos, una sola regla<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:var(--m1)\"><div class=\"k\">1<\/div><div><b>Activación<\/b><span class=\"sub\"> · 15 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m2)\"><div class=\"k\">2<\/div><div><b>Pregunta problematizadora<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m3)\"><div class=\"k\">3<\/div><div><b>Desarrollo guiado<\/b><span class=\"sub\"> · 35 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m4)\"><div class=\"k\">4<\/div><div><b>Reto en equipo<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m5)\"><div class=\"k\">5<\/div><div><b>Evaluación individual<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m6)\"><div class=\"k\">6<\/div><div><b>Cierre<\/b><span class=\"sub\"> · 10 min<\/span><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--area)\"><h3>La regla del cuaderno<\/h3><p class=\"lead\">Si el instrumento está vacío, no lo resolviste: lo adivinaste.<\/p><p>Primero se escribe el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas—, después se marca la opción. Una respuesta correcta con el instrumento en blanco no cuenta como resuelta.<\/p><\/div><\/div>", "guia": {"obj": "Que la regla quede dicha en voz alta antes de cualquier texto.", "decir": ["«La respuesta correcta con el instrumento vacío no cuenta. ¿Por qué? Porque en Química casi todas las opciones suenan técnicas: el que no escribió la cuenta escoge la que suena mejor, no la que dicen los números.»"], "apoyo": ["Si alguien pregunta para qué escribir, la respuesta corta es: lo que separa la opción correcta de las que suenan bien está en un número, una unidad o una fila de la tabla, y eso se pierde si no se escribe.", "Si alguien dice «es una reacción química» o «es por la presión», devuélvele la pregunta: «¿qué viste o qué mediste que te lo dice?»."]}}, {"m": 0, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Activación<\/span><span class=\"kicker\">Cuaderno cerrado<\/span><\/div><h2>¿Qué se observó, qué se midió y con qué unidad, y qué hacen las partículas?<\/h2><blockquote class=\"cita xl\">Al barrer el salón, la arena se queda en el piso y el polvo fino flota en el aire un buen rato antes de caer.<\/blockquote><p class=\"lead\">Tres respuestas antes de cualquier explicación. Todavía no se abre el cuaderno.<\/p><div class=\"ctl\"><button class=\"btn\" data-show=\"pista4\">Mostrar la pista<\/button><\/div><div class=\"note\" id=\"pista4\" hidden style=\"--accent:var(--m1)\"><b>Pista:<\/b> se observó qué cae y qué flota; se mediría el tamaño de cada grano y el tiempo que tarda en caer; lo grande y pesado cae rápido, lo finísimo se queda suspendido<\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno de todos los días con tres preguntas —qué se observó, qué se midió y con qué unidad, y qué hacen las partículas— antes de explicarlo y antes de ver cualquier opción.", "decir": ["Proyecta o lee una observación de dos o tres renglones sin decir de dónde salió.", "Pide tres respuestas, en voz alta o en el tablero: qué se observó, qué se midió y con qué unidad, y qué hacen las partículas.", "Ejecuta la dinámica de apertura según la estrategia del encuentro."], "como": "No explica el fenómeno ni acepta todavía explicaciones. Si alguien dice «es una reacción química», le devuelve la pregunta: «¿qué viste o qué mediste que te lo dice?». El cuaderno sigue cerrado.", "apoyo": ["No expliques el fenómeno ni aceptes todavía explicaciones: primero las tres respuestas. La observación es inventada para la clase: no sale del libro, y nada de ella se hace en el salón.", "La pista existe para el cierre de los 15 minutos, no para el principio: se observó qué cae y qué flota; se mediría el tamaño de cada grano y el tiempo que tarda en caer; lo grande y pesado cae rápido, lo finísimo se queda suspendido."]}}, {"m": 0, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#242478\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 1 · Compara en igualdad de condiciones<\/span><\/div><h2>La carrera que no fue pareja<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Dos estudiantes hacen una carrera caminando; en secreto, uno sale dos pasos adelante y el otro carga dos maletas.<\/li><li>El docente pregunta quién camina más rápido, y el grupo responde con el resultado.<\/li><li>El docente revela las ventajas; el grupo lista lo que fue distinto además de quién caminaba.<\/li><li>Se repite con todo igual, y el grupo dice por qué la primera carrera no servía para concluir.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Dos maletas · pasillo despejado<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno de todos los días con tres preguntas —qué se observó, qué se midió y con qué unidad, y qué hacen las partículas— antes de explicarlo y antes de ver cualquier opción.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con la tabla o la ecuación en cinco minutos —contar, comparar o seguir a las partículas—, pero con el cuerpo.»"], "como": "No explica el fenómeno ni acepta todavía explicaciones. Si alguien dice «es una reacción química», le devuelve la pregunta: «¿qué viste o qué mediste que te lo dice?». El cuaderno sigue cerrado.", "apoyo": ["Qué movimiento mental entrena: Antes de comparar dos resultados, revisar que todo lo demás haya sido igual; si no, la comparación no deja concluir. Es el movimiento de las preguntas 1 y 5, y de la primera del entrenamiento (dos moléculas del mismo peso con fuerzas distintas).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 1, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m2)\">Pregunta problematizadora<\/span><span class=\"kicker\">Libro abierto en la pregunta modelo<\/span><\/div><h2>Abran el libro en la pregunta 1, página 170<\/h2><p class=\"lead\">Antes de releer el texto o la tabla: ¿cuál creen que es? Levanten la mano.<\/p><div class=\"ctl\"><button class=\"btn tally\" data-tally=\"h4A\">A <span class=\"n\" id=\"h4A\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h4B\">B <span class=\"n\" id=\"h4B\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h4C\">C <span class=\"n\" id=\"h4C\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h4D\">D <span class=\"n\" id=\"h4D\">0<\/span><\/button><button class=\"btn\" data-reset=\"h4\">↺<\/button><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta que gobierna el área<\/h3><p class=\"lead\">¿Qué número, con su unidad, o qué observación respalda eso?<\/p><p class=\"sub\">Nadie justifica con «yo sé que» ni con una palabra técnica suelta: toda respuesta señala un número con su unidad, una fila de la tabla o un punto de la gráfica.<\/p><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta de este momento<\/h3><p class=\"lead\">¿Qué propiedad tiene una cosa que la otra no tiene, y qué herramienta la aprovecha?<\/p><\/div>", "guia": {"obj": "Que el estudiante compruebe que en Química la respuesta sale del dato con su unidad —del texto, la tabla o la gráfica— y de lo que hacen las partículas, no de la palabra que suena más técnica, usando la pregunta modelo del libro.", "decir": ["Presenta la pregunta modelo del libro y la deja a la vista todo el momento.", "Pide respuestas a mano alzada ANTES de releer el texto o la tabla, y las anota en el tablero.", "Hace la pregunta que gobierna el área: ¿qué número, con su unidad, o qué observación respalda eso?", "Revela la clave solo al final y trabaja por qué cae cada una de las otras tres."], "como": "Regla del momento: nadie justifica con «yo sé que» ni con una palabra técnica suelta. Toda intervención señala un número con su unidad, una fila de la tabla o un punto de la gráfica.", "apoyo": ["La pregunta modelo es la 1 del libro (página 170). El cuaderno se abre en la página 237 solo en «mi primera idea».", "Cuenta las manos tocando cada letra: el número queda en pantalla y sirve para el final del momento, cuando el grupo vea cuántos cambiaron de opinión al volver al texto o a la tabla.", "No digas la clave en este momento: sale en el bloque de las preguntas 1 y 2, después de llenar el instrumento en pantalla, casilla por casilla. Ahí se trabaja por qué cae cada una de las otras tres."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 1 y 2<\/span><span class=\"kicker\">En pantalla, casilla por casilla<\/span><\/div><h2>Preguntas 1 y 2: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 1<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Compara en igualdad de condiciones<\/span><\/div><p class=\"sub\">Sulfato de cobre, sal y azúcar · cuál es más soluble<\/p><h3 style=\"color:#242478\">La carrera que no fue pareja<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Cómo se mide la solubilidad<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k41\"><span class=\"keychip\" style=\"background:#242478\">A<\/span> es la clave del libro<\/div><div class=\"aviso sev-medi\" hidden data-grupo=\"k41\"><b>Ojo con esta clave:<\/b> Ojo: en la realidad el azúcar se disuelve mucho más que el sulfato de cobre. La clave A es la mejor con ESTA tabla, no una verdad química.<\/div><\/div><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 2<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E2 · ¿Se hunde, flota o queda suspendido?<\/span><\/div><p class=\"sub\">Tres polvos en aceite · por qué uno sedimentó más rápido<\/p><h3 style=\"color:#5B3E96\">Tres polvos en la regla del tamaño<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k41\"><span class=\"keychip\" style=\"background:#5B3E96\">C<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k41\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué cuenta o qué dato escribieron en el instrumento? Léanmelo con su unidad.»", "Si alguien se traba, pregúntale qué se midió y en qué unidad. Si el instrumento está vacío, vuelve al texto o a la tabla antes que a las opciones."], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Las claves del libro son 1·A y 2·C. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 1 · Cómo se mide la solubilidad: Se mide en gramos de soluto que caben en 100 g de agua, a una temperatura fija. A 20 °C caben unos 200 g de azúcar, unos 36 g de sal y unos 32 g de sulfato de cobre. Disolverse más rápido o a menos temperatura no es lo mismo que ser más soluble. Para destrabar: «¿La tabla dice cuánto se disolvió o a qué temperatura terminó de disolverse?»", "Pregunta 1 · aviso del libro (media): Ojo: en la realidad el azúcar se disuelve mucho más que el sulfato de cobre. La clave A es la mejor con ESTA tabla, no una verdad química. Qué haces: Es el sello de la pregunta 1. La clave A es la mejor dentro de la tabla, no una verdad química."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 3 y 4<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 3 y 4: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 3<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E2 · ¿Se hunde, flota o queda suspendido?<\/span><\/div><p class=\"sub\">Tres polvos en aceite · el talco que no se separa<\/p><h3 style=\"color:#5B3E96\">Disuelto no es lo mismo que suspendido<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k43\"><span class=\"keychip\" style=\"background:#5B3E96\">C<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 4<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E2 · ¿Se hunde, flota o queda suspendido?<\/span><\/div><p class=\"sub\">Tres polvos en aceite · la afirmación válida<\/p><h3 style=\"color:#5B3E96\">Cuatro reglas contra tres frascos<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k43\"><span class=\"keychip\" style=\"background:#5B3E96\">D<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k43\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué cuenta o qué dato escribieron en el instrumento? Léanmelo con su unidad.»", "Si alguien se traba, pregúntale qué se midió y en qué unidad. Si el instrumento está vacío, vuelve al texto o a la tabla antes que a las opciones."], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Las claves del libro son 3·C y 4·D. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 3 · aviso del libro (atención), solo para ti, no se proyecta: El texto describe «una pasta espesa sin separación visible» y la clave la llama «suspensión estable»; no se sabe qué frasco tiene cada polvo. Qué haces: No cambia la clave C."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#5B3E96\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 2 · ¿Se hunde, flota o queda suspendido?<\/span><\/div><h2>Fondo, medio o superficie<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Tres letreros en la pared, de abajo arriba: FONDO, SUSPENDIDO y SUPERFICIE. El salón es un frasco.<\/li><li>Cada uno recibe una tarjeta de partícula: más o menos densa que el líquido, y grande, mediana o finísima.<\/li><li>Se para bajo el letrero donde quedaría al cabo de un minuto.<\/li><li>El docente pregunta qué dato de la tarjeta lo mandó ahí: la densidad, el tamaño o los dos.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Tarjetas de partícula · tres letreros<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con la tabla o la ecuación en cinco minutos —contar, comparar o seguir a las partículas—, pero con el cuerpo.»"], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Decidir si algo se hunde, flota o queda suspendido con dos datos: su densidad frente al líquido y el tamaño de la partícula. Es el movimiento de las preguntas 2, 3 y 4, y de la segunda del entrenamiento (el corcho en tres líquidos).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 5 y 6<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 5 y 6: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 5<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Compara en igualdad de condiciones<\/span><\/div><p class=\"sub\">Bloques de barro · por qué uno se fragmentó<\/p><h3 style=\"color:#242478\">Dos bloques, una sola diferencia<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k45\"><span class=\"keychip\" style=\"background:#242478\">A<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 6<\/span><span class=\"min\" style=\"--accent:#A82424\">E3 · Ponle nombre a la propiedad<\/span><\/div><p class=\"sub\">Pintura ecológica · cuál conduce la corriente<\/p><h3 style=\"color:#A82424\">El bombillo de prueba<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Qué conduce la electricidad<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k45\"><span class=\"keychip\" style=\"background:#A82424\">B<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k45\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué cuenta o qué dato escribieron en el instrumento? Léanmelo con su unidad.»", "Si alguien se traba, pregúntale qué se midió y en qué unidad. Si el instrumento está vacío, vuelve al texto o a la tabla antes que a las opciones."], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Las claves del libro son 5·A y 6·B. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 6 · Qué conduce la electricidad: Para que pase corriente tiene que haber cargas que se puedan mover. En los metales y en el grafito se mueven electrones. La sal sólida tiene sus iones quietos: no conduce; disuelta en agua, los iones se sueltan y sí conduce. Conducir el calor es otra cosa. Para destrabar: «¿En este material hay algo con carga que se pueda mover?»", "Pregunta 6 · aviso del libro (atención), solo para ti, no se proyecta: El carbón común conduce poco, salvo el grafito; en la aventadora decide la densidad y también la forma de lo que vuela. Qué haces: No cambia las claves B y C."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#A82424\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 3 · Ponle nombre a la propiedad<\/span><\/div><h2>El nombre exacto<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Cada equipo tiene cinco tarjetas: DENSIDAD (g/cm³), MASA (g), PUNTO DE EBULLICIÓN (°C), CONDUCTIVIDAD ELÉCTRICA y MAGNETISMO.<\/li><li>El docente describe sin nombrar: «el aceite queda encima del vinagre», «el cable de cobre lleva la corriente».<\/li><li>Cada equipo levanta la tarjeta de la propiedad que muestra la situación.<\/li><li>Cuenta solo si dice la unidad o qué partícula lo explica; si no, baja la tarjeta.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cinco tarjetas de propiedades por equipo<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con la tabla o la ecuación en cinco minutos —contar, comparar o seguir a las partículas—, pero con el cuerpo.»"], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Ponerle a cada fenómeno el nombre exacto de la propiedad, con su unidad, y no uno que suena parecido. Es el movimiento de las preguntas 6, 7 y 9, y de la tercera del entrenamiento (los títulos de dos columnas de una tabla).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 7 y 8<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 7 y 8: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 7<\/span><span class=\"min\" style=\"--accent:#A82424\">E3 · Ponle nombre a la propiedad<\/span><\/div><p class=\"sub\">Ventilación de granos · qué propiedad hace funcionar el sistema<\/p><h3 style=\"color:#A82424\">Lo que se lleva el aire y lo que se queda<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k47\"><span class=\"keychip\" style=\"background:#A82424\">C<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 8<\/span><span class=\"min\" style=\"--accent:#C9821B\">E4 · Una propiedad, un método de separación<\/span><\/div><p class=\"sub\">Minería artesanal · el siguiente paso para separar<\/p><h3 style=\"color:#C9821B\">Tachar lo que ya falló<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k47\"><span class=\"keychip\" style=\"background:#C9821B\">D<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k47\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué cuenta o qué dato escribieron en el instrumento? Léanmelo con su unidad.»", "Si alguien se traba, pregúntale qué se midió y en qué unidad. Si el instrumento está vacío, vuelve al texto o a la tabla antes que a las opciones."], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Las claves del libro son 7·C y 8·D. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 7 · aviso del libro (atención), solo para ti, no se proyecta: El carbón común conduce poco, salvo el grafito; en la aventadora decide la densidad y también la forma de lo que vuela. Qué haces: No cambia las claves B y C.", "Pregunta 8 · aviso del libro (baja), solo para ti, no se proyecta: Parte de que magnetismo y tamaño «no fueron eficientes», y el texto nunca lo dice. Qué haces: No cambia la clave D."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#C9821B\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 4 · Una propiedad, un método de separación<\/span><\/div><h2>Cada herramienta, su propiedad<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>En la mesa, tarjetas con herramientas: IMÁN, COLADOR, VENTILADOR, EMBUDO DE DECANTACIÓN y FILTRO DE PAPEL.<\/li><li>El docente dice una mezcla inventada: «clips con arroz», «piedritas en harina», «aceite con agua».<\/li><li>Un estudiante escoge la herramienta y nombra la propiedad: «el imán, por el magnetismo».<\/li><li>Si una herramienta ya falló con esa mezcla se tacha, y se pasa a otra propiedad.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cinco tarjetas de herramientas<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con la tabla o la ecuación en cinco minutos —contar, comparar o seguir a las partículas—, pero con el cuerpo.»"], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Unir cada método de separación con la propiedad física que aprovecha, y descartar lo que ya falló. Es el movimiento de las preguntas 8 y 10, y de la cuarta del entrenamiento (qué objeto mueve el carro con el imán).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 9 y 10<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 9 y 10: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 9<\/span><span class=\"min\" style=\"--accent:#A82424\">E3 · Ponle nombre a la propiedad<\/span><\/div><p class=\"sub\">Minería artesanal · la bandeja que vibra<\/p><h3 style=\"color:#A82424\">Centro o borde de la bandeja<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k49\"><span class=\"keychip\" style=\"background:#A82424\">D<\/span> es la clave del libro<\/div><div class=\"aviso sev-aten\" hidden data-grupo=\"k49\"><b>Ojo con esta clave:<\/b> En la clave, «reacción» quiere decir respuesta a la vibración: no hay ninguna reacción química.<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 10<\/span><span class=\"min\" style=\"--accent:#C9821B\">E4 · Una propiedad, un método de separación<\/span><\/div><p class=\"sub\">Minería artesanal · la afirmación válida sobre los métodos<\/p><h3 style=\"color:#C9821B\">El tamiz por dentro<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k49\"><span class=\"keychip\" style=\"background:#C9821B\">B<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k49\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué cuenta o qué dato escribieron en el instrumento? Léanmelo con su unidad.»", "Si alguien se traba, pregúntale qué se midió y en qué unidad. Si el instrumento está vacío, vuelve al texto o a la tabla antes que a las opciones."], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Las claves del libro son 9·D y 10·B. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 9 · aviso del libro (atención): En la clave, «reacción» quiere decir respuesta a la vibración: no hay ninguna reacción química. Qué haces: Aclara la palabra: aquí «reacción» quiere decir respuesta."]}}, {"m": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m4)\">Reto en equipo · 20 min<\/span><span class=\"kicker\">Equipos de tres · cada uno responde en su cuaderno<\/span><\/div><h2>Reto del corte: La mezcla del recreo<\/h2><div class=\"card big edge mt\" style=\"--accent:var(--m4)\"><p class=\"lead\">Cada equipo recibe en papel una mezcla para separar sin agua ni químicos: arena fina, clips, aserrín y piedritas. En doce minutos escriben la propiedad que distingue a cada componente, ordenan los métodos —imán, tamiz, soplar, bandeja que vibra—, dicen qué sale en cada paso y por qué dos métodos solo se comparan con la misma mezcla. Cada uno defiende un paso y escribe la propiedad que aprovecha.<\/p><\/div><div class=\"note mt\" style=\"--accent:var(--m4)\"><b>La defensa:<\/b> tres minutos por equipo, señalando el dato con su unidad, la cuenta o la propiedad que los respalda. «Es que así reacciona» no cuenta.<\/div>", "guia": {"obj": "Que el estudiante defienda su explicación con el dato y la unidad en la mano, y acepte que otro equipo puede ver una variable o una propiedad que él no vio.", "decir": ["Arma equipos de tres y entrega el reto del corte de este momento.", "Exige que cada integrante llegue con su instrumento YA diligenciado individualmente.", "Da tres minutos de defensa por equipo: señalan el dato, la cuenta o la propiedad que los respalda.", "Cierra mostrando qué variable, qué unidad o qué propiedad quedó por fuera en cada propuesta."], "como": "El equipo discute, pero cada uno escribe en SU tarjeta del reto. No se acepta una defensa que diga «es que así reacciona»: se nombra el dato con su unidad, la cuenta o la propiedad.", "apoyo": ["El reto no tiene una sola respuesta correcta: gana el equipo que mejor sostiene la suya con datos. Si dos explicaciones están sostenidas, dilo: eso también es hacer ciencia.", "Si un equipo entrega una sola hoja para los tres, el reto no cuenta. La discusión es compartida; el registro es individual.", "Los retos se resuelven en papel: ninguno se hace con sustancias en el salón.", "Cierra mostrando qué variable, qué unidad o qué propiedad quedó por fuera en cada propuesta."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 1<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Alcohol y éter: mismo peso<\/h3><p>El punto de ebullición y el punto de fusión de un compuesto dependen de diversos factores, como el peso molecular y las fuerzas moleculares que presentan las moléculas entre ellas. Cuanto más fuertes sean las fuerzas intermoleculares, más energía se necesitará para producir un cambio de estado. En la tabla se muestran dos moléculas con la misma fórmula molecular (C₂H₆O) pero con distintas estructuras moleculares y algunas de sus propiedades.<\/p><figure class=\"fig\"><table class=\"tabla\"><thead><tr><th>Compuesto<\/th><th>Peso molecular (g/mol)<\/th><th>Tipo de fuerzas intermoleculares<\/th><\/tr><\/thead><tbody><tr><td>Alcohol: CH₃-CH₂-OH<\/td><td>46<\/td><td>Fuertes<\/td><\/tr><tr><td>Éter: CH₃-O-CH₃<\/td><td>46<\/td><td>Débiles<\/td><\/tr><\/tbody><\/table><\/figure><\/div><div><p class=\"enun\">Teniendo en cuenta la anterior información, ¿cómo debe ser el punto de ebullición y de fusión de estos dos compuestos?<\/p><div class=\"ops\" id=\"icf41\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>El éter debe tener mayor punto de ebullición que el alcohol, pero menor punto de fusión.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>El alcohol debe tener mayor punto de ebullición que el éter, pero menor punto de fusión.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>El alcohol debe tener mayor punto de ebullición y de fusión que el éter.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>El éter debe tener mayor punto de ebullición y de fusión que el alcohol.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf41\" data-k=\"C\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la C.", "Por qué es la C: los dos pesan 46 g/mol, así que la diferencia la pone lo único distinto: las fuerzas entre moléculas, fuertes en el alcohol. Más fuerza pide más energía para cualquier cambio de estado: el alcohol tiene mayor punto de ebullición y también mayor punto de fusión (C). A y D se lo dan al éter; B parte el resultado en dos sin razón. (Datos reales: etanol −114 °C y 78 °C; dimetiléter −141 °C y −24 °C.)", "Comparación justa: el peso es el mismo, así que no puede explicar la diferencia.", "«Cualquier cambio de estado» incluye fundirse: la misma razón vale para los dos puntos."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 2<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>El corcho en tres líquidos<\/h3><p>Un estudiante determinó las densidades y los puntos de ebullición de tres diferentes líquidos, como se muestra en la siguiente tabla.<\/p><figure class=\"fig\"><table class=\"tabla\"><thead><tr><th>Líquido<\/th><th>Punto de ebullición (°C)<\/th><th>Densidad (g/cm³)<\/th><\/tr><\/thead><tbody><tr><td>Acetona<\/td><td>56,3<\/td><td>0,79<\/td><\/tr><tr><td>Agua<\/td><td>100,0<\/td><td>1,00<\/td><\/tr><tr><td>Cloroformo<\/td><td>61,0<\/td><td>1,48<\/td><\/tr><\/tbody><\/table><\/figure><p>El estudiante introduce un corcho cuya densidad es 0,95 g/cm³ en cada uno de los líquidos.<\/p><\/div><div><p class=\"enun\">La figura que mejor representa la situación que observará el estudiante es<\/p><div class=\"opsfig\"><figure class=\"fig\"><svg viewBox=\"0 0 840 300\" role=\"img\" aria-label=\"Cuatro figuras, A a D, con un corcho en tres vasos: acetona, agua y cloroformo\" style=\"font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif\"><text x=\"6\" y=\"20\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"start\" font-weight=\"700\">Figura A<\/text><path d=\"M 78.0 36 L 85.0 112 L 135.0 112 L 142.0 36\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><line x1=\"81.0\" y1=\"54.0\" x2=\"139.0\" y2=\"54.0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><rect x=\"98\" y=\"94\" width=\"24\" height=\"14\" rx=\"3\" fill=\"#E9D5B0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><text x=\"110\" y=\"132\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"middle\">Acetona<\/text><path d=\"M 193.0 36 L 200.0 112 L 250.0 112 L 257.0 36\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><line x1=\"196.0\" y1=\"54.0\" x2=\"254.0\" y2=\"54.0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><rect x=\"213\" y=\"45\" width=\"24\" height=\"14\" rx=\"3\" fill=\"#E9D5B0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><text x=\"225\" y=\"132\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"middle\">Agua<\/text><path d=\"M 308.0 36 L 315.0 112 L 365.0 112 L 372.0 36\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><line x1=\"311.0\" y1=\"54.0\" x2=\"369.0\" y2=\"54.0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><rect x=\"328\" y=\"45\" width=\"24\" height=\"14\" rx=\"3\" fill=\"#E9D5B0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><text x=\"340\" y=\"132\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"middle\">Cloroformo<\/text><text x=\"426\" y=\"20\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"start\" font-weight=\"700\">Figura B<\/text><path d=\"M 498.0 36 L 505.0 112 L 555.0 112 L 562.0 36\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><line x1=\"501.0\" y1=\"54.0\" x2=\"559.0\" y2=\"54.0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><rect x=\"518\" y=\"45\" width=\"24\" height=\"14\" rx=\"3\" fill=\"#E9D5B0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><text x=\"530\" y=\"132\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"middle\">Acetona<\/text><path d=\"M 613.0 36 L 620.0 112 L 670.0 112 L 677.0 36\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><line x1=\"616.0\" y1=\"54.0\" x2=\"674.0\" y2=\"54.0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><rect x=\"633\" y=\"45\" width=\"24\" height=\"14\" rx=\"3\" fill=\"#E9D5B0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><text x=\"645\" y=\"132\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"middle\">Agua<\/text><path d=\"M 728.0 36 L 735.0 112 L 785.0 112 L 792.0 36\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><line x1=\"731.0\" y1=\"54.0\" x2=\"789.0\" y2=\"54.0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><rect x=\"748\" y=\"45\" width=\"24\" height=\"14\" rx=\"3\" fill=\"#E9D5B0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><text x=\"760\" y=\"132\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"middle\">Cloroformo<\/text><text x=\"6\" y=\"170\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"start\" font-weight=\"700\">Figura C<\/text><path d=\"M 78.0 186 L 85.0 262 L 135.0 262 L 142.0 186\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><line x1=\"81.0\" y1=\"204.0\" x2=\"139.0\" y2=\"204.0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><rect x=\"98\" y=\"244\" width=\"24\" height=\"14\" rx=\"3\" fill=\"#E9D5B0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><text x=\"110\" y=\"282\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"middle\">Acetona<\/text><path d=\"M 193.0 186 L 200.0 262 L 250.0 262 L 257.0 186\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><line x1=\"196.0\" y1=\"204.0\" x2=\"254.0\" y2=\"204.0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><rect x=\"213\" y=\"244\" width=\"24\" height=\"14\" rx=\"3\" fill=\"#E9D5B0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><text x=\"225\" y=\"282\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"middle\">Agua<\/text><path d=\"M 308.0 186 L 315.0 262 L 365.0 262 L 372.0 186\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><line x1=\"311.0\" y1=\"204.0\" x2=\"369.0\" y2=\"204.0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><rect x=\"328\" y=\"244\" width=\"24\" height=\"14\" rx=\"3\" fill=\"#E9D5B0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><text x=\"340\" y=\"282\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"middle\">Cloroformo<\/text><text x=\"426\" y=\"170\" font-size=\"15\" fill=\"#1B1F27\" text-anchor=\"start\" font-weight=\"700\">Figura D<\/text><path d=\"M 498.0 186 L 505.0 262 L 555.0 262 L 562.0 186\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><line x1=\"501.0\" y1=\"204.0\" x2=\"559.0\" y2=\"204.0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><rect x=\"518\" y=\"195\" width=\"24\" height=\"14\" rx=\"3\" fill=\"#E9D5B0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><text x=\"530\" y=\"282\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"middle\">Acetona<\/text><path d=\"M 613.0 186 L 620.0 262 L 670.0 262 L 677.0 186\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><line x1=\"616.0\" y1=\"204.0\" x2=\"674.0\" y2=\"204.0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><rect x=\"633\" y=\"244\" width=\"24\" height=\"14\" rx=\"3\" fill=\"#E9D5B0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><text x=\"645\" y=\"282\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"middle\">Agua<\/text><path d=\"M 728.0 186 L 735.0 262 L 785.0 262 L 792.0 186\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><line x1=\"731.0\" y1=\"204.0\" x2=\"789.0\" y2=\"204.0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><rect x=\"748\" y=\"244\" width=\"24\" height=\"14\" rx=\"3\" fill=\"#E9D5B0\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><text x=\"760\" y=\"282\" font-size=\"12\" fill=\"#1B1F27\" text-anchor=\"middle\">Cloroformo<\/text><\/svg><\/figure><\/div><div class=\"ops cuatro\" id=\"icf42\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>Figura A<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>Figura B<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>Figura C<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Figura D<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf42\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la A.", "Por qué es la A: el corcho (0,95 g/cm³) flota en los líquidos más densos que él —agua (1,00) y cloroformo (1,48)— y se hunde en la acetona (0,79). Solo la figura A lo muestra: en el fondo en la acetona y flotando en el agua y en el cloroformo. B lo pone a flotar en los tres; C, hundido en los tres; D, flotando solo en la acetona.", "El punto de ebullición sobra: es un dato para distraer.", "Que ordenen los cuatro números —0,79, 0,95, 1,00 y 1,48— antes de mirar las figuras."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 3<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Las columnas sin título<\/h3><p>Un estudiante desea caracterizar cuatro líquidos en el laboratorio. Para ello, toma las sustancias, mide su volumen, su masa, su punto de ebullición y calcula su densidad. El estudiante registró sus datos en la tabla.<\/p><figure class=\"fig\"><table class=\"tabla\"><thead><tr><th>Sustancia<\/th><th>?<\/th><th>Volumen (mL)<\/th><th>Densidad (g/mL)<\/th><th>?<\/th><\/tr><\/thead><tbody><tr><td>Agua<\/td><td>1,8<\/td><td>1,8<\/td><td>1<\/td><td>100<\/td><\/tr><tr><td>Alcohol etílico<\/td><td>1,2<\/td><td>1,5<\/td><td>0,8<\/td><td>80<\/td><\/tr><tr><td>Ácido clorhídrico<\/td><td>1,12<\/td><td>1<\/td><td>1,12<\/td><td>48<\/td><\/tr><tr><td>Ácido sulfúrico<\/td><td>5,4<\/td><td>2<\/td><td>2,7<\/td><td>337<\/td><\/tr><\/tbody><\/table><\/figure><p>El estudiante olvida colocar el nombre de las columnas 2 y 5.<\/p><\/div><div><p class=\"enun\">Teniendo en cuenta los valores de los cuatro líquidos en estas columnas, ¿cuáles son los títulos correctos para las columnas?<\/p><div class=\"ops\" id=\"icf43\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>Columna 2: punto de ebullición (g); columna 5: masa (°C).<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>Columna 2: masa (g); columna 5: punto de ebullición (°C).<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>Columna 2: punto de ebullición (°C); columna 5: masa (g).<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Columna 2: masa (°C); columna 5: punto de ebullición (g).<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf43\" data-k=\"B\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la B.", "Por qué es la B: la columna 2 es el volumen por la densidad: 1,8 × 1 = 1,8; 1,5 × 0,8 = 1,2; 1 × 1,12 = 1,12; 2 × 2,7 = 5,4. Es la masa, en gramos. En la columna 5 el agua tiene 100: es el punto de ebullición, en °C (B). A y C las invierten; D les cambia las unidades.", "La unidad delata la opción: una masa no se mide en °C ni un punto de ebullición en gramos.", "La tabla le da al ácido sulfúrico una densidad de 2,7 g/mL (la real es 1,84) y al clorhídrico un punto de ebullición de 48 °C. No cambia la clave: es buena excusa para desconfiar de un dato raro.", "Aviso (atención), solo para ti: La tabla le da al ácido sulfúrico una densidad de 2,7 g/mL (la real es 1,84) y al ácido clorhídrico un punto de ebullición de 48 °C. Qué haces: No cambia la clave B. Úsalo: un dato raro se revisa antes de creerle."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 4<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>El carro y el imán<\/h3><p>Un estudiante cuenta con los siguientes objetos: un borrador, una tapa de esfero, una bola de pimpón y una puntilla.<\/p><figure class=\"fig\"><svg viewBox=\"0 0 700 260\" role=\"img\" aria-label=\"Cuatro objetos (borrador, tapa de esfero, pimpón, puntilla) y el carro sobre la mesa con el imán debajo\" style=\"font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif;max-width:640px;margin:0 auto\"><rect x=\"56\" y=\"18\" width=\"68\" height=\"32\" rx=\"4\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><text x=\"90\" y=\"74\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\">Borrador<\/text><rect x=\"218\" y=\"27\" width=\"84\" height=\"14\" rx=\"6\" fill=\"#B9BEC8\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><line x1=\"218.0\" y1=\"27.0\" x2=\"210.0\" y2=\"19.0\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><text x=\"260\" y=\"74\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\">Tapa de esfero<\/text><circle cx=\"430\" cy=\"34\" r=\"17\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><text x=\"430\" y=\"74\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\">Pimpón<\/text><line x1=\"562.0\" y1=\"34.0\" x2=\"632.0\" y2=\"34.0\" stroke=\"#1B1F27\" stroke-width=\"2.4\"/><line x1=\"632.0\" y1=\"25.0\" x2=\"632.0\" y2=\"43.0\" stroke=\"#1B1F27\" stroke-width=\"3\"/><text x=\"600\" y=\"74\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"middle\">Puntilla<\/text><rect x=\"130\" y=\"170\" width=\"460\" height=\"12\" fill=\"#C9CED6\"/><rect x=\"310\" y=\"116\" width=\"120\" height=\"40\" rx=\"4\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><rect x=\"406\" y=\"124\" width=\"18\" height=\"14\" rx=\"2\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><circle cx=\"336\" cy=\"162\" r=\"8\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><circle cx=\"404\" cy=\"162\" r=\"8\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"2\"/><text x=\"415\" y=\"110\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"middle\">Objeto<\/text><rect x=\"350\" y=\"190\" width=\"40\" height=\"60\" rx=\"3\" fill=\"#C9CED6\" stroke=\"#1B1F27\" stroke-width=\"1.8\"/><path d=\"M 230 129 L 260 129 L 260 121 L 280 136 L 260 151 L 260 143 L 230 143 Z\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.6\" stroke-dasharray=\"4,3\"/><path d=\"M 230 213 L 260 213 L 260 205 L 280 220 L 260 235 L 260 227 L 230 227 Z\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.6\" stroke-dasharray=\"4,3\"/><text x=\"450\" y=\"142\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"start\">← Carro de plástico<\/text><text x=\"400\" y=\"226\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"start\">← Imán<\/text><text x=\"130\" y=\"200\" font-size=\"13\" fill=\"#5C6472\" text-anchor=\"start\" font-style=\"italic\">Mesa<\/text><\/svg><\/figure><p>El estudiante quiere mover un carro de plástico colocando un imán, que atrae elementos metálicos, por debajo de una mesa como se muestra en la figura.<\/p><\/div><div><p class=\"enun\">De acuerdo a lo anterior, ¿cuál de los objetos sirve para que el estudiante pueda mover el carro?<\/p><div class=\"ops\" id=\"icf44\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>la puntilla, porque esta presenta propiedades magnéticas.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>la bola de pimpón, porque esta no presenta propiedades magnéticas.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>la tapa de esfero, porque esta no presenta propiedades magnéticas.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>el borrador, porque este presenta propiedades magnéticas.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf44\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la A.", "Por qué es la A: el imán atrae materiales magnéticos como el hierro, y la puntilla es de hierro: puesta en el carro, el imán la arrastra (A). La bola de pimpón y la tapa de esfero no son magnéticas, y justamente por eso no sirven (B y C dan la razón al revés); D le atribuye magnetismo a un borrador.", "El imán no atrae a todos los metales (el aluminio y el cobre no): el enunciado simplifica.", "La propiedad que decide es el magnetismo: es la del imán de la pregunta 3 del libro en la misión 1. ---", "Aviso (atención), solo para ti: El enunciado dice que el imán «atrae elementos metálicos»: no todos (el aluminio y el cobre no). Qué haces: No cambia la clave A."]}}, {"m": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m6)\">Cierre<\/span><span class=\"kicker\">La pregunta de siempre<\/span><\/div><h2>¿En qué se parecía la pregunta Saber 11 a la de tu libro?<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:#242478\"><div class=\"k\">1<\/div><div><b>Compara en igualdad de condiciones<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#5B3E96\"><div class=\"k\">2<\/div><div><b>¿Se hunde, flota o queda suspendido?<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#A82424\"><div class=\"k\">3<\/div><div><b>Ponle nombre a la propiedad<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#C9821B\"><div class=\"k\">4<\/div><div><b>Una propiedad, un método de separación<\/b><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--m6)\"><h3>Antes de salir<\/h3><ol class=\"pasos\"><li>El concepto del día —una propiedad, una ley o una relación entre cantidades—, en «Palabras que me frenaron», con tus palabras.<\/li><li>«Lo que me llevo de esta pregunta».<\/li><li>Tu carita de salida.<\/li><li>La casilla 4 de la portada del área.<\/li><\/ol><\/div><\/div>", "guia": {"obj": "Que el estudiante nombre la estrategia que usó y se lleve un concepto del día —una propiedad, una ley o una relación entre cantidades— escrito en sus propias palabras.", "decir": ["Socializa solo las preguntas que el grupo falló, pidiendo el dato, la cuenta o la propiedad que las resuelve.", "Pide que lean en voz alta su salvavidas: lo mínimo que sí tenían claro.", "Cada uno escribe el concepto del día en la franja «Palabras que me frenaron» de su hoja."], "como": "No dicta la definición. El concepto se escribe como el estudiante lo entendió; si quedó mal entendido, eso se ve en la hoja y se corrige la próxima clase.", "apoyo": ["La palabra nueva no se dicta. Si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase: es mejor que dictarla bien.", "Para el cierre del momento: Las preguntas 8 a 10 son de minería artesanal: separar sin agua ni químicos. Buen cierre para decir que cada propiedad física es una herramienta: el imán, el tamiz, la bandeja que vibra y el viento."]}}];
var MOM = [{"n": 1, "nom": "Activación", "min": 15, "c": "--m1"}, {"n": 2, "nom": "Pregunta problematizadora", "min": 20, "c": "--m2"}, {"n": 3, "nom": "Desarrollo guiado", "min": 35, "c": "--m3"}, {"n": 4, "nom": "Reto en equipo", "min": 20, "c": "--m4"}, {"n": 5, "nom": "Evaluación individual", "min": 20, "c": "--m5"}, {"n": 6, "nom": "Cierre", "min": 10, "c": "--m6"}];
var NOMBRE = document.getElementById("momnom").textContent, SUB = document.getElementById("momsub").textContent;
var $ = function(s){ return document.querySelector(s); };
var wrap = $("#wrap"), stage = $("#stage"), i = 0;
var tBase = 0, tLeft = 0, tOn = false, tick = null;
var elegidas = [];
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function paintClock(){
  var n = $("#tnum");
  if(!tBase){ n.textContent = "—"; n.classList.remove("over"); return; }
  var s = Math.abs(tLeft), mm = Math.floor(s/60), ss = s%60;
  n.textContent = (tLeft<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", tLeft<0);
}
function setTimer(min){
  tBase = min||0; tLeft = tBase*60; tOn = false;
  if(tick){ clearInterval(tick); tick = null; }
  $("#play").textContent = "Iniciar"; paintClock();
}
function toggleTimer(){
  if(!tBase) return;
  tOn = !tOn; $("#play").textContent = tOn ? "Pausar" : "Seguir";
  if(tick){ clearInterval(tick); tick = null; }
  if(tOn) tick = setInterval(function(){ tLeft--; paintClock(); }, 1000);
  paintClock();
}
// cronómetro de la prueba (clase 7): aparte del de la barra, no se reinicia al cambiar de diapositiva
var EX = {base:0, left:0, on:false, t:null, ini:null};
function hhmm(d){ return d.getHours() + ":" + (d.getMinutes()<10?"0":"") + d.getMinutes(); }
function exPaint(){
  var box = wrap.querySelector("[data-examen]"); if(!box) return;
  if(!EX.base){ EX.base = +box.dataset.examen; EX.left = EX.base*60; }
  var s = Math.abs(EX.left), mm = Math.floor(s/60), ss = s%60;
  var n = box.querySelector("[data-exnum]");
  n.textContent = (EX.left<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", EX.left<0);
  box.querySelector("[data-exini]").textContent = EX.ini ? hhmm(EX.ini) : "—";
  box.querySelector("[data-exfin]").textContent = EX.on ? hhmm(new Date(Date.now() + EX.left*1000)) : (EX.ini ? "en pausa" : "—");
  var p = box.querySelector('[data-ex="play"]');
  p.textContent = EX.on ? "Pausar" : (EX.ini ? "Seguir" : "Iniciar la prueba");
}
function exToggle(){
  if(!EX.base) exPaint();
  EX.on = !EX.on;
  if(EX.t){ clearInterval(EX.t); EX.t = null; }
  if(EX.on){ if(!EX.ini) EX.ini = new Date(); EX.t = setInterval(function(){ EX.left--; exPaint(); }, 1000); }
  exPaint();
}
function exReset(){
  if(EX.ini && !window.confirm("¿Volver a poner el cronómetro de la prueba en cero?")) return;
  if(EX.t){ clearInterval(EX.t); EX.t = null; }
  EX.on = false; EX.ini = null; EX.left = EX.base*60; exPaint();
}
// casillas que llena el profe (clase 8): se guardan mientras la página esté abierta
var CAMPOS = {};
function pintaCampos(){
  [].forEach.call(wrap.querySelectorAll("[data-campo]"), function(x){ x.value = CAMPOS[x.dataset.campo] || ""; });
  [].forEach.call(wrap.querySelectorAll("[data-eco]"), function(x){ x.textContent = CAMPOS[x.dataset.eco] || "—"; });
}
function guiaHTML(g){
  if(!g) return '<p class="sub">Sin notas para esta diapositiva.</p>';
  var h = '<div class="gbox"><h4>Objetivo</h4><p>'+esc(g.obj)+'</p></div>';
  if(g.decir && g.decir.length) h += '<div class="gbox"><h4>Qué haces y qué dices</h4><ul>'+
     g.decir.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  if(g.como) h += '<div class="gbox como"><h4>Lo que no haces</h4><p>'+esc(g.como)+'</p></div>';
  if(g.apoyo && g.apoyo.length) h += '<div class="gbox apoyo"><h4>Si Química no es tu fuerte</h4><ul>'+
     g.apoyo.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  return h;
}
function pintaElegidas(){
  var box = document.getElementById("elegidas"); if(!box) return;
  if(!elegidas.length){ box.innerHTML = '<p class="sub">Vuelve a la diapositiva anterior y escoge las cinco.</p>'; return; }
  box.innerHTML = elegidas.map(function(t,k){
    return '<div class="card edge" style="--accent:var(--m'+((k%6)+1)+')"><h3>'+(k+1)+'. '+esc(t)+'</h3>'+
      '<p class="sub">Busca esta pregunta en tu simulacro y en la hoja de taller de la misma estrategia.</p></div>';
  }).join("");
}
function go(n){
  var prev = SC[i];
  i = Math.max(0, Math.min(SC.length-1, n));
  var s = SC[i];
  wrap.innerHTML = s.html;
  wrap.classList.remove("enter"); void wrap.offsetWidth; wrap.classList.add("enter");
  stage.scrollTop = 0;
  var m = s.m!=null ? MOM[s.m] : null;
  $("#momdot").style.background = m ? "var("+m.c+")" : "var(--faint)";
  $("#momdot").textContent = m ? m.n : "·";
  $("#momnom").textContent = m ? m.nom : NOMBRE;
  $("#momsub").textContent = m ? (m.min+" minutos") : SUB;
  var want = s.min!=null ? s.min : (m ? m.min : 0);
  var cambio = !prev || prev===s || prev.m!==s.m || (prev.min||null)!==(s.min||null);
  if(cambio) setTimer(want);
  $("#count").textContent = (i+1)+" / "+SC.length;
  $("#prog i").style.width = (SC.length>1 ? i/(SC.length-1)*100 : 100)+"%";
  $("#guiabody").innerHTML = guiaHTML(s.guia);
  [].forEach.call(wrap.querySelectorAll("[data-pick]"), function(b){
    b.setAttribute("aria-pressed", elegidas.indexOf(b.textContent)>=0 ? "true" : "false"); });
  pintaElegidas();
  pintaCampos();
  exPaint();
  $("#clock").style.visibility = wrap.querySelector("[data-examen]") ? "hidden" : "";   // la prueba tiene su reloj
}
wrap.addEventListener("input", function(e){
  var x = e.target; if(!x.dataset || !x.dataset.campo) return;
  CAMPOS[x.dataset.campo] = x.value;
});
wrap.addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.dataset.ex==="play") exToggle();
  if(b.dataset.ex==="reset") exReset();
  if(b.dataset.show){ var t = document.getElementById(b.dataset.show); if(t) t.hidden = !t.hidden; }
  if(b.dataset.showgrupo){
    var g = wrap.querySelectorAll('[data-grupo="'+b.dataset.showgrupo+'"]'), abrir = g.length && g[0].hidden;
    [].forEach.call(g, function(x){ x.hidden = !abrir; });
    b.textContent = abrir ? "Ocultar las claves" : "Revelar las claves";
  }
  if(b.dataset.clave){
    var box = document.getElementById(b.dataset.clave), ok = box.querySelector('[data-op="'+b.dataset.k+'"]');
    var on = ok && !ok.classList.contains("ok");
    [].forEach.call(box.querySelectorAll(".op"), function(o){ o.classList.remove("ok"); });
    if(on) ok.classList.add("ok");
    b.textContent = on ? "Ocultar la clave" : "Revelar la clave";
  }
  if(b.dataset.tally){ var n = document.getElementById(b.dataset.tally); n.textContent = (+n.textContent||0)+1; }
  if(b.dataset.reset){ [].forEach.call(wrap.querySelectorAll('[id^="'+b.dataset.reset+'"]'), function(x){
    if(x.classList.contains("n")) x.textContent = "0"; }); }
  if(b.dataset.pick!=null){
    var t = b.textContent, k = elegidas.indexOf(t);
    if(k>=0) elegidas.splice(k,1); else if(elegidas.length<5) elegidas.push(t);
    b.setAttribute("aria-pressed", elegidas.indexOf(t)>=0 ? "true" : "false");
  }
});
function setGuia(on){ $("#guia").classList.toggle("open", on); $("#scrim").classList.toggle("on", on);
  $("#gbtn").setAttribute("aria-pressed", on ? "true" : "false"); }
$("#next").addEventListener("click", function(){ go(i+1); });
$("#prev").addEventListener("click", function(){ go(i-1); });
$("#play").addEventListener("click", toggleTimer);
$("#reset").addEventListener("click", function(){ setTimer(tBase); });
$("#gbtn").addEventListener("click", function(){ setGuia(!$("#guia").classList.contains("open")); });
$("#gclose").addEventListener("click", function(){ setGuia(false); });
$("#scrim").addEventListener("click", function(){ setGuia(false); });
document.addEventListener("keydown", function(e){
  var t = e.target.tagName; if(t==="INPUT"||t==="TEXTAREA"||e.target.isContentEditable) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ go(i+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ go(i-1); e.preventDefault(); }
  else if(e.key==="Home"){ go(0); e.preventDefault(); }
  else if(e.key==="End"){ go(SC.length-1); e.preventDefault(); }
  else if(e.key==="g"||e.key==="G"){ setGuia(!$("#guia").classList.contains("open")); }
  else if(e.key==="t"||e.key==="T"){ if(wrap.querySelector("[data-examen]")) exToggle(); else toggleTimer(); }
  else if(e.key==="Escape"){ setGuia(false); }
});
go(0);
})();
</script>
</body>
</html>
