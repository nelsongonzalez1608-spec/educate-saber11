<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Química · Clase 6</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>[hidden]{display:none!important}
:root{
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --text:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --area:#0F7A68; --azul:#1F4E8C; --oro:#B0711A; --morado:#5B3E96; --verde:#2E7A39;
  --m1:#0F7A68; --m2:#1F4E8C; --m3:#3B3BA6; --m4:#5B3E96; --m5:#A82424; --m6:#4A5A70; --rojo:#A82424;
  --ink:#1B1F27; --muted:#5C6472; --faint:#A9B0BB; --line:#E3E7ED; --paper:#FFFFFF; --bg:#F6F4F1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:clamp(16px,1.25vw,21px);line-height:1.5}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
#top{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding:10px clamp(14px,2vw,28px);background:var(--paper);flex-wrap:wrap}
.logo img{height:clamp(28px,2.6vw,40px);display:block}
#mom{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
#momdot{width:clamp(30px,2.4vw,40px);height:clamp(30px,2.4vw,40px);border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;background:var(--faint)}
#momnom{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.2vw,20px)}
#momsub{color:var(--muted);font-size:.85em}
#clock{display:flex;align-items:center;gap:8px}
#tnum{font-family:var(--display);font-weight:800;font-size:clamp(20px,1.8vw,30px);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
#tnum.over{color:var(--area)}
.btn{appearance:none;font:inherit;font-size:.86em;font-weight:600;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.solid{background:var(--area);border-color:var(--area);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#stage{overflow:auto;padding:clamp(18px,3vw,48px) clamp(16px,4vw,72px)}
#wrap{max-width:1500px;margin:0 auto}
#wrap.enter{animation:ent .28s ease-out}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bot{display:flex;align-items:center;gap:12px;padding:10px clamp(14px,2vw,28px);background:var(--paper)}
#prog{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
#prog i{display:block;height:100%;background:var(--area);transition:width .25s}
#count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
#hint{color:var(--faint);font-size:.8em}
@media (max-width:760px){#hint{display:none}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.2vw,68px);line-height:1.05;margin:.2em 0 .25em;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,2.8vw,46px);line-height:1.1;margin:.25em 0 .3em;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:clamp(18px,1.5vw,26px);margin:.1em 0 .4em;line-height:1.2}
p{margin:.35em 0 .6em}
.lead{font-size:1.2em;line-height:1.45;max-width:70ch}
.sub{color:var(--muted)}
.mt{margin-top:clamp(14px,1.8vw,26px)}
.logo-xl img{height:clamp(54px,6vw,96px);margin-bottom:12px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tag,.min,.membrete{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.78em;font-weight:700;letter-spacing:.02em}
.tag{background:var(--ink);color:#fff}
.min{background:var(--accent,var(--area));color:#fff}
.membrete{border:1.5px solid var(--line);color:var(--muted)}
.kicker{color:var(--muted);font-size:.85em;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.grid{display:grid;gap:clamp(12px,1.4vw,22px)}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid>*{min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,1.6vw,24px)}
.card.edge{border-left:6px solid var(--accent,var(--area))}
.card.big .lead{font-size:1.3em}
.step{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px}
.step .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;flex:none}
.note{border-left:5px solid var(--accent,var(--area));background:var(--paper);border-radius:10px;padding:10px 16px;margin-top:12px}
.cita{font-family:var(--display);font-weight:600;line-height:1.35;background:var(--paper);border-left:6px solid var(--area);border-radius:12px;padding:clamp(16px,2vw,30px);margin:18px 0}
.cita.xl{font-size:clamp(24px,2.6vw,44px)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally .n{display:inline-block;min-width:1.6em;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.pasos{margin:.2em 0 0;padding-left:1.3em}.pasos li{margin:.3em 0}
.sello{margin-top:12px;border:2px dashed var(--oro);border-radius:12px;padding:10px 14px;background:#FDF6EA}
.sello b{display:block;color:var(--oro);font-size:.8em;letter-spacing:.06em;text-transform:uppercase}
.clave{margin-top:12px;display:flex;align-items:center;gap:10px;font-weight:600}
.keychip{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:10px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.2em}
.aviso{margin-top:10px;border-radius:10px;padding:10px 14px;background:#FBEFEF;border-left:5px solid var(--area);font-size:.92em}
.aviso.sev-aten{background:#EDF5EE;border-left-color:var(--verde)}
.aviso.sev-medi{background:#FDF5E7;border-left-color:var(--oro)}
.icfes .texto{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.6vw,24px);max-height:62vh;overflow:auto;font-size:.95em}
.enun{font-weight:600;font-size:1.08em}
.ops{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.op .L{flex:none;width:1.8em;height:1.8em;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-family:var(--display);font-weight:800}
.op.ok{border-color:var(--verde);background:#EDF5EE}.op.ok .L{background:var(--verde);color:#fff}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick[aria-pressed="true"]{background:var(--area);border-color:var(--area);color:#fff}
#scrim{position:fixed;inset:0;background:rgba(15,18,24,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#guia{position:fixed;top:0;right:0;height:100%;width:min(520px,92vw);background:var(--paper);box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column;z-index:10}
#guia.open{transform:none}
#guiahead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg)}
#guiabody{overflow:auto;padding:16px 20px 30px;font-size:.92em}
.gbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.gbox h4{margin:0 0 6px;font-family:var(--display);font-size:.8em;letter-spacing:.07em;text-transform:uppercase;color:var(--area)}
.gbox ul{margin:0;padding-left:1.1em}.gbox li{margin:.35em 0}
.gbox.como{background:#F6F7F9}.gbox.como h4{color:var(--muted)}
.gbox.apoyo{background:#FDF6EA;border-color:#EAD9B4}.gbox.apoyo h4{color:var(--oro)}
.examen{background:var(--paper);border:1px solid var(--line);border-left:8px solid var(--area);border-radius:22px;padding:clamp(16px,2.4vw,40px);margin-top:clamp(12px,1.6vw,24px);text-align:center}
.relojxl{font-family:var(--display);font-weight:800;font-size:clamp(96px,17vw,280px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.relojxl.over{color:var(--area)}
.exhoras{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 36px;color:var(--muted);font-size:1.15em;margin-top:10px}
.exhoras b{color:var(--ink);font-variant-numeric:tabular-nums}
.nbig{font-family:var(--display);font-weight:800;font-size:clamp(40px,4vw,64px);line-height:1;color:var(--accent,var(--area))}
.asig{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:8px 0}
.asig .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;flex:none}
.asig label{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted)}
.asig label.w{flex:1;min-width:min(100%,260px)}
.campo{font:inherit;font-size:1.1em;font-weight:700;color:var(--ink);border:none;border-bottom:2px dashed var(--faint);background:transparent;padding:4px 6px;min-width:0;flex:1;outline:none}
.campo.n{width:4.5em;flex:none;text-align:center}
.campo:focus{border-bottom-color:var(--area)}
.nums1{border:1.5px solid var(--line);border-radius:999px;padding:3px 14px;background:var(--paper);font-weight:600;color:var(--muted)}
.nums1 b{color:var(--ink)}
.pides{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:1.08em}
.pide{display:inline-flex;align-items:center;gap:8px}
.chk{display:inline-block;width:20px;height:20px;border:2px solid var(--area);border-radius:4px;background:#fff;flex:none}
.herrs{display:grid;gap:clamp(12px,1.4vw,22px);grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.herr{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--area);border-radius:16px;padding:14px 18px;font-size:1.12em}
.herr svg{flex:none}
[hidden]{display:none!important}
.fig{margin:12px 0}.fig svg{display:block;width:100%;max-width:760px;height:auto}
.tabla{border-collapse:collapse;width:100%;table-layout:fixed;font-size:.86em;line-height:1.35}
.tabla th,.tabla td{border:1px solid var(--line);padding:5px 8px;vertical-align:top;overflow-wrap:anywhere}
.tabla th{background:#EEF4F2;text-align:left}.tabla caption{text-align:left;font-weight:700;padding:0 0 6px}
.fig figcaption,.figcap{font-size:.85em;font-style:italic;margin-top:6px}
.ops.cuatro{grid-template-columns:repeat(4,1fr)}.opsfig svg{max-width:760px}
.aviso{border-left-color:var(--rojo)}.aviso.sev-baja{background:#EEF3FA;border-left-color:var(--azul)}
</style>
</head>

 la prueba de campo, páginas 193 a 196<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m4)\"><h3>Tu cuaderno<\/h3><p class=\"sub\">Páginas 251 a 257<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m6)\"><h3>Hoy<\/h3><p class=\"sub\">120 minutos · 6 momentos · EF · reacciones y energía<\/p><\/div><\/div>", "guia": {"obj": "Que el grupo sepa desde el primer minuto qué va a pasar en estos 120 minutos y qué tiene que tener sobre la mesa.", "decir": ["«Libro abierto, cuaderno cerrado, lápiz. Hoy no les voy a preguntar fórmulas de memoria: les voy a preguntar qué número, con qué unidad, lo dice.»"], "apoyo": ["⚑ Antes del sábado: Las preguntas 5 y 6 enseñan un concepto equivocado: la PVP del gel y el almidón YA son polímeros, y al amasarlos no se forma «un nuevo polímero». Las claves B valen solo dentro del modelo del libro, y en la 6 un estudiante que sepa química puede defender la D. En la 9 faltan las masas molares: Fe = 56 g/mol y O = 16 g/mol.", "Seguridad: las dinámicas son con el cuerpo, tarjetas, cinta y clips; ninguna usa sustancias, fuego ni calor de verdad, y los retos se resuelven en papel. Si alguien propone hacer en el salón el experimento del libro, la respuesta es no.", "Con cuidado: Las preguntas hablan de ácido clorhídrico, hidróxido de sodio y combustibles: son casos para razonar en papel. Nada de eso entra al salón.", "Del libro, para ti: A 3 · B 3 · C 3 · D 1. Reportado a la editorial. No lo digas en clase.", "Los cuatro conceptos que tienes que poder explicar hoy en dos minutos, sin jerga. Si un estudiante sabe más que tú de un tema, déjalo explicar y pide que señale en el texto o en la tabla de dónde lo saca:", "La ecuación es una receta en moles: En 4 Fe + 3 O₂ → 2 Fe₂O₃ los números de adelante dicen cuántos moles de cada uno. Para pasar a gramos se multiplica por la masa molar: Fe₂O₃ = 2 · 56 + 3 · 16 = 160 g/mol.", "Exotérmica y endotérmica: Exotérmica: la reacción suelta calor y el termómetro sube; se escribe con ΔH negativo. Endotérmica: absorbe calor y el termómetro baja; ΔH positivo. La combustión y la neutralización son exotérmicas.", "Velocidad de reacción: Una reacción va más rápido si se calienta, si los trozos son más pequeños (más superficie de contacto), si hay más concentración o si hay un catalizador. Cuando un reactivo se acaba, la reacción se detiene.", "pH: Escala de 0 a 14: menos de 7 es ácido, 7 es neutro y más de 7 es básico. Cuando un alimento se descompone, a menudo se vuelve más ácido y su pH baja.", "Abre esta guía con la tecla G en cada diapositiva: trae lo que dices y, debajo, lo que necesitas saber si Química no es tu área.", "El cronómetro arranca con T y se reinicia solo cuando cambia el momento de la clase."]}}, {"m": null, "html": "<div class=\"eyebrow\"><span class=\"kicker\">Así vamos a trabajar<\/span><\/div><h2>Seis momentos, una sola regla<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:var(--m1)\"><div class=\"k\">1<\/div><div><b>Activación<\/b><span class=\"sub\"> · 15 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m2)\"><div class=\"k\">2<\/div><div><b>Pregunta problematizadora<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m3)\"><div class=\"k\">3<\/div><div><b>Desarrollo guiado<\/b><span class=\"sub\"> · 35 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m4)\"><div class=\"k\">4<\/div><div><b>Reto en equipo<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m5)\"><div class=\"k\">5<\/div><div><b>Evaluación individual<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m6)\"><div class=\"k\">6<\/div><div><b>Cierre<\/b><span class=\"sub\"> · 10 min<\/span><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--area)\"><h3>La regla del cuaderno<\/h3><p class=\"lead\">Si el instrumento está vacío, no lo resolviste: lo adivinaste.<\/p><p>Primero se escribe el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas—, después se marca la opción. Una respuesta correcta con el instrumento en blanco no cuenta como resuelta.<\/p><\/div><\/div>", "guia": {"obj": "Que la regla quede dicha en voz alta antes de cualquier texto.", "decir": ["«La respuesta correcta con el instrumento vacío no cuenta. ¿Por qué? Porque en Química casi todas las opciones suenan técnicas: el que no escribió la cuenta escoge la que suena mejor, no la que dicen los números.»"], "apoyo": ["Si alguien pregunta para qué escribir, la respuesta corta es: lo que separa la opción correcta de las que suenan bien está en un número, una unidad o una fila de la tabla, y eso se pierde si no se escribe.", "Si alguien dice «es una reacción química» o «es por la presión», devuélvele la pregunta: «¿qué viste o qué mediste que te lo dice?»."]}}, {"m": 0, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Activación<\/span><span class=\"kicker\">Cuaderno cerrado<\/span><\/div><h2>¿Qué se observó, qué se midió y con qué unidad, y qué hacen las partículas?<\/h2><blockquote class=\"cita xl\">En el botiquín hay dos bolsas que se activan al apretarlas: una se pone fría y la otra caliente. Las dos traen adentro dos sustancias que se mezclan.<\/blockquote><p class=\"lead\">Tres respuestas antes de cualquier explicación. Todavía no se abre el cuaderno.<\/p><div class=\"ctl\"><button class=\"btn\" data-show=\"pista6\">Mostrar la pista<\/button><\/div><div class=\"note\" id=\"pista6\" hidden style=\"--accent:var(--m1)\"><b>Pista:<\/b> se observó frío o calor; se mediría en °C; en una el calor entra a la reacción (endotérmica) y en la otra sale (exotérmica)<\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno de todos los días con tres preguntas —qué se observó, qué se midió y con qué unidad, y qué hacen las partículas— antes de explicarlo y antes de ver cualquier opción.", "decir": ["Proyecta o lee una observación de dos o tres renglones sin decir de dónde salió.", "Pide tres respuestas, en voz alta o en el tablero: qué se observó, qué se midió y con qué unidad, y qué hacen las partículas.", "Ejecuta la dinámica de apertura según la estrategia del encuentro."], "como": "No explica el fenómeno ni acepta todavía explicaciones. Si alguien dice «es una reacción química», le devuelve la pregunta: «¿qué viste o qué mediste que te lo dice?». El cuaderno sigue cerrado.", "apoyo": ["No expliques el fenómeno ni aceptes todavía explicaciones: primero las tres respuestas. La observación es inventada para la clase: no sale del libro, y nada de ella se hace en el salón.", "La pista existe para el cierre de los 15 minutos, no para el principio: se observó frío o calor; se mediría en °C; en una el calor entra a la reacción (endotérmica) y en la otra sale (exotérmica)."]}}, {"m": 0, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#242478\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 1 · La ecuación es una receta<\/span><\/div><h2>La receta del sánduche<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>En el tablero, una receta como ecuación: 2 panes + 1 queso + 1 jamón → 1 sánduche.<\/li><li>Cada equipo recibe tarjetas —siete panes, cuatro quesos, dos jamones— y arma todos los sánduches que pueda.<\/li><li>Dicen cuántos salieron, qué se acabó primero y qué sobró: lo que se acaba primero detiene todo.<\/li><li>Con la receta doble, comprueban que todo se dobla en la misma proporción.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Tarjetas de panes, quesos y jamones<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante describa un fenómeno de todos los días con tres preguntas —qué se observó, qué se midió y con qué unidad, y qué hacen las partículas— antes de explicarlo y antes de ver cualquier opción.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con la tabla o la ecuación en cinco minutos —contar, comparar o seguir a las partículas—, pero con el cuerpo.»"], "como": "No explica el fenómeno ni acepta todavía explicaciones. Si alguien dice «es una reacción química», le devuelve la pregunta: «¿qué viste o qué mediste que te lo dice?». El cuaderno sigue cerrado.", "apoyo": ["Qué movimiento mental entrena: Leer la ecuación como una receta: los números de adelante dicen cuánto de cada uno, lo que se acaba primero detiene la reacción y, si la receta se dobla, todo se dobla. Es el movimiento de las preguntas 1, 3 y 9, y de la primera del entrenamiento (protones y electrones del ion Mg²⁺).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 1, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m2)\">Pregunta problematizadora<\/span><span class=\"kicker\">Libro abierto en la pregunta modelo<\/span><\/div><h2>Abran el libro en la pregunta 1, página 193<\/h2><p class=\"lead\">Antes de releer el texto o la tabla: ¿cuál creen que es? Levanten la mano.<\/p><div class=\"ctl\"><button class=\"btn tally\" data-tally=\"h6A\">A <span class=\"n\" id=\"h6A\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h6B\">B <span class=\"n\" id=\"h6B\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h6C\">C <span class=\"n\" id=\"h6C\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h6D\">D <span class=\"n\" id=\"h6D\">0<\/span><\/button><button class=\"btn\" data-reset=\"h6\">↺<\/button><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta que gobierna el área<\/h3><p class=\"lead\">¿Qué número, con su unidad, o qué observación respalda eso?<\/p><p class=\"sub\">Nadie justifica con «yo sé que» ni con una palabra técnica suelta: toda respuesta señala un número con su unidad, una fila de la tabla o un punto de la gráfica.<\/p><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta de este momento<\/h3><p class=\"lead\">¿Qué dice la receta, salió o entró el calor, y alcanzan los datos para concluir?<\/p><\/div>", "guia": {"obj": "Que el estudiante compruebe que en Química la respuesta sale del dato con su unidad —del texto, la tabla o la gráfica— y de lo que hacen las partículas, no de la palabra que suena más técnica, usando la pregunta modelo del libro.", "decir": ["Presenta la pregunta modelo del libro y la deja a la vista todo el momento.", "Pide respuestas a mano alzada ANTES de releer el texto o la tabla, y las anota en el tablero.", "Hace la pregunta que gobierna el área: ¿qué número, con su unidad, o qué observación respalda eso?", "Revela la clave solo al final y trabaja por qué cae cada una de las otras tres."], "como": "Regla del momento: nadie justifica con «yo sé que» ni con una palabra técnica suelta. Toda intervención señala un número con su unidad, una fila de la tabla o un punto de la gráfica.", "apoyo": ["La pregunta modelo es la 1 del libro (página 193). El cuaderno se abre en la página 251 solo en «mi primera idea».", "Cuenta las manos tocando cada letra: el número queda en pantalla y sirve para el final del momento, cuando el grupo vea cuántos cambiaron de opinión al volver al texto o a la tabla.", "No digas la clave en este momento: sale en el bloque de las preguntas 1 y 2, después de llenar el instrumento en pantalla, casilla por casilla. Ahí se trabaja por qué cae cada una de las otras tres."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 1 y 2<\/span><span class=\"kicker\">En pantalla, casilla por casilla<\/span><\/div><h2>Preguntas 1 y 2: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 1<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · La ecuación es una receta<\/span><\/div><p class=\"sub\">Metal en ácido clorhídrico · por qué deja de calentar<\/p><h3 style=\"color:#242478\">Dónde se aplana la curva<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k61\"><span class=\"keychip\" style=\"background:#242478\">B<\/span> es la clave del libro<\/div><div class=\"aviso sev-baja\" hidden data-grupo=\"k61\"><b>Ojo con esta clave:<\/b> Errata de la gráfica del libro: en el eje, el «3» debe ser 4.<\/div><\/div><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 2<\/span><span class=\"min\" style=\"--accent:#A82424\">E2 · ¿El calor sale o entra?<\/span><\/div><p class=\"sub\">Gasolina, etanol y biogás · diferencias entre combustibles<\/p><h3 style=\"color:#A82424\">La ficha técnica de tres combustibles<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Por mol o por gramo<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k61\"><span class=\"keychip\" style=\"background:#A82424\">C<\/span> es la clave del libro<\/div><div class=\"aviso sev-medi\" hidden data-grupo=\"k61\"><b>Ojo con esta clave:<\/b> Por mol, el biogás suelta menos energía; por gramo, el metano suelta más que la gasolina. La pregunta se responde por mol, como dice el texto.<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k61\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué cuenta o qué dato escribieron en el instrumento? Léanmelo con su unidad.»", "Si alguien se traba, pregúntale qué se midió y en qué unidad. Si el instrumento está vacío, vuelve al texto o a la tabla antes que a las opciones."], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Las claves del libro son 1·B y 2·C. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 1 · aviso del libro (baja): Errata de la gráfica del libro: en el eje, el «3» debe ser 4. Qué haces: No cambia la clave B. El cuaderno redibuja el eje.", "Pregunta 2 · Por mol o por gramo: Un mol es una cantidad de moléculas, no una masa: un mol de gasolina pesa unos 114 g y uno de metano, 16 g. Por mol, la gasolina suelta más energía; por gramo, el metano suelta más (890 ÷ 16 ≈ 56 kJ/g frente a 5470 ÷ 114 ≈ 48 kJ/g). La pregunta del libro compara por mol. Para destrabar: «¿Comparamos la misma cantidad de moléculas o la misma masa?»", "Pregunta 2 · aviso del libro (media): Por mol, el biogás suelta menos energía; por gramo, el metano suelta más que la gasolina. La pregunta se responde por mol, como dice el texto. Qué haces: Sello de la pregunta 2. Se responde por mol."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 3 y 4<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 3 y 4: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 3<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · La ecuación es una receta<\/span><\/div><p class=\"sub\">Combustión del etanol · moles de CO₂<\/p><h3 style=\"color:#242478\">Sigue a los carbonos del etanol<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k63\"><span class=\"keychip\" style=\"background:#242478\">C<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 4<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E3 · Una conclusión vale lo que valen sus datos<\/span><\/div><p class=\"sub\">El foro de los combustibles · qué conclusión basta<\/p><h3 style=\"color:#5B3E96\">¿Con cuántos criterios se decidió?<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k63\"><span class=\"keychip\" style=\"background:#5B3E96\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k63\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué cuenta o qué dato escribieron en el instrumento? Léanmelo con su unidad.»", "Si alguien se traba, pregúntale qué se midió y en qué unidad. Si el instrumento está vacío, vuelve al texto o a la tabla antes que a las opciones."], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Las claves del libro son 3·C y 4·A. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 3 · aviso del libro (media), solo para ti, no se proyecta: Compara por mol; por gramo, el metano suelta más que la gasolina. Y «libera –5470»: el signo ya dice que sale. Qué haces: Sello de la pregunta 2. Se responde por mol."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#A82424\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 2 · ¿El calor sale o entra?<\/span><\/div><h2>Las manos del calor<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#A82424\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>El docente lee: «la bolsa de calor del botiquín se calienta», «el hielo se derrite en la mano», «el sudor se evapora de la piel».<\/li><li>Si el calor SALE de lo que cambia, manos hacia el frente; si ENTRA, manos al pecho.<\/li><li>Un estudiante dice qué marcaría un termómetro al lado: sube o baja.<\/li><li>En el tablero: sale calor, ΔH negativo; entra, positivo. Se compara cuánto sale por el tamaño del número.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Tablero<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con la tabla o la ecuación en cinco minutos —contar, comparar o seguir a las partículas—, pero con el cuerpo.»"], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Decidir si el calor sale o entra mirando el termómetro y el signo, y comparar cuánto sale por el tamaño del número. Es el movimiento de las preguntas 2 y 8, y de la segunda del entrenamiento (qué azúcar suelta más energía al quemarse).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 5 y 6<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 5 y 6: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 5<\/span><span class=\"min\" style=\"--accent:#C9821B\">E4 · Piezas que se repiten: los polímeros<\/span><\/div><p class=\"sub\">Polímero casero de gel y almidón · qué explica el cambio<\/p><h3 style=\"color:#C9821B\">Del polvo y el gel a la baba que se estira<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Polímero<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k65\"><span class=\"keychip\" style=\"background:#C9821B\">B<\/span> es la clave del libro<\/div><div class=\"aviso sev-alta\" hidden data-grupo=\"k65\"><b>Ojo con esta clave:<\/b> El gel y el almidón ya son polímeros: al amasarlos no nace un polímero nuevo, sus cadenas se enredan y se atraen. Las claves B valen dentro del modelo del libro; en la 6, quien defienda la D con química tiene parte de razón.<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 6<\/span><span class=\"min\" style=\"--accent:#C9821B\">E4 · Piezas que se repiten: los polímeros<\/span><\/div><p class=\"sub\">Polímero y sus componentes · qué relación hay<\/p><h3 style=\"color:#C9821B\">Una cuenta no es un collar<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k65\"><span class=\"keychip\" style=\"background:#C9821B\">B<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k65\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué cuenta o qué dato escribieron en el instrumento? Léanmelo con su unidad.»", "Si alguien se traba, pregúntale qué se midió y en qué unidad. Si el instrumento está vacío, vuelve al texto o a la tabla antes que a las opciones."], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Las claves del libro son 5·B y 6·B. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 5 · Polímero: Una molécula larguísima hecha de una pieza pequeña (el monómero) que se repite, como un collar de cuentas. El almidón y la PVP del gel ya son polímeros. Al amasarlos no nace uno nuevo: sus cadenas se enredan y se atraen, y por eso la mezcla se estira. Para destrabar: «¿Se unieron piezas con enlaces nuevos o solo se enredaron cadenas que ya existían?»", "Pregunta 5 · aviso del libro (alta): El gel y el almidón ya son polímeros: al amasarlos no nace un polímero nuevo, sus cadenas se enredan y se atraen. Las claves B valen dentro del modelo del libro; en la 6, quien defienda la D con química tiene parte de razón. Qué haces: Clave tomada: B en las dos. Es el sello de la pregunta 5. Si alguien defiende la D de la 6 con química, reconócelo."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#5B3E96\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 3 · Una conclusión vale lo que valen sus datos<\/span><\/div><h2>¿Alcanza para concluir?<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>En el tablero: «una estudiante durmió 8 horas y sacó 4,5; un compañero durmió 5 y sacó 3,8».<\/li><li>El docente lee: «dormir más sube la nota», «siempre la sube un punto», «en estos dos casos, quien durmió más sacó más».<\/li><li>Con los dedos, cada uno muestra cuántas mediciones usa cada conclusión; mano abierta si necesitaría muchas más.<\/li><li>Se quedan con la que no pide más datos de los que hay, y nombran otra cosa que pudo cambiar.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Tablero<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con la tabla o la ecuación en cinco minutos —contar, comparar o seguir a las partículas—, pero con el cuerpo.»"], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Pesar una conclusión contra los datos que la sostienen: cuántas mediciones, qué variable cambió y qué palabras se pasan («siempre», «suficiente»). Es el movimiento de las preguntas 4, 7 y 10, y de la tercera del entrenamiento (qué concluir de los tiempos de reacción).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 7 y 8<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 7 y 8: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 7<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E3 · Una conclusión vale lo que valen sus datos<\/span><\/div><p class=\"sub\">Tres muestras que se estiran · ¿la más resistente?<\/p><h3 style=\"color:#5B3E96\">Estirarse no es lo mismo que resistir<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k67\"><span class=\"keychip\" style=\"background:#5B3E96\">D<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#A82424\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 8<\/span><span class=\"min\" style=\"--accent:#A82424\">E2 · ¿El calor sale o entra?<\/span><\/div><p class=\"sub\">Ácido clorhídrico e hidróxido de sodio · por qué se calienta<\/p><h3 style=\"color:#A82424\">El escalón de energía de la neutralización<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Energía de enlace<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k67\"><span class=\"keychip\" style=\"background:#A82424\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k67\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué cuenta o qué dato escribieron en el instrumento? Léanmelo con su unidad.»", "Si alguien se traba, pregúntale qué se midió y en qué unidad. Si el instrumento está vacío, vuelve al texto o a la tabla antes que a las opciones."], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Las claves del libro son 7·D y 8·A. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 7 · aviso del libro (media), solo para ti, no se proyecta: Las tres muestras se prepararon igual: si nada cambió entre ellas, las diferencias son error. Qué haces: No cambia la clave D. Pregunta: ¿qué cambió?", "Pregunta 8 · Energía de enlace: En una reacción unos enlaces se rompen (eso cuesta energía) y otros se forman (eso la libera). Si se libera más de lo que cuesta, sale calor y el termómetro sube: es exotérmica. En la neutralización, H⁺ + OH⁻ → H₂O: formar el agua libera energía. Para destrabar: «¿El termómetro subió o bajó? Entonces, ¿el calor salió o entró?»"]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#C9821B\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 4 · Piezas que se repiten: los polímeros<\/span><\/div><h2>El collar de clips<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Cada equipo encadena veinte clips (o tiras de papel): cada clip es un monómero y el collar, el polímero.<\/li><li>Dicen qué hace el collar que un clip suelto no hacía: se estira, se enreda, se puede jalar.<\/li><li>Dos equipos enredan sus collares sin abrir ningún clip: ¿es un collar nuevo o dos enredados?<\/li><li>El grupo escribe que unir piezas con enlaces nuevos no es lo mismo que enredar cadenas.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Veinte clips o tiras de papel por equipo<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con la tabla o la ecuación en cinco minutos —contar, comparar o seguir a las partículas—, pero con el cuerpo.»"], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Ver el polímero como una pieza que se repite, y separar unir piezas de enredar cadenas que ya existían. Es el movimiento de las preguntas 5 y 6, y de la cuarta del entrenamiento (de dónde salen las piezas del plástico).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 9 y 10<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 9 y 10: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 9<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · La ecuación es una receta<\/span><\/div><p class=\"sub\">Un clavo que se oxida · masa de óxido de hierro<\/p><h3 style=\"color:#242478\">El puente gramos, moles, gramos<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k69\"><span class=\"keychip\" style=\"background:#242478\">A<\/span> es la clave del libro<\/div><div class=\"aviso sev-medi\" hidden data-grupo=\"k69\"><b>Ojo con esta clave:<\/b> El libro no da las masas molares: Fe = 56 g/mol y O = 16 g/mol.<\/div><\/div><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 10<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E3 · Una conclusión vale lo que valen sus datos<\/span><\/div><p class=\"sub\">pH de un queso a tres temperaturas · el análisis pertinente<\/p><h3 style=\"color:#5B3E96\">Tres quesos, tres temperaturas, una tendencia<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k69\"><span class=\"keychip\" style=\"background:#5B3E96\">C<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k69\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —la cuenta con sus unidades, la propiedad, el dibujo de las partículas o la evidencia— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿qué cuenta o qué dato escribieron en el instrumento? Léanmelo con su unidad.»", "Si alguien se traba, pregúntale qué se midió y en qué unidad. Si el instrumento está vacío, vuelve al texto o a la tabla antes que a las opciones."], "como": "No hace la cuenta antes que ellos ni dicta la respuesta. Si un estudiante se traba, le pregunta qué se midió y en qué unidad; si el instrumento está vacío, lo devuelve al texto o a la tabla antes que a las opciones.", "apoyo": ["Las claves del libro son 9·A y 10·C. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 9 · aviso del libro (media): El libro no da las masas molares: Fe = 56 g/mol y O = 16 g/mol. Qué haces: Escríbelas en el tablero: Fe = 56 g/mol y O = 16 g/mol. El cuaderno las da.", "Pregunta 10 · aviso del libro (atención), solo para ti, no se proyecta: Una sola medición por temperatura, y la relación «pH baja = descomposición» la afirman los investigadores, no los datos. Qué haces: No cambia la clave C. Es la estrategia del día."]}}, {"m": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m4)\">Reto en equipo · 20 min<\/span><span class=\"kicker\">Equipos de tres · cada uno responde en su cuaderno<\/span><\/div><h2>Reto del corte: La bolsa de calor del botiquín<\/h2><div class=\"card big edge mt\" style=\"--accent:var(--m4)\"><p class=\"lead\">Una bolsa de calor trae hierro que se oxida con el aire (4 Fe + 3 O₂ → 2 Fe₂O₃). En doce minutos cada equipo calcula cuánto óxido sale de 28 g de hierro (Fe = 56 g/mol, O = 16 g/mol), dice si es exotérmica y qué dato lo prueba, escribe una conclusión que sostiene una sola bolsa y otra que pide muchas, y dice qué pieza se repite en el plástico de la bolsa. (Docente: 40 g; el plástico es polietileno y la pieza, el etileno.)<\/p><\/div><div class=\"note mt\" style=\"--accent:var(--m4)\"><b>La defensa:<\/b> tres minutos por equipo, señalando el dato con su unidad, la cuenta o la propiedad que los respalda. «Es que así reacciona» no cuenta.<\/div>", "guia": {"obj": "Que el estudiante defienda su explicación con el dato y la unidad en la mano, y acepte que otro equipo puede ver una variable o una propiedad que él no vio.", "decir": ["Arma equipos de tres y entrega el reto del corte de este momento.", "Exige que cada integrante llegue con su instrumento YA diligenciado individualmente.", "Da tres minutos de defensa por equipo: señalan el dato, la cuenta o la propiedad que los respalda.", "Cierra mostrando qué variable, qué unidad o qué propiedad quedó por fuera en cada propuesta."], "como": "El equipo discute, pero cada uno escribe en SU tarjeta del reto. No se acepta una defensa que diga «es que así reacciona»: se nombra el dato con su unidad, la cuenta o la propiedad.", "apoyo": ["El reto no tiene una sola respuesta correcta: gana el equipo que mejor sostiene la suya con datos. Si dos explicaciones están sostenidas, dilo: eso también es hacer ciencia.", "Si un equipo entrega una sola hoja para los tres, el reto no cuenta. La discusión es compartida; el registro es individual.", "Los retos se resuelven en papel: ninguno se hace con sustancias en el salón.", "Cierra mostrando qué variable, qué unidad o qué propiedad quedó por fuera en cada propuesta."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 1<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>El ion magnesio<\/h3><p>El magnesio metálico (Mg, número atómico = 12) forma iones Mg²⁺ y aumenta su número de oxidación.<\/p><figure class=\"fig\"><svg viewBox=\"0 0 760 266\" role=\"img\" aria-label=\"Cuatro modelos de capas, A a D, con sus protones en el núcleo y sus electrones\" style=\"font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif\"><rect x=\"4\" y=\"4\" width=\"330\" height=\"32\" rx=\"6\" fill=\"white\" stroke=\"#5C6472\" stroke-width=\"1.4\"/><text x=\"16\" y=\"26\" font-size=\"14\" fill=\"#1B1F27\" text-anchor=\"start\">Convenciones:  ○ = electrones   p⁺ = protones<\/text><text x=\"100\" y=\"66\" font-size=\"17\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">A.<\/text><circle cx=\"100\" cy=\"170\" r=\"20\" fill=\"#EEF0F4\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><text x=\"100\" y=\"175\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">14p⁺<\/text><circle cx=\"100\" cy=\"170\" r=\"42\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"100\" cy=\"170\" r=\"64\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"100\" cy=\"170\" r=\"86\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"100.0\" cy=\"128.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"100.0\" cy=\"212.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"121.9\" cy=\"109.9\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"158.0\" cy=\"143.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"160.1\" cy=\"191.9\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"127.0\" cy=\"228.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"78.1\" cy=\"230.1\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"42.0\" cy=\"197.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"39.9\" cy=\"148.1\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"73.0\" cy=\"112.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"155.4\" cy=\"104.2\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"44.6\" cy=\"235.8\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><text x=\"290\" y=\"66\" font-size=\"17\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">B.<\/text><circle cx=\"290\" cy=\"170\" r=\"20\" fill=\"#EEF0F4\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><text x=\"290\" y=\"175\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">12p⁺<\/text><circle cx=\"290\" cy=\"170\" r=\"42\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"290\" cy=\"170\" r=\"64\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"290\" cy=\"170\" r=\"86\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"290.0\" cy=\"128.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"290.0\" cy=\"212.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"311.9\" cy=\"109.9\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"348.0\" cy=\"143.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"350.1\" cy=\"191.9\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"317.0\" cy=\"228.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"268.1\" cy=\"230.1\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"232.0\" cy=\"197.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"229.9\" cy=\"148.1\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"263.0\" cy=\"112.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><text x=\"480\" y=\"66\" font-size=\"17\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">C.<\/text><circle cx=\"480\" cy=\"170\" r=\"20\" fill=\"#EEF0F4\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><text x=\"480\" y=\"175\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">12p⁺<\/text><circle cx=\"480\" cy=\"170\" r=\"42\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"480\" cy=\"170\" r=\"64\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"480\" cy=\"170\" r=\"86\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"480.0\" cy=\"128.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"480.0\" cy=\"212.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"501.9\" cy=\"109.9\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"538.0\" cy=\"143.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"540.1\" cy=\"191.9\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"507.0\" cy=\"228.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"458.1\" cy=\"230.1\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"422.0\" cy=\"197.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"419.9\" cy=\"148.1\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"453.0\" cy=\"112.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"535.4\" cy=\"104.2\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"424.6\" cy=\"235.8\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><text x=\"670\" y=\"66\" font-size=\"17\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">D.<\/text><circle cx=\"670\" cy=\"170\" r=\"20\" fill=\"#EEF0F4\" stroke=\"#1B1F27\" stroke-width=\"1.6\"/><text x=\"670\" y=\"175\" font-size=\"13\" fill=\"#1B1F27\" text-anchor=\"middle\" font-weight=\"700\">14p⁺<\/text><circle cx=\"670\" cy=\"170\" r=\"42\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"670\" cy=\"170\" r=\"64\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"670\" cy=\"170\" r=\"86\" fill=\"none\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"670.0\" cy=\"128.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"670.0\" cy=\"212.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"691.9\" cy=\"109.9\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"728.0\" cy=\"143.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"730.1\" cy=\"191.9\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"697.0\" cy=\"228.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"648.1\" cy=\"230.1\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"612.0\" cy=\"197.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"609.9\" cy=\"148.1\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><circle cx=\"643.0\" cy=\"112.0\" r=\"5\" fill=\"white\" stroke=\"#1B1F27\" stroke-width=\"1.4\"/><\/svg><\/figure><\/div><div><p class=\"enun\">La figura que representa el ion Mg²⁺ es<\/p><div class=\"ops\" id=\"icf61\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>la figura A.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>la figura B.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>la figura C.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>la figura D.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf61\" data-k=\"B\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la B.", "Por qué es la B: el magnesio tiene 12 protones, y el ion Mg²⁺ perdió dos electrones: le quedan 12 protones y 10 electrones, repartidos 2 y 8 (B). A y D tienen 14 protones, y eso ya no es magnesio; C tiene 12 electrones: es el átomo neutro, no el ion.", "Lo que se pierde se resta: los protones no cambian, solo los electrones.", "La carga 2+ sale de 12 cargas positivas contra 10 negativas."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 2<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>El azúcar que más energía suelta<\/h3><p>La entalpía de una reacción (ΔH) mide el calor cedido o absorbido a presión constante, y se obtiene calculando la diferencia entre la energía de los productos y la energía de los reactivos: ΔH = H productos – H reactivos. La entalpía de combustión es un buen indicador del contenido energético de los azúcares; cuanto más calor se libere, mayor será su contenido energético. Las entalpías de combustión de algunos azúcares (azúcar + O₂ → CO₂ + H₂O) se presentan a continuación:<\/p><figure class=\"fig\"><table class=\"tabla\"><thead><tr><th>Azúcar<\/th><th>Entalpía de combustión (kJ/mol)<\/th><\/tr><\/thead><tbody><tr><td>Glucosa<\/td><td>–2.816<\/td><\/tr><tr><td>Sacarosa<\/td><td>–5.648<\/td><\/tr><tr><td>Fructosa<\/td><td>–2.827<\/td><\/tr><\/tbody><\/table><\/figure><\/div><div><p class=\"enun\">Teniendo en cuenta la información anterior, puede afirmarse que de los tres azúcares<\/p><div class=\"ops\" id=\"icf62\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>la sacarosa tiene mayor contenido energético, porque la reacción de combustión libera más energía.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>la glucosa tiene mayor contenido energético, porque la entalpía de combustión es mayor.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>la sacarosa tiene menor contenido energético, porque la reacción de combustión libera menos energía.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>la glucosa tiene menor contenido energético, porque la entalpía de combustión es menor.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf62\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la A.", "Por qué es la A: la sacarosa libera 5.648 kJ por mol al quemarse, el doble que la glucosa (2.816) y la fructosa (2.827): es la de mayor contenido energético (A). B y C lo dicen al revés. D tiene la primera mitad cierta (la glucosa es la de menor contenido) y una razón ambigua: –2.816 es un número mayor que –2.827, pero libera menos calor.", "Separar el signo del tamaño: el signo dice que el calor sale; el tamaño dice cuánto.", "Es una comparación por mol: por gramo, los tres azúcares dan casi lo mismo (unos 16,5 kJ/g).", "Aviso (atención), solo para ti: La opción D tiene la primera mitad cierta y una razón ambigua según se lea el signo; la comparación es por mol. Qué haces: La A es la única enteramente correcta."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 3<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Temperatura y tamaño del metal<\/h3><p>Un grupo de estudiantes quería conocer qué factores afectan la velocidad de reacción entre un ácido y un metal. Hicieron dos experimentos variando únicamente las condiciones especificadas en la tabla. En cada experimento tomaron 3 tubos de ensayo, a cada uno agregaron 1 mL de ácido y 1 g de metal, y registraron el tiempo de reacción.<\/p><figure class=\"fig\"><table class=\"tabla\"><thead><tr><th><\/th><th>Tubo 1<\/th><th>Tubo 2<\/th><th>Tubo 3<\/th><\/tr><\/thead><tbody><tr><td>Exp. 1 · condición<\/td><td>18 °C<\/td><td>45 °C<\/td><td>70 °C<\/td><\/tr><tr><td>Exp. 1 · reacción completa<\/td><td>115 s<\/td><td>75 s<\/td><td>40 s<\/td><\/tr><tr><td>Exp. 2 · condición<\/td><td>metal completo<\/td><td>partido a la mitad<\/td><td>en trozos pequeños<\/td><\/tr><tr><td>Exp. 2 · reacción completa<\/td><td>115 s<\/td><td>90 s<\/td><td>50 s<\/td><\/tr><\/tbody><\/table><figcaption>Experimento 1: se modifica la temperatura, con el metal completo (sin partir). Experimento 2: se modifica el tamaño del metal, a 18 °C.<\/figcaption><\/figure><\/div><div><p class=\"enun\">De acuerdo con la información anterior, es posible concluir que<\/p><div class=\"ops\" id=\"icf63\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>siempre que haya un incremento en la temperatura el tiempo de reacción se reducirá entre 40 y 75 segundos.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>la velocidad de reacción tiene una mayor variación cuando se modifica el tamaño del metal que cuando se modifica la temperatura.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>la reacción tiene una duración mínima de 50 segundos, si el metal se fracciona en trozos debido al aumento en la superficie de contacto.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>la velocidad de reacción se modifica al variar la temperatura y el tamaño del metal en el sistema.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf63\" data-k=\"D\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la D.", "Por qué es la D: con más temperatura el tiempo baja (115 → 75 → 40 s) y con trozos más pequeños también (115 → 90 → 50 s): las dos cosas cambian la velocidad de la reacción (D). A dice «siempre» y da un rango que tres tubos no sostienen; B es al revés (la temperatura ahorra 75 s y el tamaño, 65 s); C inventa una «duración mínima».", "Pesar cada conclusión contra tres tubos por experimento: lo que dice «siempre» o «mínima» pide más datos.", "Los dos experimentos parten del mismo tubo: metal completo a 18 °C, 115 s."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 4<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Plásticos desde grasas<\/h3><p>Los plásticos son sustancias químicas sintéticas denominadas polímeros, cuya estructura es una cadena larga formada por unidades repetidas de moléculas más pequeñas que se conocen como monómeros. Actualmente, el 99 % de los plásticos se sintetizan por polimerización de monómeros tipo alqueno (moléculas con dobles enlaces). Estos alquenos son obtenidos del petróleo, un recurso no renovable y en vías de agotarse. Para remplazar esta fuente de alquenos, algunos científicos proponen el uso de grasas animales y vegetales, que con luz ultravioleta se pueden transformar en alquenos.<\/p><\/div><div><p class=\"enun\">Según el texto, el uso de materias primas como grasas animales y vegetales supone una ventaja para la producción de plásticos, porque<\/p><div class=\"ops\" id=\"icf64\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>se puede lograr una producción renovable de estas materias primas mediante la implementación de cultivos y granjas.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>al usar grasas animales y vegetales se podría obtener un nuevo polímero que incorpore monómeros de distinta estructura en su cadena.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>al usar grasas animales y vegetales, se incrementaría la cantidad de petróleo en las reservas.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>las grasas animales y vegetales constituyen recursos que son originados por la naturaleza.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf64\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas tipo Saber 11, con situaciones que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Qué número lo decide?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la A.", "Por qué es la A: el texto dice que hoy los alquenos salen del petróleo, un recurso no renovable; las grasas animales y vegetales se producen en cultivos y granjas, así que se pueden renovar (A). B habla de un polímero nuevo que el texto no menciona; C es falsa (no aumenta el petróleo); D es cierta, pero no es una ventaja: el petróleo también lo originó la naturaleza.", "D es la trampa: es verdadera, pero no responde la pregunta.", "El original trae una tabla de polímeros comunes que no hace falta para responder: se omitió."]}}, {"m": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m6)\">Cierre<\/span><span class=\"kicker\">La pregunta de siempre<\/span><\/div><h2>¿En qué se parecía la pregunta Saber 11 a la de tu libro?<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:#242478\"><div class=\"k\">1<\/div><div><b>La ecuación es una receta<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#A82424\"><div class=\"k\">2<\/div><div><b>¿El calor sale o entra?<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#5B3E96\"><div class=\"k\">3<\/div><div><b>Una conclusión vale lo que valen sus datos<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#C9821B\"><div class=\"k\">4<\/div><div><b>Piezas que se repiten: los polímeros<\/b><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--m6)\"><h3>Antes de salir<\/h3><ol class=\"pasos\"><li>El concepto del día —una propiedad, una ley o una relación entre cantidades—, en «Palabras que me frenaron», con tus palabras.<\/li><li>«Lo que me llevo de esta pregunta».<\/li><li>Tu carita de salida.<\/li><li>La casilla 6 de la portada del área.<\/li><\/ol><\/div><\/div>", "guia": {"obj": "Que el estudiante nombre la estrategia que usó y se lleve un concepto del día —una propiedad, una ley o una relación entre cantidades— escrito en sus propias palabras.", "decir": ["Socializa solo las preguntas que el grupo falló, pidiendo el dato, la cuenta o la propiedad que las resuelve.", "Pide que lean en voz alta su salvavidas: lo mínimo que sí tenían claro.", "Cada uno escribe el concepto del día en la franja «Palabras que me frenaron» de su hoja."], "como": "No dicta la definición. El concepto se escribe como el estudiante lo entendió; si quedó mal entendido, eso se ve en la hoja y se corrige la próxima clase.", "apoyo": ["La palabra nueva no se dicta. Si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase: es mejor que dictarla bien.", "Para el cierre del momento: La pregunta 2 compara combustibles por mol; por gramo, el metano suelta más energía que la gasolina. La lección de cierre del área: una conclusión depende de los datos que de verdad usa y de la unidad con que se compara."]}}];
var MOM = [{"n": 1, "nom": "Activación", "min": 15, "c": "--m1"}, {"n": 2, "nom": "Pregunta problematizadora", "min": 20, "c": "--m2"}, {"n": 3, "nom": "Desarrollo guiado", "min": 35, "c": "--m3"}, {"n": 4, "nom": "Reto en equipo", "min": 20, "c": "--m4"}, {"n": 5, "nom": "Evaluación individual", "min": 20, "c": "--m5"}, {"n": 6, "nom": "Cierre", "min": 10, "c": "--m6"}];
var NOMBRE = document.getElementById("momnom").textContent, SUB = document.getElementById("momsub").textContent;
var $ = function(s){ return document.querySelector(s); };
var wrap = $("#wrap"), stage = $("#stage"), i = 0;
var tBase = 0, tLeft = 0, tOn = false, tick = null;
var elegidas = [];
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function paintClock(){
  var n = $("#tnum");
  if(!tBase){ n.textContent = "—"; n.classList.remove("over"); return; }
  var s = Math.abs(tLeft), mm = Math.floor(s/60), ss = s%60;
  n.textContent = (tLeft<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", tLeft<0);
}
function setTimer(min){
  tBase = min||0; tLeft = tBase*60; tOn = false;
  if(tick){ clearInterval(tick); tick = null; }
  $("#play").textContent = "Iniciar"; paintClock();
}
function toggleTimer(){
  if(!tBase) return;
  tOn = !tOn; $("#play").textContent = tOn ? "Pausar" : "Seguir";
  if(tick){ clearInterval(tick); tick = null; }
  if(tOn) tick = setInterval(function(){ tLeft--; paintClock(); }, 1000);
  paintClock();
}
// cronómetro de la prueba (clase 7): aparte del de la barra, no se reinicia al cambiar de diapositiva
var EX = {base:0, left:0, on:false, t:null, ini:null};
function hhmm(d){ return d.getHours() + ":" + (d.getMinutes()<10?"0":"") + d.getMinutes(); }
function exPaint(){
  var box = wrap.querySelector("[data-examen]"); if(!box) return;
  if(!EX.base){ EX.base = +box.dataset.examen; EX.left = EX.base*60; }
  var s = Math.abs(EX.left), mm = Math.floor(s/60), ss = s%60;
  var n = box.querySelector("[data-exnum]");
  n.textContent = (EX.left<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", EX.left<0);
  box.querySelector("[data-exini]").textContent = EX.ini ? hhmm(EX.ini) : "—";
  box.querySelector("[data-exfin]").textContent = EX.on ? hhmm(new Date(Date.now() + EX.left*1000)) : (EX.ini ? "en pausa" : "—");
  var p = box.querySelector('[data-ex="play"]');
  p.textContent = EX.on ? "Pausar" : (EX.ini ? "Seguir" : "Iniciar la prueba");
}
function exToggle(){
  if(!EX.base) exPaint();
  EX.on = !EX.on;
  if(EX.t){ clearInterval(EX.t); EX.t = null; }
  if(EX.on){ if(!EX.ini) EX.ini = new Date(); EX.t = setInterval(function(){ EX.left--; exPaint(); }, 1000); }
  exPaint();
}
function exReset(){
  if(EX.ini && !window.confirm("¿Volver a poner el cronómetro de la prueba en cero?")) return;
  if(EX.t){ clearInterval(EX.t); EX.t = null; }
  EX.on = false; EX.ini = null; EX.left = EX.base*60; exPaint();
}
// casillas que llena el profe (clase 8): se guardan mientras la página esté abierta
var CAMPOS = {};
function pintaCampos(){
  [].forEach.call(wrap.querySelectorAll("[data-campo]"), function(x){ x.value = CAMPOS[x.dataset.campo] || ""; });
  [].forEach.call(wrap.querySelectorAll("[data-eco]"), function(x){ x.textContent = CAMPOS[x.dataset.eco] || "—"; });
}
function guiaHTML(g){
  if(!g) return '<p class="sub">Sin notas para esta diapositiva.</p>';
  var h = '<div class="gbox"><h4>Objetivo</h4><p>'+esc(g.obj)+'</p></div>';
  if(g.decir && g.decir.length) h += '<div class="gbox"><h4>Qué haces y qué dices</h4><ul>'+
     g.decir.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  if(g.como) h += '<div class="gbox como"><h4>Lo que no haces</h4><p>'+esc(g.como)+'</p></div>';
  if(g.apoyo && g.apoyo.length) h += '<div class="gbox apoyo"><h4>Si Química no es tu fuerte</h4><ul>'+
     g.apoyo.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  return h;
}
function pintaElegidas(){
  var box = document.getElementById("elegidas"); if(!box) return;
  if(!elegidas.length){ box.innerHTML = '<p class="sub">Vuelve a la diapositiva anterior y escoge las cinco.</p>'; return; }
  box.innerHTML = elegidas.map(function(t,k){
    return '<div class="card edge" style="--accent:var(--m'+((k%6)+1)+')"><h3>'+(k+1)+'. '+esc(t)+'</h3>'+
      '<p class="sub">Busca esta pregunta en tu simulacro y en la hoja de taller de la misma estrategia.</p></div>';
  }).join("");
}
function go(n){
  var prev = SC[i];
  i = Math.max(0, Math.min(SC.length-1, n));
  var s = SC[i];
  wrap.innerHTML = s.html;
  wrap.classList.remove("enter"); void wrap.offsetWidth; wrap.classList.add("enter");
  stage.scrollTop = 0;
  var m = s.m!=null ? MOM[s.m] : null;
  $("#momdot").style.background = m ? "var("+m.c+")" : "var(--faint)";
  $("#momdot").textContent = m ? m.n : "·";
  $("#momnom").textContent = m ? m.nom : NOMBRE;
  $("#momsub").textContent = m ? (m.min+" minutos") : SUB;
  var want = s.min!=null ? s.min : (m ? m.min : 0);
  var cambio = !prev || prev===s || prev.m!==s.m || (prev.min||null)!==(s.min||null);
  if(cambio) setTimer(want);
  $("#count").textContent = (i+1)+" / "+SC.length;
  $("#prog i").style.width = (SC.length>1 ? i/(SC.length-1)*100 : 100)+"%";
  $("#guiabody").innerHTML = guiaHTML(s.guia);
  [].forEach.call(wrap.querySelectorAll("[data-pick]"), function(b){
    b.setAttribute("aria-pressed", elegidas.indexOf(b.textContent)>=0 ? "true" : "false"); });
  pintaElegidas();
  pintaCampos();
  exPaint();
  $("#clock").style.visibility = wrap.querySelector("[data-examen]") ? "hidden" : "";   // la prueba tiene su reloj
}
wrap.addEventListener("input", function(e){
  var x = e.target; if(!x.dataset || !x.dataset.campo) return;
  CAMPOS[x.dataset.campo] = x.value;
});
wrap.addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.dataset.ex==="play") exToggle();
  if(b.dataset.ex==="reset") exReset();
  if(b.dataset.show){ var t = document.getElementById(b.dataset.show); if(t) t.hidden = !t.hidden; }
  if(b.dataset.showgrupo){
    var g = wrap.querySelectorAll('[data-grupo="'+b.dataset.showgrupo+'"]'), abrir = g.length && g[0].hidden;
    [].forEach.call(g, function(x){ x.hidden = !abrir; });
    b.textContent = abrir ? "Ocultar las claves" : "Revelar las claves";
  }
  if(b.dataset.clave){
    var box = document.getElementById(b.dataset.clave), ok = box.querySelector('[data-op="'+b.dataset.k+'"]');
    var on = ok && !ok.classList.contains("ok");
    [].forEach.call(box.querySelectorAll(".op"), function(o){ o.classList.remove("ok"); });
    if(on) ok.classList.add("ok");
    b.textContent = on ? "Ocultar la clave" : "Revelar la clave";
  }
  if(b.dataset.tally){ var n = document.getElementById(b.dataset.tally); n.textContent = (+n.textContent||0)+1; }
  if(b.dataset.reset){ [].forEach.call(wrap.querySelectorAll('[id^="'+b.dataset.reset+'"]'), function(x){
    if(x.classList.contains("n")) x.textContent = "0"; }); }
  if(b.dataset.pick!=null){
    var t = b.textContent, k = elegidas.indexOf(t);
    if(k>=0) elegidas.splice(k,1); else if(elegidas.length<5) elegidas.push(t);
    b.setAttribute("aria-pressed", elegidas.indexOf(t)>=0 ? "true" : "false");
  }
});
function setGuia(on){ $("#guia").classList.toggle("open", on); $("#scrim").classList.toggle("on", on);
  $("#gbtn").setAttribute("aria-pressed", on ? "true" : "false"); }
$("#next").addEventListener("click", function(){ go(i+1); });
$("#prev").addEventListener("click", function(){ go(i-1); });
$("#play").addEventListener("click", toggleTimer);
$("#reset").addEventListener("click", function(){ setTimer(tBase); });
$("#gbtn").addEventListener("click", function(){ setGuia(!$("#guia").classList.contains("open")); });
$("#gclose").addEventListener("click", function(){ setGuia(false); });
$("#scrim").addEventListener("click", function(){ setGuia(false); });
document.addEventListener("keydown", function(e){
  var t = e.target.tagName; if(t==="INPUT"||t==="TEXTAREA"||e.target.isContentEditable) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ go(i+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ go(i-1); e.preventDefault(); }
  else if(e.key==="Home"){ go(0); e.preventDefault(); }
  else if(e.key==="End"){ go(SC.length-1); e.preventDefault(); }
  else if(e.key==="g"||e.key==="G"){ setGuia(!$("#guia").classList.contains("open")); }
  else if(e.key==="t"||e.key==="T"){ if(wrap.querySelector("[data-examen]")) exToggle(); else toggleTimer(); }
  else if(e.key==="Escape"){ setGuia(false); }
});
go(0);
})();
</script>
</body>
</html>
