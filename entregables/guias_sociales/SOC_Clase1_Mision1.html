<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sociales y Ciudadanas · Clase 1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --text:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --area:#C9821B; --azul:#1F4E8C; --oro:#B0711A; --morado:#5B3E96; --verde:#2E7A39;
  --m1:#C9821B; --m2:#1F4E8C; --m3:#3B3BA6; --m4:#5B3E96; --m5:#A82424; --m6:#2E7A39;
  --ink:#1B1F27; --muted:#5C6472; --faint:#A9B0BB; --line:#E3E7ED; --paper:#FFFFFF; --bg:#F6F4F1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:clamp(16px,1.25vw,21px);line-height:1.5}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
#top{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding:10px clamp(14px,2vw,28px);background:var(--paper);flex-wrap:wrap}
.logo img{height:clamp(28px,2.6vw,40px);display:block}
#mom{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
#momdot{width:clamp(30px,2.4vw,40px);height:clamp(30px,2.4vw,40px);border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;background:var(--faint)}
#momnom{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.2vw,20px)}
#momsub{color:var(--muted);font-size:.85em}
#clock{display:flex;align-items:center;gap:8px}
#tnum{font-family:var(--display);font-weight:800;font-size:clamp(20px,1.8vw,30px);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
#tnum.over{color:var(--area)}
.btn{appearance:none;font:inherit;font-size:.86em;font-weight:600;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.solid{background:var(--area);border-color:var(--area);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#stage{overflow:auto;padding:clamp(18px,3vw,48px) clamp(16px,4vw,72px)}
#wrap{max-width:1500px;margin:0 auto}
#wrap.enter{animation:ent .28s ease-out}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bot{display:flex;align-items:center;gap:12px;padding:10px clamp(14px,2vw,28px);background:var(--paper)}
#prog{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
#prog i{display:block;height:100%;background:var(--area);transition:width .25s}
#count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
#hint{color:var(--faint);font-size:.8em}
@media (max-width:760px){#hint{display:none}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.2vw,68px);line-height:1.05;margin:.2em 0 .25em;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,2.8vw,46px);line-height:1.1;margin:.25em 0 .3em;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:clamp(18px,1.5vw,26px);margin:.1em 0 .4em;line-height:1.2}
p{margin:.35em 0 .6em}
.lead{font-size:1.2em;line-height:1.45;max-width:70ch}
.sub{color:var(--muted)}
.mt{margin-top:clamp(14px,1.8vw,26px)}
.logo-xl img{height:clamp(54px,6vw,96px);margin-bottom:12px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tag,.min,.membrete{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.78em;font-weight:700;letter-spacing:.02em}
.tag{background:var(--ink);color:#fff}
.min{background:var(--accent,var(--area));color:#fff}
.membrete{border:1.5px solid var(--line);color:var(--muted)}
.kicker{color:var(--muted);font-size:.85em;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.grid{display:grid;gap:clamp(12px,1.4vw,22px)}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid>*{min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,1.6vw,24px)}
.card.edge{border-left:6px solid var(--accent,var(--area))}
.card.big .lead{font-size:1.3em}
.step{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px}
.step .k{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;flex:none}
.note{border-left:5px solid var(--accent,var(--area));background:var(--paper);border-radius:10px;padding:10px 16px;margin-top:12px}
.cita{font-family:var(--display);font-weight:600;line-height:1.35;background:var(--paper);border-left:6px solid var(--area);border-radius:12px;padding:clamp(16px,2vw,30px);margin:18px 0}
.cita.xl{font-size:clamp(24px,2.6vw,44px)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tally .n{display:inline-block;min-width:1.6em;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.pasos{margin:.2em 0 0;padding-left:1.3em}.pasos li{margin:.3em 0}
.sello{margin-top:12px;border:2px dashed var(--oro);border-radius:12px;padding:10px 14px;background:#FDF6EA}
.sello b{display:block;color:var(--oro);font-size:.8em;letter-spacing:.06em;text-transform:uppercase}
.clave{margin-top:12px;display:flex;align-items:center;gap:10px;font-weight:600}
.keychip{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:10px;color:#fff;font-family:var(--display);font-weight:800;font-size:1.2em}
.aviso{margin-top:10px;border-radius:10px;padding:10px 14px;background:#FBEFEF;border-left:5px solid var(--area);font-size:.92em}
.aviso.sev-aten{background:#EDF5EE;border-left-color:var(--verde)}
.aviso.sev-medi{background:#FDF5E7;border-left-color:var(--oro)}
.icfes .texto{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.6vw,24px);max-height:62vh;overflow:auto;font-size:.95em}
.enun{font-weight:600;font-size:1.08em}
.ops{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.op .L{flex:none;width:1.8em;height:1.8em;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-family:var(--display);font-weight:800}
.op.ok{border-color:var(--verde);background:#EDF5EE}.op.ok .L{background:var(--verde);color:#fff}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick[aria-pressed="true"]{background:var(--area);border-color:var(--area);color:#fff}
#scrim{position:fixed;inset:0;background:rgba(15,18,24,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#guia{position:fixed;top:0;right:0;height:100%;width:min(520px,92vw);background:var(--paper);box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column;z-index:10}
#guia.open{transform:none}
#guiahead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg)}
#guiabody{overflow:auto;padding:16px 20px 30px;font-size:.92em}
.gbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.gbox h4{margin:0 0 6px;font-family:var(--display);font-size:.8em;letter-spacing:.07em;text-transform:uppercase;color:var(--area)}
.gbox ul{margin:0;padding-left:1.1em}.gbox li{margin:.35em 0}
.gbox.como{background:#F6F7F9}.gbox.como h4{color:var(--muted)}
.gbox.apoyo{background:#FDF6EA;border-color:#EAD9B4}.gbox.apoyo h4{color:var(--oro)}
[hidden]{display:none!important}
</style>
</head>

ass=\"sub\">Las diez preguntas de la prueba de campo, páginas 336 a 339<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m4)\"><h3>Tu cuaderno<\/h3><p class=\"sub\">Páginas 97 a 103<\/p><\/div><div class=\"card edge\" style=\"--accent:var(--m6)\"><h3>Hoy<\/h3><p class=\"sub\">120 minutos · 6 momentos · PS · pensamiento social<\/p><\/div><\/div>", "guia": {"obj": "Que el grupo sepa desde el primer minuto qué va a pasar en estos 120 minutos y qué tiene que tener sobre la mesa.", "decir": ["«Libro abierto, cuaderno cerrado, lápiz. Hoy no les voy a preguntar qué opinan: les voy a preguntar qué dice el caso.»"], "apoyo": ["⚑ Antes del sábado: Dos textos de esta misión nombran al presidente en ejercicio (preguntas 1 y 5). Se trabajan como lectura del argumento, no como opinión sobre el personaje. No agregues ejemplos ni casos con nombres de la política.", "Del libro, para ti: El banco no trae una pregunta oficial limpia de efectos sobre dimensiones: la estrategia 3 no aparece en el entrenamiento ICFES. Dale tiempo completo a las preguntas 3, 6 y 9 del taller.", "Si el curso se desvía al debate político, la frase que lo devuelve es: «esa es tu opinión y vale, pero no entra en esta pregunta».", "Los cuatro conceptos que tienes que poder explicar hoy en dos minutos, sin jerga. Si un estudiante sabe más que tú de un tema, déjalo explicar y pide que señale en el caso de dónde lo saca:", "La Constitución de 1991: Reemplazó la de 1886. Definió a Colombia como Estado social de derecho, democracia participativa y país pluriétnico, y creó la tutela. Para la pregunta 1 basta saber que se convocó por una crisis de las instituciones.", "Acción afirmativa · art. 13: La igualdad tiene que ser real, no solo de papel: el Estado puede dar más a quien partió de atrás. Una beca para colegios públicos no es un premio al mérito puro ni un regalo igual para todos.", "El sistema de salud: El Estado recauda y gira la plata (ADRES), las EPS afilian y administran, las IPS atienden. En la pregunta 8 la tensión es quién administra la plata, no si hay que atender.", "Pueblos indígenas y territorio: Los resguardos son de propiedad colectiva y no se venden (art. 63). Antes de explotar recursos en ellos hay que consultar a la comunidad: es la consulta previa.", "Abre esta guía con la tecla G en cada diapositiva: trae lo que dices y, debajo, lo que necesitas saber si Sociales no es tu área.", "El cronómetro arranca con T y se reinicia solo cuando cambia el momento de la clase."]}}, {"m": null, "html": "<div class=\"eyebrow\"><span class=\"kicker\">Así vamos a trabajar<\/span><\/div><h2>Seis momentos, una sola regla<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:var(--m1)\"><div class=\"k\">1<\/div><div><b>Activación<\/b><span class=\"sub\"> · 15 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m2)\"><div class=\"k\">2<\/div><div><b>Pregunta problematizadora<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m3)\"><div class=\"k\">3<\/div><div><b>Desarrollo guiado<\/b><span class=\"sub\"> · 35 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m4)\"><div class=\"k\">4<\/div><div><b>Reto en equipo<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m5)\"><div class=\"k\">5<\/div><div><b>Evaluación individual<\/b><span class=\"sub\"> · 20 min<\/span><\/div><\/div><div class=\"step\" style=\"--accent:var(--m6)\"><div class=\"k\">6<\/div><div><b>Cierre<\/b><span class=\"sub\"> · 10 min<\/span><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--area)\"><h3>La regla del cuaderno<\/h3><p class=\"lead\">Si el instrumento está vacío, no analizaste: opinaste.<\/p><p>Primero se escribe el instrumento —quién dice qué, qué principio, qué efecto—, después se marca la opción. Una respuesta correcta con el instrumento en blanco no cuenta como resuelta.<\/p><\/div><\/div>", "guia": {"obj": "Que la regla quede dicha en voz alta antes de cualquier texto.", "decir": ["«La respuesta correcta con el instrumento vacío no cuenta. ¿Por qué? Porque en Sociales casi todas las opciones suenan justas: el que no escribió quién dice qué escoge la que más le gusta, no la que dice el caso.»"], "apoyo": ["Si alguien pregunta para qué escribir, la respuesta corta es: lo que separa la opción correcta de las que suenan bien está en el caso, y el caso se olvida si no se escribe.", "Si alguien dice «eso está mal», devuélvele la pregunta: «¿mal para quién?». En Sociales no se califica la opinión: se califica si sale del caso."]}}, {"m": 0, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m1)\">Activación<\/span><span class=\"kicker\">Cuaderno cerrado<\/span><\/div><h2>¿Quién gana, quién pierde y quién decide?<\/h2><blockquote class=\"cita xl\">Desde el lunes, el bus del colegio ya no entra a la vereda: da la vuelta en la carretera principal. La rectoría dice que el camino está en mal estado.<\/blockquote><p class=\"lead\">Tres nombres antes de cualquier opinión. Todavía no se abre el cuaderno.<\/p><div class=\"ctl\"><button class=\"btn\" data-show=\"pista1\">Mostrar la pista<\/button><\/div><div class=\"note\" id=\"pista1\" hidden style=\"--accent:var(--m1)\"><b>Pista:<\/b> decide la rectoría, pierden los de la vereda, y lo que se toca es el acceso a la educación<\/div>", "guia": {"obj": "Que el estudiante arme un mapa de actores —quién gana, quién pierde, quién decide— sobre un caso corto, antes de ver cualquier opción y antes de opinar.", "decir": ["Proyecta o lee un caso de dos o tres renglones sin decir de dónde salió.", "Pide tres nombres, en voz alta o en el tablero: quién gana, quién pierde y quién decide.", "Ejecuta la dinámica de apertura según la estrategia del encuentro."], "como": "No da su opinión sobre el caso ni deja que la clase arranque opinando. Si alguien dice «eso está mal», le devuelve la pregunta: «¿mal para quién?». El cuaderno sigue cerrado.", "apoyo": ["No des tu opinión sobre el caso ni dejes que la clase arranque opinando. Si alguien dice «eso está mal», pregúntale «¿mal para quién?». El caso es inventado para la clase: no sale del libro ni de una noticia, y no tiene nombres propios.", "La pista existe para el cierre de los 15 minutos, no para el principio: decide la rectoría, pierden los de la vereda, y lo que se toca es el acceso a la educación."]}}, {"m": 0, "min": 8, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#242478\">Dinámica · 8 min<\/span><span class=\"kicker\">Entrena la estrategia 1 · Quién dice qué y por qué<\/span><\/div><h2>Tres sillas, tres razones<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Tres sillas al frente con un letrero cada una: VECINOS, ALCALDÍA y COMERCIANTES.<\/li><li>El docente lee seis frases de un caso corto, sin decir quién dijo cada una.<\/li><li>Un estudiante lleva cada frase a la silla de quien la dijo y la deja ahí.<\/li><li>Para que se quede, otro dice el «porque» de ese actor con palabras del caso.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Tres sillas · seis frases en tarjetas<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante arme un mapa de actores —quién gana, quién pierde, quién decide— sobre un caso corto, antes de ver cualquier opción y antes de opinar.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el caso en cinco minutos —poner a cada actor, efecto o derecho en su lugar—, pero con el cuerpo.»"], "como": "No da su opinión sobre el caso ni deja que la clase arranque opinando. Si alguien dice «eso está mal», le devuelve la pregunta: «¿mal para quién?». El cuaderno sigue cerrado.", "apoyo": ["Qué movimiento mental entrena: Atribuir cada afirmación a su actor y a su razón antes de comparar. Es el movimiento de las preguntas 2, 5 y 8, y de la primera del ICFES (los motivos de la discriminación).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 1, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m2)\">Pregunta problematizadora<\/span><span class=\"kicker\">Libro abierto en la pregunta modelo<\/span><\/div><h2>Abran el libro en la pregunta 1, página 336<\/h2><p class=\"lead\">Antes de releer el caso: ¿cuál creen que es? Levanten la mano.<\/p><div class=\"ctl\"><button class=\"btn tally\" data-tally=\"h1A\">A <span class=\"n\" id=\"h1A\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h1B\">B <span class=\"n\" id=\"h1B\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h1C\">C <span class=\"n\" id=\"h1C\">0<\/span><\/button><button class=\"btn tally\" data-tally=\"h1D\">D <span class=\"n\" id=\"h1D\">0<\/span><\/button><button class=\"btn\" data-reset=\"h1\">↺<\/button><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta que gobierna el área<\/h3><p class=\"lead\">¿Quién dice eso en el caso, y desde dónde?<\/p><p class=\"sub\">Nadie justifica con «yo pienso que» ni con lo que vio en las noticias: toda respuesta nombra un actor del caso o un derecho, un artículo o un principio.<\/p><\/div><div class=\"card big edge mt\" style=\"--accent:var(--m2)\"><h3>La pregunta de este momento<\/h3><p class=\"lead\">¿Qué principio de la Constitución está detrás de lo que pide la gente en este caso?<\/p><\/div>", "guia": {"obj": "Que el estudiante compruebe que en Sociales la respuesta sale del caso y de la Constitución, no de su simpatía política, usando la pregunta modelo del libro.", "decir": ["Presenta la pregunta modelo del libro y la deja a la vista todo el momento.", "Pide respuestas a mano alzada ANTES de releer el caso, y las anota en el tablero.", "Hace la pregunta que gobierna el área: ¿quién dice eso en el caso, y desde dónde?", "Revela la clave solo al final y trabaja por qué cae cada una de las otras tres."], "como": "Regla del momento: nadie justifica con «yo pienso que» ni con lo que vio en las noticias. Toda intervención nombra un actor del caso o un derecho, un artículo o un principio concreto.", "apoyo": ["La pregunta modelo es la 1 del libro (página 336). El cuaderno se abre en la página 97 solo en «mi primera idea».", "Cuenta las manos tocando cada letra: el número queda en pantalla y sirve para el final del momento, cuando el grupo vea cuántos cambiaron de opinión al volver al caso.", "No digas la clave en este momento: sale en el bloque de las preguntas 1 y 2, después de llenar el instrumento en pantalla, casilla por casilla. Ahí se trabaja por qué cae cada una de las otras tres.", "El caso de la pregunta 1 está en la conversación pendiente con la Gerencia sobre la política viva. Se lee el argumento, no al personaje: si el salón se va a opinar, devuélvelo al caso. En pantalla no sale ningún nombre: está en el libro."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 1 y 2<\/span><span class=\"kicker\">En pantalla, casilla por casilla<\/span><\/div><h2>Preguntas 1 y 2: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 1<\/span><span class=\"min\" style=\"--accent:#5B3E96\">E4 · Lo de antes explica lo de ahora<\/span><\/div><p class=\"sub\">Una propuesta de Constituyente (2024) frente a la Constitución de 1991<\/p><h3 style=\"color:#5B3E96\">Para comparar dos momentos, escribe el argumento de cada uno<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>La Constituyente de 1991<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k11\"><span class=\"keychip\" style=\"background:#5B3E96\">A<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 2<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Quién dice qué y por qué<\/span><\/div><p class=\"sub\">Visas rechazadas · quién explica la causa<\/p><h3 style=\"color:#242478\">Te piden dos cosas a la vez: un actor y una causa<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k11\"><span class=\"keychip\" style=\"background:#242478\">D<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k11\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —los actores, el derecho, las dimensiones o el antes y el después— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿quién dice qué en el caso? Léanme lo que escribieron en el instrumento.»", "Si alguien se traba, pregúntale a quién le pasa algo en el caso. Si el instrumento está vacío, vuelve al caso antes que a las opciones."], "como": "No resume el caso ni da su lectura política. Si un estudiante se traba, le pregunta a quién le pasa algo en el caso; si el instrumento está vacío, lo devuelve al caso antes que a las opciones.", "apoyo": ["Las claves del libro son 1·A y 2·D. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 1 · La Constituyente de 1991: Una asamblea elegida por voto popular que reemplazó la Constitución de 1886. Se convocó en 1990, con el país en plena violencia y desconfianza en las instituciones; la empujó un movimiento estudiantil, la «séptima papeleta». Para destrabar: «¿Qué crisis había antes de 1991, y quién dice hoy que hay una parecida?»", "Pregunta 1 · La Asamblea Nacional Constituyente de 1991: El caso de 2024 solo se puede analizar si el curso sabe qué pasó en 1991. Lo mínimo: La crisis que venía antes. Finales de los ochenta: asesinato de tres candidatos presidenciales, narcoterrorismo, un Congreso que no lograba reformar la Constitución de 1886 porque ella misma hacía la reforma casi imposible. Cómo se convocó. No salió del Congreso: salió de la Séptima Papeleta, una papeleta extra que los estudiantes universitarios pidieron depositar en las elecciones de marzo de 1990. La Corte Suprema avaló después la convocatoria. El argumento de entonces, que es el que la pregunta pide comparar: las vías institucionales ordinarias estaban bloqueadas, y por eso había que acudir al constituyente primario, es decir, al pueblo. Qué cambió. Estado social de derecho, tutela, Corte Constitucional, elección popular de alcaldes y gobernadores, reconocimiento de Colombia como país pluriétnico. El punto pedagógico no es la efeméride: es que el argumento de 2024 se parece al de 1991, y de ahí que la pregunta sea de la estrategia 4 («lo de antes explica lo de ahora») y no de opinión.", "Pregunta 1 · aviso del libro (alta), solo para ti, no se proyecta: Las dos nombran al presidente en ejercicio: la 1 por su propuesta de Constituyente (2024) y la 5 por una declaración de 1997 sobre los U'wa. Está en la decisión pendiente de la Gerencia. Qué haces: Se lee el argumento, no al personaje. Si el salón se va a opinar, devuélvelo al renglón."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 3 y 4<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 3 y 4: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 3<\/span><span class=\"min\" style=\"--accent:#C9821B\">E3 · Si pasa esto, qué pasa después<\/span><\/div><p class=\"sub\">Restricciones a la pesca industrial · qué pasaría<\/p><h3 style=\"color:#C9821B\">Te piden un efecto en dos dimensiones, no en una<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k13\"><span class=\"keychip\" style=\"background:#C9821B\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#30843C\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 4<\/span><span class=\"min\" style=\"--accent:#30843C\">E2 · El principio que hay detrás<\/span><\/div><p class=\"sub\">Becas por puntaje Saber 11 · qué principio la sostiene<\/p><h3 style=\"color:#30843C\">Igualdad no es darle lo mismo a todos<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Acción afirmativa<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k13\"><span class=\"keychip\" style=\"background:#30843C\">B<\/span> es la clave del libro<\/div><div class=\"aviso sev-aten\" hidden data-grupo=\"k13\"><b>Ojo con esta clave:<\/b> El enunciado ya nombra el concepto —discriminación positiva o acción afirmativa—: lo que pregunta es para qué sirve, no cómo se llama.<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k13\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —los actores, el derecho, las dimensiones o el antes y el después— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿quién dice qué en el caso? Léanme lo que escribieron en el instrumento.»", "Si alguien se traba, pregúntale a quién le pasa algo en el caso. Si el instrumento está vacío, vuelve al caso antes que a las opciones."], "como": "No resume el caso ni da su lectura política. Si un estudiante se traba, le pregunta a quién le pasa algo en el caso; si el instrumento está vacío, lo devuelve al caso antes que a las opciones.", "apoyo": ["Las claves del libro son 3·B y 4·B. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 4 · Acción afirmativa: El artículo 13 pide que la igualdad sea «real y efectiva»: el Estado puede favorecer a grupos discriminados o marginados. No es un privilegio: compensa un punto de partida desigual. Para destrabar: «¿Este grupo partió del mismo lugar que los demás?»", "Pregunta 4 · La acción afirmativa (o discriminación positiva): Tratar distinto a quien partió de atrás, para que la igualdad sea real y no solo formal. No es un privilegio ni una excepción incómoda: es el principio que sostiene las becas por puntaje para estudiantes de estratos bajos, los cupos para población con discapacidad, las cuotas de género. La confusión que hay que desarmar en el tablero: «pero entonces no es igualdad». Sí lo es, de la segunda clase. Igualdad formal es la misma regla para todos. Igualdad material es el mismo punto de llegada. Cuando los puntos de partida son distintos, la misma regla para todos conserva la desigualdad. El instrumento del cuaderno dibuja tres personas de distinta estatura sobre cajas: a la izquierda, una caja para cada una (lo mismo para todos); a la derecha, las cajas repartidas según lo que cada una necesita para alcanzar la misma altura. Dos de las opciones de la pregunta describen el dibujo de la izquierda.", "Pregunta 4 · aviso del libro (atención): El enunciado ya nombra el concepto —discriminación positiva o acción afirmativa—: lo que pregunta es para qué sirve, no cómo se llama. Qué haces: Usa el sello: la igualdad real y no solo formal es lo que separa la B de la D."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#30843C\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 2 · El principio que hay detrás<\/span><\/div><h2>Del hecho al artículo<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#30843C\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Cinco carteles en la pared: IGUALDAD, PARTICIPACIÓN, DIGNIDAD, EXPRESIÓN y EDUCACIÓN.<\/li><li>El docente lee un hecho corto del colegio o del barrio.<\/li><li>Cada estudiante camina al cartel del principio que lo sostiene.<\/li><li>Para quedarse, dice qué se está pidiendo en el hecho, no de qué tema es.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cinco carteles · cinta<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —los actores, el derecho, las dimensiones o el antes y el después— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el caso en cinco minutos —poner a cada actor, efecto o derecho en su lugar—, pero con el cuerpo.»"], "como": "No resume el caso ni da su lectura política. Si un estudiante se traba, le pregunta a quién le pasa algo en el caso; si el instrumento está vacío, lo devuelve al caso antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Ir del hecho al principio por lo que se pide, no por el tema. Es el movimiento de las preguntas 4, 7 y 10, y de la segunda y la cuarta del ICFES.", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 5 y 6<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 5 y 6: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 5<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Quién dice qué y por qué<\/span><\/div><p class=\"sub\">Una declaración de 1997 sobre los U&#x27;wa · qué entiende por progreso<\/p><h3 style=\"color:#242478\">El propio autor ordena las dos riquezas en el tiempo<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k15\"><span class=\"keychip\" style=\"background:#242478\">A<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 6<\/span><span class=\"min\" style=\"--accent:#C9821B\">E3 · Si pasa esto, qué pasa después<\/span><\/div><p class=\"sub\">Territorios ancestrales · qué integra lo social y lo ambiental<\/p><h3 style=\"color:#C9821B\">Pasa cada opción por las dos columnas<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Servicios ecosistémicos y autonomía territorial<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k15\"><span class=\"keychip\" style=\"background:#C9821B\">C<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k15\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —los actores, el derecho, las dimensiones o el antes y el después— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿quién dice qué en el caso? Léanme lo que escribieron en el instrumento.»", "Si alguien se traba, pregúntale a quién le pasa algo en el caso. Si el instrumento está vacío, vuelve al caso antes que a las opciones."], "como": "No resume el caso ni da su lectura política. Si un estudiante se traba, le pregunta a quién le pasa algo en el caso; si el instrumento está vacío, lo devuelve al caso antes que a las opciones.", "apoyo": ["Las claves del libro son 5·A y 6·C. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 5 · aviso del libro (alta), solo para ti, no se proyecta: Las dos nombran al presidente en ejercicio: la 1 por su propuesta de Constituyente (2024) y la 5 por una declaración de 1997 sobre los U'wa. Está en la decisión pendiente de la Gerencia. Qué haces: Se lee el argumento, no al personaje. Si el salón se va a opinar, devuélvelo al renglón.", "Pregunta 6 · Servicios ecosistémicos y autonomía territorial: Lo que un ecosistema le da a la gente sin cobrar: agua, suelo fértil, clima. La autonomía territorial indígena es el derecho de un pueblo a gobernar su territorio según sus usos, dentro de la Constitución. Para destrabar: «Si se protege ese territorio, ¿qué gana la comunidad y qué gana el país?»", "Pregunta 6 · Dos términos que el enunciado usa sin explicar: Servicios ecosistémicos. Lo que un ecosistema le da a la gente, aunque nadie lo facture: agua limpia, suelo fértil, polinización, regulación del clima, control de inundaciones. El páramo que surte de agua a una ciudad presta un servicio ecosistémico; si se destruye, la ciudad paga la planta de tratamiento. Autonomía territorial indígena. La Constitución de 1991 reconoce a los territorios indígenas como entidades con gobierno propio: sus autoridades administran, aplican justicia dentro de su jurisdicción y deben ser consultadas previamente cuando un proyecto los afecte. No es una concesión: es un reconocimiento constitucional. Lo que hace que esta pregunta sea «integradora» es que las dos cosas se sostienen mutuamente: el territorio conserva el ecosistema y el ecosistema sostiene la cultura."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#C9821B\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 3 · Si pasa esto, qué pasa después<\/span><\/div><h2>Un pie en cada lado<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Una línea de cinta en el piso: a un lado SOCIAL y al otro ECONÓMICO.<\/li><li>El docente anuncia una causa y lee efectos posibles, uno por uno.<\/li><li>Si el efecto toca una dimensión, el estudiante se para en ese lado; si toca las dos, con un pie en cada lado.<\/li><li>Solo cuenta si el efecto sale de la causa anunciada: el grupo lo comprueba en voz alta.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cinta en el piso<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —los actores, el derecho, las dimensiones o el antes y el después— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el caso en cinco minutos —poner a cada actor, efecto o derecho en su lugar—, pero con el cuerpo.»"], "como": "No resume el caso ni da su lectura política. Si un estudiante se traba, le pregunta a quién le pasa algo en el caso; si el instrumento está vacío, lo devuelve al caso antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Buscar el efecto que toca las dos dimensiones que pide el enunciado y que empieza en la causa dada. Es el movimiento de las preguntas 3, 6 y 9.", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 7 y 8<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 7 y 8: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#30843C\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 7<\/span><span class=\"min\" style=\"--accent:#30843C\">E2 · El principio que hay detrás<\/span><\/div><p class=\"sub\">Gobierno Escolar en Medellín · qué principio lo respalda<\/p><h3 style=\"color:#30843C\">Mira qué están pidiendo, no de qué tema es<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k17\"><span class=\"keychip\" style=\"background:#30843C\">C<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#242478\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 8<\/span><span class=\"min\" style=\"--accent:#242478\">E1 · Quién dice qué y por qué<\/span><\/div><p class=\"sub\">Reforma a la salud · dónde chocan pacientes y EPS<\/p><h3 style=\"color:#242478\">Dos posturas chocan en una sola pregunta<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"sello\"><b>Alto · aquí entra el profe<\/b><span>Cómo funciona el sistema de salud<\/span><\/div><div class=\"clave\" hidden data-grupo=\"k17\"><span class=\"keychip\" style=\"background:#242478\">A<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k17\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —los actores, el derecho, las dimensiones o el antes y el después— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿quién dice qué en el caso? Léanme lo que escribieron en el instrumento.»", "Si alguien se traba, pregúntale a quién le pasa algo en el caso. Si el instrumento está vacío, vuelve al caso antes que a las opciones."], "como": "No resume el caso ni da su lectura política. Si un estudiante se traba, le pregunta a quién le pasa algo en el caso; si el instrumento está vacío, lo devuelve al caso antes que a las opciones.", "apoyo": ["Las claves del libro son 7·C y 8·A. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque.", "Pregunta 8 · Cómo funciona el sistema de salud: Desde la Ley 100 de 1993, el Estado recauda y gira la plata (hoy la ADRES), las EPS afilian y administran, y las IPS —hospitales y clínicas— atienden. La reforma discute quién administra esa plata. Para destrabar: «¿Quién manejaría la plata con la reforma, y quién la maneja hoy?»", "Pregunta 8 · Qué es una EPS y cómo funciona el sistema de salud hoy: Sin este mapa la pregunta es ilegible. En tres piezas: 1. Quién recauda. Los aportes de trabajadores y empleadores, más los recursos del Estado para el régimen subsidiado, entran a un fondo único (la ADRES). 2. Quién administra. Las EPS (Entidades Promotoras de Salud) reciben por cada persona afiliada un monto anual (la UPC) y con eso deben garantizarle la atención: afilian, autorizan, contratan la red y pagan. 3. Quién atiende. Las IPS: hospitales, clínicas, laboratorios, consultorios. La reforma discute precisamente el punto 2: si ese papel de administrador del dinero debe seguir existiendo tal como está. Ahí es donde chocan el paciente que reclama atención y la EPS que responde por la sostenibilidad financiera."]}}, {"m": 2, "min": 6, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:#5B3E96\">Dinámica · 6 min<\/span><span class=\"kicker\">Entrena la estrategia 4 · Lo de antes explica lo de ahora<\/span><\/div><h2>Antes y ahora en el piso<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#5B3E96\"><h3>Cómo se hace<\/h3><ol class=\"pasos\"><li>Una línea en el piso con dos marcas: HACE DIEZ AÑOS y HOY.<\/li><li>Cada equipo recibe tarjetas con lo que se decía en cada momento para pedir un cambio en el colegio.<\/li><li>Las ponen sobre su marca y unen con cinta las que usan el mismo argumento.<\/li><li>Gana el equipo que dice en una frase qué argumento se repite.<\/li><\/ol><\/div><div class=\"card\"><h3>Qué vas a necesitar<\/h3><p>Cinta · tarjetas por equipo<\/p><\/div><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —los actores, el derecho, las dimensiones o el antes y el después— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Esto no es recreo: es la misma operación que van a hacer con el caso en cinco minutos —poner a cada actor, efecto o derecho en su lugar—, pero con el cuerpo.»"], "como": "No resume el caso ni da su lectura política. Si un estudiante se traba, le pregunta a quién le pasa algo en el caso; si el instrumento está vacío, lo devuelve al caso antes que a las opciones.", "apoyo": ["Qué movimiento mental entrena: Comparar dos momentos por el argumento de cada uno, no por las fechas. Es el movimiento de la pregunta 1 y de la tercera del ICFES (los plebiscitos de 1886 y 1991).", "La regla para aprobar cualquier dinámica: si no puedes decir qué paso de la estrategia está ejercitando, es recreo, no clase."]}}, {"m": 2, "min": 7, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m3)\">Desarrollo guiado · preguntas 9 y 10<\/span><span class=\"kicker\">En el cuaderno, cada uno el suyo<\/span><\/div><h2>Preguntas 9 y 10: primero el instrumento, después la opción<\/h2><div class=\"grid c2 mt\"><div class=\"card edge\" style=\"--accent:#C9821B\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 9<\/span><span class=\"min\" style=\"--accent:#C9821B\">E3 · Si pasa esto, qué pasa después<\/span><\/div><p class=\"sub\">Cese al fuego · qué efecto integra las dos dimensiones<\/p><h3 style=\"color:#C9821B\">Un efecto tiene que empezar por la causa que te dan<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k19\"><span class=\"keychip\" style=\"background:#C9821B\">B<\/span> es la clave del libro<\/div><\/div><div class=\"card edge\" style=\"--accent:#30843C\"><div class=\"eyebrow\"><span class=\"membrete\">Libro · pregunta 10<\/span><span class=\"min\" style=\"--accent:#30843C\">E2 · El principio que hay detrás<\/span><\/div><p class=\"sub\">Alimentación escolar · del hecho al derecho vulnerado<\/p><h3 style=\"color:#30843C\">Un análisis integral nombra el derecho y lo que le pasa a la gente<\/h3><p>Llena el instrumento de tu cuaderno antes de mirar las opciones.<\/p><div class=\"clave\" hidden data-grupo=\"k19\"><span class=\"keychip\" style=\"background:#30843C\">C<\/span> es la clave del libro<\/div><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-showgrupo=\"k19\">Revelar las claves<\/button><\/div>", "guia": {"obj": "Que el estudiante escriba el instrumento —los actores, el derecho, las dimensiones o el antes y el después— antes de mirar las opciones, y deje por escrito de dónde lo sacó.", "decir": ["«Antes de marcar: ¿quién dice qué en el caso? Léanme lo que escribieron en el instrumento.»", "Si alguien se traba, pregúntale a quién le pasa algo en el caso. Si el instrumento está vacío, vuelve al caso antes que a las opciones."], "como": "No resume el caso ni da su lectura política. Si un estudiante se traba, le pregunta a quién le pasa algo en el caso; si el instrumento está vacío, lo devuelve al caso antes que a las opciones.", "apoyo": ["Las claves del libro son 9·B y 10·C. No las reveles hasta que todos tengan el instrumento escrito: el botón es para el cierre del bloque."]}}, {"m": 3, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m4)\">Reto en equipo · 20 min<\/span><span class=\"kicker\">Equipos de tres · cada uno responde en su cuaderno<\/span><\/div><h2>Reto del corte: El parque de la alcaldía<\/h2><div class=\"card big edge mt\" style=\"--accent:var(--m4)\"><p class=\"lead\">Cada equipo de tres trabaja el caso de la actividad de aula del libro: la alcaldía planea un parque; unos vecinos lo apoyan, otros temen perder parqueaderos y un grupo pide que se piense en niños y adultos mayores. En doce minutos arman el mapa de actores —quién gana, quién pierde, quién decide—, nombran el principio constitucional en juego y escriben un efecto en dos dimensiones. Exponen señalando el actor que respalda cada parte.<\/p><\/div><div class=\"note mt\" style=\"--accent:var(--m4)\"><b>La defensa:<\/b> tres minutos por equipo, señalando en el caso el actor, el derecho o el renglón que los respalda. «Es que así es» no cuenta.<\/div>", "guia": {"obj": "Que el estudiante defienda su análisis con el caso en la mano y acepte que otro equipo puede ver un actor o una dimensión que él no vio.", "decir": ["Arma equipos de tres y entrega el reto del corte de este momento.", "Exige que cada integrante llegue con su instrumento YA diligenciado individualmente.", "Da tres minutos de defensa por equipo: señalan el actor, el derecho o el renglón que los respalda.", "Cierra mostrando qué actor o qué dimensión quedó por fuera en cada propuesta."], "como": "El equipo discute, pero cada uno escribe en SU tarjeta del reto. No se acepta una defensa que diga «es que así es»: se nombra quién, qué derecho o qué parte del caso.", "apoyo": ["El reto no tiene una sola respuesta correcta: gana el equipo que mejor sostiene la suya con el caso. Si dos análisis están sostenidos, dilo: eso también es pensar socialmente.", "Si un equipo entrega una sola hoja para los tres, el reto no cuenta. La discusión es compartida; el registro es individual.", "Cierra mostrando qué actor o qué dimensión quedó por fuera en cada propuesta."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta oficial ICFES · Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 1<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>El testimonio de la mujer desplazada<\/h3><p>Palabras de una mujer de la Costa Pacífica, desplazada en Bogotá:<\/p><p>Me discriminan… por ser desplazada y por ser negra […] porque yo fui a muchas empresas con la hoja de vida, cumplía con todo pero… «para Usted no hay trabajo». […] Cuando llegamos a buscar la pieza no nos arrendaban por ser negros.<\/p><\/div><div><p class=\"enun\">Los tipos de discriminación que se hacen evidentes, en este caso, son:<\/p><div class=\"ops\" id=\"icf11\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>Discriminación racial, por condición social y por lugar de procedencia.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>Discriminación sexual, por condición económica y por discapacidad.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>Discriminación racial, por creencias y por condiciones sociales.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>Discriminación social, por origen étnico y sexual.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf11\" data-k=\"A\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas reales del ICFES, con casos que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Quién dice qué, y desde dónde?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la A.", "⚑ Pendiente: confirmar fuente (ASED). Esta pregunta sale del compilado ASED, que dice haber concebido sus preguntas: no es de un cuadernillo del ICFES. Nelson decide si se reemplaza; mientras tanto, no la presentes como «del ICFES».", "La pregunta no se resuelve resumiendo: se resuelve contando. Ella nombra tres motivos distintos —ser negra, ser desplazada, venir de la Costa Pacífica— y la opción correcta trae esos tres y ninguno más.", "Tres opciones meten motivos que ella nunca nombró: creencias, discapacidad, sexo. Son formas de discriminación que existen, pero no están en este testimonio.", "La regla general, que sirve para toda la prueba: si una opción trae un elemento de más, se cae entera. No importa que lo demás esté bien."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta oficial ICFES · Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 2<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Limitar, pero no suspender<\/h3><p>Artículo 213 de la Constitución, resumido:<\/p><p>En caso de grave perturbación del orden público […] el Presidente de la República, con la firma de todos los ministros, podrá declarar el Estado de Conmoción Interior. […] Durante este período, el ejecutivo tiene la facultad de limitar (más no suspender) algunos derechos y libertades ciudadanas.<\/p><\/div><div><p class=\"enun\">En el texto anterior se dice que el presidente puede «limitar» mas no «suspender» algunas libertades y derechos ciudadanos, porque de acuerdo con nuestra Constitución política, Colombia<\/p><div class=\"ops\" id=\"icf12\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>es un país en el que las personas tienen aquellos derechos que se han ganado con su correcta conducta ciudadana.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>es un país muy conflictivo y se requiere mano dura para combatir el desorden.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>es un Estado presidencialista y el presidente puede gobernar como le parezca.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>es un Estado Social de Derecho y los derechos humanos son inherentes a la condición de persona.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf12\" data-k=\"D\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas reales del ICFES, con casos que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Quién dice qué, y desde dónde?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la D.", "⚑ Pendiente: confirmar fuente (ASED). Esta pregunta sale del compilado ASED, que dice haber concebido sus preguntas: no es de un cuadernillo del ICFES. Nelson decide si se reemplaza; mientras tanto, no la presentes como «del ICFES».", "Toda la pregunta está en el paréntesis. Limitar es reducir el alcance de un derecho por un tiempo y con control judicial; suspender es dejarlo sin efecto. La Constitución de 1991 permite lo primero y prohíbe lo segundo, y esa frontera es lo que el constituyente aprendió del estado de sitio permanente anterior.", "Vale la pena decirlo completo: durante la conmoción interior el decreto va a la Corte Constitucional, tiene plazo máximo y hay derechos que no se tocan nunca (vida, integridad personal, no desaparición, debido proceso).", "Dos opciones describen a Colombia como un país («muy conflictivo», «presidencialista»), no como un Estado. La pregunta es qué dice la Constitución que es Colombia."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta oficial ICFES · Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 3<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Los plebiscitos antes y después de 1991<\/h3><p>Antes de la promulgación de nuestra actual constitución (1991), la realización de plebiscitos era escasa porque, al no estar contemplado en la anterior constitución (1886), se requería de complicadas reformas para poder realizarlos.<\/p><\/div><div><p class=\"enun\">Este cambio en los dos tipos de democracia propuestos por estas dos constituciones (la de 1886 y la de 1991) puede interpretarse como el cambio entre<\/p><div class=\"ops\" id=\"icf13\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>una democracia participativa a una democracia representativa.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>una democracia representativa a una democracia participativa.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>una democracia restringida a una democracia total.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>una democracia presidencialista a una democracia parlamentaria.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf13\" data-k=\"B\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas reales del ICFES, con casos que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Quién dice qué, y desde dónde?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la B.", "⚑ Pendiente: confirmar fuente (ASED). Esta pregunta sale del compilado ASED, que dice haber concebido sus preguntas: no es de un cuadernillo del ICFES. Nelson decide si se reemplaza; mientras tanto, no la presentes como «del ICFES».", "El enunciado trae la causa dicha con todas las letras: no estaba contemplado. La pregunta solo pide nombrar qué clase de democracia inaugura entonces 1991.", "Democracia representativa: el ciudadano elige a quien decide. Democracia participativa: el ciudadano también decide directamente, por plebiscito, referendo, consulta popular, cabildo abierto, revocatoria del mandato. 1991 no reemplaza la primera: le suma la segunda.", "La A y la B traen las mismas dos palabras en orden contrario: es la trampa del orden. Que el estudiante diga en voz alta cuál era antes y cuál después."]}}, {"m": 4, "html": "<div class=\"eyebrow\"><span class=\"membrete\">Pregunta oficial ICFES · Saber 11<\/span><span class=\"min\" style=\"--accent:var(--m5)\">Evaluación individual · pregunta 4<\/span><\/div><div class=\"grid c2 icfes mt\"><div class=\"texto\"><h3>Quién ejerce control político<\/h3><p>El enunciado, resumido:<\/p><p>Una de estas ramas cuenta con dos mecanismos: la citación a un debate de control político […] y la moción de censura, un mecanismo a través del cual se reprocha la actuación de uno o varios ministros, dando lugar a la separación de su cargo.<\/p><\/div><div><p class=\"enun\">De acuerdo con la Constitución política de Colombia, ¿cuál de las ramas del poder puede ejercer control político a través de citaciones y mociones de censura?<\/p><div class=\"ops\" id=\"icf14\"><div class=\"op\" data-op=\"A\"><span class=\"L\">A<\/span><span>La Rama Electoral.<\/span><\/div><div class=\"op\" data-op=\"B\"><span class=\"L\">B<\/span><span>La Rama Ejecutiva.<\/span><\/div><div class=\"op\" data-op=\"C\"><span class=\"L\">C<\/span><span>La Rama Judicial.<\/span><\/div><div class=\"op\" data-op=\"D\"><span class=\"L\">D<\/span><span>La Rama Legislativa.<\/span><\/div><\/div><div class=\"ctl\"><button class=\"btn\" data-clave=\"icf14\" data-k=\"D\">Revelar la clave<\/button><\/div><\/div><\/div>", "guia": {"obj": "Que el estudiante transfiera por sí solo la estrategia a preguntas reales del ICFES, con casos que no trabajó en clase.", "decir": ["Durante la evaluación no se proyecta nada: las preguntas están en el cuaderno. Esta diapositiva es para el cierre, cuando se socializan las falladas.", "«¿Qué escribiste en el instrumento antes de mirar las opciones? ¿Quién dice qué, y desde dónde?»"], "como": "Este momento es silencioso y en filas individuales. Es el que produce el dato de seguimiento. Si un estudiante marca sin llenar el instrumento, se le anota, no se le corrige.", "apoyo": ["La clave es la D.", "⚑ Pendiente: confirmar fuente (ASED). Esta pregunta sale del compilado ASED, que dice haber concebido sus preguntas: no es de un cuadernillo del ICFES. Nelson decide si se reemplaza; mientras tanto, no la presentes como «del ICFES».", "Las dos palabras que delatan la respuesta son debate y moción: las dos son vocabulario de un cuerpo colegiado que delibera y vota. Un juez no debate; un ministro no se censura a sí mismo.", "Conviene dejar el reparto completo en el tablero, porque reaparece en toda el área: legislativo hace las leyes y controla al gobierno; ejecutivo gobierna y administra; judicial resuelve conflictos y juzga.", "La «Rama Electoral» no existe: la organización electoral es un órgano autónomo, pero las ramas del poder público son tres (artículo 113).", "Nota de auditoría: tener la referencia al cuadernillo 2018 no es haberlo verificado. Queda anotada para cruzarla cuando se consiga el cuadernillo liberado."]}}, {"m": 5, "html": "<div class=\"eyebrow\"><span class=\"min\" style=\"--accent:var(--m6)\">Cierre<\/span><span class=\"kicker\">La pregunta de siempre<\/span><\/div><h2>¿En qué se parecía la pregunta del ICFES a la de tu libro?<\/h2><div class=\"grid c2 mt\"><div class=\"grid\" style=\"gap:10px\"><div class=\"step\" style=\"--accent:#242478\"><div class=\"k\">1<\/div><div><b>Quién dice qué y por qué<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#30843C\"><div class=\"k\">2<\/div><div><b>El principio que hay detrás<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#C9821B\"><div class=\"k\">3<\/div><div><b>Si pasa esto, qué pasa después<\/b><\/div><\/div><div class=\"step\" style=\"--accent:#5B3E96\"><div class=\"k\">4<\/div><div><b>Lo de antes explica lo de ahora<\/b><\/div><\/div><\/div><div class=\"card big edge\" style=\"--accent:var(--m6)\"><h3>Antes de salir<\/h3><ol class=\"pasos\"><li>El concepto del día —un derecho, un mecanismo o un principio—, en «Palabras que me frenaron», con tus palabras.<\/li><li>«Lo que me llevo de esta pregunta».<\/li><li>Tu carita de salida.<\/li><li>La casilla 1 de la portada del área.<\/li><\/ol><\/div><\/div>", "guia": {"obj": "Que el estudiante nombre la estrategia que usó y se lleve un concepto del día —un derecho, un mecanismo o un principio— escrito en sus propias palabras.", "decir": ["Socializa solo las preguntas que el grupo falló, pidiendo el actor o el principio que las resuelve.", "Pide que lean en voz alta su salvavidas: lo mínimo que sí tenían claro.", "Cada uno escribe el concepto del día en la franja «Palabras que me frenaron» de su hoja."], "como": "No dicta la definición. El concepto se escribe como el estudiante lo entendió; si quedó mal entendido, eso se ve en la hoja y se corrige la próxima clase.", "apoyo": ["La palabra nueva no se dicta. Si quedó mal entendida, eso se ve en la hoja y se corrige la próxima clase: es mejor que dictarla bien.", "Para el cierre del momento: La estrategia 3 —si pasa esto, qué pasa después— no tiene pregunta oficial en el entrenamiento: se entrena solo en el taller, en las preguntas 3, 6 y 9. Dale ahí el tiempo que el ICFES no le da."]}}];
var MOM = [{"n": 1, "nom": "Activación", "min": 15, "c": "--m1"}, {"n": 2, "nom": "Pregunta problematizadora", "min": 20, "c": "--m2"}, {"n": 3, "nom": "Desarrollo guiado", "min": 35, "c": "--m3"}, {"n": 4, "nom": "Reto en equipo", "min": 20, "c": "--m4"}, {"n": 5, "nom": "Evaluación individual", "min": 20, "c": "--m5"}, {"n": 6, "nom": "Cierre", "min": 10, "c": "--m6"}];
var NOMBRE = document.getElementById("momnom").textContent, SUB = document.getElementById("momsub").textContent;
var $ = function(s){ return document.querySelector(s); };
var wrap = $("#wrap"), stage = $("#stage"), i = 0;
var tBase = 0, tLeft = 0, tOn = false, tick = null;
var elegidas = [];
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function paintClock(){
  var n = $("#tnum");
  if(!tBase){ n.textContent = "—"; n.classList.remove("over"); return; }
  var s = Math.abs(tLeft), mm = Math.floor(s/60), ss = s%60;
  n.textContent = (tLeft<0?"+":"") + mm + ":" + (ss<10?"0":"") + ss;
  n.classList.toggle("over", tLeft<0);
}
function setTimer(min){
  tBase = min||0; tLeft = tBase*60; tOn = false;
  if(tick){ clearInterval(tick); tick = null; }
  $("#play").textContent = "Iniciar"; paintClock();
}
function toggleTimer(){
  if(!tBase) return;
  tOn = !tOn; $("#play").textContent = tOn ? "Pausar" : "Seguir";
  if(tick){ clearInterval(tick); tick = null; }
  if(tOn) tick = setInterval(function(){ tLeft--; paintClock(); }, 1000);
  paintClock();
}
function guiaHTML(g){
  if(!g) return '<p class="sub">Sin notas para esta diapositiva.</p>';
  var h = '<div class="gbox"><h4>Objetivo</h4><p>'+esc(g.obj)+'</p></div>';
  if(g.decir && g.decir.length) h += '<div class="gbox"><h4>Qué haces y qué dices</h4><ul>'+
     g.decir.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  if(g.como) h += '<div class="gbox como"><h4>Lo que no haces</h4><p>'+esc(g.como)+'</p></div>';
  if(g.apoyo && g.apoyo.length) h += '<div class="gbox apoyo"><h4>Si Sociales no es tu fuerte</h4><ul>'+
     g.apoyo.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  return h;
}
function pintaElegidas(){
  var box = document.getElementById("elegidas"); if(!box) return;
  if(!elegidas.length){ box.innerHTML = '<p class="sub">Vuelve a la diapositiva anterior y escoge las cinco.</p>'; return; }
  box.innerHTML = elegidas.map(function(t,k){
    return '<div class="card edge" style="--accent:var(--m'+((k%6)+1)+')"><h3>'+(k+1)+'. '+esc(t)+'</h3>'+
      '<p class="sub">Busca esta pregunta en tu simulacro y en la hoja de taller de la misma estrategia.</p></div>';
  }).join("");
}
function go(n){
  var prev = SC[i];
  i = Math.max(0, Math.min(SC.length-1, n));
  var s = SC[i];
  wrap.innerHTML = s.html;
  wrap.classList.remove("enter"); void wrap.offsetWidth; wrap.classList.add("enter");
  stage.scrollTop = 0;
  var m = s.m!=null ? MOM[s.m] : null;
  $("#momdot").style.background = m ? "var("+m.c+")" : "var(--faint)";
  $("#momdot").textContent = m ? m.n : "·";
  $("#momnom").textContent = m ? m.nom : NOMBRE;
  $("#momsub").textContent = m ? (m.min+" minutos") : SUB;
  var want = s.min!=null ? s.min : (m ? m.min : 0);
  var cambio = !prev || prev===s || prev.m!==s.m || (prev.min||null)!==(s.min||null);
  if(cambio) setTimer(want);
  $("#count").textContent = (i+1)+" / "+SC.length;
  $("#prog i").style.width = (SC.length>1 ? i/(SC.length-1)*100 : 100)+"%";
  $("#guiabody").innerHTML = guiaHTML(s.guia);
  [].forEach.call(wrap.querySelectorAll("[data-pick]"), function(b){
    b.setAttribute("aria-pressed", elegidas.indexOf(b.textContent)>=0 ? "true" : "false"); });
  pintaElegidas();
}
wrap.addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  if(b.dataset.show){ var t = document.getElementById(b.dataset.show); if(t) t.hidden = !t.hidden; }
  if(b.dataset.showgrupo){
    var g = wrap.querySelectorAll('[data-grupo="'+b.dataset.showgrupo+'"]'), abrir = g.length && g[0].hidden;
    [].forEach.call(g, function(x){ x.hidden = !abrir; });
    b.textContent = abrir ? "Ocultar las claves" : "Revelar las claves";
  }
  if(b.dataset.clave){
    var box = document.getElementById(b.dataset.clave), ok = box.querySelector('[data-op="'+b.dataset.k+'"]');
    var on = ok && !ok.classList.contains("ok");
    [].forEach.call(box.querySelectorAll(".op"), function(o){ o.classList.remove("ok"); });
    if(on) ok.classList.add("ok");
    b.textContent = on ? "Ocultar la clave" : "Revelar la clave";
  }
  if(b.dataset.tally){ var n = document.getElementById(b.dataset.tally); n.textContent = (+n.textContent||0)+1; }
  if(b.dataset.reset){ [].forEach.call(wrap.querySelectorAll('[id^="'+b.dataset.reset+'"]'), function(x){
    if(x.classList.contains("n")) x.textContent = "0"; }); }
  if(b.dataset.pick!=null){
    var t = b.textContent, k = elegidas.indexOf(t);
    if(k>=0) elegidas.splice(k,1); else if(elegidas.length<5) elegidas.push(t);
    b.setAttribute("aria-pressed", elegidas.indexOf(t)>=0 ? "true" : "false");
  }
});
function setGuia(on){ $("#guia").classList.toggle("open", on); $("#scrim").classList.toggle("on", on);
  $("#gbtn").setAttribute("aria-pressed", on ? "true" : "false"); }
$("#next").addEventListener("click", function(){ go(i+1); });
$("#prev").addEventListener("click", function(){ go(i-1); });
$("#play").addEventListener("click", toggleTimer);
$("#reset").addEventListener("click", function(){ setTimer(tBase); });
$("#gbtn").addEventListener("click", function(){ setGuia(!$("#guia").classList.contains("open")); });
$("#gclose").addEventListener("click", function(){ setGuia(false); });
$("#scrim").addEventListener("click", function(){ setGuia(false); });
document.addEventListener("keydown", function(e){
  var t = e.target.tagName; if(t==="INPUT"||t==="TEXTAREA") return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ go(i+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ go(i-1); e.preventDefault(); }
  else if(e.key==="Home"){ go(0); e.preventDefault(); }
  else if(e.key==="End"){ go(SC.length-1); e.preventDefault(); }
  else if(e.key==="g"||e.key==="G"){ setGuia(!$("#guia").classList.contains("open")); }
  else if(e.key==="t"||e.key==="T"){ toggleTimer(); }
  else if(e.key==="Escape"){ setGuia(false); }
});
go(0);
})();
</script>
