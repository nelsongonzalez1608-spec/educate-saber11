<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;background:#fafafa;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Misión 1 · Clase viva</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --text:"Source Sans 3","Segoe UI",system-ui,sans-serif;

  /* marca EduCaTe */
  --azul:#242478; --rojo:#A82424; --verde:#30843C; --oro:#C9821B; --morado:#6B4FBE;

  /* momentos */
  --m1:#242478; --m2:#A82424; --m3:#3B3BA6; --m4:#6B4FBE; --m5:#C9821B; --m6:#30843C;

  /* superficie */
  --bg:#F5F7FB; --surface:#FFFFFF; --surface-2:#EDF1F8; --sunk:#E4EAF4;
  --fg:#121829; --muted:#5B6479; --faint:#8C96AC; --line:#D7DEEB;
  --ok:#1E7A4C; --ok-bg:#E6F5EC; --no:#B03030; --no-bg:#FCEBEB;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.07);
  --ring:0 0 0 3px rgba(36,36,120,.22);
  --on-accent:#FFFFFF;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --azul:#8E9BF5; --rojo:#F08A8C; --verde:#5FD28D; --oro:#E8B65F; --morado:#A992F0;
  --m1:#8E9BF5; --m2:#F08A8C; --m3:#9AA6F7; --m4:#A992F0; --m5:#E8B65F; --m6:#5FD28D;
  --bg:#0E1220; --surface:#171D30; --surface-2:#1E2539; --sunk:#232B42;
  --fg:#EDF1FA; --muted:#A3ADC4; --faint:#7E8AA4; --line:#2E3752;
  --ok:#58D08F; --ok-bg:#15301F; --no:#F08A8C; --no-bg:#331718;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.40);
  --ring:0 0 0 3px rgba(142,155,245,.35);
  --on-accent:#0E1220;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --azul:#8E9BF5; --rojo:#F08A8C; --verde:#5FD28D; --oro:#E8B65F; --morado:#A992F0;
  --m1:#8E9BF5; --m2:#F08A8C; --m3:#9AA6F7; --m4:#A992F0; --m5:#E8B65F; --m6:#5FD28D;
  --bg:#0E1220; --surface:#171D30; --surface-2:#1E2539; --sunk:#232B42;
  --fg:#EDF1FA; --muted:#A3ADC4; --faint:#7E8AA4; --line:#2E3752;
  --ok:#58D08F; --ok-bg:#15301F; --no:#F08A8C; --no-bg:#331718;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.40);
  --ring:0 0 0 3px rgba(142,155,245,.35);
  --on-accent:#0E1220;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--text);
     font-size:clamp(16px,1.26vw,23px);line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(30px,4.4vw,64px);font-weight:800;line-height:1.04}
h2{font-size:clamp(24px,3.1vw,46px);font-weight:700;line-height:1.08}
h3{font-size:clamp(16px,1.42vw,23px);font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:10px}

/* ───── armazón ───── */
#app{height:100%;display:flex;flex-direction:column;min-height:0}
#top{display:flex;align-items:center;gap:clamp(8px,1.1vw,16px);
     padding:10px clamp(14px,2vw,26px);border-bottom:1.5px solid var(--line);
     background:var(--surface);flex:0 0 auto}
#stage{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
       padding:clamp(18px,2.6vw,42px) clamp(16px,3vw,52px) clamp(22px,3vw,46px);
       display:grid;align-content:safe center}
#wrap{max-width:1320px;margin:0 auto;width:100%;min-width:0}
#bot{display:flex;align-items:center;gap:clamp(8px,1.1vw,14px);flex-wrap:wrap;
     padding:9px clamp(14px,2vw,26px);border-top:1.5px solid var(--line);
     background:var(--surface);flex:0 0 auto}

.logo{display:inline-flex;align-items:center;background:#fff;border-radius:9px;
      padding:5px 9px;line-height:0;flex:0 0 auto}
.logo img{height:clamp(22px,2vw,30px);width:auto;display:block}
.logo-xl{display:inline-flex;align-items:center;background:#fff;border-radius:16px;
      padding:12px 20px;line-height:0;box-shadow:var(--shadow)}
.logo-xl img{height:clamp(46px,5.6vw,80px);width:auto;display:block}

#mom{display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 auto}
#momdot{width:clamp(26px,2.3vw,34px);height:clamp(26px,2.3vw,34px);border-radius:50%;
        display:grid;place-items:center;color:var(--on-accent);font-family:var(--display);
        font-weight:800;font-size:.82em;flex:0 0 auto;background:var(--faint)}
#momnom{font-family:var(--display);font-weight:700;font-size:clamp(14px,1.25vw,20px);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#momsub{color:var(--muted);font-size:.84em;white-space:nowrap}

.btn{border:1.6px solid var(--line);background:var(--surface);border-radius:10px;
     padding:7px 13px;font-weight:600;font-size:.92em;transition:.15s}
.btn:hover{border-color:var(--azul);color:var(--azul)}
.btn.solid{background:var(--azul);border-color:var(--azul);color:var(--on-accent)}
.btn.solid:hover{color:var(--on-accent);filter:brightness(1.08)}
.btn[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:var(--on-accent)}

#clock{display:flex;align-items:center;gap:8px;flex:0 0 auto}
#tnum{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;
      font-size:clamp(20px,2.2vw,34px);min-width:4.4ch;text-align:center;letter-spacing:-.02em}
#tnum.run{color:var(--verde)} #tnum.low{color:var(--oro)} #tnum.over{color:var(--rojo)}

#prog{flex:1 1 120px;height:7px;background:var(--sunk);border-radius:99px;overflow:hidden;min-width:80px}
#prog i{display:block;height:100%;background:var(--azul);border-radius:99px;transition:width .3s}
#count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.86em;flex:0 0 auto}
#hint{color:var(--faint);font-size:.8em;flex:0 0 auto}

/* ───── guía del profe ───── */
#guia{position:fixed;top:0;right:0;height:100%;width:min(430px,92vw);z-index:40;
      background:var(--surface);border-left:1.5px solid var(--line);
      box-shadow:-14px 0 40px rgba(16,24,40,.16);transform:translateX(101%);
      transition:transform .26s ease;display:flex;flex-direction:column;
      padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#guia.open{transform:none}
#guiahead{display:flex;align-items:center;gap:10px;padding:14px 18px;
          border-bottom:1.5px solid var(--line);flex:0 0 auto}
#guiabody{flex:1 1 auto;overflow-y:auto;padding:16px 18px 30px;display:grid;gap:14px;align-content:start}
#scrim{position:fixed;inset:0;background:rgba(10,14,28,.34);z-index:39;opacity:0;
       pointer-events:none;transition:opacity .26s}
#scrim.on{opacity:1;pointer-events:auto}
.gbox{border:1.5px solid var(--line);border-radius:13px;padding:13px 15px;background:var(--surface-2)}
.gbox h4{margin:0 0 7px;font-family:var(--display);font-size:.78em;letter-spacing:.09em;
         text-transform:uppercase;color:var(--azul)}
.gbox.apoyo{background:#FFF8EA;border-color:#EBD6A8}
.gbox.apoyo h4{color:#8A5A0B}
:root[data-theme="dark"] .gbox.apoyo{background:#2A2213;border-color:#4A3C1B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gbox.apoyo{background:#2A2213;border-color:#4A3C1B}}
.gbox ul{margin:0;padding-left:18px;display:grid;gap:7px;font-size:.93em}
.gbox p{font-size:.93em}
.say{font-style:italic;color:var(--fg);border-left:3px solid var(--azul);padding-left:11px}

/* ───── piezas de escena ───── */
.enter{animation:rise .4s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-family:var(--display);font-weight:700;font-size:.74em;letter-spacing:.1em;
     text-transform:uppercase;background:var(--accent,var(--azul));color:var(--on-accent);
     padding:5px 12px;border-radius:99px}
.min{font-family:var(--display);font-weight:700;font-size:.76em;border:1.6px solid var(--accent,var(--azul));
     color:var(--accent,var(--azul));padding:3px 10px;border-radius:99px}
.kicker{color:var(--muted);font-size:.88em}
.lead{font-size:clamp(16px,1.42vw,23px);color:var(--muted);max-width:68ch;margin-top:12px}
.big{font-size:clamp(20px,2.1vw,32px);font-family:var(--display);font-weight:600;line-height:1.3}

.grid{display:grid;gap:clamp(12px,1.4vw,20px)}
.c2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.c4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;
      padding:clamp(14px,1.5vw,22px);min-width:0;box-shadow:var(--shadow)}
.card.edge{border-left:6px solid var(--accent,var(--azul))}
.card h3{color:var(--accent,var(--fg));margin-bottom:8px}
.sub{color:var(--muted);font-size:.92em}
.note{background:var(--surface-2);border-left:4px solid var(--accent,var(--azul));
      border-radius:0 12px 12px 0;padding:11px 15px;font-size:.94em}
ul.ticks{margin:0;padding:0;list-style:none;display:grid;gap:9px}
ul.ticks li{display:flex;gap:10px;align-items:flex-start}
ul.ticks li::before{content:"";flex:0 0 auto;width:9px;height:9px;border-radius:50%;
     background:var(--accent,var(--azul));margin-top:.52em}

/* barra de momentos */
.bar{display:flex;gap:3px;height:16px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.bar span{display:block;transition:opacity .2s}
.agenda{display:grid;gap:9px}
.arow{display:grid;grid-template-columns:36px 1fr auto;gap:13px;align-items:center;
      background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:10px 14px}
.arow.now{border-color:var(--accent);box-shadow:var(--shadow)}
.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--on-accent);
     font-family:var(--display);font-weight:800}

/* pasos */
.step{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;
      background:var(--surface);border:1.5px solid var(--line);border-radius:14px;
      padding:13px 16px;opacity:.26;transition:.3s}
.step.on{opacity:1;border-color:var(--accent,var(--azul));box-shadow:var(--shadow)}
.step .k{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
     background:var(--accent,var(--azul));color:var(--on-accent);font-family:var(--display);font-weight:800}
.step b{font-family:var(--display);font-size:1.06em}
.step .d{color:var(--muted);font-size:.95em}

/* tabla que se revela */
.reveal{display:grid;gap:7px;grid-template-columns:repeat(7,minmax(0,1fr))}
.rv{border:1.8px solid var(--line);border-radius:12px;background:var(--surface);
    padding:12px 4px;text-align:center;transition:.25s;font-variant-numeric:tabular-nums}
.rv .h{font-size:.78em;color:var(--muted);font-weight:600}
.rv .v{font-family:var(--display);font-weight:800;font-size:clamp(20px,2.2vw,34px);
       color:var(--faint);transition:.25s}
.rv.on{border-color:var(--m1);background:var(--surface-2)}
.rv.on .v{color:var(--m1)}
.rv.peak.on{border-color:var(--rojo)} .rv.peak.on .v{color:var(--rojo)}

/* tablero de hipótesis */
.tally{display:grid;gap:10px}
.trow{display:grid;grid-template-columns:44px 1fr 46px auto;gap:12px;align-items:center}
.tk{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
    background:var(--surface-2);border:1.8px solid var(--line);
    font-family:var(--display);font-weight:800;font-size:1.15em}
.tbar{height:26px;background:var(--sunk);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;width:0;border-radius:99px;background:var(--m2);
        transition:width .45s cubic-bezier(.2,.7,.3,1)}
.tn{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.tpm{display:flex;gap:5px}
.tpm button{width:34px;height:34px;border-radius:9px;border:1.6px solid var(--line);
     background:var(--surface);font-family:var(--display);font-weight:800;line-height:1}
.tpm button:hover{border-color:var(--m2);color:var(--m2)}

/* opciones ICFES */
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;text-align:left;
     width:100%;border:1.8px solid var(--line);border-radius:14px;background:var(--surface);
     padding:13px 16px;transition:.2s}
.opt:hover{border-color:var(--azul)}
.opt .k{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
     background:var(--surface-2);font-family:var(--display);font-weight:800;flex:0 0 auto}
.opt .why{display:none;margin-top:8px;font-size:.92em}
.opt.shown .why{display:block}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.good .k{background:var(--ok);color:var(--on-accent)}
.opt.good .why{color:var(--ok)}
.opt.bad{border-color:var(--no);background:var(--no-bg);opacity:.9}
.opt.bad .k{background:var(--no);color:var(--on-accent)}
.opt.bad .why{color:var(--no)}
.membrete{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);
     font-weight:700;font-size:.78em;letter-spacing:.05em;background:var(--surface-2);
     border:1.5px solid var(--line);border-radius:99px;padding:5px 13px;color:var(--muted)}
.figure{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;
        display:grid;place-items:center}
.figure img{max-width:100%;height:auto;display:block;border-radius:8px}

/* controles de interactivo */
.ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.ctl label{font-size:.88em;color:var(--muted);font-weight:600}
input[type=range]{accent-color:var(--accent,var(--azul));width:min(340px,58vw);height:26px}
.vread{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;
       font-size:clamp(18px,1.9vw,28px);color:var(--accent,var(--azul))}
.race{display:grid;gap:12px}
.rline{display:grid;grid-template-columns:clamp(96px,13vw,170px) 1fr auto;gap:12px;align-items:center}
.rbar{height:clamp(26px,2.6vw,38px);background:var(--sunk);border-radius:10px;overflow:hidden}
.rbar i{display:block;height:100%;width:0;border-radius:10px;transition:width .35s cubic-bezier(.2,.7,.3,1)}
.rnum{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;
      font-size:clamp(14px,1.3vw,21px);min-width:9ch;text-align:right}

/* cazador verdadero/falso */
.hunt{display:grid;gap:14px}
.huntbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.huntbar .n{font-family:var(--display);font-weight:800;color:var(--m5);
     font-variant-numeric:tabular-nums}
.claim[hidden]{display:none}
.claim{background:var(--surface);border:1.8px solid var(--line);border-radius:16px;padding:16px 18px}
.claim .q{font-size:clamp(17px,1.6vw,26px);font-family:var(--display);font-weight:600;line-height:1.3}
.vf{display:flex;gap:10px;margin-top:13px;flex-wrap:wrap}
.vf button{border:1.8px solid var(--line);border-radius:12px;padding:9px 20px;
     font-family:var(--display);font-weight:700;background:var(--surface);transition:.18s}
.vf button:hover{border-color:var(--azul)}
.vf button.hit{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.vf button.miss{background:var(--no);border-color:var(--no);color:var(--on-accent)}
.verdict{display:none;margin-top:13px;border-left:4px solid var(--m4);background:var(--surface-2);
         border-radius:0 12px 12px 0;padding:11px 15px;font-size:.95em}
.verdict.on{display:block;animation:rise .3s both}

/* escalera de niveles */
.stair{display:grid;gap:9px}
.srow{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.schip{height:clamp(34px,3vw,46px);border-radius:11px;display:grid;place-items:center;
       color:#fff;font-family:var(--display);font-weight:800;padding:0 16px;white-space:nowrap}

/* tarjetas de reto */
.tcard{background:var(--surface);border:1.8px dashed var(--m4);border-radius:14px;padding:13px 15px}
.tcard .nums{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;
     font-size:clamp(15px,1.4vw,22px);letter-spacing:.02em;margin-top:6px;color:var(--m4)}

svg.chart{width:100%;height:auto;display:block;touch-action:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.88em;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:16px;height:4px;border-radius:2px;display:block}

/* pregunta del libro */
.slot{border:2.5px dashed var(--line);border-radius:16px;background:var(--surface-2);
      padding:clamp(18px,2.2vw,30px);display:grid;gap:8px;place-content:center;
      text-align:center;min-height:clamp(150px,18vw,230px)}
.slot b{font-family:var(--display);font-size:clamp(17px,1.6vw,25px);color:var(--fg)}
.slot span{color:var(--muted);font-size:.92em;max-width:46ch;margin:0 auto}
.keychip{display:grid;place-items:center;width:clamp(38px,3.4vw,52px);height:clamp(38px,3.4vw,52px);
      border-radius:13px;color:var(--on-accent);font-family:var(--display);font-weight:800;
      font-size:clamp(19px,1.8vw,27px)}
.worknote{margin-top:10px;font-family:var(--display);font-weight:600;color:var(--muted);
      font-variant-numeric:tabular-nums;font-size:.96em;line-height:1.7}
.card[hidden]{display:none}

@media (max-width:620px){
  .reveal{grid-template-columns:repeat(4,minmax(0,1fr))}
  #hint{display:none}
  .trow{grid-template-columns:38px 1fr 40px auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function lineChart(id, xs, ys, opt){
  opt = opt || {};
  var W = 760, H = 360, PL = 62, PR = 26, PT = 24, PB = 54;
  var lo = opt.lo != null ? opt.lo : 0, hi = opt.hi != null ? opt.hi : 12;
  var px = function(i){ return PL + i*(W-PL-PR)/(xs.length-1); };
  var py = function(v){ return H-PB - (v-lo)*(H-PT-PB)/(hi-lo); };
  var g = [];
  for(var t=lo;t<=hi;t+=opt.tick||2){
    g.push('<line x1="'+PL+'" y1="'+py(t)+'" x2="'+(W-PR)+'" y2="'+py(t)+
           '" stroke="var(--line)" stroke-width="1"/>');
    g.push('<text x="'+(PL-12)+'" y="'+(py(t)+5)+'" text-anchor="end" font-size="15" fill="var(--muted)">'+t+'</text>');
  }
  xs.forEach(function(x,i){
    g.push('<text x="'+px(i)+'" y="'+(H-PB+26)+'" text-anchor="middle" font-size="15" fill="var(--muted)">'+esc(x)+'</text>');
  });
  g.push('<text x="16" y="'+(H/2)+'" font-size="14" fill="var(--muted)" transform="rotate(-90 16 '+(H/2)+')" text-anchor="middle">'+esc(opt.ylab||"")+'</text>');
  g.push('<text x="'+((PL+W-PR)/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="14" fill="var(--muted)">'+esc(opt.xlab||"")+'</text>');
  return {W:W,H:H,px:px,py:py,grid:g.join("")};
}

function libroQ(q){
  var C = ["--m1","--m1","--m3","--m3","--m6","--m6","--m6","--m6","--m5","--m5"][q.n-1];
  var EST = ["Leer el cambio","La razón constante","El crecimiento que se acumula","Juzgar la afirmación"][q.est-1];
  scene({m:2, html:
    '<div class="eyebrow"><span class="membrete">Libro · Misión 1 · Prueba de campo · pregunta '+q.n+'</span>'+
    '<span class="min" style="--accent:var('+C+')">Estrategia '+q.est+' · '+esc(EST)+'</span>'+
    '<span class="kicker">'+esc(q.bloque)+' · '+esc(q.ctx)+'</span></div>'+
    '<div class="grid" style="margin-top:14px;grid-template-columns:minmax(300px,1.05fr) minmax(320px,1fr);'+
    'gap:clamp(12px,1.4vw,20px)">'+
     '<div><div class="slot" id="sl'+q.n+'">'+
       '<b>Pregunta '+q.n+' del taller</b>'+
       '<span>Ábranla en el libro. El enunciado y su figura entran aquí cuando carguemos el PDF de la Misión 1.</span>'+
      '</div>'+
      '<div class="card" style="--accent:var('+C+');margin-top:14px"><h3 style="--accent:var('+C+')">Piensa en esto</h3>'+
      '<ul class="ticks" style="--accent:var('+C+')">'+
      q.piensa.map(function(t){ return '<li>'+esc(t)+'</li>'; }).join("")+'</ul></div></div>'+
     '<div><h3 style="color:var('+C+');margin-bottom:10px">Paso a paso · antes de marcar</h3>'+
      '<div class="grid" style="gap:9px" id="lp'+q.n+'">'+
      q.pasos.map(function(t,i){ return '<div class="step" style="--accent:var('+C+')">'+
        '<div class="k">'+(i+1)+'</div><div><b style="font-weight:400;font-family:var(--text)">'+
        esc(t)+'</b></div></div>'; }).join("")+'</div>'+
      '<div class="ctl"><button class="btn solid" id="ln'+q.n+'">Siguiente paso</button>'+
      '<button class="btn" id="lk'+q.n+'">Revelar la clave</button>'+
      '<button class="btn" id="lr'+q.n+'">Ocultar</button></div>'+
      '<div class="card" id="lc'+q.n+'" hidden style="--accent:var('+C+');margin-top:14px;'+
      'border-left:6px solid var('+C+')">'+
       '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
        '<span class="keychip" style="background:var('+C+')">'+esc(q.resp)+'</span>'+
        '<b style="font-family:var(--display)">'+esc(q.nota || "es la respuesta correcta")+'</b></div>'+
       '<div class="worknote">'+q.grid.map(esc).join(" &nbsp;·&nbsp; ")+'</div>'+
       '<div class="note" style="--accent:var('+C+');margin-top:12px"><b>Salvavidas:</b> con lo mínimo '+
       'que sí sabías — '+esc(q.sv[0])+' — llegabas a <b>'+esc(q.sv[1])+'</b>, y descartabas '+esc(q.sv[2])+'.</div>'+
      '</div></div></div>',
    init:function(w){
      var k=0, st=$$("#lp"+q.n+" .step",w);
      function dr(){ st.forEach(function(s,i){ s.classList.toggle("on", i<k); }); }
      $("#ln"+q.n,w).addEventListener("click",function(){ k=Math.min(st.length,k+1); dr(); });
      $("#lr"+q.n,w).addEventListener("click",function(){ k=0; dr(); $("#lc"+q.n,w).hidden=true; });
      $("#lk"+q.n,w).addEventListener("click",function(){ k=st.length; dr(); $("#lc"+q.n,w).hidden=false; });
      dr();
    },
    guia:{obj:"Que el estudiante deje registro escrito de su razonamiento antes de marcar la pregunta "+q.n+".",
      decir:["«Antes de marcar: ¿llenaron «Piensa en esto» y el paso a paso?»"],
      apoyo:["No reveles la clave hasta que hayan escrito. El botón está ahí para el cierre del bloque, no para el principio.",
             "La respuesta correcta es la "+q.resp+". Si te la preguntan antes de tiempo, di que la revisamos al cerrar el bloque.",
             "Si un estudiante se traba, pregúntale en cuál de los tres pasos se quedó. No le des la respuesta."]}});
}

       .map(function(p,i){ return '<div class="step" style="--accent:var(--m1)">'+
         '<div class="k">'+(i+1)+'</div><div><b>'+esc(p[0])+'</b><div class="d">'+esc(p[1])+'</div></div></div>'; }).join("")+

        '<polyline points="'+TEMPS.map(function(v,i){ return ch.px(i)+","+ch.py(v); }).join(" ")+
        '" fill="none" stroke="var(--m1)" stroke-width="4" stroke-linejoin="round"/>'+
        '<g id="trpts"></g></svg>'+
      '<div class="note" style="--accent:var(--m1);margin-top:12px" id="trmsg">'+

    init:function(w){
      var k=0, st=$$("#e1s .step",w);

      $("#e1n",w).addEventListener("click",function(){ k=Math.min(3,k+1); dr(); });

      dr();

      var g=$("#trpts",w), sel=$("#trsel",w), msg=$("#trmsg",w), NS="http://www.w3.org/2000/svg", a=-1,b=-1;

        g.appendChild(c);

          b.classList.add("shown"); b.classList.add(i===o.k ? "good":"bad");
        });
        $("#cl"+o.id,w).hidden = false;
      }
      $$(".opt",box).forEach(function(b){ b.addEventListener("click",reveal); });
      $("#k"+o.id,w).addEventListener("click",reveal);
    },
    guia:o.guia});
}

/* ═════════════════════════ motor ═════════════════════════ */
var wrap=$("#wrap"), stage=$("#stage"), i=0;
var tLeft=0, tBase=0, tOn=false, tick=null;

function fmt(s){
  var neg = s<0; s = Math.abs(s);
  return (neg?"+":"")+Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);
}
function paintClock(){
  var el=$("#tnum");
  if(!tBase){ el.textContent="—"; el.className=""; return; }
  el.textContent=fmt(tLeft);
  el.className = tLeft<0 ? "over" : (tLeft<=60 ? "low" : (tOn?"run":""));
}
function setTimer(min){
  tBase = min||0; tLeft = tBase*60; tOn=false;
  if(tick){ clearInterval(tick); tick=null; }
  $("#play").textContent="Iniciar"; paintClock();
}
function toggleTimer(){
  if(!tBase) return;
  tOn=!tOn; $("#play").textContent = tOn ? "Pausar" : "Seguir";
  if(tick){ clearInterval(tick); tick=null; }
  if(tOn) tick=setInterval(function(){ tLeft--; paintClock(); },1000);
  paintClock();
}

function guiaHTML(g){
  if(!g) return '<p class="sub">Sin notas para esta diapositiva.</p>';
  var h = '<div class="gbox"><h4>Objetivo del momento</h4><p>'+esc(g.obj)+'</p></div>';
  if(g.decir && g.decir.length)
    h += '<div class="gbox"><h4>Qué haces y qué dices</h4><ul>'+
         g.decir.map(function(d){ return '<li class="say">'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  if(g.apoyo && g.apoyo.length)
    h += '<div class="gbox apoyo"><h4>Si matemáticas no es tu fuerte</h4><ul>'+
         g.apoyo.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join("")+'</ul></div>';
  return h;
}

function go(n){
  var prev = SC[i];
  i = Math.max(0, Math.min(SC.length-1, n));
  var s = SC[i];
  wrap.innerHTML = s.html;
  wrap.classList.remove("enter"); void wrap.offsetWidth; wrap.classList.add("enter");
  if(s.init) try{ s.init(wrap); }catch(e){ console.error("init",i,e); }
  stage.scrollTop = 0;

  var m = s.m!=null ? MOM[s.m] : null;
  $("#momdot").style.background = m ? "var("+m.c+")" : "var(--faint)";
  $("#momdot").textContent = m ? m.n : "·";
  $("#momnom").textContent = m ? m.nom : "Misión 1 · Matemáticas";
  $("#momsub").textContent = m ? (m.min+" minutos") : "Patrones y relaciones de cambio";

  var want = s.min != null ? s.min : (m ? m.min : 0);
  var cambio = !prev || prev.m !== s.m || (prev.min||null) !== (s.min||null);
  if(cambio) setTimer(want);

  $("#count").textContent = (i+1)+" / "+SC.length;
  $("#prog i").style.width = ((i)/(SC.length-1)*100)+"%";
  $("#guiabody").innerHTML = guiaHTML(s.guia);
}

function setGuia(on){
  $("#guia").classList.toggle("open", on);
  $("#scrim").classList.toggle("on", on);
  $("#gbtn").setAttribute("aria-pressed", on ? "true":"false");
}

$("#next").addEventListener("click", function(){ go(i+1); });
$("#prev").addEventListener("click", function(){ go(i-1); });
$("#play").addEventListener("click", toggleTimer);
$("#reset").addEventListener("click", function(){ setTimer(tBase); });
$("#gbtn").addEventListener("click", function(){ setGuia(!$("#guia").classList.contains("open")); });
$("#gclose").addEventListener("click", function(){ setGuia(false); });
$("#scrim").addEventListener("click", function(){ setGuia(false); });

document.addEventListener("keydown", function(e){
  var t = e.target.tagName;
  if(t==="INPUT"||t==="TEXTAREA") return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){ go(i+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ go(i-1); e.preventDefault(); }
  else if(e.key===" "){ go(i+1); e.preventDefault(); }
  else if(e.key==="Home"){ go(0); e.preventDefault(); }
  else if(e.key==="End"){ go(SC.length-1); e.preventDefault(); }
  else if(e.key==="g"||e.key==="G"){ setGuia(!$("#guia").classList.contains("open")); }
  else if(e.key==="t"||e.key==="T"){ toggleTimer(); }
  else if(e.key==="Escape"){ setGuia(false); }
});

go(0);
})();

</script>
